    type: bee.sessions.executor_binding
    executor_id: external
    version: stage1
  contracts:
  - contract: bee.threads.sessions:executor
    methods:
      run_turn: bee.executor.external.binding:run_turn
- name: owner_binding
  kind: contract.binding
  meta:
    type: bee.sessions.owner_binding
  contracts:
