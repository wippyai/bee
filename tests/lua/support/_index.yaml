version: '1.0'
namespace: bee.tests.support
entries:
- name: fixtures
  kind: library.lua
  source: file://fixtures.lua
  meta:
    type: test_support
  imports:
    bounds: bee.drivers.values:bounds
  modules:
  - registry
  - sql
- name: schema
  kind: library.lua
  source: file://schema.lua
  meta: {type: test_support}
  modules: [sql, funcs, registry]
- name: schema_policy
  kind: security.policy
  meta: {type: test_support, comment: A suite may run node migrations against its own database}
  policy:
    actions: [funcs.call, registry.find]
    resources: '*'
    effect: allow
- name: gateway_admit_policy
  kind: security.policy
  meta: {type: test_support, comment: A carrier admits and revokes gateway bindings for the actions it runs}
  policy:
    actions: [bee.gateway.admit]
    resources: '*'
    effect: allow
- name: gateway_manage_policy
  kind: security.policy
  meta: {type: test_support, comment: The managed host opens and drains the listener and may revoke any binding}
  policy:
    actions: [bee.gateway.manage]
    resources: [listener, bindings]
    effect: allow
- name: approval_effect
  kind: library.lua
  source: file://approval_effect.lua
  modules:
  - funcs
  imports:
    bounds: bee.drivers.values:bounds
    committed: bee.tests.support:committed
- name: approval_effect_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [cdc.stream]
    resources: ['bee:changes']
    effect: allow
- name: committed
  kind: library.lua
  source: file://committed.lua
  meta:
    type: test_support
  modules:
  - cdc
  - channel
  - time
- name: committed_test
  kind: function.lua
  source: file://committed_test.lua
  method: run
  meta:
    type: test
    suite: bee
  modules:
  - sql
  imports:
    test: wippy.test:test
    committed: bee.tests.support:committed

- name: processes
  kind: library.lua
  source: file://processes.lua
  modules: [process, system]
  meta: {type: test_support}

- name: processes_test
  kind: function.lua
  source: file://processes_test.lua
  method: run
  modules: [process]
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    processes: bee.tests.support:processes

- name: exiting_runner
  kind: process.lua
  source: file://processes_test.lua
  method: exiting_runner
  modules: [process]
  meta: {type: test_support}
  imports:
    test: wippy.test:test
    processes: bee.tests.support:processes

- name: owner_observer
  kind: library.lua
  source: file://owner_observer.lua
  modules: [process, events, system, channel, uuid]
  imports: {demand: 'bee.process:demand', processes: 'bee.tests.support:processes'}
  meta: {type: test_support}

- name: authority
  kind: library.lua
  source: file://authority.lua
  meta:
    type: test_support
  modules:
  - security
- name: controllers
  kind: library.lua
  source: file://controllers.lua
  meta: {type: test_support, comment: Hold specifications for seam points whose controller registers a local process name}
  modules: [process]
- name: seam
  kind: library.lua
  source: file://seam.lua
  meta: {type: test_support, comment: The test composition's binding of bee.process:seams}
  modules: [process, channel, time]
  imports:
    placement_native_points: bee.tests.placement.native:seams
    placement_docker_points: bee.tests.placement.docker:seams
    harness_points: bee.tests.harness:seams
    process_points: bee.tests.process:seams
    hive_points: bee.tests.hive:seams
    approvals_points: bee.tests.approvals:seams
    inbox_points: bee.tests.approvals.inbox:seams
    node_points: bee.tests.node:seams
    shell_points: bee.tests.shell:seams
    gov_points: bee.tests.gov:seams
    sync_points: bee.tests.sync:seams
    gateway_points: bee.tests.gateway:seams
    credentials_points: bee.tests.credentials:seams
    resources_points: bee.tests.resources:seams
    hub_points: bee.tests.hub:seams
    threads_points: bee.tests.threads:seams
- name: seam_binding_test
  kind: function.lua
  source: file://seam_binding_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry]
  imports:
    test: wippy.test:test
