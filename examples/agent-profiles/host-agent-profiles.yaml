# Host-owned source fragment for a Bee build. Append these entries to the
# `entries:` list in src/_index.yaml, after replacing the two executable paths
# and the Codex model with values reviewed for this host. This is not a runtime
# overlay and does not contain credentials.
- name: host_agent_codex_provider
  kind: registry.entry
  meta:
    type: bee.codex_provider
    comment: Host-selected Codex API provider for the managed Agent window
  data:
    schema_revision: bee.codex-provider@1
    name: openai
    base_url: https://api.openai.com/v1
    model: REPLACE_WITH_REVIEWED_CODEX_MODEL
- name: host_agent_claude_policy
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected native Claude Code Agent-window policy
  data:
    schema_revision: bee.launch-policy@2
    required_cleanup: process_group
    required_exit_observation: independent
    start_ms: 15000
    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables:
      claude: /REPLACE/WITH/ABSOLUTE/CLAUDE/PATH
    environment: {}
    prepare_options: {permission_mode: default}
- name: host_agent_codex_policy
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected native Codex Agent-window policy
  data:
    schema_revision: bee.launch-policy@2
    required_cleanup: process_group
    required_exit_observation: independent
    start_ms: 15000
    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables:
      codex: /REPLACE/WITH/ABSOLUTE/CODEX/PATH
    environment: {}
    prepare_options: {sandbox: read-only}
    provider_ref: bee:host_agent_codex_provider
- name: host_agent_claude_window
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Host-selected Claude Code native Agent window
  data:
    schema_revision: bee.launch-definition@1
    launch_id: host-claude
    title: Claude Code
    command_names: []
    binding_ref: bee.driver.claude:binding
    profile_id: window
    policy_ref: bee:host_agent_claude_policy
    default_mode: window
    allowed_overrides: []
    workdir_policy: {kind: caller_workspace}
    thread_policy: {kind: new}
    credentials: []
    presentation: {start_menu: true, fullscreen: true, reuse: never}
- name: host_agent_codex_window
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Host-selected Codex native Agent window
  data:
    schema_revision: bee.launch-definition@1
    launch_id: host-codex
    title: Codex
    command_names: []
    binding_ref: bee.driver.codex:binding
    profile_id: window
    policy_ref: bee:host_agent_codex_policy
    default_mode: window
    allowed_overrides: []
    workdir_policy: {kind: caller_workspace}
    thread_policy: {kind: new}
    credentials: []
    presentation: {start_menu: true, fullscreen: true, reuse: never}
