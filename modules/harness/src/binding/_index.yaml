version: '1.0'
namespace: bee.harness.binding
entries:
- name: call
  kind: function.lua
  source: file://method.lua
  method: handle
  imports: {service: bee.harness.profiles:service}
  security: {policies: [bee.harness.security:profile_store_policy]}
- name: capabilities
  kind: function.lua
  source: file://capabilities_method.lua
  method: handle
  imports:
    machine: bee.harness.carrier:machine
- name: resolve
  kind: function.lua
  source: file://resolve_method.lua
  method: handle
  imports:
    admission: bee.harness.launch:admission
    bounds: bee.threads.records:bounds
- name: admit
  kind: function.lua
  source: file://admit_method.lua
  method: handle
  imports:
    admission: bee.harness.launch:admission
- name: start
  kind: function.lua
  source: file://start_method.lua
  method: handle
  imports:
    admission: bee.harness.launch:admission
  security:
    policies:
    - bee.harness.security:launch_spawn_policy
- name: locate_probe
  kind: function.lua
  source: file://locate_probe.lua
  method: handle
  modules:
  - registry
  imports:
    bounds: bee.threads.records:bounds
    locator: bee.harness.launch:locate
  security:
    policies:
    - bee.harness.security:launch_locate_probe_policy
    - bee.harness.security:launch_docker_readiness_policy
- name: setup_backend
  kind: function.lua
  source: file://setup_backend.lua
  method: handle
  modules:
  - hash
  - funcs
  - registry
  - security
  imports:
    bounds: bee.threads.records:bounds
    definition: bee.harness.launch:definitions
- name: setup
  kind: function.lua
  source: file://setup_method.lua
  method: handle
  modules:
  - funcs
  - security
  imports:
    bounds: bee.threads.records:bounds
    admission: bee.harness.launch:admission
    profiles: bee.harness.profiles:protocol
  security:
    policies:
    - bee.harness.launch:setup_facade_policy
- name: present
  kind: function.lua
  source: file://presentation_method.lua
  method: open
  modules:
  - funcs
  - security
  imports:
    bounds: bee.threads.records:bounds
  security:
    policies:
    - bee.harness.security:presentation_facade_policy
- name: profiles_local
  kind: contract.binding
  contracts:
  - contract: bee.harness:profiles
    methods:
      call: bee.harness.binding:call
