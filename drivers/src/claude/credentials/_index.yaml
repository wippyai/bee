version: '1.0'
namespace: bee.drivers.claude.credentials
entries:
- name: credential_format
  kind: registry.entry
  meta:
    type: bee.credential_format
    provider: claude
  data:
    schema_revision: bee.credential-format@2
    environments:
    - ANTHROPIC_API_KEY
    - CLAUDE_CODE_OAUTH_TOKEN
    file:
      path: .claude/.credentials.json
      content_format: json
      initialize:
      - path: .claude.json
        content: '{"hasCompletedOnboarding":true}'
