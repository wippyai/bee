version: '1.0'
namespace: bee.driver.agy
entries:
- name: definition
  kind: ns.definition
  module: driver-agy
  readme: file://README.md
  meta:
    title: Bee Antigravity CLI driver
    comment: Declarative Agy launch, stream-json normalization, and host-selected configuration delivery
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: host_environment
  kind: ns.requirement
  meta:
    comment: Read-only host environment that supplies the selected Agy executable
  default: bee.harness.host:environment
  targets:
  - entry: bee.driver.agy.env:executable
    path: .storage
- name: window_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Agy window route
  default: bee.driver.agy.security:launch_policy_agy_window
  targets:
  - entry: bee.driver.agy.profiles:default_window
    path: .data.policy_ref
- name: batch_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Agy batch route
  default: bee.driver.agy.security:launch_policy_agy_batch
  targets:
  - entry: bee.driver.agy.profiles:research_batch
    path: .data.policy_ref
