version: '1.0'
namespace: bee.driver.muse.profiles
entries:
- name: default_window
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned Muse window declaration; the host separately selects its policy, activation, executable and permissions
  data:
    schema_revision: bee.launch-definition@1
    launch_id: muse-window
    title: Muse CLI
    binding_ref: bee.drivers.muse.binding:binding
    profile_id: window
    private_credentials:
    - muse_login
    - muse_api_key
    docker_credentials:
    - muse_login
    - muse_api_key
    policy_ref: bee.driver.muse.security:launch_policy_muse_window
    default_mode: window
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: new
    session_resource: session
    credentials:
    - muse_login
    - muse_api_key
    presentation:
      start_menu: true
      fullscreen: true
      reuse: never
- name: research_batch
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned bounded Muse batch route for a host-selected coordinator and caller-owned shared thread
  data:
    schema_revision: bee.launch-definition@1
    launch_id: muse-research-batch
    title: Muse researcher
    binding_ref: bee.drivers.muse.binding:binding
    profile_id: batch
    policy_ref: bee.driver.muse.security:launch_policy_muse_batch
    default_mode: batch
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: caller
    session_resource: session
    credentials:
    - muse_login
    - muse_api_key
    presentation:
      start_menu: false
      fullscreen: false
      reuse: never
