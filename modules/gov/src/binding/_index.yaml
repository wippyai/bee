version: '1.0'
namespace: bee.gov.binding
entries:
- name: delivery_call
  kind: function.lua
  source: file://delivery_method.lua
  method: handle
  modules: [funcs, security, json, system]
  imports:
    bounds: bee.threads.records:bounds
    publication_profiles: bee.gov:publication_profile_decoder
    transaction: bee.persist:transaction
    preflight: bee.gov:preflight
    guide: bee.gov.traits:guide
    protocol: bee.gov:delivery_protocol
    resources: bee.gov:staging_resources
  security: {policies: [bee.gov.security:delivery_facade_policy, bee.gov.security:delivery_node_read_policy, bee.gov.security:publication_profiles_read_policy]}
- name: publication_call
  kind: function.lua
  source: file://publication_method.lua
  method: handle
  imports: {service: bee.gov.binding:publication_service}
  security: {policies: [bee.gov.security:publication_service_policy]}
- name: destination_call
  kind: function.lua
  source: file://destination_method.lua
  method: handle
  modules: [funcs, security]
  imports:
    service: bee.gov.binding:destination_service
    transaction: bee.persist:transaction
    bounds: bee.threads.records:bounds
  security: {policies: [bee.gov.security:destination_facade_policy]}
- name: contract_call
  kind: function.lua
  source: file://gateway.lua
  method: contract_call
  modules: &gateway_modules [registry, security, contract, http_client, hash]
  imports: &gateway_imports
    bounds: bee.threads.records:bounds
    capability_gateway: bee.gov:capability_gateway
    capability_grants: bee.gov:capability_grants
    capability_catalog: bee.gov:capability_catalog
    workspace_applications: bee.gov:workspace_applications
    capability_files: bee.gov:capability_files
  security: {policies: [bee.gov.security:gateway_policy]}
- name: http_request
  kind: function.lua
  source: file://gateway.lua
  method: http_request
  modules: *gateway_modules
  imports: *gateway_imports
  security: {policies: [bee.gov.security:gateway_policy]}
- name: granted_resources
  kind: function.lua
  source: file://gateway.lua
  method: granted_resources
  modules: *gateway_modules
  imports: *gateway_imports
  security: {policies: [bee.gov.security:gateway_policy]}
- name: overlay_call
  kind: function.lua
  source: file://workspace_method.lua
  method: handle
  modules: [funcs, security]
  imports:
    protocol: bee.gov:workspace_protocol
    guide: bee.gov.traits:guide
    transaction: bee.persist:transaction
    bounds: bee.threads.records:bounds
  security: {policies: [bee.gov.security:overlay_facade_policy]}
  meta:
    type: tool
    title: Overlay authoring
    llm_alias: BeeOverlay
    llm_description: Read this destination's component authoring guide, or create, list, read, put, append, remove or freeze files in your host-admitted private overlay. Put replaces a file; append adds bytes at an exact offset and verifies the complete result_digest. Read returns a base64 window of at most 16,384 bytes; use offset and limit to page. Writes require the current revision and a stable retry key. Freeze stages measured content only; it neither requests approval nor activates it. Use BeeComponents to inspect installed and Hub components for examples. Binary files use canonical base64. There is no host filesystem or registry access.
    input_schema: |
      {"type":"object","additionalProperties":false,"required":["operation"],"properties":{"operation":{"type":"string","enum":["guide","create","list","read","put","append","remove","freeze"]},"overlay_id":{"type":"string","minLength":1,"maxLength":160},"expected_revision":{"type":"integer","minimum":0,"maximum":9007199254740990},"idempotency_key":{"type":"string","minLength":1,"maxLength":160},"path":{"type":"string","minLength":1,"maxLength":240},"offset":{"type":"integer","minimum":0,"maximum":4194304},"limit":{"type":"integer","minimum":1,"maximum":16384},"result_digest":{"type":"string","pattern":"^[0-9a-f]{64}$"},"content":{"type":"string","maxLength":4194304},"content_base64":{"type":"string","maxLength":5592408},"snapshot_digest":{"type":"string","pattern":"^[0-9a-f]{64}$"}}}
- name: approval
  kind: library.lua
  source: file://approval.lua
  imports: {canonical: bee.sync:canonical, bounds: bee.threads.records:bounds}
- name: destination
  kind: library.lua
  source: file://destination.lua
  modules: [hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.sync:canonical
    approval: bee.gov.binding:approval
    plan_store: bee.gov.persist:plan_store
    replicas: bee.sync.persist:replicas
    delivery: bee.gov:delivery
    preflight: bee.gov:preflight
    transaction: bee.persist:transaction
- name: publisher
  kind: library.lua
  source: file://publisher.lua
  modules: [base64]
  imports:
    bounds: bee.threads.records:bounds
    delivery: bee.gov:delivery
    replicas: bee.sync.persist:replicas
    sync: bee.sync.persist:store
    transaction: bee.persist:transaction
- name: publication_service
  kind: library.lua
  source: file://publication_service.lua
  modules: [registry, security, system, base64, json]
  imports:
    bounds: bee.threads.records:bounds
    artifact: bee.gov:artifact
    materializer: bee.gov:materializer
    application_admission: bee.gov:governed_application_admission
    publication_profiles: bee.gov:publication_profile_decoder
    workspace_applications: bee.gov:workspace_applications
    capability_grants: bee.gov:capability_grants
    capability_catalog: bee.gov:capability_catalog
    publisher: bee.gov.binding:publisher
    staging: bee.gov.persist:staging
    activation_store: bee.gov.persist:activation_store
    resources: bee.gov:staging_resources
    sync_resources: bee.sync:resources
    transaction: bee.persist:transaction
- name: activation_owner
  kind: library.lua
  source: file://activation_owner.lua
  modules: [json]
  imports:
    bounds: bee.threads.records:bounds
    transaction: bee.persist:transaction
    plan_store: bee.gov.persist:plan_store
    activation_store: bee.gov.persist:activation_store
    activation_measure: bee.gov:activation_measure
    migration_work: bee.gov:migration_work
    approval: bee.gov.binding:approval
    preflight: bee.gov:preflight
    artifact: bee.gov:artifact
    application_admission: bee.gov:governed_application_admission
- name: migration_effect
  kind: library.lua
  source: file://migration_effect.lua
  modules: [hash]
  imports:
    canonical: bee.sync:canonical
    hub_migrations: bee.hub:migrations
    migration_runner: bee.hub.binding:migration_runner
    migration_work: bee.gov:migration_work
    materializer: bee.gov:materializer
- name: destination_service
  kind: library.lua
  source: file://destination_service.lua
  modules: [registry, security, system, funcs, hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.sync:canonical
    transaction: bee.persist:transaction
    resources: bee.gov:staging_resources
    sync_resources: bee.sync:resources
    replicas: bee.sync.persist:replicas
    plan_store: bee.gov.persist:plan_store
    activation_store: bee.gov.persist:activation_store
    activation_owner: bee.gov.binding:activation_owner
    hub_resolver: bee.gov:hub_resolver
    overlay_resolver: bee.gov:overlay_resolver
    delivery: bee.gov:delivery
    destination: bee.gov.binding:destination
    materializer: bee.gov:materializer
    migration_effect: bee.gov.binding:migration_effect
    migration_runner: bee.hub.binding:migration_runner
    activation_profiles: bee.gov:activation_profile_decoder
    capability_grants: bee.gov:capability_grants
    capability_catalog: bee.gov:capability_catalog
    workspace_applications: bee.gov:workspace_applications
    preflight: bee.gov:preflight
- name: destination_backend_call
  kind: function.lua
  source: file://destination_backend.lua
  method: call
  modules: [security]
  imports:
    service: bee.gov.binding:destination_service
    transaction: bee.persist:transaction
  meta: {type: internal}
- name: workspace_backend_call
  kind: function.lua
  source: file://authoring.lua
  method: call
  modules: [security, system]
  imports:
    protocol: bee.gov:workspace_protocol
    staging: bee.gov.persist:staging
    resources: bee.gov:staging_resources
    transaction: bee.persist:transaction
  meta: {type: internal}
