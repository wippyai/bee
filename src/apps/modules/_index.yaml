version: '1.0'
namespace: bee.modules
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: [tty, process, channel, uuid, funcs]
  imports:
    client: bee.application:client
    appearance: bee.application:appearance
    model: bee.modules:model
    view: bee.modules:view
    contents: bee.modules:contents
  meta:
    type: bee.application
    application:
      api_version: 1
      title: Modules
      icon: M
      lifetime: view
      revision: '1'
      instance_policy: singleton
      group: Tools
      role: modules
      restart_policy: never
- name: model
  kind: library.lua
  source: file://model.lua
  modules: [json, hash]
  imports:
    text: bee.application:text
    canonical: bee.sync:canonical
- name: view
  kind: library.lua
  source: file://view.lua
  modules: [tty, json]
  imports:
    appearance: bee.application:appearance
    model: bee.modules:model
    contents: bee.modules:contents
- name: contents
  kind: library.lua
  source: file://contents.lua
  modules: [json, base64]
  imports:
    text: bee.application:text
- name: client_policy
  kind: security.policy
  meta:
    comment: Modules may call only the public Hub facade. The facade authorizes the requested package operation before entering its private registry execution scope.
  policy:
    actions: [funcs.call]
    resources: [bee.hub.binding:call, bee.governance:publication_call]
    effect: allow
- name: publication_policy
  kind: security.policy
  meta:
    comment: Modules may prepare/publish a configured authored component in the admitted workspace; Governance retains authored-store, overlay and Sync authority.
  policy:
    actions: [bee.governance.delivery.manage, bee.governance.delivery.publish]
    resources: '*'
    effect: allow
- name: hub_policy
  kind: security.policy
  meta:
    comment: The Hub facade checks these operation actions against the requested catalog or component; no registry or Hub credential scope is granted to the application.
  policy:
    actions: [bee.hub.read, bee.hub.manage]
    resources: '*'
    effect: allow
