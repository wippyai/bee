version: '1.0'
namespace: bee.apps.library.app
entries:
- name: form
  kind: library.lua
  source: file://form.lua
  modules:
  - json
  imports:
    bounds: bee.drivers.values:bounds
    json_schema: bee.gateway.catalog:json_schema
    requirements: bee.hub.package:requirements
- name: hub
  kind: library.lua
  source: file://hub.lua
  modules:
  - json
  imports:
    bounds: bee.drivers.values:bounds
    canonical: bee.drivers.values:canonical
    text: bee.ui:text
    form: bee.apps.library.app:form
- name: contents
  kind: library.lua
  source: file://contents.lua
  modules:
  - json
  - base64
  imports:
    text: bee.ui:text
- name: model
  kind: library.lua
  source: file://model.lua
  imports:
    governed: bee.gov.client:governed
    hub: bee.apps.library.app:hub
    drivers: bee.gov.types:drivers
    glyphs: bee.ui:glyphs
- name: hub_view
  kind: library.lua
  source: file://hub_view.lua
  modules:
  - tty
  - json
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    model: bee.apps.library.app:hub
    contents: bee.apps.library.app:contents
    form: bee.apps.library.app:form
- name: view
  kind: library.lua
  source: file://view.lua
  modules:
  - tty
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    model: bee.apps.library.app:model
    governed: bee.gov.client:governed
    hub: bee.apps.library.app:hub
    hub_view: bee.apps.library.app:hub_view
    contents: bee.apps.library.app:contents
    glyphs: bee.ui:glyphs
    text: bee.ui:text
- name: session
  kind: library.lua
  source: file://session.lua
  modules:
  - channel
  - funcs
  imports:
    confirmation: bee.approvals.app:confirmation
    client: bee.app:client
    model: bee.apps.library.app:model
    governed: bee.gov.client:governed
    hub: bee.apps.library.app:hub
    view: bee.apps.library.app:view
- name: reads
  kind: library.lua
  source: file://reads.lua
  modules:
  - funcs
  imports:
    model: bee.apps.library.app:model
    hub: bee.apps.library.app:hub
    contents: bee.apps.library.app:contents
    delivery_actions: bee.apps.library.app:delivery_actions
    session: bee.apps.library.app:session
- name: package_flow
  kind: library.lua
  source: file://package_flow.lua
  modules:
  - json
  imports:
    confirmation: bee.approvals.app:confirmation
    model: bee.apps.library.app:model
    governed: bee.gov.client:governed
    hub: bee.apps.library.app:hub
    delivery_actions: bee.apps.library.app:delivery_actions
    session: bee.apps.library.app:session
    reads: bee.apps.library.app:reads
- name: hits
  kind: library.lua
  source: file://hits.lua
  imports:
    client: bee.app:client
    confirmation: bee.approvals.app:confirmation
    model: bee.apps.library.app:model
    governed: bee.gov.client:governed
    hub: bee.apps.library.app:hub
    view: bee.apps.library.app:view
    contents: bee.apps.library.app:contents
    delivery_actions: bee.apps.library.app:delivery_actions
    session: bee.apps.library.app:session
    reads: bee.apps.library.app:reads
    package_flow: bee.apps.library.app:package_flow
- name: app
  kind: process.lua
  meta:
    type: bee.application
    application:
      api_version: 1
      title: Library
      lifetime: view
      revision: '1'
      instance_policy: singleton
      menus:
      - bee.apps.library.app:start_menu
  source: file://app.lua
  method: main
  modules:
  - channel
  - process
  - tty
  imports:
    confirmation: bee.approvals.app:confirmation
    frame: bee.ui:frame
    client: bee.app:client
    appearance: bee.ui:appearance
    model: bee.apps.library.app:model
    governed: bee.gov.client:governed
    governance_changes: bee.gov.client:changes
    hub: bee.apps.library.app:hub
    view: bee.apps.library.app:view
    contents: bee.apps.library.app:contents
    delivery_actions: bee.apps.library.app:delivery_actions
    session: bee.apps.library.app:session
    reads: bee.apps.library.app:reads
    package_flow: bee.apps.library.app:package_flow
    hits_actions: bee.apps.library.app:hits
  security:
    policies:
    - bee.security.approvals:confirmation_client
    - bee.security.approvals:confirmation_authority
    - bee.apps.library:installation_changes
    - bee.apps.library:destination_client
    - bee.apps.library:delivery_operations
    - bee.apps.library:delivery_share
    - bee.apps.library:hub_client
    - bee.apps.library:hub_operations
    - bee.apps.library:names_client
    - bee.apps.library:names_read
    - bee.apps.library:self_update
- name: start_menu
  kind: registry.entry
  meta:
    type: bee.menu
  data:
    title: Library
    location: start
    order: 30
- name: delivery_actions
  kind: library.lua
  source: file://delivery_actions.lua
  modules:
  - funcs
  - uuid
  imports:
    confirmation: bee.approvals.app:confirmation
    model: bee.apps.library.app:model
    governed: bee.gov.client:governed
    hub: bee.apps.library.app:hub
