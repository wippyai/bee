version: '1.0'
namespace: bee.hive.manager
entries:
- name: definition
  kind: ns.definition
  module: hive-manager
  meta:
    title: Bee hive manager
    comment: Hive cluster management app; host composition and policy selection remain
      in Bee
- name: dependency_values
  kind: ns.dependency
  component: bee/values
  version: '*'
- name: dependency_hive
  kind: ns.dependency
  component: bee/hive
  version: '*'
- name: dependency_application
  kind: ns.dependency
  component: bee/application
  version: '*'
- name: directory
  kind: library.lua
  source: file://directory.lua
  imports:
    types: bee.hive:types
    bounds: bee.values:bounds
    contract: bee.protocol:application
- name: names
  kind: registry.entry
  meta:
    type: bee.hive_node_names
    comment: Friendly names the host gives node identities for display and selection;
      a name authenticates nothing and changes no identity
  data:
    names: {}
- name: client_policy
  kind: security.policy
  meta:
    comment: The manager reads runtime membership and its own host entries; every
      Hive answer comes from the supervisor under the owner's exposure, and no desktop
      authority is granted here
  policy:
    actions:
    - registry.get
    - system.read
    resources:
    - bee.hive.manager:names
    - cluster
    effect: allow
- name: viewer_policy
  kind: security.policy.expr
  meta:
    comment: The manager opens a remote view of another node's workspace in a view
      process on the display client host; the owner node's bridge still admits that
      process and grants its mount
  policy:
    actions:
    - process.spawn
    - process.spawn.monitored
    - process.host
    - process.registry.lookup
    - process.monitor
    - tty.attach
    - tty.read
    - tty.write
    - tty.resize
    - tty.viewport
    resources: '*'
    expression: ((action == "process.spawn" || action == "process.spawn.monitored")
      && resource == "bee.hive.desktop:viewer") || (action == "process.host" && resource
      == "bee.hive.desktop:display_host") || (action == "process.registry.lookup"
      && resource matches "^bee[.]hive[.]supervisor(/.+)?$") || action == "process.monitor"
      || action == "tty.attach" || action == "tty.read" || action == "tty.write" ||
      action == "tty.resize" || action == "tty.viewport"
    effect: allow
