version: '1.0'
namespace: bee.drivers.descriptor
entries:
- name: schema_values
  kind: library.lua
  source: file://schema_values.lua
  imports:
    bounds: bee.drivers.values:bounds
    canonical: bee.drivers.values:canonical
- name: shape
  kind: library.lua
  source: file://shape.lua
  imports:
    bounds: bee.drivers.values:bounds
- name: templates
  kind: library.lua
  source: file://templates.lua
  imports:
    bounds: bee.drivers.values:bounds
    shape: bee.drivers.descriptor:shape
- name: descriptor
  kind: library.lua
  source: file://descriptor.lua
  modules:
  - registry
  imports:
    codec_registry: bee.drivers.codec:codec_registry
    writable_roots: bee.drivers.descriptor:writable_roots
    shape: bee.drivers.descriptor:shape
    template_checks: bee.drivers.descriptor:templates
    bounds: bee.drivers.values:bounds
    login_evidence: bee.drivers.locate:login_evidence
    schema_values: bee.drivers.descriptor:schema_values
    login_evidence_types: bee.drivers:login_types
- name: effective
  modules: [json, toml]
  kind: library.lua
  source: file://effective.lua
  imports:
    placements: bee.drivers.descriptor:placement
    descriptors: bee.drivers.descriptor:descriptor
    profile_access: bee.drivers.profiles:profile_access
    canonical: bee.drivers.values:canonical
    bounds: bee.drivers.values:bounds
    instructions: bee.drivers.profiles:instructions
- name: profile_values
  kind: library.lua
  source: file://profile_values.lua
  modules: [registry, json]
  imports:
    resolver: bee.drivers.binding:resolver
    bounds: bee.drivers.values:bounds
    descriptors: bee.drivers.descriptor:descriptor
    effective: bee.drivers.descriptor:effective
    seam: bee.drivers.values:seam
- name: placement
  kind: library.lua
  source: file://placement.lua
  imports:
    bounds: bee.drivers.values:bounds
- name: kernel
  kind: registry.entry
  meta:
    type: bee.kernel
  data:
    scope: tree
- name: writable_roots
  kind: library.lua
  source: file://writable_roots.lua
  imports:
    bounds: bee.drivers.values:bounds
    canonical: bee.drivers.values:canonical
