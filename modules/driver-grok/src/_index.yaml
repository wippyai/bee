version: '1.0'
namespace: bee.driver.grok
entries:
- name: definition
  kind: ns.definition
  module: driver-grok
  readme: file://README.md
  meta:
    title: Bee Grok driver
    comment: Declarative Grok CLI driver; placement owns process, credentials, and private-home materialization
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: host_environment
  kind: ns.requirement
  meta:
    comment: Read-only host environment that supplies the selected Grok executable
  default: bee.harness.host:environment
  targets:
  - entry: bee.driver.grok:executable
    path: .storage
- name: window_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Grok window route
  targets:
  - entry: bee.driver.grok:default_window
    path: .data.policy_ref
- name: batch_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Grok batch route
  targets:
  - entry: bee.driver.grok:research_batch
    path: .data.policy_ref
- name: executable
  kind: env.variable
  storage: bee.harness.host:environment
  variable: grok
  default: ''
  readonly: true
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  modules: [json]
  imports:
    bounds: bee.threads.records:bounds
    events: bee.driver.kit:events
    types: bee.driver:types
- name: configuration
  kind: library.lua
  source: file://configuration.lua
  modules: [hash]
  imports:
    canonical: bee.threads.records:canonical
    quote: bee.driver.kit:quote
    configure_protocol: bee.driver:configuration
- name: launch
  kind: library.lua
  source: file://launch.lua
  imports:
    bounds: bee.threads.records:bounds
    types: bee.driver:types
- name: binding
  kind: contract.binding
  contracts:
  - contract: bee.driver:driver
    methods:
      prepare: bee.driver.grok.binding:prepare
      dispatch: bee.driver.grok.binding:dispatch
      normalize: bee.driver.grok.binding:normalize
      configure: bee.driver.grok.binding:configure
  meta:
    type: harness.driver
    driver_id: grok
    profiles_ref: bee.driver.grok:profiles
- name: profiles
  kind: registry.entry
  meta:
    type: harness.profile
    driver_ref: bee.driver.grok:binding
  data:
    driver:
      schema_revision: bee.driver@1
      kind: harness
      title: Grok CLI
      implementation_version: 1.0.30
      default_profile: session
      profiles:
      - id: session
        mode: session
        hooks:
          transports: []
          events: []
        inbound:
        - next_turn
        mcp:
          client_transports:
          - stdio
          - streamable_http
          - sse
          initialize_timeout_ms: 30000
        protocol: stream-json
        protocol_revision: streaming-json-1
        answer_path: &id001
          strategy: accumulate
          adapter_ref: bee.driver.grok:protocol
        resume: &id002
          strategy: per-process
          portable: false
        isolation_env: &id003
          variables:
          - HOME
          - GROK_HOME
          private_home: true
        exit_codes_trustworthy: false
        permission_exchange:
          mode: none
        input_ready: &id004
          strategy: none
        interrupt: &id005
          methods:
          - signal_group
      - id: batch
        mode: batch
        hooks:
          transports: []
          events: []
        inbound: []
        mcp:
          client_transports:
          - stdio
          - streamable_http
          - sse
          initialize_timeout_ms: 30000
        protocol: stream-json
        protocol_revision: streaming-json-1
        answer_path: *id001
        resume: *id002
        isolation_env: *id003
        exit_codes_trustworthy: false
        permission_exchange:
          mode: none
        input_ready: *id004
        interrupt: *id005
      - id: window
        mode: window
        protocol: pty
        protocol_revision: native-window-1
        hooks: {transports: [command], events: [SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, Stop]}
        answer_path:
          strategy: none
        resume:
          strategy: none
          portable: false
        isolation_env: *id003
        exit_codes_trustworthy: false
        permission_exchange:
          mode: none
        input_ready:
          strategy: none
- name: default_window
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned Grok window declaration; the host separately selects its policy, activation, executable and permissions
  data:
    schema_revision: bee.launch-definition@1
    launch_id: grok-window
    title: Grok CLI
    command_names: [grok]
    binding_ref: bee.driver.grok:binding
    profile_id: window
    policy_ref: ''
    default_mode: window
    allowed_overrides: [thread, workdir]
    workdir_policy: {kind: declared_resource, resource_ref: project}
    thread_policy: {kind: new}
    session_resource: session
    credentials: [grok_login]
    presentation: {start_menu: true, fullscreen: true, reuse: never}
- name: research_batch
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned bounded Grok batch route for a host-selected coordinator and caller-owned shared thread
  data:
    schema_revision: bee.launch-definition@1
    launch_id: grok-research-batch
    title: Grok researcher
    command_names: []
    binding_ref: bee.driver.grok:binding
    profile_id: batch
    policy_ref: ''
    default_mode: batch
    allowed_overrides: [thread, workdir]
    workdir_policy: {kind: declared_resource, resource_ref: project}
    thread_policy: {kind: caller}
    session_resource: session
    credentials: []
    presentation: {start_menu: false, fullscreen: false, reuse: never}
- name: credential_format
  kind: registry.entry
  meta:
    type: bee.credential_format
  data:
    schema_revision: bee.credential-format@1
    file:
      path: .grok/auth.json
      content_format: json
      initialize: []
- name: command
  kind: registry.entry
  meta:
    type: bee.application_command
    comment: CLI command to launch Grok CLI in the agent window
  data:
    name: grok
    definition_id: bee.harness.window:app
    arguments:
    - bee.driver.grok:default_window
    fullscreen: true

