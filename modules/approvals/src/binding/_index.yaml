version: '1.0'
namespace: bee.approvals.binding
entries:
- name: node_summary
  kind: function.lua
  source: file://node_summary_method.lua
  method: handle
  imports: {service: bee.approvals:service}
  security: {policies: []}
- name: request
  kind: function.lua
  source: file://request_method.lua
  method: handle
  imports:
    service: bee.approvals:service
  security: {policies: []}
- name: feed_snapshot
  kind: function.lua
  source: file://feed_snapshot_method.lua
  method: handle
  imports: {service: bee.approvals:service}
  security: {policies: []}
  meta:
    hive: policy
    hive_operation:
      revision: '1'
      title: Authorized approval snapshot
      input:
        type: object
        additionalProperties: false
        required: [workspace_id]
        properties:
          workspace_id: {type: string}
          limit: {type: integer, minimum: 1, maximum: 64}
          after_key: {type: string}
          expected_cursor: {type: integer, minimum: 0}
          expected_scope_revision: {type: string}
      output: &approval_reply
        type: object
        additionalProperties: false
        properties:
          ok: {type: boolean}
          error: {type: object}
          value: {}
          replayed: {type: boolean}
- name: feed_read_after
  kind: function.lua
  source: file://feed_read_after_method.lua
  method: handle
  imports: {service: bee.approvals:service}
  security: {policies: []}
  meta:
    hive: policy
    hive_operation:
      revision: '1'
      title: Authorized approval changes
      input:
        type: object
        additionalProperties: false
        required: [workspace_id, cursor, expected_scope_revision]
        properties:
          workspace_id: {type: string}
          cursor: {type: integer, minimum: 0}
          limit: {type: integer, minimum: 1, maximum: 64}
          expected_scope_revision: {type: string}
      output: *approval_reply
- name: decide
  kind: function.lua
  meta:
    hive: policy
    hive_operation:
      revision: '1'
      title: Decide one exact approval
      input:
        type: object
        additionalProperties: false
        required: [approval_id, expected_revision, decision, proposal_digest]
        properties:
          approval_id: {type: string}
          expected_revision: {type: integer, minimum: 1}
          decision: {type: string, enum: [approved, denied]}
          proposal_digest: {type: string}
          response: {}
      output: *approval_reply
  source: file://decide_method.lua
  method: handle
  imports:
    service: bee.approvals:service
  security: {policies: []}
- name: decide_batch
  kind: function.lua
  source: file://decide_batch_method.lua
  method: handle
  imports:
    service: bee.approvals:service
  security: {policies: []}
- name: withdraw
