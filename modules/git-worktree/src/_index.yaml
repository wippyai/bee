version: '1.0'
namespace: bee.git_worktree
entries:
- name: definition
  kind: ns.definition
  module: git-worktree
  readme: file://README.md
  meta:
    title: Bee Git worktree plugin
    comment: Git worktree management and repository metadata detection for Bee placement
- name: protected_namespace
  kind: ns.requirement
  meta:
    comment: Add the git-worktree namespace to the host trust map
  default: bee.git_worktree
  targets:
  - entry: bee:protected_kernel
    path: .data.namespaces +=
- name: dependency_placement
  kind: ns.dependency
  component: bee/placement
  version: '*'
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: git_roots
  kind: library.lua
  source: file://git_roots.lua
- name: worktree
  kind: library.lua
  source: file://worktree.lua
  modules: [exec, fs, registry, hash]
  imports:
    git_roots: bee.git_worktree:git_roots
    paths: bee.placement:paths
    bounds: bee.threads.records:bounds
    quote: bee.driver.kit:quote
- name: plan
  kind: function.lua
  source: file://setup_method.lua
  method: plan
  imports:
    worktree: bee.git_worktree:worktree
    bounds: bee.threads.records:bounds
  security:
    policies: [bee.git_worktree:worktree_policy]
- name: setup
  kind: function.lua
  source: file://setup_method.lua
  method: handle
  imports:
    worktree: bee.git_worktree:worktree
    bounds: bee.threads.records:bounds
  security:
    policies: [bee.git_worktree:worktree_policy]
- name: cleanup
  kind: function.lua
  source: file://cleanup_method.lua
  method: handle
  imports:
    worktree: bee.git_worktree:worktree
    bounds: bee.threads.records:bounds
  security:
    policies: [bee.git_worktree:worktree_policy]
- name: binding
  kind: contract.binding
  meta:
    type: bee.placement.workdir_preparer
  contracts:
  - contract: bee.placement:workdir_preparer
    methods:
      plan: bee.git_worktree:plan
      setup: bee.git_worktree:setup
      cleanup: bee.git_worktree:cleanup
- name: worktree_policy
  kind: security.policy
  policy:
    effect: allow
    actions:
    - exec.get
    - exec.run
    - fs.get
    - fs.read
    - fs.stat
    - fs.exists
    - fs.isdir
    - registry.get
    resources: '*'
- name: target_executor
  kind: ns.requirement
  meta:
    comment: Host-selected native executor for git commands
  default: bee.git_worktree:git_executor
  targets:
  - entry: bee.git_worktree:executor_ref
    path: .resource_ref
- name: executor_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked native executor
- name: git_executor
  kind: exec.native
  meta:
    comment: Native executor for git commands
  default_env:
    PATH: /usr/local/bin:/usr/bin:/bin
- name: target_host_files
  kind: ns.requirement
  meta:
    comment: Host-selected filesystem volume for git metadata reading
  default: bee.git_worktree:host_files
  targets:
  - entry: bee.git_worktree:host_files_ref
    path: .resource_ref
- name: host_files_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked host files resource
- name: host_files
  kind: fs.directory
  meta:
    comment: Read-only host filesystem volume for git metadata
  directory: /
  auto_init: false
  readonly: true
