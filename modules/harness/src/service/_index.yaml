version: '1.0'
namespace: bee.harness.service
entries:
- name: presentation
  kind: library.lua
  source: file://presentation.lua
  modules:
  - process
  - channel
  - time
  - uuid
  - hash
  - security
  - funcs
  - json
  - tty
  imports:
    bounds: bee.threads.records:bounds
    admission: bee.harness.launch:admission
    canonical: bee.threads.records:canonical
- name: target_presentation_policies
  kind: ns.requirement
  default:
  - bee.harness.security:carrier_policy
  - bee.harness.security:interactive_session_policy
  - bee.harness.security:carrier_environment_policy
  - bee.harness.security:profile_workspace_policy
  - bee.security.threads:thread_create_policy
  - bee.harness.security:harness_setup_policy
  - bee.placement.native.security:placement_store_policy
  - bee.placement.native.security:placement_exec_policy
  - bee.placement.native.security:placement_runner_policy
  - bee.resources.security:resource_grant_policy
  - bee.resources.security:resource_resolve_policy
  - bee.credentials.security:credential_issue_policy
  - bee.credentials.security:credential_materialize_workspace_policy
  - bee.security.gateway:gateway_materialize_policy
  - bee.security.gateway:gateway_supervision_policy
  - bee.security.storage:workspace_folder_browse_policy
  - bee.security.storage:workspace_catalog_read_policy
  - bee.security.threads:thread_sessions_owner_policy
  - bee.harness.security:presentation_owner_policy
  - bee.harness.security:presentation_bridge_policy
  targets:
  - entry: bee.harness.service:open
    path: .security.policies
- name: presentation_owner
  kind: process.lua
  source: file://presentation.lua
  method: main
  modules:
  - process
  - channel
  - time
  - uuid
  - hash
  - security
  - funcs
  - json
  - tty
  imports:
    bounds: bee.threads.records:bounds
    admission: bee.harness.launch:admission
    canonical: bee.threads.records:canonical
- name: presentation_executor
  kind: process.lua
  source: file://executor.lua
  method: main
  imports:
    runtime: bee.harness.app:runtime
    windows: bee.harness.app:windows
- name: open
  kind: function.lua
  source: file://presentation.lua
  method: open
  modules: [process, channel, time, uuid, hash, security, funcs, json, tty]
  imports:
    bounds: bee.threads.records:bounds
    admission: bee.harness.launch:admission
    canonical: bee.threads.records:canonical
  security:
    policies: [bee.harness.security:presentation_bridge_policy]
