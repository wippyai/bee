version: '1.0'
namespace: bee.workspace.manager
entries:
- name: definition
  kind: ns.definition
  module: workspace-manager
  meta:
    title: Bee workspace manager
    comment: Workspace catalog management app; host composition and policy selection
      remain in Bee
- name: dependency_application
  kind: ns.dependency
  component: bee/application
  version: '*'
- name: client_policy
  kind: security.policy
  meta:
    comment: The viewer calls the workspace catalog operations and lists a workspace's
      threads; each owner authorizes the call under the process actor and the host's
      catalog and thread policies
  policy:
    actions:
    - funcs.call
    resources:
    - bee.workspace.binding:list
    - bee.workspace.binding:search
    - bee.workspace.binding:inspect
    - bee.workspace.binding:archive
    - bee.workspace.binding:restore
    - bee.workspace.binding:create
    - bee.workspace.binding:roots
    - bee.workspace.binding:folders
    - bee.threads.binding:list_workspace
    effect: allow
