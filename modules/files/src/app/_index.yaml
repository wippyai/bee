version: '1.0'
namespace: bee.files.app
entries:
- name: model
  kind: library.lua
  source: file://model.lua
  imports:
    tree: bee.files:tree
    syntax: bee.files:syntax
    protocol: bee.files:protocol
    source: bee.files:source
- name: view
  kind: library.lua
  source: file://view.lua
  modules: [tty]
  imports:
    frame: bee.app:frame
    appearance: bee.app:appearance
    syntax: bee.files:syntax
    model: bee.files.app:model
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: [tty, process, channel, uuid, fs, registry]
  imports:
    frame: bee.app:frame
    client: bee.app:client
    appearance: bee.app:appearance
    syntax: bee.files:syntax
    protocol: bee.files:protocol
    source: bee.files:source
    model: bee.files.app:model
    view: bee.files.app:view
  meta:
    type: bee.app
    application:
      api_version: 1
      title: Files
      icon: F
      lifetime: view
      revision: '2'
      instance_policy: singleton
      group: Tools
      role: inspection
