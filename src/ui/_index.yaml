version: '1.0'
namespace: bee.ui
entries:
- name: text
  kind: library.lua
  source: file://text.lua
- name: glyphs
  kind: library.lua
  source: file://glyphs.lua
- name: appearance
  kind: library.lua
  source: file://appearance.lua
- name: popup
  kind: library.lua
  source: file://popup.lua
  modules: [tty]
  imports:
    appearance: bee.ui:appearance
- name: frame
  kind: library.lua
  source: file://frame.lua
  modules: [tty]
  imports:
    appearance: bee.ui:appearance
- name: lists
  kind: library.lua
  source: file://lists.lua
  modules: [tty]
  imports:
    appearance: bee.ui:appearance
    frame: bee.ui:frame
- name: overlay
  kind: library.lua
  source: file://overlay.lua
  modules: [tty]
  imports:
    appearance: bee.ui:appearance
    popup: bee.ui:popup
    frame: bee.ui:frame
- name: palette
  kind: library.lua
  source: file://palette.lua
  imports:
    frame: bee.ui:frame
- name: markdown
  kind: library.lua
  source: file://markdown.lua
  imports:
    frame: bee.ui:frame
    text: bee.ui:text
  modules:
  - tty
- name: kernel
  kind: registry.entry
  meta:
    type: bee.kernel
  data:
    scope: tree
