version: '1.0'
namespace: bee.governance
entries:
- name: definition
  kind: ns.definition
  module: governance
  readme: file://README.md
  meta:
    title: Bee governance authoring
    comment: Caller-owned migrated staging, measured-closure checks and durable overlay activation
- name: preflight
  kind: library.lua
  source: file://preflight.lua
  modules: [hash, json]
  imports: {canonical: bee.sync:canonical}
- name: delivery_protocol
  kind: library.lua
  source: file://delivery_protocol.lua
  imports: {bounds: bee.threads.records:bounds}
- name: delivery_call
  kind: function.lua
  source: file://delivery_method.lua
  method: handle
  modules: [funcs, security, registry, json]
  imports:
    bounds: bee.threads.records:bounds
    transaction: bee.persist:transaction
    preflight: bee.governance:preflight
    guide: bee.governance.traits:guide
    protocol: bee.governance:delivery_protocol
  security: {policies: [bee:delivery_facade_policy]}
- name: workspace
  kind: library.lua
  source: file://workspace.lua
  modules: [hash]
  imports: {canonical: bee.sync:canonical}
- name: workspace_protocol
  kind: library.lua
  source: file://workspace_protocol.lua
  modules: [base64]
  imports: {bounds: bee.threads.records:bounds}
- name: candidate
  kind: library.lua
  source: file://candidate.lua
  modules: [hash, json]
  imports: {canonical: bee.sync:canonical, workspace: bee.governance:workspace}
- name: artifact
  kind: library.lua
  source: file://artifact.lua
  modules: [hash, json]
  imports: {canonical: bee.sync:canonical}
- name: governed_application_admission
  kind: library.lua
  source: file://application_admission.lua
  modules: [hash, json]
  imports: {canonical: bee.sync:canonical, bounds: bee.threads.records:bounds}
- name: delivery
  kind: library.lua
  source: file://delivery.lua
  modules: [json, hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.sync:canonical
    artifact: bee.governance:artifact
    version: bee.sync:version
- name: publication_profiles
  kind: registry.entry
  meta:
    type: bee.governance.publication_profiles
    comment: Host-selected source workspaces and overlay owners available for immutable publication
  data: {profiles: []}
- name: publication_call
  kind: function.lua
  source: file://publication_method.lua
  method: handle
  imports: {service: bee.governance.binding:publication_service}
  security: {policies: [bee:governance_publication_service_policy]}
- name: target_db
  kind: ns.requirement
  default: bee.governance:db
  meta: {comment: Host-selected SQLite store for private overlays and frozen content}
  targets:
  - entry: bee.governance:database_ref
    path: .resource_ref
- name: database_ref
  kind: registry.entry
  meta: {type: bee.resource_ref}
- name: environment
  kind: env.storage.os
  lifecycle: {auto_start: true}
- name: db_path
  kind: env.variable
  storage: bee.governance:environment
  variable: BEE_GOVERNANCE_DB
  default: .wippy/governance.db
  readonly: true
- name: db
  kind: db.sql.sqlite
  file: ${env:bee.governance:db_path}
  lifecycle: {auto_start: true}
- name: activation_measure
  kind: library.lua
  source: file://activation_measure.lua
  modules: [hash, json]
  imports:
    artifact: bee.governance:artifact
    preflight: bee.governance:preflight
    migration_work: bee.governance:migration_work
    application_admission: bee.governance:governed_application_admission
    canonical: bee.sync:canonical
    bounds: bee.threads.records:bounds
- name: migration_work
  kind: library.lua
  source: file://migration_work.lua
  modules: [hash, json]
  imports:
    artifact: bee.governance:artifact
    canonical: bee.sync:canonical
    preflight: bee.governance:preflight
- name: activation_profiles
  kind: registry.entry
  meta:
    type: bee.governance.activation_profiles
    comment: Host-selected destination mappings and capability ceilings; remote artifacts cannot edit this entry
  data: {profiles: []}
- name: activation_profile_decoder
  kind: library.lua
  source: file://activation_profiles.lua
  modules: [hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.sync:canonical
    application_admission: bee.governance:governed_application_admission
- name: delivery_contract
  kind: contract.definition
  methods:
  - name: call
    description: Discover, stage, review, select and locally activate overlay versions for one destination workspace
- name: delivery_local
  kind: contract.binding
  contracts:
  - contract: bee.governance:delivery_contract
    methods: {call: bee.governance:destination_call}
- name: destination_call
  kind: function.lua
  source: file://destination_method.lua
  method: handle
  modules: [funcs, security]
  imports:
    service: bee.governance.binding:destination_service
    transaction: bee.persist:transaction
    bounds: bee.threads.records:bounds
  security: {policies: [bee.governance.security:destination_facade_policy]}
- name: overlay_contract
  kind: contract.definition
  methods:
  - name: call
    description: Author a caller-owned overlay with revision checks; freeze content without executing or approving it
- name: overlay_local
  kind: contract.binding
  contracts:
  - contract: bee.governance:overlay_contract
    methods: {call: bee.governance:overlay_call}
- name: overlay_call
  kind: function.lua
  source: file://workspace_method.lua
  method: handle
  modules: [funcs, security]
  imports:
    protocol: bee.governance:workspace_protocol
    guide: bee.governance.traits:guide
    transaction: bee.persist:transaction
    bounds: bee.threads.records:bounds
  security: {policies: [bee.governance.security:overlay_facade_policy]}
  meta:
    type: tool
    title: Overlay authoring
    llm_alias: BeeOverlay
    llm_description: Read this destination's component authoring guide, or create, list, read, put, remove or freeze files in your host-admitted private overlay. Writes require the current revision and a stable retry key. Freeze stages measured content only; it neither requests approval nor activates it. Use BeeComponents to inspect installed and Hub components for examples. Binary files use canonical base64. There is no host filesystem or registry access.
    input_schema: |
      {"type":"object","additionalProperties":false,"required":["operation"],"properties":{"operation":{"type":"string","enum":["guide","create","list","read","put","remove","freeze"]},"overlay_id":{"type":"string","minLength":1,"maxLength":160},"expected_revision":{"type":"integer","minimum":0,"maximum":9007199254740990},"idempotency_key":{"type":"string","minLength":1,"maxLength":160},"path":{"type":"string","minLength":1,"maxLength":240},"content":{"type":"string","maxLength":4194304},"content_base64":{"type":"string","maxLength":5592408},"snapshot_digest":{"type":"string","pattern":"^[0-9a-f]{64}$"}}}
- name: authoring_trait
  kind: registry.entry
  meta:
    type: agent.trait
    title: Overlay authoring
    comment: Caller-owned durable staging only; no registry writer or approval capability
  prompt: |
    Read the guide operation first for this destination's component contract and
    one minimal working application example; it names the exact file to freeze.
    Use BeeComponents to inspect installed components and exact Hub package
    entries, documentation and examples before inventing a pattern.
    Use BeeOverlay to author packs and changes as files. `overlay_id` names the
    authored overlay and is distinct from the agent's runtime workspace. Create
    with revision zero; list before editing to obtain the current revision. Put replaces one
    whole file; remove deletes one file. Both need expected_revision and a stable
    idempotency_key. Retry an uncertain write with the identical request and key;
    a changed request needs a new key. On conflict, reread and reconcile first.
    Use content for source text or content_base64 for binary assets. Read returns
    base64 content and a digest. Paths are relative and confined to this virtual
    overlay, not OS paths. Freeze with expected_revision and a retry key to
    retain an exact candidate. Freeze is not approval, installation or execution.
    For a component candidate, write entries.json as a JSON list of complete
    registry entries before freezing. Governance canonicalizes it during the
    separately authorized preparation step; do not construct registry.json.
    Pass snapshot_digest to list/read to inspect that retained candidate instead
    of current files; the returned revision is the frozen revision.
    Host policy admits each overlay operation; this trait grants no authority.
  tools: [bee.governance:overlay_call]
- name: application_delivery_trait
  kind: registry.entry
  meta:
    type: agent.trait
    title: Application delivery
    comment: Request delivery of a frozen application and read its status; publishing the reviewed version is separately gated and still leaves approval to others
  prompt: |
    Use the delivery tool to request delivery of an application you froze: pass
    operation request with the destination `workspace_id`, your source
    `source_overlay_id`, the version and the frozen `snapshot_digest`. The
    destination workspace is the runtime target; the source overlay is the
    caller-owned artifact you froze. It publishes your frozen artifact as
    immutable content, stages that exact version at this destination and returns
    the destination's own preflight verdict, with a diagnostic code, target,
    message and remedy for each finding. Repair a refusal and freeze again.
    When the verdict is ready the person must review and select the plan in
    Overlays, prepare the activation there, approve it in Approvals, and the
    activation owner applies the overlay; opening it is the person's act from
    the start menu. Read its status operation with the same identities, and with
    an intent_id once the person has prepared it, to see the review, selection
    and activation outcome. You cannot review, select, approve or apply, and you
    never write an overlay. Publishing the exact reviewed and applied version is
    a separate, host-requested capability; ask for it, and publish only after
    the person's apply succeeds.
  tools: [bee.governance:delivery_call]
- name: application_publish_trait
  kind: registry.entry
  meta:
    type: agent.trait
    title: Application publish
    comment: Publish the exact locally reviewed and applied version; never review, approve or apply
  prompt: |
    Use BeePublish only after a person has reviewed, selected, prepared,
    approved and had the activation owner apply the exact version you delivered.
    It publishes that one version to this destination's publication feed and
    refuses any version that is not the locally reviewed and applied one. It
    grants no review, selection, approval, activation or overlay authority.
  tools: [bee.governance:delivery_call]
