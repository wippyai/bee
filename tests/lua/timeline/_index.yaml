version: '1.0'
namespace: bee.threads.timeline
entries:
- name: format_test
  kind: function.lua
  source: file://format_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    format: bee.threads.timeline.app:format
    record: bee.threads.records:record
- name: policy_test
  kind: function.lua
  source: file://policy_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [security]
  imports:
    test: wippy.test:test
    model: bee.threads.timeline.app:model
- name: model_test
  kind: function.lua
  source: file://model_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [json]
  imports:
    test: wippy.test:test
    model: bee.threads.timeline.app:model
- name: view_test
  kind: function.lua
  source: file://view_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [tty]
  imports:
    test: wippy.test:test
    model: bee.threads.timeline.app:model
    view: bee.threads.timeline.app:view
    appearance: bee.ui:appearance
- name: surface_test
  kind: function.lua
  source: file://surface_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "120s"}
  modules: [funcs, security, tty]
  security:
    policies: [bee.threads:client_test_policy, bee.security.threads:thread_create_policy, bee.security.threads:thread_observe_policy, bee.security.threads:thread_lifecycle_policy]
  imports:
    bounds: bee.values:bounds
    test: wippy.test:test
    model: bee.threads.timeline.app:model
    view: bee.threads.timeline.app:view
    caller: bee.app:caller
    appearance: bee.ui:appearance
    harness: bee.threads:harness
