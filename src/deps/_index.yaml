    value: bee:workers
  - name: bee.harness:target_agent_application_admission
    value:
      definition_id: bee.harness.app:app
      scope_management: true
      close_grace_ms: 60000
      policies:
      - bee.harness.security:carrier_policy
      - bee.harness.security:interactive_session_policy
