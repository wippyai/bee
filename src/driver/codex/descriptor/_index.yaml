          group: model/provider
          security_class: free
          section: advanced
          order: 258
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=0.160.1'
            config_schema_ref: bee.driver.codex.descriptor:cli
          render:
          - kind: config
            contexts:
            - window
            - first_turn
            - resume
            file: .codex/config.toml
            format: toml
            path:
            - model_verbosity
            merge: set
            value:
              field: provider.options.verbosity
        personality:
          id: personality
          path: provider.options.personality
          value_schema:
            type: string
            enum:
            - none
