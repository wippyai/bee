version: '1.0'
namespace: bee.security.threads
entries:
- name: thread_storage_policy
  kind: security.policy
  policy:
    actions: [db.get]
    resources: [bee.threads:db]
    effect: allow
- name: thread_resource_policy
  kind: security.policy
  policy:
    actions: [registry.get]
    resources: [bee.threads:database_ref]
    effect: allow
