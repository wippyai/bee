version: '1.0'
namespace: bee.sync.env
entries:
- name: database_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: Linked SQL resource; empty until a host selects target_db
- name: environment
  kind: env.storage.os
  lifecycle: {auto_start: true}
- name: db_path
  kind: env.variable
  storage: bee.sync.env:environment
  variable: BEE_SYNC_DB
  default: .wippy/sync.db
  readonly: true
- name: db
  kind: db.sql.sqlite
  file: ${env:bee.sync.env:db_path}
  lifecycle: {auto_start: true}
- name: exports_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: Linked host export configuration; target_exports fills resource_ref
- name: resources
  kind: library.lua
  source: file://resources.lua
  modules: [registry]
