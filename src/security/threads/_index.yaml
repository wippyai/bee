version: '1.0'
namespace: bee.security.threads
entries:
- name: thread_storage_policy
  kind: security.policy.expr
  policy:
    expression: (resource != "bee.persist.env:startup_progress" && action != "env.set" && action != "env.get") || (action in ["env.get", "env.set"] && resource == "bee.persist.env:startup_progress")
    actions:
    - env.get
    - env.set
    - db.get
    resources:
    - bee.persist.env:startup_progress
    - bee.threads.env:db
    effect: allow
- name: thread_node_policy
  kind: security.policy
  meta: {comment: Action inbox destination checks the runtime's native node identity}
  policy:
    actions: [system.read]
    resources: [node]
    effect: allow
- name: thread_resource_policy
  kind: security.policy
  policy:
    actions:
    - registry.get
    resources:
    - bee.threads.env:database_ref
    effect: allow
- name: thread_authority_client_policy
  kind: security.policy
  policy:
    actions:
    - contract.open
    - contract.call
    - funcs.call
    resources:
    - bee.threads.binding:authority_local
    - create
    - get
    - list
    - join
    - leave
    - close
    - record
    - read_after
    - bee.threads.binding:create
    - bee.threads.binding:get
    - bee.threads.binding:list
    - bee.threads.binding:join
    - bee.threads.binding:leave
    - bee.threads.binding:close
    - bee.threads.binding:record
    - bee.threads.binding:read_after
    effect: allow
- name: application_thread_membership_policy
  kind: security.policy
  meta:
    comment: Broker-only executor for owner-authenticated application membership reconciliation
  policy:
    actions: [funcs.call]
    resources: [bee.threads.binding:get, bee.threads.binding:join, bee.threads.binding:leave]
    effect: allow
- name: application_thread_alias_policy
  kind: security.policy
  meta:
    comment: Application broker executor for live instance attestation, retirement and family fencing
  policy:
    actions: [bee.threads.app_alias]
    resources: ['*']
    effect: allow
- name: application_thread_alias_call_policy
  kind: security.policy
  meta:
    comment: Application broker transport for alias attestation operations
  policy:
    actions: [funcs.call]
    resources: [bee.threads.binding:register_app_alias, bee.threads.binding:retire_app_alias, bee.threads.binding:fence_app]
    effect: allow
- name: application_thread_facade_policy
  kind: security.policy
  meta:
    comment: Broker-only executor for one authenticated application's active bound thread
  policy:
    actions: [funcs.call]
    resources: [bee.threads.binding:read_after, bee.threads.binding:record,
      bee.threads.binding:subscribe, bee.threads.binding:page,
      bee.threads.binding:ack_page, bee.threads.binding:resume,
      bee.threads.binding:unsubscribe]
    effect: allow
- name: thread_lifecycle_client_policy
  kind: security.policy
  policy:
    actions:
    - contract.open
    - contract.call
    - funcs.call
    resources:
    - bee.threads.binding:lifecycle_local
    - admit_action
    - prepare_attempt
    - start_attempt
    - request_turn
    - end_turn
    - receipt
    - bee.threads.binding:admit_action
    - bee.threads.binding:prepare_attempt
    - bee.threads.binding:start_attempt
    - bee.threads.binding:request_turn
    - bee.threads.binding:end_turn
    - bee.threads.binding:receipt
    effect: allow
- name: thread_delivery_client_policy
  kind: security.policy
  policy:
    actions:
    - contract.open
    - contract.call
    - funcs.call
    resources:
    - bee.threads.binding:delivery_local
    - claim
    - dispatch
    - ack
    - release
    - expire
    - reconcile
    - subscribe
    - page
    - ack_page
    - unsubscribe
    - resume
    - close_subscription
    - forget_subscription
    - wait
    - watch
    - bee.threads.binding:delivery_claim
    - bee.threads.binding:dispatch
    - bee.threads.binding:ack
    - bee.threads.binding:release
    - bee.threads.binding:expire
    - bee.threads.binding:reconcile
    - bee.threads.binding:subscribe
    - bee.threads.binding:page
    - bee.threads.binding:ack_page
    - bee.threads.binding:unsubscribe
    - bee.threads.binding:resume
    - bee.threads.binding:close_subscription
    - bee.threads.binding:forget_subscription
    - bee.threads.binding:wait
    - bee.threads.binding:watch
    effect: allow
- name: thread_create_policy
  kind: security.policy
  policy:
    actions:
    - bee.threads.create
    resources: '*'
    effect: allow
- name: thread_workspace_list_policy
  kind: security.policy
  meta:
    comment: List the threads any workspace owns, without membership; for node-level workspace viewers
  policy:
    actions:
    - bee.threads.workspace
    resources: '*'
    effect: allow
- name: thread_observe_policy
  kind: security.policy
  policy:
    actions:
    - bee.threads.observe
    resources: '*'
    effect: allow
- name: thread_lifecycle_policy
  kind: security.policy
  policy:
    actions:
    - bee.threads.lifecycle
    resources: '*'
    effect: allow
- name: thread_carrier_policy
  kind: security.policy
  policy:
    actions:
    - bee.threads.carrier
    resources: '*'
    effect: allow
- name: thread_approval_policy
  kind: security.policy
  meta:
    comment: Held by the approval authority's delivery worker only
  policy:
    actions:
    - bee.threads.approval
    resources: '*'
    effect: allow
- name: thread_approval_client_policy
  kind: security.policy
  policy:
    actions:
    - contract.open
    - contract.call
    - funcs.call
    resources:
    - bee.threads.binding:approvals_local
    - append
    - bee.threads.binding:append
    effect: allow
- name: thread_waiter_policy
  kind: security.policy.expr
  policy:
    actions:
    - process.registry.register
    - process.send
    resources: '*'
    expression: action == "process.send" || resource == "bee.threads.waiter"
    effect: allow
- name: thread_outbox_pump_policy
  kind: security.policy.expr
  meta:
    comment: Selected by the host for the forwarding pump; it reaches the shared outbox tables and nothing else, and the host links its transport separately
  policy:
    expression: (resource != "bee.persist.env:startup_progress" && action != "env.set" && action != "env.get") || (action in ["env.get", "env.set"] && resource == "bee.persist.env:startup_progress")
    actions: [db.get, registry.get, system.read, process.registry.lookup, process.listen, process.unlisten, process.send, channel.select, env.set, env.get]
    resources: '*'
    effect: allow
- name: thread_sessions_owner_policy
  kind: security.policy
  meta:
    comment: Grant only to the Sessions owner for canonical session, work and turn operations
  policy:
    actions: [bee.threads.sessions_owner]
    resources: '*'
    effect: allow
