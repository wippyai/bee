  method: run
  meta: {type: test, suite: bee}
  modules: [base64]
  imports:
    test: wippy.test:test
    artifact: bee.governance:artifact
    publication_service: bee.governance:publication_service
- name: plan_test_db
  kind: db.sql.sqlite
  meta: {type: test_support}
  file: .wippy/governance-plan-test.db
  lifecycle: {auto_start: true}
- name: destination_test_db
  kind: db.sql.sqlite
  meta: {type: test_support}
  file: .wippy/governance-destination-test.db
  lifecycle: {auto_start: true}
- name: destination_refusal_test_db
