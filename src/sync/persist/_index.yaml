version: '1.0'
namespace: bee.sync.persist
entries:
- name: store
  kind: library.lua
  source: file://store.lua
  modules: [sql, json, time]
  imports:
    limits: bee.sync.values:limits
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    database: bee.persist:database
    transaction: bee.persist:transaction
- name: replicas
  kind: library.lua
  source: file://replicas.lua
