version: '1.0'
namespace: bee.drivers.pi.binding
entries:
- name: configure
  kind: function.lua
  source: file://configure.lua
  method: handle
  imports:
    configure_protocol: bee.drivers:configuration_types
    shared: bee.drivers.binding:configuration
    bounds: bee.drivers.values:bounds
    canonical: bee.drivers.values:canonical
    universal: bee.drivers.binding:universal
  modules: [hash]
- name: binding
  kind: contract.binding
  contracts:
  - contract: bee.drivers:driver
    methods:
      prepare: bee.drivers.universal:prepare
      dispatch: bee.drivers.universal:dispatch
      normalize: bee.drivers.universal:normalize
      configure: bee.drivers.pi.binding:configure
  - contract: bee.drivers:locate_facet
    methods:
      locate: bee.drivers.universal:locate
  meta:
    type: harness.driver
    driver_id: pi
    descriptor_ref: bee.drivers.pi.descriptor:cli
    credential_format_ref: bee.drivers.pi.credentials:credential_format
    accepts_model: true
    profiles_ref: bee.drivers.pi.profiles:profiles
