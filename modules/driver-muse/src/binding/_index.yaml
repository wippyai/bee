version: '1.0'
namespace: bee.driver.muse.binding
entries:
- name: prepare
  kind: function.lua
  source: file://prepare.lua
  method: handle
  imports:
    universal: bee.driver:universal
- name: dispatch
  kind: function.lua
  source: file://dispatch.lua
  method: handle
  imports:
    universal: bee.driver:universal
- name: configure
  kind: function.lua
  source: file://configure.lua
  method: handle
  imports:
    configuration: bee.driver.muse:configuration
    configure_protocol: bee.driver:configuration
    universal: bee.driver:universal
  security:
    policies:
    - bee.driver.muse.binding:configuration_policy
- name: locate
  kind: function.lua
  source: file://locate.lua
  method: handle
  imports:
    universal: bee.driver:universal
- name: normalize
  kind: function.lua
  source: file://normalize.lua
  method: handle
  imports:
    universal: bee.driver:universal
- name: configuration_policy
  kind: security.policy.expr
  meta:
    comment: Read only the descriptor that declares this configuration renderer
  policy:
    effect: allow
    actions:
    - registry.get
    - registry.snapshot
    resources:
    - '*'
    expression: (action == "registry.get" && resource == "bee.driver.muse.descriptor:cli")
      || action == "registry.snapshot"
