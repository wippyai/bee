version: '1.0'
namespace: bee.approvals
entries:
- name: test_principals
  kind: library.lua
  source: file://test_principals.lua
  meta: {type: test_support}
  modules: [uuid, security, funcs]
- name: apply_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [registry.apply]
    resources: '*'
    effect: allow
- name: client_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.approvals.binding:effect, bee.approvals.binding:effect_queue, bee.approvals.binding:events, bee.approvals.binding:end_request, bee.approvals.binding:grant, bee.approvals.binding:grant_window, bee.approvals.binding:node_summary, bee.approvals.binding:runtime_lease, bee.approvals.binding:request, bee.approvals.binding:decide, bee.approvals.binding:withdraw, bee.approvals.binding:consume, bee.approvals.binding:revalidate, bee.approvals.binding:read, bee.approvals.binding:inbox, bee.approvals.binding:feed_snapshot, bee.approvals.binding:feed_read_after, bee.approvals.binding:list, bee.approvals.binding:deliveries, bee.approvals.binding:reconcile, bee.approvals.binding:capabilities, bee.threads.binding:append, bee.threads.binding:create, bee.threads.binding:get, bee.threads.binding:read_after, bee.threads.binding:watch]
    effect: allow
- name: manage_test_policy
  kind: security.policy
  meta: {type: test_support, comment: A workspace manager reads any request and returns exhausted deliveries to the queue}
  policy:
    actions: [bee.approvals.manage]
    resources: '*'
    effect: allow
- name: test_db
  kind: db.sql.sqlite
  meta: {type: test_support}
  file: .wippy/approvals-test.db
  lifecycle:
    auto_start: true
- name: summary_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call, bee.approvals.summary]
    resources: [bee.approvals.binding:node_summary, node]
    effect: allow
- name: store_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [db.get]
    resources: [bee.approvals:test_db]
    effect: allow
- name: attention_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [events.subscribe]
    resources: [bee.attention]
    effect: allow
- name: hive_test
  kind: function.lua
  source: file://hive_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [funcs, security, registry, system, process, channel, time]
  security:
    policies: [bee.approvals:apply_test_policy, bee.approvals:client_test_policy, bee.security.approvals:approval_store_policy, bee.security.approvals:approval_request_policy]
  imports:
    support: bee.approvals:test_principals
    principals: bee.tests.principals:bound
    bounds: bee.values:bounds
    test: wippy.test:test
    protocol: bee.hive:protocol
- name: service_test
  kind: function.lua
  source: file://service_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [funcs, security, registry, time, sql, process, channel, json, events]
  security:
    policies: [bee.approvals:attention_test_policy, bee.approvals:apply_test_policy, bee.approvals:store_test_policy, bee.tests.support:schema_policy, bee.security.approvals:approval_store_policy, bee.security.approvals:approval_request_policy, bee.security.approvals:approval_decide_policy, bee.security.approvals:approval_consume_policy, bee.security.approvals:approval_owner_policy]
  imports:
    support: bee.approvals:test_principals
    principals: bee.tests.principals:bound
    bounds: bee.values:bounds
    test: wippy.test:test
    service: bee.approvals.binding:service
    worker: bee.approvals.service:worker
    resources: bee.approvals.env:resources
    outbox: bee.approvals.persist:outbox
    dispatch: bee.approvals.persist:dispatch
    schema: bee.tests.support:schema
    demand: bee.process:demand
    thread_harness: bee.tests.threads:harness
- name: lease_flow_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [db.get, registry.apply, funcs.call]
    resources: '*'
    effect: allow
- name: lease_flow_test
  kind: function.lua
  source: file://lease_flow_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [funcs, security, registry, uuid]
  security:
    policies: [bee.approvals:lease_flow_test_policy, bee.security.approvals:approval_request_policy, bee.security.approvals:approval_decide_policy, bee.security.approvals:approval_consume_policy, bee.security.approvals:approval_store_policy, bee.security.approvals:approval_owner_policy]
  imports:
    principals: bee.tests.principals:bound
    test: wippy.test:test
    capability_model: bee.capability:model
    bounds: bee.values:bounds
    lease_grants: bee.gov.binding:lease_grants
    lease_store: bee.gov.persist:lease_store
    service: bee.approvals.binding:service
- name: runtime_lease_test
  kind: function.lua
  source: file://runtime_lease_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [funcs, security, registry, uuid, time]
  security: {policies: [bee.approvals:apply_test_policy, bee.security.approvals:approval_store_policy, bee.security.approvals:approval_owner_policy]}
  imports: {test: wippy.test:test, service: bee.approvals.binding:service, lease: bee.approvals.types:runtime_lease, bounds: bee.values:bounds}

- name: window_test
  kind: function.lua
  source: file://window_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [sql, registry, uuid]
  security:
    policies: [bee.approvals:apply_test_policy, bee.approvals:store_test_policy, bee.tests.support:schema_policy, bee.security.approvals:approval_store_policy, bee.security.approvals:approval_request_policy, bee.security.approvals:approval_decide_policy, bee.security.approvals:approval_owner_policy]
  imports:
    test: wippy.test:test
    bounds: bee.values:bounds
    service: bee.approvals.binding:service
    schema: bee.tests.support:schema
- name: migration_test_db
  kind: db.sql.sqlite
  meta: {type: test_support}
  file: .wippy/approvals-migration-test.db
  lifecycle: {auto_start: true}
- name: migration_test
  kind: function.lua
  source: file://migration_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [sql, funcs, hash]
  imports:
    test: wippy.test:test
    clock: bee.values:clock
    service: bee.approvals.binding:service
    bounds: bee.values:bounds
  security:
    policies: [bee.approvals:migration_test_policy, bee.tests.support:schema_policy, bee.security.approvals:approval_consume_policy]
- name: migration_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [db.get]
    resources: [bee.approvals:migration_test_db]
    effect: allow
- name: fixture_effect_consumer
  kind: registry.entry
  meta:
    type: bee.approvals.effect-consumer
    destination: fixture.effect
    operation_ref: bee.test:effect
    worker_name: bee.test.effect_worker
- name: effect_demand_db
  kind: db.sql.sqlite
  file: .wippy/effect-demand.db
  meta: {type: test_support}
  lifecycle: {auto_start: true}
- name: effect_demand_test
  kind: function.lua
  source: file://effect_demand_test.lua
  method: run
  modules: [sql, process, events, channel, time, system]
  meta: {type: test, suite: a_demand_effects, timeout: 60s}
  imports:
    test: wippy.test:test
    bounds: bee.values:bounds
    dispatch: bee.approvals.persist:dispatch
    resources: bee.approvals.env:resources
    demand: bee.process:demand
    principals: bee.approvals:test_principals
