version: '1.0'
namespace: bee.driver.codex
entries:
- name: definition
  kind: ns.definition
  module: driver-codex
  readme: file://README.md
  meta:
    title: Bee Codex driver
    comment: Optional harness binding; host activation and launch policies authorize its use
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: host_environment
  kind: ns.requirement
  meta:
    comment: Read-only host environment that supplies the selected Codex executable
  default: bee.harness.host:environment
  targets:
  - entry: bee.driver.codex.env:executable
    path: .storage
- name: window_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Codex window route
  default: bee.driver.codex.security:launch_policy_codex_window
  targets:
  - entry: bee.driver.codex.profiles:default_window
    path: .data.policy_ref
- name: batch_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned bounded Codex batch route
  default: bee.driver.codex.security:launch_policy_codex_batch
  targets:
  - entry: bee.driver.codex.profiles:research_batch
    path: .data.policy_ref
- name: named_batch_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Codex named-profile batch route
  default: bee.driver.codex.security:launch_policy_codex_named_batch
  targets:
  - entry: bee.driver.codex.profiles:named_batch
    path: .data.policy_ref
- name: dependency_values
  kind: ns.dependency
  component: bee/values
  version: '*'
