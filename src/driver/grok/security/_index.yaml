version: '1.0'
namespace: bee.driver.grok.security
entries:
- name: launch_policy_grok_batch
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected Grok turn budget for agentic research actions on a caller-owned thread
  data:
    schema_revision: bee.launch-policy@3
    allowed_overrides:
    - thread
    - workdir
    required_cleanup: process_group
    required_exit_observation: independent

    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables: {}
    executable_env:
      grok: bee.driver.grok.env:executable
    environment: {}
    allow_host_home: false
    gateway_tools:
    - session_catalog
    - profile_get
    - profile_list
    - profile_put
    - session_open
    - session_run
    - session_send
    - session_await
    - session_join
    - session_get
    - session_list
    - session_cancel
    - session_close
    - thread_read
    - thread_message
    - question
    profile_instructions: true
    prepare_options:
      permission_mode: default
    placement_profiles:
    - bee.placement.profiles:native
    - bee.placement.docker.profiles:coding
    profile_restrictions:
      provider.effort:
      - low
      - medium
      - high
- name: launch_policy_grok_window
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected executable binding for the component-owned Grok window; missing host executable leaves the declaration
      unavailable
  data:
    schema_revision: bee.launch-policy@3
    allowed_overrides:
    - thread
    - workdir
    required_cleanup: process_group
    required_exit_observation: independent

    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables: {}
    executable_env:
      grok: bee.driver.grok.env:executable
    environment: {}
    gateway_tools:
    - session_catalog
    - profile_get
    - profile_list
    - profile_put
    - session_open
    - session_run
    - session_send
    - session_await
    - session_join
    - session_get
    - session_list
    - session_cancel
    - session_close
    - thread_read
    - thread_message
    - question
    - capabilities
    - overlay
    - docs
    - components
    - install_request
    - uninstall_request
    - install_status
    - delivery
    - tests
    - app_tools
    - publish
    gateway_surface:
      access:
        policy: agent-access
        traits:
        - bee.app:share
        - bee.app:tools
        - bee.hub:library
    gateway_hooks:
    - SessionStart
    - UserPromptSubmit
    - PreToolUse
    - PostToolUse
    - Stop
    hook_command_ref: bee.gateway.env:hook_executable
    profile_instructions: true
    prepare_options: {}
    placement_profiles:
    - bee.placement.profiles:native
    - bee.placement.docker.profiles:coding
    profile_restrictions:
      provider.model:
        kind: declared
      provider.permission_mode:
        kind: declared
      provider.effort:
      - low
      - medium
      - high
