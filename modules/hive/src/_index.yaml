version: '1.0'
namespace: bee.hive
entries:
- name: definition
  kind: ns.definition
  module: hive
  readme: file://README.md
  meta:
    title: Bee hive
    comment: Cross-node protocol envelopes, client, open telemetry and registry catalog; host composition and policy selection remain in Bee
- name: bounds
  kind: library.lua
  source: file://bounds.lua
- name: canonical
  kind: library.lua
  source: file://canonical.lua
  modules: [json]
- name: types
  kind: library.lua
  source: file://types.lua
  modules: [hash]
  imports:
    canonical: bee.hive:canonical
    bounds: bee.hive:bounds
- name: client
  kind: library.lua
  source: file://client.lua
  modules: [process, channel, time, uuid]
  imports: {types: bee.hive:types, bounds: bee.hive:bounds}
- name: catalog
  kind: library.lua
  source: file://catalog.lua
  modules: [registry, security, json, hash]
  imports:
    canonical: bee.hive:canonical
    bounds: bee.hive:bounds
    types: bee.hive:types
- name: principals
  kind: library.lua
  source: file://principals.lua
  modules: [hash]
  imports:
    types: bee.hive:types
    bounds: bee.hive:bounds
- name: output
  kind: library.lua
  source: file://output.lua
  modules: [json]
  imports:
    canonical: bee.hive:canonical
- name: invoke_check
  kind: function.lua
  source: file://invoke_check.lua
  method: handle
  modules: [security]
  imports:
    catalog: bee.hive:catalog
    bounds: bee.hive:bounds
