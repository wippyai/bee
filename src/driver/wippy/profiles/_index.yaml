version: '1.0'
namespace: bee.driver.wippy.profiles
entries:
- name: profiles
  kind: registry.entry
  meta:
    type: harness.profile
    driver_ref: bee.driver.wippy.binding:binding
  data:
    driver:
      schema_revision: bee.driver@1
      kind: harness
      title: Wippy Native Agent
      implementation_version: 0.1.0
      default_profile: session
      profiles:
      - id: session
        mode: session
        protocol: native
        protocol_revision: native-1
        answer_path:
          strategy: terminal_field
          adapter_ref: bee.driver.wippy.binding:binding
        resume:
          strategy: in-process
          portable: true
        isolation_env:
          variables: []
          private_home: false
        exit_codes_trustworthy: true
        permission_exchange:
          mode: none
        input_ready:
          strategy: none
          timeout_ms: 0
        interrupt:
          methods:
          - runner_cancel
      - id: batch
        mode: batch
        protocol: native
        protocol_revision: native-1
        answer_path:
          strategy: terminal_field
          adapter_ref: bee.driver.wippy.binding:binding
        resume:
          strategy: in-process
          portable: true
        isolation_env:
          variables: []
          private_home: false
        exit_codes_trustworthy: true
        permission_exchange:
          mode: none
        input_ready:
          strategy: none
          timeout_ms: 0
        interrupt:
          methods:
          - runner_cancel
