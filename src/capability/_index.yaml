version: '1.0'
namespace: bee.capability
entries:
- name: model
  kind: library.lua
  source: file://model.lua
  imports:
    bounds: bee.values:bounds
- name: catalog
  kind: registry.entry
  meta:
    type: bee.capability_catalog
    comment: Host-owned review vocabulary and templates for the capabilities a governed application or an agent attempt may request; declarations are not grants. modules names the runtime modules a granted
      application may load; tools names the gateway tools through which an agent attempt exercises the grant
  data:
    revision: 4
    never:
    - env
    - credentials
    - registry.write
    - security.policy.write
    - security.scope.manage
    - approvals.decide
    - core.database
    - lifecycle.auto_start
    capabilities:
    - id: workspace.files.read
      revision: 1
      parameters:
        subpath: relative_subpath
      text: Read workspace files under {subpath}
      confirm: standard
      policies:
      - operation: files.read
        resource: workspace
        scope:
          subpath: $subpath
      resources:
      - kind: fs.directory
        mode: readonly
        source: verified_workspace_subroot
    - id: workspace.files.write
      revision: 1
      parameters:
        subpath: relative_subpath
      text: Write workspace files under {subpath}
      confirm: explicit
      policies:
      - operation: files.write
        resource: workspace
        scope:
          subpath: $subpath
      resources:
      - kind: fs.directory
        mode: readwrite
        source: verified_workspace_subroot
    - id: app.database
      revision: 1
      parameters:
        name: name
      text: Use an isolated application database named {name}
      confirm: standard
      policies:
      - operation: database.use
        resource: $name
        scope:
          name: $name
      resources:
      - kind: db.sql.sqlite
        mode: dedicated
        source: host_app_database
    - id: threads.read
      revision: 1
      parameters:
        scope: owned_scope
      text: Read owned threads
      confirm: standard
      policies:
      - operation: threads.read
        resource: threads
        scope:
          scope: $scope
      resources: []
    - id: threads.message
      revision: 1
      parameters:
        scope: children_scope
      text: Message child threads
      confirm: standard
      policies:
      - operation: threads.message
        resource: threads
        scope:
          scope: $scope
      resources: []
    - id: agents.launch
      revision: 1
      parameters:
        definitions: definitions
      text: Launch managed agents from {definitions}
      confirm: explicit
      modules:
      - contract
      policies:
      - operation: agents.launch
        resource: managed_agents
        scope:
          definitions: $definitions
      resources: []
    - id: contract.call
      revision: 1
      parameters:
        binding: binding
        methods: methods
      text: Call app binding {binding} using {methods}
      confirm: explicit
      modules:
      - contract
      policies:
      - operation: contract.call
        resource: $binding
        scope:
          methods: $methods
      resources:
      - kind: contract.binding
        mode: caller
        source: host_selected_binding
    - id: http.api
      revision: 1
      parameters:
        origin: https_origin
        methods: http_methods
        path_prefix: url_path_prefix
      text: Send HTTP requests to {origin} at {path_prefix} using {methods}
      confirm: explicit
      tools:
      - http_request
      policies:
      - operation: http.request
        resource: $origin
        scope:
          methods: $methods
          path_prefix: $path_prefix
      resources:
      - kind: http.client
        mode: scoped
        source: host_selected_origin
    - id: process.exec
      revision: 1
      parameters:
        command: command
        directory: relative_subpath
      text: Run {command}, followed by any further arguments, in workspace folder {directory} with your user's full file and network access and no environment beyond the host PATH
      confirm: explicit
      modules:
      - exec
      tools:
      - process_run
      policies:
      - operation: process.exec
        resource: $command
        scope:
          subpath: $directory
      resources:
      - kind: exec.native
        mode: scoped
        source: host_generated_executor
    - id: hive.expose
      revision: 2
      parameters:
        operations: hive_operations
        mode: hive_mode
        audiences: hive_audiences
      text: Expose Hive operations {operations} in {mode} mode to {audiences}
      confirm: explicit
      policies:
      - operation: hive.expose
        resource: $mode
        scope:
          operations: $operations
          audiences: $audiences
      resources:
      - kind: hive.operations
        mode: exposed
        source: host_selected_operations
    - id: hive.view
      revision: 1
      parameters: {}
      text: View Hive cluster membership
      confirm: standard
      policies:
      - operation: hive.view
        resource: cluster
        scope: {}
      resources: []
    - id: desktop.application_stop
      revision: 1
      parameters: {}
      text: Stop running applications from the process view
      confirm: explicit
      policies:
      - operation: desktop.application_stop
        resource: applications
        scope: {}
      resources: []
    - id: hub.manage
      revision: 1
      parameters: {}
      text: Plan and apply Hub component changes
      confirm: explicit
      policies:
      - operation: hub.manage
        resource: components
        scope: {}
      resources: []
    - id: hub.self_update
      revision: 1
      parameters: {}
      text: Update Bee's live deployment root
      confirm: explicit
      policies:
      - operation: hub.self_update
        resource: bee/bee
        scope: {}
      resources: []
    - id: gov.delivery.manage
      revision: 1
      parameters: {}
      text: Prepare and publish governed delivery versions
      confirm: explicit
      policies:
      - operation: gov.delivery.manage
        resource: overlays
        scope: {}
      resources: []
    - id: gov.delivery.activate
      revision: 1
      parameters: {}
      text: Activate accepted governed delivery versions
      confirm: explicit
      policies:
      - operation: gov.delivery.activate
        resource: overlays
        scope: {}
      resources: []
- name: app_database_root
  kind: env.variable
  storage: bee:os
  variable: BEE_APP_DATABASE_ROOT
  default: .wippy/app-db
  readonly: true
- name: app_databases
  kind: fs.directory
  meta:
    comment: Holds the isolated databases granted to governed applications, under Bee state and outside every readable workspace tree
  directory: ${env:bee.capability:app_database_root}
  base: project
  auto_init: true
  mode: '0700'
