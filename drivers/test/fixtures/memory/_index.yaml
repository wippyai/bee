version: '1.0'
namespace: bee.drivers.tests.memory
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: [funcs, security, hash]
  imports: {bounds: bee.drivers.values:bounds}
  meta:
    type: bee.application
    application:
      api_version: 1
      lifetime: view
      title: Tiny memory fixture
      revision: '1'
      instance_policy: multiple
- name: trait
  kind: registry.entry
  meta:
    type: agent.trait
    title: Remember completed turns
    application_ref: bee.drivers.tests.memory:app
  data:
    prompt: Remember facts from completed turns.
    tools: []
    listens: [turn.completed]
- name: read_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [registry.get, registry.find, registry.snapshot]
    resources: ['*']
    effect: allow
- name: host
  kind: library.lua
  source: file://host.lua
  modules: [funcs, security, json, http_client, system, events, channel, time, process, sql]
  imports:
    owner_observer: bee.drivers.tests.support:owner_observer
    approval_effect: bee.drivers.tests.support:approval_effect
    bounds: bee.drivers.values:bounds
    gateway: bee.gateway.binding:gateway
    traits: bee.gateway.security:traits
    harness: bee.drivers.tests.threads:harness
    app_identity: bee.drivers.records:app_identity
    configuration: bee.gateway.env:configuration
- name: host_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [http_client.request, http_client.private_ip, bee.gateway.materialize, cdc.stream, funcs.call, funcs.security, funcs.context, security.actor.create, security.scope.create, security.policy.get, registry.get, registry.find, registry.snapshot, registry.apply, registry.update.registry.entry, registry.update.process.lua, bee.gateway.manage, bee.sessions.hook_boundary, bee.threads.carrier, system.read, events.subscribe, process.monitor, process.registry.lookup, process.registry.register, process.registry.unregister, process.listen, process.send, bee.threads.app_alias, bee.approvals.read, bee.approvals.decide, bee.approvals.grant, db.get]
    resources: ['*']
    effect: allow
- name: client_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: ['bee.threads.binding:subscribe', 'bee.threads.binding:page', 'bee.threads.binding:ack_page', 'bee.threads.binding:resume', 'bee.threads.binding:read_after', 'bee.threads.binding:search', 'bee.threads.binding:timeline', 'bee.threads.binding:get', 'bee.threads.binding:create', 'bee.threads.binding:record', 'bee.drivers.tests.memory:run', 'bee.drivers.tests.memory:revoke_during_hook', 'bee.drivers.tests.memory:hold_hook', 'bee.drivers.tests.memory:advance_hook_clock', 'bee.threads.binding:hook_original']
    effect: allow
- name: all_events
  kind: registry.entry
  meta: {type: agent.trait, title: Observe session events, application_ref: 'bee.drivers.tests.memory:app'}
  data:
    prompt: Observe session events.
    tools: []
    listens: [session.started, session.ended, prompt.submitted, tool.before, tool.after, turn.completed]
- name: run
  kind: function.lua
  source: file://app.lua
  method: run
  meta: {type: test_support}
  modules: [funcs, security, hash]
  imports: {bounds: bee.drivers.values:bounds}
- name: index_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [bee.threads.create, bee.threads.observe]
    resources: ['*']
    effect: allow
- name: tools_trait
  kind: registry.entry
  meta: {type: agent.trait, title: Memory tools, application_ref: 'bee.drivers.tests.memory:app'}
  data:
    prompt: Read the session thread and remember completed turns.
    tools: [thread_read]
    listens: [turn.completed]

- name: review
  kind: registry.entry
  meta: {type: agent.trait, title: Review}
  data: {prompt: Review changes., tools: []}

- name: outside
  kind: registry.entry
  meta:
    type: agent.trait
    title: Outside parent ceiling
  data:
    prompt: Outside parent ceiling.
    tools: []
- name: hooks_a
  kind: registry.entry
  meta: {type: agent.trait, title: Hook A, application_ref: 'bee.drivers.tests.memory:app'}
  data: {prompt: Apply hook A., tools: [], hooks: [session.start, prompt.submit, tool.before, tool.after]}
- name: hooks_b
  kind: registry.entry
  meta: {type: agent.trait, title: Hook B, application_ref: 'bee.drivers.tests.memory:app'}
  data: {prompt: Apply hook B., tools: [], hooks: [session.start, prompt.submit, tool.before, tool.after]}
- name: remember_hook
  kind: registry.entry
  meta: {type: agent.trait, title: Remember and recall, application_ref: 'bee.drivers.tests.memory:app'}
  data: {prompt: Remember completed turns., tools: [], listens: [turn.completed], hooks: [prompt.submit]}
- name: prompt_hook
  kind: registry.entry
  meta: {type: agent.trait, title: Prompt hook, application_ref: 'bee.drivers.tests.memory:app'}
  data: {prompt: Review prompts., tools: [], hooks: [prompt.submit]}
- name: tools_hook
  kind: registry.entry
  meta: {type: agent.trait, title: Tool hook, application_ref: 'bee.drivers.tests.memory:app'}
  data: {prompt: Review tools., tools: [], hooks: [tool.before]}
- name: after_hook
  kind: registry.entry
  meta: {type: agent.trait, title: Result hook, application_ref: 'bee.drivers.tests.memory:app'}
  data: {prompt: Review results., tools: [], hooks: [tool.after]}
- name: extension_hook
  kind: function.lua
  source: file://hook.lua
  method: hook
  meta: {type: bee.session.hook, application_ref: 'bee.drivers.tests.memory:app', application_revision: '1'}
  modules: [security, funcs, hash, channel]
  imports: {bounds: bee.drivers.values:bounds}
- name: admission
  kind: registry.entry
  meta: {type: bee.node.application_admission}
  data:
    bindings:
    - definition_id: bee.drivers.tests.memory:app
      policies: [bee.drivers.tests.memory:client_policy, bee.drivers.tests.memory:index_policy]
- name: test_agent
  kind: registry.entry
  meta: {type: agent.gen1, title: Hook fixture agent}
  data:
    prompt: Follow the fixture prompt.
    tools: [bee.drivers.tests.memory:test_tool]
    traits: []
    delegates: []
    memory: []
    context: {}
    tuning: {}
    declinable: []
- name: test_tool
  kind: function.lua
  source: file://tool.lua
  method: handle
  modules: [sql]
  imports: {bounds: bee.drivers.values:bounds}
  meta:
    type: tool
    title: Hook fixture tool
    llm_alias: FileReport
    llm_description: Record execution of the hook fixture tool.
    input_schema: '{"type":"object","properties":{"text":{"type":"string"},"mode":{"type":"string"}},"additionalProperties":false}'
    output_schema: '{"type":"object"}'
  security: {policies: [bee.threads.security:store]}
- name: revoke_during_hook
  kind: function.lua
  source: file://revoke_hook.lua
  method: handle
  modules: [sql, security, funcs]
  imports: {bounds: bee.drivers.values:bounds}
  security: {policies: [bee.drivers.tests.memory:host_policy]}
- name: schema
  kind: function.lua
  source: file://schema.lua
  method: run
  meta: {type: migration, target_db: 'bee:db', timestamp: '2026-10-10T20:01:00Z', test_support: true}
  imports: {migration: 'wippy.migration:migration'}
- name: hold_hook
  kind: function.lua
  source: file://hold_hook.lua
  method: handle
  modules: [process]
  imports: {bounds: bee.drivers.values:bounds}
  security: {policies: [bee.drivers.tests.memory:host_policy]}
- name: advance_hook_clock
  kind: function.lua
  source: file://advance_hook_clock.lua
  method: handle
  modules: [sql]
  security: {policies: [bee.drivers.tests.memory:host_policy]}
- name: hook_clock_schema
  kind: function.lua
  source: file://hook_clock_schema.lua
  method: run
  meta: {type: migration, target_db: 'bee:db', timestamp: '2026-10-10T20:02:00Z', test_support: true}
  imports: {migration: 'wippy.migration:migration'}
