version: '1.0'
namespace: bee.hub
entries:
- name: migration_runner_db
  kind: db.sql.sqlite
  file: .wippy/hub-migration-runner.db
  meta: {type: test_support}
- name: migration_binding_db
  kind: db.sql.sqlite
  file: .wippy/hub-migration-binding.db
  meta: {type: test_support}
- name: migration_runner_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [db.get, funcs.call, funcs.security, security.scope.create, security.policy.get]
    resources: [bee.hub:migration_runner_db, bee.hub:migration_binding_db, bee.hub:test_default_migration, bee.hub:test_custom_migration, bee.hub:test_governance_migration, bee.hub:test_bound_migration, bee.hub:governance_migration_grant_policy, security, without]
    effect: allow
- name: migration_binding_deny_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [db.get]
    resources: [demo:ungranted]
    effect: deny
- name: governance_migration_grant_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [db.get, funcs.call]
    resources: [bee.hub:migration_runner_db, bee.hub:test_governance_migration]
    effect: allow
- name: test_default_migration
  kind: function.lua
  source: file://migration_runner_probe.lua
  method: run
  modules: [sql, security]
  meta: {type: migration, target_db: bee.hub:migration_runner_db, timestamp: '2026-09-19T10:00:00Z'}
- name: test_custom_migration
  kind: function.lua
  source: file://migration_runner_probe.lua
  method: run
  modules: [sql, security]
  meta: {type: migration, target_db: bee.hub:migration_runner_db, timestamp: '2026-09-19T11:00:00Z'}
- name: test_governance_migration
  kind: function.lua
  source: file://migration_runner_probe.lua
  method: run
  modules: [sql, security]
  meta: {type: migration, target_db: bee.hub:migration_runner_db, timestamp: '2026-09-19T12:00:00Z'}
- name: test_bound_migration
  kind: function.lua
  source: file://migration_runner_probe.lua
  method: run
  modules: [sql, security]
  meta: {type: migration, target_db: 'demo:data', timestamp: '2026-09-19T13:00:00Z'}
- name: governance_migration_effect_test
  kind: function.lua
  source: file://governance_migration_effect_test.lua
  method: run
  modules: [json]
  meta: {type: test, suite: bee}
  security:
    policies:
    - bee.hub:migration_runner_test_policy
    - bee.governance.security:destination_service_policy
    - bee.governance.security:destination_execution_policy
  imports:
    test: wippy.test:test
    effect: bee.governance.binding:migration_effect
    migration_runner: bee.hub.binding:migration_runner
- name: migration_runner_test
  kind: function.lua
  source: file://migration_runner_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [security]
  security:
    policies:
    - bee.hub:migration_runner_test_policy
    - bee.hub:migration_binding_deny_policy
    - bee.hub.security:execution_policy
    - bee.hub.security:publisher_policy
    - bee.hub.security:worker_policy
    - bee.hub.security:worker_host_policy
    - bee.hub.security:migration_context_policy
    - bee.governance.security:destination_service_policy
    - bee.governance.security:destination_execution_policy
  imports:
    test: wippy.test:test
    migration_runner: bee.hub.binding:migration_runner
    migrations: bee.hub:migrations
- name: requirements_test
  kind: function.lua
  source: file://requirements_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    requirements: bee.hub:requirements
- name: host_resources_test
  kind: function.lua
  source: file://host_resources_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    host_resources: bee.hub.registry:host_resources
- name: inspect_test
  kind: function.lua
  source: file://inspect_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    inspect: bee.hub.binding:inspect
    inspection: bee.hub:inspection
    inventory: bee.hub:inventory
    installed: bee.hub.registry:inventory_reader
