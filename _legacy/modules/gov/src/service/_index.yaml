version: '1.0'
namespace: bee.gov.service
entries:
- name: recovery_cli
  kind: process.lua
  source: file://recovery_cli.lua
  method: main
  modules: [io]
  imports: {recovery: bee.gov.binding:recovery_service}
  meta:
    comment: Headless host activation rollback selected by the native launch command
    command:
      name: bee-gov
      host: bee:terminal
      short: Run headless host governance recovery
      security:
        actor: {id: bee.gov.recovery}
        policies: [bee.gov.security:recovery_command_policy]
- name: recovery
  kind: process.lua
  source: file://recovery.lua
  method: main
  modules: [process]
  imports: {service: bee.gov.binding:destination_service}
