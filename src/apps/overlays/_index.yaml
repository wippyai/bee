version: '1.0'
namespace: bee.apps.overlays
entries:
- name: model
  kind: library.lua
  source: file://model.lua
  imports:
    bounds: bee.values:bounds
    preflight: bee.gov.binding:preflight
- name: view
  kind: library.lua
  source: file://view.lua
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    model: bee.apps.overlays:model
    text: bee.ui:text
- name: destination_client
  kind: security.policy
  meta:
    comment: Overlays calls only the destination-owned governance facade, which authorizes each delivery operation before entering its private scope
  policy:
    actions:
    - funcs.call
    resources:
    - bee.gov.binding:destination_call
    effect: allow
- name: delivery_operations
  kind: security.policy
  meta:
    comment: The person operating Overlays reads, stages, reviews, selects and activates delivered versions in any workspace of this node; the approval decision stays with the approval owner
  policy:
    actions:
    - bee.gov.delivery.read
    - bee.gov.delivery.manage
    - bee.gov.delivery.activate
    resources: '*'
    effect: allow
- name: app
  kind: process.lua
  meta:
    type: bee.app
    application:
      api_version: 1
      title: Overlays
      lifetime: view
      revision: '1'
      instance_policy: singleton
      menus: [bee.shell:system_menu]
  source: file://app.lua
  method: main
  modules:
  - tty
  - process
  - channel
  - uuid
  - funcs
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    model: bee.apps.overlays:model
    view: bee.apps.overlays:view
  security:
    policies:
    - bee.apps.overlays:destination_client
    - bee.apps.overlays:delivery_operations