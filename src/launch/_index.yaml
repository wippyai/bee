version: '1.0'
namespace: bee.launch
entries:
- name: startup_environment
  kind: env.storage.memory
- name: startup_error
  kind: env.variable
  storage: bee.launch:startup_environment
  variable: error
  default: ''
- name: ownership
  kind: library.lua
  source: file://ownership.lua
- name: owner_handoff
  kind: library.lua
  source: file://owner_handoff.lua
  imports:
    contract: bee.protocol:application
- name: desktop_lifecycle
  kind: library.lua
  source: file://desktop_lifecycle.lua
  modules: [process, security, channel, time, uuid, logger]
  imports:
    desktops: bee.client.binding:desktops
    attachments: bee.client.binding:attachments
    decode: bee.protocol:decode
    protocol: bee.launch:protocol
    contract: bee.protocol:application
    retained_protocol: bee.launch:retained_protocol
    handoff: bee.client.types:handoff
- name: desktop_storage
  kind: library.lua
  source: file://desktop_storage.lua
  modules: [funcs, channel, time]
  imports:
    contract: bee.protocol:application
- name: retained_protocol
  kind: library.lua
  source: file://retained_protocol.lua
  imports:
    types: bee.hive:types
    bounds: bee.values:bounds
    arguments: bee.app:arguments
    clipboard: bee.client.types:clipboard
    contract: bee.protocol:application
- name: headless
  kind: process.lua
  source: file://headless.lua
  method: main
  modules: [process, channel, security, time, logger]
  imports:
    protocol: bee.launch:protocol
    decode: bee.protocol:decode
    workspaces: bee.workspace.types:selection
  meta:
    command:
      name: bee-host
      host: bee:terminal
      short: Run a local workspace without a desktop
      security:
        actor: {id: bee.local}
        policies: [bee.security.desktop:host_policy, bee.security.desktop:local_supervisor_spawn_policy]
- name: bootstrap
  kind: library.lua
  source: file://bootstrap.lua
  modules: [process, channel, tty, security, time]
  imports:
    physical: bee.launch:display
    input_decode: bee.terminal.types:input
    contract: bee.protocol:application
    decode: bee.protocol:decode
    workspaces: bee.workspace.types:selection
    edit_mode_recovery: bee.gov.binding:super_edit_recovery_call
    boot_fallback: bee.launch:boot_fallback
    projection: bee.desktop.types:projection
- name: boot_fallback
  kind: library.lua
  source: file://boot_fallback.lua
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  imports:
    contract: bee.protocol:application
    decode: bee.desktop.types:projection
- name: supervisor
  kind: process.lua
  source: file://supervisor.lua
  method: main
  modules: [process, channel, security, ctx, time, uuid, logger]
  imports: &supervisor_imports
    leases: bee.workspace.client:host_leases
    workspaces: bee.workspace.types:selection
    desktop_lifecycle: bee.launch:desktop_lifecycle
    desktop_storage: bee.launch:desktop_storage
    desktops: bee.client.binding:desktops
    attachments: bee.client.binding:attachments
    retained_protocol: bee.launch:retained_protocol
    protocol: bee.launch:protocol
    contract: bee.protocol:application
    decode: bee.protocol:decode
    interaction: bee.app:interaction
- name: retained
  kind: process.lua
  source: file://supervisor.lua
  method: retained
  modules:
  - process
  - channel
  - security
  - ctx
  - time
  - uuid
  - logger
  imports:
    leases: bee.workspace.client:host_leases
    workspaces: bee.workspace.types:selection
    desktop_lifecycle: bee.launch:desktop_lifecycle
    desktop_storage: bee.launch:desktop_storage
    desktops: bee.client.binding:desktops
    attachments: bee.client.binding:attachments
    retained_protocol: bee.launch:retained_protocol
    protocol: bee.launch:protocol
    contract: bee.protocol:application
    decode: bee.protocol:decode
    interaction: bee.app:interaction
- name: owner
  kind: process.lua
  source: file://owner.lua
  method: main
  modules: [process, channel, security, time, logger, io, system, registry, ctx, uuid, env]
  imports: &owner_imports
    retained: bee.launch:retained_protocol
    ownership: bee.launch:ownership
    startup_progress: bee.app.status:startup_progress
    decode: bee.protocol:decode
    workspaces: bee.workspace.types:selection
    command_stop: bee.launch:command_stop
    owner_handoff: bee.launch:owner_handoff
  meta:
    comment: Retained workspace owner selected by the native launch host under the runtime state lock
    command:
      name: bee-owner
      host: bee:terminal
      short: Run the retained Bee workspace owner
      security:
        actor: {id: bee.local}
        policies: [bee.security.desktop:desktop_policy, bee.security.desktop:retained_owner_spawn_policy, bee.security.desktop:retained_owner_name_policy, bee.security.desktop:retained_owner_node_policy, bee.security.desktop:startup_progress_policy, bee.security.desktop:owner_command_stop_policy]
- name: daemon
  kind: process.lua
  source: file://daemon.lua
  method: main
  modules: [process, channel, time, io, system, logger, env]
  imports:
    startup_progress: bee.app.status:startup_progress
    leases: bee.workspace.client:host_leases
    command_stop: bee.launch:command_stop
    types: bee.hive:types
  meta:
    comment: The node daemon selected by the native launch host under the runtime state lock; it composes no folder workspace
    command:
      name: bee-daemon
      host: bee:terminal
      short: Run the node's services without a folder workspace
      security:
        actor: {id: bee.local}
        policies: [bee.security.desktop:retained_owner_node_policy, bee.security.desktop:startup_progress_policy, bee.security.desktop:owner_command_stop_policy]
- name: command_stop
  kind: library.lua
  source: file://command_stop.lua
  modules: [process, channel, system]
  imports:
    owner_stop: bee.hive.types:owner_stop
    types: bee.hive:types
- name: hosts
  kind: library.lua
  source: file://hosts.lua
- name: host_manager
  kind: process.lua
  source: file://host_manager.lua
  method: main
  modules: [process, channel, security, time, uuid, logger]
  imports:
    clock: bee.values:clock
    hosts: bee.launch:hosts
    leases: bee.workspace.client:host_leases
    protocol: bee.launch:protocol
    decode: bee.protocol:decode
    contract: bee.protocol:application
- name: display
  kind: library.lua
  source: file://display.lua
  modules: [tty]
  imports:
    chrome: bee.terminal:chrome
    appearance: bee.ui:appearance
