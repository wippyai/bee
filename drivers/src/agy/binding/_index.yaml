version: '1.0'
namespace: bee.drivers.agy.binding
entries:
- name: configure
  kind: function.lua
  source: file://configure.lua
  method: handle
  imports:
    configuration: bee.drivers.agy.binding:configuration
    configure_protocol: bee.drivers:configuration_types
    universal: bee.drivers.binding:universal
- name: configuration
  kind: library.lua
  source: file://configuration.lua
  modules:
  - hash
  imports:
    canonical: bee.drivers.values:canonical
    configure_protocol: bee.drivers.binding:configuration
    quote: bee.drivers.binding:quote
    hook_limits: bee.drivers.binding:hook_limits
    configure_protocol_types: bee.drivers:configuration_types
- name: binding
  kind: contract.binding
  contracts:
  - contract: bee.drivers:driver
    methods:
      prepare: bee.drivers.universal:prepare
      dispatch: bee.drivers.universal:dispatch
      normalize: bee.drivers.universal:normalize
      configure: bee.drivers.agy.binding:configure
  - contract: bee.drivers:locate_facet
    methods:
      locate: bee.drivers.universal:locate
  meta:
    type: harness.driver
    driver_id: agy
    descriptor_ref: bee.drivers.agy.descriptor:cli
    credential_format_ref: bee.drivers.agy.credentials:credential_format
    accepts_model: true
    profiles_ref: bee.drivers.agy.profiles:profiles
