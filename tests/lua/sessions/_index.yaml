- name: fake_get
  kind: function.lua
  source: file://fake_owner.lua
  method: get
  meta: {type: test_support}
  modules: [security]
  imports: {protocol: bee.threads.sessions.types:protocol, sessions: bee.threads.sessions.client:sessions, principals: bee.tests.principals:bound, bounds: bee.values:bounds}

- name: fake_cancel
  kind: function.lua
  source: file://fake_owner.lua
  method: cancel
  meta: {type: test_support}
  modules: [security]
  imports: {protocol: bee.threads.sessions.types:protocol, sessions: bee.threads.sessions.client:sessions, principals: bee.tests.principals:bound, bounds: bee.values:bounds}

- name: fake_close
  kind: function.lua
  source: file://fake_owner.lua
  method: close
  meta: {type: test_support}
  modules: [security]
  imports: {protocol: bee.threads.sessions.types:protocol, sessions: bee.threads.sessions.client:sessions, principals: bee.tests.principals:bound, bounds: bee.values:bounds}

- name: fake_list
  kind: function.lua
  source: file://fake_owner.lua
  method: list
  meta: {type: test_support}
  modules: [security]
  imports: {protocol: bee.threads.sessions.types:protocol, sessions: bee.threads.sessions.client:sessions, principals: bee.tests.principals:bound, bounds: bee.values:bounds}

- name: fake_catalog
  kind: function.lua
  source: file://fake_owner.lua
  method: catalog
  meta: {type: test_support}
  modules: [security]
  imports: {protocol: bee.threads.sessions.types:protocol, sessions: bee.threads.sessions.client:sessions, principals: bee.tests.principals:bound, bounds: bee.values:bounds}

- name: probe
  kind: function.lua
  source: file://probe.lua
  method: run
  meta: {type: test_support}
  imports:
    bounds: bee.values:bounds
    sessions: bee.threads.sessions.client:sessions
- name: probe_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: ['*']
    resources: ['*']
    effect: allow
- name: protocol_test
  kind: function.lua
  source: file://protocol_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    protocol: bee.threads.sessions.types:protocol
- name: client_test
  kind: function.lua
  source: file://client_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [funcs, security]
  imports:
    bounds: bee.values:bounds
    test: wippy.test:test
    sessions: bee.threads.sessions.client:sessions
    protocol: bee.threads.sessions.types:protocol
- name: wiring_test
  kind: function.lua
  source: file://wiring_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry, security, funcs]
  imports:
    test: wippy.test:test
    journal: bee.threads.sessions.binding:threads_journal
  security:
    policies: [bee.tests.sessions:probe_policy]
- name: fake_history
  kind: function.lua
  source: file://fake_owner.lua
  method: history
  meta: {type: test_support}
  modules: [security]

  imports: {protocol: bee.threads.sessions.types:protocol, sessions: bee.threads.sessions.client:sessions, principals: bee.tests.principals:bound, bounds: bee.values:bounds}

- name: interactive_exited
  kind: function.lua
  source: file://interactive_placement.lua
  modules: [security]
  method: exited
  meta: {type: test_support}
- name: interactive_running
  kind: function.lua
  source: file://interactive_placement.lua
  modules: [security]
  method: running
  meta: {type: test_support}
- name: resume_probe_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [process.registry.lookup, process.send]
    resources: ['*']
    effect: allow
- name: resume_probe
  kind: function.lua
  source: file://resume_probe.lua
  method: handle
  meta: {type: test_support}
  modules: [process]
  security:
    policies: [bee.tests.sessions:resume_probe_policy]
- name: type_probe
  kind: function.lua
  source: file://resume_probe.lua
  method: type_text
  meta: {type: test_support}
  modules: [process]
  security:
    policies: [bee.tests.sessions:resume_probe_policy]
- name: interactive_lifecycle_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call, bee.sessions.attach]
    resources: ['*']
    effect: allow

- name: cancellation_owner_running
  kind: function.lua
  source: file://interactive_placement.lua
  method: owner_running
  modules: [security]
  meta: {type: test_support}
- name: cancellation_owner_stop
  kind: function.lua
  source: file://interactive_placement.lua
  method: owner_stop
  modules: [security]
  meta: {type: test_support}
- name: hook_boundary_probe
  kind: function.lua
  source: file://hook_boundary_probe.lua
  method: handle
  meta: {type: test_support}
  imports:
    boundary: bee.gateway.api:session_boundary
    bounds: bee.values:bounds
    subject_call: bee.gateway.security:subject_call
  security:
    policies: [bee.gateway.security:execute_policy, bee.gateway.security:session_boundary_resolver_policy, bee.gateway.security:session_boundary_policy]

- name: attention_test
  kind: function.lua
  source: file://attention_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [funcs, security]
  imports:
    test: wippy.test:test
    harness: bee.tests.threads:harness

- name: fixtures
  kind: library.lua
  source: file://fake_owner.lua
  meta: {type: test_support}
  imports: {bounds: bee.values:bounds, principals: bee.tests.principals:bound, sessions: bee.threads.sessions.client:sessions, protocol: bee.threads.sessions.types:protocol}

- name: await_test_caller
  kind: security.policy
  meta:
    type: test_support
    comment: A workspace agent calling the Sessions owner's await and join
  policy:
    actions:
    - funcs.call
    resources:
    - bee.threads.sessions.binding:await
    - bee.threads.sessions.binding:join
    - bee.threads.sessions.binding:restore
    effect: allow
- name: await_test
  kind: function.lua
  source: file://await_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: 120s}
  modules:
  - funcs
  - security
  imports:
    test: wippy.test:test
    bounds: bee.values:bounds
    harness: bee.tests.threads:harness
