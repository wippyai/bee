        argv:
        - render: model
          context: window
        - render: config_profile
          context: window
        - render: effort
          context: window
        - render: sandbox
          context: window
        - render: approval_policy
          context: window
        - render: dangerously_bypass_approvals_and_sandbox
          context: window
        - if: resume_ref
