version: '1.0'
namespace: bee.sync.hive
entries:
- name: admission
  kind: library.lua
  source: file://admission.lua
  modules: [funcs, security, system]
  imports:
    types: bee.hive:types
    bounds: bee.protocol:bounds
    canonical: bee.protocol:canonical
    catalog: bee.hive:catalog
    version: bee.sync:version
    output: bee.hive:output
- name: admit
  kind: function.lua
  source: file://admit.lua
  method: handle
  imports: {admission: bee.sync.hive:admission}
  security: {policies: [bee.security.hive:hive_replica_admission_policy]}
