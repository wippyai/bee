version: '1.0'
namespace: bee.threads.delivery
entries:
- name: claims
  kind: library.lua
  source: file://claims.lua
  modules: [sql]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    values: bee.threads.records:values
    record_types: bee.threads.records:types
    access: bee.threads.service:access
    reader: bee.threads.persist:reader
    transaction: bee.threads.persist:transaction
    owner: bee.threads.persist:owner
    authority: bee.threads.service:authority
- name: subscriptions
  kind: library.lua
  source: file://subscriptions.lua
  modules: [sql, hash, json]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    values: bee.threads.records:values
    record: bee.threads.records:record
    record_types: bee.threads.records:types
    reader: bee.threads.persist:reader
    transaction: bee.threads.persist:transaction
    owner: bee.threads.persist:owner
    authority: bee.threads.service:authority
- name: waits
  kind: library.lua
  source: file://waits.lua
  modules: [sql, process, channel, time, uuid]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    record: bee.threads.records:record
    record_types: bee.threads.records:types
    reader: bee.threads.persist:reader
    transaction: bee.threads.persist:transaction
    authority: bee.threads.service:authority
    claims: bee.threads.delivery:claims
- name: waiter
  kind: process.lua
  source: file://waiter.lua
  method: main
  modules: [process, channel, time]
  imports:
    waits: bee.threads.delivery:waits
- name: waiter_service
  kind: process.service
  process: bee.threads.delivery:waiter
  host: bee:workers
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.threads.waiter}
      policies: [bee.security.threads:thread_waiter_policy]
    restart:
      max_attempts: 10
- name: claim
  kind: function.lua
  source: file://claim_method.lua
  method: handle
  imports:
    boundary: bee.threads.service:boundary
    claims: bee.threads.delivery:claims
    types: bee.threads.service:types
  security:
    policies: [bee.security.threads:thread_storage_policy, bee.security.threads:thread_resource_policy]
