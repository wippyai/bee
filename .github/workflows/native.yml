name: Native Bee
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Application version for a local-preview artifact build
        type: string
        default: 0.1.0-dev
permissions:
  contents: read
concurrency:
  group: native-bee-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.shards.outputs.value }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: native/go.mod
        cache: false
    - name: Locate Go caches
      id: go-paths
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - name: Cache Go builds and modules
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: |
          ${{ steps.go-paths.outputs.build }}
          ${{ steps.go-paths.outputs.modules }}
        key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum', 'native/go.mod', 'build/builder.lock.json') }}-${{ github.job }}
        restore-keys: |
          go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum', 'native/go.mod', 'build/builder.lock.json') }}-
          go-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Check workflows and scan for secrets
      run: make repository-check
    - name: Validate release tag
      if: github.ref_type == 'tag'
      run: |
        number='(0|[1-9][0-9]*)'
        identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
        pattern="^v$number\.$number\.$number(-$identifier(\.$identifier)*)?$"
        [[ "$GITHUB_REF_NAME" =~ $pattern ]]
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main
    - name: Verify the native pin names the tagged tree
      if: github.ref_type == 'tag'
      run: make native-pin-check NATIVE_PIN_COMMIT="$GITHUB_SHA"
    - name: Select check shards
      id: shards
      run: echo "value=$(python3 build/check_shards.py --names)" >> "$GITHUB_OUTPUT"
  unit:
    name: Bee lint and unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: native/go.mod
        cache: false
    - name: Locate Go caches
      id: go-paths
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - name: Cache Go builds and modules
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: |
          ${{ steps.go-paths.outputs.build }}
          ${{ steps.go-paths.outputs.modules }}
        key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum', 'native/go.mod', 'build/builder.lock.json') }}-${{ github.job }}
        restore-keys: |
          go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum', 'native/go.mod', 'build/builder.lock.json') }}-
          go-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Select pinned runtime cache keys
      id: runtime-key
      run: python3 build/verify_cached_toolchain.py keys >> "$GITHUB_OUTPUT"
    - name: Cache pinned toolchain and builder
      id: toolchain-cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: .wippy/bin
        key: toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.toolchain }}-${{ hashFiles('build/verify_cached_toolchain.py') }}
    - name: Verify cached toolchain
      if: steps.toolchain-cache.outputs.cache-hit == 'true'
      run: python3 build/verify_cached_toolchain.py verify
    - name: Build pinned native development runtime
      id: toolchain
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      uses: wippyai/builder@114eb0252a121dd89eca084af5db01833ffff50b
      with:
        mode: toolchain
        manifest: wippy.build.json
        output: .wippy/bin/bee-wippy
    - name: Record toolchain digests
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      env:
        BUILDER_BINARY: ${{ steps.toolchain.outputs.builder }}
      run: |
        install -m 755 "$BUILDER_BINARY" .wippy/bin/wippy-builder
        python3 build/verify_cached_toolchain.py record
    - name: Cache Lua compilation
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: .wippy/test-cache
        key: lua-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.runtime }}-${{ hashFiles('**/*.lua') }}-${{ github.job }}
        restore-keys: |
          lua-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.runtime }}-${{ hashFiles('**/*.lua') }}-
          lua-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.runtime }}-
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - run: python3 -m pip install -r tests/requirements.txt
    - name: Lint
      run: make lint WIPPY="$PWD/.wippy/bin/bee-wippy"
    - name: Lua unit suite
      run: make test WIPPY="$PWD/.wippy/bin/bee-wippy"
  pack:
    name: Bee packs
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: native/go.mod
        cache: false
    - name: Locate Go caches
      id: go-paths
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - name: Cache Go builds and modules
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: |
          ${{ steps.go-paths.outputs.build }}
          ${{ steps.go-paths.outputs.modules }}
        key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum', 'native/go.mod', 'build/builder.lock.json') }}-${{ github.job }}
        restore-keys: |
          go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum', 'native/go.mod', 'build/builder.lock.json') }}-
          go-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Select pinned runtime cache keys
      id: runtime-key
      run: python3 build/verify_cached_toolchain.py keys >> "$GITHUB_OUTPUT"
    - name: Cache pinned toolchain and builder
      id: toolchain-cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: .wippy/bin
        key: toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.toolchain }}-${{ hashFiles('build/verify_cached_toolchain.py') }}
    - name: Verify cached toolchain
      if: steps.toolchain-cache.outputs.cache-hit == 'true'
      run: python3 build/verify_cached_toolchain.py verify
    - name: Build pinned native development runtime
      id: toolchain
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      uses: wippyai/builder@114eb0252a121dd89eca084af5db01833ffff50b
      with:
        mode: toolchain
        manifest: wippy.build.json
        output: .wippy/bin/bee-wippy
    - name: Record toolchain digests
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      env:
        BUILDER_BINARY: ${{ steps.toolchain.outputs.builder }}
      run: |
        install -m 755 "$BUILDER_BINARY" .wippy/bin/wippy-builder
        python3 build/verify_cached_toolchain.py record
    - name: Cache Lua compilation
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: .wippy/test-cache
        key: lua-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.runtime }}-${{ hashFiles('**/*.lua') }}-${{ github.job }}
        restore-keys: |
          lua-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.runtime }}-${{ hashFiles('**/*.lua') }}-
          lua-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.runtime }}-
    # Every target embeds these sealed packs, and Hub publication uploads the
    # same bytes from the release's deployment archive.
    - name: Seal the application packs once
      env:
        REQUESTED_VERSION: ${{ inputs.version || '0.1.0-dev' }}
      run: |
        version="$REQUESTED_VERSION"
        if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
        make native-pack BEE_VERSION="$version"
        make hub-check BEE_VERSION="$version"
        tar -cf sealed-packs.tar dist/bee.bundle.build.json dist/native-packs dist/portable-deployments dist/portable-deployment
        tar -czf dist/bee-deployment.tar.gz -C dist/portable-deployment/ .
        (cd dist && sha256sum bee-deployment.tar.gz > bee-deployment.tar.gz.sha256)
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: sealed-packs
        path: sealed-packs.tar
        if-no-files-found: error
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bee-deployment
        path: |
          dist/bee-deployment.tar.gz
          dist/bee-deployment.tar.gz.sha256
        if-no-files-found: error
    # Pack compilation warms the source tree for the release checks and builds.
    - name: Archive warm Lua compilation
      run: tar -cf warm-compile-cache.tar .wippy/test-cache
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: warm-compile-cache
        path: warm-compile-cache.tar
        if-no-files-found: error
  check:
    name: Bee check (${{ matrix.shard }})
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [validate, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.validate.outputs.shards) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: native/go.mod
        cache: false
    - name: Locate Go caches
      id: go-paths
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - name: Cache Go builds and modules
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: |
          ${{ steps.go-paths.outputs.build }}
          ${{ steps.go-paths.outputs.modules }}
        key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum', 'native/go.mod', 'build/builder.lock.json') }}-${{ github.job }}
        restore-keys: |
          go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum', 'native/go.mod', 'build/builder.lock.json') }}-
          go-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Select pinned runtime cache keys
      id: runtime-key
      run: python3 build/verify_cached_toolchain.py keys >> "$GITHUB_OUTPUT"
    - name: Cache pinned toolchain and builder
      id: toolchain-cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: .wippy/bin
        key: toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.toolchain }}-${{ hashFiles('build/verify_cached_toolchain.py') }}
    - name: Verify cached toolchain
      if: steps.toolchain-cache.outputs.cache-hit == 'true'
      run: python3 build/verify_cached_toolchain.py verify
    - name: Build pinned native development runtime
      id: toolchain
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      uses: wippyai/builder@114eb0252a121dd89eca084af5db01833ffff50b
      with:
        mode: toolchain
        manifest: wippy.build.json
        output: .wippy/bin/bee-wippy
    - name: Record toolchain digests
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      env:
        BUILDER_BINARY: ${{ steps.toolchain.outputs.builder }}
      run: |
        install -m 755 "$BUILDER_BINARY" .wippy/bin/wippy-builder
        python3 build/verify_cached_toolchain.py record
    - name: Cache Lua compilation
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: .wippy/test-cache
        key: lua-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.runtime }}-${{ hashFiles('**/*.lua') }}-${{ github.job }}
        restore-keys: |
          lua-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.runtime }}-${{ hashFiles('**/*.lua') }}-
          lua-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.runtime }}-
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: warm-compile-cache
    - name: Restore warm Lua compilation
      run: tar -xf warm-compile-cache.tar && rm warm-compile-cache.tar
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - run: python3 -m pip install -r tests/requirements.txt
    - name: Check shard
      env:
        SHARD: ${{ matrix.shard }}
      run: make "check-shard-$SHARD" WIPPY="$PWD/.wippy/bin/bee-wippy"
  build:
    name: Bee (${{ matrix.goos }}/${{ matrix.goarch }})
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: pack
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - {goos: linux, goarch: amd64, runner: ubuntu-24.04}
        - {goos: linux, goarch: arm64, runner: ubuntu-24.04-arm}
        - {goos: darwin, goarch: amd64, runner: macos-26-intel}
        - {goos: darwin, goarch: arm64, runner: macos-26}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: native/go.mod
        cache: false
    - name: Locate Go caches
      id: go-paths
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - name: Cache Go builds and modules
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: |
          ${{ steps.go-paths.outputs.build }}
          ${{ steps.go-paths.outputs.modules }}
        key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum', 'native/go.mod', 'build/builder.lock.json') }}-${{ github.job }}
        restore-keys: |
          go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum', 'native/go.mod', 'build/builder.lock.json') }}-
          go-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Select pinned runtime cache keys
      id: runtime-key
      run: python3 build/verify_cached_toolchain.py keys >> "$GITHUB_OUTPUT"
    - name: Cache pinned toolchain and builder
      id: toolchain-cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: .wippy/bin
        key: toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.toolchain }}-${{ hashFiles('build/verify_cached_toolchain.py') }}
    - name: Verify cached toolchain
      if: steps.toolchain-cache.outputs.cache-hit == 'true'
      run: python3 build/verify_cached_toolchain.py verify
    - name: Build pinned native development runtime
      id: toolchain
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      uses: wippyai/builder@114eb0252a121dd89eca084af5db01833ffff50b
      with:
        mode: toolchain
        manifest: wippy.build.json
        output: .wippy/bin/bee-wippy
    - name: Record toolchain digests
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      env:
        BUILDER_BINARY: ${{ steps.toolchain.outputs.builder }}
      run: |
        install -m 755 "$BUILDER_BINARY" .wippy/bin/wippy-builder
        python3 build/verify_cached_toolchain.py record
    - name: Cache Lua compilation
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: .wippy/test-cache
        key: lua-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.runtime }}-${{ hashFiles('**/*.lua') }}-${{ github.job }}
        restore-keys: |
          lua-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.runtime }}-${{ hashFiles('**/*.lua') }}-
          lua-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.runtime }}-
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: warm-compile-cache
    - name: Restore warm Lua compilation
      run: tar -xf warm-compile-cache.tar && rm warm-compile-cache.tar
    - name: Verify runner architecture
      env:
        EXPECTED_OS: ${{ matrix.goos }}
        EXPECTED_ARCH: ${{ matrix.goarch }}
      run: |
        test "$(go env GOOS)" = "$EXPECTED_OS"
        test "$(go env GOARCH)" = "$EXPECTED_ARCH"
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - run: python3 -m pip install -r tests/requirements.txt
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: sealed-packs
    - name: Restore the sealed packs
      run: tar -xf sealed-packs.tar && rm sealed-packs.tar
    - name: Native module checks
      run: make native-check
    - name: Installer checks
      if: matrix.goos != 'linux' || matrix.goarch != 'amd64'
      run: make installer-check
    - name: Assemble application
      id: assemble
      env:
        BUILDER_BINARY: ${{ github.workspace }}/.wippy/bin/wippy-builder
        REQUESTED_VERSION: ${{ inputs.version || '0.1.0-dev' }}
        GH_TOKEN: ${{ github.token }}
      run: |
        version="$REQUESTED_VERSION"
        if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
        make standalone-sealed BUILDER="$BUILDER_BINARY"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    # Ubuntu runners restrict unprivileged user namespaces through AppArmor;
    # the offline checks isolate the network in one as the runner user.
    - name: Allow unprivileged user namespaces
      if: matrix.goos == 'linux'
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Verify source-free portable deployment
      if: matrix.goos == 'linux'
      run: tests/portable_deployment.sh "$PWD/.wippy/bin/bee-wippy" "$PWD/dist/portable-deployment"
    - name: Verify standalone desktop
      if: matrix.goos == 'darwin'
      run: make native-binary-check
    - name: Verify offline standalone desktop
      if: matrix.goos == 'linux'
      run: make native-binary-offline-check
    - name: Archive binary and provenance
      env:
        BUILDER_BINARY: ${{ github.workspace }}/.wippy/bin/wippy-builder
        TARGET: ${{ matrix.goos }}-${{ matrix.goarch }}
      run: '"$BUILDER_BINARY" package dist/bee --output "dist/bee-$TARGET.tar.gz"'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bee-${{ matrix.goos }}-${{ matrix.goarch }}
        path: |
          dist/bee-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          dist/bee-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
        if-no-files-found: error
  required:
    name: Bee CI
    if: always()
    needs: [validate, unit, pack, check, build]
    runs-on: ubuntu-24.04
    steps:
    - name: Require every selected job
      env:
        RESULTS: ${{ needs.validate.result }},${{ needs.unit.result }},${{ needs.pack.result }},${{ needs.check.result }},${{ needs.build.result }}
        RELEASE_RUN: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
      run: |
        expected=success,success,skipped,skipped,skipped
        if [ "$RELEASE_RUN" = true ]; then expected=success,success,success,success,success; fi
        test "$RESULTS" = "$expected"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: required
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: bee-*
        merge-multiple: true
        path: artifacts
    - name: Verify archive checksums
      working-directory: artifacts
      run: sha256sum -c ./*.sha256
    - name: Prepare draft release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        release_flags=(--latest)
        if [[ "$RELEASE_TAG" == *-* ]]; then
          release_flags=(--prerelease --latest=false)
        fi
        gh release create "$RELEASE_TAG" artifacts/* install.sh --verify-tag --draft --generate-notes "${release_flags[@]}"
