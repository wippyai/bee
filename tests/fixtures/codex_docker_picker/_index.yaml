version: '1.0'
namespace: bee.codex_docker_picker_fixture
entries:
- name: evidence
  kind: fs.directory
  directory: evidence
  auto_init: true
- name: evidence_policy
  kind: security.policy
  policy:
    actions: [fs.get]
    resources: [bee.codex_docker_picker_fixture:evidence]
    effect: allow
- name: registry_policy
  kind: security.policy
  policy:
    actions: [registry.apply]
    resources: '*'
    effect: allow
- name: test
  kind: function.lua
  source: file://main.lua
  method: run
  modules: [process, channel, time, security, tty, registry, fs]
  imports:
    appearance: bee.desktop:appearance
  security:
    policies: [bee:desktop_policy, bee:core_spawn_policy, bee.codex_docker_picker_fixture:evidence_policy, bee.codex_docker_picker_fixture:registry_policy]
  meta: {type: test, suite: bee, timeout: '60s'}
