version: '1.0'
namespace: bee.harness.service
entries:
- name: presentation
  kind: library.lua
  source: file://presentation.lua
  modules:
  - process
  - channel
  - time
  - uuid
  - hash
  - security
  - funcs
  - json
  - tty
  imports:
    bounds: bee.values:bounds
    admission: bee.harness.launch:admission
    canonical: bee.values:canonical
- name: target_presentation_policies
  kind: ns.requirement
  default: []
  targets:
  - entry: bee.harness.service:open
    path: .security.policies
- name: presentation_owner
  kind: process.lua
  source: file://presentation.lua
  method: main
  modules:
  - process
  - channel
  - time
  - uuid
  - hash
  - security
  - funcs
  - json
  - tty
  imports:
    bounds: bee.values:bounds
    admission: bee.harness.launch:admission
    canonical: bee.values:canonical
- name: presentation_executor
  kind: process.lua
  source: file://executor.lua
  method: main
  imports:
    runtime: bee.harness.app:runtime
    windows: bee.harness.binding:windows
- name: open
  kind: function.lua
  source: file://presentation.lua
  method: open
  modules: [process, channel, time, uuid, hash, security, funcs, json, tty]
  imports:
    bounds: bee.values:bounds
    admission: bee.harness.launch:admission
    canonical: bee.values:canonical
  security:
    policies: [bee.harness.security:presentation_bridge_policy]
- name: carrier
  kind: process.lua
  source: file://process.lua
  method: main
  modules:
  - process
  - channel
  - time
  - funcs
  - uuid
  imports:
    machine: bee.harness.carrier:machine
    placement_protocol: bee.placement.native:protocol
    lease: bee.harness.carrier:lease
  security: {policies: []}
