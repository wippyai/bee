version: '1.0'
namespace: bee.placement
entries:
- name: definition
  kind: ns.definition
  module: placement
  readme: file://README.md
  meta:
    title: Bee placement
    comment: Placement contract and launch and attempt values; implementations own executors, homes and receipts
- name: protected_namespace
  kind: ns.requirement
  meta:
    comment: Add the placement namespace to the host trust map
  default: bee.placement
  targets:
  - entry: bee:protected_kernel
    path: .data.namespaces +=
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: types
  kind: library.lua
  source: file://types.lua
  imports:
    driver_types: bee.driver:types
    preferences: bee.driver:preferences
- name: request
  kind: library.lua
  source: file://request.lua
  modules: [hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    types: bee.placement:types
    driver_types: bee.driver:types
    preferences: bee.driver:preferences
- name: transitions
  kind: library.lua
  source: file://transitions.lua
  imports:
    types: bee.placement:types
- name: decode
  kind: library.lua
  source: file://decode.lua
  imports:
    bounds: bee.threads.records:bounds
    types: bee.placement:types
- name: placement
  kind: contract.definition
  meta:
    comment: One attempt per admitted launch; intent before creation, evidence for every transition, cleanup only after proven absence
  methods:
  - name: prepare
    description: Validate an admitted launch request against this placement and record intent; idempotent by key and digest
  - name: start
    description: Spawn the attempt runner, which materializes resources and starts the child; idempotent
  - name: status
    description: Recorded execution and cleanup state plus one separately labelled liveness observation
  - name: stop
    description: Cooperative or forced stop under the admitted grace; signal evidence is recorded, exit is proven separately
  - name: reconcile
    description: After a restart, prove the attempt gone or alive from evidence; keep uncertainty when it cannot be proven
  - name: cleanup
    description: Remove the attempt home once execution absence is proven; retained session state is untouched
  - name: evidence
    description: A bounded page of the attempt's transition evidence
  - name: attach
    description: Bind the recipient that receives output and may write input; advances the attachment generation
  - name: capabilities
    description: Report the selected placement's measured executable and cleanup capabilities
  - name: measure_executable
    description: Measure an absolute executable path under the selected placement's host rules
  - name: close_stdin
    description: Close the admitted attempt's stdin when its driver declares session end on stdin closure
- name: workdir_preparer
  kind: contract.definition
  meta:
    comment: Generic workdir preparer extension point for contributing extra writable roots, setup before child start, and cleanup after child ends
  methods:
  - name: plan
    description: Plan setup without mutations; placement persists the returned state before setup
  - name: setup
    description: Run setup before the child starts, optionally returning modified working_directory, extra writable roots, and state
  - name: cleanup
    description: Run cleanup after the child ends, using state recorded from setup
- name: resolver
  kind: library.lua
  source: file://resolver.lua
  modules: [hash, registry]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    types: bee.placement:types
- name: paths
  kind: library.lua
  source: file://paths.lua
  modules: [exec]
  imports:
    quote: bee.driver.kit:quote

