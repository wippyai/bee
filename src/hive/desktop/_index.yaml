version: '1.0'
namespace: bee.hive.desktop
entries:
- name: display_host
  kind: process.host
  host: {max_processes: 8, workers: 2}
  lifecycle: {auto_start: true}
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  imports:
    arguments: bee.application:arguments
    bounds: bee.hive:bounds
    contract: bee.protocol:application
- name: catalog
  kind: library.lua
  source: file://catalog.lua
  modules: [funcs, process, channel]
  imports:
    types: bee.hive:types
    protocol: bee.hive.desktop:protocol
    bounds: bee.hive:bounds
    contract: bee.protocol:application
- name: owner
  kind: library.lua
  source: file://owner.lua
  modules: [process, security, channel, time, uuid, funcs]
  imports:
    protocol: bee.hive.desktop:protocol
    types: bee.hive:types
    retained: bee.launch:retained_protocol
    catalog: bee.hive.desktop:catalog
    workspaces: bee.storage:binding
- name: display
  kind: library.lua
  source: file://display.lua
  modules: [tty, channel, time, process]
  imports:
    bounds: bee.hive:bounds
    client: bee.hive:client
    protocol: bee.hive.desktop:protocol
    contract: bee.protocol:application
    delivery: bee.terminal:delivery
    input: bee.protocol:input
- name: command
  kind: process.lua
  source: file://display_command.lua
  method: command
  imports:
    display: bee.hive.desktop:display
    arguments: bee.application:arguments
  meta:
    command:
      name: bee-display
      host: bee.hive.desktop:display_host
      short: Attach a terminal to an admitted Hive desktop
      security:
        actor: {id: bee.desktop.display}
        policies: [bee.hive.desktop:display_policy]
- name: display_policy
  kind: security.policy
  policy:
    actions: [process.registry.lookup, process.send, tty.attach, tty.read, tty.write, tty.resize, tty.viewport]
    resources: '*'
    effect: allow
- name: host_policy
  kind: security.policy.expr
  meta:
    comment: Only the native host selects desktop admission; this policy is not attached to ordinary applications
  policy:
    actions: [bee.desktop.host, process.spawn, process.spawn.monitored, process.host, process.context, process.security, process.terminate, process.registry.register, process.registry.unregister, security.policy.get, security.scope.create]
    resources: '*'
    expression: '((action == "process.registry.register" || action == "process.registry.unregister") && resource matches "^bee[.]retained[.]bridge/[0-9a-f]{32}$") || (action == "bee.desktop.host" && resource == "bee.desktop") || ((action == "process.spawn" || action == "process.spawn.monitored") && resource == "bee.launch:retained") || (action == "process.host" && resource == "bee:workers") || (action == "security.policy.get" && (resource == "bee:host_policy" || resource == "bee:desktop_policy" || resource == "bee:retained_supervisor_spawn_policy" || resource == "bee:desktop_catalog_policy" || resource == "bee:desktop_catalog_resource_policy" || resource == "bee:workspace_host_lease_policy" || resource == "bee:workspace_catalog_read_policy" || resource == "bee.hive.desktop:catalog_call_policy")) || action == "process.context" || action == "process.security" || action == "process.terminate" || action == "security.scope.create"'
    effect: allow
- name: catalog_call_policy
  kind: security.policy
  meta:
    comment: The desktop bridge pages the node workspace catalog; the catalog authorizes the read under the host's catalog read policy
  policy:
    actions: [funcs.call]
    resources: [bee.workspace.catalog:list, bee.workspace.catalog:search]
    effect: allow

- name: reader
  kind: library.lua
  source: file://reader.lua
  modules: [process, time]
  imports:
    types: bee.hive:types
    owner: bee.hive.desktop:owner
    catalog: bee.hive.desktop:catalog
