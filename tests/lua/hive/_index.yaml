  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [funcs, registry, time, uuid]
  security:
    policies: [bee.hive:mapping_test_policy, bee.security.threads:thread_create_policy, bee.security.threads:thread_observe_policy, bee.security.threads:thread_lifecycle_policy, bee.security.threads:thread_storage_policy, bee.security.threads:thread_resource_policy]
  imports:
