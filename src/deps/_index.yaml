version: '1.0'
namespace: bee.deps
entries:
- name: persist
  kind: ns.dependency
  component: bee/persist
  version: 0.1.0-dev
- name: sync
  kind: ns.dependency
  component: bee/sync
  version: 0.1.0-dev
  parameters:
  - name: target_sender
    value: bee.hive.service:replica_sender
  - name: target_exports
    value: bee:sync_exports
- name: threads
  kind: ns.dependency
  component: bee/threads
  version: 0.1.0-dev
  parameters:
  - name: process_host
    value: bee:workers
  - name: waiter_policies
    value: [bee.security.threads:thread_waiter_policy]
  - name: sender
    value: bee.hive.service:inbox_sender
- name: hub
  kind: ns.dependency
  component: bee/hub
  version: 0.1.0-dev
  parameters:
  - name: process_host
    value: bee:workers
- name: gov
  kind: ns.dependency
  component: bee/gov
  version: 0.1.0-dev
  parameters:
  - name: target_db
    value: bee.gov:db
  - name: target_publication_profiles
    value: bee.env:gov_publication_profiles
  - name: target_activation_profiles
    value: bee.env:gov_activation_profiles
  - name: target_approval_request_policy
    value: bee.security.approvals:approval_request_policy
  - name: target_approval_consume_policy
    value: bee.security.approvals:approval_consume_policy
  - name: target_workspace_folder_read
    value: bee.workspace.catalog:read
  - name: target_workspace_folder_policy
    value: bee.security.gov:workspace_folder_read_policy
- name: gateway
  kind: ns.dependency
  component: bee/gateway
  version: 0.1.0-dev
  parameters:
  - name: target_db
    value: bee.gateway:db
  - name: target_listener
    value: bee:gateway_listener
  - name: target_endpoint
    value: bee:gateway_endpoint
  - name: target_approval_request_policy
    value: bee.security.approvals:approval_request_policy
  - name: target_approval_consume_policy
    value: bee.security.approvals:approval_consume_policy
  - name: target_tool_read_policy
    value: bee.security.gateway:gateway_tool_read_policy
  - name: target_tool_message_policy
    value: bee.security.gateway:gateway_tool_message_policy
  - name: target_tool_inbox_policy
    value: bee.security.gateway:gateway_tool_inbox_policy
  - name: target_tool_discover_policy
    value: bee.security.gateway:gateway_session_discover_policy
  - name: target_tool_send_grant_policy
    value: bee.security.gateway:gateway_session_send_workspace_policy
  - name: target_tool_launch_policy
    value: bee.security.gateway:gateway_tool_launch_policy
  - name: target_tool_run_policy
    value: bee.security.gateway:gateway_tool_run_policy
  - name: target_tool_overlay_policy
    value: bee.security.gateway:gateway_tool_overlay_policy
  - name: target_tool_docs_policy
    value: bee.security.gateway:gateway_tool_docs_policy
  - name: target_tool_components_policy
    value: bee.security.gateway:gateway_tool_components_policy
  - name: target_tool_delivery_policy
    value: bee.security.gateway:gateway_tool_delivery_policy
  - name: target_tool_publish_policy
    value: bee.security.gateway:gateway_tool_publish_policy
  - name: target_tool_application_open_policy
    value: bee.security.gateway:gateway_tool_application_open_policy
  - name: target_tool_install_policy
    value: bee.security.gateway:gateway_tool_install_policy
  - name: target_install_configuration
    value: bee:module_installation
  - name: target_remote_resolver
    value: bee.hive.service:remote_sessions
- name: hive
  kind: ns.dependency
  component: bee/hive
  version: 0.1.0-dev
- name: hive_telemetry
  kind: ns.dependency
  component: bee/hive-telemetry
  version: 0.1.0-dev
- name: hive_manager
  kind: ns.dependency
  component: bee/hive-manager
  version: 0.1.0-dev
- name: threads_timeline
  kind: ns.dependency
  component: bee/threads-timeline
  version: 0.1.0-dev
- name: workspace_manager
  kind: ns.dependency
  component: bee/workspace-manager
  version: 0.1.0-dev
- name: host_processes
  kind: ns.dependency
  component: bee/host-processes
  version: 0.1.0-dev
- name: hub_modules
  kind: ns.dependency
  component: bee/hub-modules
  version: 0.1.0-dev
- name: gov_overlays
  kind: ns.dependency
  component: bee/gov-overlays
  version: 0.1.0-dev
- name: application
  kind: ns.dependency
  component: bee/application
  version: 0.1.0-dev
- name: node
  kind: ns.dependency
  component: bee/node
  version: 0.1.0-dev
- name: docs
  kind: ns.dependency
  component: bee/docs
  version: 0.1.0-dev
  parameters:
  - name: target_corpus
    value: bee:docs_corpus
- name: resources
  kind: ns.dependency
  component: bee/resources
  version: 0.1.0-dev
  parameters:
  - name: target_db
    value: bee.resources:db
  - name: target_roots
    value: bee:resource_roots
- name: placement
  kind: ns.dependency
  component: bee/placement
  version: 0.1.0-dev
- name: credentials
  kind: ns.dependency
  component: bee/credentials
  version: 0.1.0-dev
  parameters:
  - name: target_db
    value: bee.credentials:db
  - name: target_sources
    value: bee:credential_sources
  - name: target_materializer
    value: bee.placement.native.binding:binding
- name: placement_native
  kind: ns.dependency
  component: bee/placement-native
  version: 0.1.0-dev
  parameters:
  - name: target_db
    value: bee.placement.native:db
  - name: target_root
    value: bee.placement.native:root
  - name: process_host
    value: bee:workers
  - name: sweeper_policies
    value: [bee.security.placement:placement_store_policy, bee.security.placement:placement_exec_policy,
      bee.security.placement:placement_service_policy, bee.security.resources:resource_resolve_policy,
      bee.security.credentials:credential_materialize_policy, bee.security.placement:placement_sweeper_policy,
      bee.security.gateway:gateway_supervision_policy]
  - name: target_executor
    value: bee:placement_executor
  - name: target_host_files
    value: bee:placement_host_files
  - name: target_admitted_roots
    value: bee:placement_admitted_roots
  - name: target_resource_mode
    value: bee:placement_resource_mode
- name: harness
  kind: ns.dependency
  component: bee/harness
  version: 0.1.0-dev
  parameters:
  - name: process_host
    value: bee:workers
  - name: target_db
    value: bee.node:db
- name: approvals
  kind: ns.dependency
  component: bee/approvals
  version: 0.1.0-dev
  parameters:
  - name: target_db
    value: bee.approvals:db
  - name: target_policies
    value: bee:approver_policies
  - name: process_host
    value: bee:workers
  - name: authority_policies
    value: [bee.security.approvals:approval_store_policy, bee.security.approvals:approval_owner_policy]
  - name: worker_policies
    value: [bee.security.approvals:approval_store_policy, bee.security.approvals:approval_owner_policy,
      bee.security.threads:thread_approval_policy, bee.security.threads:thread_approval_client_policy]
- name: driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: driver_agy
  kind: ns.dependency
  component: bee/driver-agy
  version: '*'
  parameters:
  - name: host_environment
    value: bee.harness.host:environment
  - name: window_policy
    value: bee:launch_policy_agy_window
  - name: batch_policy
    value: bee:launch_policy_agy_batch
- name: driver_claude
  kind: ns.dependency
  component: bee/driver-claude
  version: '*'
  parameters:
  - name: host_environment
    value: bee.harness.host:environment
  - name: window_policy
    value: bee:launch_policy_claude_window
  - name: batch_policy
    value: bee:launch_policy_claude_batch
- name: driver_codex
  kind: ns.dependency
  component: bee/driver-codex
  version: '*'
  parameters:
  - name: host_environment
    value: bee.harness.host:environment
  - name: window_policy
    value: bee:launch_policy_codex_window
  - name: batch_policy
    value: bee:launch_policy_codex_batch
  - name: named_batch_policy
    value: bee:launch_policy_codex_named_batch
- name: driver_grok
  kind: ns.dependency
  component: bee/driver-grok
  version: '*'
  parameters:
  - name: host_environment
    value: bee.harness.host:environment
  - name: window_policy
    value: bee:launch_policy_grok_window
  - name: batch_policy
    value: bee:launch_policy_grok_batch
- name: driver_muse
  kind: ns.dependency
  component: bee/driver-muse
  version: '*'
  parameters:
  - name: host_environment
    value: bee.harness.host:environment
  - name: window_policy
    value: bee:launch_policy_muse_window
  - name: batch_policy
    value: bee:launch_policy_muse_batch
- name: driver_opencode
  kind: ns.dependency
  component: bee/driver-opencode
  version: '*'
  parameters:
  - name: host_environment
    value: bee.harness.host:environment
  - name: window_policy
    value: bee:launch_policy_opencode_window
  - name: batch_policy
    value: bee:launch_policy_opencode_batch
