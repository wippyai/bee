version: '1.0'
namespace: bee.drivers.claude.binding
entries:
- name: configure
  kind: function.lua
  source: file://configure.lua
  method: handle
  imports:
    configure_protocol: bee.drivers:configuration_types
    canonical: bee.drivers.values:canonical
    universal: bee.drivers.binding:universal
    quote: bee.drivers.binding:quote
    hook_limits: bee.drivers.binding:hook_limits
- name: binding
  kind: contract.binding
  contracts:
  - contract: bee.drivers:driver
    methods:
      prepare: bee.drivers.universal:prepare
      dispatch: bee.drivers.universal:dispatch
      normalize: bee.drivers.universal:normalize
      configure: bee.drivers.claude.binding:configure
  - contract: bee.drivers:locate_facet
    methods:
      locate: bee.drivers.universal:locate
  meta:
    type: harness.driver
    driver_id: claude
    descriptor_ref: bee.drivers.claude.descriptor:cli
    credential_format_ref: bee.drivers.claude.credentials:credential_format
    accepts_model: true
    profiles_ref: bee.drivers.claude.profiles:profiles
