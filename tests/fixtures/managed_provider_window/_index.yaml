version: '1.0'
namespace: bee.managed_provider_fixture
entries:
- name: policy
  kind: registry.entry
  meta:
    type: bee.launch_policy
    test_support: true
  data:
    schema_revision: bee.launch-policy@1
    required_cleanup: direct_process
    required_exit_observation: eof_gated
    start_ms: 10000
    stop_grace_ms: 500
    drain_ms: 1000
    runner_drain_ms: 500
    fixture: true
    executables: {}
    environment: {}
- name: definition
  kind: registry.entry
  meta:
    type: bee.launch_definition
    test_support: true
  data:
    schema_revision: bee.launch-definition@1
    launch_id: managed-window-fixture
    title: Managed window fixture
    command_names: []
    binding_ref: bee.driver.claude:binding
    profile_id: window
    policy_ref: bee.managed_provider_fixture:policy
    default_mode: window
    allowed_overrides:
    - brief
    - thread
    workdir_policy:
      kind: caller_workspace
    thread_policy:
      kind: caller
    credentials: []
    presentation:
      start_menu: false
      fullscreen: false
      reuse: never
- name: test
  kind: function.lua
  source: file://main.lua
  method: run
  modules:
  - process
  - channel
  - time
  - security
  - tty
  - funcs
  - json
  - registry
  imports:
    appearance: bee.desktop:appearance
  security:
    policies:
    - bee:desktop_policy
    - bee:core_spawn_policy
    - bee:thread_authority_client_policy
    - bee:thread_lifecycle_client_policy
    - bee:thread_create_policy
  meta:
    type: test
    suite: bee
    timeout: 45s
- name: expectation
  kind: registry.entry
  meta:
    test_support: true
  data:
    marker: Let's get started.
