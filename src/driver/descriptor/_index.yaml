    placements: bee.placement.profiles:profiles
    descriptors: bee.driver.descriptor:descriptor
    profile_access: bee.driver.profiles:profile_access
    canonical: bee.values:canonical
    bounds: bee.values:bounds
    instructions: bee.driver.profiles:instructions
- name: profile_values
  kind: library.lua
  source: file://profile_values.lua
  modules: [registry, json]
  imports:
    bounds: bee.values:bounds
    descriptors: bee.driver.descriptor:descriptor
    effective: bee.driver.descriptor:effective
- name: trust
  kind: library.lua
  source: file://trust.lua
  modules: [exec, json, toml]
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    paths: bee.placement.profiles:paths
    quote: bee.driver.binding:quote
