version: '1.0'
namespace: bee.desktop
entries:
- name: definition
  kind: ns.definition
  module: desktop
  readme: file://README.md
  meta:
    title: Bee desktop
    comment: Pure desktop values and committed projection; host selects policies and
      lifetime
- name: dependency_application
  kind: ns.dependency
  component: bee/application
  version: '*'
- name: dependency_ui
  kind: ns.dependency
  component: bee/ui
  version: '*'
- name: target_application_protocol
  kind: ns.requirement
  targets:
  - entry: bee.desktop.types:commands
    path: .imports.contract
  - entry: bee.desktop.types:bindings
    path: .imports.contract
  - entry: bee.desktop.types:handoff
    path: .imports.contract
  - entry: bee.desktop.service:main
    path: .imports.contract
  - entry: bee.desktop.types:projection
    path: .imports.contract
- name: session_policies
  kind: ns.requirement
  targets:
  - entry: bee.desktop.service:main
    path: .security.policies
- name: model
  kind: library.lua
  source: file://model.lua
- name: state
  kind: library.lua
  source: file://state.lua
  imports:
    model: bee.desktop:model
    appearance: bee.ui:appearance
    commands: bee.desktop.types:commands
- name: layout
  kind: library.lua
  source: file://layout.lua
  imports:
    model: bee.desktop:model
