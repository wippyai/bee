version: '1.0'
namespace: bee.tests.sync
entries:
- name: store_test
  kind: function.lua
  source: file://store_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [uuid, hash, base64]
  imports:
    bounds: bee.values:bounds
    test: wippy.test:test
    store: bee.sync.persist:store
- name: canonical_test
  kind: function.lua
  source: file://canonical_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [json]
  imports:
    limits: bee.sync.values:limits
    test: wippy.test:test
    canonical: bee.values:canonical
    bounds: bee.values:bounds
- name: protocol_test
  kind: function.lua
  source: file://protocol_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    bounds: bee.values:bounds
    test: wippy.test:test
    protocol: bee.sync:protocol
- name: version_test
  kind: function.lua
  source: file://version_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    version: bee.sync.values:version
- name: replicas_test
  kind: function.lua
  source: file://replicas_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [uuid, hash, base64, json]
  imports:
    bounds: bee.values:bounds
    test: wippy.test:test
    replicas: bee.sync.persist:replicas
    version: bee.sync.values:version
- name: distribution_store_test
  kind: function.lua
  source: file://distribution_store_test.lua
  method: run
  modules: [uuid]
  meta: {type: test, suite: bee}
  imports:
    bounds: bee.values:bounds
    test: wippy.test:test
    store: bee.sync.persist:distribution_store
- name: distributor_test
  kind: function.lua
  source: file://distributor_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    distributor: bee.sync.service:distributor
- name: replica_protocol_test
  kind: function.lua
  source: file://replica_protocol_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [hash]
  imports:
    test: wippy.test:test
    protocol: bee.sync:replica_protocol
    version: bee.sync.values:version
- name: replica_method_client_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.sync.binding:replica_receive]
    effect: allow
- name: replica_source_node_a_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [bee.sync.replica.receive]
    resources: [node-a]
    effect: allow
- name: replica_method_test
  kind: function.lua
  source: file://replica_method_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [funcs, security, uuid, hash, base64]
  imports:
    bounds: bee.values:bounds
    test: wippy.test:test
    version: bee.sync.values:version
- name: distribution_test
  kind: function.lua
  source: file://distribution_test.lua
  method: run
  modules: [system, process, channel, events, time, uuid, hash, base64]
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    hive: bee.hive:protocol
    sync: bee.sync.persist:store
    replicas: bee.sync.persist:replicas
    cursors: bee.sync.persist:distribution_store
    version: bee.sync.values:version
    distributor: bee.sync.service:distributor
- name: exports
  kind: registry.entry
  meta:
    type: bee.sync.exports
  data:
    exports:
    - feed: tests.sync.versions
      content_kinds: [tests.sync.blob]
- name: peer_route
  kind: registry.entry
  meta:
    type: bee.hive.route
    sync: receiver
  data:
    prefix: syncpeer
    name: bee.tests.sync.peer
- name: second_peer_route
  kind: registry.entry
  meta:
    type: bee.hive.route
    sync: receiver
  data:
    prefix: syncsecond
    name: bee.tests.sync.second
- name: peer
  kind: process.lua
  source: file://peer.lua
  method: main
  modules: [process, channel, events, hash, base64]
  meta: {type: test_support}
  imports:
    protocol: bee.hive:protocol
