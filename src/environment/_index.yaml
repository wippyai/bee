version: '1.0'
namespace: bee.environment
entries:
- name: workspace_environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: workspace_db_path
  kind: env.variable
  storage: bee.environment:workspace_environment
  variable: BEE_WORKSPACE_DB
  default: .wippy/workspace.db
  readonly: true
- name: workspace_db
  kind: db.sql.sqlite
  file: ${env:bee.environment:workspace_db_path}
  lifecycle:
    auto_start: true
- name: client_db
  kind: db.sql.sqlite
  file: ${env:bee.environment:workspace_db_path}.client
  lifecycle:
    auto_start: true
- name: workspace_root
  kind: fs.directory
  directory: .
  base: project
  auto_init: false
- name: machine_home
  kind: env.variable
  storage: bee.harness.host:environment
  variable: home
  readonly: true
- name: machine_login_source
  kind: fs.directory
  directory: ${env:bee.environment:machine_home}
  base: project
  mode: '0500'
  auto_init: false
