version: '1.0'
namespace: bee.hive.binding
entries:
- name: invoke_check
  kind: function.lua
  source: file://invoke_check.lua
  method: handle
  modules:
  - security
  imports:
    catalog: bee.hive.exposure:catalog
    bounds: bee.values:bounds
- name: client
  kind: library.lua
  source: file://client.lua
  modules:
  - process
  - channel
  - time
  - uuid
  imports:
    types: bee.hive:types
    bounds: bee.values:bounds
- name: output
  kind: library.lua
  source: file://output.lua
  modules:
  - json
  imports:
    canonical: bee.values:canonical
- name: inbox_sender
  kind: library.lua
  source: file://inbox_sender.lua
  imports:
    hive: bee.hive.binding:client
- name: replica_sender
  kind: library.lua
  source: file://replica_sender.lua
  modules:
  - hash
  - base64
  imports:
    hive: bee.hive.binding:client
    version: bee.sync.values:version
    transaction: bee.persist.persist:transaction
    bounds: bee.values:bounds
- name: admission
  kind: library.lua
  source: file://admission.lua
  modules:
  - time
  imports:
    types: bee.hive:types
    peers: bee.hive.types:peers
    catalog: bee.hive.exposure:catalog
    clock: bee.values:clock
- name: workspace_command
  kind: function.lua
  source: file://workspace_command.lua
  method: handle
  modules:
  - funcs
  - security
  meta:
    comment: Runs one bee workspace command of an enrolled local client under the
      catalog grants the host attaches here
  security:
    policies: []
  imports:
    bounds: bee.values:bounds
    types: bee.hive:types
    commands: bee.hive.types:workspace_commands
- name: advertise
  kind: function.lua
  source: file://advertise_method.lua
  method: handle
  modules:
  - process
  security:
    policies: []
  imports:
    types: bee.hive:types
- name: policy_admission
  kind: library.lua
  source: file://policy_admission.lua
  modules:
  - funcs
  - security
  - registry
  - system
  - time
  - logger
  imports:
    clock: bee.values:clock
    dispatch: bee.hive.binding:dispatch
    types: bee.hive:types
    bounds: bee.values:bounds
    catalog: bee.hive.exposure:catalog
    canonical: bee.values:canonical
- name: admit_policy
  kind: function.lua
  source: file://policy_admission.lua
  method: handle
  modules:
  - funcs
  - security
  - registry
  - system
  - time
  - logger
  security:
    policies: []
  imports:
    clock: bee.values:clock
    dispatch: bee.hive.binding:dispatch
    types: bee.hive:types
    bounds: bee.values:bounds
    catalog: bee.hive.exposure:catalog
    canonical: bee.values:canonical
- name: dispatch
  kind: library.lua
  source: file://dispatch.lua
  modules:
  - json
  - funcs
  - security
  - registry
  imports:
    canonical: bee.values:canonical
    types: bee.hive:types
    catalog: bee.hive.exposure:catalog
    bounds: bee.values:bounds
    audiences: bee.hive.types:audiences
- name: execute
  kind: function.lua
  source: file://dispatch.lua
  method: dispatch
  modules:
  - json
  - funcs
  - security
  - registry
  imports:
    canonical: bee.values:canonical
    types: bee.hive:types
    catalog: bee.hive.exposure:catalog
    bounds: bee.values:bounds
    audiences: bee.hive.types:audiences
- name: workspaces
  kind: function.lua
  source: file://workspaces.lua
  method: handle
  modules:
  - funcs
  - process
  - system
  imports:
    bounds: bee.values:bounds
    workspace_query: bee.hive.types:workspace_query
    workspace_page: bee.hive.types:workspaces_page
  meta:
    comment: Open Hive operation listing one page of this node's workspace catalog
      and which workspaces a host serves now
    hive: open
    hive_service: bee.hive.binding
    hive_operation:
      revision: '1'
      title: Node workspaces
      input:
        type: object
        additionalProperties: false
        properties:
          label:
            type: string
            minLength: 1
            maxLength: 240
          after:
            type: string
            minLength: 1
            maxLength: 2200
          limit:
            type: integer
            minimum: 1
            maximum: 50
      output:
        type: object
        additionalProperties: false
        required:
        - node_id
        - workspaces
        properties:
          node_id:
            type: string
          next_after:
            type: string
          workspaces:
            type: array
            maxItems: 50
            items:
              type: object
              additionalProperties: false
              required:
              - workspace_id
              - label
              - served
              properties:
                workspace_id:
                  type: string
                label:
                  type: string
                served:
                  type: boolean
  security:
    policies: []
- name: workspace_command_policies
  kind: ns.requirement
  default: []
  targets:
  - entry: bee.hive.binding:workspace_command
    path: .security.policies
- name: advertise_policies
  kind: ns.requirement
  default: []
  targets:
  - entry: bee.hive.binding:advertise
    path: .security.policies
- name: admit_policy_policies
  kind: ns.requirement
  default: []
  targets:
  - entry: bee.hive.binding:admit_policy
    path: .security.policies
- name: workspaces_policies
  kind: ns.requirement
  default: []
  targets:
  - entry: bee.hive.binding:workspaces
    path: .security.policies
