version: '1.0'
namespace: bee.approvals.env
entries:
- name: database_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked SQL resource; target_db fills resource_ref
- name: policies_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked approver policies entry; target_policies fills resource_ref
- name: environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: node_identity_migration_source
  kind: env.variable
  storage: bee.harness.host:environment
  variable: node_identity_migration_source
  default: ""
  readonly: true
- name: db_path
  kind: env.variable
  storage: bee.approvals.env:environment
  variable: BEE_APPROVALS_DB
  default: .wippy/approvals.db
  readonly: true
- name: db
  kind: db.sql.sqlite
  file: ${env:bee.approvals.env:db_path}
  lifecycle:
    auto_start: true
- name: resources
  kind: library.lua
  source: file://resources.lua
  modules: [registry]
  imports:
    bounds: bee.values:bounds
