version: '1.0'
namespace: bee.harness.carrier
entries:
- name: provenance
  kind: library.lua
  source: file://provenance.lua
  imports:
    bounds: bee.threads.records:bounds
- name: checkpoint
  kind: library.lua
  source: file://checkpoint.lua
  imports:
    bounds: bee.threads.records:bounds
- name: settle
  kind: library.lua
  source: file://settle.lua
  imports:
    driver_types: bee.driver:types
- name: policy
  kind: library.lua
  source: file://policy.lua
  modules: [hash, registry, env, json]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    placement_types: bee.placement:types
    configuration: bee.driver:configuration
    mcp: bee.gateway:mcp
    surface: bee.gateway:surface
    preferences: bee.driver:preferences
- name: continuation
  kind: library.lua
  source: file://continuation.lua
  modules: [json]
  imports:
    bounds: bee.threads.records:bounds
    checkpoint: bee.harness.carrier:checkpoint
    record: bee.threads.records:record
    hooks: bee.gateway:hooks
- name: hook_records
  kind: library.lua
  source: file://hook_records.lua
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    gateway_hooks: bee.gateway:hooks
- name: machine
  kind: library.lua
  source: file://machine.lua
  modules: [json, hash, registry, funcs, security]
  imports:
    permission: bee.harness.permission:adapter
    acceptance: bee.harness.permission:acceptance
    gateway_configuration: bee.gateway.registry:configuration
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    catalog: bee.harness.catalog:catalog
    classify: bee.harness.catalog:classify
    policy: bee.harness.carrier:policy
    provenance: bee.harness.carrier:provenance
    checkpoint: bee.harness.carrier:checkpoint
    continuation: bee.harness.carrier:continuation
    settle: bee.harness.carrier:settle
    stream_json: bee.driver.transport:stream_json
    configuration: bee.driver:configuration
    driver_types: bee.driver:types
    placement_types: bee.placement:types
    placement_resolver: bee.placement.registry:resolver
    placement_protocol: bee.placement.native:protocol
    launch_request: bee.placement:request
    hook_records: bee.harness.carrier:hook_records
- name: lease
  kind: library.lua
  source: file://lease.lua
  imports:
    leases: bee.application:host_leases
- name: process
  kind: process.lua
  source: file://process.lua
  method: main
  modules: [process, channel, time, funcs, uuid]
  imports:
    machine: bee.harness.carrier:machine
    placement_protocol: bee.placement.native:protocol
    lease: bee.harness.carrier:lease
  security:
    policies: [bee.security.harness:carrier_policy, bee.security.harness:carrier_environment_policy, bee.security.desktop:workspace_host_lease_policy]
- name: capabilities
  kind: function.lua
  source: file://capabilities_method.lua
  method: handle
  imports:
    machine: bee.harness.carrier:machine
