version: '1.0'
namespace: bee.gateway.probe
entries:
- name: access_probe
  kind: library.lua
  source: file://access_probe.lua
  modules: [funcs, http_client, json, registry]
  imports: {bounds: bee.threads.records:bounds}
- name: concurrent_call
  kind: function.lua
  source: file://concurrent_call.lua
  method: handle
  modules: [http_client, json]
- name: sync_sender
  kind: library.lua
  source: file://sync_sender.lua
  imports:
    transaction: bee.persist:transaction
    version: bee.sync:version
- name: context_tool
  kind: function.lua
  source: file://context_tool.lua
  method: handle
  modules: [ctx, security]
- name: context_tool_policy
  kind: security.policy
  policy: {actions: [funcs.call], resources: [bee.gateway.probe:context_tool], effect: allow}
- name: replacement_policy
  kind: security.policy
  policy: {actions: [bee.probe.replacement], resources: [other], effect: allow}
- name: replacement_admin
  kind: security.policy
  policy: {actions: [registry.apply, registry.update.registry.entry], resources: ['*'], effect: allow}
- name: main
  kind: process.lua
  source: file://main.lua
  imports: {access_probe: bee.gateway.probe:access_probe}
  method: main
  modules: [funcs, http_client, json, time, process, registry, security, base64]
  meta:
    command:
      name: gateway-probe
      security:
        actor: {id: bee.test.gateway}
  security:
    policies: [bee.security.approvals:approval_decide_policy, bee.security.approvals:approval_consume_policy, bee.gateway.probe:replacement_admin, bee.gateway.probe:policy, bee.gateway.probe:configuration_caller_policy, bee.security.placement:placement_store_policy, bee.security.placement:placement_exec_policy, bee.security.gateway:gateway_manage_policy, bee.security.gateway:gateway_admit_policy, bee.security.gateway:gateway_materialize_policy, bee.security.threads:thread_authority_client_policy, bee.security.threads:thread_lifecycle_client_policy, bee.security.threads:thread_create_policy, bee.security.threads:thread_observe_policy, bee.security.threads:thread_lifecycle_policy, bee.security.threads:thread_carrier_policy]
- name: policy
  kind: security.policy
  policy:
    actions: [funcs.call, http_client.private_ip, http_client.request, process.spawn, process.host, registry.get, bee.threads.lifecycle, bee.threads.carrier]
    resources: [bee.gateway.binding:open, bee.gateway.binding:admit, bee.gateway.binding:revoke, bee.gateway.binding:drain, bee.gateway.binding:ready, bee.gateway.binding:materialize, bee.gateway.binding:reissue, bee.gateway.binding:revoke_attempt, bee.gateway.binding:check, bee.gateway.binding:authorize_materialization, bee.gateway.binding:hook_queue, bee.gateway.binding:hook_claim, bee.gateway.binding:hook_ack, bee.gateway.binding:hook_reject, bee.threads.carrier:claim, bee.threads.carrier:commit, bee:gateway_endpoint, 127.0.0.1, '*', bee.gateway.probe:drainer, bee:workers]
    effect: allow
- name: configuration_caller_policy
  kind: security.policy
  meta:
    comment: Privileged fixture caller may construct a selected child scope and invoke the rendering probe
  policy:
    actions: [funcs.security, security.scope.create, security.policy.get, security.actor.create]
    resources: [security, custom, bee.test.gateway.other, bee.gateway.security:address_call_policy, bee.gateway.security:store_policy, bee.gateway.security:execute_policy, bee.security.gateway:gateway_tool_read_policy, bee.security.gateway:gateway_tool_message_policy, bee.security.gateway:gateway_tool_overlay_policy, bee.security.gateway:gateway_tool_docs_policy]
    effect: allow
- name: render_configuration
  kind: function.lua
  source: file://render_configuration.lua
  method: run
  modules: [exec, funcs, security, sql]
  imports:
    configuration: bee.driver.codex:configuration
- name: drainer
  kind: process.lua
  source: file://drainer.lua
  method: main
  modules: [funcs, time]
  security:
    policies: [bee.gateway.probe:policy, bee.security.gateway:gateway_manage_policy]
