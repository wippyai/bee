version: '1.0'
namespace: bee.codex_docker_component_test
entries:
- name: test
  kind: function.lua
  source: file://test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry]
  imports:
    test: wippy.test:test
    definitions: bee.harness.launch:definitions
    policies: bee.harness.carrier:policy
    selection: bee.harness.launch:selection
  security:
    policies: [bee.codex_docker_component_test:registry_policy]
- name: registry_policy
  kind: security.policy
  policy:
    actions: [registry.get]
    resources: ['*']
    effect: allow
