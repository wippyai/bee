version: '1.0'
namespace: bee.managed
entries:
- name: listener
  kind: http.service
  meta:
    comment: The managed host's loopback listener for the gateway; absent from the default desktop composition
  addr: 127.0.0.1:18790
  lifecycle:
    auto_start: true
- name: router
  kind: http.router
  meta:
    server: bee.managed:listener
  prefix: /
- name: ready
  kind: http.endpoint
  meta:
    router: bee.managed:router
  method: GET
  path: /ready
  func: bee.gateway:ready_http
- name: mcp
  kind: http.endpoint
  meta:
    router: bee.managed:router
  method: POST
  path: /mcp/:action
  func: bee.gateway:mcp_http
- name: hook
  kind: http.endpoint
  meta:
    router: bee.managed:router
  method: POST
  path: /hook/:action
  func: bee.gateway:hook_http
- name: hook_status
  kind: http.endpoint
  meta:
    router: bee.managed:router
  method: GET
  path: /hook/:action/:event
  func: bee.gateway:hook_status_http
- name: hook_mcp
  kind: http.endpoint
  meta:
    router: bee.managed:router
  method: POST
  path: /hook/:action/mcp
  func: bee.gateway:hook_mcp_http
