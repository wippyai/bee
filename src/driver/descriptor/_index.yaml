version: '1.0'
namespace: bee.driver.descriptor
entries:
- name: schema_values
  kind: library.lua
  source: file://schema_values.lua
  imports:
    bounds: bee.values:bounds
- name: descriptor
  kind: library.lua
  source: file://descriptor.lua
  modules:
  - registry
  imports:
    bounds: bee.values:bounds
    login_evidence: bee.driver.locate:login_evidence
    schema_values: bee.driver.descriptor:schema_values
- name: effective
  modules: [json, toml]
  kind: library.lua
  source: file://effective.lua
