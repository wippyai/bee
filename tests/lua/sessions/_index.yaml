- name: hive_authorize_probe
  kind: function.lua
  source: "local receiver = require(\"receiver\")\nreturn {handle = function(args: {request: unknown, caller: string, node:\
    \ string})\n local invocation, err = receiver.authorize(args.request, args.caller, args.node)\n return {ok = invocation\
    \ ~= nil, error = err}\nend}"
  method: handle
  imports:
    receiver: bee.hive:receiver
- name: peer_call_probe
  kind: function.lua
  source: "local bounds = require(\"bounds\")\nlocal function call(raw: unknown): {[string]: unknown}\n    local asked = assert(bounds.object(raw))\n\
    \    if asked.node == \"lost-peer\" then return {ok = false, error = {code = \"UNKNOWN_OUTCOME\", message = \"destination\
    \ committed before the deadline\"}} end\n    return {ok = true, value = {ok = true, value = {node = asked.node, operation\
    \ = asked.operation}}}\nend\nreturn {call = call}"
  method: call
  imports:
    bounds: bee.values:bounds
