version: '1.0'
namespace: bee.drivers.agy.profiles
entries:
- name: profiles
  kind: registry.entry
  meta:
    type: harness.profile
    driver_ref: bee.drivers.agy.binding:binding
  data:
    driver:
      schema_revision: bee.driver@1
      kind: harness
      title: Antigravity CLI
      implementation_version: 1.2.2
      default_profile: session
      profiles:
      - id: session
        mode: session
        hooks:
          transports: [command]
          events: [PermissionRequest]
        protocol: stream-json
        protocol_revision: agy-stream-json-1
        answer_path:
          strategy: terminal_field
          adapter_ref: bee.drivers.agy.descriptor:cli
        resume:
          strategy: per-process
          portable: false
        isolation_env:
          variables:
          - HOME
          private_home: true
        exit_codes_trustworthy: false
        input_ready:
          strategy: protocol
          adapter_ref: bee.drivers.agy.descriptor:cli
          timeout_ms: 15000
        interrupt:
          methods:
          - signal_group
        mcp:
          client_transports:
          - stdio
          - streamable_http
          initialize_timeout_ms: 30000
          call_timeout_ceiling_ms: 120000
        inbound:
        - next_turn
        sandbox:
          providers: []
          required_placement_features: []
          git_writable_roots_adapter: agy_add_dir
        permission_exchange:
          mode: adapter
          adapter_ref: bee.drivers.permission:permission_request_hook
          adapter_digest: a9b3fec616bd9b96c628352d4f1e8d5078f0a708444c9507a148f68d17c72867
      - id: batch
        mode: batch
        hooks:
          transports: [command]
          events: [PermissionRequest]
        protocol: stream-json
        protocol_revision: agy-stream-json-1
        answer_path:
          strategy: terminal_field
          adapter_ref: bee.drivers.agy.descriptor:cli
        resume:
          strategy: per-process
          portable: false
        isolation_env:
          variables:
          - HOME
          private_home: true
        exit_codes_trustworthy: false
        input_ready:
          strategy: protocol
          adapter_ref: bee.drivers.agy.descriptor:cli
          timeout_ms: 15000
        interrupt:
          methods:
          - signal_group
        mcp:
          client_transports:
          - streamable_http
          initialize_timeout_ms: 30000
          call_timeout_ceiling_ms: 120000
        sandbox:
          providers: []
          required_placement_features: []
          git_writable_roots_adapter: agy_add_dir
        permission_exchange:
          mode: adapter
          adapter_ref: bee.drivers.permission:permission_request_hook
          adapter_digest: a9b3fec616bd9b96c628352d4f1e8d5078f0a708444c9507a148f68d17c72867
      - id: window
        mode: window
        protocol: pty
        protocol_revision: native-window-1
        hooks:
          transports:
          - command
          events:
          - SessionStart
          - UserPromptSubmit
          - PreToolUse
          - PostToolUse
          - PermissionRequest
          - Stop
        answer_path:
          strategy: none
        resume:
          strategy: none
          portable: false
        isolation_env:
          variables:
          - HOME
          private_home: false
        exit_codes_trustworthy: false
        input_ready:
          strategy: none
        permission_exchange:
          mode: adapter
          adapter_ref: bee.drivers.permission:permission_request_hook
          adapter_digest: a9b3fec616bd9b96c628352d4f1e8d5078f0a708444c9507a148f68d17c72867
