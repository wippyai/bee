version: '1.0'
namespace: bee.gateway.app
entries:
- name: view
  kind: library.lua
  source: file://view.lua
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    markdown: bee.ui:markdown
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: [tty, process, channel, funcs, time]
  imports:
    view: bee.gateway.app:view
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    client: bee.app:client
    bounds: bee.values:bounds
    confirmation: bee.approvals.app:confirmation
    manuals: bee.docs:manuals
  meta:
    type: bee.application
    application:
      api_version: 1
      title: MCP clients
      lifetime: view
      revision: '1'
      instance_policy: singleton
      menus: [bee.shell:desktop_menu]
  security:
    policies: [bee.security.docs:docs_policy, bee.gateway.security:external_view_policy, bee.security.approvals:confirmation_client, bee.security.approvals:confirmation_authority]
