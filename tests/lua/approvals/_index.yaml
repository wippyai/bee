version: '1.0'
namespace: bee.approvals
entries:
- name: apply_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [registry.apply]
    resources: '*'
    effect: allow
- name: client_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.approvals.binding:request, bee.approvals.binding:decide, bee.approvals.binding:withdraw, bee.approvals.binding:consume, bee.approvals.binding:revalidate, bee.approvals.binding:read, bee.approvals.binding:inbox, bee.approvals.binding:feed_snapshot, bee.approvals.binding:feed_read_after, bee.approvals.binding:list, bee.approvals.binding:deliveries, bee.approvals.binding:reconcile, bee.approvals.binding:capabilities, bee.threads.approvals:append, bee.threads.service:create, bee.threads.service:get, bee.threads.service:read_after, bee.threads.delivery:watch]
    effect: allow
- name: test_db
  kind: db.sql.sqlite
  meta: {type: test_support}
  file: .wippy/approvals-test.db
  lifecycle:
    auto_start: true
- name: store_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [db.get]
    resources: [bee.approvals:test_db]
    effect: allow
- name: service_test
  kind: function.lua
  source: file://service_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [funcs, security, registry, time, sql, process, uuid]
  security:
    policies: [bee.approvals:apply_test_policy, bee.approvals:store_test_policy, bee.security.approvals:approval_store_policy, bee.security.approvals:approval_request_policy, bee.security.approvals:approval_decide_policy, bee.security.approvals:approval_consume_policy, bee.security.approvals:approval_owner_policy]
  imports:
    test: wippy.test:test
    service: bee.approvals:service
    resources: bee.approvals:resources
    outbox: bee.approvals.persist:outbox
    migrations: bee.approvals.migrations:migrations
    persist: bee.persist:database
    thread_harness: bee.threads:harness
