version: '1.0'
namespace: bee.driver.agy.security
entries:
- name: launch_policy_agy_batch
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected bounded Gemini batch policy with a retained user login and caller-owned thread MCP
  data:
    schema_revision: bee.launch-policy@3
    allowed_overrides:
    - thread
    - workdir
    required_cleanup: process_group
    required_exit_observation: independent

    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables: {}
    executable_env:
      agy: bee.driver.agy.env:executable
    environment: {}
    allow_host_home: false
    gateway_tools:
    - session_catalog
    - session_open
    - session_run
    - session_send
    - session_await
    - session_join
    - session_get
    - session_list
    - session_cancel
    - session_close
    - thread_read
    - thread_message
    prepare_options:
      model: gemini-3.8-flash
      effort: high
      sandbox: true
    placement_profiles:
    - bee.placement.profiles:native
    - bee.placement.docker.profiles:coding
- name: launch_policy_agy_window
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected executable binding for the component-owned Antigravity window; missing host executable leaves the
      declaration unavailable
  data:
    schema_revision: bee.launch-policy@3
    allowed_overrides:
    - thread
    - workdir
    required_cleanup: process_group
    required_exit_observation: independent

    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables: {}
    executable_env:
      agy: bee.driver.agy.env:executable
    environment: {}
    allow_host_home: true
    gateway_tools:
    - session_catalog
    - session_open
    - session_run
    - session_send
    - session_await
    - session_join
    - session_get
    - session_list
    - session_cancel
    - session_close
    - thread_read
    - thread_message
    - capabilities
    - overlay
    - docs
    - components
    - install_request
    - uninstall_request
    - install_status
    - delivery
    - tests
    - app_tools
    - publish
    gateway_access:
      policy: agent-access
      traits:
      - bee.app:share
      - bee.app:tools
      - bee.hub:library
    gateway_hooks:
    - SessionStart
    - UserPromptSubmit
    - PreToolUse
    - PostToolUse
    - Stop
    hook_command_ref: bee.gateway.env:hook_executable
    profile_instructions: true
    prepare_options: {}
    placement_profiles:
    - bee.placement.profiles:native
    - bee.placement.docker.profiles:coding
    profile_restrictions:
      provider.model:
        kind: declared
      provider.options.mode:
        kind: declared
      provider.effort:
      - low
      - medium
      - high
