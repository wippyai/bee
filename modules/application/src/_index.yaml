version: '1.0'
namespace: bee.app
entries:
- name: definition
  kind: ns.definition
  module: application
  readme: file://README.md
  meta:
    title: Bee application SDK
    comment: Public application-side values, presentation helpers, and bounded thread
      facade messages; helpers grant no application, workspace, or thread authority
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: client
  kind: library.lua
  source: file://client.lua
  modules:
  - process
  - uuid
  imports:
    arguments: bee.app:arguments
    interaction: bee.app:interaction
    thread_bounds: bee.threads.records:bounds
    thread_protocol: bee.app:thread_protocol
- name: sessions_protocol
  kind: library.lua
  source: file://sessions_protocol.lua
  imports:
    bounds: bee.protocol:bounds
    canonical: bee.protocol:canonical
    record_values: bee.threads.records:values
    record_types: bee.threads.records:types
    budget_values: bee.threads.records:budgets
    profile_values: bee.harness.profiles:protocol
- name: sessions
  kind: library.lua
  source: file://sessions.lua
  modules:
  - contract
  imports:
    bounds: bee.protocol:bounds
    protocol: bee.app:sessions_protocol
- name: arguments
  kind: library.lua
  source: file://arguments.lua
- name: text
  kind: library.lua
  source: file://text.lua
- name: caller
  kind: library.lua
  source: file://caller.lua
  imports:
    bounds: bee.threads.records:bounds
- name: folder_picker
  kind: library.lua
  source: file://folder_picker.lua
  imports:
    text: bee.app:text
    caller: bee.app:caller
    frame: bee.app:frame
    bounds: bee.threads.records:bounds
- name: agent_protocol
  kind: library.lua
  source: file://agent_protocol.lua
  imports:
    bounds: bee.threads.records:bounds
- name: host_leases
  kind: library.lua
  source: file://host_leases.lua
  modules:
  - process
  - channel
  - time
  - uuid
  imports:
    bounds: bee.threads.records:bounds
- name: status_reader
  kind: library.lua
  source: file://status_reader.lua
  imports:
    bounds: bee.threads.records:bounds
    caller: bee.app:caller
    text: bee.app:text
- name: status_surface
  kind: library.lua
  source: file://status_surface.lua
  imports:
    bounds: bee.threads.records:bounds
- name: interaction
  kind: library.lua
  source: file://interaction.lua
  imports:
    bounds: bee.threads.records:bounds
- name: appearance
  kind: library.lua
  source: file://appearance.lua
  modules:
  - env
- name: frame
  kind: library.lua
  source: file://frame.lua
  modules:
  - tty
  imports:
    appearance: bee.app:appearance
- name: names
  kind: library.lua
  source: file://names.lua
- name: thread_protocol
  kind: library.lua
  source: file://thread_protocol.lua
  imports:
    bounds: bee.threads.records:bounds
    record: bee.threads.records:record
    record_types: bee.threads.records:types
- name: viz
  kind: library.lua
  source: file://viz.lua
  modules:
  - tty
  imports:
    appearance: bee.app:appearance
    frame: bee.app:frame
- name: forms
  kind: library.lua
  source: file://forms.lua
  modules:
  - tty
  imports:
    appearance: bee.app:appearance
    frame: bee.app:frame
- name: diagram
  kind: library.lua
  source: file://diagram.lua
  modules:
  - tty
  imports:
    appearance: bee.app:appearance
    frame: bee.app:frame
    viz: bee.app:viz
