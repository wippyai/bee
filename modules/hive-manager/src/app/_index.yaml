version: '1.0'
namespace: bee.hive.manager.app
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules:
  - tty
  - process
  - channel
  - time
  - uuid
  - registry
  - system
  imports:
    frame: bee.app:frame
    client: bee.app:client
    appearance: bee.app:appearance
    model: bee.hive.manager.app:model
    names: bee.app:names
    view: bee.hive.manager.app:view
    directory: bee.hive.manager.app:directory
    hive: bee.hive.binding:client
    types: bee.hive:types
    remote: bee.hive.manager.app:remote
    desktop_protocol: bee.hive.desktop:protocol
    clock: bee.protocol:clock
  meta:
    type: bee.app
    application:
      api_version: 1
      title: Hive Manager
      icon: H
      lifetime: view
      revision: '1'
      instance_policy: singleton
      group: Tools
      role: hive
      resume_schema: hive_manager.v1
      restart_policy: manual
- name: model
  kind: library.lua
  source: file://model.lua
  modules:
  - json
  imports:
    text: bee.app:text
    directory: bee.hive.manager.app:directory
    contract: bee.protocol:application
    types: bee.hive:types
    hive_bounds: bee.protocol:bounds
    names: bee.app:names
- name: view
  kind: library.lua
  source: file://view.lua
  imports:
    frame: bee.app:frame
    appearance: bee.app:appearance
    model: bee.hive.manager.app:model
    names: bee.app:names
- name: remote
  kind: library.lua
  source: file://remote.lua
  imports:
    bounds: bee.protocol:bounds
    appearance: bee.app:appearance
    frame: bee.app:frame
    names: bee.app:names
- name: directory
  kind: library.lua
  source: file://directory.lua
  imports:
    types: bee.hive:types
    bounds: bee.protocol:bounds
    contract: bee.protocol:application
- name: names
  kind: registry.entry
  meta:
    type: bee.hive_node_names
    comment: Friendly names the host gives node identities for display and selection;
      a name authenticates nothing and changes no identity
  data:
    names: {}
