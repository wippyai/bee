version: '1.0'
namespace: bee.hive.probe
entries:
- name: controller_policy
  kind: security.policy
  policy:
    actions: [process.spawn, process.spawn.monitored, process.host, process.send, process.cancel, process.monitor, process.context, process.security, security.scope.create, security.policy.get, funcs.call]
    resources: '*'
    effect: allow
- name: names_policy
  kind: security.policy
  policy:
    actions: [process.registry.register, process.registry.unregister, process.registry.register.eventual, process.registry.unregister.eventual]
    resources: [bee.hive.supervisor, 'bee.hive.supervisor/*']
    effect: allow
- name: execute_policy
  kind: security.policy
  policy:
    actions: [funcs.call]
    resources: [bee.hive.binding:execute, bee.hive.binding:admit_policy, bee.hive.binding:advertise]
    effect: allow
- name: inspect_policy
  kind: security.policy
  policy:
    actions: [system.read]
    resources: [node]
    effect: allow
- name: name_injection_policy
  kind: security.policy
  policy:
    actions: [process.registry.register, process.registry.unregister, process.registry.foreign]
    resources: '*'
    effect: allow
- name: telemetry_grant
  kind: security.policy
  meta:
    comment: Install-grant equivalent exposing the staged telemetry operations through the supervisor exposure scope
  groups: [bee.security.hive:hive_exposure_scope]
  policy:
    actions: [hive.expose.open]
    resources: [bee.hive.telemetry.binding:presence, bee.hive.telemetry.binding:stats, bee.hive.telemetry.binding:catalog_list,
      bee.hive.telemetry.binding:holdings, bee.hive.telemetry.binding:cluster]
    effect: allow
- name: coordinator
  kind: process.lua
  source: file://coordinator.lua
  method: main
  modules: [process, security, time, channel, io, system, funcs]
  imports:
    types: bee.hive:types
    client: bee.hive.binding:client
  meta:
    command:
      name: hive-supervisor-probe
      security:
        actor: {id: bee.hive.probe}
        policies: [bee.hive.probe:controller_policy, bee.hive.probe:inspect_policy, bee.hive.probe:name_injection_policy]
