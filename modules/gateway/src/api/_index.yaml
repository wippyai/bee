version: '1.0'
namespace: bee.gateway.api
entries:
- name: session_boundary
  kind: library.lua
  source: file://session_boundary.lua
  imports:
    bounds: bee.threads.records:bounds
    subject_call: bee.gateway.security:subject_call
- name: admission
  kind: library.lua
  source: file://admission.lua
  modules: [http]
  imports:
    gateway: bee.gateway.binding:gateway
- name: ready_http
  kind: function.lua
  source: file://ready_http_method.lua
  method: handle
  modules: [http]
  imports: {gateway: bee.gateway.binding:gateway}
  security: {policies: [bee.gateway.security:address_call_policy, bee.gateway.security:store_policy, bee.gateway.security:database_ref_policy, bee.gateway.security:address_policy, bee.gateway.security:supervisor_policy]}
- name: hook_http
  kind: function.lua
  source: file://hook_http_method.lua
  method: submit
  modules: [http, json, funcs, security, contract, registry]
  imports:
    gateway: bee.gateway.binding:gateway
    hooks: bee.gateway:hooks
    admission: bee.gateway.api:admission
    session_boundary: bee.gateway.api:session_boundary
  security: {policies: [bee.gateway.security:address_call_policy, bee.gateway.security:store_policy, bee.gateway.security:database_ref_policy, bee.gateway.security:address_policy, bee.gateway.security:supervisor_policy, bee.gateway.security:execute_policy, bee.gateway.security:tool_policy_read_policy, bee.gateway.security:tool_policy_reference_policy, bee.gateway.security:session_boundary_resolver_policy]}
- name: hook_status_http
  kind: function.lua
  source: file://hook_http_method.lua
  method: status
  modules: [http, json]
  imports:
    gateway: bee.gateway.binding:gateway
    hooks: bee.gateway:hooks
    admission: bee.gateway.api:admission
    session_boundary: bee.gateway.api:session_boundary
  security: {policies: [bee.gateway.security:address_call_policy, bee.gateway.security:store_policy, bee.gateway.security:database_ref_policy, bee.gateway.security:address_policy, bee.gateway.security:supervisor_policy, bee.gateway.security:execute_policy, bee.gateway.security:tool_policy_read_policy, bee.gateway.security:tool_policy_reference_policy]}
- name: hook_mcp_http
  kind: function.lua
  source: file://hook_mcp_method.lua
  method: handle
  modules: [http, json, funcs, security, contract, registry]
  imports:
    gateway: bee.gateway.binding:gateway
    mcp: bee.gateway:mcp
    hooks: bee.gateway:hooks
    admission: bee.gateway.api:admission
    session_boundary: bee.gateway.api:session_boundary
  security: {policies: [bee.gateway.security:address_call_policy, bee.gateway.security:store_policy, bee.gateway.security:database_ref_policy, bee.gateway.security:address_policy, bee.gateway.security:supervisor_policy, bee.gateway.security:execute_policy, bee.gateway.security:tool_policy_read_policy, bee.gateway.security:tool_policy_reference_policy, bee.gateway.security:session_boundary_resolver_policy]}
- name: mcp_http
  kind: function.lua
  source: file://mcp_method.lua
  method: handle
  modules: [http, json, funcs, security, registry, contract]
  imports:
    gateway: bee.gateway.binding:gateway
    mcp: bee.gateway:mcp
    admission: bee.gateway.api:admission
    catalog: bee.gateway:catalog
    context: bee.gateway:context
    session_tools: bee.gateway:session_tools
    bounds: bee.threads.records:bounds
    subject_call: bee.gateway.security:subject_call
  security:
    policies: [bee.gateway.security:address_call_policy, bee.gateway.security:store_policy, bee.gateway.security:database_ref_policy, bee.gateway.security:address_policy, bee.gateway.security:supervisor_policy, bee.gateway.security:execute_policy, bee.gateway.security:tool_policy_read_policy, bee.gateway.security:tool_policy_reference_policy, bee.gateway.security:access_call_policy, bee.gateway.security:access_reference_policy, bee.gateway.security:access_policy_read_policy, bee.gateway.security:session_contract_policy]
