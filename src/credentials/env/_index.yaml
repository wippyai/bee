version: '1.0'
namespace: bee.credentials.env
entries:
- name: entered_values
  kind: env.storage.memory
  lifecycle:
    auto_start: true
- name: sources_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked host sources entry; target_sources fills resource_ref
  resource_ref: bee.credentials.env:credential_sources
- name: materializer_ref
  kind: registry.entry
  meta:
    comment: The linked placement binding persisted on new projections; target_materializer fills binding_ref
  binding_ref: bee.placement.native.binding:binding
- name: environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: credential_sources
  kind: registry.entry
  meta:
    type: bee.credential_sources
    comment: Host-selected credential sources with audience and provider; optional setup source, destination and format form one supplemental file under the same root; write_back admits exact-path token
      refreshes
  data:
    formats:
      claude: bee.driver.claude.credentials:credential_format
      codex: bee.driver.codex.credentials:credential_format
      agy: bee.driver.agy.credentials:credential_format
      grok: bee.driver.grok.credentials:credential_format
      muse: bee.driver.muse.credentials:credential_format
      opencode: bee.driver.opencode.credentials:credential_format
    sources:
    - ref: bee.driver.claude.env:api_key
      workspace_id: '*'
      audience: '*'
      provider: claude
      projection_kinds:
      - environment
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: codex
      projection_kinds:
      - file
      path: .codex/auth.json
      write_back: true
      setup_path: .codex/config.toml
      setup_destination: .codex/.bee-user-config.toml
      setup_content_format: opaque
      setup_initialize_empty: true
      auxiliary_files:
      - source_prefix: .codex/
        destination_prefix: .codex/
        suffix: .config.toml
        content_format: opaque
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: claude
      projection_kinds:
      - file
      path: .claude/.credentials.json
      write_back: true
      setup_path: .claude/settings.json
      setup_destination: .claude/settings.json
      setup_content_format: opaque
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: agy
      projection_kinds:
      - file
      path: .gemini/antigravity-cli/antigravity-oauth-token
      write_back: true
      setup_path: .gemini/antigravity-cli/cache/onboarding.json
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: grok
      projection_kinds:
      - file
      path: .grok/auth.json
      write_back: true
      setup_path: .grok/config.toml
      setup_destination: .grok/.bee-global-config.toml
      setup_content_format: opaque
      setup_initialize_empty: true
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: muse
      projection_kinds:
      - file
      path: .config/muse/auth.json
      write_back: true
      setup_path: .config/muse/settings.json
      setup_destination: .config/muse/.bee-global-settings.json
      setup_content_format: opaque
      setup_initialize_empty: true
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: opencode
      projection_kinds:
      - file
      path: .local/share/opencode/auth.json
      write_back: true
      setup_path: .config/opencode/opencode.json
      setup_destination: .config/opencode/.bee-global-opencode.json
      setup_content_format: opaque
      setup_initialize_empty: true
      auxiliary_files:
      - source_prefix: .config/opencode/
        destination_prefix: .config/opencode/
        suffix: .key
        content_format: opaque
