version: '1.0'
namespace: bee.hive.telemetry
entries:
- name: definition
  kind: ns.definition
  module: hive-telemetry
  readme: file://README.md
  meta:
    title: Bee hive telemetry
    comment: Optional cluster telemetry; host composition and policy selection remain in Bee
- name: dependency_application
  kind: ns.dependency
  component: bee/application
  version: '*'
- name: dependency_hive
  kind: ns.dependency
  component: bee/hive
  version: '*'
- name: target_exposure
  kind: ns.requirement
  meta:
    capability: hive.expose
    parameters:
      operations: [bee.hive.telemetry.binding:presence, bee.hive.telemetry.binding:stats, bee.hive.telemetry.binding:catalog_list,
        bee.hive.telemetry.binding:holdings, bee.hive.telemetry.binding:cluster]
      mode: open
      audiences: ['*']
    reason: Expose the package open telemetry operations to Hive peers
    value_kind: security.policy
  targets:
  - entry: bee.hive.telemetry.binding:presence
    path: .security.policies +=
- name: target_presence_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.hive.telemetry.binding:presence
    path: .security.policies
  - entry: bee.hive.telemetry.binding:stats
    path: .security.policies
- name: target_catalog_list_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.hive.telemetry.binding:catalog_list
    path: .security.policies
- name: target_holdings_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.hive.telemetry.binding:holdings
    path: .security.policies
- name: target_cluster_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.hive.telemetry.binding:cluster
    path: .security.policies
- name: dependency_values
  kind: ns.dependency
  component: bee/values
  version: '*'
