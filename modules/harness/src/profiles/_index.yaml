version: '1.0'
namespace: bee.harness.profiles
entries:
- name: target_db
  kind: ns.requirement
  default: bee.node:db
  meta: {comment: Host-selected SQLite resource for saved profiles}
  targets:
  - entry: bee.harness.profiles:database_ref
    path: .resource_ref
- name: database_ref
  kind: registry.entry
  meta: {type: bee.resource_ref}
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  modules: [json]
  imports:
    access: bee.driver:profile_access
    bounds: bee.values:bounds
    budgets: bee.threads.records:budgets
    canonical: bee.values:canonical
- name: validation
  kind: library.lua
  source: file://validation.lua
  modules: [registry]
  imports:
    budgets: bee.threads.records:budgets
    bounds: bee.values:bounds
    descriptors: bee.driver:descriptor
    protocol: bee.harness.profiles:protocol
- name: migration
  kind: library.lua
  source: file://migration.lua
  imports:
    bounds: bee.values:bounds
    protocol: bee.harness.profiles:protocol
- name: service
  kind: library.lua
  source: file://service.lua
  modules: [security, ctx, system, registry, sql, hash]
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    sync: bee.sync.persist:store
    transaction: bee.persist:transaction
    protocol: bee.harness.profiles:protocol
    migration: bee.harness.profiles:migration
    validation: bee.harness.profiles:validation
    driver_profile: bee.driver:profile
