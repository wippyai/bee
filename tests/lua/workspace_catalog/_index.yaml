version: '1.0'
namespace: bee.workspace.catalog
entries:
- name: projects_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/catalog-projects
  auto_init: true
- name: readonly_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/catalog-archive
  auto_init: true
- name: unadmitted_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/catalog-unadmitted
  auto_init: true
- name: call_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.workspace.binding:create, bee.workspace.binding:read, bee.workspace.binding:list, bee.workspace.binding:search,
      bee.workspace.binding:rename, bee.workspace.binding:archive, bee.workspace.binding:restore, bee.workspace.binding:catalog,
      bee.workspace.binding:inspect, bee.workspace.binding:search_within, bee.workspace.binding:roots,
      bee.workspace.binding:folders]
    effect: allow
- name: catalog_test
  kind: function.lua
  source: file://catalog_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [sql]
  imports:
    test: wippy.test:test
    store: bee.workspace.persist:store
    catalog: bee.workspace.persist:catalog
- name: operations_test
  kind: function.lua
  source: file://operations_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [funcs, security, registry, process, time, fs]
  imports:
    principals: bee.test.principals:bound
    bounds: bee.protocol:bounds
    test: wippy.test:test
- name: resources_call_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.resources.binding:associate, bee.resources.binding:describe, bee.resources.binding:search, bee.gateway.binding:describe]
    effect: allow
- name: broken_extension_method
  kind: function.lua
  source: file://broken_extension.lua
  method: handle
  meta: {type: test_support}
- name: broken_extension
  kind: contract.binding
  meta: {type: test_support, title: Broken}
  contracts:
  - contract: bee.workspace.catalog:extension
    methods:
      describe: bee.workspace.catalog:broken_extension_method
      search: bee.workspace.catalog:broken_extension_method
- name: extension_test
  kind: function.lua
  source: file://extension_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [funcs, security, registry, time, fs]
  imports:
    app_caller: bee.app:caller
    principals: bee.test.principals:bound
    bounds: bee.protocol:bounds
    test: wippy.test:test
    persistence: bee.workspace.persist:checkpoint
    model: bee.desktop:model
    appearance: bee.app:appearance
