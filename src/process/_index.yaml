version: '1.0'
namespace: bee.process
entries:
- name: worker
  kind: library.lua
  source: file://worker.lua
  modules: [process, channel, time]
  imports:
    demand: bee.process:demand
    seam: bee.process:seam
- name: seam
  kind: library.lua
  source: file://seam.lua
  modules: [time, channel]
- name: seams
  kind: ns.requirement
  meta:
    value_kind: library.lua
    comment: The library every component seam point calls; the host keeps the pass-through, a test composition binds its own
  default: bee.process:seam
  targets:
  - entry: bee.threads.service:threads
    path: .imports.seam
  - entry: bee.approvals.inbox.app:app
    path: .imports.seam
  - entry: bee.apps.settings.app:edit_mode
    path: .imports.seam
  - entry: bee.node.binding:tests_call
    path: .imports.seam
  - entry: bee.gateway.binding:values
    path: .imports.seam
  - entry: bee.gateway.binding:listener
    path: .imports.seam
  - entry: bee.gateway.binding:capabilities
    path: .imports.seam
  - entry: bee.gateway.binding:credentials
    path: .imports.seam
  - entry: bee.credentials.binding:define
    path: .imports.seam
  - entry: bee.credentials.binding:set_value
    path: .imports.seam
  - entry: bee.credentials.binding:issue_projection
    path: .imports.seam
  - entry: bee.credentials.binding:check
    path: .imports.seam
  - entry: bee.credentials.binding:availability
    path: .imports.seam
  - entry: bee.credentials.binding:materialize
    path: .imports.seam
  - entry: bee.credentials.binding:write_back
    path: .imports.seam
  - entry: bee.credentials.binding:renew_attempt
    path: .imports.seam
  - entry: bee.credentials.binding:revoke
    path: .imports.seam
  - entry: bee.credentials.binding:revoke_all
    path: .imports.seam
  - entry: bee.credentials.binding:list
    path: .imports.seam
  - entry: bee.credentials.binding:capabilities
    path: .imports.seam
  - entry: bee.credentials.binding:configuration_setup
    path: .imports.seam
  - entry: bee.credentials.binding:configuration_effects
    path: .imports.seam
  - entry: bee.resources.persist:authority
    path: .imports.seam
  - entry: bee.approvals.binding:values
    path: .imports.seam
  - entry: bee.harness.launch:probe_cache
    path: .imports.seam
  - entry: bee.threads.sessions.client:sessions
    path: .imports.seam
  - entry: bee.gateway.binding:directory
    path: .imports.seam
  - entry: bee.gov.binding:publication_service
    path: .imports.seam
  - entry: bee.gateway.security:subject_call
    path: .imports.seam
  - entry: bee.threads.service:pump_config
    path: .imports.seam
  - entry: bee.gov.service:recovery
    path: .imports.seam
  - entry: bee.threads.hooks:supervisor
    path: .imports.seam
  - entry: bee.node.service:tests
    path: .imports.seam
  - entry: bee.node.service:catalog
    path: .imports.seam
  - entry: bee.node.service:owner
    path: .imports.seam
  - entry: bee.shell:main
    path: .imports.seam
  - entry: bee.shell:client
    path: .imports.seam
  - entry: bee.shell:jobs
    path: .imports.seam
  - entry: bee.process:worker
    path: .imports.seam
  - entry: bee.process:demand_owner
    path: .imports.seam
  - entry: bee.hive.service:supervisor
    path: .imports.seam
  - entry: bee.hive:remote
    path: .imports.seam
  - entry: bee.approvals.persist:dispatch
    path: .imports.seam
  - entry: bee.gov.service:backlog
    path: .imports.seam
  - entry: bee.gateway.service:external
    path: .imports.seam
  - entry: bee.gateway.service:backlog
    path: .imports.seam
- name: demand_state
  kind: library.lua
  source: file://demand_state.lua
- name: demand
  kind: library.lua
  source: file://demand.lua
  modules: [process]
- name: demand_owner
  kind: library.lua
  source: file://demand_owner.lua
  modules: [registry, process, events, system, funcs, security, logger, time, channel]
  imports:
    demand: bee.process:demand
    worker: bee.process:worker
    state: bee.process:demand_state
    bounds: bee.drivers.values:bounds
    clock: bee.drivers.values:clock
    seam: bee.process:seam
- name: client_policy
  kind: security.policy
  policy:
    actions: [process.registry.lookup, process.send]
    resources: '*'
    effect: allow
- name: task
  kind: library.lua
  source: file://task.lua
  modules: [channel, time, logger]
  imports:
    worker: bee.process:worker
    clock: bee.drivers.values:clock
- name: backlog_policy
  kind: security.policy
  policy:
    actions: [funcs.call]
    resources: ["bee.credentials.service:backlog", "bee.node.persist:test_backlog", "bee.gov.service:backlog", "bee.gateway.service:backlog", "bee.gateway.service:access_backlog", "bee.placement.docker.service:backlog", "bee.placement.native.service:backlog"]
    effect: allow
- name: kernel
  kind: registry.entry
  meta:
    type: bee.kernel
  data:
    scope: tree
