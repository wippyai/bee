version: '1.0'
namespace: bee.placement.docker.daemon
entries:
- name: definition
  kind: ns.definition
  module: placement-docker-daemon
  readme: |
    Optional Bee Docker daemon lifecycle adapter. The host selects the daemon
    socket and placement owns state, reconciliation and cleanup.
  meta:
    title: Bee Docker daemon adapter
    comment: Optional lifecycle adapter over a host-selected Docker daemon; placement owns state and cleanup
- name: daemon
  kind: library.lua
  source: file://daemon.lua
  modules: [registry]
  imports:
    bounds: bee.threads.records:bounds
    inspection: bee.placement.docker:inspection
    docker_client: userspace.docker:docker_client
- name: placement_service
  kind: library.lua
  source: file://lifecycle/service.lua
  modules: [security, json, process, registry, hash, canonical]
  imports:
    bounds: bee.threads.records:bounds
    resolver: bee.driver:resolver
    placement_resolver: bee.placement:resolver
    request: bee.placement:request
    types: bee.placement:types
    store: bee.placement.native:store
    native_service: bee.placement.native:service
    materialization: bee.placement.native:materialization
    configuration_protocol: bee.driver:configuration
    docker_configuration: bee.placement.docker:configuration
    daemon: bee.placement.docker.daemon:daemon
    resources: bee.placement.native:resources
- name: binding
  kind: contract.binding
  contracts:
  - contract: bee.placement:placement
    methods:
      prepare: bee.placement.docker.daemon:prepare
      start: bee.placement.docker.daemon:start
      status: bee.placement.docker.daemon:status
      stop: bee.placement.docker.daemon:stop
      reconcile: bee.placement.docker.daemon:reconcile
      cleanup: bee.placement.docker.daemon:cleanup
      evidence: bee.placement.docker.daemon:evidence
      attach: bee.placement.docker.daemon:attach
      capabilities: bee.placement.docker.daemon:capabilities
      measure_executable: bee.placement.docker.daemon:measure_executable
      close_stdin: bee.placement.docker.daemon:close_stdin
  meta: {type: placement, placement_kind: docker}
- name: prepare
  kind: function.lua
  source: file://lifecycle/prepare_method.lua
  method: handle
  imports: {service: bee.placement.docker.daemon:placement_service}
- name: start
  kind: function.lua
  source: file://lifecycle/start_method.lua
  method: handle
  imports: {service: bee.placement.docker.daemon:placement_service}
- name: status
