version: '1.0'
namespace: bee.placement.native
entries:
- name: definition
  kind: ns.definition
  module: placement_native
  readme: file://README.md
  meta:
    title: Bee native placement
    comment: Attempts as native children under a runner process, receipts in an owned SQLite store, homes under a placement root
- name: target_db
  kind: ns.requirement
  meta:
    comment: SQL resource for the receipts store
  default: bee.placement.native:db
  targets:
  - entry: bee.placement.native:database_ref
    path: .resource_ref
- name: target_root
  kind: ns.requirement
  meta:
    comment: Filesystem root that holds attempt homes and retained sessions
  default: bee.placement.native:root
  targets:
  - entry: bee.placement.native:root_ref
    path: .resource_ref
- name: process_host
  kind: ns.requirement
  meta:
    comment: Process host that runs attempt runners and the supervision sweeper
  default: bee:workers
  targets:
  - entry: bee.placement.native:runner_host_ref
    path: .host_ref
  - entry: bee.placement.native:sweeper_service
    path: .host
- name: database_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked SQL resource; target_db fills resource_ref
- name: root_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked placement root; target_root fills resource_ref
- name: runner_host_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked runner host; process_host fills host_ref
- name: admitted_roots
  kind: registry.entry
  meta:
    type: bee.placement_roots
    comment: fs.directory entries a launch may name as resource roots on this host with the widest access allowed; host policy, not a delegated grant
  data:
    roots: []
- name: resource_mode
  kind: registry.entry
  meta:
    type: bee.placement_resource_mode
    comment: host_configured or granted; selected by the host, never by a request
  data:
    mode: granted
- name: environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: db_path
  kind: env.variable
  storage: bee.placement.native:environment
  variable: BEE_PLACEMENT_DB
  default: .wippy/placement.db
  readonly: true
- name: root_path
  kind: env.variable
  storage: bee.placement.native:environment
  variable: BEE_PLACEMENT_ROOT
  default: .wippy/placement
  readonly: true
- name: path
  kind: env.variable
  storage: bee.placement.native:environment
  variable: PATH
  default: /usr/local/bin:/usr/bin:/bin
  readonly: true
- name: db
  kind: db.sql.sqlite
  file: ${env:bee.placement.native:db_path}
  lifecycle:
    auto_start: true
- name: root
  kind: fs.directory
  directory: ${env:bee.placement.native:root_path}
  auto_init: true
  mode: '0700'
- name: host_files
  kind: fs.directory
  meta:
    comment: The host filesystem as one volume for the executable measurement; readonly is enforced by a runtime carrying runtime PR 700 and ignored by an older one, where only this module's code keeps it read-only
  directory: /
  auto_init: false
  readonly: true
- name: executable
  kind: library.lua
  source: file://executable.lua
  modules: [fs, hash]
  imports:
    resources: bee.placement.native:resources
    types: bee.placement:types
- name: executor
  kind: exec.native
  meta:
    comment: Children start with a clean environment; PATH comes from the host, everything else from the admitted request
  default_env:
    PATH: ${env:bee.placement.native:path}
- name: migrations
  kind: library.lua
  source: file://migrations.lua
- name: resources
  kind: library.lua
  source: file://resources.lua
  modules: [registry, env, system]
- name: store
  kind: library.lua
  source: file://store.lua
  modules: [sql, json, time]
  imports:
    persist: bee.persist:database
    migrations: bee.placement.native:migrations
    resources: bee.placement.native:resources
    types: bee.placement:types
    transitions: bee.placement:transitions
    request_protocol: bee.placement:request
    configuration: bee.driver:configuration
- name: capability
  kind: library.lua
  source: file://capability.lua
  modules: [exec]
  imports:
    types: bee.placement:types
    resources: bee.placement.native:resources
- name: homes
  kind: library.lua
  source: file://homes.lua
  modules: [fs, hash]
  imports:
    formats: bee.credentials:formats
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    resources: bee.placement.native:resources
- name: identity
  kind: library.lua
  source: file://identity.lua
  modules: [exec]
  imports:
    resources: bee.placement.native:resources
- name: protocol
  kind: library.lua
  source: file://protocol.lua
- name: service
  kind: library.lua
  source: file://service.lua
  modules: [process, channel, time, security, uuid, json, funcs, registry]
  imports:
    gateway_configuration: bee.gateway:configuration
    configuration: bee.driver:configuration
    preferences: bee.driver:preferences
    resolver: bee.driver:resolver
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    types: bee.placement:types
    request: bee.placement:request
    transitions: bee.placement:transitions
    store: bee.placement.native:store
    executable: bee.placement.native:executable
    resources: bee.placement.native:resources
    capability: bee.placement.native:capability
    homes: bee.placement.native:homes
    identity: bee.placement.native:identity
    protocol: bee.placement.native:protocol
    materialization: bee.placement.native:materialization
- name: configuration
  kind: library.lua
  source: file://configuration.lua
  modules: [json]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    types: bee.placement:types
- name: materialization
  kind: library.lua
  source: file://materialization.lua
  modules: [env, funcs, sql]
  imports:
    store: bee.placement.native:store
    resources: bee.placement.native:resources
    homes: bee.placement.native:homes
    configuration: bee.placement.native:configuration
    types: bee.placement:types
- name: runner
  kind: process.lua
  source: file://runner.lua
  method: main
  modules: [process, channel, time, exec, funcs]
  imports:
    materialization: bee.placement.native:materialization
    store: bee.placement.native:store
    executable: bee.placement.native:executable
    resources: bee.placement.native:resources
    identity: bee.placement.native:identity
    protocol: bee.placement.native:protocol
    quote: bee.driver.kit:quote
    types: bee.placement:types
  security:
    policies: [bee:placement_store_policy, bee:placement_exec_policy, bee:placement_runner_policy, bee:credential_materialize_policy, bee:gateway_materialize_policy]
- name: window
  kind: library.lua
  source: file://window.lua
  modules: [process, exec, tty, time, security, funcs]
  imports:
    protocol: bee.placement.native:protocol
    store: bee.placement.native:store
    resources: bee.placement.native:resources
    materialization: bee.placement.native:materialization
    executable: bee.placement.native:executable
    quote: bee.driver.kit:quote
    types: bee.placement:types
    service: bee.placement.native:service
    bounds: bee.threads.records:bounds
    identity: bee.placement.native:identity
- name: sweeper
  kind: process.lua
  source: file://sweeper.lua
  method: main
  modules: [process, channel, time]
  imports:
    service: bee.placement.native:service
- name: sweeper_service
  kind: process.service
  process: bee.placement.native:sweeper
  host: bee:workers
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.placement.sweeper}
      policies: [bee:placement_store_policy, bee:placement_exec_policy, bee:placement_service_policy, bee:resource_resolve_policy, bee:credential_materialize_policy, bee:placement_sweeper_policy, bee:gateway_supervision_policy]
- name: binding
  kind: contract.binding
  contracts:
  - contract: bee.placement:placement
    methods:
      prepare: bee.placement.native:prepare
      start: bee.placement.native:start
      status: bee.placement.native:status
      stop: bee.placement.native:stop
      reconcile: bee.placement.native:reconcile
      cleanup: bee.placement.native:cleanup
      evidence: bee.placement.native:evidence
      attach: bee.placement.native:attach
  meta:
    type: placement
    placement_kind: native
- name: prepare
  kind: function.lua
  source: file://prepare_method.lua
  method: handle
  imports:
    service: bee.placement.native:service
  security:
    policies: [bee:placement_store_policy, bee:placement_exec_policy, bee:placement_service_policy, bee:resource_resolve_policy, bee:credential_materialize_policy, bee:gateway_supervision_policy]
- name: start
