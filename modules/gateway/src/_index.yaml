version: '1.0'
namespace: bee.gateway
entries:
- name: definition
  kind: ns.definition
  module: gateway
  readme: file://README.md
  meta:
    title: Bee gateway
    comment: Authenticated managed-agent bindings, opaque credential hashes, hook intake, and MCP values; the listener and caller authority remain host-selected
- name: dependency_persist
  kind: ns.dependency
  component: bee/persist
  version: '*'
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: dependency_application
  kind: ns.dependency
  component: bee/application
  version: '*'
- name: dependency_approvals
  kind: ns.dependency
  component: bee/approvals
  version: '*'
- name: dependency_governance
  kind: ns.dependency
  component: bee/gov
  version: '*'
- name: dependency_capability
  kind: ns.dependency
  component: bee/capability
  version: '*'
- name: dependency_docs
  kind: ns.dependency
  component: bee/docs
  version: '*'
- name: dependency_hub
  kind: ns.dependency
  component: bee/hub
  version: '*'
- name: target_db
  kind: ns.requirement
  meta: {comment: Host-selected SQLite resource for bindings, credential hashes, listener state, surfaces, and hook intake}
  default: bee.gateway.env:db
  targets:
  - entry: bee.gateway.env:database_ref
    path: .resource_ref
  - entry: bee.gateway.security:store_policy
    path: .policy.resources +=
- name: target_listener
  kind: ns.requirement
  meta: {comment: Host-selected HTTP listener whose supervisor state supplies the native endpoint identity}
  targets:
  - entry: bee.gateway.env:listener_ref
    path: .resource_ref
- name: target_endpoint
  kind: ns.requirement
  meta: {comment: Host-selected endpoint configuration; it describes a destination and never grants a caller network authority}
  targets:
  - entry: bee.gateway.env:endpoint_ref
    path: .resource_ref
  - entry: bee.gateway.security:address_policy
    path: .policy.resources +=
- name: target_approval_request_policy
  kind: ns.requirement
  meta: {comment: Host-selected approval request policy for exact per-binding MCP access proposals; an absent link fails closed}
  targets:
  - entry: bee.gateway.env:approval_request_policy_ref
    path: .resource_ref
  - entry: bee.gateway.security:access_policy_read_policy
    path: .policy.resources +=
- name: target_approval_consume_policy
  kind: ns.requirement
  meta: {comment: Host-selected approval consume policy for exact per-binding MCP access effects; an absent link fails closed}
  targets:
  - entry: bee.gateway.env:approval_consume_policy_ref
    path: .resource_ref
  - entry: bee.gateway.security:access_policy_read_policy
    path: .policy.resources +=
- name: target_tool_read_policy
  kind: ns.requirement
  meta: {comment: Host-selected bound-thread read policy for the built-in MCP tools}
  targets:
  - entry: bee.gateway.env:tool_read_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_message_policy
  kind: ns.requirement
  meta: {comment: Host-selected bound-thread message policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway.env:tool_message_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_overlay_policy
  kind: ns.requirement
  meta: {comment: Host-selected governed-overlay policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway.env:tool_overlay_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_docs_policy
  kind: ns.requirement
  meta: {comment: Host-selected offline-documentation policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway.env:tool_docs_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_components_policy
  kind: ns.requirement
  meta: {comment: Host-selected component-inspection policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway.env:tool_components_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_delivery_policy
  kind: ns.requirement
  meta: {comment: Host-selected delivery policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway.env:tool_delivery_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_publish_policy
  kind: ns.requirement
  meta: {comment: Host-selected publication policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway.env:tool_publish_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_application_open_policy
  kind: ns.requirement
  meta: {comment: Host-selected admitted-application open policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway.env:tool_application_open_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_install_policy
  kind: ns.requirement
  meta: {comment: Host-selected policy for the built-in installation request tools; it admits filing and polling requests and never applying one}
  targets:
  - entry: bee.gateway.env:tool_install_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_session_policy
  kind: ns.requirement
  meta: {comment: Host-selected scope the bound subject opens the bee.sessions owner contracts under for the default session tools; an absent link fails closed}
  targets:
  - entry: bee.gateway.env:tool_session_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_install_configuration
  kind: ns.requirement
  meta: {comment: Host-selected module installation configuration naming the approval policy agent installation requests are filed under; an absent link fails closed}
  targets:
  - entry: bee.gateway.env:install_configuration_ref
    path: .resource_ref
  - entry: bee.gateway.security:installation_policy
    path: .policy.resources +=
- name: target_tool_hub_publish_policy
  kind: ns.requirement
  meta: {comment: Host-selected policy for the built-in Hub publication tools; it admits filing and read-only polling while the owner worker applies only the approved upload}
  targets:
  - entry: bee.gateway.env:tool_hub_publish_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_publish_configuration
  kind: ns.requirement
  meta: {comment: Host-selected Hub publication configuration naming the approval policy agent publication requests are filed under; an absent link fails closed}
  targets:
  - entry: bee.gateway.env:publish_configuration_ref
    path: .resource_ref
  - entry: bee.gateway.security:publication_policy
    path: .policy.resources +=
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  imports:
    bounds: bee.threads.records:bounds
    service_reply: bee.protocol:reply
