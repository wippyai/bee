version: '1.0'
namespace: bee.approvals.inbox.app
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: [tty, process, channel, time, uuid, json, funcs, registry]
  imports:
    frame: bee.app:frame
    client: bee.app:client
    appearance: bee.app:appearance
    model: bee.approvals.inbox.app:model
    view: bee.approvals.inbox.app:view
    inbox: bee.approvals.inbox:client
    caller: bee.app:caller
    feeds: bee.approvals.inbox.app:feeds
    leases: bee.approvals.inbox.app:leases
    lease_form: bee.approvals.inbox.app:lease_form
    source_config: bee.approvals.inbox:source_config
    hive: bee.hive:client
    hive_types: bee.hive:types
  meta:
    type: bee.app
    application:
      api_version: 1
      title: Needs you
      icon: '!'
      lifetime: view
      revision: '1'
      instance_policy: singleton
      group: ''
      role: approvals
      resume_schema: inbox.v1
      restart_policy: manual
- name: model
  kind: library.lua
  source: file://model.lua
  modules: [json]
  imports:
    text: bee.app:text
    bounds: bee.threads.records:bounds
    caller: bee.app:caller
- name: leases
  kind: library.lua
  source: file://leases.lua
  modules: [json]
  imports:
    bounds: bee.threads.records:bounds
    model: bee.approvals.inbox.app:model
- name: lease_form
  kind: library.lua
  source: file://lease_form.lua
  modules: [tty]
  imports:
    appearance: bee.app:appearance
    frame: bee.app:frame
    forms: bee.app:forms
    model: bee.approvals.inbox.app:model
    leases: bee.approvals.inbox.app:leases
- name: feeds
  kind: library.lua
  source: file://feeds.lua
  imports:
    bounds: bee.threads.records:bounds
    sync: bee.sync:protocol
    caller: bee.app:caller
    source_config: bee.approvals.inbox:source_config
    model: bee.approvals.inbox.app:model
- name: view
  kind: library.lua
  source: file://view.lua
  modules: [tty]
  imports:
    frame: bee.app:frame
    appearance: bee.app:appearance
    leases: bee.approvals.inbox.app:leases
    model: bee.approvals.inbox.app:model
    names: bee.app:names
