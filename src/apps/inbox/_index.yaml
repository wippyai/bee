version: '1.0'
namespace: bee.inbox
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: [tty, process, channel, time, uuid, json, funcs, registry]
  imports:
    client: bee.application:client
    appearance: bee.desktop:appearance
    model: bee.inbox:model
    view: bee.inbox:view
    inbox: bee.inbox:client
    caller: bee.application:caller
  meta:
    type: bee.application
    application:
      api_version: 1
      title: Approvals
      icon: '!'
      lifetime: view
      revision: '1'
      instance_policy: singleton
      group: Tools
      role: approvals
      resume_schema: inbox.v1
      restart_policy: manual
- name: model
  kind: library.lua
  source: file://model.lua
  modules: [json]
  imports:
    text: bee.application:text
- name: client
  kind: library.lua
  source: file://client.lua
  imports:
    caller: bee.application:caller
- name: view
  kind: library.lua
  source: file://view.lua
  modules: [tty]
  imports:
    appearance: bee.desktop:appearance
    model: bee.inbox:model
- name: workspaces
  kind: registry.entry
  meta:
    type: bee.inbox_workspaces
    comment: Workspace ids the host admits into the local viewer's inbox beside the launch workspace; the approval owner still decides eligibility per request
  data:
    workspaces: []
- name: client_policy
  kind: security.policy
  meta:
    comment: The inbox reads the owner's inbox and requests and submits explicit decisions and withdrawals under the process actor; the owner authorizes each call
  policy:
    actions: [funcs.call, registry.get]
    resources: [bee.approvals:inbox, bee.approvals:read, bee.approvals:decide, bee.approvals:withdraw, bee.inbox:workspaces]
    effect: allow
