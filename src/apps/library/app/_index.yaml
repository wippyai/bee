version: '1.0'
namespace: bee.apps.library.app
entries:
- name: form
  kind: library.lua
  source: file://form.lua
  modules: [json]
  imports:
    bounds: bee.values:bounds
    json_schema: bee.gateway.catalog:json_schema
    requirements: bee.hub.package:requirements
- name: hub
  kind: library.lua
  source: file://hub.lua
  modules:
  - json
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    text: bee.ui:text
    form: bee.apps.library.app:form
- name: contents
  kind: library.lua
  source: file://contents.lua
  modules:
  - json
  - base64
  imports:
    text: bee.ui:text
- name: model
  kind: library.lua
  source: file://model.lua
  imports:
    governed: bee.gov.client:governed
    hub: bee.apps.library.app:hub
    drivers: bee.gov.types:drivers
    glyphs: bee.ui:glyphs
- name: hub_view
  kind: library.lua
  source: file://hub_view.lua
  modules:
  - tty
  - json
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    model: bee.apps.library.app:hub
    contents: bee.apps.library.app:contents
    form: bee.apps.library.app:form
- name: view
  kind: library.lua
  source: file://view.lua
  modules: [tty]
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    model: bee.apps.library.app:model
    governed: bee.gov.client:governed
    hub: bee.apps.library.app:hub
    hub_view: bee.apps.library.app:hub_view
    contents: bee.apps.library.app:contents
    glyphs: bee.ui:glyphs
    text: bee.ui:text
- name: app
  kind: process.lua
  meta:
    type: bee.app
    application:
      api_version: 1
      title: Library
      lifetime: view
      revision: '1'
      instance_policy: singleton
      menus: [bee.apps.library.app:start_menu]
  source: file://app.lua
  method: main
  modules:
  - json
  - tty
  - process
  - channel
  - uuid
  - funcs
  - time
  imports:
    confirmation: bee.approvals.app:confirmation
    frame: bee.ui:frame
    client: bee.app:client
    appearance: bee.ui:appearance
    model: bee.apps.library.app:model
    governed: bee.gov.client:governed
    hub: bee.apps.library.app:hub
    view: bee.apps.library.app:view
    contents: bee.apps.library.app:contents
  security:
    policies:
    - bee.security.approvals:confirmation_client
    - bee.security.approvals:confirmation_authority
    - bee.apps.library:destination_client
    - bee.apps.library:delivery_operations
    - bee.apps.library:delivery_share
    - bee.apps.library:hub_client
    - bee.apps.library:hub_operations
    - bee.apps.library:names_client
    - bee.apps.library:names_read
    - bee.apps.library:self_update
- name: start_menu
  kind: registry.entry
  meta: {type: bee.menu}
  data:
    title: Library
    location: start
    order: 30
