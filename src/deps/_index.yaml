- name: sync
  kind: ns.dependency
  component: bee/sync
  version: 0.1.0-dev
  parameters:
  - name: target_sender
    value: bee.hive.service:replica_sender
  - name: target_exports
    value: bee.sync.env:sync_exports
  - name: target_admit_policies
    value:
    - bee.security.hive:hive_replica_admission_policy
- name: threads
  kind: ns.dependency
  component: bee/threads
  version: 0.1.0-dev
  parameters:
