version: '1.0'
namespace: bee.driver.codex
entries:
- name: definition
  kind: ns.definition
  module: driver-codex
  readme: file://README.md
  meta:
    title: Bee Codex driver
    comment: Optional harness binding; host activation and launch policies authorize its use
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: host_environment
  kind: ns.requirement
  meta:
    comment: Read-only host environment that supplies the selected Codex executable
  default: bee.harness.host:environment
  targets:
  - entry: bee.driver.codex:executable
    path: .storage
- name: window_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Codex window route
  default: bee.driver.codex:launch_policy_codex_window
  targets:
  - entry: bee.driver.codex:default_window
    path: .data.policy_ref
- name: batch_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned bounded Codex batch route
  default: bee.driver.codex:launch_policy_codex_batch
  targets:
  - entry: bee.driver.codex:research_batch
    path: .data.policy_ref
- name: named_batch_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Codex named-profile batch route
  default: bee.driver.codex:launch_policy_codex_named_batch
  targets:
  - entry: bee.driver.codex:named_batch
    path: .data.policy_ref
- name: default_provider
  kind: registry.entry
  meta:
    type: bee.codex_provider
    comment: Built-in account login with Codex's default model; host policy selects this configuration
  data:
    schema_revision: bee.codex-provider@1
    name: openai
    authentication: chatgpt
- name: executable
  kind: env.variable
  storage: bee.harness.host:environment
  variable: codex
  default: ''
  readonly: true
- name: environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: config_home
  kind: env.variable
  storage: bee.harness.host:environment
  variable: CODEX_HOME
  default: ''
  readonly: true
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  imports:
    universal: bee.driver:universal
- name: configuration
  kind: library.lua
  source: file://configuration.lua
  modules: [hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    shared_configuration: bee.driver:configuration
    toml: bee.driver.kit:toml
- name: launch
  kind: library.lua
  source: file://launch.lua
  imports:
    universal: bee.driver:universal

- name: locate
  kind: library.lua
  source: file://locate.lua
  imports:
    universal: bee.driver:universal
- name: binding
  kind: contract.binding
  contracts:
  - contract: bee.driver:driver
    methods:
      prepare: bee.driver.codex.binding:prepare
      dispatch: bee.driver.codex.binding:dispatch
      normalize: bee.driver.codex.binding:normalize
      configure: bee.driver.codex.binding:configure
  - contract: bee.driver:locate_facet
    methods:
      locate: bee.driver.codex.binding:locate
  meta:
    type: harness.driver
    driver_id: codex
    descriptor_ref: bee.driver.codex.descriptor:cli
    accepts_model: false
    profiles_ref: bee.driver.codex:profiles
- name: profiles
  kind: registry.entry
  meta:
    type: harness.profile
    driver_ref: bee.driver.codex:binding
  data:
    driver:
      schema_revision: bee.driver@1
      kind: harness
      title: Codex CLI
      implementation_version: 0.154.0
      default_profile: batch
      profiles:
      - id: batch
        mode: batch
        hooks:
          transports:
          - command
          - mcp_tool
          events:
          - SessionStart
          - UserPromptSubmit
          - PreToolUse
          - PostToolUse
          - PermissionRequest
          - Stop
          - SessionEnd
          adapter_ref: bee.driver.codex:protocol
        inbound:
        - next_turn
        protocol: stream-json
        protocol_revision: exec-json-1
        answer_path:
          strategy: accumulate
          adapter_ref: bee.driver.codex:protocol
        resume:
          strategy: per-process
          portable: false
        isolation_env:
          variables:
          - HOME
          - CODEX_HOME
          private_home: true
        exit_codes_trustworthy: false
        input_ready:
          strategy: protocol
          adapter_ref: bee.driver.codex:protocol
          timeout_ms: 15000
        interrupt:
          methods:
          - signal_group
        mcp:
          client_transports:
          - stdio
          - streamable_http
          initialize_timeout_ms: 30000
        sandbox:
          providers:
          - codex-sandbox
          required_placement_features: []
          git_writable_roots_adapter: codex_workspace_write
      - id: named_batch
        mode: batch
        protocol: stream-json
        protocol_revision: exec-json-1
        answer_path:
          strategy: accumulate
          adapter_ref: bee.driver.codex:protocol
        resume:
          strategy: per-process
          portable: false
        isolation_env:
          variables:
          - HOME
          - CODEX_HOME
          private_home: true
        exit_codes_trustworthy: false
        input_ready:
          strategy: protocol
          adapter_ref: bee.driver.codex:protocol
          timeout_ms: 15000
        interrupt:
          methods:
          - signal_group
        mcp:
          client_transports:
          - stdio
          - streamable_http
          initialize_timeout_ms: 30000
        sandbox:
          providers:
          - codex-sandbox
          required_placement_features: []
          git_writable_roots_adapter: codex_workspace_write
      - id: window
        mode: window
        protocol: pty
        protocol_revision: native-window-1
        answer_path: {strategy: none}
        resume: {strategy: none, portable: false}
        isolation_env:
          variables: [HOME, CODEX_HOME]
          private_home: false
        exit_codes_trustworthy: false
        input_ready: {strategy: none}
        sandbox:
          providers: [codex-sandbox]
          required_placement_features: []
          git_writable_roots_adapter: codex_workspace_write
        permission_exchange: {mode: none}
- name: default_window
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned Codex window declaration; the host separately selects its policy, activation, executable and permissions
  data:
    schema_revision: bee.launch-definition@1
    launch_id: codex-window
    title: Codex CLI
    command_names: [codex]
    binding_ref: bee.driver.codex:binding
    profile_id: window
    policy_ref: ''
    default_mode: window
    allowed_overrides: [thread, workdir]
    workdir_policy: {kind: declared_resource, resource_ref: project}
    thread_policy: {kind: new}
    session_resource: session
    credentials: []
    presentation: {start_menu: true, fullscreen: true, reuse: never}
- name: research_batch
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned bounded Codex batch route for a host-selected coordinator and caller-owned shared thread
  data:
    schema_revision: bee.launch-definition@1
    launch_id: codex-research-batch
    title: Codex researcher
    command_names: []
    binding_ref: bee.driver.codex:binding
    profile_id: batch
    policy_ref: ''
    default_mode: batch
    allowed_overrides: [thread, workdir]
    workdir_policy: {kind: declared_resource, resource_ref: project}
    thread_policy: {kind: caller}
    session_resource: session
    credentials: [codex_login]
    presentation: {start_menu: false, fullscreen: false, reuse: never}

- name: named_batch
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned structured Codex route that projects its selected named profile, login and required configuration into a private home
  data:
    schema_revision: bee.launch-definition@1
    launch_id: codex-named-batch
    title: Codex named profile
    command_names: []
    binding_ref: bee.driver.codex:binding
    profile_id: named_batch
    policy_ref: ''
    default_mode: batch
    allowed_overrides: [thread, workdir]
    workdir_policy: {kind: declared_resource, resource_ref: project}
    thread_policy: {kind: caller}
    session_resource: session
    credentials: [codex_login]
    presentation: {start_menu: false, fullscreen: false, reuse: never}

- name: credential_format
  kind: registry.entry
  meta:
    type: bee.credential_format
  data:
    schema_revision: bee.credential-format@1
    environment_destination: OPENAI_API_KEY
    file:
      path: .codex/auth.json
      content_format: json
      initialize: []
- name: command
  kind: registry.entry
  meta:
    type: bee.application_command
    comment: CLI command to launch Codex CLI in the agent window
  data:
    name: codex
    definition_id: bee.harness.window:app
    arguments:
    - bee.driver.codex:default_window
    fullscreen: true

- name: launch_policy_codex_batch
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected Codex batch policy for bounded research actions on a caller-owned thread; private home with no host inheritance, workspace-write CLI sandbox
  data:
    schema_revision: bee.launch-policy@2
    allowed_overrides: [thread, workdir]
    required_cleanup: process_group
    required_exit_observation: independent
    start_ms: 15000
    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables: {}
    executable_env: {codex: bee.driver.codex:executable}
    environment: {}
    environment_refs: {}
    allow_host_home: false
    gateway_tools: [thread_read, thread_wait, thread_message, thread_sessions, thread_notify, session_directory, session_inbox_send, session_inbox, session_ack, session_reply, overlay, delivery, docs, components, install_request, uninstall_request, install_status]
    gateway_hooks: [SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, Stop]
    profile_instructions: true
    profile_options: {effort: [low, medium, high], config_profile: {kind: text, max_bytes: 64}}
    prepare_options: {sandbox: workspace-write}
- name: launch_policy_codex_named_batch
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected structured Codex route that projects one admitted named Codex profile into its private home; read-only, one bounded turn on a caller-owned thread
  data:
    schema_revision: bee.launch-policy@2
    allowed_overrides: [thread, workdir]
    required_cleanup: process_group
    required_exit_observation: independent
    start_ms: 15000
    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables: {}
    executable_env: {codex: bee.driver.codex:executable}
    environment: {}
    environment_refs: {}
    allow_host_home: false
    gateway_tools: [thread_read, thread_wait, thread_message, thread_sessions, thread_notify, session_directory, session_inbox_send, session_inbox, session_ack, session_reply, overlay, delivery, docs, components, install_request, uninstall_request, install_status]
    gateway_hooks: [SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, Stop]
    profile_instructions: true
    profile_options: {effort: [low, medium, high], config_profile: {kind: text, max_bytes: 64}}
    prepare_options: {sandbox: workspace-write}
- name: launch_policy_codex_window
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected executable binding for the component-owned Codex window; missing host executable leaves
      the declaration unavailable
  data:
    schema_revision: bee.launch-policy@2
    allowed_overrides: [thread, workdir]
    required_cleanup: process_group
    required_exit_observation: independent
    start_ms: 15000
    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables: {}
    executable_env:
      codex: bee.driver.codex:executable
    environment: {}
    environment_refs:
      CODEX_HOME: bee.driver.codex:config_home
    allow_host_home: true
    gateway_tools:
    - thread_read
    - thread_wait
    - thread_message
    - thread_sessions
    - thread_notify
    - session_directory
    - session_inbox_send
    - session_inbox
    - session_ack
    - session_reply
    - overlay
    - delivery
    - docs
    - components
    - install_request
    - uninstall_request
    - install_status
    gateway_hooks:
    - SessionStart
    - UserPromptSubmit
    - PreToolUse
    - PostToolUse
    - Stop
    profile_options:
      effort:
      - low
      - medium
      - high
      config_profile: {kind: text, max_bytes: 64}
    profile_instructions: true
    prepare_options: {}
