version: '1.0'
namespace: bee.persist
entries:
- name: database
  kind: library.lua
  source: file://database.lua
  modules: [sql]
- name: transaction
  kind: library.lua
  source: file://transaction.lua
  modules: [sql]
- name: state_guard
  kind: library.lua
  source: file://state_guard.lua
  modules: [sql, registry, json, system]
  imports:
    ledger: wippy.migration:repository
    writer_version: bee.env.identity:state_writer_version
    activations: bee.gov.persist:activation_store
    bounds: bee.values:bounds
- name: state_guard_bootloader
  kind: function.lua
  source: file://state_guard.lua
  method: run
  modules: [sql, registry, json, system]
  imports:
    ledger: wippy.migration:repository
    writer_version: bee.env.identity:state_writer_version
    activations: bee.gov.persist:activation_store
    bounds: bee.values:bounds
  meta:
    type: bootloader
    order: 5
    description: Refuse unsupported state schema before migrations
    requires: [bee:db, bee:terminal]
- name: state_refusal
  kind: process.lua
  source: file://state_refusal.lua
  method: main
  modules: [io]
