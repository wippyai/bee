- name: hub
  kind: ns.dependency
  component: bee/hub
  version: 0.1.0-dev
  parameters:
  - name: process_host
    value: bee:workers
  - name: target_publish_configuration
    value: bee.hub.publication:hub_publication
- name: gov
  kind: ns.dependency
  component: bee/gov
  version: 0.1.0-dev
