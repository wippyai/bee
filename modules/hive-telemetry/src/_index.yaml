version: '1.0'
namespace: bee.hive.telemetry
entries:
- name: definition
  kind: ns.definition
  module: hive-telemetry
  readme: file://README.md
  meta:
    title: Bee hive telemetry
    comment: Optional cluster telemetry; host composition and policy selection remain
      in Bee
- name: dependency_application
  kind: ns.dependency
  component: bee/application
  version: '*'
- name: dependency_hive
  kind: ns.dependency
  component: bee/hive
  version: '*'
- name: target_exposure
  kind: ns.requirement
  meta:
    capability: hive.expose
    parameters:
      operations:
      - bee.hive.telemetry.binding:presence
      - bee.hive.telemetry.binding:stats
      - bee.hive.telemetry.binding:catalog_list
      - bee.hive.telemetry.binding:holdings
      - bee.hive.telemetry.binding:cluster
      - bee.hive.telemetry.binding:node_summary
      mode: open
      audiences:
      - '*'
    reason: Expose the package open telemetry operations to Hive peers
    value_kind: security.policy
  targets:
  - entry: bee.hive.telemetry.binding:presence
    path: .security.policies +=
- name: target_presence_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.hive.telemetry.binding:presence
    path: .security.policies
  - entry: bee.hive.telemetry.binding:stats
    path: .security.policies
- name: target_catalog_list_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.hive.telemetry.binding:catalog_list
    path: .security.policies
- name: target_holdings_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.hive.telemetry.binding:holdings
    path: .security.policies
- name: target_cluster_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.hive.telemetry.binding:cluster
    path: .security.policies
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: dependency_approvals
  kind: ns.dependency
  component: bee/approvals
  version: '*'
- name: dependency_node
  kind: ns.dependency
  component: bee/node
  version: '*'
- name: target_peers
  kind: ns.requirement
  default: bee.hive.telemetry.env:empty_peers
  targets:
  - entry: bee.hive.telemetry.env:peer_source
    path: .resource_ref
  - entry: bee.hive.telemetry.security:peer_source_policy
    path: .policy.resources
- name: status_contract
  kind: contract.definition
  methods:
  - name: snapshot
    description: Read bounded live Hive node names, connectivity and owner-reported
      running session and pending approval counts
  - name: detail
    description: Read one enrolled Hive node by node_id with the same counts-only
      status fields
- name: dependency_gov
  kind: ns.dependency
  component: bee/gov
  version: '*'
- name: target_status_policies
  kind: ns.requirement
  default: []
  targets:
  - entry: bee.hive.telemetry.binding:snapshot
    path: .security.policies
  - entry: bee.hive.telemetry.binding:detail
    path: .security.policies
- name: target_summary_policies
  kind: ns.requirement
  default: []
  targets:
  - entry: bee.hive.telemetry.binding:node_summary
    path: .security.policies
- name: dependency_values
  kind: ns.dependency
  component: bee/values
  version: '*'
- name: dependency_workspace
  kind: ns.dependency
  component: bee/workspace
  version: '*'
