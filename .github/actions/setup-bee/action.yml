name: Pinned Bee platform
description: Restore one pinned toolchain and Go cache; saving is explicit in CI only.
inputs:
  target:
    description: Release platform whose Go compilation cache is restored
    required: true
outputs:
  cache-key:
    value: ${{ steps.key.outputs.cache-key }}
    description: Pinned platform cache fingerprint
  cache-hit:
    value: ${{ steps.cache.outputs.cache-hit }}
    description: Whether the exact platform cache is restored
  tools-path:
    value: ${{ steps.key.outputs.tools-path }}
    description: Pinned host toolchain cache directory
  tools-key:
    description: Pinned host toolchain fingerprint
    value: ${{ steps.key.outputs.tools-key }}
  tools-hit:
    description: Whether the exact host toolchain is restored
    value: ${{ steps.tools.outputs.cache-hit }}
  go-path:
    description: Go module and compilation cache directories
    value: ${{ steps.key.outputs.go-path }}
  lua-path:
    description: Lua cache directory for the pinned toolchain
    value: ${{ steps.key.outputs.lua-path }}
  runtime:
    description: Exact runtime commit
    value: ${{ steps.key.outputs.runtime }}
runs:
  using: composite
  steps:
  - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
    with:
      python-version: '3.12'
  - id: key
    shell: bash
    env:
      TARGET: ${{ inputs.target }}
    run: make --no-print-directory ci-tools-outputs >> "$GITHUB_OUTPUT"
  - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
    with:
      go-version: ${{ steps.key.outputs.go }}
      cache: false
  - id: tools
    uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
    with:
      path: ${{ steps.key.outputs.tools-path }}
      key: bee-tools-v3-${{ steps.key.outputs.tools-key }}
      fail-on-cache-miss: ${{ github.workflow == 'Bee release' }}
  - id: cache
    uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
    with:
      path: ${{ steps.key.outputs.go-path }}
      key: ${{ steps.key.outputs.cache-key }}
      restore-keys: ${{ steps.key.outputs.cache-prefix }}
      fail-on-cache-miss: ${{ github.workflow == 'Bee release' }}
  - name: Python dependencies
    shell: bash
    run: pip install -r tests/requirements.txt
  - name: Pinned toolchain
    shell: bash
    run: make tools
