version: '1.0'
namespace: bee.console.security
entries:
- name: executor_policy
  kind: security.policy
  policy:
    actions:
    - exec.get
    resources:
    - bee.console.env:executor
    effect: allow
- name: command_policy
  kind: security.policy
  policy:
    actions:
    - exec.run
    resources: '*'
    effect: allow
