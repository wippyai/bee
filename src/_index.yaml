version: '1.0'
namespace: bee
entries:
- name: definition
  kind: ns.definition
  meta:
    title: Bee desktop foundation
- name: dependency_persist
  kind: ns.dependency
  component: bee/persist
  version: 0.1.0-dev
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: 0.1.0-dev
- name: workers
  kind: process.host
  host:
    max_processes: 24
    workers: 4
  lifecycle:
    auto_start: true
- name: terminal
  kind: terminal.host
  hide_logs: true
  lifecycle:
    auto_start: true
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_driver_agy
  kind: ns.dependency
  component: bee/driver-agy
  version: '*'
  parameters:
  - name: host_environment
    value: bee.harness.host:environment
  - name: window_policy
    value: bee:launch_policy_agy_window
  - name: batch_policy
    value: bee:launch_policy_agy_batch
- name: dependency_driver_claude
  kind: ns.dependency
  component: bee/driver-claude
  version: '*'
  parameters:
  - name: host_environment
    value: bee.harness.host:environment
  - name: window_policy
    value: bee:launch_policy_claude_window
  - name: batch_policy
    value: bee:launch_policy_claude_batch
- name: dependency_driver_codex
  kind: ns.dependency
  component: bee/driver-codex
  version: '*'
  parameters:
  - name: host_environment
    value: bee.harness.host:environment
  - name: window_policy
    value: bee:launch_policy_codex_window
  - name: batch_policy
    value: bee:launch_policy_codex_batch
  - name: named_batch_policy
    value: bee:launch_policy_codex_named_batch
- name: dependency_driver_grok
  kind: ns.dependency
  component: bee/driver-grok
  version: '*'
  parameters:
  - name: host_environment
    value: bee.harness.host:environment
  - name: window_policy
    value: bee:launch_policy_grok_window
- name: dependency_driver_muse
  kind: ns.dependency
  component: bee/driver-muse
  version: '*'
  parameters:
  - name: host_environment
    value: bee.harness.host:environment
  - name: window_policy
    value: bee:launch_policy_muse_window
  - name: batch_policy
    value: bee:launch_policy_muse_batch
