version: '1.0'
namespace: bee.hive_host
entries:
- name: supervisor_host
  kind: process.host
  host: {max_processes: 1, workers: 1}
  lifecycle: {auto_start: true}
  meta:
    comment: Only the supervisor runs here; a sender PID on this host is this node's supervisor
- name: supervisor_service
  kind: process.service
  process: bee.hive_host.supervisor:main
  host: bee.hive_host:supervisor_host
  input:
  - configured_nodes: []
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.hive_host.supervisor}
      policies:
      - bee.security.hive:hive_supervisor_policy
      - bee.security.hive:hive_catalog_policy
      - bee.security.hive:hive_exposure_policy
      - bee.security.hive:hive_policy_exposure_policy
      - bee.security.hive:hive_dispatch_policy
      - bee.security.hive:hive_names_policy
      - bee.security.hive:hive_advertise_policy
      - bee.security.hive:hive_execute_policy
      - bee.security.hive:hive_invite_policy
      - bee.security.hive:hive_owner_stop_policy
      # Enrolled local clients' bee workspace commands run through their worker.
      - bee.security.hive:workspace_command_policy
      # The supervisor composes the retained desktop bridge, so it needs the
      # desktop host policy that authorizes desktop admission, and the bridge
      # reads the node's displays and one page of its workspace catalog.
      - bee.hive_host.desktop:host_policy
      - bee.security.desktop:desktop_catalog_policy
      - bee.security.desktop:desktop_catalog_resource_policy
      - bee.security.storage:workspace_catalog_read_policy
      - bee.hive_host.desktop:catalog_call_policy
  meta:
    comment: Default local Hive supervisor; a host overlay may replace input with admitted peer IDs and optional desktop configuration
- name: workspaces
  kind: function.lua
  source: file://workspaces.lua
  method: handle
  modules: [funcs, process, system]
  imports:
    bounds: bee.threads.records:bounds
    contract: bee.protocol:application
  meta:
    comment: Open Hive operation listing one page of this node's workspace catalog and which workspaces a host serves now
    hive: open
    hive_operation:
      revision: '1'
      title: Node workspaces
      input:
        type: object
        additionalProperties: false
        properties:
          label: {type: string, minLength: 1, maxLength: 240}
          after: {type: string, minLength: 1, maxLength: 2200}
          limit: {type: integer, minimum: 1, maximum: 50}
      output:
        type: object
        additionalProperties: false
        required: [node_id, workspaces]
        properties:
          node_id: {type: string}
          next_after: {type: string}
          workspaces:
            type: array
            maxItems: 50
            items:
              type: object
              additionalProperties: false
              required: [workspace_id, label, served]
              properties:
                workspace_id: {type: string}
                label: {type: string}
                served: {type: boolean}
  security:
    policies: [bee.security.hive:hive_telemetry_policy, bee.security.storage:workspace_catalog_read_policy, bee.security.hive:workspaces_policy]
