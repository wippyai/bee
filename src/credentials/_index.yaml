version: '1.0'
namespace: bee.credentials
entries:
- name: formats
  kind: library.lua
  source: file://formats.lua
  imports:
    bounds: bee.values:bounds
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  imports:
    bounds: bee.values:bounds
    formats: bee.credentials:formats
- name: contract
  kind: contract.definition
  meta:
    comment: Definitions and projections for one node's workspaces; check and materialize are for admitted materializers only
  methods:
  - name: define
    description: Name a credential from a host-admitted source; optional expected_revision fences create or replacement
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"workspace_id":{"type":"string"},"name":{"type":"string"},"expected_revision":{"type":"integer"},"optional":{"type":"boolean"},"provider":{"type":"string"},"source":{"type":"object"},"projection_kind":{"type":"string"}},"additionalProperties":true,"description":"Name a credential from a host-admitted source; optional expected_revision fences create or replacement"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: issue_projection
    description: Bind a credential to one attempt, profile, binding and policy for one audience, as the authenticated subject
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"workspace_id":{"type":"string"},"name":{"type":"string"},"audience":{"type":"string"},"attempt_id":{"type":"string"},"profile_id":{"type":"string"},"profile_digest":{"type":"string"},"binding_digest":{"type":"string"},"launch_policy_digest":{"type":"string"},"idempotency_key":{"type":"string"},"ttl_ms":{"type":"integer"}},"additionalProperties":true,"description":"Bind a credential to one attempt, profile, binding and policy for one audience, as the authenticated subject"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: check
    description: Re-check a projection's bindings without bytes
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"projection_id":{"type":"string"},"subject":{"type":"string"},"audience":{"type":"string"},"attempt_id":{"type":"string"}},"additionalProperties":true,"description":"Re-check a projection's bindings without bytes"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: renew_attempt
    description: Extend the projections a live attempt holds by their recorded term, for the materializer that supervises
      the attempt
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"attempt_id":{"type":"string"},"subject":{"type":"string"},"audience":{"type":"string"}},"additionalProperties":true,"description":"Extend the projections a live attempt holds by their recorded term, for the materializer that supervises the attempt"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: availability
    description: Check the provider-fixed login file for an existing workspace credential without reading bytes
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"workspace_id":{"type":"string"},"name":{"type":"string"}},"additionalProperties":true,"description":"Check the provider-fixed login file for an existing workspace credential without reading bytes"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: configuration_setup
    description: Measure a declared configuration base, report setup status or ask the person to approve its digest before
      launch
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"workspace_id":{"type":"string"},"provider":{"type":"string"},"base_path":{"type":"string"},"operation":{"type":"string"},"attempt_id":{"type":"string"}},"additionalProperties":true,"description":"Measure a declared configuration base, report setup status or ask the person to approve its digest before launch"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: materialize
    description: Re-check a projection and return its bytes once to the admitted materializer
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"projection_id":{"type":"string"},"subject":{"type":"string"},"audience":{"type":"string"},"attempt_id":{"type":"string"},"content_format":{"type":"string"}},"additionalProperties":true,"description":"Re-check a projection and return its bytes once to the admitted materializer"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: write_back
    description: Return one refreshed provider login file through the original projection and source binding
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"projection_id":{"type":"string"},"subject":{"type":"string"},"audience":{"type":"string"},"attempt_id":{"type":"string"},"generation":{"type":"integer"},"source_digest":{"type":"string"},"value":{}},"additionalProperties":true,"description":"Return one refreshed provider login file through the original projection and source binding"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: revoke
    description: End one projection
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"projection_id":{"type":"string"}},"additionalProperties":true,"description":"End one projection"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: revoke_all
    description: Advance the workspace authorization epoch so every earlier projection stops resolving
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"workspace_id":{"type":"string"}},"additionalProperties":true,"description":"Advance the workspace authorization epoch so every earlier projection stops resolving"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: list
    description: A manager's view of definitions and live projections
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"workspace_id":{"type":"string"}},"additionalProperties":true,"description":"A manager's view of definitions and live projections"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
- name: configuration_admission
  kind: library.lua
  source: file://configuration_admission.lua
  modules:
  - hash
  imports:
    canonical: bee.values:canonical
    bounds: bee.values:bounds
