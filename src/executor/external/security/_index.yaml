version: '1.0'
namespace: bee.executor.external.security
entries:
- name: driver_placement_calls
  kind: security.policy
  meta:
    comment: External turn worker calls the selected bee.driver operations and native placement operations
  policy:
    actions:
    - funcs.call
    resources:
    - bee.gov.binding:driver_bindings
    - bee.driver.*.binding:prepare
    - bee.driver.*.binding:dispatch
    - bee.driver.*.binding:normalize
    - bee.threads.binding:turn_observation
    - bee.harness.binding:call
    - bee.approvals.binding:runtime_lease
    - bee.resources.binding:grant
    - bee.credentials.binding:issue_projection
    - bee.placement.native.binding:prepare
    - bee.placement.native.binding:attach
    - bee.placement.native.binding:close_stdin
    - bee.placement.native.binding:start
    - bee.placement.native.binding:stop
    - bee.placement.native.binding:reconcile
    - bee.placement.native.binding:cleanup
    - bee.placement.native.binding:capabilities
    - bee.placement.native.binding:measure_executable
    - bee.gateway.binding:check
    - bee.gateway.binding:admit
    - bee.gateway.binding:ready
    - bee.gateway.binding:revoke
    effect: allow
- name: placement_stream
  kind: security.policy
  policy:
    actions:
    - process.listen
    - process.send
    resources:
    - bee.placement.output
    - bee.placement.exit
    - bee.placement.ack
    effect: allow
- name: runner_observation
  kind: security.policy
  policy:
    actions:
    - process.monitor
    - process.unmonitor
    resources: '*'
    effect: allow
