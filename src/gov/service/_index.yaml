version: '1.0'
namespace: bee.governance.service
entries:
- name: recovery
  kind: process.lua
  source: file://recovery.lua
  method: main
  modules: [process]
  imports: {service: bee.governance.binding:destination_service}
- name: recovery_service
  kind: process.service
  process: bee.governance.service:recovery
  host: bee:workers
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.governance.activation}
      policies: [bee:governance_destination_service_policy]
