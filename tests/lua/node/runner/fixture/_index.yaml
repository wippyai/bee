version: '1.0'
namespace: bee.tests.node.runner.fixture
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: [process]
  meta:
    type: bee.application
    test_overlay: runner_fixture
    application: {api_version: 1, title: Runner fixture, lifetime: view, revision: '1', instance_policy: multiple, menus: [bee.shell:apps_menu]}
- name: admission
  kind: registry.entry
  meta:
    type: bee.node.application_admission
    comment: Admits the fixture application with one grant, as a delivered application is admitted
  data:
    tests:
      bee.tests.node.runner.fixture:app: [bee.tests.node.runner.fixture:authority_test, bee.tests.node.runner.fixture:failing_test, bee.tests.node.runner.fixture:slow_test]
    bindings:
    - definition_id: bee.tests.node.runner.fixture:app
      policies: [bee.tests.node.runner.fixture:grant]
- name: grant
  kind: security.policy
  meta: {comment: The one action the fixture application is granted}
  policy:
    actions: [fixture.probe]
    resources: [granted]
    effect: allow
- name: authority_test
  kind: function.lua
  source: file://authority_test.lua
  method: run
  modules: [security]
  meta: {type: app_test, application: bee.tests.node.runner.fixture:app, suite: fixture, order: 1}
  imports:
    test: wippy.test:test
- name: failing_test
  kind: function.lua
  source: file://failing_test.lua
  method: run
  meta: {type: app_test, application: bee.tests.node.runner.fixture:app, suite: fixture, order: 2}
  imports:
    test: wippy.test:test
- name: slow_test
  kind: function.lua
  source: file://slow_test.lua
  method: run
  modules: [time]
  meta: {type: app_test, application: bee.tests.node.runner.fixture:app, suite: fixture, order: 3, timeout: 1s}
  imports:
    test: wippy.test:test
