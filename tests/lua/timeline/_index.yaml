version: '1.0'
namespace: bee.timeline
entries:
- name: format_test
  kind: function.lua
  source: file://format_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    format: bee.timeline:format
    record: bee.threads.records:record
- name: policy_test
  kind: function.lua
  source: file://policy_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [security]
  imports:
    test: wippy.test:test
    model: bee.timeline:model
- name: model_test
  kind: function.lua
  source: file://model_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [json]
  imports:
    test: wippy.test:test
    model: bee.timeline:model
- name: view_test
  kind: function.lua
  source: file://view_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [tty]
  imports:
    test: wippy.test:test
    model: bee.timeline:model
    view: bee.timeline:view
    appearance: bee.desktop:appearance
- name: surface_test
  kind: function.lua
  source: file://surface_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "120s"}
  modules: [funcs, security, tty]
  security:
    policies: [bee.threads:client_test_policy, bee:thread_create_policy, bee:thread_observe_policy, bee:thread_lifecycle_policy]
  imports:
    test: wippy.test:test
    model: bee.timeline:model
    view: bee.timeline:view
    caller: bee.application:caller
    appearance: bee.desktop:appearance
    harness: bee.threads:harness
