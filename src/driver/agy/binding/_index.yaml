version: '1.0'
namespace: bee.driver.agy.binding
entries:
- name: prepare
  kind: function.lua
  source: file://prepare.lua
  method: handle
  imports:
    universal: bee.driver.binding:universal
- name: dispatch
  kind: function.lua
  source: file://dispatch.lua
  method: handle
  imports:
    universal: bee.driver.binding:universal
- name: configure
  kind: function.lua
  source: file://configure.lua
  method: handle
  imports:
    configuration: bee.driver.agy.binding:configuration
    configure_protocol: bee.driver.binding:configuration
    universal: bee.driver.binding:universal
  security:
    policies:
    - bee.driver.agy.binding:configuration_policy
- name: locate
  kind: function.lua
  source: file://locate.lua
  method: handle
  imports:
    universal: bee.driver.binding:universal
- name: normalize
  kind: function.lua
  source: file://normalize.lua
  method: handle
  imports:
    universal: bee.driver.binding:universal
- name: configuration_policy
  kind: security.policy.expr
  meta:
    comment: Read only the descriptor that declares this configuration renderer
  policy:
    effect: allow
    actions:
    - registry.get
    - registry.snapshot
    - funcs.call
    resources:
    - '*'
    expression: (action == "registry.get" && resource == "bee.driver.agy.descriptor:cli") || action == "registry.snapshot" || (action == "funcs.call" && resource == "bee.placement.profiles:context")
- name: configuration
  kind: library.lua
  source: file://configuration.lua
  modules:
  - hash
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    configure_protocol: bee.driver.binding:configuration
    quote: bee.driver.binding:quote
- name: binding
  kind: contract.binding
  contracts:
  - contract: bee.driver:driver
    methods:
      prepare: bee.driver.agy.binding:prepare
      dispatch: bee.driver.agy.binding:dispatch
      normalize: bee.driver.agy.binding:normalize
      configure: bee.driver.agy.binding:configure
  - contract: bee.driver:locate_facet
    methods:
      locate: bee.driver.agy.binding:locate
  meta:
    type: harness.driver
    driver_id: agy
    descriptor_ref: bee.driver.agy.descriptor:cli
    accepts_model: true
    profiles_ref: bee.driver.agy.profiles:profiles
