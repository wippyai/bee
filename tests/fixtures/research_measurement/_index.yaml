# SPDX-License-Identifier: MIT
version: '1.0'
namespace: bee.research_measurement
entries:
- name: probe_policy
  kind: security.policy
  policy: {actions: ['*'], resources: ['*'], effect: allow}
- name: probe
  kind: function.lua
  method: run
  source: file://probe.lua
  modules: [funcs, registry, security, http_client, json, time, hash]
  imports: {bounds: bee.threads.records:bounds}
  security: {policies: [bee.research_measurement:probe_policy]}
- name: inputs
  kind: registry.entry
  data: {baseline_sha256: '', candidate_sha256: ''}
- name: measure
  kind: function.lua
  method: run
  source: |
    local measure = require("measure")
    local baseline = require("baseline")
    local function run(label: string): {[string]: unknown}
        if label == "baseline" then return measure.run(baseline.encode) end
        error("unknown benchmark label")
    end
    return {run = run}
  imports:
    measure: bee.research_benchmark_probe:measure
    baseline: bee.research_benchmark_probe:canonical
- name: run
  kind: function.lua
  source: file://tool.lua
  method: run
  modules: [ctx, funcs, channel, time, registry, security, hash, json]
  imports: {bounds: bee.threads.records:bounds}
- name: tool_policy
  kind: security.policy
  policy:
    actions: [funcs.call, registry.get]
    resources: [bee.research_measurement:run, bee.research_measurement:measure,
      bee.research_measurement:inputs, bee.research_benchmark_probe:canonical,
      bee.research.demo:canonical, bee.research.demo:measure, bee.threads.service:read_after, bee.threads.service:record]
    effect: allow
- name: attribution_policy
  kind: security.policy
  policy:
    actions: [security.actor.create]
    resources: [bee.research.measurement]
    effect: allow
- name: observation_policy
  kind: security.policy
  policy:
    actions: [bee.threads.observe]
    resources: [research-performance]
    effect: allow
- name: delegation_policy
  kind: security.policy
  policy:
    actions: [funcs.security]
    resources: [security]
    effect: allow
