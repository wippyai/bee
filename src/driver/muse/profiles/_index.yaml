version: '1.0'
namespace: bee.driver.muse.profiles
entries:
- name: profiles
  kind: registry.entry
  meta:
    type: harness.profile
    driver_ref: bee.driver.muse.binding:binding
  data:
    driver:
      schema_revision: bee.driver@1
      kind: harness
      title: Muse CLI
      implementation_version: 1.3.0
      default_profile: batch
      profiles:
      - id: batch
        mode: batch
        hooks:
          transports:
          - command
          events:
          - SessionStart
          - UserPromptSubmit
          - PreToolUse
          - PostToolUse
          - PermissionRequest
          - Stop
          - SessionEnd
          adapter_ref: bee.driver.muse.descriptor:cli
        inbound:
        - next_turn
        protocol: stream-json
        protocol_revision: msp-exec-1
        answer_path:
          strategy: accumulate
          adapter_ref: bee.driver.muse.descriptor:cli
        resume:
          strategy: per-process
          portable: false
        isolation_env:
          variables:
          - HOME
          private_home: true
        exit_codes_trustworthy: false
        input_ready:
          strategy: protocol
          adapter_ref: bee.driver.muse.descriptor:cli
          timeout_ms: 15000
        interrupt:
          methods:
          - signal_group
        mcp:
          client_transports:
          - streamable_http
          initialize_timeout_ms: 30000
        sandbox:
          providers:
          - muse-sandbox
          required_placement_features: []
      - id: window
        mode: window
        hooks:
          transports:
          - command
          events:
          - SessionStart
          - UserPromptSubmit
          - PreToolUse
          - PostToolUse
          - Stop
          adapter_ref: bee.driver.muse.descriptor:cli
        protocol: pty
        protocol_revision: native-window-1
        answer_path:
          strategy: none
        resume:
          strategy: none
          portable: false
        isolation_env:
          variables:
          - HOME
          private_home: true
        exit_codes_trustworthy: false
        input_ready:
          strategy: none
        permission_exchange:
          mode: none
- name: default_window
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned Muse window declaration; the host separately selects its policy, activation, executable and permissions
  data:
    schema_revision: bee.launch-definition@1
    launch_id: muse-window
    title: Muse CLI
    binding_ref: bee.driver.muse.binding:binding
    profile_id: window
    private_credentials:
    - muse_login
    - muse_api_key
    docker_credentials:
    - muse_login
    - muse_api_key
    policy_ref: bee.driver.muse.security:launch_policy_muse_window
    default_mode: window
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: new
    session_resource: session
    credentials:
    - muse_api_key
    presentation:
      start_menu: true
      fullscreen: true
      reuse: never
- name: research_batch
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned bounded Muse batch route for a host-selected coordinator and caller-owned shared thread
  data:
    schema_revision: bee.launch-definition@1
    launch_id: muse-research-batch
    title: Muse researcher
    binding_ref: bee.driver.muse.binding:binding
    profile_id: batch
    policy_ref: bee.driver.muse.security:launch_policy_muse_batch
    default_mode: batch
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: caller
    session_resource: session
    credentials:
    - muse_login
    - muse_api_key
    presentation:
      start_menu: false
      fullscreen: false
      reuse: never
