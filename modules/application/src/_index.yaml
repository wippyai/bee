version: '1.0'
namespace: bee.app
entries:
- name: definition
  kind: ns.definition
  module: application
  readme: file://README.md
  meta:
    title: Bee application SDK
    comment: Public application-side values and presentation helpers; helpers grant no application, workspace, or thread authority
- name: client
  kind: library.lua
  source: file://client.lua
  modules:
  - process
  - uuid
  imports:
    arguments: bee.app:arguments
    interaction: bee.app:interaction
    bounds: bee.values:bounds
- name: arguments
  kind: library.lua
  source: file://arguments.lua
- name: caller
  kind: library.lua
  source: file://caller.lua
  imports:
    reply: bee.values:reply
- name: folder_picker
  kind: library.lua
  source: file://folder_picker.lua
  imports:
    text: bee.ui:text
    caller: bee.app:caller
    frame: bee.ui:frame
    bounds: bee.values:bounds
- name: interaction
  kind: library.lua
  source: file://interaction.lua
  imports:
    bounds: bee.values:bounds
- name: names
  kind: library.lua
  source: file://names.lua
- name: viz
  kind: library.lua
  source: file://viz.lua
  modules:
  - tty
  imports:
    appearance: bee.ui:appearance
    frame: bee.ui:frame
- name: forms
  kind: library.lua
  source: file://forms.lua
  modules:
  - tty
  imports:
    appearance: bee.ui:appearance
    frame: bee.ui:frame
- name: diagram
  kind: library.lua
  source: file://diagram.lua
  modules:
  - tty
  imports:
    appearance: bee.ui:appearance
    frame: bee.ui:frame
    viz: bee.app:viz
- name: dependency_values
  kind: ns.dependency
  component: bee/values
  version: '*'
- name: dependency_ui
  kind: ns.dependency
  component: bee/ui
  version: '*'
