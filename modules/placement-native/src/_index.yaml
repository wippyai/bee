version: '1.0'
namespace: bee.placement.native
entries:
- name: definition
  kind: ns.definition
  module: placement-native
  readme: file://README.md
  meta:
    title: Bee native placement
    comment: Attempts as native children under a runner process, receipts in an owned
      SQLite store, homes under a placement root
- name: dependency_placement
  kind: ns.dependency
  component: bee/placement
  version: '*'
- name: dependency_persist
  kind: ns.dependency
  component: bee/persist
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_resources
  kind: ns.dependency
  component: bee/resources
  version: '*'
- name: dependency_credentials
  kind: ns.dependency
  component: bee/credentials
  version: '*'
- name: dependency_gateway
  kind: ns.dependency
  component: bee/gateway
  version: '*'
- name: protected_namespace
  kind: ns.requirement
  meta:
    comment: Add the native placement namespace to the host trust map
  default: bee.placement.native
  targets:
  - entry: bee.security.gov:protected_kernel
    path: .data.namespaces +=
- name: target_db
  kind: ns.requirement
  meta:
    comment: SQL resource for the receipts store
  default: bee.placement.native.env:db
  targets:
  - entry: bee.placement.native.env:database_ref
    path: .resource_ref
- name: target_root
  kind: ns.requirement
  meta:
    comment: Filesystem root that holds attempt homes and retained sessions; the module
      default resolves against the project and the host replaces it
  default: bee.placement.native.env:root
  targets:
  - entry: bee.placement.native.env:root_ref
    path: .resource_ref
- name: process_host
  kind: ns.requirement
  meta:
    comment: Process host that runs attempt runners and the supervision sweeper; an
      assembly may override the Bee default
  targets:
  - entry: bee.placement.native.env:runner_host_ref
    path: .host_ref
  - entry: bee.placement.native.service:sweeper_service
    path: .host
- name: sweeper_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected policy grants for the supervision sweeper
  targets:
  - entry: bee.placement.native.service:sweeper_service
    path: .lifecycle.security.policies
- name: target_executor
  kind: ns.requirement
  meta:
    comment: Host-selected native executor; a launch request never selects it
  default: bee.placement.native.env:placement_executor
  targets:
  - entry: bee.placement.native.env:executor_ref
    path: .resource_ref
- name: target_host_files
  kind: ns.requirement
  meta:
    comment: Host-selected read-only filesystem for executable measurement
  default: bee.placement.native.env:placement_host_files
  targets:
  - entry: bee.placement.native.env:host_files_ref
    path: .resource_ref
- name: target_admitted_roots
  kind: ns.requirement
  meta:
    comment: Host-selected admissible resource roots; a launch request cannot choose
      this policy
  default: bee.placement.native.env:placement_admitted_roots
  targets:
  - entry: bee.placement.native.env:admitted_roots_ref
    path: .resource_ref
- name: target_resource_mode
  kind: ns.requirement
  meta:
    comment: Host-selected placement resource mode; a launch request cannot choose
      it
  default: bee.placement.native.env:placement_resource_mode
  targets:
  - entry: bee.placement.native.env:resource_mode_ref
    path: .resource_ref
- name: target_workdir_preparers
  kind: ns.requirement
  meta:
    comment: Host-authorized workdir preparer contract bindings; registry metadata
      alone never authorizes
  default: bee.placement.native.env:placement_workdir_preparers
  targets:
  - entry: bee.placement.native.env:workdir_preparers_ref
    path: .resource_ref
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  imports:
    bounds: bee.values:bounds
- name: target_prepare_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.placement.native.binding:prepare
    path: .security.policies
  - entry: bee.placement.native.binding:start
    path: .security.policies
  - entry: bee.placement.native.binding:status
    path: .security.policies
  - entry: bee.placement.native.binding:stop
    path: .security.policies
  - entry: bee.placement.native.binding:capabilities
    path: .security.policies
  - entry: bee.placement.native.binding:measure_executable
    path: .security.policies
  - entry: bee.placement.native.binding:close_stdin
    path: .security.policies
  - entry: bee.placement.native.binding:reconcile
    path: .security.policies
  - entry: bee.placement.native.binding:cleanup
    path: .security.policies
  - entry: bee.placement.native.binding:evidence
    path: .security.policies
  - entry: bee.placement.native.binding:attach
    path: .security.policies
  - entry: bee.placement.native.service:startup
    path: .security.policies
- name: target_stop_revoked_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.placement.native.binding:stop_revoked
    path: .security.policies
- name: target_runner_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.placement.native.service:runner
    path: .security.policies
- name: dependency_values
  kind: ns.dependency
  component: bee/values
  version: '*'
