version: '1.0'
namespace: bee.gateway.env
entries:
- name: database_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: The linked SQL resource; target_db fills resource_ref}
- name: listener_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: The linked listener service; target_listener fills resource_ref}
- name: environment
  kind: env.storage.os
  lifecycle: {auto_start: true}
- name: db_path
  kind: env.variable
  storage: bee.gateway.env:environment
  variable: BEE_GATEWAY_DB
  default: .wippy/gateway.db
  readonly: true
- name: db
  kind: db.sql.sqlite
  file: ${env:bee.gateway.env:db_path}
  lifecycle: {auto_start: true}
- name: hook_executable
  kind: env.variable
  storage: bee.gateway.env:environment
  variable: self
  default: ''
  readonly: true
- name: endpoint_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host endpoint configuration; target_endpoint fills resource_ref}
- name: approval_request_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host approval request policy; an absent link fails closed}
- name: approval_consume_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host approval consume policy; an absent link fails closed}
- name: tool_read_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in bound-thread read tools}
- name: tool_message_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in bound-thread message tool}
- name: tool_overlay_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in governed-overlay tool}
- name: tool_docs_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in offline-documentation tool}
- name: tool_components_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in component-inspection tool}
- name: tool_delivery_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in delivery tool}
- name: tool_publish_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in publication tool}
- name: tool_application_open_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in admitted-application open tool}
- name: tool_install_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in installation request tools}
- name: tool_session_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the default session tools}
- name: install_configuration_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host module installation configuration; target_install_configuration fills resource_ref}
- name: tool_hub_publish_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in Hub publication tools}
- name: publish_configuration_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host Hub publication configuration; target_publish_configuration fills resource_ref}
- name: configuration
  kind: library.lua
  source: file://configuration.lua
  modules: [registry, funcs, env]
  imports: {address_value: bee.gateway.api:address_value}
