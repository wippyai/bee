version: '1.0'
namespace: bee.gateway.api
entries:
- name: ready_http
  kind: function.lua
  source: file://ready_http_method.lua
  method: handle
  modules: [http]
  imports: {gateway: bee.gateway.binding:gateway}
  security: {policies: [bee.gateway.security:address_call_policy, bee.gateway.security:store_policy, bee.gateway.security:database_ref_policy, bee.gateway.security:address_policy, bee.gateway.security:supervisor_policy]}
- name: hook_http
  kind: function.lua
  source: file://hook_http_method.lua
  method: submit
  modules: [http, json]
  imports:
    gateway: bee.gateway.binding:gateway
    hooks: bee.gateway:hooks
  security: {policies: [bee.gateway.security:address_call_policy, bee.gateway.security:store_policy, bee.gateway.security:database_ref_policy, bee.gateway.security:address_policy, bee.gateway.security:supervisor_policy]}
- name: hook_status_http
  kind: function.lua
  source: file://hook_http_method.lua
  method: status
  modules: [http, json]
  imports:
    gateway: bee.gateway.binding:gateway
    hooks: bee.gateway:hooks
  security: {policies: [bee.gateway.security:address_call_policy, bee.gateway.security:store_policy, bee.gateway.security:database_ref_policy, bee.gateway.security:address_policy, bee.gateway.security:supervisor_policy]}
- name: hook_mcp_http
  kind: function.lua
  source: file://hook_mcp_method.lua
  method: handle
  modules: [http, json]
  imports:
    gateway: bee.gateway.binding:gateway
    mcp: bee.gateway:mcp
    hooks: bee.gateway:hooks
  security: {policies: [bee.gateway.security:address_call_policy, bee.gateway.security:store_policy, bee.gateway.security:database_ref_policy, bee.gateway.security:address_policy, bee.gateway.security:supervisor_policy]}
- name: mcp_http
  kind: function.lua
  source: file://mcp_method.lua
  method: handle
  modules: [http, json, funcs, security, registry]
  imports:
    gateway: bee.gateway.binding:gateway
    mcp: bee.gateway:mcp
    catalog: bee.gateway:catalog
    context: bee.gateway:context
    bounds: bee.threads.records:bounds
    arguments: bee.application:arguments
  security:
    policies: [bee.gateway.security:address_call_policy, bee.gateway.security:store_policy, bee.gateway.security:database_ref_policy, bee.gateway.security:address_policy, bee.gateway.security:supervisor_policy, bee.gateway.security:execute_policy, bee.gateway.security:tool_policy_read_policy, bee.gateway.security:tool_policy_reference_policy, bee.gateway.security:access_call_policy, bee.gateway.security:access_reference_policy, bee.gateway.security:access_policy_read_policy]
