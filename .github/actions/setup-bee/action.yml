name: Pinned Bee platform
description: Restore one pinned toolchain and Go cache; saving is explicit in CI only.
inputs:
  target:
    description: Release platform whose Go compilation cache is restored
    required: true
  lua-cache:
    description: Restore the shared per-entry base for CI checks
    default: 'false'
outputs:
  cache-key:
    value: ${{ steps.key.outputs.cache-key }}
    description: Pinned platform cache fingerprint
  cache-hit:
    value: ${{ steps.cache.outputs.cache-hit }}
    description: Whether the exact platform cache is restored
  tools-path:
    value: ${{ steps.key.outputs.tools-path }}
    description: Pinned host toolchain cache directory
  tools-key:
    description: Pinned host toolchain fingerprint
    value: ${{ steps.key.outputs.tools-key }}
  tools-hit:
    description: Whether the exact host toolchain is restored
    value: ${{ steps.tools.outputs.cache-hit }}
  go-path:
    description: Go module and compilation cache directories
    value: ${{ steps.key.outputs.go-path }}
  lua-path:
    description: Lua cache directory for the pinned toolchain
    value: ${{ steps.key.outputs.lua-path }}
  runtime:
    description: Exact runtime commit
    value: ${{ steps.key.outputs.runtime }}
  application-key:
    description: Content fingerprint of prepared inputs
    value: ${{ steps.key.outputs.application-key }}
  lua-cache-key:
    description: Shared entry cache fingerprint
    value: bee-lua-v5-${{ steps.key.outputs.lua-key }}-${{ steps.key.outputs.application-key }}
  lua-hit:
    description: Whether the shared entry fingerprint is restored exactly
    value: ${{ steps.lua.outputs.cache-hit }}
runs:
  using: composite
  steps:
  - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
    with:
      python-version: '3.12'
  - id: key
    shell: bash
    env:
      TARGET: ${{ inputs.target }}
    run: make --no-print-directory ci-tools-outputs >> "$GITHUB_OUTPUT"
  - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
    with:
      go-version: ${{ steps.key.outputs.go }}
      cache: false
  - id: tools
    uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
    with:
      path: ${{ steps.key.outputs.tools-path }}
      key: bee-tools-v3-${{ steps.key.outputs.tools-key }}
      fail-on-cache-miss: ${{ github.workflow == 'Bee release' }}
  - id: cache
    uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
    with:
      path: ${{ steps.key.outputs.go-path }}
      key: ${{ steps.key.outputs.cache-key }}
      restore-keys: ${{ steps.key.outputs.cache-prefix }}
      fail-on-cache-miss: ${{ github.workflow == 'Bee release' }}
  - name: Python dependencies
    shell: bash
    run: pip install -r tests/requirements.txt
  - name: Pinned toolchain
    shell: bash
    run: make tools
  - id: lua
    if: inputs.lua-cache == 'true'
    uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
    with:
      path: |-
        .wippy/cache
        ${{ steps.key.outputs.lua-path }}
      key: bee-lua-v5-${{ steps.key.outputs.lua-key }}-${{ steps.key.outputs.application-key }}
      restore-keys: |-
        bee-lua-v5-${{ steps.key.outputs.lua-key }}-
        bee-lua-v4-${{ steps.key.outputs.lua-legacy-key }}-
        bee-lua-v3-Linux-ARM64-${{ steps.key.outputs.runtime }}-
  - if: inputs.lua-cache == 'true'
    shell: bash
    run: printf "LUA_CACHE=%s\n" "${{ steps.key.outputs.lua-path }}" >> "$GITHUB_ENV"
