version: '1.0'
namespace: bee.apps.help.app
entries:
- name: view
  kind: library.lua
  source: file://view.lua
  modules:
  - tty
  imports:
    appearance: bee.ui:appearance
    frame: bee.ui:frame
    manuals: bee.docs:manuals
    markdown: bee.ui:markdown
    text: bee.ui:text
- name: app
  kind: process.lua
  meta:
    type: bee.app
    application:
      api_version: 1
      title: Keyboard help
      lifetime: view
      revision: '1'
      instance_policy: singleton
      menus: [bee.shell:desktop_menu]
  source: file://app.lua
  method: main
  modules:
  - tty
  - process
  - channel
  imports:
    appearance: bee.ui:appearance
    frame: bee.ui:frame
    view: bee.apps.help.app:view
    manuals: bee.docs:manuals
    markdown: bee.ui:markdown
  security:
    policies: [bee.security.docs:docs_policy]
