version: '1.0'
namespace: bee.gov.overlays.security
entries:
- name: client_policy
  kind: security.policy
  meta:
    comment: Overlays calls only the destination-owned governance facade; local review
      is separate from Approvals decisions
  policy:
    actions:
    - funcs.call
    resources:
    - bee.gov.binding:destination_call
    effect: allow
