            - type: object
              additionalProperties: false
              required:
              - schema
              - value
              properties:
                schema:
                  type: string
                  minLength: 1
                  maxLength: 256
                value: {}
          output:
            type: string
            minLength: 1
            maxLength: 256
          operation_key:
            type: string
            minLength: 1
            maxLength: 128
      output:
        oneOf:
        - type: object
          additionalProperties: false
          required:
          - ok
          - value
          properties:
            ok:
              const: true
            value:
              type: object
        - type: object
          additionalProperties: false
          required:
          - ok
          - error
          properties:
            ok:
              const: false
            error:
              type: object
              additionalProperties: false
              required:
              - code
              - message
              - retry
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 128
                message:
                  type: string
                  maxLength: 16384
                retry:
                  enum:
                  - never
                  - same_key
                  - refresh
                  - reconcile
                operation_key:
                  type: string
                  minLength: 1
                  maxLength: 128
                operation:
                  allOf:
                  - type: string
                    minLength: 1
                    maxLength: 256
                  - pattern: ^bo:[^:]+:[^:]+:[^:]+$
                current_revision:
                  type: integer
                  minimum: 1
                evidence:
                  type: object
                  additionalProperties: false
                  required:
                  - summary
                  - artifacts
                  properties:
                    summary:
                      type: string
                      maxLength: 16384
                    artifacts:
                      type: array
                      maxItems: 64
                      items:
                        type: string
                        minLength: 1
                        maxLength: 256
                retry_after_ms:
                  type: integer
                  minimum: 0
    hive_alias: session_run
