version: '1.0'
namespace: bee.driver.agy
entries:
- name: definition
  kind: ns.definition
  module: driver-agy
  readme: file://README.md
  meta:
    title: Bee Antigravity CLI driver
    comment: Declarative Agy launch, stream-json normalization, and host-selected configuration delivery
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: host_environment
  kind: ns.requirement
  meta:
    comment: Read-only host environment that supplies the selected Agy executable
  default: bee.harness.host:environment
  targets:
  - entry: bee.driver.agy:executable
    path: .storage
- name: window_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Agy window route
  default: bee.driver.agy:launch_policy_agy_window
  targets:
  - entry: bee.driver.agy:default_window
    path: .data.policy_ref
- name: batch_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Agy batch route
  default: bee.driver.agy:launch_policy_agy_batch
  targets:
  - entry: bee.driver.agy:research_batch
    path: .data.policy_ref
- name: executable
  kind: env.variable
  storage: bee.harness.host:environment
  variable: agy
  default: ''
  readonly: true
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  imports:
    universal: bee.driver:universal
- name: launch
  kind: library.lua
  source: file://launch.lua
  imports:
    universal: bee.driver:universal

- name: configuration
  kind: library.lua
  source: file://configuration.lua
  modules: [hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    configure_protocol: bee.driver:configuration
    quote: bee.driver.kit:quote
- name: locate
  kind: library.lua
  source: file://locate.lua
  imports:
    universal: bee.driver:universal
- name: binding
  kind: contract.binding
  contracts:
  - contract: bee.driver:driver
    methods:
      prepare: bee.driver.agy.binding:prepare
      dispatch: bee.driver.agy.binding:dispatch
      normalize: bee.driver.agy.binding:normalize
      configure: bee.driver.agy.binding:configure
  - contract: bee.driver:locate_facet
    methods:
      locate: bee.driver.agy.binding:locate
  meta:
    type: harness.driver
    driver_id: agy
    descriptor_ref: bee.driver.agy.descriptor:cli
    accepts_model: true
    profiles_ref: bee.driver.agy:profiles
- name: profiles
  kind: registry.entry
  meta:
    type: harness.profile
    driver_ref: bee.driver.agy:binding
  data:
    driver:
      schema_revision: bee.driver@1
      kind: harness
      title: Antigravity CLI
      implementation_version: 1.2.2
      default_profile: session
      profiles:
      - id: session
        mode: session
        protocol: stream-json
        protocol_revision: agy-stream-json-1
        answer_path: &id001
          strategy: terminal_field
          adapter_ref: bee.driver.agy:protocol
        resume: &id002
          strategy: per-process
          portable: false
        isolation_env: &id003
          variables:
          - HOME
          private_home: true
        exit_codes_trustworthy: false
        input_ready: &id004
          strategy: protocol
          adapter_ref: bee.driver.agy:protocol
          timeout_ms: 15000
        interrupt: &id005
          methods:
          - signal_group
        mcp:
          client_transports:
          - stdio
          - streamable_http
          initialize_timeout_ms: 30000
          call_timeout_ceiling_ms: 120000
        inbound:
        - next_turn
        sandbox:
          providers: []
          required_placement_features: []
          git_writable_roots_adapter: agy_add_dir
        permission_exchange:
          mode: none
      - id: batch
        mode: batch
        protocol: stream-json
        protocol_revision: agy-stream-json-1
        answer_path: *id001
        resume: *id002
        isolation_env:
          variables: [HOME]
          private_home: true
        exit_codes_trustworthy: false
        input_ready: *id004
        interrupt: *id005
        mcp:
          client_transports: [streamable_http]
          initialize_timeout_ms: 30000
          call_timeout_ceiling_ms: 120000
        sandbox:
          providers: []
          required_placement_features: []
          git_writable_roots_adapter: agy_add_dir
        permission_exchange:
          mode: none
      - id: window
        mode: window
        protocol: pty
        protocol_revision: native-window-1
        hooks: {transports: [command], events: [PreToolUse, PostToolUse, Stop]}
        answer_path: {strategy: none}
        resume: {strategy: none, portable: false}
        isolation_env:
          variables: [HOME]
          private_home: false
        exit_codes_trustworthy: false
        input_ready: {strategy: none}
        permission_exchange: {mode: none}
- name: default_window
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned Antigravity window declaration; the host separately selects its policy, activation, executable and permissions
  data:
    schema_revision: bee.launch-definition@1
    launch_id: agy-window
    title: Antigravity CLI
    command_names: [agy]
    binding_ref: bee.driver.agy:binding
    profile_id: window
    session_profile_id: session
    session_credentials: [agy_login]
    policy_ref: ''
    default_mode: window
    allowed_overrides: [thread, workdir]
    workdir_policy: {kind: declared_resource, resource_ref: project}
    thread_policy: {kind: new}
    session_resource: session
    credentials: []
    presentation: {start_menu: true, fullscreen: true, reuse: never}

- name: research_batch
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned Agy batch route for a host-selected coordinator and caller-owned shared thread
  data:
    schema_revision: bee.launch-definition@1
    launch_id: agy-research-batch
    title: Gemini researcher
    command_names: []
    binding_ref: bee.driver.agy:binding
    profile_id: batch
    policy_ref: ''
    default_mode: batch
    allowed_overrides: [thread, workdir]
    workdir_policy: {kind: declared_resource, resource_ref: project}
    thread_policy: {kind: caller}
    session_resource: session
    credentials: [agy_login]
    presentation: {start_menu: false, fullscreen: false, reuse: never}

- name: credential_format
  kind: registry.entry
  meta:
    type: bee.credential_format
  data:
    schema_revision: bee.credential-format@1
    file:
      path: .gemini/antigravity-cli/antigravity-oauth-token
      content_format: opaque
      initialize: []
- name: command
  kind: registry.entry
  meta:
    type: bee.application_command
    comment: CLI command to launch Antigravity CLI in the agent window
  data:
    name: agy
    definition_id: bee.harness.app:app
    arguments:
    - bee.driver.agy:default_window
    fullscreen: true

- name: launch_policy_agy_batch
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected bounded Gemini batch policy with a retained user login and caller-owned thread MCP
  data:
    schema_revision: bee.launch-policy@2
    allowed_overrides: [thread, workdir]
    required_cleanup: process_group
    required_exit_observation: independent
    start_ms: 15000
    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables: {}
    executable_env: {agy: bee.driver.agy:executable}
    environment: {}
    allow_host_home: false
    gateway_tools: [session_catalog, session_open, session_run, session_send, session_await, session_join, session_get, session_list, session_cancel, session_close, thread_read, thread_message]
    prepare_options: {model: gemini-3.8-flash, effort: high, sandbox: true}
- name: launch_policy_agy_window
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected executable binding for the component-owned Antigravity window; missing host executable
      leaves the declaration unavailable
  data:
    schema_revision: bee.launch-policy@2
    allowed_overrides: [thread, workdir]
    required_cleanup: process_group
    required_exit_observation: independent
    start_ms: 15000
    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables: {}
    executable_env:
      agy: bee.driver.agy:executable
    environment: {}
    allow_host_home: true
    gateway_tools: [session_catalog, session_open, session_run, session_send, session_await, session_join, session_get, session_list, session_cancel, session_close, thread_read, thread_message]
    gateway_hooks:
    - PreToolUse
    - PostToolUse
    - Stop
    hook_command_ref: bee.gateway:hook_executable
    profile_options:
      effort:
      - low
      - medium
      - high
    profile_instructions: true
    prepare_options: {}
