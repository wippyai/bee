version: '1.0'
namespace: bee.gateway.service
entries:
- name: worker
  kind: process.lua
  source: file://worker.lua
  method: main
  modules:
  - logger
  imports:
    worker: bee.process:worker
    installation: bee.gateway.security:installation
    approval_service: bee.approvals.binding:service
- name: publication_worker
  kind: process.lua
  source: file://publication_worker.lua
  method: main
  modules:
  - logger
  imports:
    worker: bee.process:worker
    publish: bee.gateway.security:publish
    approval_service: bee.approvals.binding:service
- name: gateway_installation_service
  meta:
    title: Gateway · Hub installs
  kind: process.service
  process: bee.gateway.service:worker
  host: bee:workers
  lifecycle:
    auto_start: true
    requires: [wippy.bootloader:bootloader.service]
    security:
      actor:
        id: bee.gateway.worker
      policies:
      - bee.gateway.security:store_policy
      - bee.gateway.security:execute_policy
      - bee.gateway.security:installation_policy
      - bee.gateway.security:installation_queue_policy
      - bee.gateway.security:installation_resolver_policy
      - bee.gateway.security:installation_worker_policy
      - bee.gateway.security:installation_read_policy
      - bee.gateway.security:installation_apply_policy
      - bee.gateway.security:installation_library_policy
      - bee.gateway.security:access_reference_policy
      - bee.gateway.security:access_policy_read_policy
      - bee.security.approvals:approval_installation_effects_policy
      - bee.security.approvals:approval_request_policy
      - bee.security.approvals:approval_consume_policy
      - bee.gateway.security:worker_host_policy
- name: gateway_publication_service
  meta:
    title: Gateway · Hub publishing
  kind: process.service
  process: bee.gateway.service:publication_worker
  host: bee:workers
  lifecycle:
    auto_start: true
    requires: [wippy.bootloader:bootloader.service]
    security:
      actor:
        id: bee.gateway.worker
      policies:
      - bee.gateway.security:store_policy
      - bee.gateway.security:execute_policy
      - bee.gateway.security:publication_policy
      - bee.gateway.security:publication_queue_policy
      - bee.gateway.security:installation_resolver_policy
      - bee.gateway.security:installation_worker_policy
      - bee.gateway.security:publication_read_policy
      - bee.gateway.security:publication_apply_policy
      - bee.gateway.security:access_reference_policy
      - bee.gateway.security:access_policy_read_policy
      - bee.security.approvals:approval_publication_effects_policy
      - bee.security.approvals:approval_request_policy
      - bee.security.approvals:approval_consume_policy
      - bee.gateway.security:worker_host_policy
- name: external_cli
  kind: process.lua
  source: file://external_cli.lua
  method: main
  modules: [io]
  imports:
    protocol: bee.hive:protocol
    node_client: bee.node:client
    bounds: bee.values:bounds
    configuration: bee.gateway.api:external_configuration
  meta:
    command:
      name: mcp
      host: bee:terminal
      short: Pair an external MCP client through Needs you
      security:
        actor: {id: bee.gateway.cli}
        policies: [bee.hive.security:caller, bee.hive.security:messaging]
- name: external
  kind: process.lua
  source: file://external.lua
  method: main
  modules: [process, channel, time, cdc, env, system]
  imports:
    protocol: bee.hive:protocol
    bounds: bee.values:bounds
    external: bee.gateway.binding:external
    node_client: bee.node:client
- name: external_service
  kind: process.service
  process: bee.gateway.service:external
  host: bee:workers
  lifecycle:
    auto_start: true
    requires: [wippy.bootloader:bootloader.service]
    security:
      actor: {id: bee.gateway.external}
      policies:
      - bee.gateway.security:external_host_policy
      - bee.gateway.security:execute_policy
      - bee.gateway.security:store_policy
      - bee.gateway.security:address_call_policy
      - bee.gateway.security:address_policy
      - bee.gateway.security:supervisor_policy
      - bee.gateway.security:access_call_policy
      - bee.gateway.security:access_reference_policy
      - bee.gateway.security:access_policy_read_policy
      - bee.hive.security:messaging
