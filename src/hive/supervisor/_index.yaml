# Minimal entry definition intended for src/hive/supervisor/_index.yaml
version: '1.0'
namespace: bee.hive.supervisor
entries:
- name: peers
  kind: library.lua
  source: file://peers.lua
  imports:
    types: bee.hive:types
    bounds: bee.hive:bounds
- name: admission
  kind: library.lua
  source: file://admission.lua
  modules: [time]
  imports:
    types: bee.hive:types
    peers: bee.hive.supervisor:peers
    catalog: bee.hive:catalog
- name: main
  kind: process.lua
  source: file://main.lua
  method: main
  modules: [process, channel, time, uuid, funcs, logger]
  security: {policies: [bee:hive_feed_exposure_policy]}
  imports:
    types: bee.hive:types
    bounds: bee.hive:bounds
    peers: bee.hive.supervisor:peers
    admission: bee.hive.supervisor:admission
    thread_admission: bee.hive.supervisor:thread_admission
    feed_admission: bee.hive.supervisor:feed_admission
    desktop_owner: bee.hive.desktop:owner
    desktop_reader: bee.hive.desktop:reader
    desktop_protocol: bee.hive.desktop:protocol
    catalog: bee.hive:catalog
- name: principals
  kind: library.lua
  source: file://principals.lua
  modules: [hash]
  imports:
    types: bee.hive:types
    bounds: bee.hive:bounds
- name: feed_admission
  kind: library.lua
  source: file://feed_admission.lua
  modules: [funcs, security, registry, system, time, logger]
  imports:
    dispatch: bee.hive.supervisor:dispatch
    types: bee.hive:types
    bounds: bee.hive:bounds
    catalog: bee.hive:catalog
    principals: bee.hive.supervisor:principals
    canonical: bee.threads.records:canonical
- name: admit_feed
  kind: function.lua
  source: file://feed_admission.lua
  method: handle
  modules: [funcs, security, registry, system, time, logger]
  security:
    policies: [bee.hive.supervisor:feed_identity_policy, bee.hive.supervisor:feed_actor_policy, bee:feed_admission_policy, bee:hive_feed_exposure_policy]
  imports:
    dispatch: bee.hive.supervisor:dispatch
    types: bee.hive:types
    bounds: bee.hive:bounds
    catalog: bee.hive:catalog
    principals: bee.hive.supervisor:principals
    canonical: bee.threads.records:canonical
- name: feed_identity_policy
  kind: security.policy
  policy:
    actions: [funcs.security, security.scope.create, security.policy.get]
    resources: '*'
    effect: allow
- name: feed_actor_policy
  kind: security.policy
  policy:
    actions: [security.actor.create]
    resources: ['bee.hive.member.*']
    effect: allow
- name: principal_mappings
  kind: registry.entry
  meta:
    type: bee.hive.principal_mappings
    comment: Host-owned table of the trusted issuer and subject pairs admitted to thread operations and the policies each acts under; the actor is derived from the pair; an empty table admits no forwarded thread operation
  data:
    mappings: []
- name: thread_admission
  kind: library.lua
  source: file://thread_admission.lua
  modules: [funcs, security, time]
  imports:
    types: bee.hive:types
    bounds: bee.hive:bounds
    canonical: bee.threads.records:canonical
    catalog: bee.hive:catalog
    principals: bee.hive.supervisor:principals
- name: invoke_check
  kind: function.lua
  source: file://invoke_check.lua
  method: handle
  modules: [security]
  imports:
    catalog: bee.hive:catalog
    bounds: bee.hive:bounds
- name: thread_admission_policy
  kind: security.policy
  meta:
    comment: The admitting worker reads the host mapping and calls the two thread operations; the mapped actor's own scope is the mapping's policies
  policy:
    actions: [funcs.call, registry.get]
    resources: [bee.threads.service:send, bee.threads.service:send_status, bee.hive.supervisor:principal_mappings]
    effect: allow
- name: thread_identity_policy
  kind: security.policy
  meta:
    comment: The admitting worker acts as the mapped actor under the mapping's policies
  policy:
    actions: [process.security, security.scope.create, security.policy.get]
    resources: '*'
    effect: allow
- name: admit_thread
  kind: function.lua
  source: file://admit_thread.lua
  method: handle
  modules: [registry, time]
  security:
    policies: [bee.hive.supervisor:thread_admission_policy, bee.hive.supervisor:thread_identity_policy, bee:hive_thread_exposure_policy]
  imports:
    types: bee.hive:types
    thread_admission: bee.hive.supervisor:thread_admission
    principals: bee.hive.supervisor:principals
- name: dispatch
  kind: library.lua
  source: file://dispatch.lua
  modules: [json, funcs]
  imports:
    canonical: bee.threads.records:canonical
    types: bee.hive:types
    catalog: bee.hive:catalog
    bounds: bee.hive:bounds

- name: execute
  kind: function.lua
  source: file://dispatch.lua
  method: dispatch
  modules: [json, funcs]
  imports:
    canonical: bee.threads.records:canonical
    types: bee.hive:types
    catalog: bee.hive:catalog
    bounds: bee.hive:bounds
