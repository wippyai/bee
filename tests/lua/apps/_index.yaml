version: '1.0'
namespace: bee.tests.apps
entries:
- name: help_test
  kind: function.lua
  source: file://help_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    view: bee.apps.help.app:view
    menu: bee.shell:menu
    appearance: bee.ui:appearance
- name: settings_test
  kind: function.lua
  source: file://settings_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    choice: bee.apps.settings.app:choice
    appearance: bee.ui:appearance
- name: terminal_test
  kind: function.lua
  source: file://terminal_test.lua
  method: run
  modules: [process, channel, system, time, tty]
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    client: bee.node:client
    command: bee.apps.terminal.app:command
- name: settings_about_test
  kind: function.lua
  source: file://settings_about_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [tty]
  imports:
    test: wippy.test:test
    view: bee.apps.settings.app:view
    appearance: bee.ui:appearance
    live_updates: bee.apps.settings.app:live_updates
- name: settings_app_test
  kind: function.lua
  source: file://settings_app_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [process, channel, time, tty]
  imports:
    test: wippy.test:test
- name: settings_edit_test
  kind: function.lua
  source: file://settings_edit_test.lua
  method: run
  modules: [tty]
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    appearance: bee.ui:appearance
    interaction: bee.app:interaction
    view: bee.apps.settings.app:view
    model: bee.apps.settings.app:edit_mode
    forms: bee.ui.forms:forms
    super_edit: bee.gov.security:super_edit
- name: native_theme_test
  kind: function.lua
  source: file://native_theme_test.lua
  method: run
  modules: [process, system, channel, time, tty, sql]
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    client: bee.node:client
    appearance: bee.ui:appearance
    settings: bee.node:settings
- name: manuals_test
  kind: function.lua
  source: file://manuals_test.lua
  method: run
  meta:
    type: test
    suite: bee
  modules:
  - tty
  - fs
  - hash
  security:
    policies:
    - bee.security.docs:docs_policy
  imports:
    test: wippy.test:test
    manuals: bee.apps.help.app:manuals
    markdown: bee.apps.help.app:markdown
    corpus: bee.docs.binding:corpus
    resources: bee.docs.env:resources
    view: bee.apps.help.app:view
    appearance: bee.ui:appearance
- name: help_app_test
  kind: function.lua
  source: file://help_app_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [tty, process, system, time, channel, fs]
  security: {policies: [bee.security.docs:docs_policy, bee.tests.apps:capture_policy]}
  imports:
    test: wippy.test:test
    client: bee.node:client
    manuals: bee.apps.help.app:manuals
- name: captures
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/docsui-screens
  auto_init: true
- name: capture_policy
  kind: security.policy
  policy:
    actions: [fs.get]
    resources: [bee.tests.apps:captures]
    effect: allow
