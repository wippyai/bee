version: '1.0'
namespace: bee.hive.supervisor
entries:
- name: peers
  kind: library.lua
  source: file://peers.lua
  imports:
    types: bee.hive:types
    bounds: bee.hive:bounds
- name: registration
  kind: library.lua
  source: file://registration.lua
- name: enrollment
  kind: library.lua
  source: file://enrollment.lua
  imports:
    bounds: bee.hive:bounds
- name: invites
  kind: library.lua
  source: file://invites.lua
  imports:
    bounds: bee.hive:bounds
- name: admission
  kind: library.lua
  source: file://admission.lua
  modules: [time]
  imports:
    types: bee.hive:types
    peers: bee.hive.supervisor:peers
    catalog: bee.hive:catalog
- name: main
  kind: process.lua
  source: file://main.lua
  method: main
  modules: [process, channel, time, uuid, funcs, logger, registry, security, crypto, hash]
  security: {policies: [bee.security.hive:hive_policy_exposure_policy]}
  imports:
    types: bee.hive:types
    bounds: bee.hive:bounds
    peers: bee.hive.supervisor:peers
    enrollment: bee.hive.supervisor:enrollment
    invites: bee.hive.supervisor:invites
    owner_stop: bee.hive.supervisor:owner_stop
    registration: bee.hive.supervisor:registration
    admission: bee.hive.supervisor:admission
    thread_admission: bee.hive.supervisor:thread_admission
    policy_admission: bee.hive.supervisor:policy_admission
    replica_admission: bee.hive.supervisor:replica_admission
    desktop_owner: bee.hive.desktop:owner
    desktop_protocol: bee.hive.desktop:protocol
    catalog: bee.hive:catalog
    workspace_commands: bee.hive.supervisor:workspace_commands
- name: owner_stop
  kind: library.lua
  source: file://owner_stop.lua
  imports:
    bounds: bee.hive:bounds
    types: bee.hive:types
- name: workspace_commands
  kind: library.lua
  source: file://workspace_commands.lua
  imports:
    bounds: bee.hive:bounds
    types: bee.hive:types
- name: workspace_command
  kind: function.lua
  source: file://workspace_command.lua
  method: handle
  modules: [funcs, security]
  meta:
    comment: Runs one bee workspace command of an enrolled local client under the catalog grants the host attaches here
  security: {policies: [bee.security.storage:workspace_catalog_read_policy, bee.security.storage:workspace_catalog_manage_policy, bee.security.hive:workspace_command_catalog_policy]}
  imports:
    bounds: bee.hive:bounds
    types: bee.hive:types
    commands: bee.hive.supervisor:workspace_commands
- name: advertise
  kind: function.lua
  source: file://advertise_method.lua
  method: handle
  modules: [process]
  security: {policies: [bee.security.hive:hive_names_policy, bee.security.hive:hive_advertise_policy]}
  imports:
    types: bee.hive:types
- name: enrollment_nodes
  kind: registry.entry
  meta:
    type: bee.hive.supervisor_enrollment
    comment: Host-owned table of the local client nodes and Hive peers the supervisor admits after boot; the host writes it, and empty lists admit no post-boot node
  data:
    nodes: []
    peers: []
- name: principals
  kind: library.lua
  source: file://principals.lua
  modules: [hash]
  imports:
    types: bee.hive:types
    bounds: bee.hive:bounds
- name: audiences
  kind: library.lua
  source: file://exposure_audiences.lua
  imports:
    bounds: bee.hive:bounds
- name: exposure_audiences
  kind: registry.entry
  meta:
    type: bee.hive.exposure_audiences
    comment: Host-owned table of the peers each listed open operation admits; an unlisted operation stays as exposed
      as its ceiling, and the owner's own callers bypass audiences
  data:
    audiences: []
- name: policy_admission
  kind: library.lua
  source: file://policy_admission.lua
  modules: [funcs, security, registry, system, time, logger]
  imports:
    dispatch: bee.hive.supervisor:dispatch
    types: bee.hive:types
    bounds: bee.hive:bounds
    catalog: bee.hive:catalog
    principals: bee.hive.supervisor:principals
    canonical: bee.threads.records:canonical
- name: admit_policy
  kind: function.lua
  source: file://policy_admission.lua
  method: handle
  modules: [funcs, security, registry, system, time, logger]
  security:
    policies: [bee.hive.supervisor:policy_identity_policy, bee.hive.supervisor:policy_actor_policy, bee.security.hive:policy_admission_policy, bee.security.hive:hive_policy_exposure_policy, bee.security.hive:hive_exposure_facade_policy]
  imports:
    dispatch: bee.hive.supervisor:dispatch
    types: bee.hive:types
    bounds: bee.hive:bounds
    catalog: bee.hive:catalog
    principals: bee.hive.supervisor:principals
    canonical: bee.threads.records:canonical
- name: policy_identity_policy
  kind: security.policy
  policy:
    actions: [funcs.security, security.scope.create, security.policy.get]
    resources: '*'
    effect: allow
- name: policy_actor_policy
  kind: security.policy
  policy:
    actions: [security.actor.create]
    resources: ['bee.hive.member.*']
    effect: allow
- name: replica_admission
  kind: library.lua
  source: file://replica_admission.lua
  modules: [funcs, security, system]
  imports:
    types: bee.hive:types
    bounds: bee.hive:bounds
    catalog: bee.hive:catalog
    version: bee.sync:version
    dispatch: bee.hive.supervisor:dispatch
    canonical: bee.threads.records:canonical
- name: admit_replica
  kind: function.lua
  source: file://admit_replica.lua
  method: handle
  imports: {admission: bee.hive.supervisor:replica_admission}
  security: {policies: [bee.security.hive:hive_replica_admission_policy]}
- name: principal_mappings
  kind: registry.entry
  meta:
    type: bee.hive.principal_mappings
    comment: Host-owned table of the trusted issuer and subject pairs admitted to thread operations and the policies each acts under; the actor is derived from the pair; an empty table admits no forwarded thread operation
  data:
    mappings: []
- name: thread_admission
  kind: library.lua
  source: file://thread_admission.lua
  modules: [funcs, security, time]
  imports:
    types: bee.hive:types
    bounds: bee.hive:bounds
    canonical: bee.threads.records:canonical
    catalog: bee.hive:catalog
    principals: bee.hive.supervisor:principals
- name: invoke_check
  kind: function.lua
  source: file://invoke_check.lua
  method: handle
  modules: [security]
  imports:
    catalog: bee.hive:catalog
    bounds: bee.hive:bounds
- name: thread_admission_policy
  kind: security.policy
  meta:
    comment: The admitting worker reads the host mapping and calls the two thread operations; the mapped actor's own scope is the mapping's policies
  policy:
    actions: [funcs.call, registry.get]
    resources: [bee.threads.service:send, bee.threads.service:send_status, bee.threads.service:inbox_resolve,
      bee.threads.service:inbox_reply,
      bee.threads.service:notify, bee.threads.delivery:watch, bee.hive.supervisor:principal_mappings]
    effect: allow
- name: thread_identity_policy
  kind: security.policy
  meta:
    comment: The admitting worker acts as the mapped actor under the mapping's policies
  policy:
    actions: [process.security, security.scope.create, security.policy.get]
    resources: '*'
    effect: allow
- name: admit_thread
  kind: function.lua
  source: file://admit_thread.lua
  method: handle
  modules: [registry, time]
  security:
    policies: [bee.hive.supervisor:thread_admission_policy, bee.hive.supervisor:thread_identity_policy, bee.security.hive:hive_thread_exposure_policy]
  imports:
    types: bee.hive:types
    thread_admission: bee.hive.supervisor:thread_admission
    principals: bee.hive.supervisor:principals
- name: dispatch
  kind: library.lua
  source: file://dispatch.lua
  modules: [json, funcs, security, registry]
  imports:
    canonical: bee.threads.records:canonical
    types: bee.hive:types
    catalog: bee.hive:catalog
    bounds: bee.hive:bounds
    audiences: bee.hive.supervisor:audiences

- name: execute
  kind: function.lua
  source: file://dispatch.lua
  method: dispatch
  modules: [json, funcs, security, registry]
  imports:
    canonical: bee.threads.records:canonical
    types: bee.hive:types
    catalog: bee.hive:catalog
    bounds: bee.hive:bounds
    audiences: bee.hive.supervisor:audiences
