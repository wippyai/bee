name: Bee Hub publication
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published application release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bee-hub-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    environment: hub
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag }}
        fetch-depth: 0
        persist-credentials: false
    - name: Validate published release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        number='(0|[1-9][0-9]*)'
        identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
        pattern="^v$number\.$number\.$number(-$identifier(\.$identifier)*)?$"
        [[ "$RELEASE_TAG" =~ $pattern ]]
        git merge-base --is-ancestor HEAD origin/main
        test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
        release_commit=$(git rev-parse HEAD)
        test "$(gh run list --workflow native.yml --branch "$RELEASE_TAG" --event push --commit "$release_commit" --status success --limit 1 --json databaseId --jq length)" = 1
    - name: Require Hub credentials
      env:
        WIPPY_TOKEN: ${{ secrets.WIPPY_HUB_TOKEN }}
      run: |
        if [ -z "$WIPPY_TOKEN" ]; then
          echo 'Configure WIPPY_HUB_TOKEN with publish access to bee/bee.' >&2
          exit 1
        fi
    - name: Build pinned publication runtime
      uses: wippyai/builder@67a04357e73b43c35d354c5bb17b3261a9802ea3
      with:
        mode: toolchain
        manifest: wippy.build.json
        output: .wippy/bin/bee-wippy
    - name: Validate and publish immutable Hub version
      env:
        WIPPY_TOKEN: ${{ secrets.WIPPY_HUB_TOKEN }}
        HUB_VISIBILITY: ${{ vars.BEE_HUB_VISIBILITY || 'private' }}
      run: make hub-publish BEE_VERSION="${RELEASE_TAG#v}"
