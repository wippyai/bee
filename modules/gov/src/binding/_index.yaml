version: '1.0'
namespace: bee.governance.binding
entries:
- name: delivery_call
  kind: function.lua
  source: file://delivery_method.lua
  method: handle
  modules: [funcs, security, json]
  imports:
    bounds: bee.threads.records:bounds
    transaction: bee.persist:transaction
    preflight: bee.governance:preflight
    guide: bee.governance.traits:guide
    protocol: bee.governance:delivery_protocol
    resources: bee.governance.registry:staging_resources
  security: {policies: [bee.governance.security:delivery_facade_policy, bee.governance.security:publication_profiles_read_policy]}
- name: publication_call
  kind: function.lua
  source: file://publication_method.lua
  method: handle
  imports: {service: bee.governance.binding:publication_service}
  security: {policies: [bee.governance.security:publication_service_policy]}
- name: destination_call
  kind: function.lua
  source: file://destination_method.lua
  method: handle
  modules: [funcs, security]
  imports:
    service: bee.governance.binding:destination_service
    transaction: bee.persist:transaction
    bounds: bee.threads.records:bounds
  security: {policies: [bee.governance.security:destination_facade_policy]}
- name: overlay_call
  kind: function.lua
  source: file://workspace_method.lua
  method: handle
  modules: [funcs, security]
  imports:
    protocol: bee.governance:workspace_protocol
    guide: bee.governance.traits:guide
    transaction: bee.persist:transaction
    bounds: bee.threads.records:bounds
  security: {policies: [bee.governance.security:overlay_facade_policy]}
  meta:
    type: tool
    title: Overlay authoring
    llm_alias: BeeOverlay
    llm_description: Read this destination's component authoring guide, or create, list, read, put, remove or freeze files in your host-admitted private overlay. Writes require the current revision and a stable retry key. Freeze stages measured content only; it neither requests approval nor activates it. Use BeeComponents to inspect installed and Hub components for examples. Binary files use canonical base64. There is no host filesystem or registry access.
    input_schema: |
      {"type":"object","additionalProperties":false,"required":["operation"],"properties":{"operation":{"type":"string","enum":["guide","create","list","read","put","remove","freeze"]},"overlay_id":{"type":"string","minLength":1,"maxLength":160},"expected_revision":{"type":"integer","minimum":0,"maximum":9007199254740990},"idempotency_key":{"type":"string","minLength":1,"maxLength":160},"path":{"type":"string","minLength":1,"maxLength":240},"content":{"type":"string","maxLength":4194304},"content_base64":{"type":"string","maxLength":5592408},"snapshot_digest":{"type":"string","pattern":"^[0-9a-f]{64}$"}}}
- name: approval
  kind: library.lua
  source: file://approval.lua
  imports: {canonical: bee.sync:canonical, bounds: bee.threads.records:bounds}
- name: destination
  kind: library.lua
  source: file://destination.lua
  modules: [hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.sync:canonical
    approval: bee.governance.binding:approval
    plan_store: bee.governance.persist:plan_store
    replicas: bee.sync.persist:replicas
    delivery: bee.governance:delivery
    preflight: bee.governance:preflight
    transaction: bee.persist:transaction
- name: publisher
  kind: library.lua
  source: file://publisher.lua
  modules: [base64]
  imports:
    bounds: bee.threads.records:bounds
    delivery: bee.governance:delivery
    replicas: bee.sync.persist:replicas
    sync: bee.sync.persist:store
    transaction: bee.persist:transaction
- name: publication_service
  kind: library.lua
  source: file://publication_service.lua
  modules: [registry, security, system, base64, json]
  imports:
    bounds: bee.threads.records:bounds
    artifact: bee.governance:artifact
    materializer: bee.governance.registry:materializer
    application_admission: bee.governance:governed_application_admission
    publisher: bee.governance.binding:publisher
    staging: bee.governance.persist:staging
    activation_store: bee.governance.persist:activation_store
    resources: bee.governance.registry:staging_resources
    sync_resources: bee.sync.registry:resources
    transaction: bee.persist:transaction
- name: activation_owner
  kind: library.lua
  source: file://activation_owner.lua
  modules: [json]
  imports:
    bounds: bee.threads.records:bounds
    transaction: bee.persist:transaction
    plan_store: bee.governance.persist:plan_store
    activation_store: bee.governance.persist:activation_store
    activation_measure: bee.governance:activation_measure
    migration_work: bee.governance:migration_work
    approval: bee.governance.binding:approval
    preflight: bee.governance:preflight
    artifact: bee.governance:artifact
    application_admission: bee.governance:governed_application_admission
- name: migration_effect
  kind: library.lua
  source: file://migration_effect.lua
  modules: [hash]
  imports:
    canonical: bee.sync:canonical
    hub_migrations: bee.hub:migrations
    migration_runner: bee.hub.binding:migration_runner
    migration_work: bee.governance:migration_work
    materializer: bee.governance.registry:materializer
- name: destination_service
  kind: library.lua
  source: file://destination_service.lua
  modules: [registry, security, system, funcs, hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.sync:canonical
    transaction: bee.persist:transaction
    resources: bee.governance.registry:staging_resources
    sync_resources: bee.sync.registry:resources
    replicas: bee.sync.persist:replicas
    plan_store: bee.governance.persist:plan_store
    activation_store: bee.governance.persist:activation_store
    activation_owner: bee.governance.binding:activation_owner
    hub_resolver: bee.governance.registry:hub_resolver
    overlay_resolver: bee.governance.registry:overlay_resolver
    delivery: bee.governance:delivery
    destination: bee.governance.binding:destination
    materializer: bee.governance.registry:materializer
    migration_effect: bee.governance.binding:migration_effect
    migration_runner: bee.hub.binding:migration_runner
    activation_profiles: bee.governance:activation_profile_decoder
    preflight: bee.governance:preflight
- name: destination_backend_call
  kind: function.lua
  source: file://destination_backend.lua
  method: call
  modules: [security]
  imports:
    service: bee.governance.binding:destination_service
    transaction: bee.persist:transaction
  meta: {type: internal}
- name: workspace_backend_call
  kind: function.lua
  source: file://authoring.lua
  method: call
  modules: [security, system]
  imports:
    protocol: bee.governance:workspace_protocol
    staging: bee.governance.persist:staging
    resources: bee.governance.registry:staging_resources
    transaction: bee.persist:transaction
  meta: {type: internal}
