  - funcs
  - security
  imports:
    protocol: bee.gov.types:workspace_protocol
    guide: bee.gov.traits:guide
    transaction: bee.persist:transaction
    bounds: bee.values:bounds
  security:
    policies:
    - bee.gov.security:overlay_facade_policy
  meta:
    type: tool
    title: Overlay authoring
    llm_alias: BeeOverlay
    llm_description: Read this destination's component authoring guide, or create, list, read, put, append, remove or freeze files in your host-admitted private overlay. Put replaces a file; append adds
      bytes at an exact offset and verifies the complete result_digest. Read returns a base64 window of at most 16,384 bytes; use offset and limit to page. Writes require the current revision and a stable
      retry key. Freeze stages measured content only; it neither requests approval nor activates it. Use BeeComponents to inspect installed and Hub components for examples. Binary files use canonical base64.
      There is no host filesystem write or registry access. Source reads a bounded non-private file relative to the authenticated workspace folder; it names no overlay.
    input_schema: '{"type":"object","additionalProperties":false,"required":["operation"],"properties":{"operation":{"type":"string","enum":["guide","source","create","list","read","put","append","remove","freeze"]},"overlay_id":{"type":"string","minLength":1,"maxLength":160},"expected_revision":{"type":"integer","minimum":0,"maximum":9007199254740990},"idempotency_key":{"type":"string","minLength":1,"maxLength":160},"path":{"type":"string","minLength":1,"maxLength":240},"offset":{"type":"integer","minimum":0,"maximum":4194304},"limit":{"type":"integer","minimum":1,"maximum":16384},"result_digest":{"type":"string","pattern":"^[0-9a-f]{64}$"},"content":{"type":"string","maxLength":4194304},"content_base64":{"type":"string","maxLength":5592408},"snapshot_digest":{"type":"string","pattern":"^[0-9a-f]{64}$"}}}

      '
