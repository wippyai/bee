version: '1.0'
namespace: bee.approvals.inbox
entries:
- name: apply_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [registry.apply]
    resources: '*'
    effect: allow
- name: client_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.approvals.binding:request, bee.approvals.binding:decide, bee.approvals.binding:withdraw, bee.approvals.binding:read, bee.approvals.binding:inbox, bee.approvals.binding:list, bee.approvals.binding:consume, bee.approvals.binding:revalidate, bee.threads.service:create, bee.threads.service:get, bee.threads.service:read_after]
    effect: allow
- name: model_test
  kind: function.lua
  source: file://model_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [json]
  imports:
    test: wippy.test:test
    model: bee.approvals.inbox:model
    inbox: bee.approvals.inbox:client
- name: feeds_test
  kind: function.lua
  source: file://feeds_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    feeds: bee.approvals.inbox:feeds
    source_config: bee.approvals.inbox:source_config
- name: view_test
  kind: function.lua
  source: file://view_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [tty]
  imports:
    frames: bee.application:frame
    test: wippy.test:test
    model: bee.approvals.inbox:model
    view: bee.approvals.inbox:view
    appearance: bee.application:appearance
- name: surface_test
  kind: function.lua
  source: file://surface_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "120s"}
  modules: [funcs, security, registry, time, uuid, json, tty]
  security:
    policies: [bee.approvals.inbox:apply_test_policy, bee.approvals.inbox:client_test_policy, bee.security.approvals:approval_store_policy, bee.security.approvals:approval_request_policy, bee.security.approvals:approval_decide_policy]
  imports:
    test: wippy.test:test
    model: bee.approvals.inbox:model
    view: bee.approvals.inbox:view
    inbox: bee.approvals.inbox:client
    caller: bee.application:caller
    appearance: bee.application:appearance
- name: admission_probe
  kind: process.lua
  source: file://admission_probe.lua
  method: main
  meta: {type: test_support}
  modules: [sql, funcs]
- name: spawn_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [process.spawn, process.spawn.monitored, process.host, process.monitor, process.security, security.scope.create, security.policy.get, registry.apply, process.terminate, process.registry.lookup]
    resources: '*'
    effect: allow
- name: admission_test
  kind: function.lua
  source: file://admission_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "120s"}
  modules: [funcs, security, registry, process, channel, time, uuid]
  security:
    policies: [bee.approvals.inbox:spawn_test_policy, bee.approvals.inbox:client_test_policy, bee.security.approvals:approval_store_policy, bee.security.approvals:approval_request_policy, bee.security.approvals:approval_decide_policy]
  imports:
    test: wippy.test:test
- name: recovery_test
  kind: function.lua
  source: file://recovery_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "180s"}
  modules: [funcs, security, registry, process, time, uuid]
  security:
    policies: [bee.approvals.inbox:spawn_test_policy, bee.approvals.inbox:client_test_policy, bee.security.approvals:approval_store_policy, bee.security.approvals:approval_request_policy, bee.security.approvals:approval_decide_policy, bee.security.approvals:approval_consume_policy]
  imports:
    test: wippy.test:test
    model: bee.approvals.inbox:model
    inbox: bee.approvals.inbox:client
    caller: bee.application:caller
    thread_harness: bee.threads:harness
- name: changed_proposal_test
  kind: function.lua
  source: file://changed_proposal_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [funcs, security, registry, uuid]
  security:
    policies: [bee.approvals.inbox:apply_test_policy, bee.approvals.inbox:client_test_policy, bee.security.approvals:approval_store_policy, bee.security.approvals:approval_request_policy, bee.security.approvals:approval_decide_policy, bee.security.approvals:approval_consume_policy]
  imports:
    test: wippy.test:test
    model: bee.approvals.inbox:model
    inbox: bee.approvals.inbox:client
    caller: bee.application:caller
