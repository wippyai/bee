version: '1.0'
namespace: bee
entries:
- name: definition
  kind: ns.definition
  meta:
    title: Bee desktop foundation
- name: workers
  kind: process.host
  host:
    max_processes: 24
    workers: 4
  lifecycle:
    auto_start: true
- name: broker_policy
  kind: security.policy
  policy:
    actions:
    - tty.mount
    - tty.observe
    - tty.input
    - tty.resize
    - process.spawn
    - process.spawn.monitored
    - process.context
    - process.host
    - process.send
    - process.monitor
    - process.terminate
    - process.cancel
    - registry.get
    - process.security
    - security.scope.create
    - security.policy.get
    - registry.snapshot
    - registry.history
    resources: '*'
    effect: allow
- name: processes_policy
  kind: security.policy
  policy:
    actions:
    - system.read
    resources:
    - hosts
    - memory
    - goroutines
    - supervisor
    effect: allow
- name: desktop_policy
  kind: security.policy
  policy:
    actions:
    - registry.get
    - tty.mount
    - tty.observe
    - tty.input
    - tty.resize
    - process.send
    - process.monitor
    - process.terminate
    - process.cancel
    - process.host
    - process.context
    - process.security
    - security.scope.create
    - security.policy.get
    resources: '*'
    effect: allow
- name: presenter_policy
  kind: security.policy
  policy:
    actions:
    - tty.observe
    - tty.input
    - tty.resize
    - process.send
    - process.monitor
    resources: '*'
    effect: allow
- name: session_policy
  kind: security.policy
  policy:
    actions:
    - process.send
    - process.monitor
    resources: '*'
    effect: allow
- name: application_admission
  kind: registry.entry
  bindings:
  - definition_id: bee.test_status:app
    policies: [bee:thread_read_client_policy, bee:test_run_client_policy]
  - definition_id: bee.settings:app
    policies: []
    appearance_write: true
  - definition_id: bee.processes:app
    policies:
    - bee:processes_policy
    application_stop: true
  - definition_id: bee.console:app
    policies:
    - bee.console:executor_policy
    - bee.console:command_policy
- name: terminal
  kind: terminal.host
  hide_logs: true
  lifecycle:
    auto_start: true
- name: base_app_policy
  kind: security.policy
  policy:
    actions:
    - process.send
    resources: '*'
    effect: allow
- name: app_boundary_policy
  kind: security.policy
  policy:
    actions:
    - process.security
    - security.scope.create
    - security.policy.get
    - process.context
    - registry.apply
    - registry.apply_version
    - registry.overlay.apply
    resources: '*'
    effect: deny
- name: core_spawn_boundary
  kind: security.policy
  policy:
    actions:
    - process.spawn
    - process.spawn.monitored
    resources:
    - bee.host:main
    - bee.workspace:main
    - bee.workspace:launch
    - bee.client:main
    - bee.client:local
    - bee.launch:supervisor
    - bee.session:main
    - bee.applications:broker
    - bee.terminal:main
    effect: deny
- name: core_spawn_policy
  kind: security.policy
  policy:
    actions:
    - process.spawn
    - process.spawn.monitored
    resources:
    - bee.host:main
    - bee.session:main
    - bee.applications:broker
    - bee.terminal:main
    effect: allow
- name: host_policy
  kind: security.policy
  policy:
    actions: [process.send, process.monitor, process.unmonitor, process.terminate, process.host, process.context, process.security, security.policy.get, security.scope.create]
    resources: '*'
    effect: allow
- name: client_spawn_policy
  kind: security.policy
  policy:
    actions: [process.spawn, process.spawn.monitored]
    resources: [bee.session:main, bee.terminal:main]
    effect: allow
- name: host_spawn_policy
  kind: security.policy
  policy:
    actions: [process.spawn, process.spawn.monitored]
    resources: [bee.applications:broker]
    effect: allow
- name: local_supervisor_spawn_policy
  kind: security.policy
  policy:
    actions: [process.spawn, process.spawn.monitored]
    resources: [bee.host:main]
    effect: allow
- name: workspace_environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: workspace_db_path
  kind: env.variable
  storage: bee:workspace_environment
  variable: BEE_WORKSPACE_DB
  default: .wippy/workspace.db
  readonly: true
- name: workspace_db
  kind: db.sql.sqlite
  file: ${env:bee:workspace_db_path}
  lifecycle:
    auto_start: true
- name: workspace_storage_policy
  kind: security.policy
  policy:
    actions:
    - db.get
    resources:
    - bee:workspace_db
    effect: allow
- name: workspace_storage_boundary
  kind: security.policy
  policy:
    actions:
    - db.get
    resources:
    - bee:workspace_db
    - bee:client_db
    - bee.client.db:*
    - bee.workspace.db:*
    effect: deny
- name: client_storage_policy
  kind: security.policy
  policy:
    actions: [db.get]
    resources: [bee:client_db]
    effect: allow
- name: thread_storage_policy
  kind: security.policy
  policy:
    actions: [db.get]
    resources: [bee.threads:db]
    effect: allow
- name: thread_read_client_policy
  kind: security.policy
  policy:
    actions: [contract.open, contract.call, funcs.call]
    resources: [bee.threads:local, read_after, bee.threads:read_after]
    effect: allow
- name: thread_write_client_policy
  kind: security.policy
  policy:
    actions: [contract.open, contract.call, funcs.call]
    resources: [bee.threads:local, claim, append, bee.threads:claim, bee.threads:append]
    effect: allow
- name: test_run_client_policy
  kind: security.policy
  policy:
    actions: [contract.open, contract.call, funcs.call]
    resources: [bee.test_status:local_runner, start, bee.test_status:start]
    effect: allow
- name: test_run_spawn_policy
  kind: security.policy
  policy:
    actions: [process.spawn, process.host]
    resources: [bee.test_status:worker, bee.test_status:workers]
    effect: allow
