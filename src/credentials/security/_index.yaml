version: '1.0'
namespace: bee.credentials.security
entries:
- name: credential_store_policy
  kind: security.policy
  meta:
    comment: The credential broker's store, its linked references, node identity and the admitted sources it reads at materialization
  policy:
    actions:
    - db.get
    - registry.get
    - registry.find
    - system.read
    - env.get
    resources:
    - bee:db
    - bee.credentials.env:sources_ref
    - bee.credentials.env:credential_sources
    - node
    - '*'
    effect: allow
- name: credential_value_policy
  kind: security.policy
  policy:
    actions: [env.set]
    resources: '*'
    effect: allow
- name: credential_login_admission_policy
  kind: security.policy
  meta:
    comment: The broker reads the logins of drivers a person approved through an overlay, through the host-selected governance reader only
  policy:
    actions:
    - funcs.call
    resources:
    - bee.gov.binding:driver_logins
    effect: allow
- name: credential_manage_policy
  kind: security.policy
  policy:
    actions:
    - bee.credentials.manage
    resources: '*'
    effect: allow
- name: credential_issue_policy
  kind: security.policy.expr
  meta:
    comment: A principal takes credential projections only in the workspace its host-issued identity is bound to
  policy:
    actions:
    - bee.credentials.issue
    resources: '*'
    expression: resource != "" && resource == actor.meta.workspace_id
    effect: allow
- name: credential_materialize_policy
  kind: security.policy
  meta:
    comment: Attached to placement service and runner entries only
  policy:
    actions:
    - bee.credentials.materialize
    - bee.credentials.write_back
    - funcs.call
    resources:
    - '*'
    - bee.credentials.binding:check
    - bee.credentials.binding:renew_attempt
    - bee.credentials.binding:configuration_setup
    - bee.credentials.binding:materialize
    - bee.credentials.binding:write_back
    effect: allow
- name: credential_materialize_workspace_policy
  kind: security.policy.expr
  meta:
    comment: An application that runs its own placement materializes projections only in the workspace its host-issued identity is bound to
  policy:
    actions:
    - bee.credentials.materialize
    - funcs.call
    resources: '*'
    expression: (action == "bee.credentials.materialize" && resource != "" && resource == actor.meta.workspace_id) || (action == "funcs.call" && (resource == "bee.credentials.binding:check" || resource
      == "bee.credentials.binding:renew_attempt" || resource == "bee.credentials.binding:materialize"))
    effect: allow
- name: credential_file_policy
  kind: security.policy
  meta:
    comment: Host-selected login roots for credential availability checks and bounded materialization reads
  policy:
    actions:
    - fs.get
    - fs.read
    resources:
    - bee.env:machine_login_source
    effect: allow
- name: credential_file_write_policy
  kind: security.policy
  meta:
    comment: Host-selected login roots for the broker's exact-file token write-back endpoint only
  policy:
    actions:
    - fs.get
    - fs.read
    - fs.write
    resources:
    - bee.env:machine_login_source
    effect: allow

- name: configuration_approval_policy
  kind: security.policy.expr
  policy:
    actions: [bee.approvals.request, funcs.call]
    resources: '*'
    expression: (action == "bee.approvals.request" && resource != "") || (action == "funcs.call" && resource in ["bee.approvals.binding:request", "bee.approvals.binding:read"])
    effect: allow

- name: configuration_effect_policy
  kind: security.policy
  policy:
    actions: [bee.approvals.consume]
    resources: '*'
    effect: allow
- name: configuration_effect_owner_policy
  kind: security.policy
  policy:
    actions: [bee.approvals.own, funcs.call]
    resources: [credentials.configuration, bee.approvals.binding:effect_queue, bee.approvals.binding:effect, bee.approvals.binding:revalidate, bee.approvals.binding:events]
    effect: allow
- name: configuration_worker_policy
  kind: security.policy
  policy:
    actions: [funcs.call, process.registry.register, process.listen, process.send]
    resources: [bee.credentials.binding:configuration_effects, bee.approvals.configuration_effect_worker, bee.approvals.wake]
    effect: allow
