version: '1.0'
namespace: bee.security
entries:
- name: application_admission
  kind: registry.entry
  bindings:
  - definition_id: bee.settings:app
    policies: [bee.security:ordinary_app_subsystem_boundary]
    appearance_write: true
  - definition_id: bee.processes:app
    policies:
    - bee.security:ordinary_app_subsystem_boundary
    - bee.security.desktop:processes_policy
    application_stop: true
  - definition_id: bee.console:app
    policies:
    - bee.security:ordinary_app_subsystem_boundary
    - bee.console:executor_policy
    - bee.console:command_policy
  - definition_id: bee.inbox:app
    policies:
    - bee.security:ordinary_app_subsystem_boundary
    - bee.security.approvals:approval_decide_policy
    - bee.inbox:client_policy
  - definition_id: bee.hive_manager:app
    policies:
    - bee.security:ordinary_app_subsystem_boundary
    - bee.hive_manager:client_policy
    - bee.hive_manager:viewer_policy
  - definition_id: bee.timeline:app
    policies:
    - bee.security:ordinary_app_subsystem_boundary
    - bee.timeline:client_policy
  - definition_id: bee.workspaces:app
    policies:
    - bee.security:ordinary_app_subsystem_boundary
    - bee.workspaces:client_policy
    - bee.security.storage:workspace_catalog_read_policy
    - bee.security.storage:workspace_catalog_manage_policy
    - bee.security.threads:thread_workspace_list_policy
    - bee.security.desktop:workspace_host_lease_policy
  - definition_id: bee.overlays:app
    policies:
    - bee.security:ordinary_app_subsystem_boundary
    - bee.overlays:client_policy
    - bee.security.governance:governance_delivery_read_policy
    - bee.security.governance:governance_delivery_manage_policy
    - bee.security.governance:governance_delivery_activate_policy
  - definition_id: bee.modules:app
    policies:
    - bee.security:ordinary_app_subsystem_boundary
    - bee.modules:client_policy
    - bee.modules:hub_policy
    - bee.modules:publication_policy
  - definition_id: bee.harness.window:app
    scope_management: true
    close_grace_ms: 60000
    policies:
    - bee.security.harness:carrier_policy
    - bee.security.harness:carrier_environment_policy
    - bee.security.harness:profile_workspace_policy
    - bee.security.harness:profile_context_boundary
    - bee.security.threads:thread_create_policy
    - bee.security.harness:harness_setup_policy
    - bee.security.placement:placement_store_policy
    - bee.security.placement:placement_exec_policy
    - bee.security.placement:placement_runner_policy
    - bee.security.resources:resource_grant_policy
    - bee.security.resources:resource_resolve_policy
    - bee.security.credentials:credential_issue_policy
    - bee.security.credentials:credential_materialize_workspace_policy
    - bee.security.gateway:gateway_materialize_policy
    - bee.security.gateway:gateway_supervision_policy
    - bee.security.storage:workspace_folder_browse_policy
- name: base_app_policy
  kind: security.policy
  policy:
    actions:
    - process.send
    resources: '*'
    effect: allow
- name: app_boundary_policy
  kind: security.policy
  policy:
    actions:
    - process.security
    - security.scope.create
    - security.policy.get
    - process.context
    - registry.apply
    - registry.apply_version
    - registry.overlay.apply
    resources: '*'
    effect: deny
- name: scope_managing_app_boundary
  kind: security.policy
  meta:
    comment: Default denial for the host-selected native execution actor, which may manage call scopes under its reviewed admission policy.
  policy:
    actions: [process.security, security.policy.get, process.context, registry.apply, registry.apply_version, registry.overlay.apply]
    resources: '*'
    effect: deny
- name: core_spawn_boundary
  kind: security.policy
  policy:
    actions:
    - process.spawn
    - process.spawn.monitored
    - process.spawn.linked
    - process.exec
    - process.host
    resources:
    - bee.host:main
    - bee.workspace:main
    - bee.workspace:launch
    - bee.client:main
    - bee.client:local
    - bee.client:local_command
    - bee.client:local_application
    - bee.client:desktop
    - bee.client:application
    - bee.launch:supervisor
    - bee.launch:headless
    - bee.session:main
    - bee.applications:broker
    - bee.terminal:main
    - bee.hive:supervisor
    - bee.hive_host.supervisor:main
    - bee.hive_host:supervisor_host
    effect: deny
- name: ordinary_app_subsystem_boundary
  kind: security.policy
  meta:
    comment: Host-selected boundary for ordinary applications; native execution components receive reviewed policies
      separately
  policy:
    actions:
    - db.get
    resources:
    - bee.placement.native:db
    - bee.resources:db
    - bee.credentials:db
    - bee.governance:db
    effect: deny
- name: application_open_facade_policy
  kind: security.policy.expr
  meta:
    comment: The explicitly admitted Agent Open facade may address the selected local workspace host; it cannot publish, activate or edit the registry.
  policy:
    expression: '((action == "process.registry.lookup" && resource matches "^bee[.]workspace[.]host/[0-9a-f]+$") || (action == "process.registry.register" && resource matches "^bee[.]application[.]open/[0-9a-f-]+$") || (action == "process.registry.unregister" && resource matches "^bee[.]application[.]open/[0-9a-f-]+$") || action == "process.send")'
    actions: [process.registry.lookup, process.registry.register, process.registry.unregister, process.send]
    resources: '*'
    effect: allow
