version: '1.0'
namespace: bee.docs
entries:
- name: definition
  kind: ns.definition
  module: docs
  readme: file://README.md
  meta:
    title: Bee documentation
    comment: Offline documentation protocol, corpus reader and read-only facade; the host selects the embedded corpus resource and grants it explicitly
- name: dependency_persist
  kind: ns.dependency
  component: bee/persist
  version: '*'
- name: target_corpus
  kind: ns.requirement
  meta:
    comment: The read-only documentation filesystem selected by the host
  targets:
  - entry: bee.docs.env:corpus_ref
    path: .resource_ref
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  imports: {bounds: bee.protocol:bounds}
- name: target_call_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.docs.binding:call
    path: .security.policies
