version: '1.0'
namespace: bee.driver.codex.descriptor
entries:
- name: cli
  kind: registry.entry
  meta:
    type: bee.driver.cli_descriptor
    comment: Codex CLI command, JSONL codec, login evidence and version probe
  data:
    schema_revision: bee.driver.cli-descriptor@4
    provider: codex
    executable: codex
    version_probe:
      argv:
      - --version
      pattern: ([0-9]+[.][0-9]+[.][0-9]+)
    login_evidence:
      command: codex login
      any_of:
      - kind: file_exists
        paths:
        - .codex/auth.json
        variable: CODEX_HOME
        directory: .codex
      - kind: env_present
        names:
        - OPENAI_API_KEY
        - CODEX_API_KEY
      - kind: auth_status
        argv:
        - login
        - status
        success_exit_code: 0
        timeout_ms: 3000
    platform:
      os:
      - linux
      - darwin
      arch:
      - x86_64
      - amd64
      - arm64
      - aarch64
    codec: codex-jsonl
    json_paths:
      resume_id:
      - thread_id
      result_text:
      - item
      - text
      errors:
      - error
      - message
      usage:
      - usage
    configure: codex
    capabilities:
      permission_answers:
        window:
          transport: hook_mcp
          adapter_ref: bee.driver.permission:permission_request_hook
        first_turn:
          transport: provider
          reason: Bee runs codex exec --json with prompt stdin closed; exec has no client approval-response channel. The window
            uses PermissionRequest hooks. App-server JSON-RPC approvals require a different driver mode.
        resume:
          transport: provider
          reason: Bee runs codex exec --json with prompt stdin closed; exec has no client approval-response channel. The window
            uses PermissionRequest hooks. App-server JSON-RPC approvals require a different driver mode.
    options:
      profiles:
      - window
      - batch
      - named_batch
      fields:
        sandbox:
          default: read-only
          invalid: sandbox is not one Bee admits
          path: provider.options.sandbox
          value_schema:
            type: string
            enum:
            - read-only
            - workspace-write
            - danger-full-access
          label: Sandbox
          description: CLI sandbox
          section: advanced
          order: 0
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --sandbox
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - --sandbox
            - field: sandbox
          person_values: [danger-full-access]
          consent_message: The CLI sandbox is disabled inside the container.
          id: sandbox
          group: access/trust
          security_class: host-ceiling
          config_aliases:
          - format: toml
            path:
            - sandbox_mode
          capabilities:
            read-only:
            - read
            workspace-write:
            - read
            - write-admitted
            danger-full-access:
            - read
            - write-anywhere
            - network
          ceiling:
          - read
          - write-admitted
        approval_policy:
          path: provider.options.approval_policy
          value_schema:
            type: string
            enum:
            - on-request
            - never
          label: Approval policy
          description: Codex approval requests
          section: advanced
          order: 2
          contexts:
          - window
          - first_turn
          - resume
          support:
            config_schema_ref: bee.driver.codex.descriptor:cli
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - if: approval_policy
              then:
              - -c
              - format: approval_policy="{approval_policy}"
          person_values: [never]
          consent_message: Runs without approvals inside the container.
          capabilities:
            on-request: [request-approval]
            never: [no-approvals]
          ceiling: [request-approval]
          id: approval_policy
          group: access/trust
          security_class: host-ceiling
          config_aliases:
          - format: toml
            path:
            - approval_policy
        dangerously_bypass_approvals_and_sandbox:
          id: dangerously_bypass_approvals_and_sandbox
          path: provider.options.dangerously_bypass_approvals_and_sandbox
          value_schema: {type: boolean}
          default: false
          label: Bypass approvals and sandbox
          description: Run without approvals or the CLI sandbox inside an admitted container
          group: access/trust
          security_class: host-ceiling
          person_values: [true]
          consent_message: Runs without approvals inside the container; the CLI sandbox is disabled.
          capabilities: {"false": [], "true": [bypass]}
          ceiling: []
          section: advanced
          order: 3
          contexts: [window, first_turn, resume]
          support:
            help_probe: {argv: [--help], flag: --dangerously-bypass-approvals-and-sandbox}
          render:
          - kind: argv
            contexts: [window, first_turn, resume]
            tokens:
            - if: dangerously_bypass_approvals_and_sandbox
              then: [--dangerously-bypass-approvals-and-sandbox]
        resume_ref:
          type: id
          forbid_option: true
          invalid: resume_ref is not an identifier
        gateway_tools:
          type: ids
          default: []
        gateway_hooks:
          type: ids
          transform: presence
          default: []
        effort:
          invalid: effort is not one Bee admits
          path: provider.effort
          value_schema:
            type: string
            enum:
            - low
            - medium
            - high
            - xhigh
            - max
          label: Effort
          description: CLI effort
          section: basic
          order: 4
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --config
          render:
          - kind: argv
            contexts:
            - window
            tokens:
            - if: effort
              then:
              - --config
              - format: model_reasoning_effort="{effort}"
          - kind: argv
            contexts:
            - first_turn
            tokens:
            - if: effort
              then:
              - --config
              - format: model_reasoning_effort="{effort}"
          - kind: argv
            contexts:
            - resume
            tokens:
            - if: effort
              then:
              - --config
              - format: model_reasoning_effort="{effort}"
          config_aliases:
          - format: toml
            path: [model_reasoning_effort]
          id: effort
          group: model/provider
          security_class: free
        config_profile:
          invalid: config_profile must be a plain Codex profile name
          path: provider.options.config_profile
          value_schema:
            type: string
            format: codex_profile
          label: Config profile
          description: CLI config profile
          section: advanced
          order: 5
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --profile
          render:
          - kind: argv
            contexts:
            - window
            tokens:
            - if: config_profile
              then:
              - --profile
              - field: config_profile
          - kind: argv
            contexts:
            - first_turn
            tokens:
            - if: config_profile
              then:
              - --profile
              - field: config_profile
          - kind: argv
            contexts:
            - resume
            tokens:
            - if: config_profile
              then:
              - --profile
              - field: config_profile
          id: config_profile
          group: advanced
          security_class: host-ceiling
        system_prompt_append:
          path: provider.system_prompt_append
          value_schema:
            type: string
            maxLength: 4096
          label: System prompt append
          description: Additional instructions in the session private home
          section: advanced
          order: 100
          contexts:
          - window
          - first_turn
          - resume
          support:
            config_schema_ref: bee.driver.codex.descriptor:cli
          render:
          - kind: config
            contexts:
            - window
            - first_turn
            - resume
            file: .bee/system-prompt-append.txt
            format: text
            path: []
            merge: append
            value:
              field: provider.system_prompt_append
          - kind: config
            contexts:
            - window
            - first_turn
            - resume
            file: .codex/config.toml
            format: toml
            path:
            - developer_instructions
            merge: append
            value:
              field: provider.system_prompt_append
          id: system_prompt_append
          group: behavior
          security_class: free
        model:
          path: provider.model
          value_schema:
            type: string
            format: model
            maxLength: 128
          label: Model
          description: Model identifier
          section: basic
          order: 1
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --model
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - if: model
              then:
              - --model
              - field: model
          config_aliases:
          - format: toml
            path: [model]
          id: model
          group: model/provider
          security_class: free
        model_provider:
          path: provider.options.model_provider
          value_schema:
            type: string
            maxLength: 128
          label: Model provider
          description: Model provider
          section: advanced
          order: 10
          contexts: &id001
          - window
          - first_turn
          - resume
          support:
            config_schema_ref: bee.driver.codex.descriptor:cli
          render:
          - kind: config
            contexts: *id001
            file: .codex/config.toml
            format: toml
            path:
            - model_provider
            merge: set
            value:
              field: provider.options.model_provider
          id: model_provider
          group: model/provider
          security_class: host-ceiling
        model_providers:
          path: provider.options.model_providers
          value_schema:
            type: object
            maxProperties: 16
            additionalProperties:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 4096
                base_url:
                  type: string
                  maxLength: 4096
                wire_api:
                  type: string
                  enum:
                  - responses
                env_key:
                  type: string
                  enum:
                  - OPENAI_API_KEY
                http_headers:
                  type: object
                  maxProperties: 16
                  additionalProperties:
                    type: string
                    maxLength: 4096
                env_http_headers:
                  type: object
                  maxProperties: 16
                  additionalProperties:
                    type: string
                    maxLength: 4096
                query_params:
                  type: object
                  maxProperties: 16
                  additionalProperties:
                    type: string
                    maxLength: 4096
                auth:
                  type: object
                  additionalProperties: false
                  properties:
                    command:
                      type: string
                      maxLength: 4096
                  required:
                  - command
                request_max_retries:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                stream_max_retries:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                stream_idle_timeout_ms:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
                supports_websockets:
                  type: boolean
              required:
              - name
              - base_url
              - wire_api
          label: Custom providers
          description: Custom providers
          section: advanced
          order: 11
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=0.160.1'
            config_schema_ref: bee.driver.codex.descriptor:cli
          render:
          - kind: config
            contexts:
            - window
            - first_turn
            - resume
            file: .codex/config.toml
            format: toml
            path:
            - model_providers
            merge: set
            value:
              field: provider.options.model_providers
          id: model_providers
          group: model/provider
          security_class: host-ceiling
          capabilities:
          - profile-option
          ceiling: []
        folder_trust:
          id: folder_trust
          path: provider.options.folder_trust
          value_schema:
            type: string
            enum:
            - ask
            - approved-workdir
          default: ask
          label: Folder trust
          description: Trust only the canonical launch workdir in the isolated agent home
          group: access/trust
          security_class: person-only
          section: advanced
          order: 90
          contexts:
          - window
          - first_turn
          - resume
          support:
            config_schema_ref: bee.driver.codex.descriptor:cli
          render: []
          trust:
            file: .codex/config.toml
            format: toml
            key: trust_level
            value: trusted
            repository_root: true
            project_config:
            - .codex/config.toml
        plan_effort:
