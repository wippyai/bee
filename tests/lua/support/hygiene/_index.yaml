version: '1.0'
namespace: bee.tests.support.hygiene
entries:
- name: executor
  kind: exec.native
  default_env: {PATH: '/usr/bin:/bin'}
- name: schema
  kind: function.lua
  source: file://schema.lua
  method: run
  meta: {type: migration, target_db: 'bee:db', timestamp: '2026-10-12T00:00:00Z', test_support: true}
  imports: {migration: 'wippy.migration:migration'}
- name: db
  kind: db.sql.sqlite
  file: .wippy/hygiene.db
  lifecycle: {auto_start: true}
- name: owner
  kind: process.lua
  source: file://owner.lua
  method: main
  modules: [system, registry, process, sql, events, exec, json, channel, time]
  imports: {bounds: bee.values:bounds, supervision: bee.placement.native.persist:supervision, boot_gate: bee.process:boot_gate}
- name: service
  kind: process.service
  process: bee.tests.support.hygiene:owner
  host: bee:workers
  lifecycle:
    auto_start: true
    requires: [wippy.bootloader:bootloader.service, bee.hive.service:supervisor_service, bee:changes, bee.tests.support.hygiene:db]
    security:
      actor: {id: bee.test.hygiene}
      policies: [bee.tests.support.hygiene:inspection_policy]
- name: inspection
  kind: library.lua
  source: file://owner.lua
  modules: [system, registry, process, sql, events, exec, json, channel, time]
  imports: {bounds: bee.values:bounds, supervision: bee.placement.native.persist:supervision, boot_gate: bee.process:boot_gate}
- name: compare_test
  kind: function.lua
  source: file://compare_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [process, channel]
  security: {policies: [bee.tests.support.hygiene:fixture_policy]}
  imports: {test: wippy.test:test, owner: bee.tests.support.hygiene:inspection}
- name: requester
  kind: process.lua
  source: file://compare_test.lua
  method: requester
  meta: {type: test_support}
  modules: [process, channel]
  imports: {test: wippy.test:test, owner: bee.tests.support.hygiene:inspection}
- name: responder
  kind: process.lua
  source: file://compare_test.lua
  method: responder
  meta: {type: test_support}
  modules: [process, channel]
  imports: {test: wippy.test:test, owner: bee.tests.support.hygiene:inspection}
- name: fixture_policy
  kind: security.policy
  policy:
    actions: [process.spawn, process.host, process.monitor, process.cancel, process.listen, process.send]
    resources: '*'
    effect: allow
- name: wrapper_template
  kind: library.lua
  source: file://wrapper.lua
  modules: [funcs, process, registry, ctx, json, time, system]
  imports: {bounds: bee.values:bounds}
- name: inspection_policy
  kind: security.policy
  policy:
    actions: [process.monitor, exec.get, exec.run, events.subscribe, system.read, registry.find, registry.get, db.get, process.registry.register, process.registry.lookup, process.listen, process.send]
    resources: '*'
    effect: allow
