version: '1.0'
namespace: bee.apps.terminal
entries:
- name: acquire
  kind: security.policy
  meta:
    comment: Terminal acquires its own executor
  policy:
    actions:
    - exec.get
    resources:
    - bee.apps.terminal:executor
    effect: allow
- name: run
  kind: security.policy.expr
  meta:
    comment: Terminal runs the user's shell, and the commands it is opened with, through its own executor only
  policy:
    expression: meta.executor == "bee.apps.terminal:executor"
    actions:
    - exec.run
    resources: '*'
    effect: allow
- name: executor
  kind: exec.native
  default_env:
    PATH: ${env:bee.apps.terminal:path}
    HOME: ${env:bee.apps.terminal:home}
    USER: ${env:bee.apps.terminal:user|}
    LANG: ${env:bee.apps.terminal:lang}
    TERM: xterm-256color
- name: environment_storage
  kind: ns.requirement
  meta:
    value_kind: env.storage.os
    comment: The host's OS environment storage the Terminal's executor variables read
  default: bee:os
  targets:
  - entry: path
    path: .storage
  - entry: home
    path: .storage
  - entry: user
    path: .storage
  - entry: lang
    path: .storage
- name: path
  kind: env.variable
  storage: bee:os
  variable: PATH
  default: /usr/local/bin:/usr/bin:/bin
  readonly: true
- name: home
  kind: env.variable
  storage: bee:os
  variable: HOME
  default: /
  readonly: true
- name: user
  kind: env.variable
  storage: bee:os
  variable: USER
  default: ''
  readonly: true
- name: lang
  kind: env.variable
  storage: bee:os
  variable: LANG
  default: C.UTF-8
  readonly: true
