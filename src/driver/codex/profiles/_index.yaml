version: '1.0'
namespace: bee.driver.codex.profiles
entries:
- name: default_window
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned Codex window declaration; the host separately selects its policy, activation, executable and permissions
  data:
    schema_revision: bee.launch-definition@1
    launch_id: codex-window
    title: Codex CLI
    binding_ref: bee.drivers.codex.binding:binding
    profile_id: window
    private_credentials:
    - codex_login
    - codex_api_key
    docker_credentials:
    - codex_login
    - codex_api_key
    policy_ref: bee.driver.codex.security:launch_policy_codex_window
    default_mode: window
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: new
    session_resource: session
    credentials: []
    presentation:
      start_menu: true
      fullscreen: true
      reuse: never
- name: research_batch
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned bounded Codex batch route for a host-selected coordinator and caller-owned shared thread
  data:
    schema_revision: bee.launch-definition@1
    launch_id: codex-research-batch
    title: Codex researcher
    binding_ref: bee.drivers.codex.binding:binding
    profile_id: batch
    policy_ref: bee.driver.codex.security:launch_policy_codex_batch
    default_mode: batch
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: caller
    session_resource: session
    credentials:
    - codex_login
    - codex_api_key
    presentation:
      start_menu: false
      fullscreen: false
      reuse: never
- name: named_batch
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned structured Codex route that projects its selected named profile, login and required configuration into a private home
  data:
    schema_revision: bee.launch-definition@1
    launch_id: codex-named-batch
    title: Codex named profile
    binding_ref: bee.drivers.codex.binding:binding
    profile_id: named_batch
    policy_ref: bee.driver.codex.security:launch_policy_codex_named_batch
    default_mode: batch
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: caller
    session_resource: session
    credentials:
    - codex_login
    - codex_api_key
    presentation:
      start_menu: false
      fullscreen: false
      reuse: never
