version: '1.0'
namespace: bee
entries:
- name: gateway_store_policy
  kind: security.policy
  meta:
    comment: The gateway authority's store, its linked references, the host endpoint and the listener service state; no network
  policy:
    actions:
    - db.get
    - registry.get
    - system.read
    resources:
    - bee.gateway:db
    - bee.gateway:database_ref
    - bee.gateway:listener_ref
    - bee:gateway_endpoint
    - supervisor
    effect: allow
- name: gateway_readiness_policy
  kind: security.policy.expr
  meta:
    comment: Internal readiness only; the function pins the host-selected native address and authenticates its nonce response. No agent receives this network policy.
  policy:
    actions:
    - http_client.request
    - http_client.private_ip
    resources: '*'
    expression: '(action == "http_client.private_ip" && resource == "127.0.0.1") || (action == "http_client.request" && resource matches "^http://127\\.0\\.0\\.1:[0-9]+/ready$")'
    effect: allow
- name: gateway_admit_policy
  kind: security.policy
  meta:
    comment: A carrier admits and revokes gateway bindings for the actions it runs
  policy:
    actions:
    - bee.gateway.admit
    resources: '*'
    effect: allow
- name: gateway_materialize_policy
  kind: security.policy
  meta:
    comment: Attached to placement runner entries only; the runner receives a binding's token bytes once for the attempt it
      runs
  policy:
    actions:
    - bee.gateway.materialize
    - funcs.call
    resources:
    - '*'
    - bee.gateway:materialize
    - bee.gateway:check
    - bee.gateway:revoke
    - bee.gateway:seal
    effect: allow
- name: gateway_supervision_policy
  kind: security.policy
  meta:
    comment: Attached to placement service entries and the sweeper only; placement checks and retires the bindings of the
      attempts it supervises, independently of any carrier
  policy:
    actions:
    - bee.gateway.manage
    - funcs.call
    resources:
    - bindings
    - bee.gateway:check
    - bee.gateway:revoke_attempt
    - bee.gateway:authorize_materialization
    effect: allow
- name: gateway_manage_policy
  kind: security.policy
  meta:
    comment: The managed host opens and drains the listener and may revoke any binding
  policy:
    actions:
    - bee.gateway.manage
    resources:
    - listener
    - bindings
    effect: allow
- name: gateway_execute_policy
  kind: security.policy
  meta:
    comment: The MCP endpoint constructs the bound subject and its host-selected scope; exact thread call permissions are attached separately
  policy:
    actions:
    - funcs.security
    - funcs.context
    - security.scope.create
    - security.actor.create
    - security.policy.get
    resources: ['*']
    effect: allow
- name: gateway_tool_read_policy
  kind: security.policy
  meta:
    comment: The scope a bound subject runs thread_read and thread_wait under; membership is still checked by the thread owner
  policy:
    actions:
    - funcs.call
    resources:
    - bee.threads.service:read_after
    - bee.threads.delivery:watch
    effect: allow
- name: gateway_address_policy
  kind: security.policy
  policy:
    actions:
    - registry.get
    - system.read
    resources:
    - bee.gateway:listener_ref
    - bee:gateway_endpoint
    - supervisor
    effect: allow
- name: gateway_address_call_policy
  kind: security.policy
  policy:
    actions:
    - funcs.call
    resources:
    - bee.gateway:address
    effect: allow
- name: gateway_tool_message_policy
  kind: security.policy
  meta:
    comment: The bound MCP subject may append only a decoded message through the thread authority; the endpoint
      supplies thread and action/attempt context
  policy:
    actions:
    - funcs.call
    resources:
    - bee.threads.service:record
    effect: allow
- name: gateway_tool_launch_policy
  kind: security.policy
  meta:
    comment: The bound MCP subject may start only one host-allow-listed managed launch through the launch facade, as itself and in its own workspace; the facade reads the caller's own launch policy and refuses anything it does not name, and this grants no grant, credential, trait or overlay authority
  policy:
    actions:
    - funcs.call
    resources:
    - bee.harness.launch:agent_launch_call
    effect: allow
- name: gateway_tool_workspace_policy
  kind: security.policy.expr
  meta:
    comment: A bound MCP subject may author only through the Governance workspace facade; the store enforces actor ownership and this grants no publication or activation authority
  policy:
    expression: '(action == "funcs.call" && resource == "bee.governance:workspace_call") || ((action == "bee.governance.workspace.read" || action == "bee.governance.workspace.write") && resource != "")'
    actions:
    - funcs.call
    - bee.governance.workspace.read
    - bee.governance.workspace.write
    resources:
    - bee.governance:workspace_call
    - '*'
    effect: allow

- name: gateway_tool_docs_policy
  kind: security.policy
  meta:
    comment: A bound MCP subject reads the one embedded documentation corpus through the docs facade; the volume is read-only and this grants no host path, registry write or network
  policy:
    actions:
    - funcs.call
    - fs.get
    resources:
    - bee:docs_call
    - bee:docs_corpus
    effect: allow
- name: gateway_tool_components_policy
  kind: security.policy.expr
  meta:
    comment: A bound MCP subject may inspect effective installed component state, package previews and effect-free plans through the strict Hub facade; it receives no apply, publication or registry-write authority
  policy:
    expression: '(action == "funcs.call" && resource == "bee.hub:call") || (action == "bee.hub.read" && resource != "")'
    actions: [funcs.call, bee.hub.read]
    resources: [bee.hub:call, '*']
    effect: allow
- name: gateway_tool_delivery_policy
  kind: security.policy.expr
  meta:
    comment: A bound MCP subject may request delivery of its frozen artifact (publication prepare + destination stage/preflight) and read delivery status; the facade and the owner services enforce workspace, profile and destination authority
  policy:
    expression: '(action == "funcs.call" && resource == "bee.governance:delivery_call") || ((action == "bee.governance.delivery.manage" || action == "bee.governance.delivery.read") && resource != "")'
    actions: [funcs.call, bee.governance.delivery.manage, bee.governance.delivery.read]
    resources: [bee.governance:delivery_call, '*']
    effect: allow
- name: gateway_tool_publish_policy
  kind: security.policy.expr
  meta:
    comment: A bound MCP subject may publish only the exact locally reviewed and applied version; publication refuses anything else, and this grants no review, selection, approval or overlay authority
  policy:
    expression: '(action == "funcs.call" && resource == "bee.governance:delivery_call") || (action == "bee.governance.delivery.publish" && resource != "")'
    actions: [funcs.call, bee.governance.delivery.publish]
    resources: [bee.governance:delivery_call, '*']
    effect: allow
- name: gateway_tool_application_open_policy
  kind: security.policy
  meta:
    comment: A binding may open an already applied/admitted application through its own workspace host; this grants no activation, publication or registry write.
  policy:
    actions: [funcs.call]
    resources: [bee.applications:open_call]
    effect: allow
- name: gateway_access_call_policy
  kind: security.policy
  meta:
    comment: Internal gateway calls to request and consume exact per-binding approvals; never an agent tool scope
  policy:
    actions: [funcs.call]
    resources: [bee.approvals:request, bee.approvals:read, bee.approvals:consume, bee.approvals:revalidate, bee.threads.service:get, bee.threads.service:read_after]
    effect: allow
