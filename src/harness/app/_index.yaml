version: '1.0'
namespace: bee.harness.app
entries:
- name: request
  kind: library.lua
  source: file://request.lua
  modules:
  - json
  imports:
    bounds: bee.values:bounds
- name: input
  kind: library.lua
  source: file://input.lua
  modules:
  - tty
- name: recovery
  kind: library.lua
  source: file://recovery.lua
  modules:
  - json
  imports:
    bounds: bee.values:bounds
- name: restore_view
  kind: library.lua
  source: file://restore_view.lua
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
- name: runtime
  kind: library.lua
  source: file://runtime.lua
  modules:
  - tty
  - logger
  - exec
  - process
  - channel
  - time
  - funcs
  - uuid
  - json
  imports:
    confirmation: bee.approvals.app:confirmation
    client: bee.app:client
    text: bee.ui:text
    bounds: bee.values:bounds
    window_request: bee.harness.app:request
    placement_decode: bee.placement:decode
    input_event: bee.harness.app:input
    admission: bee.harness.launch:admission
    machine: bee.harness.carrier:machine
    picker: bee.harness.app:picker
    recovery: bee.harness.app:recovery
    hooks: bee.harness.carrier:hooks
    delivery: bee.harness.carrier:delivery
    records: bee.harness.carrier:hook_records
    appearance: bee.ui:appearance
    restore_view: bee.harness.app:restore_view
    frame: bee.ui:frame
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: []
  imports:
    runtime: bee.harness.app:runtime
    windows: bee.harness.binding:windows
  meta:
    type: bee.app
    application:
      menus:
      - bee.shell:apps_menu
      api_version: 1
      title: Agents
      icon: A
      lifetime: view
      revision: '1'
      instance_policy: multiple
      group: ''
      role: sessions
      resume_schema: bee.agent.window@1
      restart_policy: automatic
      commands:
      - name: agent
        fullscreen: false
  security:
    policies:
    - bee.security.approvals:confirmation_client
    - bee.security.approvals:confirmation_authority
    - bee.harness.security:carrier_policy
    - bee.harness.security:interactive_session_policy
    - bee.harness.security:presentation_viewer_policy
    - bee.harness.security:carrier_environment_policy
    - bee.harness.security:profile_workspace_policy
    - bee.harness.security:profile_context_boundary
    - bee.threads.security:create
    - bee.harness.security:harness_setup_policy
    - bee.placement.native.security:placement_store_policy
    - bee.placement.native.security:placement_exec_policy
    - bee.placement.native.security:placement_runner_policy
    - bee.placement.native.security:window_observer_policy
    - bee.resources.security:resource_grant_policy
    - bee.resources.security:resource_resolve_policy
    - bee.credentials.security:credential_issue_policy
    - bee.credentials.security:credential_materialize_workspace_policy
    - bee.security.gateway:gateway_materialize_policy
    - bee.security.gateway:gateway_supervision_policy
    - bee.node.security:workspace_folder_browse_policy
    - bee.placement.docker.security:docker_policy
    - bee.placement.docker.security:docker_socket_policy
    - bee.placement.docker.security:image_client_policy
    - bee.node.security:workspace_catalog_read_policy
    - bee.placement.docker.security:environment_revoke_policy
    - bee.threads.sessions.security:person_allowance_policy
- name: agents
  kind: library.lua
  source: file://agents.lua
  modules:
  - json
  - funcs
  imports:
    names: bee.app:names
    sessions: bee.threads.sessions.client:sessions
    sessions_protocol: bee.threads.sessions.types:protocol
    thread_record: bee.threads.records:record
    bounds: bee.values:bounds
    caller: bee.app:caller
- name: picker_view
  kind: library.lua
  source: file://picker_view.lua
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    text: bee.ui:text
    agents: bee.harness.app:agents
- name: session_view
  kind: library.lua
  source: file://session_view.lua
  modules:
  - tty
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    text: bee.ui:text
    agents: bee.harness.app:agents
    protocol: bee.threads.sessions.types:protocol
- name: picker
  kind: library.lua
  source: file://picker.lua
  modules:
  - tty
  - process
  - channel
  - time
  - uuid
  - funcs
  imports:
    confirmation: bee.approvals.app:confirmation
    frame: bee.ui:frame
    bounds: bee.values:bounds
    client: bee.app:client
    caller: bee.app:caller
    appearance: bee.ui:appearance
    input_event: bee.harness.app:input
    sessions: bee.threads.sessions.client:sessions
    agents: bee.harness.app:agents
    session_view: bee.harness.app:session_view
    directory_view: bee.harness.app:directory_view
    sessions_protocol: bee.threads.sessions.types:protocol
    admission: bee.harness.launch:admission
    view: bee.harness.app:picker_view
    text: bee.ui:text
    forms: bee.harness.app:profile_form
    profile_view: bee.harness.app:profile_view
    terminal_view: bee.harness.app:terminal_view
    allowance_form: bee.threads.sessions.app:allowance_form
- name: profile_editor
  kind: library.lua
  source: file://profile_editor.lua
  modules:
  - json
  imports:
    canonical: bee.values:canonical
    bounds: bee.values:bounds
    preferences: bee.driver.profiles:preferences
    protocol: bee.harness.profiles:protocol
- name: profile_form
  kind: library.lua
  source: file://profile_form.lua
  modules:
  - funcs
  - uuid
  - json
  imports:
    canonical: bee.values:canonical
    descriptors: bee.driver.descriptor:descriptor
    readiness: bee.harness.launch:readiness
    preferences: bee.driver.profiles:preferences
    bounds: bee.values:bounds
    catalog: bee.harness.catalog:catalog
    definition: bee.harness.launch:definitions
    protocol: bee.harness.profiles:protocol
    editor: bee.harness.app:profile_editor
- name: profile_view
  kind: library.lua
  source: file://profile_view.lua
  modules:
  - tty
  imports:
    confirmation: bee.approvals.app:confirmation
    canonical: bee.values:canonical
    settings: bee.harness.app:profile_settings
    bounds: bee.values:bounds
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    text: bee.ui:text
    caller: bee.app:caller
    folder_picker: bee.ui.picker:folder
    editor: bee.harness.app:profile_editor
    forms: bee.harness.app:profile_form
- name: directory_view
  kind: library.lua
  source: file://directory_view.lua
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    text: bee.ui:text
    protocol: bee.threads.sessions.types:protocol
    agents: bee.harness.app:agents
- name: terminal_view
  kind: library.lua
  source: file://terminal_view.lua
  modules:
  - tty
  - process
  - channel
  imports:
    presentation: bee.harness.service:presentation
    bounds: bee.values:bounds
    client: bee.app:client
    input_event: bee.harness.app:input
- name: profile_settings
  kind: library.lua
  source: file://profile_settings.lua
  imports:
    bounds: bee.values:bounds
    editor: bee.harness.app:profile_editor
