version: '1.0'
namespace: bee.credentials
entries:
- name: formats_test
  kind: function.lua
  source: file://formats_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    formats: bee.credentials:formats
- name: sentinel_storage
  kind: env.storage.memory
  meta: {type: test_support}
  lifecycle:
    auto_start: true
- name: sentinel_key
  kind: env.variable
  meta: {type: test_support}
  storage: bee.credentials:sentinel_storage
  variable: BEE_TEST_SENTINEL_KEY
  default: sentinel-secret-7f3a9c
  readonly: true
- name: missing_key
  kind: env.variable
  meta: {type: test_support}
  storage: bee.credentials:sentinel_storage
  variable: BEE_TEST_MISSING_KEY
  default: ''
  readonly: true
- name: broken_key
  kind: env.variable
  meta: {type: test_support}
  storage: bee.credentials:sentinel_storage
  variable: BEE_TEST_BROKEN_KEY
  default: "broken\nsecret-9d8e7f"
  readonly: true
- name: other_key
  kind: env.variable
  meta: {type: test_support}
  storage: bee.credentials:sentinel_storage
  variable: BEE_TEST_OTHER_KEY
  default: other-secret-1b2c3d
  readonly: true
- name: codex_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/codex-login-fixture
  auto_init: true
- name: claude_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/claude-login-fixture
  auto_init: true
- name: invalid_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/invalid-login-fixture
  auto_init: true
- name: missing_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/missing-login-fixture
  auto_init: true
- name: unprivileged_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/unprivileged-login-fixture
  auto_init: true
- name: fs_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [fs.get, fs.read, fs.write]
    resources: [bee.credentials:codex_login_fixture, bee.credentials:claude_login_fixture, bee.credentials:invalid_login_fixture, bee.credentials:missing_login_fixture, bee.credentials:unprivileged_login_fixture]
    effect: allow
- name: probe_direct_fs_read
  kind: function.lua
  source: file://probe_direct_fs_read.lua
  method: handle
  meta: {type: test_support}
  modules: [fs]
- name: apply_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [registry.apply]
    resources: '*'
    effect: allow
- name: client_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.credentials:define, bee.credentials:issue_projection, bee.credentials:check, bee.credentials:materialize, bee.credentials:revoke,
      bee.credentials:revoke_all, bee.credentials:list, bee.credentials:capabilities, bee.credentials:availability, bee.credentials:probe_direct_fs_read]
    effect: allow
- name: broker_test
  kind: function.lua
  source: file://broker_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [funcs, security, registry, time, json, fs, sql]
  security:
    policies: [bee.credentials:apply_test_policy, bee.credentials:fs_test_policy, bee:credential_store_policy]
  imports:
    test: wippy.test:test
    broker: bee.credentials:broker
    persist: bee.persist:database
    migrations: bee.credentials:migrations
    cred_sources: bee.credentials:sources
- name: upgrade_db
  kind: db.sql.sqlite
  meta: {type: test_support}
  file: .wippy/credential-upgrade.db
  lifecycle: {auto_start: true}
- name: upgrade_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [db.get]
    resources: [bee.credentials:upgrade_db]
    effect: allow
- name: upgrade_test
  kind: function.lua
  source: file://upgrade_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [sql, json]
  security:
    policies: [bee.credentials:upgrade_policy]
  imports:
    test: wippy.test:test
    persist: bee.persist:database
    migrations: bee.credentials:migrations
    formats: bee.credentials:formats
    canonical: bee.threads.records:canonical
    broker: bee.credentials:broker
