version: '1.0'
namespace: bee.hive.telemetry.security
entries:
- name: holdings_policy
  kind: security.policy
  meta:
    comment: The holdings operation reads the node host manager through its owner request
  policy:
    actions: [process.send, process.registry.lookup]
    resources: '*'
    effect: allow
- name: cluster_policy
  kind: security.policy
  meta:
    comment: The cluster operation reads named nodes' holdings through the local Hive supervisor
  policy:
    actions: [process.registry.lookup, process.send]
    resources: '*'
    effect: allow
- name: status_policy
  kind: security.policy.expr
  policy:
    expression: '(action == "process.registry.lookup" && resource == "bee.hive.supervisor") || action == "process.send" || (action == "registry.get" && resource == "bee.hive.telemetry:peer_source")'
    actions: [process.registry.lookup, process.send, registry.get]
    resources: '*'
    effect: allow
- name: peer_source_policy
  kind: security.policy
  policy:
    actions: [registry.get]
    resources: [bee.hive.telemetry:empty_peers]
    effect: allow
- name: summary_owner_policy
  kind: security.policy
  policy:
    actions: [funcs.call, bee.threads.sessions.summary, bee.approvals.summary]
    resources: [bee.threads.binding:node_summary, bee.approvals.binding:node_summary, bee.node.binding:describe, node]
    effect: allow
- name: summary_node_name_policy
  kind: security.policy
  policy:
    actions: [bee.node.read]
    resources: '*'
    effect: allow

- name: status_grant_policy
  kind: security.policy
  policy:
    actions: [registry.get]
    resources: '*'
    effect: allow
