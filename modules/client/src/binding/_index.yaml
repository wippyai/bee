version: '1.0'
namespace: bee.client.binding
entries:
- name: desktops
  kind: library.lua
  source: file://desktops.lua
  modules:
  - process
  - tty
  - security
  imports:
    binding: bee.workspace.types:selection
    contract: bee.protocol:application
    lifecycle: bee.client.types:lifecycle
    attachments: bee.client.binding:attachments
- name: attachments
  kind: library.lua
  source: file://attachments.lua
  modules:
  - tty
  imports:
    attachment: bee.apps:attachment
- name: list_desktops
  kind: function.lua
  source: file://desktop_storage.lua
  method: list
  modules:
  - security
  imports: &id001
    store: bee.client.persist:store
    binding: bee.workspace.types:selection
    contract: bee.protocol:application
  security:
    policies: []
- name: allocate_desktop
  kind: function.lua
  source: file://desktop_storage.lua
  method: allocate
  modules:
  - security
  imports: *id001
  security:
    policies: []
- name: workspace_pages
  kind: library.lua
  source: file://workspace_pages.lua
  modules:
  - funcs
  - channel
  imports:
    contract: bee.protocol:application
- name: node_appearance
  kind: library.lua
  source: file://node_appearance.lua
  modules:
  - funcs
  - channel
  imports:
    appearance: bee.ui:appearance
