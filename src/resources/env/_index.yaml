version: '1.0'
namespace: bee.resources.env
entries:
- name: roots_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked host roots entry; target_roots fills resource_ref
  resource_ref: bee.resources.env:resource_roots
- name: environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: resources
  kind: library.lua
  source: file://resources.lua
  modules:
  - registry
  - env
  - system
  imports:
    bounds: bee.values:bounds
- name: resource_roots
  kind: registry.entry
  meta:
    type: bee.resource_roots
    comment: Host-selected roots available to first-use harness setup; driver declarations select only resource names
  data:
    roots:
    - root_ref: bee.env:workspace_root
      access: write
    - root_ref: bee.placement.native.env:root
      access: write
