version: '1.0'
namespace: bee.hive.telemetry
entries:
- name: definition
  kind: ns.definition
  module: hive-telemetry
  readme: file://README.md
  meta:
    title: Bee hive telemetry
    comment: Optional cluster telemetry; host composition and policy selection remain in Bee
- name: dependency_application
  kind: ns.dependency
  component: bee/application
  version: '*'
- name: dependency_hive
  kind: ns.dependency
  component: bee/hive
  version: '*'
- name: target_exposure
  kind: ns.requirement
  meta:
    capability: hive.expose
    parameters:
      operations: [bee.hive.telemetry:presence, bee.hive.telemetry:stats, bee.hive.telemetry:catalog_list,
        bee.hive.telemetry:holdings, bee.hive.telemetry:cluster, bee.hive.telemetry:node_summary]
      mode: open
      audiences: ['*']
    reason: Expose the package open telemetry operations to Hive peers
    value_kind: security.policy
  targets:
  - entry: bee.hive.telemetry:presence
    path: .security.policies +=
- name: presence
  kind: function.lua
  source: file://presence.lua
  method: handle
  modules: [system]
  imports:
    types: bee.hive:types
    sampling: bee.hive.telemetry:sampling
    clock: bee:clock
  meta:
    hive: open
    hive_operation:
      revision: '1'
      title: Node presence
      input: {type: object, properties: {}, additionalProperties: false}
      output:
        type: object
        additionalProperties: false
        properties:
          protocol_revision: {type: string}
          node_id: {type: string}
          role: {type: string}
          cluster_size: {type: integer}
          sampled_at: {type: string}
  security:
    policies: [bee.security.hive:hive_telemetry_policy]
- name: sampling
  kind: library.lua
  source: file://sampling.lua
  imports:
    bounds: bee.protocol:bounds
- name: stats
  kind: function.lua
  source: file://stats.lua
  method: handle
  modules: [system]
  imports:
    sampling: bee.hive.telemetry:sampling
    clock: bee:clock
  meta:
    hive: open
    hive_operation:
      revision: '1'
      title: Runtime statistics
      input: {type: object, properties: {}, additionalProperties: false}
      output:
        type: object
        additionalProperties: false
        properties:
          memory:
            type: object
            additionalProperties: false
            properties:
              alloc: {type: integer}
              total_alloc: {type: integer}
              sys: {type: integer}
              heap_alloc: {type: integer}
              heap_objects: {type: integer}
              num_gc: {type: integer}
          goroutines: {type: integer}
          cpu_count: {type: integer}
          sampled_at: {type: string}
  security:
    policies: [bee.security.hive:hive_telemetry_policy]
- name: catalog_list
  kind: function.lua
  source: file://catalog_list.lua
  method: handle
  imports:
    catalog: bee.hive:catalog
    bounds: bee.protocol:bounds
  meta:
    hive: open
    hive_operation:
      revision: '1'
      title: Public operation catalog
      input:
        type: object
        additionalProperties: false
        properties:
          after_operation_ref: {type: string}
      output:
        type: object
        additionalProperties: false
        properties:
          operations: {type: array}
          generation: {type: integer}
          has_more: {type: boolean}
          next_after_operation_ref: {type: string}
          unavailable: {type: string}
  security:
    policies: [bee.security.hive:hive_catalog_policy, bee.security.hive:hive_exposure_policy, bee.security.hive:hive_exposure_facade_policy]
- name: holdings
  kind: function.lua
  source: file://holdings.lua
  method: handle
  modules: [process, system]
  imports:
    bounds: bee.protocol:bounds
    leases: bee.app:host_leases
  meta:
    comment: Open Hive operation paging this node's live workspace holdings with each host phase and lease count
    hive: open
    hive_operation:
      revision: '1'
      title: Node workspace holdings
      input:
        type: object
        additionalProperties: false
        properties:
          after: {type: string, minLength: 1, maxLength: 160}
          limit: {type: integer, minimum: 1, maximum: 50}
      output:
        type: object
        additionalProperties: false
        required: [node_id, workspaces, has_more]
        properties:
          node_id: {type: string}
          has_more: {type: boolean}
          next_after: {type: string}
          workspaces:
            type: array
            maxItems: 50
            items:
              type: object
              additionalProperties: false
              required: [workspace_id, phase, lease_count]
              properties:
                workspace_id: {type: string}
                phase: {type: string}
                lease_count: {type: integer}
  security:
    policies: [bee.security.hive:hive_telemetry_policy, bee.hive.telemetry.security:holdings_policy]
- name: cluster
  kind: function.lua
  source: file://cluster.lua
  method: handle
  modules: [system]
  imports:
    bounds: bee.protocol:bounds
    contract: bee.protocol:application
    types: bee.hive:types
    client: bee.hive:client
  meta:
    comment: Open Hive operation aggregating workspace holdings and local peer link state
    hive: open
    hive_operation:
      revision: '1'
      title: Cluster workspace holdings
      input:
        type: object
        additionalProperties: false
        properties:
          nodes: {type: array, minItems: 1, maxItems: 8, items: {type: string}}
          limit: {type: integer, minimum: 1, maximum: 50}
      output:
        type: object
        additionalProperties: false
        required: [nodes]
        properties:
          nodes:
            type: array
            maxItems: 8
            items:
              type: object
              additionalProperties: false
              required: [node_id, status, connected]
              properties:
                node_id: {type: string}
                status: {type: string}
                connected: {type: boolean}
                direction: {type: string, enum: [outbound, inbound]}
                remote_address: {type: string}
                workspace_count: {type: integer}
                has_more: {type: boolean}
  security:
    policies: [bee.hive.telemetry.security:cluster_policy, bee.security.hive:hive_telemetry_policy]
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: dependency_approvals
  kind: ns.dependency
  component: bee/approvals
  version: '*'
- name: dependency_node
  kind: ns.dependency
  component: bee/node
  version: '*'
- name: target_peers
  kind: ns.requirement
  default: bee.hive.telemetry:empty_peers
  targets:
  - entry: bee.hive.telemetry:peer_source
    path: .resource_ref
  - entry: bee.hive.telemetry.security:peer_source_policy
    path: .policy.resources
- name: peer_source
  kind: registry.entry
- name: empty_peers
  kind: registry.entry
  peers: []
- name: status_contract
  kind: contract.definition
  methods:
  - name: snapshot
    description: Read bounded live Hive node names, connectivity and owner-reported running session and pending approval counts
  - name: detail
    description: Read one enrolled Hive node by node_id with the same counts-only status fields
- name: status
  kind: library.lua
  source: file://status.lua
  imports:
    bounds: bee.protocol:bounds
    types: bee.hive:types
- name: node_summary
  kind: function.lua
  source: file://node_summary.lua
  method: handle
  modules: [funcs, system]
  imports:
    bounds: bee.protocol:bounds
    status: bee.hive.telemetry:status
  security:
    policies: [bee.security.hive:hive_telemetry_policy, bee.hive.telemetry.security:summary_owner_policy, bee.hive.telemetry.security:summary_node_name_policy]
  meta:
    hive: open
    hive_operation:
      revision: '1'
      title: Node activity summary
      input: {type: object, properties: {}, additionalProperties: false}
      output:
        type: object
        additionalProperties: false
        required: [node_id, name, running_sessions, pending_approvals]
        properties:
          node_id: {type: string}
          name: {type: string}
          running_sessions: {type: integer, minimum: 0}
          pending_approvals: {type: integer, minimum: 0}

- name: dependency_gov
  kind: ns.dependency
  component: bee/gov
  version: '*'
