name: Bee Hub publication
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published application release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bee-hub-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    environment: hub
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag }}
        fetch-depth: 0
        persist-credentials: false
    - name: Validate published release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        number='(0|[1-9][0-9]*)'
        identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
        pattern="^v$number\.$number\.$number(-$identifier(\.$identifier)*)?$"
        [[ "$RELEASE_TAG" =~ $pattern ]]
        git merge-base --is-ancestor HEAD origin/main
        test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
        release_commit=$(git rev-parse HEAD)
        test "$(gh run list --workflow native.yml --branch "$RELEASE_TAG" --event push --commit "$release_commit" --status success --limit 1 --json databaseId --jq length)" = 1
    - name: Require Hub credentials
      env:
        WIPPY_TOKEN: ${{ secrets.WIPPY_HUB_TOKEN }}
      run: |
        if [ -z "$WIPPY_TOKEN" ]; then
          echo 'Configure WIPPY_HUB_TOKEN with create and publish access to the bee organization.' >&2
          exit 1
        fi
    - name: Build pinned publication runtime
      uses: wippyai/builder@114eb0252a121dd89eca084af5db01833ffff50b
      with:
        mode: toolchain
        manifest: wippy.build.json
        output: .wippy/bin/bee-wippy
    # The release's deployment archive holds the sealed packs every release
    # executable embeds; provenance proves it before any upload.
    - name: Restore the release deployment
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p release dist/portable-deployment
        gh release download "$RELEASE_TAG" --dir release \
          --pattern bee-deployment.tar.gz --pattern bee-deployment.tar.gz.sha256 \
          --pattern bee-linux-amd64.tar.gz --pattern bee-linux-amd64.tar.gz.sha256
        (cd release && sha256sum -c bee-deployment.tar.gz.sha256 bee-linux-amd64.tar.gz.sha256)
        tar -xzf release/bee-deployment.tar.gz -C dist/portable-deployment
        tar -xzf release/bee-linux-amd64.tar.gz -C release bee.provenance.json
        python3 - release/bee.provenance.json dist/portable-deployment/wippy.lock <<'PY'
        import json, re, sys
        embedded = {pack["module"]: (pack["version"], "sha256:" + pack["sha256"])
                    for pack in json.load(open(sys.argv[1]))["manifest"]["application"]["packs"]}
        locked = dict((name, (version, digest)) for name, version, digest in re.findall(
            r"- name: (\S+)\n\s+version: (\S+)\n\s+hash: (\S+)", open(sys.argv[2]).read()))
        if embedded != locked:
            sys.exit(f"release deployment differs from the executable's embedded packs: {embedded} != {locked}")
        PY
    - name: Validate and publish every Bee module at the release version
      env:
        WIPPY_TOKEN: ${{ secrets.WIPPY_HUB_TOKEN }}
        HUB_VISIBILITY: ${{ vars.BEE_HUB_VISIBILITY || 'public' }}
      run: make hub-publish BEE_VERSION="${RELEASE_TAG#v}"
