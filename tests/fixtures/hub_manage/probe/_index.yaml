version: '1.0'
namespace: bee.hub_manage_probe
entries:
- name: policy
  kind: security.policy
  policy:
    actions: [funcs.call]
    resources: [bee.hub.binding:call]
    effect: allow
- name: management_policy
  kind: security.policy
  policy:
    actions: [bee.hub.manage]
    resources: [wippy/test]
    effect: allow
- name: reader_policy
  kind: security.policy
  policy:
    actions: [bee.hub.read, registry.get]
    resources: '*'
    effect: allow
- name: component_reader_policy
  kind: security.policy
  policy:
    actions: [bee.hub.read]
    resources: [wippy/test]
    effect: allow
- name: main
  kind: process.lua
  source: file://main.lua
  method: main
  modules: [funcs, registry, security, logger]
  imports:
    bounds: bee.threads.records:bounds
  security:
    policies: [bee.hub_manage_probe:policy, bee.hub_manage_probe:management_policy, bee.hub_manage_probe:reader_policy]
  meta:
    command:
      name: hub-manage-probe
      security: {actor: {id: bee.hub_manage_probe}}
- name: narrow
  kind: process.lua
  source: file://main.lua
  method: narrow
  modules: [funcs, registry, security, logger]
  imports:
    bounds: bee.threads.records:bounds
  security:
    policies: [bee.hub_manage_probe:policy, bee.hub_manage_probe:component_reader_policy]
  meta:
    command:
      name: hub-manage-narrow
      security: {actor: {id: bee.hub_manage_probe.narrow}}
- name: reader
  kind: process.lua
  source: file://main.lua
  method: reader
  modules: [funcs, registry, security, logger]
  imports:
    bounds: bee.threads.records:bounds
  security:
    policies: [bee.hub_manage_probe:policy, bee.hub_manage_probe:reader_policy]
  meta:
    command:
      name: hub-manage-reader
      security: {actor: {id: bee.hub_manage_probe.reader}}
- name: wrong_host
  kind: process.lua
  source: file://main.lua
  method: wrong_host
  modules: [funcs, registry, security, logger]
  imports:
    bounds: bee.threads.records:bounds
  security:
    policies: [bee.hub_manage_probe:policy, bee.hub_manage_probe:management_policy, bee.hub_manage_probe:reader_policy]
  meta:
    command:
      name: hub-manage-wrong-host
      security: {actor: {id: bee.hub_manage_probe}}
- name: restart
  kind: process.lua
  source: file://main.lua
  method: restart
  modules: [funcs, registry, security, logger]
  imports:
    bounds: bee.threads.records:bounds
  security:
    policies: [bee.hub_manage_probe:policy, bee.hub_manage_probe:management_policy, bee.hub_manage_probe:reader_policy]
  meta:
    command:
      name: hub-manage-restart
      security: {actor: {id: bee.hub_manage_probe}}
