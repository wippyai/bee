    value: bee.desktop:model
  - name: target_application_protocol
    value: bee.protocol:application
  - name: target_db
    value: bee.env:workspace_db
  - name: target_roots
    value: bee.resources.env:resource_roots
  - name: target_scope
    value: bee.security.storage:workspace_catalog_scope
  - name: target_facade_policy
