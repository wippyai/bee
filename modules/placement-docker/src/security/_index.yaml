version: '1.0'
namespace: bee.placement.docker.security
entries:
- name: docker_policy
  kind: security.policy
  meta:
    comment: Host-owned Docker placement calls and attempt-bound process mounts
  policy:
    actions:
    - exec.get
    - exec.mount
    - registry.get
    - funcs.call
    resources: '*'
    effect: allow
- name: docker_socket_policy
  kind: security.policy
  policy:
    actions:
    - http_client.request
    - http_client.private_ip
    - http_client.unix_socket
    resources:
    - http://docker/*
    - docker
    - /var/run/docker.sock
    effect: allow
- name: image_policy
  kind: security.policy
  meta:
    comment: Host-selected runtime resources in the Docker placement overlay only
  policy:
    actions:
    - registry.overlay.get
    - registry.overlay.apply
    - registry.overlay.create.exec.docker
    - registry.overlay.create.registry.entry
    - process.registry.register
    - process.registry.unregister
    resources:
    - bee.placement.docker:runtime
    - bee.placement.docker:runtime-*
    - bee.placement.docker/image
    effect: allow
- name: image_client_policy
  kind: security.policy.expr
  policy:
    expression: (action == "bee.placement.image" || action == "process.send" || action
      == "process.monitor" || action == "process.unmonitor" || (action == "process.registry.lookup"
      && resource == "bee.placement.docker/image"))
    actions:
    - bee.placement.image
    - process.send
    - process.monitor
    - process.unmonitor
    - process.registry.lookup
    resources: '*'
    effect: allow
- name: environment_owner_policy
  kind: security.policy.expr
  policy:
    actions:
    - registry.overlay.get
    - registry.overlay.apply
    - registry.overlay.update.registry.entry
    - registry.overlay.update.http.service
    - registry.overlay.delete.registry.entry
    - registry.overlay.delete.http.service
    - bee.approvals.request
    - bee.approvals.consume
    - bee.approvals.read
    - funcs.call
    - registry.get
    - registry.overlay.update.security.policy.expr
    - registry.overlay.delete.security.policy.expr
    - registry.overlay.shadow
    resources:
    - bee.placement.docker.env:environment
    - bee.gateway.api:gateway_endpoint
    - bee.gateway.api:gateway_listener
    - '*'
    effect: allow
    expression: (action in ["registry.get", "funcs.call", "bee.approvals.request",
      "bee.approvals.read", "bee.approvals.consume"]) || (action in ["registry.overlay.get",
      "registry.overlay.apply"] && resource == "bee.placement.docker.env:environment")
      || (action in ["registry.overlay.shadow", "registry.overlay.update.registry.entry",
      "registry.overlay.update.http.service", "registry.overlay.delete.registry.entry",
      "registry.overlay.delete.http.service", "registry.overlay.update.security.policy.expr",
      "registry.overlay.delete.security.policy.expr"] && resource in ["bee.gateway.api:gateway_endpoint",
      "bee.gateway.api:gateway_listener", "bee.gateway.security:readiness_policy"])
- name: environment_revoke_policy
  kind: security.policy
  policy:
    actions:
    - bee.placement.environment.revoke
    resources:
    - bee.placement.docker.profiles:coding
    effect: allow
- name: environment_listener_policy
  kind: security.policy
  policy:
    actions:
    - events.send
    - system.read
    resources:
    - supervisor
    effect: allow
