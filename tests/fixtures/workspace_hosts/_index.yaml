version: '1.0'
namespace: bee.workspace.hosts
entries:
- name: first_storage_policy
  kind: security.policy
  policy:
    actions: [db.get]
    resources: [bee.workspace.db:first]
    effect: allow
- name: second_storage_policy
  kind: security.policy
  policy:
    actions: [db.get]
    resources: [bee.workspace.db:second]
    effect: allow
- name: supervisor_spawn_policy
  kind: security.policy
  policy:
    actions: [process.spawn, process.spawn.monitored]
    resources: [bee.host:main]
    effect: allow
- name: supervisor
  kind: process.lua
  source: file://supervisor.lua
  method: main
  modules: [process, channel, security, time, logger]
  imports:
    contract: bee.protocol:application
    decode: bee.protocol:decode
    recovery: bee.workspace:recovery
  meta:
    command:
      name: workspace-hosts-supervisor
      short: Bounded acceptance supervisor for dual workspace hosts in one runtime
      security:
        actor: {id: workspace_hosts.supervisor}
        policies: [bee.security.desktop:host_policy, bee.workspace.hosts:supervisor_spawn_policy]
- name: delayed_supervisor
  kind: process.lua
  source: file://delayed_supervisor.lua
  method: main
  modules: [process, channel, security, time, logger]
  imports:
    contract: bee.protocol:application
    decode: bee.protocol:decode
    persistence: bee.workspace:persistence
  meta:
    command:
      name: workspace-hosts-delayed-supervisor
      short: Delayed broker host timeout regression
      security:
        actor: {id: workspace_hosts.delayed_supervisor}
        policies: [bee.security.desktop:host_policy, bee.workspace.hosts:supervisor_spawn_policy, bee.workspace.hosts:first_storage_policy, bee.security:application_open_facade_policy]
- name: node_storage_policy
  kind: security.policy
  policy:
    actions: [db.get]
    resources: [bee.workspace.db:node]
    effect: allow
- name: logical_probe_policy
  kind: security.policy
  meta:
    comment: The probe stands in for the node owner and for one application principal
  policy:
    actions: [funcs.security, security.actor.create, security.scope.create, security.policy.get]
    resources: '*'
    effect: allow
- name: attach_update_policy
  kind: security.policy
  policy:
    actions: [registry.get, registry.snapshot, registry.apply]
    resources: ['*']
    effect: allow
- name: resource_call_policy
  kind: security.policy
  policy:
    actions: [funcs.call]
    resources: [bee.resources.binding:associate, bee.resources.binding:grant]
    effect: allow
- name: logical_supervisor
  kind: process.lua
  source: file://logical_supervisor.lua
  method: main
  modules: [process, channel, security, funcs, time, uuid, json, logger]
  imports:
    store: bee.storage:store
    catalog: bee.storage:catalog
    decode: bee.protocol:decode
    recovery: bee.workspace:recovery
  meta:
    command:
      name: workspace-hosts-logical-supervisor
      short: Two logical workspaces served by two hosts against one node database
      security:
        actor: {id: workspace_hosts.logical_supervisor}
        policies: [bee.security.desktop:host_policy, bee.workspace.hosts:supervisor_spawn_policy, bee.workspace.hosts:node_storage_policy,
          bee.workspace.hosts:logical_probe_policy, bee.workspace.hosts:resource_call_policy]
- name: lazy_spawn_policy
  kind: security.policy
  policy:
    actions: [process.spawn, process.spawn.monitored]
    resources: [bee.host:main, bee.launch:host_manager]
    effect: allow
- name: lazy_supervisor
  kind: process.lua
  source: file://lazy_supervisor.lua
  method: main
  modules: [process, channel, security, time, uuid, json, logger]
  imports:
    store: bee.storage:store
    catalog: bee.storage:catalog
    decode: bee.protocol:decode
    recovery: bee.workspace:recovery
    leases: bee.application:host_leases
  meta:
    command:
      name: workspace-hosts-lazy-supervisor
      short: Workspace hosts started on the first lease, stopped when idle, restored and evicted at the cap
      security:
        actor: {id: workspace_hosts.lazy_supervisor}
        policies: [bee.security.desktop:host_policy, bee.workspace.hosts:lazy_spawn_policy, bee.security.storage:workspace_storage_policy,
          bee.security.desktop:workspace_host_lease_policy, bee.security.desktop:workspace_host_manager_policy]
- name: attach_spawn_policy
  kind: security.policy
  policy:
    actions: [process.spawn, process.spawn.monitored]
    resources: [bee.launch:retained, bee.launch:host_manager, bee.workspace.hosts:attach_recipient]
    effect: allow
- name: attach_supervisor
  kind: process.lua
  source: file://attach_supervisor.lua
  method: main
  modules: [process, channel, security, time, uuid, logger, registry]
  imports:
    store: bee.storage:store
    catalog: bee.storage:catalog
    leases: bee.application:host_leases
  meta:
    command:
      name: workspace-hosts-attach-supervisor
      short: A desktop supervisor selected by workspace identity leases its host through the node host manager
      security:
        actor: {id: workspace_hosts.attach_supervisor}
        policies: [bee.security.desktop:host_policy, bee.workspace.hosts:attach_spawn_policy, bee.security.storage:workspace_storage_policy,
          bee.security.desktop:workspace_host_lease_policy, bee.security.desktop:workspace_host_manager_policy, bee.workspace.hosts:logical_probe_policy,
          bee.workspace.hosts:attach_update_policy]
- name: attach_fallback
  kind: process.lua
  source: file://attach_supervisor.lua
  method: fallback
  modules: [process, channel, security, time, uuid, logger, registry]
  imports:
    store: bee.storage:store
    catalog: bee.storage:catalog
    leases: bee.application:host_leases
  meta:
    command:
      name: workspace-hosts-attach-fallback
      short: An incompatible leased host checkpoint reattaches its desktop
      security:
        actor: {id: workspace_hosts.attach_supervisor}
        policies: [bee.security.desktop:host_policy, bee.workspace.hosts:attach_spawn_policy, bee.security.storage:workspace_storage_policy,
          bee.security.desktop:workspace_host_lease_policy, bee.security.desktop:workspace_host_manager_policy, bee.workspace.hosts:logical_probe_policy,
          bee.workspace.hosts:attach_update_policy]
- name: attach_recipient
  kind: process.lua
  source: file://attach_recipient.lua
  method: main
  modules: [process, channel]
