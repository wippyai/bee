- name: dependency_application
  kind: ns.dependency
  component: bee/application
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: dependency_values
  kind: ns.dependency
  component: bee/values
  version: '*'
- name: client
  kind: library.lua
  source: file://client.lua
  modules: [process, uuid]
  imports:
    client: bee.app:client
    thread_protocol: bee.app.threads.types:protocol
