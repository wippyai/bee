# SPDX-License-Identifier: MIT
version: '1.0'
namespace: bee.research.delivery
entries:
- name: artifact_input
  kind: registry.entry
  meta:
    type: bee.research.delivery.artifact_input
  data:
    artifact_digest: ''
    raw_json: ''
- name: operator_policy
  kind: security.policy
  policy:
    actions:
    - funcs.call
    - funcs.security
    - security.actor.create
    - security.scope.create
    - security.policy.get
    - registry.get
    - registry.apply
    - registry.update.registry.entry
    - registry.preview
    - registry.overlay.get
    - registry.overlay.apply
    - registry.overlay.create.*
    - registry.overlay.update.*
    - registry.overlay.delete.*
    - db.get
    - system.read
    - bee.gov.overlay.read
    - bee.gov.overlay.write
    - bee.gov.delivery.read
    - bee.gov.delivery.manage
    - bee.gov.delivery.activate
    - bee.gov.delivery.publish
    - bee.approvals.decide
    resources: '*'
    effect: allow
- name: main
  kind: process.lua
  source: file://main.lua
  method: main
  modules: &modules [funcs, registry, system, json, io, uuid, time]
  imports: &imports
    bounds: bee.threads.records:bounds
    artifact: bee.gov:artifact
    materializer: bee.gov:materializer
    recovery: bee.gov.binding:destination_service
  security:
    policies: [bee.research.delivery:operator_policy]
  meta:
    command:
      name: research-delivery-probe
      security:
        actor: {id: bee.research.delivery.operator}
        policies: [bee.research.delivery:operator_policy]
- name: recover
  kind: process.lua
  source: file://main.lua
  method: recover
  modules: *modules
  imports: *imports
  security: {policies: [bee.research.delivery:operator_policy]}
  meta:
    command:
      name: research-recovery-probe
      security:
        actor: {id: bee.research.delivery.operator}
        policies: [bee.research.delivery:operator_policy]
