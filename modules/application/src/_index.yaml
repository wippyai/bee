version: '1.0'
namespace: bee.app
entries:
- name: definition
  kind: ns.definition
  module: application
  readme: file://README.md
  meta:
    title: Bee application SDK
    comment: Public application-side values and owner reply decoding; helpers grant
      no application, workspace, or thread authority
- name: client
  kind: library.lua
  source: file://client.lua
  modules:
  - process
  - uuid
  imports:
    arguments: bee.app:arguments
    interaction: bee.app:interaction
    bounds: bee.values:bounds
- name: arguments
  kind: library.lua
  source: file://arguments.lua
- name: caller
  kind: library.lua
  source: file://caller.lua
  imports:
    reply: bee.values:reply
- name: interaction
  kind: library.lua
  source: file://interaction.lua
  imports:
    bounds: bee.values:bounds
- name: names
  kind: library.lua
  source: file://names.lua
- name: dependency_values
  kind: ns.dependency
  component: bee/values
  version: '*'
- name: dependency_ui
  kind: ns.dependency
  component: bee/ui
  version: '*'
