version: '1.0'
namespace: bee.placement.native.env
entries:
- name: root_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked placement root; target_root fills resource_ref
  resource_ref: bee.placement.native.env:root
- name: runner_host_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked runner host; process_host fills host_ref
  host_ref: bee:workers
- name: executor_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked native executor; target_executor fills resource_ref
  resource_ref: bee.placement.native.env:placement_executor
- name: host_files_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked read-only host filesystem; target_host_files fills resource_ref
  resource_ref: bee.placement.native.env:placement_host_files
- name: admitted_roots_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked host placement-roots policy; target_admitted_roots fills resource_ref
  resource_ref: bee.placement.native.env:placement_admitted_roots
- name: resource_mode_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked host resource-mode policy; target_resource_mode fills resource_ref
  resource_ref: bee.placement.native.env:placement_resource_mode
- name: workdir_preparers_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked host workdir-preparers list; target_workdir_preparers fills resource_ref
  resource_ref: bee.placement.native.env:workdir_preparers
- name: resources
  kind: library.lua
  source: file://resources.lua
  modules:
  - registry
  imports:
    bounds: bee.values:bounds
    resource_authority: bee.resources.env:resources
- name: configuration
  kind: library.lua
  source: file://configuration.lua
  modules:
  - json
  - toml
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    types: bee.placement:types
- name: environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: root_path
  kind: env.variable
  storage: bee.placement.native.env:environment
  variable: BEE_PLACEMENT_ROOT
  default: .wippy/placement
  readonly: true
- name: root
  kind: fs.directory
  meta:
    comment: Module-owned attempt-home default resolving against the project; the host replaces it through target_root
  directory: ${env:bee.placement.native.env:root_path}
  base: project
  auto_init: true
  mode: '0700'
- name: placement_admitted_roots
  kind: registry.entry
  meta:
    type: bee.placement_roots
    comment: fs.directory entries a launch may name as resource roots on this host with the widest access allowed; host policy, not a delegated grant. The workspace folder and its children are admitted
      so an agent can target a folder it chose, such as a git worktree, without a host step
  data:
    roots:
    - root_ref: bee.env:workspace_root
      access: write
- name: placement_executor
  kind: exec.native
  meta:
    comment: Children start with a clean environment; PATH comes from the host, everything else from the admitted request
  default_env:
    PATH: ${env:bee.placement.native.env:placement_path}
- name: placement_host_files
  kind: fs.directory
  meta:
    comment: The host filesystem as one volume for executable measurement; this entry requests readonly access
  directory: /
  auto_init: false
  readonly: true
- name: placement_path
  kind: env.variable
  meta:
    comment: Host-selected executable search path for native placement children
  storage: bee.placement.native.env:environment
  variable: PATH
  default: /usr/local/bin:/usr/bin:/bin
  readonly: true
- name: placement_resource_mode
  kind: registry.entry
  meta:
    type: bee.placement_resource_mode
    comment: host_configured or granted; selected by the host, never by a request
  data:
    mode: granted
- name: placement_workdir_preparers
  kind: registry.entry
  meta:
    type: bee.placement_workdir_preparers
    comment: Contract bindings authorized by host policy to run workdir setup and cleanup
  data:
    preparers: []
- name: workdir_preparers
  kind: registry.entry
  meta:
    type: bee.placement_workdir_preparers
    comment: The host's workdir preparers; the git worktree preparer sets up dedicated worktrees
  data:
    preparers: [bee.git.worktree.binding:binding]
