version: '1.0'
namespace: bee.tests.sessions
entries:
- name: owner_boundary_test
  kind: function.lua
  source: file://owner_boundary_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [funcs]
  imports:
    test: wippy.test:test
    bounds: bee.values:bounds
  security:
    policies: [bee.tests.sessions:probe_policy]
- name: interactive_test
  kind: function.lua
  source: file://interactive_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [funcs, security, sql, uuid, registry, process, channel, time, json]
  imports:
    test: wippy.test:test
    harness: bee.tests.threads:harness
    bounds: bee.values:bounds
    admission: bee.harness.launch:admission
- name: locate_test
  kind: function.lua
  source: file://locate_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    bounds: bee.values:bounds
    test: wippy.test:test
    locate: bee.threads.sessions.binding:locate
- name: catalog_service_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call, registry.get, registry.snapshot, registry.apply]
    resources: '*'
    effect: allow
- name: catalog_service_test
  kind: function.lua
  source: file://catalog_service_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: '120s'}
  modules: [funcs, registry]
  security:
    policies: [bee.tests.sessions:catalog_service_test_policy, bee.harness.security:launch_locate_probe_policy, bee.harness.profiles:test_read, bee.harness.profiles:test_write]
  imports:
    principals: bee.tests.principals:bound
    bounds: bee.values:bounds
    test: wippy.test:test
    catalog: bee.threads.sessions.binding:catalog_service
    admission: bee.harness.launch:admission
    machine: bee.harness.carrier:machine
    materialization: bee.placement.native.service:materialization
- name: fake_owner
  kind: contract.binding
  meta: {type: test_support}
  contracts:
  - contract: bee.threads.sessions:contract
    default: true
    methods:
      open: bee.tests.sessions:fake_open
      run: bee.tests.sessions:fake_run
      send: bee.tests.sessions:fake_send
      await: bee.tests.sessions:fake_await
      join: bee.tests.sessions:fake_join
      get: bee.tests.sessions:fake_get
      cancel: bee.tests.sessions:fake_cancel
      close: bee.tests.sessions:fake_close
      list: bee.tests.sessions:fake_list
      history: bee.tests.sessions:fake_history
- name: fake_catalog_owner
  kind: contract.binding
  meta: {type: test_support}
  contracts:
  - contract: bee.threads.sessions:catalog
    default: true
    methods:
      list: bee.tests.sessions:fake_catalog
- name: fake_open
  kind: function.lua
  source: file://fake_owner.lua
  method: open
  meta: {type: test_support}
  modules: [security]
  imports: {protocol: bee.threads.sessions.types:protocol, sessions: bee.threads.sessions.client:sessions, principals: bee.tests.principals:bound, bounds: bee.values:bounds}

- name: fake_run
  kind: function.lua
  source: file://fake_owner.lua
  method: run
