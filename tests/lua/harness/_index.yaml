  source: file://catalog_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry]
  security:
    policies: [bee.harness.catalog:apply_test_policy]
  imports:
    test: wippy.test:test
    catalog: bee.harness.catalog:catalog
    classify: bee.harness.catalog:classify
- name: carrier_pure_test
