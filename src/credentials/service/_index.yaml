version: '1.0'
namespace: bee.credentials.service
entries:
- name: worker
  kind: process.lua
  source: file://worker.lua
  method: main
  modules: [funcs, logger]
  imports:
    worker: bee.process:worker
  meta:
    type: bee.approvals.effect-consumer
    destination: credentials.configuration
    operation_ref: bee.credentials.binding:configuration_setup
    worker_name: bee.approvals.configuration_effect_worker
- name: configuration_service
  kind: process.service
  process: bee.credentials.service:worker
  host: bee:workers
  lifecycle:
    auto_start: true
    requires: [wippy.bootloader:bootloader.service]
    security:
      actor: {id: bee.credentials.configuration_worker}
      policies: [bee.credentials.security:configuration_worker_policy]
