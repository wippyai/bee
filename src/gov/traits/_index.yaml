version: '1.0'
namespace: bee.gov.traits
entries:
- name: guide
  kind: library.lua
  source: file://guide.lua
  modules:
  - json
  imports:
    preflight: bee.gov.binding:preflight
    workspace_applications: bee.gov.types:workspace_applications
    drivers: bee.gov.types:drivers
    hive_sdk_example: bee.gov.traits:hive_sdk_example
- name: authoring_trait
  kind: registry.entry
  meta:
    type: agent.trait
    title: Overlay authoring
    comment: Caller-owned durable staging only; no registry writer or approval capability
  prompt: 'Read the guide operation first for this destination''s component contract and one minimal working application example; it names the exact file to freeze. Use BeeComponents to inspect installed
    components and exact Hub package entries, documentation and examples before inventing a pattern. Use BeeOverlay to author packs and changes as files. `overlay_id` names the authored overlay and is distinct
    from the agent''s runtime workspace. Create with revision zero; list before editing to obtain the current revision. Put replaces one whole file; append adds a bounded chunk at offset equal to its current
    byte length and verifies result_digest, the SHA-256 of the complete result; remove deletes one file. MCP put/append content is at most 65,536 decoded bytes per call, while a file may reach 4 MiB. Writes
    need expected_revision and a stable idempotency_key. Retry an uncertain write with the identical request and key; a changed request needs a new key. On conflict, reread and reconcile first. Use content
    for source text or content_base64 for binary assets. Read returns base64 content and a digest. Staged file paths are relative to the virtual overlay. The source operation separately reads a bounded
    non-private CLI/source file in your authenticated workdir, with no overlay_id; see the drivers guide section. Freeze with expected_revision and a retry key to retain an exact candidate. Freeze is not
    approval, installation or execution. For a component candidate, write entries.json as a JSON list of complete registry entries before freezing. Governance canonicalizes it during the separately authorized
    preparation step; do not construct registry.json. Pass snapshot_digest to list/read to inspect that retained candidate instead of current files; the returned revision is the frozen revision. Host policy
    admits each overlay operation; this trait grants no authority.

    '
  tools:
  - bee.gov.traits:overlay_call
- name: application_delivery_trait
  kind: registry.entry
  meta:
    type: agent.trait
    title: Application delivery
    comment: Request delivery and activation of a frozen application and read its status; the person's one approval applies it, and publishing the applied version is separately gated
  prompt: 'Use the delivery tool to request delivery of an application or custom driver you froze (read the drivers guide for driver.<name> overlays): pass operation request with your source `source_overlay_id`,
    the version and the frozen `snapshot_digest`; `workspace_id` defaults to your own workspace, the only destination you may name. Name the overlay and its entries by the guide''s workspace-application
    rule (overlay `todo` holds namespace `app.todo` and the application `app.todo:app`) so this workspace''s host profile admits it. It publishes your frozen artifact as immutable content, stages that exact
    version at this destination and returns the destination''s own preflight verdict, with a diagnostic code, target, message and remedy for each finding. Repair a refusal and freeze again. When the verdict
    is ready the same request prepares the activation and returns its intent_id and approval_id: Needs you opens on the person''s desktop with that one approval, and approving it applies the overlay;
    nothing else is asked of the person. activation_refusal states why a ready plan was not prepared. Read the status operation with the same identities and the intent_id to see the activation outcome.
    You cannot approve, and you never write an overlay. Publishing the exact applied version is a separate, host-requested capability; ask for it, and publish only after the apply succeeds.

    '
  tools:
  - bee.gov.traits:delivery_call
- name: application_tests_trait
  kind: registry.entry
  meta:
    type: agent.trait
    title: Application tests
    comment: Run and read the tests an application you delivered carries, inside the node and as the application; the tests run with the authority the person approved for it and no more
  prompt: 'Ship tests with the application: a function.lua entry of meta.type test in its pack (the overlay guide''s tests section shows one). After the person approved the delivery, use the tests tool: list
    names the application''s tests, run starts a run and returns its run_id at once, and status with that run_id returns progress and, when complete, each test''s cases with pass, fail or skip, the error and
    the duration. Name the application by its overlay id or its definition id; it must be delivered from an overlay you own. A test runs as the application with the scope its approval gave it, so a case
    that needs authority the application lacks fails with a denial: change the application and deliver again, you cannot widen it here.

    '
  tools:
  - bee.gov.traits:tests_call
- name: application_publish_trait
  kind: registry.entry
  meta:
    type: agent.trait
    title: Application publish
    comment: Publish the exact locally reviewed and applied version; never review, approve or apply
  prompt: 'Use BeePublish only after the person approved and Bee applied the exact version you delivered. It publishes that one version to this destination''s
    publication feed and refuses any version that is not the locally reviewed and applied one. It grants no review, selection, approval, activation or overlay authority.

    '
  tools:
  - bee.gov.traits:publish_call
- name: hive_sdk_example
  kind: library.lua
  source: file://hive_sdk_example.lua
  modules: [json]
- name: overlay_call
  kind: function.lua
  source: file://overlay_call.lua
  method: handle
  modules:
  - funcs
  meta:
    type: tool
    title: Overlay authoring
    llm_alias: BeeOverlay
    llm_description: Read this destination's component authoring guide, or create, list, read, put, append, remove or freeze files in your host-admitted private overlay.
      Put replaces a file; append adds bytes at an exact offset and verifies the complete result_digest. Read returns a base64 window of at most 16,384 bytes; use
      offset and limit to page. Writes require the current revision and a stable retry key. Freeze stages measured content only; it neither requests approval nor
      activates it. Use BeeComponents to inspect installed and Hub components for examples. Binary files use canonical base64. There is no host filesystem write or
      registry access. Source reads a bounded non-private file relative to the authenticated workspace folder; it names no overlay.
    input_schema: '{"type":"object","additionalProperties":false,"required":["operation"],"properties":{"operation":{"type":"string","enum":["guide","source","create","list","read","put","append","remove","freeze"]},"overlay_id":{"type":"string","minLength":1,"maxLength":160},"expected_revision":{"type":"integer","minimum":0,"maximum":9007199254740990},"idempotency_key":{"type":"string","minLength":1,"maxLength":160},"path":{"type":"string","minLength":1,"maxLength":240},"offset":{"type":"integer","minimum":0,"maximum":4194304},"limit":{"type":"integer","minimum":1,"maximum":16384},"result_digest":{"type":"string","pattern":"^[0-9a-f]{64}$"},"content":{"type":"string","maxLength":4194304},"content_base64":{"type":"string","maxLength":5592408},"snapshot_digest":{"type":"string","pattern":"^[0-9a-f]{64}$"},"section":{"type":"string","pattern":"^[a-z0-9_-]+$","maxLength":64},"include_example":{"type":"boolean"}}}'
    output_schema: '{"type":"object","required":["ok"],"properties":{"ok":{"type":"boolean"},"value":{},"code":{"type":"string"},"message":{"type":"string"},"replayed":{"type":"boolean"}},"if":{"properties":{"ok":{"const":false}}},"then":{"required":["code","message"]}}'
    mcp:
      required_scopes:
      - bee.security.gateway:gateway_tool_overlay_policy
- name: delivery_call
  kind: function.lua
  source: file://delivery_call.lua
  method: handle
  modules:
  - funcs
  meta:
    type: tool
    title: Application delivery
    llm_alias: BeeDelivery
    llm_description: Request delivery and inspect its status under the caller workspace.
    input_schema: '{"type":"object","required":["operation","source_overlay_id","version"],"properties":{"operation":{"type":"string","enum":["request","status","preflight"]},"workspace_id":{"type":"string"},"source_overlay_id":{"type":"string"},"version":{"type":"string"},"snapshot_digest":{"type":"string"},"intent_id":{"type":"string"}}}'
    output_schema: '{"type":"object","required":["ok"],"properties":{"ok":{"type":"boolean"},"value":{},"code":{"type":"string"},"message":{"type":"string"},"replayed":{"type":"boolean"}},"if":{"properties":{"ok":{"const":false}}},"then":{"required":["code","message"]}}'
    mcp:
      required_scopes:
      - bee.security.gateway:gateway_tool_delivery_policy
- name: tests_call
  kind: function.lua
  source: file://tests_call.lua
  method: handle
  modules:
  - funcs
  meta:
    type: tool
    title: Application tests
    llm_alias: BeeTests
    llm_description: List, run and read the caller application tests.
    input_schema: '{"type":"object","required":["operation"],"properties":{"operation":{"type":"string"},"application":{"type":"string"},"run_id":{"type":"string"}}}'
    output_schema: '{"type":"object","required":["ok"],"properties":{"ok":{"type":"boolean"},"value":{},"error":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string"},"message":{"type":"string"}}}},"if":{"properties":{"ok":{"const":false}}},"then":{"required":["error"]}}'
    mcp:
      required_scopes:
      - bee.security.gateway:gateway_tool_tests_policy
- name: publish_call
  kind: function.lua
  source: file://publish_call.lua
  method: handle
  modules:
  - funcs
  meta:
    type: tool
    title: Application publication
    llm_alias: BeePublish
    llm_description: Publish the exact locally approved and applied application version.
    input_schema: '{"type":"object","required":["operation","source_overlay_id","version"],"properties":{"operation":{"type":"string","enum":["publish"]},"workspace_id":{"type":"string"},"source_overlay_id":{"type":"string"},"version":{"type":"string"},"snapshot_digest":{"type":"string"},"intent_id":{"type":"string"}}}'
    output_schema: '{"type":"object","required":["ok"],"properties":{"ok":{"type":"boolean"},"value":{},"code":{"type":"string"},"message":{"type":"string"},"replayed":{"type":"boolean"}},"if":{"properties":{"ok":{"const":false}}},"then":{"required":["code","message"]}}'
    mcp:
      required_scopes:
      - bee.security.gateway:gateway_tool_publish_policy
