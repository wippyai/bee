version: '1.0'
namespace: bee.driver.agy.profiles
entries:
- name: default_window
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned Antigravity window declaration; the host separately selects its policy, activation, executable and permissions
  data:
    schema_revision: bee.launch-definition@1
    launch_id: agy-window
    title: Antigravity CLI
    binding_ref: bee.drivers.agy.binding:binding
    profile_id: window
    private_credentials:
    - agy_login
    - agy_api_key
    docker_credentials:
    - agy_login
    - agy_api_key
    policy_ref: bee.driver.agy.security:launch_policy_agy_window
    default_mode: window
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: new
    session_resource: session
    credentials:
    - agy_api_key
    presentation:
      start_menu: true
      fullscreen: true
      reuse: never
- name: research_batch
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned Agy batch route for a host-selected coordinator and caller-owned shared thread
  data:
    schema_revision: bee.launch-definition@1
    launch_id: agy-research-batch
    title: Gemini researcher
    binding_ref: bee.drivers.agy.binding:binding
    profile_id: batch
    policy_ref: bee.driver.agy.security:launch_policy_agy_batch
    default_mode: batch
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: caller
    session_resource: session
    credentials:
    - agy_login
    - agy_api_key
    presentation:
      start_menu: false
      fullscreen: false
      reuse: never
