version: '1.0'
namespace: bee.sync
entries:
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: definition
  kind: ns.definition
  module: sync
  readme: file://README.md
  meta:
    title: Bee synchronized projections
    comment: Owner-local bounded ledger and projection reads; a host selects feed export, worker, and transport wiring
- name: dependency_values
  kind: ns.dependency
  component: bee/values
  version: '*'
- name: dependency_hive
  kind: ns.dependency
  component: bee/hive
  version: '*'
- name: dependency_persist
  kind: ns.dependency
  component: bee/persist
  version: '*'
- name: target_db
  kind: ns.requirement
  default: bee.sync:db
  meta:
    comment: SQLite resource selected by the host for this owner-local sync store
  targets:
  - entry: bee.sync:database_ref
    path: .resource_ref
- name: target_exports
  kind: ns.requirement
  meta:
    comment: Host-selected immutable Sync feeds; absent selection leaves distribution unwired
  targets:
  - entry: bee.sync:exports_ref
    path: .resource_ref
- name: target_sender
  kind: ns.requirement
  meta:
    comment: Host-selected immutable replica sender; the independent Sync component has no transport default
  targets:
  - entry: bee.sync.service:distributor
    path: .imports.sender
- name: database_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: Linked SQL resource; empty until a host selects target_db
- name: environment
  kind: env.storage.os
  lifecycle: {auto_start: true}
- name: db_path
  kind: env.variable
  storage: bee.sync:environment
  variable: BEE_SYNC_DB
  default: .wippy/sync.db
  readonly: true
- name: db
  kind: db.sql.sqlite
  file: ${env:bee.sync:db_path}
  lifecycle: {auto_start: true}
- name: bounds
  kind: library.lua
  source: file://bounds.lua
  imports:
    values: bee.values:bounds
- name: canonical
  kind: library.lua
  source: file://canonical.lua
  imports:
    bounds: bee.sync:bounds
    encoder: bee.values:canonical
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  imports:
    bounds: bee.sync:bounds
    values: bee.values:bounds
- name: version
  kind: library.lua
  source: file://version.lua
  modules: [hash]
  imports:
    bounds: bee.values:bounds
    canonical: bee.sync:canonical
- name: replica_protocol
  kind: library.lua
  source: file://replica_protocol.lua
  imports:
    bounds: bee.values:bounds
    version: bee.sync:version
- name: types
  kind: library.lua
  source: file://types.lua
  imports:
    transaction: bee.persist:transaction
    version: bee.sync:version
- name: exports_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: Linked host export configuration; target_exports fills resource_ref
- name: resources
  kind: library.lua
  source: file://resources.lua
  modules: [registry]
- name: target_admit_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.sync.binding:admit
    path: .security.policies
