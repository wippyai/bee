version: '1.0'
namespace: bee.sync.service
entries:
- name: sender
  kind: library.lua
  source: file://sender.lua
  modules: [hash, base64]
  imports:
    hive: bee.hive:protocol
    version: bee.sync.values:version
    transaction: bee.persist:transaction
    bounds: bee.values:bounds
- name: distributor
  kind: library.lua
  source: file://distributor.lua
  modules: [registry]
  imports:
    bounds: bee.values:bounds
    version: bee.sync.values:version
    sync: bee.sync.persist:store
    replicas: bee.sync.persist:replicas
    cursors: bee.sync.persist:distribution_store
    sender: bee.sync.service:sender
    transaction: bee.persist:transaction
- name: sync
  kind: process.lua
  source: file://service.lua
  method: main
  modules: [process, channel, system, env, funcs, security, logger, events, cdc]
  imports:
    protocol: bee.hive:protocol
    distributor: bee.sync.service:distributor
    replica_protocol: bee.sync:replica_protocol
- name: service
  meta:
    title: Sync
  kind: process.service
  process: bee.sync.service:sync
  host: bee:workers
  lifecycle:
    auto_start: true
    requires: [wippy.bootloader:bootloader.service, bee:changes]
    security:
      actor: {id: bee.sync}
      policies: [bee.sync.security:store, bee.sync.security:distribution_changes, bee.sync.security:distribution_events,
        bee.sync.security:distribution_routing, bee.sync.security:receiver_names, bee.sync.security:receiver_admission,
        bee.sync.security:node, bee.hive.security:messaging]
    restart:
      max_attempts: 10
