  imports:
    bounds: bee.values:bounds
    database: bee.persist:database
    transaction: bee.persist:transaction
    version: bee.sync.values:version
- name: distribution_store
  kind: library.lua
  source: file://distribution_store.lua
  modules: [sql]
  imports:
    bounds: bee.values:bounds
    database: bee.persist:database
    transaction: bee.persist:transaction
