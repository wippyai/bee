version: '1.0'
namespace: bee.hive.service.bootstrap
entries:
- name: probe_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [process.send, process.monitor, process.unmonitor]
    resources: '*'
    effect: allow
- name: probe_inspect_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [system.read]
    resources: [node]
    effect: allow
- name: probe
  kind: process.lua
  source: file://probe.lua
  method: main
  modules: [process, time, io, system]
  imports:
    types: bee.hive:types
    client: bee.hive:client
  meta:
    type: test_support
    command:
      name: hive-service-probe
      security:
        actor: {id: bee.hive.probe}
        policies: [bee.hive.service.bootstrap:probe_policy, bee.hive.service.bootstrap:probe_inspect_policy]
