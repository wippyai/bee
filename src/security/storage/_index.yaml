version: '1.0'
namespace: bee.security.storage
entries:
- name: workspace_storage_policy
  kind: security.policy.expr
  policy:
    expression: (action == "db.get" && resource == "bee.env:workspace_db") || (action
      == "registry.get" && resource == "bee.workspace.persist:store") || (action in
      ["env.get", "env.set"] && resource == "bee.persist:startup_progress")
    actions:
    - env.get
    - env.set
    - db.get
    - registry.get
    resources:
    - bee.persist:startup_progress
    - bee.env:workspace_db
    - bee.workspace.persist:store
    effect: allow
- name: workspace_storage_boundary
  kind: security.policy
  meta:
    comment: Core workspace and client stores remain denied to every application
  policy:
    actions:
    - db.get
    resources:
    - bee.env:workspace_db
    - bee.env:client_db
    - bee.client.db:*
    - bee.workspace.db:*
    effect: deny
- name: client_storage_policy
  kind: security.policy.expr
  policy:
    expression: (resource != "bee.persist:startup_progress" && action != "env.set"
      && action != "env.get") || (action in ["env.get", "env.set"] && resource ==
      "bee.persist:startup_progress")
    actions:
    - env.get
    - env.set
    - db.get
    resources:
    - bee.persist:startup_progress
    - bee.env:client_db
    effect: allow
- name: workspace_catalog_read_policy
  kind: security.policy
  meta:
    comment: Read the node workspace catalog, list it and search it
  policy:
    actions:
    - bee.workspace.manager.read
    resources: '*'
    effect: allow
- name: workspace_catalog_manage_policy
  kind: security.policy
  meta:
    comment: Create, rename, archive and restore node workspaces under the host's
      admitted roots, and browse those roots' folders
  policy:
    actions:
    - bee.workspace.manager.manage
    - bee.workspace.manager.browse
    resources: '*'
    effect: allow
- name: workspace_folder_browse_policy
  kind: security.policy.expr
  meta:
    comment: List the admitted roots and page their folders, to pick a folder under
      them; reads no workspace and creates, changes and archives nothing
  policy:
    expression: (action == "bee.workspace.manager.read" && resource == "catalog")
      || action == "bee.workspace.manager.browse"
    actions:
    - bee.workspace.manager.read
    - bee.workspace.manager.browse
    resources: '*'
    effect: allow
- name: workspace_catalog_facade_policy
  kind: security.policy.expr
  meta:
    comment: Attached to the catalog operations only; they enter the execution scope
      after authorizing the caller
  policy:
    expression: (action == "funcs.security" && resource == "security") || (action
      == "security.policy_group.get" && resource == "bee.security.storage:workspace_catalog_scope")
      || (action == "funcs.call" && resource == "bee.workspace.binding:catalog") ||
      (action == "registry.get" && resource == "bee.workspace.binding:catalog")
    actions:
    - funcs.security
    - security.policy_group.get
    - funcs.call
    - registry.get
    resources:
    - security
    - bee.security.storage:workspace_catalog_scope
    - bee.workspace.binding:catalog
    effect: allow
- name: workspace_catalog_store_policy
  kind: security.policy.expr
  groups:
  - workspace_catalog_scope
  meta:
    comment: The catalog backend's store, the host's admitted roots and its own execution
  policy:
    expression: (resource != "bee.persist:startup_progress" && action != "env.set"
      && action != "env.get") || (action in ["env.get", "env.set"] && resource ==
      "bee.persist:startup_progress")
    actions:
    - db.get
    - registry.get
    - bee.workspace.manager.execute
    - env.set
    - env.get
    resources:
    - bee.env:workspace_db
    - bee.resources:roots_ref
    - bee.resources:resource_roots
    - bee.workspace.binding:catalog
    - bee.persist:startup_progress
    - bee.workspace.persist:store
    effect: allow
- name: workspace_catalog_volume_policy
  kind: security.policy
  groups:
  - workspace_catalog_scope
  meta:
    comment: Root volumes; the backend opens only roots listed in the host's admitted
      roots
  policy:
    actions:
    - fs.get
    resources: '*'
    effect: allow
- name: workspace_catalog_host_policy
  kind: security.policy.expr
  groups:
  - workspace_catalog_scope
  meta:
    comment: Whether a workspace host is running, before its row is archived
  policy:
    expression: action == "process.registry.lookup" && resource matches "^bee[.]workspace[.]host/[0-9a-f]{32}$"
    actions:
    - process.registry.lookup
    resources: '*'
    effect: allow
- name: workspace_catalog_extension_policy
  kind: security.policy.expr
  groups:
  - workspace_catalog_scope
  meta:
    comment: The catalog finds the workspace extension bindings and calls their describe
      and search methods; each binding answers only for workspaces this scope may
      read, and the operations authorized the caller for that workspace first
  policy:
    expression: (action == "contract.implementations" && resource == "bee.workspace.catalog:extension")
      || action == "contract.open" || (action == "contract.call" && (resource == "describe"
      || resource == "search")) || action == "bee.workspace.manager.read"
    actions:
    - contract.implementations
    - contract.open
    - contract.call
    - bee.workspace.manager.read
    resources: '*'
    effect: allow
