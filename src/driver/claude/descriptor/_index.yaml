version: '1.0'
namespace: bee.driver.claude.descriptor
entries:
- name: cli
  kind: registry.entry
  meta:
    type: bee.driver.cli_descriptor
    comment: Claude Code command, stream-json codec, login evidence and version probe
  data:
    schema_revision: bee.driver.cli-descriptor@4
    provider: claude
    executable: claude
    version_probe:
      argv:
      - --version
      pattern: ([0-9]+[.][0-9]+[.][0-9]+)
    login_evidence:
      command: claude auth login
      any_of:
      - kind: file_exists
        paths:
        - .claude/.credentials.json
        variable: CLAUDE_CONFIG_DIR
        directory: .claude
      - kind: env_present
        names:
        - ANTHROPIC_API_KEY
        - CLAUDE_CODE_OAUTH_TOKEN
      - kind: auth_status
        argv:
        - auth
        - status
        success_exit_code: 0
        timeout_ms: 3000
    platform:
      os:
      - linux
      - darwin
      arch:
      - x86_64
      - amd64
      - arm64
      - aarch64
    codec: claude-stream-json
    json_paths:
      resume_id:
      - session_id
      result_text:
      - result
      errors:
      - terminal_reason
      usage:
      - usage
    configure: claude
    capabilities:
      permission_answers:
        window:
          transport: hook_http
          adapter_ref: bee.driver.permission:permission_request_hook
        first_turn:
          transport: stdio
          adapter_ref: bee.driver.claude.permission:permission_adapter
        resume:
          transport: stdio
          adapter_ref: bee.driver.claude.permission:permission_adapter
    options:
      profiles:
      - session
      - batch
      - window
      fields:
        permission_mode:
          default: manual
          invalid: permission_mode is not one Bee admits
          path: provider.permission_mode
          value_schema:
            type: string
            enum:
            - manual
            - acceptEdits
            - auto
            - dontAsk
            - plan
            - bypassPermissions
          label: Permission mode
          description: CLI permission mode
          section: advanced
          order: 0
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --permission-mode
            version_range: '>=2.1.296'
          render:
          - kind: argv
            contexts:
            - window
            tokens:
            - --permission-mode
            - field: permission_mode
          - kind: argv
            contexts:
            - first_turn
            tokens:
            - --permission-mode
            - field: permission_mode
          - kind: argv
            contexts:
            - resume
            tokens:
            - --permission-mode
            - field: permission_mode
          id: permission_mode
          group: access/trust
          security_class: host-ceiling
          capabilities:
            manual:
            - prompt
            acceptEdits:
            - prompt
            - edit
            auto:
            - automatic
            dontAsk:
            - deny-unapproved
            plan:
            - read
            bypassPermissions:
            - bypass
          ceiling:
          - prompt
          - edit
          - automatic
          - deny-unapproved
          - read
          config_aliases:
          - format: json
            path:
            - permissions
            - defaultMode
        model:
          invalid: model is not one bounded model identifier
          path: provider.model
          value_schema:
            type: string
            format: model
          label: Model
          description: CLI model
          section: basic
          order: 1
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --model
          render:
          - kind: argv
            contexts:
            - window
            tokens:
            - if: model
              then:
              - --model
              - field: model
          - kind: argv
            contexts:
            - first_turn
            tokens:
            - if: model
              then:
              - --model
              - field: model
          - kind: argv
            contexts:
            - resume
            tokens:
            - if: model
              then:
              - --model
              - field: model
          id: model
          group: model/provider
          security_class: free
        effort:
          invalid: effort is not one Bee admits
          path: provider.effort
          value_schema:
            type: string
            enum:
            - low
            - medium
            - high
            - xhigh
            - max
          label: Effort
          description: CLI effort
          section: basic
          order: 2
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --effort
          render:
          - kind: argv
            contexts:
            - window
            tokens:
            - if: effort
              then:
              - --effort
              - field: effort
          - kind: argv
            contexts:
            - first_turn
            tokens:
            - if: effort
              then:
              - --effort
              - field: effort
          - kind: argv
            contexts:
            - resume
            tokens:
            - if: effort
              then:
              - --effort
              - field: effort
          id: effort
          group: model/provider
          security_class: free
        permission_exchange:
          type: boolean
          default: false
          profiles:
          - session
          - batch
          unsupported: stdio permission exchange is only supported for structured turns
        control_enabled:
          type: boolean
          default: false
          profiles:
          - session
          - batch
          unsupported: stream-json control is only supported for structured turns
        resume_ref:
          type: id
          forbid_option: true
          invalid: resume_ref is not an identifier
        gateway_tools:
          type: ids
          default: []
        gateway_hooks:
          type: ids
          default: []
        system_prompt_append:
          path: provider.system_prompt_append
          value_schema:
            type: string
            maxLength: 4096
          label: System prompt append
          description: Additional instructions in the session private home
          section: advanced
          order: 100
          contexts:
          - window
          - first_turn
          - resume
          support:
            config_schema_ref: bee.driver.claude.descriptor:cli
          render:
          - kind: config
            contexts:
            - window
            - first_turn
            - resume
            file: .bee/system-prompt-append.txt
            format: text
            path: []
            merge: append
            value:
              field: provider.system_prompt_append
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - --append-system-prompt-file
            - field: system_prompt_file
          id: system_prompt_append
          group: behavior
          security_class: free
        folder_trust:
          id: folder_trust
          path: provider.options.folder_trust
          value_schema:
            type: string
            enum:
            - ask
            - approved-workdir
          default: ask
          label: Folder trust
          description: Trust only the canonical launch workdir in the isolated agent home
          group: access/trust
          security_class: person-only
          section: advanced
          order: 90
          contexts:
          - window
          - first_turn
          - resume
          support:
            config_schema_ref: bee.driver.claude.descriptor:cli
          render: []
          trust:
            file: .claude/.claude.json
            format: json
            key: hasTrustDialogAccepted
            value: true
            repository_root: true
            project_config:
            - .claude/settings.json
            - .claude/settings.local.json
            - .mcp.json
      rules:
      - kind: profile_fields
        profile: window
        fields:
        - permission_exchange
        - control_enabled
        message: structured-turn options are not supported for a window
    flags: {}
    argv_templates:
      window:
        argv:
        - render: permission_mode
          context: window
        - render: model
          context: window
        - render: effort
          context: window
        - if: resume_ref
          then:
          - -r
          - field: resume_ref
        - if: brief
          then:
          - --
          - field: brief
        readiness: terminal:attached
        provider_home_private: false
        login: true
      first_turn:
        argv:
        - -p
        - if_any:
          - permission_exchange
          - control_enabled
          then:
          - --input-format
          - stream-json
        - --output-format
        - stream-json
        - --verbose
        - --include-partial-messages
        - render: permission_mode
          context: first_turn
        - render: model
          context: first_turn
        - render: effort
          context: first_turn
        - if: permission_exchange
          then:
          - --permission-prompt-tool
          - stdio
          - --permission-prompts
          - host
        - if: gateway_tools
          then:
          - --allowedTools
          - join:
              field: gateway_tools
              separator: ','
              prefix: mcp__bee__
              always:
              - session
              exclude:
              - session
        - if_none:
          - permission_exchange
          - control_enabled
          then:
          - --
          - field: brief
        stdin_json:
          type: user
          message:
            role: user
            content:
              field: brief
        stdin_when_any:
        - permission_exchange
        - control_enabled
        session_end: stdin_close
        readiness: protocol:system.init
        provider_home_private: true
      resume:
        argv:
        - -p
        - if_any:
          - permission_exchange
          - control_enabled
          then:
          - --input-format
          - stream-json
        - --output-format
        - stream-json
        - --verbose
        - --include-partial-messages
        - render: permission_mode
          context: resume
        - render: model
          context: resume
        - render: effort
          context: resume
        - if: permission_exchange
          then:
          - --permission-prompt-tool
          - stdio
          - --permission-prompts
          - host
        - --resume
        - field: resume_ref
        - if: gateway_tools
          then:
          - --allowedTools
          - join:
              field: gateway_tools
              separator: ','
              prefix: mcp__bee__
              always:
              - session
              exclude:
              - session
        - if_none:
          - permission_exchange
          - control_enabled
          then:
          - --
          - field: brief
        stdin_json:
          type: user
          message:
            role: user
            content:
              field: brief
        stdin_when_any:
        - permission_exchange
        - control_enabled
        session_end: stdin_close
        readiness: protocol:system.init
        provider_home_private: true
    provider_home:
      variable: CLAUDE_CONFIG_DIR
      directory: .claude
      files:
      - source_path: .claude/.credentials.json
        path: .claude/.credentials.json
        kind: login
        optional: true
        write_back: true
      - source_path: .claude/settings.json
        path: .claude/settings.json
        kind: config
        optional: true
        write_back: false
        container_content: '{}'
      - path: .claude.json
        kind: state
        optional: true
        write_back: false
- name: command
  kind: registry.entry
  meta:
    type: bee.app_command
    comment: CLI command to launch Claude in the agent window
  data:
    name: claude
    definition_id: bee.harness.app:app
    arguments:
    - bee.driver.claude.profiles:default_window
    fullscreen: true
