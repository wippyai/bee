version: '1.0'
namespace: bee.gateway.security
entries:
- name: store_policy
  kind: security.policy
  meta: {comment: Gateway private store; target_db injects only the selected database resource}
  policy:
    actions: [db.get]
    resources: []
    effect: allow
- name: node_policy
  kind: security.policy
  meta: {comment: The MCP action address names this runtime's native node}
  policy:
    actions: [system.read]
    resources: [node]
    effect: allow
- name: inbox_call_policy
  kind: security.policy
  meta: {comment: Default owner method calls for action inbox tools; domain authority remains at the Threads owner}
  policy:
    actions: [funcs.call]
    resources: [bee.threads.service:inbox_send, bee.threads.service:inbox_reply, bee.threads.service:inbox_list,
      bee.threads.service:inbox_ack, bee.threads.service:inbox_describe]
    effect: allow
- name: discover_none_policy
  kind: security.policy
  policy: {actions: [bee.sessions.discover], resources: [unassigned-session-address], effect: allow}
- name: send_none_policy
  kind: security.policy
  policy: {actions: [bee.sessions.send], resources: [unassigned-session-address], effect: allow}
- name: database_ref_policy
  kind: security.policy
  meta: {comment: Gateway store resolution reads only its component-owned database reference}
  policy:
    actions: [registry.get]
    resources: [bee.gateway:database_ref]
    effect: allow
- name: readiness_policy
  kind: security.policy.expr
  meta: {comment: Internal readiness only; it pins the selected loopback address and authenticates the nonce response}
  policy:
    actions: [http_client.request, http_client.private_ip]
    resources: '*'
    expression: '(action == "http_client.private_ip" && resource == "127.0.0.1") || (action == "http_client.request" && resource matches "^http://127\\.0\\.0\\.1:[0-9]+/ready$")'
    effect: allow
- name: address_policy
  kind: security.policy
  meta: {comment: Gateway address lookup reads only its listener link, endpoint reference, and selected endpoint configuration}
  policy:
    actions: [registry.get]
    resources: [bee.gateway:listener_ref, bee.gateway:endpoint_ref]
    effect: allow
- name: supervisor_policy
  kind: security.policy
  meta: {comment: Gateway address lookup reads only supervisor state}
  policy:
    actions: [system.read]
    resources: [supervisor]
    effect: allow
- name: address_call_policy
  kind: security.policy
  policy:
    actions: [funcs.call]
    resources: [bee.gateway:address]
    effect: allow
- name: execute_policy
  kind: security.policy.expr
  meta: {comment: The HTTP MCP adapter constructs a bound subject and scope; host-selected tool policies still define every operation it may invoke}
  policy:
    expression: '(action == "funcs.security" && resource == "security") || (action == "funcs.context" && resource == "context") || (action == "security.scope.create" && resource == "custom") || (action == "security.actor.create" && resource != "")'
    actions: [funcs.security, funcs.context, security.scope.create, security.actor.create]
    resources: [security, context, custom, '*']
    effect: allow
- name: hook_inbox_policy
  kind: security.policy
  meta: {comment: Hook intake answers a supported boundary with the bound action's own outstanding inbox; the thread owner still checks the admitted principal and workspace, and the hook answers only where the binding admitted session_inbox}
  policy:
    actions: [funcs.call]
    resources: [bee.threads.service:inbox_list]
    effect: allow
- name: tool_policy_read_policy
  kind: security.policy
  meta: {comment: target_tool_* requirements inject exactly the host-selected policies that the MCP adapter may resolve}
  policy:
    actions: [security.policy.get]
    resources: []
    effect: allow
- name: tool_policy_reference_policy
  kind: security.policy
  meta: {comment: The MCP adapter reads only its component-owned links to the selected built-in tool policies}
  policy:
    actions: [registry.get]
    resources: [bee.gateway:tool_read_policy_ref, bee.gateway:tool_message_policy_ref, bee.gateway:tool_inbox_policy_ref, bee.gateway:tool_discover_policy_ref, bee.gateway:tool_send_grant_policy_ref, bee.gateway:tool_launch_policy_ref, bee.gateway:tool_overlay_policy_ref, bee.gateway:tool_docs_policy_ref, bee.gateway:tool_components_policy_ref, bee.gateway:tool_delivery_policy_ref, bee.gateway:tool_publish_policy_ref, bee.gateway:tool_application_open_policy_ref]
    effect: allow
- name: access_call_policy
  kind: security.policy
  meta: {comment: Private per-binding approval access calls only the approval and thread operations required for the effect}
  policy:
    actions: [funcs.call]
    resources: [bee.approvals.binding:request, bee.approvals.binding:read, bee.approvals.binding:consume, bee.approvals.binding:revalidate, bee.threads.service:get, bee.threads.service:read_after]
    effect: allow
- name: access_reference_policy
  kind: security.policy
  meta: {comment: Private per-binding approval access reads only its component-owned policy links}
  policy:
    actions: [registry.get]
    resources: [bee.gateway:approval_request_policy_ref, bee.gateway:approval_consume_policy_ref]
    effect: allow
- name: access_policy_read_policy
  kind: security.policy
  meta: {comment: target_approval_* requirements inject exactly the host-selected approval policies that a binding may resolve; elevation loads its own call policy and the thread-grant policy the same way}
  policy:
    actions: [security.policy.get]
    resources: [bee.gateway.security:access_call_policy, bee.gateway.security:elevation_policy, bee.security.resources:resource_grant_thread_policy]
    effect: allow
- name: access
  kind: library.lua
  source: file://access.lua
  modules: [funcs, security, hash, registry]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    surface: bee.gateway:surface
- name: elevation_policy
  kind: security.policy
  meta:
    comment: Private per-binding capability elevation calls the approval operations and the resource grant write the consumed decision effects; the thread-bound approval is the authority for every write
  policy:
    actions: [funcs.call, registry.get]
    resources: [bee.approvals.binding:request, bee.approvals.binding:read, bee.approvals.binding:consume, bee.approvals.binding:revalidate, bee.resources.binding:grant, bee:capability_catalog, bee.threads.service:get, bee.threads.service:read_after]
    effect: allow
- name: elevation
  kind: library.lua
  source: file://elevation.lua
  modules: [funcs, security, hash, registry]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    capability: bee.gov:capability_request
