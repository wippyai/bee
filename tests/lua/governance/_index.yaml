- name: activation_test_db
  kind: db.sql.sqlite
  meta: {type: test_support}
  file: .wippy/governance-activation-test.db
  lifecycle: {auto_start: true}
- name: plan_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [db.get]
    resources: [bee.governance:plan_test_db, bee.governance:destination_test_db, bee.governance:destination_refusal_test_db, bee.governance:destination_replica_test_db, bee.governance:activation_test_db, bee.sync:sync_test_db]
    effect: allow
