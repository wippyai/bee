version: '1.0'
namespace: bee.tests.driver
entries:
- name: profile_test
  kind: function.lua
  source: file://profile_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry]
  imports:
    test: wippy.test:test
    profile: bee.driver.profiles:profile
- name: kit_test
  kind: function.lua
  source: file://kit_test.lua
  method: run
  meta:
    type: test
    suite: bee
  imports:
    test: wippy.test:test
    framing: bee.driver.transport:framing
    quote: bee.driver.binding:quote
    events: bee.driver.codec:events
    observation: bee.threads.records:observation
    stream_json: bee.driver.transport:stream_json
- name: option_render_test
  kind: function.lua
  source: file://option_render_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [json, toml, hash, registry]
  security: {policies: [bee.harness.profiles:repair_policy]}
  imports:
    universal: bee.driver.binding:universal
    test: wippy.test:test
    render: bee.driver.binding:option_render
    descriptor: bee.driver.descriptor:descriptor
    configuration: bee.driver.binding:configuration
    materializer: bee.placement.native.env:configuration
    bounds: bee.values:bounds
- name: providers_test
  kind: function.lua
  source: file://providers_test.lua
  method: run
  meta:
    type: test
    suite: bee
    timeout: 60s
  modules:
  - fs
  - json
  - funcs
  imports:
    driver_types: bee.driver:types
    universal: bee.driver.binding:universal
    bounds: bee.values:bounds
    test: wippy.test:test
    stream_json: bee.driver.transport:stream_json
    claude: bee.tests.driver.support:claude_protocol
    codex: bee.tests.driver.support:codex_protocol
    muse: bee.tests.driver.support:muse_protocol
    claude_launch: bee.tests.driver.support:claude_launch
    codex_launch: bee.tests.driver.support:codex_launch
    muse_launch: bee.tests.driver.support:muse_launch
    observation: bee.threads.records:observation
    quote: bee.driver.binding:quote
- name: fixtures
  kind: fs.directory
  meta: {type: test_support}
  directory: ./fixtures/drivers
- name: login_evidence_test
  kind: function.lua
  source: file://login_evidence_test.lua
  method: run
  modules: [registry]
  meta: {type: test, suite: bee}
  imports:
    principals: bee.tests.principals:bound
    bounds: bee.values:bounds
    test: wippy.test:test
    codex_launch: bee.tests.driver.support:codex_launch
    claude_launch: bee.tests.driver.support:claude_launch
    agy_launch: bee.tests.driver.support:agy_launch
    grok_launch: bee.tests.driver.support:grok_launch
    muse_launch: bee.tests.driver.support:muse_launch
    opencode_launch: bee.tests.driver.support:opencode_launch
    universal: bee.driver.binding:universal
    materialization: bee.placement.native.service:materialization
    placement_types: bee.placement:types
- name: locate_test
  kind: function.lua
  source: file://locate_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    locate: bee.driver.locate:locate
    descriptor: bee.driver.descriptor:descriptor
    login_evidence: bee.driver.locate:login_evidence
    claude: bee.driver.claude.binding:locate
    codex: bee.driver.codex.binding:locate
    opencode: bee.driver.opencode.binding:locate
    agy: bee.driver.agy.binding:locate
    grok: bee.driver.grok.binding:locate
    muse: bee.driver.muse.binding:locate
- name: descriptor_discovery_policy
  kind: security.policy
  meta: {type: test_support}
  policy: {actions: [registry.apply], resources: '*', effect: allow}
- name: descriptor_test
  kind: function.lua
  source: file://descriptor_test.lua
  security: {policies: [bee.tests.driver:descriptor_discovery_policy]}
  method: run
  meta: {type: test, suite: bee}
  modules: [registry]
  imports:
    principals: bee.tests.principals:bound
    test: wippy.test:test
    descriptor: bee.driver.descriptor:descriptor
    resolver: bee.driver.binding:resolver
    login_evidence: bee.driver.locate:login_evidence
    bounds: bee.values:bounds
- name: universal_test
  kind: function.lua
  source: file://universal_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    bounds: bee.values:bounds
    test: wippy.test:test
    universal: bee.driver.binding:universal
    codec_registry: bee.driver.codec:codec_registry
    descriptor: bee.driver.descriptor:descriptor
    configuration: bee.driver.binding:configuration
- name: muse_config_test
  kind: function.lua
  source: file://muse_config_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [json]
  imports:
    principals: bee.tests.principals:bound
    bounds: bee.values:bounds
    test: wippy.test:test
    registry: registry
    configuration: bee.driver.muse.binding:configuration
    driver_configuration: bee.driver.binding:configuration
    configure: bee.driver.muse.binding:configure
    placement_configuration: bee.placement.native.env:configuration
    placement_types: bee.placement:types

- name: docker_probe_test
  kind: function.lua
  source: file://docker_probe_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry, json]
  security: {policies: [bee.tests.driver:docker_probe_policy, bee.harness.security:launch_locate_probe_policy]}
  imports: {test: wippy.test:test, probe: bee.placement.docker.service:runtime_probe, bounds: bee.values:bounds, locate: bee.harness.launch:locate}
- name: docker_probe_policy
  kind: security.policy
  meta: {type: test_support}
  policy: {actions: [registry.get, registry.snapshot, registry.apply, funcs.call], resources: '*', effect: allow}
- name: docker_probe_facts
  kind: registry.entry
  meta: {type: test_support}
  data: {present: true, calls: 0, digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, help: '--model --permission-mode --allowedTools --disallowedTools --append-system-prompt-file'}
- name: docker_capabilities_fixture
  kind: function.lua
  source: file://docker_capabilities_fixture.lua
  method: handle
  meta: {type: test_support}
  modules: [registry]
  security: {policies: [bee.tests.driver:docker_probe_policy]}
  imports: {bounds: bee.values:bounds}
- name: host_values_test
  kind: function.lua
  source: file://host_values_test.lua
  method: run
  modules: [env]
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
  security:
    policies: [bee.tests.driver:host_values_policy]
- name: host_values_policy
  kind: security.policy
  meta: {comment: The host values test reads the driver override variables}
  policy:
    actions: [env.get]
    resources: [bee.driver.claude.env:config_home, bee.driver.claude.env:api_key, bee.driver.codex.env:config_home]
    effect: allow
