version: '1.0'
namespace: bee
entries:
- name: dependency_sync
  kind: ns.dependency
  component: bee/sync
  version: 0.1.0-dev
  parameters:
  - name: target_sender
    value: bee.hive.host:replica_sender
  - name: target_exports
    value: bee:sync_exports
- name: sync_exports
  kind: registry.entry
  data: {exports: []}
- name: hive_feed_exposure_policy
  kind: security.policy
  policy:
    actions: [hive.expose.policy]
    resources: [bee.node:describe, bee.node:update_metadata, bee.node:snapshot, bee.node:read_after, bee.approvals.binding:feed_snapshot, bee.approvals.binding:feed_read_after, bee.approvals.binding:read, bee.approvals.binding:decide]
    effect: allow
- name: feed_admission_policy
  kind: security.policy
  policy:
    actions: [registry.get, system.read, funcs.call]
    resources: [node, bee.hive.supervisor:principal_mappings, bee.hive.supervisor:invoke_check, bee.node:describe, bee.node:update_metadata, bee.node:snapshot, bee.node:read_after, bee.approvals.binding:feed_snapshot, bee.approvals.binding:feed_read_after, bee.approvals.binding:read, bee.approvals.binding:decide]
    effect: allow
- name: approval_store_policy
  kind: security.policy
  policy:
    actions: [db.get, registry.get, system.read, process.send]
    resources: [bee.approvals:db, bee.approvals:database_ref, bee.approvals:policies_ref, bee:approver_policies, node, '*']
    effect: allow
- name: approval_owner_policy
  kind: security.policy
  policy:
    actions: [bee.approvals.own, process.registry.register, funcs.call]
    resources: '*'
    effect: allow
