version: '1.0'
namespace: bee.threads
entries:
- name: canonical_test
  kind: function.lua
  source: file://canonical_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [json]
  imports:
    test: wippy.test:test
    canonical: bee.threads.records:canonical
- name: records_test
  kind: function.lua
  source: file://records_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    record: bee.threads.records:record
    observation: bee.threads.records:observation
    message: bee.threads.records:message
    lifecycle: bee.threads.records:lifecycle
    delivery: bee.threads.records:delivery
    bounds: bee.threads.records:bounds
    types: bee.threads.records:types
- name: client_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.threads.service:create, bee.threads.service:get, bee.threads.service:list, bee.threads.service:list_workspace, bee.threads.service:join,
      bee.threads.service:leave, bee.threads.service:close, bee.threads.service:record, bee.threads.service:read_after, bee.threads.service:send, bee.threads.service:send_status, bee.threads.service:notify,
      bee.threads.service:inbox_accept, bee.threads.service:inbox_send, bee.threads.service:inbox_list, bee.threads.service:inbox_ack, bee.threads.service:inbox_reply, bee.threads.service:inbox_describe,
      bee.threads.service:inbox_offer, bee.threads.service:inbox_transport, bee.threads.service:inbox_outbox_claim, bee.threads.service:inbox_outbox_settle,
      bee.threads.service:admit_action, bee.threads.service:prepare_attempt, bee.threads.service:start_attempt, bee.threads.service:request_turn,
      bee.threads.service:end_turn, bee.threads.service:receipt,
      bee.threads.delivery:claim, bee.threads.delivery:dispatch, bee.threads.delivery:ack, bee.threads.delivery:release,
      bee.threads.delivery:expire, bee.threads.delivery:reconcile, bee.threads.delivery:subscribe, bee.threads.delivery:page,
      bee.threads.delivery:ack_page, bee.threads.delivery:unsubscribe, bee.threads.delivery:resume, bee.threads.delivery:close_subscription, bee.threads.delivery:forget_subscription, bee.threads.delivery:wait, bee.threads.delivery:watch,
      bee.threads.projection:recap_read, bee.threads.projection:recap_update, bee.threads.projection:recap_rebuild, bee.threads.projection:status_read, bee.threads.projection:status_update, bee.threads.projection:status_rebuild,
      bee.threads:capabilities, bee.threads.carrier:claim, bee.threads.carrier:commit, bee.threads.carrier:checkpoint, bee.threads.approvals:append]
    effect: allow
- name: inbox_send_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [bee.sessions.send]
    resources: '*'
    effect: allow
