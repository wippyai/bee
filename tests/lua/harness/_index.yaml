    gateway_tools: [thread_read, thread_wait]
    gateway_hooks: [SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, Stop]
- name: codex_gateway_policy
  kind: registry.entry
  meta:
    type: bee.launch_policy
    test_support: true
    comment: Fixture policy for the real Codex executable with gateway tools admitted through the provider configuration; the suite binds the executable
  data:
    schema_revision: bee.launch-policy@1
    required_cleanup: direct_process
    required_exit_observation: eof_gated
