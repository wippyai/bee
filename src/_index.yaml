version: '1.0'
namespace: bee
entries:
- name: definition
  kind: ns.definition
  meta:
    title: Bee desktop foundation
- name: workers
  kind: process.host
  host:
    max_processes: 24
    workers: 4
  lifecycle:
    auto_start: true
- name: workspace_hosts
  kind: process.service
  process: bee.launch:host_manager
  host: bee:workers
  input:
  - {cap: 64, idle_ms: 900000}
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.workspace.hosts}
      policies: [bee.security.desktop:host_policy, bee.security.desktop:local_supervisor_spawn_policy, bee.security.desktop:workspace_host_manager_policy]
  meta:
    comment: Starts a node workspace host when a lease first asks for it, stops it after 15 minutes unleased, and keeps at most 64 live
- name: gov_recovery_service
  kind: process.service
  process: bee.gov.service:recovery
  host: bee:workers
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.gov.activation}
      policies: [bee.gov.security:destination_service_policy]
- name: sync_exports
  kind: registry.entry
  meta:
    type: bee.sync.exports
    comment: Host-selected immutable feeds exported to connected non-client Hive nodes
  data:
    exports:
    - feed: governance.application_versions
      content_kinds: [bee.governance-application-version@2]
- name: capability_catalog
  kind: registry.entry
  meta:
    type: bee.capability_catalog
    comment: Host-owned review vocabulary and templates; declarations are not grants
  data:
    revision: 1
    never: [exec, env, credentials, registry.write, security.policy.write, security.scope.manage, approvals.decide, core.database, lifecycle.auto_start]
    capabilities:
    - id: workspace.files.read
      revision: 1
      parameters: {subpath: relative_subpath}
      text: Read workspace files under {subpath}
      confirm: standard
      policies:
      - {operation: files.read, resource: workspace, scope: {subpath: '$subpath'}}
      resources:
      - {kind: fs.directory, mode: readonly, source: verified_workspace_subroot}
    - id: app.database
      revision: 1
      parameters: {name: name}
      text: Use an isolated application database named {name}
      confirm: standard
      policies:
      - {operation: database.use, resource: '$name', scope: {name: '$name'}}
      resources:
      - {kind: db.sql.sqlite, mode: dedicated, source: host_app_database}
    - id: threads.read
      revision: 1
      parameters: {scope: owned_scope}
      text: Read owned threads
      confirm: standard
      policies:
      - {operation: threads.read, resource: threads, scope: {scope: '$scope'}}
      resources: []
    - id: threads.message
      revision: 1
      parameters: {scope: children_scope}
      text: Message child threads
      confirm: standard
      policies:
      - {operation: threads.message, resource: threads, scope: {scope: '$scope'}}
      resources: []
    - id: agents.launch
      revision: 1
      parameters: {definitions: definitions}
      text: Launch managed agents from {definitions}
      confirm: explicit
      policies:
      - {operation: agents.launch, resource: managed_agents, scope: {definitions: '$definitions'}}
      resources: []
    - id: contract.call
      revision: 1
      parameters: {binding: binding, methods: methods}
      text: Call app binding {binding} using {methods}
      confirm: explicit
      policies:
      - {operation: contract.call, resource: '$binding', scope: {methods: '$methods'}}
      resources:
      - {kind: contract.binding, mode: caller, source: host_selected_binding}
    - id: http.api
      revision: 1
      parameters: {origin: https_origin, methods: http_methods, path_prefix: url_path_prefix}
      text: Send HTTP requests to {origin} at {path_prefix} using {methods}
      confirm: explicit
      policies:
      - {operation: http.request, resource: '$origin', scope: {methods: '$methods', path_prefix: '$path_prefix'}}
      resources:
      - {kind: http.client, mode: scoped, source: host_selected_origin}
    - id: hive.expose
      revision: 1
      parameters: {contract: contract, methods: methods}
      text: Expose Hive contract {contract} using {methods}
      confirm: explicit
      policies:
      - {operation: hive.expose, resource: '$contract', scope: {methods: '$methods'}}
      resources:
      - {kind: contract.binding, mode: hive, source: host_selected_contract}
- name: sync_distribution_service
  kind: process.service
  process: bee.sync.service:distribution_worker
  host: bee:workers
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.sync.distribution}
      policies: [bee.security:sync_distribution_policy]
- name: terminal
  kind: terminal.host
  hide_logs: true
  lifecycle:
    auto_start: true
- name: approver_policies
  kind: registry.entry
  meta:
    type: bee.approval_policies
    comment: Host-owned approver policies; a request names one, and only its approvers decide it
  policies:
  - name: workspace-application-delivery
    approvers:
    - definition_id: bee.approvals.inbox:app
    max_ttl_ms: 600000
- name: credential_sources
  kind: registry.entry
  meta:
    type: bee.credential_sources
    comment: Host-selected credential sources with audience and provider; optional setup source, destination and
      format form one supplemental file under the same root
  data:
    formats:
      claude: bee.driver.claude:credential_format
      codex: bee.driver.codex:credential_format
      agy: bee.driver.agy:credential_format
      grok: bee.driver.grok:credential_format
      muse: bee.driver.muse:credential_format
    sources:
    - ref: bee.driver.claude:api_key
      workspace_id: '*'
      audience: '*'
      provider: claude
      projection_kinds:
      - environment
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: codex
      projection_kinds:
      - file
      path: .codex/auth.json
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: claude
      projection_kinds:
      - file
      path: .claude/.credentials.json
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: agy
      projection_kinds:
      - file
      path: .gemini/antigravity-cli/antigravity-oauth-token
      setup_path: .gemini/antigravity-cli/cache/onboarding.json
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: grok
      projection_kinds:
      - file
      path: .grok/auth.json
      setup_path: .grok/config.toml
      setup_destination: .grok/.bee-global-config.toml
      setup_content_format: opaque
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: muse
      projection_kinds:
      - file
      path: .config/muse/auth.json
      setup_path: .config/muse/settings.json
      setup_destination: .config/muse/.bee-global-settings.json
      setup_content_format: opaque
- name: docs_corpus
  kind: fs.directory
  directory: ./src/corpus
  mode: '0500'
  auto_init: false
  meta:
    title: Bee agent documentation corpus
    comment: The offline platform documentation a bound agent reads through the gateway docs tool; wippy.yaml embed freezes it read-only into the pack. Rebuilt by build/agent_corpus.py.
- name: gateway_endpoint
  kind: registry.entry
  meta:
    type: bee.gateway_endpoint
    comment: Native HTTP selects and retains an available loopback port; gateway address resolves it from supervisor
      state
  data:
    address: 127.0.0.1:0
- name: gateway_listener
  kind: http.service
  addr: 127.0.0.1:0
  lifecycle:
    auto_start: true
- name: gateway_router
  kind: http.router
  meta:
    server: bee:gateway_listener
  prefix: /
- name: gateway_ready
  kind: http.endpoint
  meta:
    router: bee:gateway_router
  method: GET
  path: /ready
  func: bee.gateway.api:ready_http
- name: gateway_mcp
  kind: http.endpoint
  meta:
    router: bee:gateway_router
  method: POST
  path: /mcp/:action
  func: bee.gateway.api:mcp_http
- name: gateway_hook
  kind: http.endpoint
  meta:
    router: bee:gateway_router
  method: POST
  path: /hook/:action
  func: bee.gateway.api:hook_http
- name: gateway_hook_status
  kind: http.endpoint
  meta:
    router: bee:gateway_router
  method: GET
  path: /hook/:action/:event
  func: bee.gateway.api:hook_status_http
- name: gateway_hook_mcp
  kind: http.endpoint
  meta:
    router: bee:gateway_router
  method: POST
  path: /hook/:action/mcp
  func: bee.gateway.api:hook_mcp_http
- name: gateway_workspace_extension
  kind: contract.binding
  meta:
    title: Agent sessions
    comment: The host attaches each workspace's running agent sessions to the workspace catalog and its viewer
  contracts:
  - contract: bee.workspace.catalog:extension
    methods:
      describe: bee.gateway.binding:describe
      search: bee.gateway.binding:search
- name: harness_setup
  kind: registry.entry
  meta:
    type: bee.harness_setup
    comment: Host-selected first-use roots keyed by definition-declared resource names
  data:
    roots:
      project: bee.env:workspace_root
      session: bee.placement.native:root
    credentials:
      claude_api_key:
        provider: claude
        source:
          kind: env_variable
          ref: bee.driver.claude:api_key
        optional: true
      codex_login:
        provider: codex
        source:
          kind: fs_directory
          ref: bee.env:machine_login_source
        optional: true
      muse_login:
        provider: muse
        source:
          kind: fs_directory
          ref: bee.env:machine_login_source
        optional: true
      agy_login:
        provider: agy
        source:
          kind: fs_directory
          ref: bee.env:machine_login_source
        optional: true
      grok_login:
        provider: grok
        source:
          kind: fs_directory
          ref: bee.env:machine_login_source
        optional: true
      claude_login:
        provider: claude
        source:
          kind: fs_directory
          ref: bee.env:machine_login_source
        optional: true
- name: harness_activation
  kind: registry.entry
  meta:
    type: bee.harness_activation
    comment: Driver bindings this host activates; discovery alone activates nothing
  data:
    schema_revision: bee.harness-activation@1
    bindings:
    - bee.driver.agy:binding
    - bee.driver.claude:binding
    - bee.driver.codex:binding
    - bee.driver.grok:binding
    - bee.driver.muse:binding
- name: launch_policy_claude_window
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected executable binding for the component-owned Claude Code window; missing host executable
      leaves the declaration unavailable
  data:
    schema_revision: bee.launch-policy@2
    allowed_overrides: [thread, workdir]
    required_cleanup: process_group
    required_exit_observation: independent
    start_ms: 15000
    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables: {}
    executable_env:
      claude: bee.driver.claude:executable
    environment: {}
    environment_refs:
      CLAUDE_CONFIG_DIR: bee.driver.claude:config_home
    allow_host_home: true
    gateway_tools:
    - thread_read
    - thread_wait
    - thread_message
    - thread_sessions
    - thread_notify
    - session_directory
    - session_send
    - session_inbox
    - session_ack
    - session_reply
    - overlay
    - delivery
    - docs
    - components
    gateway_hooks:
    - SessionStart
    - UserPromptSubmit
    - PreToolUse
    - PostToolUse
    - Stop
    profile_options:
      effort:
      - low
      - medium
      - high
    profile_instructions: true
    prepare_options: {}
- name: launch_policy_claude_batch
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected one-turn Claude batch policy for bounded research actions on a caller-owned thread
  data:
    schema_revision: bee.launch-policy@2
    allowed_overrides: [thread, workdir]
    required_cleanup: process_group
    required_exit_observation: independent
    start_ms: 15000
    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables: {}
    executable_env: {claude: bee.driver.claude:executable}
    environment: {}
    environment_refs: {CLAUDE_CONFIG_DIR: bee.driver.claude:config_home}
    allow_host_home: true
    gateway_tools: [thread_read, thread_wait, thread_message, thread_sessions, thread_notify, session_directory, session_send, session_inbox, session_ack, session_reply, overlay, delivery, docs, components]
    gateway_hooks: [SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, Stop]
    profile_options: {effort: [low, medium, high]}
    profile_instructions: true
    prepare_options: {permission_mode: dontAsk, max_turns: 1}
