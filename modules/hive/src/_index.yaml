version: '1.0'
namespace: bee.hive
entries:
- name: dependency_values
  kind: ns.dependency
  component: bee/values
  version: '*'
- name: definition
  kind: ns.definition
  module: hive
  readme: file://README.md
  meta:
    title: Bee hive
    comment: Cross-node protocol envelopes, client, open telemetry and registry catalog; host composition and policy selection remain in Bee
- name: workspace_query
  kind: library.lua
  source: file://workspace_query.lua
  imports:
    bounds: bee.values:bounds
- name: types
  kind: library.lua
  source: file://types.lua
  modules: [hash]
  imports:
    canonical: bee.values:canonical
    bounds: bee.values:bounds
- name: client
  kind: library.lua
  source: file://client.lua
  modules: [process, channel, time, uuid]
  imports: {types: bee.hive:types, bounds: bee.values:bounds}
- name: catalog
  kind: library.lua
  source: file://catalog.lua
  modules: [registry, security, json, hash]
  imports:
    canonical: bee.values:canonical
    bounds: bee.values:bounds
    types: bee.hive:types
- name: principals
  kind: library.lua
  source: file://principals.lua
  modules: [hash]
  imports:
    types: bee.hive:types
    bounds: bee.values:bounds
- name: output
  kind: library.lua
  source: file://output.lua
  modules: [json]
  imports:
    canonical: bee.values:canonical
