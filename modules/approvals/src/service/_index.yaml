version: '1.0'
namespace: bee.approvals.service
entries:
- name: process_host
  kind: ns.requirement
  meta:
    comment: Process host that runs the approval authority and outbox worker
  targets:
  - entry: bee.approvals.service:authority_service
    path: .host
  - entry: bee.approvals.service:worker_service
    path: .host
- name: authority_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected policy grants for the approval authority
  targets:
  - entry: bee.approvals.service:authority_service
    path: .lifecycle.security.policies
- name: worker_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected policy grants for the approval outbox worker
  targets:
  - entry: bee.approvals.service:worker_service
    path: .lifecycle.security.policies
- name: worker
  kind: process.lua
  source: file://worker.lua
  method: main
  modules: [process, channel, time, logger]
  imports:
    service: bee.approvals.service:service
    outbox: bee.approvals.persist:outbox
- name: authority
  kind: process.lua
  source: file://authority.lua
  method: main
  modules: [process]
  imports:
    service: bee.approvals.service:service
- name: authority_service
  kind: process.service
  process: bee.approvals.service:authority
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.approvals.authority}
      policies: []
- name: worker_service
  kind: process.service
  process: bee.approvals.service:worker
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.approvals.outbox}
      policies: []
- name: runtime_lease
  kind: library.lua
  source: file://runtime_lease.lua
  imports:
    bounds: bee.values:bounds
- name: service
  kind: library.lua
  source: file://service.lua
  modules: [sql, hash, uuid, json, security, system, process, funcs]
  imports:
    windows: bee.approvals.types:windows
    runtime_lease: bee.approvals.service:runtime_lease
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    values: bee.threads.records:values
    clock: bee.values:clock
    persist: bee.persist.persist:database
    transaction: bee.persist.persist:transaction
    migrations: bee.approvals.migrations:migrations
    identity_migration: bee.approvals.migrations:identity_migration
    resources: bee.approvals.env:resources
    store: bee.approvals.persist:store
    outbox: bee.approvals.persist:outbox
