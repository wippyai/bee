version: '1.0'
namespace: bee.placement.native.service
entries:
- name: executable
  kind: library.lua
  source: file://executable.lua
  modules:
  - fs
  - hash
  imports:
    bounds: bee.values:bounds
    resources: bee.placement.native:resources
    types: bee.placement:types
    executable_stream: bee.placement.native.service:executable_stream
- name: executable_stream
  kind: library.lua
  source: file://executable_stream.lua
  modules:
  - hash
- name: output_buffer
  kind: library.lua
  source: file://output_buffer.lua
  imports:
    protocol: bee.placement.native:protocol
- name: resource_resolution
  kind: library.lua
  source: file://resource_resolution.lua
  imports:
    bounds: bee.values:bounds
    types: bee.placement:types
- name: capability
  kind: library.lua
  source: file://capability.lua
  modules:
  - exec
  imports:
    types: bee.placement:types
    resources: bee.placement.native:resources
- name: homes
  kind: library.lua
  source: file://homes.lua
  modules:
  - fs
  - hash
  imports:
    formats: bee.credentials:formats
    types: bee.placement:types
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    resources: bee.placement.native:resources
- name: identity
  kind: library.lua
  source: file://identity.lua
  modules:
  - exec
  imports:
    resources: bee.placement.native:resources
- name: writable_roots_adapter
  kind: library.lua
  source: file://writable_roots_adapter.lua
  imports:
    canonical: bee.values:canonical
    driver_types: bee.driver:types
- name: workdir_preparers
  kind: library.lua
  source: file://workdir_preparers.lua
  modules:
  - registry
  - funcs
  - sql
  - json
  imports:
    resources: bee.placement.native:resources
    types: bee.placement:types
    bounds: bee.values:bounds
    store: bee.placement.native.persist:store
    paths: bee.placement:paths
- name: service
  kind: library.lua
  source: file://service.lua
  modules:
  - process
  - channel
  - time
  - security
  - uuid
  - json
  - funcs
  - registry
  - system
  - sql
  imports:
    gateway_configuration: bee.gateway:configuration
    configuration: bee.driver:configuration
    preferences: bee.driver:preferences
    resolver: bee.driver:resolver
    driver_types: bee.driver:types
    placement_resolver: bee.placement:resolver
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    types: bee.placement:types
    request: bee.placement:request
    transitions: bee.placement:transitions
    store: bee.placement.native.persist:store
    executable: bee.placement.native.service:executable
    resources: bee.placement.native:resources
    capability: bee.placement.native.service:capability
    homes: bee.placement.native.service:homes
    identity: bee.placement.native.service:identity
    protocol: bee.placement.native:protocol
    materialization: bee.placement.native.service:materialization
    gateway_protocol: bee.gateway:protocol
    service_reply: bee.values:reply
    credential_protocol: bee.credentials:protocol
    resource_resolution: bee.placement.native.service:resource_resolution
    workdir_preparers: bee.placement.native.service:workdir_preparers
    placement_profiles: bee.placement:profiles
- name: materialization
  kind: library.lua
  source: file://materialization.lua
  modules:
  - env
  - fs
  - funcs
  - sql
  - process
  - hash
  imports:
    store: bee.placement.native.persist:store
    resources: bee.placement.native:resources
    homes: bee.placement.native.service:homes
    workdir_preparers: bee.placement.native.service:workdir_preparers
    writable_roots_adapter: bee.placement.native.service:writable_roots_adapter
    bounds: bee.values:bounds
    configuration: bee.placement.native:configuration
    provider_projection: bee.placement.native.service:provider_projection
    types: bee.placement:types
    paths: bee.placement:paths
    gateway_protocol: bee.gateway:protocol
    credential_protocol: bee.credentials:protocol
    service_reply: bee.values:reply
    formats: bee.credentials:formats
- name: runner
  kind: process.lua
  source: file://runner.lua
  method: main
  modules:
  - process
  - channel
  - time
  - sql
  - exec
  - funcs
  imports:
    bounds: bee.values:bounds
    service: bee.placement.native.service:service
    materialization: bee.placement.native.service:materialization
    store: bee.placement.native.persist:store
    executable: bee.placement.native.service:executable
    resources: bee.placement.native:resources
    identity: bee.placement.native.service:identity
    output_buffer: bee.placement.native.service:output_buffer
    protocol: bee.placement.native:protocol
    quote: bee.driver.kit:quote
    types: bee.placement:types
    process_backend: bee.placement.native:process_backend
  security: {policies: []}
- name: window
  kind: library.lua
  source: file://window.lua
  modules: [process, exec, tty, security, funcs, uuid]
  imports:
    protocol: bee.placement.native:protocol
    store: bee.placement.native.persist:store
    resources: bee.placement.native:resources
    materialization: bee.placement.native.service:materialization
    executable: bee.placement.native.service:executable
    quote: bee.driver.kit:quote
    service: bee.placement.native.service:service
    bounds: bee.values:bounds
    identity: bee.placement.native.service:identity
    process_backend: bee.placement.native:process_backend
- name: sweeper
  kind: process.lua
  source: file://sweeper.lua
  method: main
  modules:
  - process
  - channel
  - time
  imports:
    service: bee.placement.native.service:service
- name: sweeper_service
  kind: process.service
  process: bee.placement.native.service:sweeper
  lifecycle:
    auto_start: true
    security:
      actor:
        id: bee.placement.sweeper
      policies: []
- name: provider_projection
  kind: library.lua
  source: file://provider_projection.lua
  modules: [json, toml, registry]
  imports:
    profiles: bee.placement:profiles
    bounds: bee.values:bounds
    formats: bee.credentials:formats
    types: bee.driver:types
- name: process_runner
  kind: library.lua
  source: file://runner.lua
  modules:
  - process
  - channel
  - time
  - sql
  - exec
  - funcs
  imports:
    service: bee.placement.native.service:service
    materialization: bee.placement.native.service:materialization
    store: bee.placement.native.persist:store
    executable: bee.placement.native.service:executable
    resources: bee.placement.native:resources
    identity: bee.placement.native.service:identity
    output_buffer: bee.placement.native.service:output_buffer
    protocol: bee.placement.native:protocol
    quote: bee.driver.kit:quote
    types: bee.placement:types
    process_backend: bee.placement.native:process_backend
    bounds: bee.values:bounds
