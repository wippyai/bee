  imports:
    database: bee.persist.persist:database
    transaction: bee.persist.persist:transaction
    migrations: bee.gov.migrations:schema
    identity_migration: bee.gov.persist:identity_migration
    protocol: bee.gov.types:workspace_protocol
    workspace: bee.gov.types:workspace
    bounds: bee.values:bounds
- name: identity_migration
  kind: library.lua
  source: file://identity_migration.lua
  modules: [sql, env]
  imports:
    bounds: bee.values:bounds
