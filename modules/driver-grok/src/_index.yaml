version: '1.0'
namespace: bee.driver.grok
entries:
- name: definition
  kind: ns.definition
  module: driver-grok
  readme: file://README.md
  meta:
    title: Bee Grok driver
    comment: Declarative Grok CLI driver; placement owns process, credentials, and private-home materialization
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: host_environment
  kind: ns.requirement
  meta:
    comment: Read-only host environment that supplies the selected Grok executable
  default: bee.harness.host:environment
  targets:
  - entry: bee.driver.grok.env:executable
    path: .storage
- name: window_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Grok window route
  default: bee.driver.grok.security:launch_policy_grok_window
  targets:
  - entry: bee.driver.grok.profiles:default_window
    path: .data.policy_ref
- name: batch_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Grok batch route
  default: bee.driver.grok.security:launch_policy_grok_batch
  targets:
  - entry: bee.driver.grok.profiles:research_batch
    path: .data.policy_ref
- name: dependency_values
  kind: ns.dependency
  component: bee/values
  version: '*'
