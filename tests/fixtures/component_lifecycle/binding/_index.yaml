version: '1.0'
namespace: bee.files.binding
entries:
- name: lifecycle
  kind: function.lua
  source: file://lifecycle.lua
  method: handle
  modules: [process, registry, security, time, channel, uuid, logger, fs]
  imports: {bounds: bee.values:bounds}
  security: {policies: [bee.files.binding:lifecycle_policy]}
- name: lifecycle_policy
  kind: security.policy
  policy:
    actions: [registry.get, process.registry.lookup, process.listen, process.send, fs.get, fs.stat, fs.readfile, fs.writefile]
    resources: '*'
    effect: allow
