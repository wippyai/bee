version: '1.0'
namespace: bee.gov.overlays.app
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules:
  - tty
  - process
  - channel
  - uuid
  - funcs
  imports:
    frame: bee.app:frame
    client: bee.app:client
    appearance: bee.app:appearance
    caller: bee.app:caller
    model: bee.gov.overlays.app:model
    view: bee.gov.overlays.app:view
  meta:
    type: bee.app
    application:
      api_version: 1
      title: Overlays
      icon: D
      lifetime: view
      revision: '1'
      instance_policy: singleton
      group: Tools
      role: overlays
      resume_schema: overlays.v1
      restart_policy: manual
- name: model
  kind: library.lua
  source: file://model.lua
  modules:
  - json
  imports:
    bounds: bee.values:bounds
    caller: bee.app:caller
    preflight: bee.gov.binding:preflight
- name: view
  kind: library.lua
  source: file://view.lua
  imports:
    frame: bee.app:frame
    appearance: bee.app:appearance
    model: bee.gov.overlays.app:model
    text: bee.app:text
