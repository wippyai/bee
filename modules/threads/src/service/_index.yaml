version: '1.0'
namespace: bee.threads.service
entries:
- name: access
  kind: library.lua
  source: file://access.lua
  modules: [security]
  imports:
    bounds: bee.values:bounds
- name: boundary
  kind: library.lua
  source: file://boundary.lua
  modules: [sql, process]
  imports:
    resources: bee.threads.env:resources
    database: bee.threads.persist:database
    transaction: bee.threads.persist:transaction
    types: bee.threads:types
    access: bee.threads.service:access
    notices: bee.threads.service:notices
- name: notices
  kind: library.lua
  source: file://notices.lua
  modules: [sql, uuid]
  imports:
    bounds: bee.values:bounds
    record: bee.threads.records:record
    message: bee.threads.records:message
    record_types: bee.threads:record_types
    reader: bee.threads.persist:reader
    transaction: bee.threads.persist:transaction
    authority: bee.threads.service:authority
    access: bee.threads.service:access
- name: authority
  kind: library.lua
  source: file://authority.lua
  modules: [sql, json]
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    values: bee.threads.records:values
    record: bee.threads.records:record
    message: bee.threads.records:message
    observation: bee.threads.records:observation
    record_types: bee.threads:record_types
    types: bee.threads:types
    access: bee.threads.service:access
    reader: bee.threads.persist:reader
    transaction: bee.threads.persist:transaction
    record_bounds: bee.threads.records:bounds
- name: lifecycle
  kind: library.lua
  source: file://lifecycle.lua
  modules: [sql]
  imports:
    bounds: bee.values:bounds
    values: bee.threads.records:values
    lifecycle: bee.threads.records:lifecycle
    record_types: bee.threads:record_types
    access: bee.threads.service:access
    reader: bee.threads.persist:reader
    transaction: bee.threads.persist:transaction
    authority: bee.threads.service:authority
    inbox: bee.threads.service:inbox
    record_bounds: bee.threads.records:bounds
- name: app_alias
  kind: library.lua
  source: file://app_alias.lua
  modules: [sql]
  imports:
    bounds: bee.values:bounds
    access: bee.threads.service:access
    reader: bee.threads.persist:reader
    transaction: bee.threads.persist:transaction
- name: sends
  kind: library.lua
  source: file://send.lua
  modules: [sql, hash, json]
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    reader: bee.threads.persist:reader
    transaction: bee.threads.persist:transaction
    authority: bee.threads.service:authority
- name: inbox
  kind: library.lua
  source: file://inbox.lua
  modules: [sql, system, json]
  imports:
    bounds: bee.values:bounds
    access: bee.threads.service:access
    message: bee.threads.records:message
    record: bee.threads.records:record
    reader: bee.threads.persist:reader
    transaction: bee.threads.persist:transaction
    authority: bee.threads.service:authority
    sends: bee.threads.service:sends
    outbox: bee.threads.persist:outbox
- name: outbox
  kind: library.lua
  source: file://outbox.lua
  modules: [sql, json]
  imports:
    bounds: bee.values:bounds
    transaction: bee.threads.persist:transaction
    repository: bee.threads.persist:outbox
- name: pump
  kind: library.lua
  source: file://pump.lua
  imports:
    bounds: bee.values:bounds
- name: pump_sender
  kind: library.lua
  source: file://pump_sender.lua
  meta:
    comment: Fail-closed default forwarding sender; the host replaces the sender requirement to link its transport
- name: pump_worker
  kind: process.lua
  source: file://pump_worker.lua
  method: main
  modules: [process, channel, time, logger]
  imports:
    database: bee.threads.persist:database
    resources: bee.threads.env:resources
    outbox: bee.threads.service:outbox
    pump: bee.threads.service:pump
    bounds: bee.values:bounds
- name: work_store
  kind: library.lua
  source: file://work_store.lua
  modules: [sql, json, hash, uuid, system, time]
  imports:
    budget_values: bee.threads.records:budgets
    access: bee.threads.service:access
    transaction: bee.threads.persist:transaction
    thread_owner: bee.threads.persist:owner
    reader: bee.threads.persist:reader
    record: bee.threads.records:record
    observation: bee.threads.records:observation
    record_types: bee.threads:record_types
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    record_bounds: bee.threads.records:bounds
- name: owner
  kind: process.lua
  source: file://owner.lua
  method: main
  modules: [process, time, channel]
  imports:
    resources: bee.threads.env:resources
    database: bee.threads.persist:database
    owner: bee.threads.persist:owner
    notices: bee.threads.service:notices
    boundary: bee.threads.service:boundary
  security: {policies: []}
- name: owner_service
  kind: process.service
  process: bee.threads.service:owner
  lifecycle:
    security: {policies: []}
    auto_start: true
    restart:
      max_attempts: 10
- name: waiter
  kind: process.lua
  source: file://waiter.lua
  method: main
  modules: [process, channel, time]
  imports:
    waits: bee.threads.delivery:waits
- name: waiter_service
  kind: process.service
  process: bee.threads.service:waiter
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.threads.waiter}
      policies: []
    restart:
      max_attempts: 10
