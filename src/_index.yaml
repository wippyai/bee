version: '1.0'
namespace: bee
entries:
- name: definition
  kind: ns.definition
  meta:
    title: Bee desktop foundation
- name: dependency_persist
  kind: ns.dependency
  component: bee/persist
  version: 0.1.0-dev
- name: dependency_sync
  kind: ns.dependency
  component: bee/sync
  version: 0.1.0-dev
  parameters:
  - name: target_sender
    value: bee.hive.host:replica_sender
  - name: target_exports
    value: bee:sync_exports
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: 0.1.0-dev
- name: dependency_hub
  kind: ns.dependency
  component: bee/hub
  version: 0.1.0-dev
  parameters:
  - name: process_host
    value: bee:workers
- name: dependency_governance
  kind: ns.dependency
  component: bee/governance
  version: 0.1.0-dev
  parameters:
  - name: target_db
    value: bee.governance:db
  - name: target_publication_profiles
    value: bee.governance:publication_profiles
  - name: target_activation_profiles
    value: bee.governance:activation_profiles
  - name: target_approval_request_policy
    value: bee:approval_request_policy
  - name: target_approval_consume_policy
    value: bee:approval_consume_policy
- name: dependency_gateway
  kind: ns.dependency
  component: bee/gateway
  version: 0.1.0-dev
  parameters:
  - name: target_db
    value: bee.gateway:db
  - name: target_listener
    value: bee:gateway_listener
  - name: target_endpoint
    value: bee:gateway_endpoint
  - name: target_hook_storage
    value: bee.harness.host:environment
  - name: target_approval_request_policy
    value: bee:approval_request_policy
  - name: target_approval_consume_policy
    value: bee:approval_consume_policy
  - name: target_tool_read_policy
    value: bee:gateway_tool_read_policy
  - name: target_tool_message_policy
    value: bee:gateway_tool_message_policy
  - name: target_tool_launch_policy
    value: bee:gateway_tool_launch_policy
  - name: target_tool_overlay_policy
    value: bee:gateway_tool_overlay_policy
  - name: target_tool_docs_policy
    value: bee:gateway_tool_docs_policy
  - name: target_tool_components_policy
    value: bee:gateway_tool_components_policy
  - name: target_tool_delivery_policy
    value: bee:gateway_tool_delivery_policy
  - name: target_tool_publish_policy
    value: bee:gateway_tool_publish_policy
  - name: target_tool_application_open_policy
    value: bee:gateway_tool_application_open_policy
- name: dependency_hive
  kind: ns.dependency
  component: bee/hive
  version: 0.1.0-dev
- name: dependency_application
  kind: ns.dependency
  component: bee/application
  version: 0.1.0-dev
- name: dependency_node
  kind: ns.dependency
  component: bee/node
  version: 0.1.0-dev
- name: dependency_docs
  kind: ns.dependency
  component: bee/docs
  version: 0.1.0-dev
  parameters:
  - name: target_corpus
    value: bee:docs_corpus
- name: dependency_resources
  kind: ns.dependency
  component: bee/resources
  version: 0.1.0-dev
  parameters:
  - name: target_db
    value: bee.resources:db
  - name: target_roots
    value: bee:resource_roots
- name: dependency_placement
  kind: ns.dependency
  component: bee/placement
  version: 0.1.0-dev
- name: dependency_credentials
  kind: ns.dependency
  component: bee/credentials
  version: 0.1.0-dev
  parameters:
  - name: target_db
    value: bee.credentials:db
  - name: target_sources
    value: bee:credential_sources
  - name: target_materializer
    value: bee.placement.native:binding
- name: dependency_placement_native
  kind: ns.dependency
  component: bee/placement-native
  version: 0.1.0-dev
  parameters:
  - name: target_db
    value: bee.placement.native:db
  - name: target_root
    value: bee.placement.native:root
  - name: process_host
    value: bee:workers
  - name: target_executor
    value: bee.placement.native:executor
  - name: target_host_files
    value: bee.placement.native:host_files
  - name: target_admitted_roots
    value: bee.placement.native:admitted_roots
  - name: target_resource_mode
    value: bee.placement.native:resource_mode
- name: dependency_harness
  kind: ns.dependency
  component: bee/harness
  version: 0.1.0-dev
  parameters:
  - name: process_host
    value: bee:workers
  - name: target_db
    value: bee.node:db
- name: dependency_approvals
  kind: ns.dependency
  component: bee/approvals
  version: 0.1.0-dev
  parameters:
  - name: target_db
    value: bee.approvals:db
  - name: target_policies
    value: bee:approver_policies
- name: workers
  kind: process.host
  host:
    max_processes: 24
    workers: 4
  lifecycle:
    auto_start: true
- name: workspace_hosts
  kind: process.service
  process: bee.launch:host_manager
  host: bee:workers
  input:
  - {cap: 64, idle_ms: 900000}
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.workspace.hosts}
      policies: [bee:host_policy, bee:local_supervisor_spawn_policy, bee:workspace_host_manager_policy]
  meta:
    comment: Starts a node workspace host when a lease first asks for it, stops it after 15 minutes unleased, and keeps at most 64 live
- name: governance_recovery_service
  kind: process.service
  process: bee.governance.service:recovery
  host: bee:workers
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.governance.activation}
      policies: [bee.governance.security:destination_service_policy]
- name: sync_exports
  kind: registry.entry
  meta:
    type: bee.sync.exports
    comment: Host-selected immutable feeds exported to connected non-client Hive nodes
  data:
    exports:
    - feed: governance.application_versions
      content_kinds: [bee.governance-application-version@2]
- name: capability_catalog
  kind: registry.entry
  meta:
    type: bee.capability_catalog
    comment: Host-owned review vocabulary and templates; declarations are not grants
  data:
    revision: 1
    never: [exec, env, credentials, registry.write, security.policy.write, security.scope.manage, approvals.decide, core.database, lifecycle.auto_start]
    capabilities:
    - id: workspace.files.read
      revision: 1
      parameters: {subpath: relative_subpath}
      text: Read workspace files under {subpath}
      confirm: standard
      operations:
      - {operation: files.read, resource: workspace, scope: {subpath: '$subpath'}}
      resources:
      - {kind: fs.directory, mode: readonly, source: verified_workspace_subroot}
    - id: app.database
      revision: 1
      parameters: {name: name}
      text: Use an isolated application database named {name}
      confirm: standard
      operations:
      - {operation: database.use, resource: '$name', scope: {name: '$name'}}
      resources:
      - {kind: db.sql.sqlite, mode: dedicated, source: host_app_database}
    - id: threads.read
      revision: 1
      parameters: {scope: owned_scope}
      text: Read owned threads
      confirm: standard
      operations:
      - {operation: threads.read, resource: threads, scope: {scope: '$scope'}}
      resources: []
    - id: threads.message
      revision: 1
      parameters: {scope: children_scope}
      text: Message child threads
      confirm: standard
      operations:
      - {operation: threads.message, resource: threads, scope: {scope: '$scope'}}
      resources: []
    - id: agents.launch
      revision: 1
      parameters: {definitions: definitions}
      text: Launch managed agents from {definitions}
      confirm: explicit
      operations:
      - {operation: agents.launch, resource: managed_agents, scope: {definitions: '$definitions'}}
      resources: []
    - id: contract.call
      revision: 1
      parameters: {binding: binding, methods: methods}
      text: Call app binding {binding} using {methods}
      confirm: explicit
      operations:
      - {operation: contract.call, resource: '$binding', scope: {methods: '$methods'}}
      resources:
      - {kind: contract.binding, mode: caller, source: host_selected_binding}
    - id: http.api
      revision: 1
      parameters: {origin: https_origin, methods: http_methods, path_prefix: url_path_prefix}
      text: Send HTTP requests to {origin} at {path_prefix} using {methods}
      confirm: explicit
      operations:
      - {operation: http.request, resource: '$origin', scope: {methods: '$methods', path_prefix: '$path_prefix'}}
      resources:
      - {kind: http.client, mode: scoped, source: host_selected_origin}
    - id: hive.expose
      revision: 1
      parameters: {contract: contract, methods: methods}
      text: Expose Hive contract {contract} using {methods}
      confirm: explicit
      operations:
      - {operation: hive.expose, resource: '$contract', scope: {methods: '$methods'}}
      resources:
      - {kind: contract.binding, mode: hive, source: host_selected_contract}
- name: sync_distribution_policy
  kind: security.policy
  meta:
    comment: Generic immutable feed delivery to connected non-client Hive members
  policy:
    actions: [db.get, registry.get, system.read, hive.invoke, process.registry.lookup,
      process.listen, process.unlisten, process.send]
    resources: '*'
    effect: allow
- name: sync_distribution_service
  kind: process.service
  process: bee.sync.service:distribution_worker
  host: bee:workers
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.sync.distribution}
      policies: [bee:sync_distribution_policy]
- name: terminal
  kind: terminal.host
  hide_logs: true
  lifecycle:
    auto_start: true
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_driver_agy
