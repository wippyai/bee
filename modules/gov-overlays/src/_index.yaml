version: '1.0'
namespace: bee.gov.overlays
entries:
- name: definition
  kind: ns.definition
  module: gov-overlays
  meta:
    title: Bee governance overlays
    comment: Governed overlay review app; host composition and policy selection remain
      in Bee
- name: dependency_gov
  kind: ns.dependency
  component: bee/gov
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: dependency_application
  kind: ns.dependency
  component: bee/application
  version: '*'
- name: client_policy
  kind: security.policy
  meta:
    comment: Overlays calls only the destination-owned governance facade; local review
      is separate from Approvals decisions
  policy:
    actions:
    - funcs.call
    resources:
    - bee.gov.binding:destination_call
    effect: allow
