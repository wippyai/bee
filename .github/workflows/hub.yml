name: Bee Hub publication
# Runs on a tag's draft release, before the release is published: the release
# deployment's packs go to the Hub, then the post-publication check installs a
# real Hub package into that same deployment.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Application release tag whose draft release CI built
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bee-hub-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    environment: hub
    if: startsWith(inputs.tag, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Listing a draft release and its assets requires push access.
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.tag }}
        fetch-depth: 0
        persist-credentials: false
    - name: Validate the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        number='(0|[1-9][0-9]*)'
        identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
        pattern="^v$number\.$number\.$number(-$identifier(\.$identifier)*)?$"
        [[ "$RELEASE_TAG" =~ $pattern ]]
        git merge-base --is-ancestor HEAD origin/main
        test "$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)" = "$RELEASE_TAG"
        release_commit=$(git rev-parse HEAD)
        test "$(gh run list --workflow native.yml --branch "$RELEASE_TAG" --event push --commit "$release_commit" --status success --limit 1 --json databaseId --jq length)" = 1
    - name: Require Hub credentials
      env:
        WIPPY_TOKEN: ${{ secrets.WIPPY_HUB_TOKEN }}
      run: |
        if [ -z "$WIPPY_TOKEN" ]; then
          echo 'Configure WIPPY_HUB_TOKEN with create and publish access to the bee organization.' >&2
          exit 1
        fi
    - name: Build pinned publication runtime
      uses: wippyai/builder@114eb0252a121dd89eca084af5db01833ffff50b
      with:
        mode: toolchain
        manifest: wippy.build.json
        output: .wippy/bin/bee-wippy
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - run: python3 -m pip install -r tests/requirements.txt
    - name: Restore the release deployment
      env:
        GH_TOKEN: ${{ github.token }}
      run: make hub-release-restore TAG="$RELEASE_TAG"
    - name: Publish every Bee module at the release version, then install from the Hub into it
      env:
        WIPPY_TOKEN: ${{ secrets.WIPPY_HUB_TOKEN }}
        HUB_VISIBILITY: ${{ vars.BEE_HUB_VISIBILITY || 'public' }}
      run: make hub-release-publish TAG="$RELEASE_TAG"
