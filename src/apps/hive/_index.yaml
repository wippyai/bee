version: '1.0'
namespace: bee.hive_manager
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: [tty, process, channel, time, uuid, registry, system]
  imports:
    client: bee.application:client
    appearance: bee.desktop:appearance
    model: bee.hive_manager:model
    view: bee.hive_manager:view
    directory: bee.hive_manager:directory
    hive: bee.hive:client
    types: bee.hive:types
  meta:
    type: bee.application
    application:
      api_version: 1
      title: Hive Manager
      icon: H
      lifetime: view
      revision: '1'
      instance_policy: singleton
      group: Tools
      role: hive
      resume_schema: hive_manager.v1
      restart_policy: manual
- name: model
  kind: library.lua
  source: file://model.lua
  modules: [json]
  imports:
    text: bee.application:text
    directory: bee.hive_manager:directory
- name: view
  kind: library.lua
  source: file://view.lua
  modules: [tty]
  imports:
    appearance: bee.desktop:appearance
    model: bee.hive_manager:model
- name: directory
  kind: library.lua
  source: file://directory.lua
  imports:
    types: bee.hive:types
    bounds: bee.hive:bounds
- name: source
  kind: registry.entry
  meta:
    type: bee.hive_manager_source
    comment: The host selects what the manager reads; live asks this node's runtime and supervisor, fixture replays the labeled table below and names it on every frame
  data:
    kind: live
- name: fixture
  kind: registry.entry
  meta:
    type: bee.hive_manager_fixture
    comment: Labeled fixture data for reviewing the manager where owner operations are not wired; read only when the source entry selects fixture
  data:
    label: two-node review fixture
    nodes:
    - {node_id: forge, is_local: true, addr: 100.70.0.69:7946, reachable: true, role: leader, cluster_size: 2}
    - {node_id: laptop, is_local: false, addr: 100.70.10.28:7946, reachable: true, role: follower, cluster_size: 2}
    - {node_id: attic, is_local: false, reachable: false, detail: peer connection ended}
    catalogs:
      forge:
        available: true
        owner_generation: forge-execution-1
        desktops:
        - {workspace_id: 0123456789abcdef0123456789abcdef, desktop_id: fedcba9876543210fedcba9876543210, label: main}
      laptop:
        available: true
        owner_generation: laptop-execution-1
        desktops:
        - {workspace_id: 00112233445566778899aabbccddeeff, desktop_id: ffeeddccbbaa99887766554433221100, label: travel, controller: bee.client.laptop, observers: 1}
- name: names
  kind: registry.entry
  meta:
    type: bee.hive_node_names
    comment: Friendly names the host gives node identities for display and selection; a name authenticates nothing and changes no identity
  data:
    names: {}
- name: client_policy
  kind: security.policy
  meta:
    comment: The manager reads runtime membership and its own host entries; every Hive answer comes from the supervisor under the owner's exposure, and no desktop authority is granted here
  policy:
    actions: [registry.get, system.read]
    resources: [bee.hive_manager:source, bee.hive_manager:fixture, bee.hive_manager:names, cluster]
    effect: allow
