version: '1.0'
namespace: bee.files
entries:
- name: definition
  kind: ns.definition
  module: files
  readme: file://README.md
  meta:
    title: Bee files application
    comment: File tree and highlighted syntax preview application; UI resides in child bee.files.app
- name: dependency_application
  kind: ns.dependency
  component: bee/application
  version: '*'
- name: target_workspace_root
  kind: ns.requirement
  meta:
    comment: Host-selected read-only workspace filesystem; the host separately grants acquisition
  targets:
  - entry: bee.files:workspace_root_ref
    path: .resource_ref
- name: workspace_root_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
- name: protocol
  kind: library.lua
  source: file://protocol.lua
- name: gitignore
  kind: library.lua
  source: file://gitignore.lua
- name: tree
  kind: library.lua
  source: file://tree.lua
  imports:
    protocol: bee.files:protocol
    gitignore: bee.files:gitignore
- name: syntax
  kind: library.lua
  source: file://syntax.lua
  modules: [treesitter]
  imports:
    appearance: bee.application:appearance
