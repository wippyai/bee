version: '1.0'
namespace: bee.tests.driver
entries:
- name: fixtures
  kind: fs.directory
  meta:
    type: test_support
    comment: The bee/drivers module's recorded CLI streams, which the runner copies from drivers/test/fixtures
  directory: ./fixtures/drivers
- name: login_evidence_test
  kind: function.lua
  source: file://login_evidence_test.lua
  method: run
  modules: [registry]
  meta: {type: test, suite: bee}
  imports:
    principals: bee.tests.support.principals:bound
    bounds: bee.drivers.values:bounds
    test: wippy.test:test
    codex_launch: bee.tests.support.driver:codex_launch
    claude_launch: bee.tests.support.driver:claude_launch
    agy_launch: bee.tests.support.driver:agy_launch
    grok_launch: bee.tests.support.driver:grok_launch
    muse_launch: bee.tests.support.driver:muse_launch
    opencode_launch: bee.tests.support.driver:opencode_launch
    provider_projection: bee.placement.native.service:provider_projection
    formats: bee.drivers.credentials:format
    driver_types: bee.drivers:types
    universal: bee.drivers.binding:universal
    materialization: bee.placement.native.service:materialization
    placement_types: bee.placement:types
- name: docker_probe_test
  kind: function.lua
  source: file://docker_probe_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry, json]
  security: {policies: [bee.tests.driver:docker_probe_policy, bee.harness.security:launch_locate_probe_policy]}
  imports: {test: wippy.test:test, probe: bee.placement.docker.service:runtime_probe, bounds: bee.drivers.values:bounds, locate: bee.harness.launch:locate}
- name: docker_probe_policy
  kind: security.policy
  meta: {type: test_support}
  policy: {actions: [registry.get, registry.snapshot, registry.apply, funcs.call], resources: '*', effect: allow}
- name: docker_probe_facts
  kind: registry.entry
  meta: {type: test_support}
  data: {present: true, calls: 0, digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, help: '--model --permission-mode --allowedTools --disallowedTools --append-system-prompt-file'}
- name: docker_capabilities_fixture
  kind: function.lua
  source: file://docker_capabilities_fixture.lua
  method: handle
  meta: {type: test_support}
  modules: [registry]
  security: {policies: [bee.tests.driver:docker_probe_policy]}
  imports: {bounds: bee.drivers.values:bounds}
- name: option_coverage_cases
  kind: library.lua
  source: file://option_coverage_cases.lua
- name: option_coverage_test
  kind: function.lua
  source: file://option_coverage_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: 60s}
  modules: [registry, json, toml]
  security: {policies: [bee.tests.harness.profiles:repair_policy]}
  imports:
    placement_profiles: bee.placement.profiles:profiles
    test: wippy.test:test
    cases: bee.tests.driver:option_coverage_cases
    descriptors: bee.drivers.descriptor:descriptor
    effective: bee.drivers.descriptor:effective
    universal: bee.drivers.binding:universal
    configuration: bee.drivers.binding:configuration
    controls: bee.harness.app:option_controls
    profiles: bee.drivers.descriptor:profile_values
    protocol: bee.harness.profiles:protocol
    bounds: bee.drivers.values:bounds
    canonical: bee.drivers.values:canonical
- name: allowall_test
  modules: [registry]
  kind: function.lua
  source: file://allowall_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    descriptors: bee.drivers.descriptor:descriptor
    effective: bee.drivers.descriptor:effective
    universal: bee.drivers.binding:universal
    profiles: bee.harness.profiles:protocol
    profile_values: bee.drivers.descriptor:profile_values
    bounds: bee.drivers.values:bounds
    placement_profiles: bee.placement.profiles:profiles
- name: option_profile_coverage_test
  kind: function.lua
  source: file://option_coverage_test.lua
  method: profiles
  meta: {type: test, suite: bee, timeout: 60s}
  modules: [registry, json, toml]
  security: {policies: [bee.tests.harness.profiles:repair_policy]}
  imports:
    placement_profiles: bee.placement.profiles:profiles
    test: wippy.test:test
    cases: bee.tests.driver:option_coverage_cases
    descriptors: bee.drivers.descriptor:descriptor
    effective: bee.drivers.descriptor:effective
    universal: bee.drivers.binding:universal
    configuration: bee.drivers.binding:configuration
    controls: bee.harness.app:option_controls
    profiles: bee.drivers.descriptor:profile_values
    protocol: bee.harness.profiles:protocol
    bounds: bee.drivers.values:bounds
    canonical: bee.drivers.values:canonical
- name: route_hooks_test
  kind: function.lua
  source: file://route_hooks_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry]
  imports:
    test: wippy.test:test
    resolver: bee.drivers.binding:resolver
    bounds: bee.drivers.values:bounds
- name: saved_profiles_test
  kind: function.lua
  source: file://saved_profiles_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry, json]
  imports:
    test: wippy.test:test
    descriptors: bee.drivers.descriptor:descriptor
    effective: bee.drivers.descriptor:effective
    universal: bee.drivers.binding:universal
    profiles: bee.harness.profiles:protocol
    bounds: bee.drivers.values:bounds
- name: ambient_configuration_test
  kind: function.lua
  source: file://ambient_configuration_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [json, toml, hash]
  imports:
    test: wippy.test:test
    render: bee.drivers.binding:option_render
    configuration: bee.drivers.binding:configuration
    materializer: bee.placement.native.env:configuration
    bounds: bee.drivers.values:bounds
    configuration_types: bee.drivers:configuration_types
- name: muse_placement_test
  kind: function.lua
  source: file://muse_placement_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [json, registry]
  imports:
    test: wippy.test:test
    bounds: bee.drivers.values:bounds
    configuration: bee.drivers.muse.binding:configuration
    placement_configuration: bee.placement.native.env:configuration
    placement_types: bee.placement:types
