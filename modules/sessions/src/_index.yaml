version: '1.0'
namespace: bee.sessions
entries:
- name: definition
  kind: ns.definition
  module: sessions
  readme: file://README.md
  meta:
    title: Bee sessions
    comment: Durable session launch contracts, host-selected executors, location and scheduling
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: dependency_harness
  kind: ns.dependency
  component: bee/harness
  version: '*'
- name: target_threads_journal
  kind: ns.requirement
  default: bee.threads:journal_local
  meta:
    comment: Host-selected binding for the canonical Threads journal contract
  targets:
  - entry: bee.sessions:threads_journal_ref
    path: .data.ref
- name: threads_journal_ref
  kind: registry.entry
  meta:
    type: bee.sessions.threads_journal_ref
    comment: The host-selected Threads journal contract binding
- name: executor_selection
  kind: registry.entry
  meta:
    type: bee.sessions.executor_selection
    comment: The host-selected executor binding refs
  data:
    refs: [bee.sessions.binding:external_executor_binding]
- name: threads_journal
  kind: library.lua
  source: file://threads_journal.lua
  modules: [registry, funcs]
  imports:
    scheduler: bee.sessions.service:scheduler
- name: owner
  kind: library.lua
  source: file://owner.lua
  modules: [registry, funcs, security]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    journal: bee.sessions:threads_journal
    admission: bee.harness.launch:admission
    catalog_service: bee.sessions.service:catalog
- name: executor_registry
  kind: library.lua
  source: file://executor_registry.lua
  modules: [registry, funcs]
  imports:
    scheduler: bee.sessions.service:scheduler
- name: contract
  kind: contract.definition
  methods:
  - {name: open, description: Open a reusable managed session}
  - {name: run, description: Open a session and queue its first work item}
  - {name: send, description: Durably queue work for a session}
  - {name: await, description: Observe work or operation state}
  - {name: join, description: Join an exact ordered set of work items}
  - {name: get, description: Read an exact session, work or operation}
  - {name: list, description: List durable sessions independently of executor readiness}
  - {name: cancel, description: Request evidence-backed work cancellation}
  - {name: close, description: Seal a session and reconcile its cleanup}
- name: catalog
  kind: contract.definition
  methods:
  - {name: list, description: List admitted definitions and profiles with executor readiness}
- name: executor
  kind: contract.definition
  methods:
  - {name: run_turn, description: Execute one accepted work turn through the selected driver and placement}
