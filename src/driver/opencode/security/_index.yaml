version: '1.0'
namespace: bee.driver.opencode.security
entries:
- name: launch_policy_opencode_batch
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected non-interactive OpenCode batch policy for bounded research actions on a caller-owned thread
  data:
    schema_revision: bee.launch-policy@3
    allowed_overrides:
    - thread
    - workdir
    required_cleanup: process_group
    required_exit_observation: independent

    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables: {}
    executable_env:
      opencode: bee.driver.opencode.env:executable
    environment: {}
    allow_host_home: false
    gateway_tools:
    - session_catalog
    - session_open
    - session_run
    - session_send
    - session_await
    - session_join
    - session_get
    - session_list
    - session_cancel
    - session_close
    - thread_read
    - thread_message
    gateway_hooks: []
    prepare_options: {}
    placement_profiles:
    - bee.placement.profiles:native
    - bee.placement.docker.profiles:coding
    profile_restrictions: {}
    profile_instructions: true
- name: launch_policy_opencode_window
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected executable binding for the component-owned OpenCode window; missing host executable leaves the
      declaration unavailable
  data:
    schema_revision: bee.launch-policy@3
    allowed_overrides:
    - thread
    - workdir
    required_cleanup: process_group
    required_exit_observation: independent

    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables: {}
    executable_env:
      opencode: bee.driver.opencode.env:executable
    environment: {}
    allow_host_home: true
    gateway_tools:
    - session_catalog
    - session_open
    - session_run
    - session_send
    - session_await
    - session_join
    - session_get
    - session_list
    - session_cancel
    - session_close
    - thread_read
    - thread_message
    - capabilities
    - overlay
    - docs
    - components
    - delivery
    - tests
    gateway_hooks: []
    prepare_options: {}
    placement_profiles:
    - bee.placement.profiles:native
    - bee.placement.docker.profiles:coding
    profile_restrictions: {}
    profile_instructions: true
