version: '1.0'
namespace: bee.driver.claude.permission
entries:
- name: permission_adapter
  kind: registry.entry
  meta:
    type: harness.permission_adapter
    comment: The Claude Code stream-json control protocol for interactive permissions, captured from the executable; profiles pin its digest, hosts enable it per
      launch policy
  data:
    adapter:
      schema_revision: bee.permission-adapter@2
      event_name: claude.control_request
      event_revision: stream-json-2
      request:
        correlation: request_id
        tool: request.tool_name
        input: request.input
        prompt: request.description
        acknowledgment: request.tool_use_id
      response:
        envelope:
          type: control_response
          response:
            subtype: success
        correlation_field: response.request_id
        decision_field: response.response.behavior
        allow_value: allow
        deny_value: deny
        reason_field: response.response.message
      acknowledgment:
        mode: correlation_echo
        event_type: tool.result
        field: call_id
      deny_acknowledgment:
        mode: terminal_denial
        event_type: tool.result
        field: outcome
        value: failed
        correlation_field: call_id
      cancellation: deny_before_close
      proof_fixture: control
