version: '1.0'
namespace: bee.terminal
entries:
- name: main
  kind: process.lua
  source: file://main.lua
  method: main
  modules: [tty, process, channel, time, uuid, ctx]
  imports:
    model: bee.desktop:model
    decode: bee.protocol:decode
    layout: bee.desktop:layout
    render: bee.terminal:render
    bindings: bee.terminal:bindings
    menu: bee.terminal:menu
    appearance: bee.desktop:appearance
- name: render
  kind: library.lua
  source: file://render.lua
  modules: [tty]
  imports:
    model: bee.desktop:model
    layout: bee.desktop:layout
    appearance: bee.desktop:appearance
    chrome: bee.terminal:chrome
    bar: bee.terminal:bar
    window_chrome: bee.terminal:window_chrome
    menu: bee.terminal:menu
- name: bindings
  kind: library.lua
  source: file://bindings.lua
- name: chrome
  kind: library.lua
  source: file://chrome.lua
  modules: [tty]
  imports:
    appearance: bee.desktop:appearance
- name: menu
  kind: library.lua
  source: file://menu.lua
  modules: [tty]
  imports:
    model: bee.desktop:model
    appearance: bee.desktop:appearance
- name: bar
  kind: library.lua
  source: file://bar.lua
  modules: [tty]
  imports:
    model: bee.desktop:model
    appearance: bee.desktop:appearance
- name: window_chrome
  kind: library.lua
  source: file://window_chrome.lua
  modules: [tty]
  imports:
    model: bee.desktop:model
    layout: bee.desktop:layout
    appearance: bee.desktop:appearance
