version: '1.0'
namespace: bee.driver.codex.descriptor
entries:
- name: cli
  kind: registry.entry
  meta:
    type: bee.driver.cli_descriptor
    comment: Codex CLI command, JSONL codec, login evidence and version probe
  data:
    schema_revision: bee.driver.cli-descriptor@3
    provider: codex
    executable: codex
    version_probe:
      argv:
      - --version
      pattern: ([0-9]+[.][0-9]+[.][0-9]+)
    login_evidence:
      command: codex login
      any_of:
      - kind: file_exists
        paths:
        - .codex/auth.json
        variable: CODEX_HOME
        directory: .codex
      - kind: env_present
        names:
        - OPENAI_API_KEY
        - CODEX_API_KEY
      - kind: auth_status
        argv:
        - login
        - status
        success_exit_code: 0
        timeout_ms: 3000
    platform:
      os:
      - linux
      - darwin
      arch:
      - x86_64
      - amd64
      - arm64
      - aarch64
    codec: codex-jsonl
    json_paths:
      resume_id:
      - thread_id
      result_text:
      - item
      - text
      errors:
      - error
      - message
      usage:
      - usage
    configure: codex
    capabilities:
      permission_answers:
        window:
          transport: hook_mcp
          adapter_ref: bee.driver.permission:permission_request_hook
        first_turn:
          transport: provider
          reason: Bee runs codex exec --json with prompt stdin closed; exec has no client approval-response channel. The window uses PermissionRequest hooks. App-server
            JSON-RPC approvals require a different driver mode.
        resume:
          transport: provider
          reason: Bee runs codex exec --json with prompt stdin closed; exec has no client approval-response channel. The window uses PermissionRequest hooks. App-server
            JSON-RPC approvals require a different driver mode.
    options:
      profiles:
      - window
      - batch
      - named_batch
      fields:
        sandbox:
          default: read-only
          invalid: sandbox is not one Bee admits
          path: provider.options.sandbox
          value_schema:
            type: string
            enum:
            - read-only
            - workspace-write
            - danger-full-access
          label: Sandbox
          description: CLI sandbox
          section: advanced
          order: 0
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --sandbox
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - --sandbox
            - field: sandbox
        approval_policy:
          path: provider.options.approval_policy
          value_schema:
            type: string
            enum:
            - on-request
            - never
          label: Approval policy
          description: Codex approval requests
          section: advanced
          order: 2
          contexts:
          - window
          - first_turn
          - resume
          support:
            config_schema_ref: bee.driver.codex.descriptor:cli
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - if: approval_policy
              then:
              - -c
              - format: approval_policy="{approval_policy}"
        resume_ref:
          type: id
          forbid_option: true
          invalid: resume_ref is not an identifier
        gateway_tools:
          type: ids
          default: []
        gateway_hooks:
          type: ids
          transform: presence
          default: []
        effort:
          invalid: effort is not one Bee admits
          path: provider.effort
          value_schema:
            type: string
            enum:
            - low
            - medium
            - high
            - xhigh
            - max
          label: Effort
          description: CLI effort
          section: basic
          order: 4
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --config
          render:
          - kind: argv
            contexts:
            - window
            tokens:
            - if: effort
              then:
              - --config
              - format: model_reasoning_effort="{effort}"
          - kind: argv
            contexts:
            - first_turn
            tokens:
            - if: effort
              then:
              - --config
              - format: model_reasoning_effort="{effort}"
          - kind: argv
            contexts:
            - resume
            tokens:
            - if: effort
              then:
              - --config
              - format: model_reasoning_effort="{effort}"
        config_profile:
          invalid: config_profile must be a plain Codex profile name
          path: provider.options.config_profile
          value_schema:
            type: string
            format: codex_profile
          label: Config profile
          description: CLI config profile
          section: advanced
          order: 5
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --profile
          render:
          - kind: argv
            contexts:
            - window
            tokens:
            - if: config_profile
              then:
              - --profile
              - field: config_profile
          - kind: argv
            contexts:
            - first_turn
            tokens:
            - if: config_profile
              then:
              - --profile
              - field: config_profile
          - kind: argv
            contexts:
            - resume
            tokens:
            - if: config_profile
              then:
              - --profile
              - field: config_profile
        system_prompt_append:
          path: provider.system_prompt_append
          value_schema:
            type: string
            maxLength: 4096
          label: System prompt append
          description: Additional instructions in the session private home
          section: advanced
          order: 100
          contexts:
          - window
          - first_turn
          - resume
          support:
            config_schema_ref: bee.driver.codex.descriptor:cli
          render:
          - kind: config
            contexts:
            - window
            - first_turn
            - resume
            file: .bee/system-prompt-append.txt
            format: text
            path: []
            merge: append
            value:
              field: provider.system_prompt_append
          - kind: config
            contexts:
            - window
            - first_turn
            - resume
            file: .codex/config.toml
            format: toml
            path:
            - developer_instructions
            merge: append
            value:
              field: provider.system_prompt_append
        model:
          path: provider.model
          value_schema:
            type: string
            format: model
            maxLength: 128
          label: Model
          description: Model identifier
          section: basic
          order: 1
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --model
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - if: model
              then:
              - --model
              - field: model
      rules: []
    flags: {}
    argv_templates:
      window:
        argv:
        - render: model
          context: window
        - render: config_profile
          context: window
        - render: effort
          context: window
        - render: sandbox
          context: window
        - if: resume_ref
          then:
          - resume
          - field: resume_ref
        - if: brief
          then:
          - --
          - field: brief
        readiness: terminal:attached
        provider_home_private: false
        login: true
      first_turn:
        argv:
        - render: model
          context: first_turn
        - render: config_profile
          context: first_turn
        - render: effort
          context: first_turn
        - exec
        - --json
        - --skip-git-repo-check
        - render: sandbox
          context: first_turn
        - '-'
        stdin:
          field: brief
        stdin_eof: true
        readiness: protocol:thread.started
        provider_home_private: true
      resume:
        argv:
        - render: model
          context: resume
        - render: config_profile
          context: resume
        - render: effort
          context: resume
        - render: sandbox
          context: resume
        - exec
        - resume
        - field: resume_ref
        - --json
        - --skip-git-repo-check
        - '-'
        stdin:
          field: brief
        stdin_eof: true
        readiness: protocol:thread.started
        provider_home_private: true
    provider_home:
      variable: CODEX_HOME
      directory: .codex
      required_profile_file:
        field: config_profile
        variable: CODEX_HOME
        path_template: '{config_profile}.config.toml'
        default_directory: .codex
        window_only: true
      files:
      - source_path: .codex/auth.json
        path: .codex/auth.json
        kind: login
        optional: true
        write_back: true
      - source_path: .codex/config.toml
        path: .codex/.bee-user-config.toml
        kind: config
        optional: true
        write_back: false
        container_content: ''
- name: default_provider
  kind: registry.entry
  meta:
    type: bee.codex_provider
    comment: Built-in account login with Codex's default model; host policy selects this configuration
  data:
    schema_revision: bee.codex-provider@1
    name: openai
    authentication: chatgpt
- name: command
  kind: registry.entry
  meta:
    type: bee.app_command
    comment: CLI command to launch Codex CLI in the agent window
  data:
    name: codex
    definition_id: bee.harness.app:app
    arguments:
    - bee.driver.codex.profiles:default_window
    fullscreen: true
