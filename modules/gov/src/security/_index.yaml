version: '1.0'
namespace: bee.governance.security
entries:
- name: destination_facade_policy
  kind: security.policy.expr
  meta:
    comment: The facade may enter the private destination scope and call its backend; it holds no store, registry or overlay grant of its own
  policy:
    expression: '(action == "funcs.security" && resource == "security") || (action == "security.policy_group.get" && resource == "bee.governance.security:destination_execution_scope") || (action == "funcs.call" && resource == "bee.governance.binding:destination_backend_call")'
    actions: [funcs.security, security.policy_group.get, funcs.call]
    resources: [security, bee.governance.security:destination_execution_scope, bee.governance.binding:destination_backend_call]
    effect: allow
- name: staging_policy
  kind: security.policy
  groups: [workspace_execution_scope]
  policy:
    actions: [registry.get, system.read]
    resources: [bee.governance:database_ref, node]
    effect: allow
- name: staging_database_policy
  kind: security.policy
  groups: [workspace_execution_scope]
  policy:
    actions: [db.get]
    resources: [bee.governance:db]
    effect: allow
- name: workspace_execution_policy
  kind: security.policy
  groups: [workspace_execution_scope]
  policy:
    actions: [bee.governance.workspace.execute]
    resources: [bee.governance.binding:workspace_backend_call]
    effect: allow
- name: overlay_facade_policy
  kind: security.policy.expr
  policy:
    expression: '(action == "funcs.security" && resource == "security") || (action == "security.policy_group.get" && resource == "bee.governance.security:workspace_execution_scope") || (action == "funcs.call" && resource == "bee.governance.binding:workspace_backend_call")'
    actions: [funcs.security, security.policy_group.get, funcs.call]
    resources: [security, bee.governance.security:workspace_execution_scope, bee.governance.binding:workspace_backend_call]
    effect: allow
- name: destination_service_policy
  kind: security.policy
  groups: [destination_execution_scope]
  meta: {comment: Private dependencies of the destination owner; callers still need an exact workspace delivery action}
  policy:
    actions: [db.get, registry.get, registry.preview, system.read, funcs.call, funcs.security, security.actor.create, security.scope.create, security.policy.get, registry.overlay.get, registry.overlay.apply, registry.overlay.create.*, registry.overlay.update.*, registry.overlay.delete.*]
    resources: '*'
    effect: allow
- name: destination_execution_policy
  kind: security.policy
  groups: [destination_execution_scope]
  meta: {comment: Proof that a caller entered the private destination scope; nothing else grants this action}
  policy:
    actions: [bee.governance.delivery.execute]
    resources: [bee.governance.binding:destination_backend_call]
    effect: allow
- name: publication_service_policy
  kind: security.policy
  meta: {comment: Private host resources for publishing one configured local overlay as immutable Sync content}
  policy:
    actions: [registry.get, registry.overlay.get, db.get, system.read]
    resources: '*'
    effect: allow
- name: publication_profiles_read_policy
  kind: security.policy
  meta: {comment: The selected publication-profile entry readable by the delivery facade}
  policy:
    actions: [registry.get]
    resources: [bee.governance:publication_profiles]
    effect: allow
- name: delivery_facade_policy
  kind: security.policy
  meta: {comment: Public delivery facade dependencies; profile access is injected as one exact host-selected entry}
  policy:
    actions: [funcs.call, security.actor.get, registry.get]
    resources: [bee.governance.binding:publication_call, bee.governance.binding:destination_call, bee.governance.registry:publication_profiles_ref]
    effect: allow
