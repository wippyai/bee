version: '1.0'
namespace: bee.harness.catalog
entries:
- name: activation_test
  kind: function.lua
  source: file://activation_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    activation: bee.harness.catalog:activation
- name: fake_binding
  kind: contract.binding
  meta:
    type: harness.driver
    driver_id: fake
    test_support: true
    profiles_ref: bee.harness.catalog:fake_profiles
  contracts:
  - contract: bee.driver:driver
    methods:
      prepare: bee.driver.claude:prepare
      dispatch: bee.driver.claude:dispatch
      normalize: bee.driver.claude:normalize
- name: fake_profiles
  kind: registry.entry
  meta:
    type: harness.profile
    driver_ref: bee.harness.catalog:fake_binding
    test_support: true
  data:
    driver:
      schema_revision: bee.driver@1
      kind: harness
      title: Fake harness
      implementation_version: 0.1.0
      default_profile: batch
      profiles:
      - id: batch
        mode: batch
        protocol: stream-json
        protocol_revision: fake-1
        answer_path: {strategy: terminal_field, adapter_ref: bee.driver.claude:protocol}
- name: orphan_binding
  kind: contract.binding
  meta:
    type: harness.driver
    driver_id: orphan
    test_support: true
    profiles_ref: bee.harness.catalog:missing_profiles
  contracts:
  - contract: bee.driver:driver
    methods:
      prepare: bee.driver.claude:prepare
      dispatch: bee.driver.claude:dispatch
      normalize: bee.driver.claude:normalize
- name: apply_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [registry.apply, process.terminate]
    resources: '*'
    effect: allow
- name: classify_test
  kind: function.lua
  source: file://classify_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    classify: bee.harness.catalog:classify
    permission: bee.harness.permission:adapter

- name: catalog_test
