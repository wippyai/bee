version: '1.0'
namespace: bee.componentproof
entries:
- name: database
  kind: security.policy
  policy:
    actions: [db.get]
    resources: [bee.env:workspace_db]
    effect: allow
- name: configuration
  kind: security.policy
  policy:
    actions: [registry.get]
    resources: [bee.workspace.persist:store]
    effect: allow
- name: records
  kind: process.lua
  source: file://records.lua
  method: main
  modules: [logger]
  imports:
    store: bee.workspace.persist:store
    catalog: bee.workspace.persist:catalog
    assignments: bee.workspace.persist:assignments
    thread_bindings: bee.workspace.persist:thread_bindings
  meta:
    command:
      name: workspace-component-records
      short: Workspace owner restore records
      security:
        actor: {id: workspace-component-proof}
        policies: [bee.componentproof:database, bee.componentproof:configuration]
