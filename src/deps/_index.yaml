  version: 0.1.0-dev
- name: threads_timeline
  kind: ns.dependency
  meta: {independent: true}
  component: bee/threads-timeline
  version: 0.1.0-dev
- name: workspace_manager
  kind: ns.dependency
  meta: {independent: true}
  component: bee/workspace-manager
  version: 0.1.0-dev
- name: host_processes
  kind: ns.dependency
  meta: {independent: true}
  component: bee/host-processes
  version: 0.1.0-dev
- name: hub_modules
  kind: ns.dependency
  component: bee/hub-modules
  version: 0.1.0-dev
- name: gov_overlays
  kind: ns.dependency
