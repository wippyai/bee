version: '1.0'
namespace: bee.gov
entries:
- name: definition
  kind: ns.definition
  module: gov
  readme: file://README.md
  meta:
    title: Bee governance authoring
    comment: Caller-owned migrated staging, measured-closure checks and durable overlay activation
- name: dependency_persist
  kind: ns.dependency
  component: bee/persist
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: dependency_sync
  kind: ns.dependency
  component: bee/sync
  version: '*'
- name: dependency_approvals
  kind: ns.dependency
  component: bee/approvals
  version: '*'
- name: dependency_hub
  kind: ns.dependency
  component: bee/hub
  version: '*'
- name: preflight
  kind: library.lua
  source: file://preflight.lua
  modules: [hash, json]
  imports: {canonical: bee.sync:canonical}
- name: capability_catalog
  kind: library.lua
  source: file://capability_catalog.lua
- name: capability_containment
  kind: library.lua
  source: file://capability_containment.lua
- name: capability_grants
  kind: library.lua
  source: file://capability_grants.lua
  modules: [hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.sync:canonical
    capability_catalog: bee.gov:capability_catalog
    capability_containment: bee.gov:capability_containment
- name: delivery_protocol
  kind: library.lua
  source: file://delivery_protocol.lua
  imports: {bounds: bee.threads.records:bounds}
- name: workspace
  kind: library.lua
  source: file://workspace.lua
  modules: [hash]
  imports: {canonical: bee.sync:canonical}
- name: workspace_protocol
  kind: library.lua
  source: file://workspace_protocol.lua
  modules: [base64]
  imports: {bounds: bee.threads.records:bounds}
- name: candidate
  kind: library.lua
  source: file://candidate.lua
  modules: [hash, json]
  imports: {canonical: bee.sync:canonical, workspace: bee.gov:workspace}
- name: artifact
  kind: library.lua
  source: file://artifact.lua
  modules: [hash, json]
  imports: {canonical: bee.sync:canonical}
- name: governed_application_admission
  kind: library.lua
  source: file://application_admission.lua
  modules: [hash, json]
  imports: {canonical: bee.sync:canonical, bounds: bee.threads.records:bounds}
- name: delivery
  kind: library.lua
  source: file://delivery.lua
  modules: [json, hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.sync:canonical
    artifact: bee.gov:artifact
    version: bee.sync:version
- name: target_db
  kind: ns.requirement
  default: bee.gov:db
  meta: {comment: Host-selected SQLite store for private overlays and frozen content}
  targets:
  - entry: bee.gov:database_ref
    path: .resource_ref
  - entry: bee.gov.security:staging_database_policy
    path: .policy.resources
- name: database_ref
  kind: registry.entry
  meta: {type: bee.resource_ref}
- name: environment
  kind: env.storage.os
  lifecycle: {auto_start: true}
- name: db_path
  kind: env.variable
  storage: bee.gov:environment
  variable: BEE_GOVERNANCE_DB
  default: .wippy/governance.db
  readonly: true
- name: db
  kind: db.sql.sqlite
  file: ${env:bee.gov:db_path}
  lifecycle: {auto_start: true}
- name: activation_measure
  kind: library.lua
  source: file://activation_measure.lua
  modules: [hash, json]
  imports:
    artifact: bee.gov:artifact
    preflight: bee.gov:preflight
    migration_work: bee.gov:migration_work
    application_admission: bee.gov:governed_application_admission
    canonical: bee.sync:canonical
    bounds: bee.threads.records:bounds
- name: migration_work
  kind: library.lua
  source: file://migration_work.lua
  modules: [hash, json]
  imports:
    artifact: bee.gov:artifact
    canonical: bee.sync:canonical
    preflight: bee.gov:preflight
- name: target_publication_profiles
  kind: ns.requirement
  meta: {comment: Host-selected publication profiles; the host supplies bee.env:gov_publication_profiles}
  targets:
  - entry: bee.gov:publication_profiles_ref
    path: .resource_ref
  - entry: bee.gov.security:publication_profiles_read_policy
    path: .policy.resources
- name: target_activation_profiles
  kind: ns.requirement
  meta: {comment: Host-selected activation profiles; the host supplies bee.env:gov_activation_profiles}
  targets:
  - entry: bee.gov:activation_profiles_ref
    path: .resource_ref
- name: target_approval_request_policy
  kind: ns.requirement
  meta: {comment: Host-selected approval request policy for the fixed activation actor; absent selection fails closed}
  targets:
  - entry: bee.gov:approval_request_policy_ref
    path: .resource_ref
- name: target_approval_consume_policy
  kind: ns.requirement
  meta: {comment: Host-selected approval consume policy for the fixed activation actor; absent selection fails closed}
  targets:
  - entry: bee.gov:approval_consume_policy_ref
    path: .resource_ref
- name: activation_profile_decoder
  kind: library.lua
  source: file://activation_profiles.lua
  modules: [hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.sync:canonical
    application_admission: bee.gov:governed_application_admission
    workspace_applications: bee.gov:workspace_applications
    capability_grants: bee.gov:capability_grants
    capability_catalog: bee.gov:capability_catalog
- name: workspace_applications
  kind: library.lua
  source: file://workspace_applications.lua
- name: publication_profile_decoder
  kind: library.lua
  source: file://publication_profiles.lua
  imports:
    bounds: bee.threads.records:bounds
    workspace_applications: bee.gov:workspace_applications
- name: delivery_contract
  kind: contract.definition
  methods:
  - name: call
    description: Discover, stage, review, select and locally activate overlay versions for one destination workspace
- name: delivery_local
  kind: contract.binding
  contracts:
  - contract: bee.gov:delivery_contract
    methods: {call: bee.gov.binding:destination_call}
- name: overlay_contract
  kind: contract.definition
  methods:
  - name: call
    description: Author a caller-owned overlay with revision checks; freeze content without executing or approving it
- name: overlay_local
  kind: contract.binding
  contracts:
  - contract: bee.gov:overlay_contract
    methods: {call: bee.gov.binding:overlay_call}
- name: materializer
  kind: library.lua
  source: file://materializer.lua
  modules: [registry, hash]
  imports:
    artifact: bee.gov:artifact
    application_admission: bee.gov:governed_application_admission
    capability_grants: bee.gov:capability_grants
    canonical: bee.sync:canonical
    bounds: bee.threads.records:bounds
- name: hub_resolver
  kind: library.lua
  source: file://hub_resolver.lua
  modules: [registry, hash]
  imports:
    artifact: bee.gov:artifact
    canonical: bee.sync:canonical
    bounds: bee.threads.records:bounds
    application_admission: bee.gov:governed_application_admission
- name: overlay_resolver
  kind: library.lua
  source: file://overlay_resolver.lua
  modules: [registry, hash]
  imports:
    artifact: bee.gov:artifact
    canonical: bee.sync:canonical
    bounds: bee.threads.records:bounds
    application_admission: bee.gov:governed_application_admission
    capability_catalog: bee.gov:capability_catalog
    capability_grants: bee.gov:capability_grants
- name: staging_resources
  kind: library.lua
  source: file://staging_resources.lua
  modules: [registry]
  imports: {bounds: bee.threads.records:bounds}
- name: publication_profiles_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Host-selected publication profiles; absent link fails closed}
- name: activation_profiles_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Host-selected activation profiles; absent link fails closed}
- name: approval_request_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Host-selected approval request policy; absent link fails closed}
- name: approval_consume_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Host-selected approval consume policy; absent link fails closed}
