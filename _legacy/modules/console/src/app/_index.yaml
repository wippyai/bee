version: '1.0'
namespace: bee.console.app
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules:
  - tty
  - exec
  - process
  - channel
  imports:
    client: bee.app:client
    command: bee.console.app:command
  meta:
    type: bee.app
    application:
      api_version: 1
      title: Terminal
      icon: '>'
      lifetime: view
      revision: '1'
      instance_policy: multiple
      group: ''
      role: terminal
      commands:
      - name: terminal
        fullscreen: true
- name: command
  kind: library.lua
  source: file://command.lua
