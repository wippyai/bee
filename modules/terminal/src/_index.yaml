version: '1.0'
namespace: bee.terminal
entries:
- name: definition
  kind: ns.definition
  module: terminal
  readme: file://README.md
  meta:
    title: Bee terminal
    comment: Replaceable presenter, shell view helpers and asynchronous viewport delivery;
      host owns the physical display
- name: dependency_application
  kind: ns.dependency
  component: bee/application
  version: '*'
- name: dependency_desktop
  kind: ns.dependency
  component: bee/desktop
  version: '*'
- name: target_application_protocol
  kind: ns.requirement
  targets:
  - entry: bee.terminal.service:main
    path: .imports.contract
  - entry: bee.terminal:workspace_menu
    path: .imports.contract
- name: target_protocol_decode
  kind: ns.requirement
  targets:
  - entry: bee.terminal.service:main
    path: .imports.decode
- name: target_display_transfer
  kind: ns.requirement
  targets:
  - entry: bee.terminal.service:main
    path: .imports.display_transfer
  - entry: bee.terminal:render
    path: .imports.display_transfer
  - entry: bee.terminal:menu
    path: .imports.display_transfer
- name: connection
  kind: library.lua
  source: file://connection.lua
  modules:
  - tty
  imports:
    appearance: bee.ui:appearance
    names: bee.app:names
- name: selection
  kind: library.lua
  source: file://selection.lua
  modules:
  - tty
- name: workspace_menu
  kind: library.lua
  source: file://workspace_menu.lua
  modules:
  - tty
  imports:
    appearance: bee.ui:appearance
    names: bee.app:names
    contract: bee.protocol:application
- name: render
  kind: library.lua
  source: file://render.lua
  modules:
  - tty
  imports:
    frame: bee.ui:frame
    title_editor: bee.terminal:title_editor
    dialog: bee.terminal:dialog
    model: bee.desktop:model
    layout: bee.desktop:layout
    appearance: bee.ui:appearance
    connection: bee.terminal:connection
    workspace_menu: bee.terminal:workspace_menu
    chrome: bee.terminal:chrome
    bar: bee.terminal:bar
    window_chrome: bee.terminal:window_chrome
    menu: bee.terminal:menu
    selection: bee.terminal:selection
    surface: bee.app.threads.types:status_surface
    display_transfer: bee.protocol:display_transfer
- name: chrome
  kind: library.lua
  source: file://chrome.lua
  modules:
  - tty
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
- name: menu
  kind: library.lua
  source: file://menu.lua
  modules:
  - tty
  imports:
    model: bee.desktop:model
    appearance: bee.ui:appearance
    names: bee.app:names
    display_transfer: bee.protocol:display_transfer
- name: bar
  kind: library.lua
  source: file://bar.lua
  modules:
  - tty
  imports:
    model: bee.desktop:model
    appearance: bee.ui:appearance
    surface: bee.app.threads.types:status_surface
- name: window_chrome
  kind: library.lua
  source: file://window_chrome.lua
  modules:
  - tty
  imports:
    model: bee.desktop:model
    layout: bee.desktop:layout
    appearance: bee.ui:appearance
    surface: bee.app.threads.types:status_surface
- name: title_editor
  kind: library.lua
  source: file://title_editor.lua
  modules:
  - tty
  imports:
    appearance: bee.ui:appearance
- name: dialog
  kind: library.lua
  source: file://dialog.lua
  modules:
  - tty
  imports:
    appearance: bee.ui:appearance
- name: help
  kind: library.lua
  source: file://help.lua
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
