version: '1.0'
namespace: bee.tests.credentials
entries:
- name: custom_key
  kind: env.variable
  storage: bee.tests.credentials:sentinel_storage
  variable: LOCAL_ENDPOINT_API_KEY
  default: ''
  meta:
    type: bee.credential_source
    credential:
      provider: local_endpoint
      format_ref: bee.tests.credentials:custom_format
      workspace_id: '*'
      audience: '*'
      projection_kinds: [environment]
- name: custom_format
  kind: registry.entry
  meta: {type: bee.credential_format, provider: local_endpoint}
  data:
    schema_revision: bee.credential-format@2
    environments: [LOCAL_ENDPOINT_API_KEY]
- name: sentinel_storage
  kind: env.storage.memory
  meta: {type: test_support}
  lifecycle:
    auto_start: true
- name: sentinel_key
  kind: env.variable
  meta: {type: test_support}
  storage: bee.tests.credentials:sentinel_storage
  variable: BEE_TEST_SENTINEL_KEY
  default: sentinel-secret-7f3a9c
  readonly: true
- name: missing_key
  kind: env.variable
  meta: {type: test_support}
  storage: bee.tests.credentials:sentinel_storage
  variable: BEE_TEST_MISSING_KEY
  default: ''
  readonly: true
- name: broken_key
  kind: env.variable
  meta: {type: test_support}
  storage: bee.tests.credentials:sentinel_storage
  variable: BEE_TEST_BROKEN_KEY
  default: "broken\nsecret-9d8e7f"
  readonly: true
- name: other_key
  kind: env.variable
  meta: {type: test_support}
  storage: bee.tests.credentials:sentinel_storage
  variable: BEE_TEST_OTHER_KEY
  default: other-secret-1b2c3d
  readonly: true
- name: codex_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/codex-login-fixture
  auto_init: true
- name: claude_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/claude-login-fixture
  auto_init: true
- name: placement_claude_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/placement-claude-login-fixture
  auto_init: true
- name: invalid_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/invalid-login-fixture
  auto_init: true
- name: missing_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/missing-login-fixture
  auto_init: true
- name: unprivileged_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/unprivileged-login-fixture
  auto_init: true
- name: unreadable_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/missing-login-fixture
  mode: '0100'
  auto_init: true
- name: fs_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [fs.get, fs.read, fs.write]
    resources: [bee.tests.credentials:codex_login_fixture, bee.tests.credentials:claude_login_fixture, bee.tests.credentials:placement_claude_login_fixture, bee.tests.credentials:invalid_login_fixture, bee.tests.credentials:missing_login_fixture, bee.tests.credentials:unprivileged_login_fixture]
    effect: allow
- name: probe_direct_fs_read
  kind: function.lua
  source: file://probe_direct_fs_read.lua
  method: handle
  meta: {type: test_support}
  modules: [fs]
- name: apply_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [registry.apply]
    resources: '*'
    effect: allow
- name: client_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.credentials.binding:define, bee.credentials.binding:issue_projection, bee.credentials.binding:check, bee.credentials.binding:renew_attempt, bee.credentials.binding:materialize, bee.credentials.binding:revoke,
      bee.credentials.binding:revoke_all, bee.credentials.binding:list, bee.credentials.binding:capabilities, bee.credentials.binding:availability, bee.tests.credentials:probe_direct_fs_read]
    effect: allow
- name: broker_test
  kind: function.lua
  source: file://broker_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [funcs, registry, time, json, fs, sql]
  security:
    policies: [bee.tests.credentials:apply_test_policy, bee.tests.credentials:fs_test_policy, bee.credentials.security:credential_store_policy]
  imports:
    test: wippy.test:test
    broker_environment_cases: bee.tests.credentials:broker_environment_cases
    broker_login_cases: bee.tests.credentials:broker_login_cases
    broker_setup_cases: bee.tests.credentials:broker_setup_cases
    broker_secrecy_cases: bee.tests.credentials:broker_secrecy_cases
    support: bee.tests.credentials:broker_fixture
- name: approved_login_fixture
  kind: function.lua
  source: file://login_fixtures.lua
  method: approved
  meta: {type: test_support}
- name: claiming_login_fixture
  kind: function.lua
  source: file://login_fixtures.lua
  method: claiming
  meta: {type: test_support}
- name: sources_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.tests.credentials:approved_login_fixture, bee.tests.credentials:claiming_login_fixture]
    effect: allow
- name: sources_test
  kind: function.lua
  source: file://sources_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry]
  security:
    policies: [bee.tests.credentials:apply_test_policy, bee.tests.credentials:sources_test_policy]
  imports:
    test: wippy.test:test
    bounds: bee.drivers.values:bounds
    sources: bee.credentials.binding:sources
- name: configuration_setup_test
  kind: function.lua
  source: file://configuration_setup_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [hash]
  security:
    policies: [bee.credentials.security:credential_store_policy]
  imports:
    approval_principals: bee.tests.approvals:test_principals
    store: bee.credentials.persist:store
    bounds: bee.drivers.values:bounds
    test: wippy.test:test
    configuration_admission: bee.credentials:configuration_admission

- name: configuration_catalog_client
  kind: security.policy
  policy:
    actions: [funcs.call]
    resources: [bee.threads.sessions.binding:catalog]
    effect: allow

- name: configuration_effect_client
  kind: security.policy
  policy:
    actions: [funcs.call, bee.approvals.own]
    resources: [bee.approvals.binding:effect, bee.approvals.binding:revalidate, credentials.configuration]
    effect: allow
- name: broker_fixture
  kind: library.lua
  meta:
    type: test_support
  source: file://broker_fixture.lua
  modules:
  - fs
  - funcs
  - json
  - registry
  - time
  imports:
    bounds: bee.drivers.values:bounds
    principals: bee.tests.support.principals:bound
    test: wippy.test:test
    credential_protocol: bee.credentials:protocol
    store: bee.credentials.persist:store
    shared_authority: bee.tests.support:authority
- name: broker_environment_cases
  kind: library.lua
  meta:
    type: test_support
  source: file://broker_environment_cases.lua
  modules:
  - json
  - registry
  imports:
    bounds: bee.drivers.values:bounds
    principals: bee.tests.support.principals:bound
    test: wippy.test:test
    credential_protocol: bee.credentials:protocol
    store: bee.credentials.persist:store
    support: bee.tests.credentials:broker_fixture
- name: broker_login_cases
  kind: library.lua
  meta:
    type: test_support
  source: file://broker_login_cases.lua
  modules:
  - fs
  - registry
  imports:
    bounds: bee.drivers.values:bounds
    principals: bee.tests.support.principals:bound
    test: wippy.test:test
    support: bee.tests.credentials:broker_fixture
- name: broker_setup_cases
  kind: library.lua
  meta:
    type: test_support
  source: file://broker_setup_cases.lua
  modules:
  - fs
  - registry
  imports:
    bounds: bee.drivers.values:bounds
    principals: bee.tests.support.principals:bound
    test: wippy.test:test
    support: bee.tests.credentials:broker_fixture
- name: broker_secrecy_cases
  kind: library.lua
  meta:
    type: test_support
  source: file://broker_secrecy_cases.lua
  modules:
  - json
  imports:
    test: wippy.test:test
    store: bee.credentials.persist:store
    support: bee.tests.credentials:broker_fixture
- name: format_migration_test_db
  kind: db.sql.sqlite
  meta: {type: test_support}
  file: .wippy/credentials-format-migration-test.db
  lifecycle: {auto_start: true}
- name: format_migration_test
  kind: function.lua
  source: file://format_migration_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [sql, funcs, json]
  imports:
    test: wippy.test:test
    format: bee.drivers.credentials:format
  security:
    policies: [bee.tests.credentials:format_migration_test_policy, bee.tests.support:schema_policy]
- name: format_migration_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [db.get]
    resources: [bee.tests.credentials:format_migration_test_db]
    effect: allow
