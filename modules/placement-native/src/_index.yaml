version: '1.0'
namespace: bee.placement.native
entries:
- name: definition
  kind: ns.definition
  module: placement-native
  readme: file://README.md
  meta:
    title: Bee native placement
    comment: Attempts as native children under a runner process, receipts in an owned SQLite store, homes under a placement root
- name: dependency_placement
  kind: ns.dependency
  component: bee/placement
  version: '*'
- name: dependency_persist
  kind: ns.dependency
  component: bee/persist
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_resources
  kind: ns.dependency
  component: bee/resources
  version: '*'
- name: dependency_credentials
  kind: ns.dependency
  component: bee/credentials
  version: '*'
- name: dependency_gateway
  kind: ns.dependency
  component: bee/gateway
  version: '*'
- name: target_db
  kind: ns.requirement
  meta:
    comment: SQL resource for the receipts store
  default: bee.placement.native:db
  targets:
  - entry: bee.placement.native:database_ref
    path: .resource_ref
- name: target_root
  kind: ns.requirement
  meta:
    comment: Filesystem root that holds attempt homes and retained sessions
  default: bee.placement.native:root
  targets:
  - entry: bee.placement.native:root_ref
    path: .resource_ref
- name: process_host
  kind: ns.requirement
  meta:
    comment: Process host that runs attempt runners and the supervision sweeper
  default: bee:workers
  targets:
  - entry: bee.placement.native:runner_host_ref
    path: .host_ref
  - entry: bee.placement.native:sweeper_service
    path: .host
- name: target_executor
  kind: ns.requirement
  meta:
    comment: Host-selected native executor; a launch request never selects it
  default: bee.placement.native:executor
  targets:
  - entry: bee.placement.native:executor_ref
    path: .resource_ref
- name: target_host_files
  kind: ns.requirement
  meta:
    comment: Host-selected read-only filesystem for executable measurement
  default: bee.placement.native:host_files
  targets:
  - entry: bee.placement.native:host_files_ref
    path: .resource_ref
- name: target_admitted_roots
  kind: ns.requirement
  meta:
    comment: Host-selected admissible resource roots; a launch request cannot choose this policy
  default: bee.placement.native:admitted_roots
  targets:
  - entry: bee.placement.native:admitted_roots_ref
    path: .resource_ref
- name: target_resource_mode
  kind: ns.requirement
  meta:
    comment: Host-selected placement resource mode; a launch request cannot choose it
  default: bee.placement.native:resource_mode
  targets:
  - entry: bee.placement.native:resource_mode_ref
    path: .resource_ref
- name: database_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked SQL resource; target_db fills resource_ref
- name: root_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked placement root; target_root fills resource_ref
- name: runner_host_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked runner host; process_host fills host_ref
- name: executor_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked native executor; target_executor fills resource_ref
- name: host_files_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked read-only host filesystem; target_host_files fills resource_ref
- name: admitted_roots_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked host placement-roots policy; target_admitted_roots fills resource_ref
- name: resource_mode_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked host resource-mode policy; target_resource_mode fills resource_ref
- name: executable
  kind: library.lua
  source: file://service/executable.lua
  modules: [fs, hash]
  imports:
    resources: bee.placement.native:resources
    types: bee.placement:types
- name: migrations
  kind: library.lua
  source: file://migrations/migrations.lua
- name: resources
  kind: library.lua
  source: file://registry/resources.lua
  modules: [registry, env, system]
- name: store
  kind: library.lua
  source: file://persist/store.lua
  modules: [sql, json, time]
  imports:
    persist: bee.persist:database
    migrations: bee.placement.native:migrations
    resources: bee.placement.native:resources
    types: bee.placement:types
    transitions: bee.placement:transitions
    request_protocol: bee.placement:request
    configuration: bee.driver:configuration
- name: capability
  kind: library.lua
  source: file://service/capability.lua
  modules: [exec]
  imports:
    types: bee.placement:types
    resources: bee.placement.native:resources
- name: homes
  kind: library.lua
  source: file://service/homes.lua
  modules: [fs, hash]
  imports:
    formats: bee.credentials:formats
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    resources: bee.placement.native:resources
- name: identity
  kind: library.lua
  source: file://service/identity.lua
  modules: [exec]
  imports:
    resources: bee.placement.native:resources
- name: protocol
  kind: library.lua
  source: file://protocol.lua
- name: service
  kind: library.lua
  source: file://service/service.lua
  modules: [process, channel, time, security, uuid, json, funcs, registry]
  imports:
    gateway_configuration: bee.gateway.registry:configuration
    configuration: bee.driver:configuration
    preferences: bee.driver:preferences
    resolver: bee.driver:resolver
    placement_resolver: bee.placement.registry:resolver
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    types: bee.placement:types
    request: bee.placement:request
    transitions: bee.placement:transitions
    store: bee.placement.native:store
    executable: bee.placement.native:executable
    resources: bee.placement.native:resources
    capability: bee.placement.native:capability
    homes: bee.placement.native:homes
    identity: bee.placement.native:identity
    protocol: bee.placement.native:protocol
    materialization: bee.placement.native:materialization
- name: configuration
  kind: library.lua
  source: file://configuration.lua
  modules: [json, toml]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    types: bee.placement:types
- name: materialization
  kind: library.lua
  source: file://service/materialization.lua
  modules: [env, fs, funcs, sql, process, hash]
  imports:
    store: bee.placement.native:store
    resources: bee.placement.native:resources
    homes: bee.placement.native:homes
    configuration: bee.placement.native:configuration
    types: bee.placement:types
- name: runner
  kind: process.lua
  source: file://service/runner.lua
  method: main
  modules: [process, channel, time, exec, funcs]
  imports:
    materialization: bee.placement.native:materialization
    store: bee.placement.native:store
    executable: bee.placement.native:executable
    resources: bee.placement.native:resources
    identity: bee.placement.native:identity
    protocol: bee.placement.native:protocol
    quote: bee.driver.kit:quote
    types: bee.placement:types
  security:
    policies: [bee:placement_store_policy, bee:placement_exec_policy, bee:placement_runner_policy, bee:credential_materialize_policy, bee:gateway_materialize_policy]
- name: window
  kind: library.lua
  source: file://service/window.lua
  modules: [process, exec, tty, security, funcs]
  imports:
    protocol: bee.placement.native:protocol
    store: bee.placement.native:store
    resources: bee.placement.native:resources
    materialization: bee.placement.native:materialization
    executable: bee.placement.native:executable
    quote: bee.driver.kit:quote
    types: bee.placement:types
    service: bee.placement.native:service
    bounds: bee.threads.records:bounds
    identity: bee.placement.native:identity
- name: sweeper
  kind: process.lua
  source: file://service/sweeper.lua
  method: main
  modules: [process, channel, time]
  imports:
    service: bee.placement.native:service
- name: sweeper_service
  kind: process.service
  process: bee.placement.native:sweeper
  host: bee:workers
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.placement.sweeper}
      policies: [bee:placement_store_policy, bee:placement_exec_policy, bee:placement_service_policy, bee:resource_resolve_policy, bee:credential_materialize_policy, bee:placement_sweeper_policy, bee:gateway_supervision_policy]
- name: binding
  kind: contract.binding
  contracts:
  - contract: bee.placement:placement
    methods:
      prepare: bee.placement.native:prepare
      start: bee.placement.native:start
      status: bee.placement.native:status
      stop: bee.placement.native:stop
      reconcile: bee.placement.native:reconcile
      cleanup: bee.placement.native:cleanup
      evidence: bee.placement.native:evidence
      attach: bee.placement.native:attach
      capabilities: bee.placement.native:capabilities
      measure_executable: bee.placement.native:measure_executable
      close_stdin: bee.placement.native:close_stdin
  meta:
    type: placement
    placement_kind: native
- name: prepare
  kind: function.lua
  source: file://binding/prepare_method.lua
  method: handle
  imports:
    service: bee.placement.native:service
  security:
    policies: [bee:placement_store_policy, bee:placement_exec_policy, bee:placement_service_policy, bee:resource_resolve_policy, bee:credential_materialize_policy, bee:gateway_supervision_policy]
- name: start
  kind: function.lua
  source: file://binding/start_method.lua
  method: handle
  imports:
    service: bee.placement.native:service
  security:
    policies: [bee:placement_store_policy, bee:placement_exec_policy, bee:placement_service_policy, bee:resource_resolve_policy, bee:credential_materialize_policy, bee:gateway_supervision_policy]
- name: status
  kind: function.lua
  source: file://binding/status_method.lua
  method: handle
  imports:
    service: bee.placement.native:service
  security:
    policies: [bee:placement_store_policy, bee:placement_exec_policy, bee:placement_service_policy, bee:resource_resolve_policy, bee:credential_materialize_policy, bee:gateway_supervision_policy]
- name: stop
  kind: function.lua
  source: file://binding/stop_method.lua
  method: handle
  imports:
    service: bee.placement.native:service
  security:
    policies: [bee:placement_store_policy, bee:placement_exec_policy, bee:placement_service_policy, bee:resource_resolve_policy, bee:credential_materialize_policy, bee:gateway_supervision_policy]
- name: capabilities
  kind: function.lua
  source: file://binding/capabilities_method.lua
  method: handle
  imports:
    service: bee.placement.native:service
  security:
    policies: [bee:placement_store_policy, bee:placement_exec_policy, bee:placement_service_policy, bee:resource_resolve_policy, bee:credential_materialize_policy, bee:gateway_supervision_policy]
- name: measure_executable
  kind: function.lua
  source: file://binding/measure_executable_method.lua
  method: handle
  imports:
    service: bee.placement.native:service
  security:
    policies: [bee:placement_store_policy, bee:placement_exec_policy, bee:placement_service_policy, bee:resource_resolve_policy, bee:credential_materialize_policy, bee:gateway_supervision_policy]
- name: close_stdin
  kind: function.lua
  source: file://binding/close_stdin_method.lua
  method: handle
  imports:
    service: bee.placement.native:service
  security:
    policies: [bee:placement_store_policy, bee:placement_exec_policy, bee:placement_service_policy, bee:resource_resolve_policy, bee:credential_materialize_policy, bee:gateway_supervision_policy]
- name: reconcile
  kind: function.lua
  source: file://binding/reconcile_method.lua
  method: handle
  imports:
    service: bee.placement.native:service
  security:
    policies: [bee:placement_store_policy, bee:placement_exec_policy, bee:placement_service_policy, bee:resource_resolve_policy, bee:credential_materialize_policy, bee:gateway_supervision_policy]
- name: cleanup
  kind: function.lua
  source: file://binding/cleanup_method.lua
  method: handle
  imports:
    service: bee.placement.native:service
  security:
    policies: [bee:placement_store_policy, bee:placement_exec_policy, bee:placement_service_policy, bee:resource_resolve_policy, bee:credential_materialize_policy, bee:gateway_supervision_policy]
- name: evidence
  kind: function.lua
  source: file://binding/evidence_method.lua
  method: handle
  imports:
    service: bee.placement.native:service
  security:
    policies: [bee:placement_store_policy, bee:placement_exec_policy, bee:placement_service_policy, bee:resource_resolve_policy, bee:credential_materialize_policy, bee:gateway_supervision_policy]
- name: attach
  kind: function.lua
  source: file://binding/attach_method.lua
  method: handle
  imports:
    service: bee.placement.native:service
  security:
    policies: [bee:placement_store_policy, bee:placement_exec_policy, bee:placement_service_policy, bee:resource_resolve_policy, bee:credential_materialize_policy, bee:gateway_supervision_policy]
