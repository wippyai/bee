version: '1.0'
namespace: bee.security.docs
entries:
- name: docs_policy
  kind: security.policy
  meta:
    comment: The selected docs facade scope resolves one linked corpus reference and reads only that volume
  policy:
    actions:
    - fs.get
    - registry.get
    resources:
    - bee.docs.env:corpus_ref
    - bee.env:docs_corpus
    effect: allow
- name: docs_web_policy
  kind: security.policy.expr
  meta:
    comment: The docs facade reads the live documentation site the corpus is selected from, and nothing else
  policy:
    actions:
    - http_client.request
    resources: '*'
    expression: action == "http_client.request" && (resource matches "^https://wippy[.]ai/llm/" || resource == "https://wippy.ai/llms.txt")
    effect: allow
