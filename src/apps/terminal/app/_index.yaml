version: '1.0'
namespace: bee.apps.terminal.app
entries:
- name: command
  kind: library.lua
  source: file://command.lua
  imports:
    bounds: bee.values:bounds
- name: app
  kind: process.lua
  meta:
    type: bee.application
    application:
      api_version: 1
      title: Terminal
      lifetime: view
      revision: '1'
      instance_policy: singleton
      terminal: true
      menus: [bee.apps.terminal.app:start_menu]
  source: file://app.lua
  method: main
  modules:
  - tty
  - exec
  - process
  - channel
  imports:
    command: bee.apps.terminal.app:command
  security:
    policies:
    - bee.apps.terminal:acquire
    - bee.apps.terminal:run
- name: start_menu
  kind: registry.entry
  meta: {type: bee.menu}
  data:
    title: Terminal
    location: start
    order: 40
