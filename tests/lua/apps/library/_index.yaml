version: '1.0'
namespace: bee.tests.apps.library
entries:
- name: model_test
  kind: function.lua
  source: file://model_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    model: bee.apps.library.app:model
    governed: bee.gov.client:governed
    hub: bee.apps.library.app:hub
- name: governed_test
  kind: function.lua
  source: file://governed_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    model: bee.gov.client:governed
    preflight: bee.gov.binding:preflight
- name: hub_test
  kind: function.lua
  source: file://hub_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [json]
  imports:
    test: wippy.test:test
    model: bee.apps.library.app:hub
- name: hub_view_test
  kind: function.lua
  source: file://hub_view_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [tty]
  imports:
    test: wippy.test:test
    model: bee.apps.library.app:hub
    view: bee.apps.library.app:hub_view
    appearance: bee.ui:appearance
    contents: bee.apps.library.app:contents
- name: view_test
  kind: function.lua
  source: file://view_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [tty]
  imports:
    test: wippy.test:test
    model: bee.apps.library.app:model
    governed: bee.gov.client:governed
    hub: bee.apps.library.app:hub
    view: bee.apps.library.app:view
    contents: bee.apps.library.app:contents
    appearance: bee.ui:appearance
    preflight: bee.gov.binding:preflight
- name: app_test
  kind: function.lua
  source: file://app_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [process, channel, time, tty]
  imports:
    test: wippy.test:test
- name: contents_test
  kind: function.lua
  source: file://contents_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [base64]
  imports:
    test: wippy.test:test
    contents: bee.apps.library.app:contents
- name: names_test
  kind: function.lua
  source: file://names_test.lua
  method: run
  modules: [funcs, security, system]
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    bounds: bee.drivers.values:bounds
    app_scope: bee.tests.support.principals:application
  security:
    policies: [bee.tests.support.principals:application_scope_policy, bee.tests.apps.library:names_test_policy]
- name: names_test_policy
  kind: security.policy
  meta: {comment: The names test makes app actors and calls through the application boundary}
  policy:
    actions: [security.actor.create, funcs.security]
    resources: '*'
    effect: allow
- name: revert_test
  kind: function.lua
  source: file://revert_test.lua
  method: run
  modules: [funcs, security]
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    bounds: bee.drivers.values:bounds
    app_scope: bee.tests.support.principals:application
  security:
    policies: [bee.tests.support.principals:application_scope_policy, bee.tests.apps.library:names_test_policy]
- name: read_only
  kind: security.policy
  meta: {comment: An application that may read deliveries and nothing more}
  policy:
    actions: [bee.gov.delivery.read]
    resources: '*'
    effect: allow

- name: form_test
  kind: function.lua
  source: file://form_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    form: bee.apps.library.app:form
