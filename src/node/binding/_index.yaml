version: '1.0'
namespace: bee.node.binding
entries:
- name: catalog_types
  kind: library.lua
  source: file://catalog.lua
  modules: [registry, fs]
  imports:
    bounds: bee.values:bounds
    workspaces: bee.node:workspaces
- name: catalog
  kind: function.lua
  source: file://catalog.lua
  method: handle
  modules: [registry, fs, sql, uuid, time, json]
  imports:
    bounds: bee.values:bounds
    workspaces: bee.node:workspaces
- name: read
  kind: function.lua
  meta:
    comment: One workspace's row, its folder under the admitted root it lies in; needs bee.node.workspace.read on the workspace
  source: file://operations.lua
  method: read
  modules: [funcs, security]
  imports: &operation_imports
    bounds: bee.values:bounds
    catalog: bee.node.binding:catalog_types
  security:
    policies: [bee.node.security:workspace_catalog_facade]
- name: roots
  kind: function.lua
  meta:
    comment: The roots the node admits for workspaces, in name order, each with its access (read or write); needs bee.node.workspace.read on catalog
  source: file://operations.lua
  method: roots
  modules: [funcs, security]
  imports: *operation_imports
  security:
    policies: [bee.node.security:workspace_catalog_facade]
- name: folders
  kind: function.lua
  meta:
    comment: One page of the folders inside a folder of an admitted root, each with the workspace that holds it; needs bee.node.workspace.browse on the root
  source: file://operations.lua
  method: folders
  modules: [funcs, security]
  imports: *operation_imports
  security:
    policies: [bee.node.security:workspace_catalog_facade]
- name: tests_call
  kind: function.lua
  meta:
    comment: Runs and reads an admitted application's associated tests with authenticated workspace and overlay
      ownership evidence
  source: file://tests_call.lua
  method: handle
  modules:
  - funcs
  - security
  imports:
    bounds: bee.values:bounds
    tests: bee.node:tests
    peers: bee.node:peer_tools
  security:
    policies:
    - bee.node.security:tests_facade
    - bee.hive.security:caller
    - bee.hive.security:messaging
    - bee.hive.security:outbound
- name: tests_backend
  kind: function.lua
  meta:
    comment: Plans a run of an application's tests, writes it to the node database and wakes the runner; reads a run's results. Runs only in the test backend scope
  source: file://tests_backend.lua
  method: handle
  modules: [process, registry, uuid]
  imports:
    application: bee.node:application
    tests: bee.node:tests
    test_runs: bee.node:test_runs
    demand: bee.process:demand
    discovery: wippy.test:discovery
    application_tests: bee.node:application_tests
    activation_profiles: bee.gov.types:activation_profile_decoder
    bounds: bee.values:bounds
- name: app_tools
  kind: function.lua
  meta:
    comment: The tools the caller's workspace applications offer agents, with diagnostics for tools that are not
      offered
  source: file://app_tools_call.lua
  method: list
  modules:
  - funcs
  - security
  - ctx
  imports:
    bounds: bee.values:bounds
    application: bee.node:application
    app_tools: bee.node:app_tools
    requests: bee.node:app_tool_request
    peers: bee.node:peer_tools
  security:
    policies:
    - bee.node.security:app_tools_runner
    - bee.node.security:identity
    - bee.hive.security:caller
    - bee.hive.security:messaging
    - bee.hive.security:outbound
- name: app_tool_call
  kind: function.lua
  meta:
    comment: Runs one tool the caller's workspace applications offer agents, as that application with the actor
      and exact scope its own instances run with
  source: file://app_tools_call.lua
  method: call
  modules:
  - funcs
  - security
  - ctx
  imports:
    bounds: bee.values:bounds
    application: bee.node:application
    app_tools: bee.node:app_tools
    requests: bee.node:app_tool_request
    peers: bee.node:peer_tools
  security:
    policies:
    - bee.node.security:app_tools_runner
    - bee.node.security:identity
- name: names
  kind: function.lua
  meta:
    comment: The name each node asked reports for itself; needs bee.node.names.read on nodes
  source: file://names.lua
  method: names
  modules: [security]
  imports:
    bounds: bee.values:bounds
    client: bee.node:client
  security:
    policies: [bee.hive.security:caller, bee.hive.security:messaging]
- name: tests_backend_library
  kind: library.lua
  meta:
    comment: Plans a run of an application's tests, writes it to the node database and wakes the runner; reads a
      run's results. Runs only in the test backend scope
  source: file://tests_backend.lua
  modules:
  - process
  - registry
  - uuid
  imports:
    application: bee.node:application
    tests: bee.node:tests
    test_runs: bee.node:test_runs
    demand: bee.process:demand
    discovery: wippy.test:discovery
    application_tests: bee.node:application_tests
    activation_profiles: bee.gov.types:activation_profile_decoder
    bounds: bee.values:bounds
