version: '1.0'
namespace: bee.driver.grok.profiles
entries:
- name: profiles
  kind: registry.entry
  meta:
    type: harness.profile
    driver_ref: bee.driver.grok.binding:binding
  data:
    driver:
      schema_revision: bee.driver@1
      kind: harness
      title: Grok CLI
      implementation_version: 1.0.30
      default_profile: session
      profiles:
      - id: session
        mode: session
        hooks:
          transports: []
          events: []
        inbound:
        - next_turn
        mcp:
          client_transports:
          - stdio
          - streamable_http
          - sse
          initialize_timeout_ms: 30000
        protocol: stream-json
        protocol_revision: streaming-json-1
        answer_path:
          strategy: accumulate
          adapter_ref: bee.driver.grok.descriptor:cli
        resume:
          strategy: per-process
          portable: false
        isolation_env:
          variables:
          - HOME
          - GROK_HOME
          private_home: true
        exit_codes_trustworthy: false
        permission_exchange:
          mode: none
        input_ready:
          strategy: none
        interrupt:
          methods:
          - signal_group
      - id: batch
        mode: batch
        hooks:
          transports: []
          events: []
        inbound: []
        mcp:
          client_transports:
          - stdio
          - streamable_http
          - sse
          initialize_timeout_ms: 30000
        protocol: stream-json
        protocol_revision: streaming-json-1
        answer_path:
          strategy: accumulate
          adapter_ref: bee.driver.grok.descriptor:cli
        resume:
          strategy: per-process
          portable: false
        isolation_env:
          variables:
          - HOME
          - GROK_HOME
          private_home: true
        exit_codes_trustworthy: false
        permission_exchange:
          mode: none
        input_ready:
          strategy: none
        interrupt:
          methods:
          - signal_group
      - id: window
        mode: window
        protocol: pty
        protocol_revision: native-window-1
        hooks:
          transports:
          - command
          events:
          - SessionStart
          - UserPromptSubmit
          - PreToolUse
          - PostToolUse
          - Stop
        answer_path:
          strategy: none
        resume:
          strategy: none
          portable: false
        isolation_env:
          variables:
          - HOME
          - GROK_HOME
          private_home: true
        exit_codes_trustworthy: false
        permission_exchange:
          mode: none
        input_ready:
          strategy: none
- name: default_window
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned Grok window declaration; the host separately selects its policy, activation, executable and permissions
  data:
    schema_revision: bee.launch-definition@1
    launch_id: grok-window
    title: Grok CLI
    binding_ref: bee.driver.grok.binding:binding
    profile_id: window
    private_credentials:
    - grok_login
    - grok_api_key
    docker_credentials:
    - grok_login
    - grok_api_key
    policy_ref: bee.driver.grok.security:launch_policy_grok_window
    default_mode: window
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: new
    session_resource: session
    credentials:
    - grok_login
    - grok_api_key
    presentation:
      start_menu: true
      fullscreen: true
      reuse: never
- name: research_batch
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned bounded Grok batch route for a host-selected coordinator and caller-owned shared thread; the CLI offers no provable workdir confinement,
      so the host records it as unconfined
  data:
    schema_revision: bee.launch-definition@1
    launch_id: grok-research-batch
    title: Grok researcher
    binding_ref: bee.driver.grok.binding:binding
    profile_id: batch
    policy_ref: bee.driver.grok.security:launch_policy_grok_batch
    default_mode: batch
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: caller
    session_resource: session
    credentials:
    - grok_login
    - grok_api_key
    presentation:
      start_menu: false
      fullscreen: false
      reuse: never
    unconfined: true
