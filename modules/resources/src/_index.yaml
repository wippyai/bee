version: '1.0'
namespace: bee.resources
entries:
- name: definition
  kind: ns.definition
  module: resources
  readme: file://README.md
  meta:
    title: Bee resources
    comment: Owner-local resource authority; associations under a host ceiling, grants bound to subject, audience, revision, digest, scope and expiry
- name: dependency_persist
  kind: ns.dependency
  component: bee/persist
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: dependency_capability
  kind: ns.dependency
  component: bee/capability
  version: '*'
- name: protected_namespace
  kind: ns.requirement
  meta:
    comment: Add the resource owner's namespace to the host trust map
  default: bee.resources
  targets:
  - entry: bee.security.gov:protected_kernel
    path: .data.namespaces +=
- name: target_node_identity_storage
  kind: ns.requirement
  meta:
    comment: Native state identity and its recorded legacy alias
  default: bee.harness.host:environment
  targets:
  - entry: bee.resources.env:node_identity_migration_source
    path: .storage
- name: target_db
  kind: ns.requirement
  meta:
    comment: SQL resource for associations and grants
  default: bee.resources.env:db
  targets:
  - entry: bee.resources.env:database_ref
    path: .resource_ref
- name: target_roots
  kind: ns.requirement
  meta:
    comment: The host's admitted root list, the ceiling every association stays under
  default: bee.resources.env:resource_roots
  targets:
  - entry: bee.resources.env:roots_ref
    path: .resource_ref
- name: contract
  kind: contract.definition
  meta:
    comment: Associations and grants for one node's workspaces; resolve is for admitted placements only
  methods:
  - name: associate
    description: Bind a workspace name to an admitted root under the host ceiling; optional expected_revision supports atomic create or CAS replacement
  - name: grant
    description: Issue a grant to the authenticated subject for an audience, pinned to the association revision and root digest; a caller admitted to grant_thread may name a thread-bound subject with its thread instead
  - name: revoke
    description: End one grant and ask placement to recheck and stop its fenced attempt
  - name: revoke_all
    description: Advance the workspace authorization epoch so every earlier grant stops resolving, then ask placement to recheck and stop the fenced live attempts
  - name: resolve
    description: Re-check a grant for the placement that admitted the subject and audience, and return the exact resource scope
  - name: list
    description: A manager's view of associations and live grants
  - name: describe
    description: One workspace's associations as a titled list, for a caller that may read the workspace; the shape of a workspace catalog extension
  - name: search
    description: One workspace's associations whose name starts with text, for a caller that may read the workspace
