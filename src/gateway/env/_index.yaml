version: '1.0'
namespace: bee.gateway.env
entries:
- name: module_installation
  kind: registry.entry
  meta:
    type: bee.module_installation
    comment: Host-selected approval policy for agent Hub installation requests; a request files one approval and only an approved one applies
  data:
    approval_policy: module-installation
- name: module_publication
  kind: registry.entry
  meta:
    type: bee.module_publication
    comment: Host-selected approval policy for agent Hub publication requests; a request files one approval and only an approved one uploads
  data:
    approval_policy: module-publication
