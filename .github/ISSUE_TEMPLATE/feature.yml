name: Feature request
description: Describe a use case and the behavior you need
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What are you trying to do, and where does the current behavior fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
