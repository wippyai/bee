version: '1.0'
namespace: bee.e2e.sdk
entries:
- name: fixture
  kind: process.lua
  source: file://sdk_fixture.lua
  method: main
  modules: [process, env, registry, system, funcs, fs, json, time]
  imports:
    protocol: bee.hive:protocol
    example: bee.gov.traits:hive_sdk_example
    model: bee.capability:model
    grants: bee.gov.types:capability_grants
    materializer: bee.gov.binding:materializer
    application: bee.node:application
    bounds: bee.values:bounds
- name: fixture_policy
  kind: security.policy
  policy:
    actions: [registry.get, registry.find, registry.version, registry.snapshot, registry.overlay.get,
      registry.apply, registry.overlay.apply, registry.overlay.create.*, registry.overlay.update.*, registry.overlay.delete.*,
      security.actor.create, security.scope.create, security.policy.get, security.policy_group.get,
      funcs.security, funcs.call, system.read, process.registry.register.eventual, process.registry.lookup,
      fs.get, process.send]
    resources: '*'
    effect: allow
- name: fixture_service
  kind: process.service
  process: bee.e2e.sdk:fixture
  host: bee:workers
  lifecycle:
    auto_start: true
    requires: [bee.node.service:owner_service, bee.hive.service:supervisor_service]
    security:
      actor: {id: bee.e2e.sdk}
      policies: [bee.e2e.sdk:fixture_policy, bee.node.security:owner_role]
- name: fixture_bin
  kind: env.variable
  variable: BEE_FIXTURE_BIN
  storage: bee.env:workspace_environment
  readonly: true
- name: fixture_stream
  kind: env.variable
  variable: BEE_FIXTURE_SESSION_STREAM
  storage: bee.env:workspace_environment
  readonly: true
- name: session_fixture
  kind: process.lua
  source: file://sessions_fixture.lua
  method: main
  modules:
  - process
  - env
  - registry
  - system
  - security
  - funcs
  - fs
  - json
  - time
  - exec
  imports:
    protocol: bee.hive:protocol
    bounds: bee.values:bounds
- name: session_type
  kind: function.lua
  source: file://sessions_fixture.lua
  method: type_message
  modules:
  - process
  - env
  - registry
  - system
  - security
  - funcs
  - fs
  - json
  - time
  - exec
  imports:
    protocol: bee.hive:protocol
    bounds: bee.values:bounds
  security:
    policies:
    - bee.e2e.sdk:fixture_policy
    - bee.e2e.sdk:session_policy
    - bee.threads.security:sessions_owner
- name: session_activity
  kind: function.lua
  source: file://sessions_fixture.lua
  method: activity
  modules:
  - process
  - env
  - registry
  - system
  - security
  - funcs
  - fs
  - json
  - time
  - exec
  imports:
    protocol: bee.hive:protocol
    bounds: bee.values:bounds
- name: session_policy
  kind: security.policy
  policy:
    actions:
    - bee.sessions.remote
    - bee.sessions.hook_boundary
    - bee.sessions.allowance.manage
    - bee.harness.launch
    - exec.get
    - exec.run
    - env.get
    resources: '*'
    effect: allow
- name: session_fixture_service
  kind: process.service
  process: bee.e2e.sdk:session_fixture
  host: bee:workers
  lifecycle:
    auto_start: true
    requires:
    - bee.node.service:owner_service
    - bee.hive.service:supervisor_service
    - bee.threads.service:service
    security:
      actor:
        id: bee.e2e.sessions
      policies:
      - bee.e2e.sdk:fixture_policy
      - bee.e2e.sdk:session_policy
      - bee.threads.security:sessions_owner
      - bee.node.security:owner_role
