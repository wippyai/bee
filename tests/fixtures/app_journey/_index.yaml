version: '1.0'
namespace: bee.app.journey.probe
entries:
- name: destination_workspace
  kind: env.variable
  storage: bee.env:workspace_environment
  variable: BEE_APP_JOURNEY_WORKSPACE
  readonly: true
- name: operator_policy
  kind: security.policy
  policy:
    actions:
    - funcs.call
    - security.policy.get
    - registry.get
    - registry.apply
    - registry.update.registry.entry
    - registry.preview
    - registry.overlay.get
    - db.get
    - system.read
    - env.get
    - bee.gov.overlay.read
    - bee.gov.overlay.write
    - bee.gov.delivery.read
    - bee.gov.delivery.manage
    - bee.gov.delivery.activate
    - bee.gov.delivery.publish
    - bee.approvals.decide
    resources: '*'
    effect: allow
- name: shared_db
  kind: db.sql.sqlite
  file: .wippy/app-journey-shared.db
- name: migration_policy
  kind: security.policy
  policy:
    actions: [funcs.call, db.get]
    resources: [bee.app_journey_demo:001, bee.app.journey.probe:shared_db]
    effect: allow
- name: deliver
  kind: process.lua
  source: file://main.lua
  method: main
  modules: [funcs, registry, system, env, json, logger, sql]
  imports:
    bounds: bee.threads.records:bounds
    artifact: bee.gov:artifact
    materializer: bee.gov:materializer
    preflight: bee.gov:preflight
    catalog: bee.apps:catalog
  security:
    policies:
    - bee.app.journey.probe:operator_policy
    - bee.security.approvals:approval_consume_policy
  meta:
    command:
      name: app-journey-deliver
      security:
        actor: {id: bee.app_journey.operator}
        policies:
        - bee.app.journey.probe:operator_policy
        - bee.security.approvals:approval_consume_policy
- name: stage
  kind: process.lua
  source: file://stage.lua
  method: main
  modules: [funcs, registry, json, logger, base64]
  imports:
    bounds: bee.threads.records:bounds
  security:
    policies: [bee.app.journey.probe:operator_policy]
  meta:
    command:
      name: app-journey-stage
      security:
        actor: {id: bee.app_journey.operator}
        policies: [bee.app.journey.probe:operator_policy]
- name: guide
  kind: process.lua
  source: file://guide.lua
  method: main
  modules: [funcs, system, env, json, logger]
  imports:
    bounds: bee.threads.records:bounds
    guide: bee.gov.traits:guide
    artifact: bee.gov:artifact
    preflight: bee.gov:preflight
  security:
    policies: [bee.app.journey.probe:operator_policy]
  meta:
    command:
      name: app-journey-guide
      security:
        actor: {id: bee.app_journey.operator}
        policies: [bee.app.journey.probe:operator_policy]
- name: inspect
  kind: process.lua
  source: file://inspect.lua
  method: main
  modules: [registry, time, logger, env]
  imports:
    catalog: bee.apps:catalog
    bounds: bee.threads.records:bounds
  security:
    policies: [bee.app.journey.probe:operator_policy]
  meta:
    command:
      name: app-journey-inspect
      security:
        actor: {id: bee.app_journey.operator}
        policies: [bee.app.journey.probe:operator_policy]
