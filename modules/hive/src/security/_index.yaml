version: '1.0'
namespace: bee.hive.security
entries:
- name: principals
  kind: library.lua
  source: file://principals.lua
  modules: [hash]
  imports:
    types: bee.hive:types
    bounds: bee.values:bounds

- name: workspaces_policy
  kind: security.policy
  meta:
    comment: The workspaces operation reads the catalog through its owner operations
  policy:
    actions: [funcs.call]
    resources: [bee.workspace.binding:list, bee.workspace.binding:search]
    effect: allow
