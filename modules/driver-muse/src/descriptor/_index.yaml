version: '1.0'
namespace: bee.driver.muse.descriptor
entries:
- name: cli
  kind: registry.entry
  meta:
    type: bee.driver.cli_descriptor
    comment: Muse headless CLI command, record JSONL codec, login evidence and version probe
  data:
    schema_revision: bee.driver.cli-descriptor@1
    provider: muse
    executable: muse
    version_probe: {argv: [--version], pattern: '([0-9]+[.][0-9]+[.][0-9]+)'}
    login_evidence: {path: .config/muse/auth.json, command: muse, variable: HOME}
    platform: {os: [linux, darwin], arch: [x86_64, amd64, arm64, aarch64]}
    codec: muse-record-jsonl
    json_paths:
      resume_id: [stream, id]
      result_text: [text]
      errors: [reason]
      usage: null
    configure: muse
    options:
      profiles: [window, batch]
      fields:
        approval_mode: {type: enum, values: [untrusted, on-request, never], default: on-request, invalid: 'approval_mode is not one Bee admits'}
        turn_budget: {type: budget, max: 128, profiles: [batch], unsupported: 'turn_budget is only supported for structured turns'}
        model: {type: model, invalid: 'model is not one bounded model identifier'}
        effort: {type: enum, values: [low, medium, high, xhigh, max], invalid: 'effort is not one Bee admits'}
        resume_ref: {type: id, forbid_option: true, invalid: 'resume_ref is not an identifier'}
        gateway_tools: {type: ids, default: []}
        gateway_hooks: {type: ids, transform: presence, default: []}
      rules:
      - {kind: profile_fields, profile: window, fields: [turn_budget], message: 'turn_budget is only supported for structured turns'}
      - {kind: requires_empty, field: brief, other: resume_ref, profile: window, message: 'window resume cannot carry a brief'}
    flags:
      permission: {field: approval_mode, emit_default: true, argv: [--approval-mode, {field: approval_mode}]}
      turn_budget: {field: turn_budget, emit_default: false, argv: [--max-model-steps, {field: turn_budget}]}
    argv_templates:
      window:
        argv:
        - {if: resume_ref, then: [resume, {field: resume_ref}], else: [{if: brief, then: [--, {field: brief}]}]}
        readiness: terminal:attached
        provider_home_private: false
        login: true
      first_turn:
        argv:
        - exec
        - --json
        - {option: permission}
        - {if: model, then: [--model, {field: model}]}
        - {if: effort, then: [--reasoning-effort, {field: effort}]}
        - {option: turn_budget}
        - --
        - {field: brief}
        readiness: protocol:runtime.command.accepted
        provider_home_private: true
      resume:
        argv:
        - exec
        - --json
        - {option: permission}
        - {if: model, then: [--model, {field: model}]}
        - {if: effort, then: [--reasoning-effort, {field: effort}]}
        - {option: turn_budget}
        - --session-id
        - {field: resume_ref}
        - --
        - {field: brief}
        readiness: protocol:runtime.command.accepted
        provider_home_private: true
    provider_home:
      files:
      - {source_path: .config/muse/auth.json, path: .config/muse/auth.json, kind: login, optional: true, write_back: true}
      - {source_path: .config/muse/settings.json, path: .config/muse/.bee-global-settings.json, kind: config, optional: true, write_back: false}
