version: '1.0'
namespace: bee.host.processes.app
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules:
  - tty
  - process
  - channel
  - time
  - uuid
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    probe: bee.host.processes.app:probe
    view: bee.host.processes.app:view
    client: bee.app:client
    clock: bee.values:clock
    stop_request: bee.host.processes.app:stop_request
    history_values: bee.host.processes.app:history
  meta:
    type: bee.app
    application:
      api_version: 1
      title: Process Manager
      icon: P
      lifetime: view
      revision: '1'
      instance_policy: singleton
      group: Tools
      role: inspection
- name: view
  kind: library.lua
  source: file://view.lua
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    probe: bee.host.processes.app:probe
    text: bee.ui:text
    viz: bee.ui.viz:viz
    history_values: bee.host.processes.app:history
- name: stop_request
  kind: library.lua
  source: file://stop_request.lua
- name: history
  kind: library.lua
  source: file://history.lua
  imports:
    probe: bee.host.processes.app:probe
    viz: bee.ui.viz:viz
- name: probe
  kind: library.lua
  source: file://probe.lua
  modules:
  - system
  imports:
    bounds: bee.values:bounds
