version: '1.0'
namespace: bee.approvals
entries:
- name: dependency_values
  kind: ns.dependency
  component: bee/values
  version: '*'
- name: definition
  kind: ns.definition
  module: approvals
  readme: file://README.md
  meta:
    title: Bee approvals
    comment: Owner-local approval authority; requests bound to an exact proposal digest, decisions by compare-and-set, a durable outbox projecting onto threads
- name: dependency_persist
  kind: ns.dependency
  component: bee/persist
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: target_db
  kind: ns.requirement
  meta:
    comment: SQL resource for approval requests, history, inbox and outbox
  default: bee.approvals:db
  targets:
  - entry: bee.approvals:database_ref
    path: .resource_ref
- name: target_node_identity_storage
  kind: ns.requirement
  meta:
    comment: Native state identity and its recorded legacy alias
  default: bee.harness.host:environment
  targets:
  - entry: bee.approvals:node_identity_migration_source
    path: .storage
- name: target_policies
  kind: ns.requirement
  default: []
  meta:
    comment: The host's approver policies; each names its approvers and the longest request lifetime it allows
  targets:
  - entry: bee.approvals:policies_ref
    path: .resource_ref
- name: database_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked SQL resource; target_db fills resource_ref
- name: policies_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked approver policies entry; target_policies fills resource_ref
- name: environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: identity_migration
  kind: library.lua
  source: file://identity_migration.lua
  modules: [sql, env]
  imports:
    bounds: bee.values:bounds
- name: node_identity_migration_source
  kind: env.variable
  storage: bee.harness.host:environment
  variable: node_identity_migration_source
  default: ""
  readonly: true
- name: db_path
  kind: env.variable
  storage: bee.approvals:environment
  variable: BEE_APPROVALS_DB
  default: .wippy/approvals.db
  readonly: true
- name: db
  kind: db.sql.sqlite
  file: ${env:bee.approvals:db_path}
  lifecycle:
    auto_start: true
- name: runtime_lease
  kind: library.lua
  source: file://runtime_lease.lua
  imports: {bounds: bee.values:bounds}
- name: service
  kind: library.lua
  source: file://service.lua
  modules: [sql, hash, uuid, json, security, system, process, funcs]
  imports:
    runtime_lease: bee.approvals:runtime_lease
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    values: bee.threads.records:values
    clock: bee.values:clock
    persist: bee.persist:database
    transaction: bee.persist:transaction
    migrations: bee.approvals.migrations:migrations
    identity_migration: bee.approvals:identity_migration
    resources: bee.approvals:resources
    store: bee.approvals.persist:store
    outbox: bee.approvals.persist:outbox
- name: contract
  kind: contract.definition
  meta:
    comment: Approval requests for one node's workspaces; decisions belong to eligible approvers, consumption to the requester
  methods:
  - name: feed_snapshot
    description: Snapshot authorized inbox projections with an owner cursor and visibility revision
  - name: feed_read_after
    description: Catch up authorized approval changes using the shared sync envelope
  - name: runtime_lease
    description: Grant an approved exact runtime lease, check references, consume one effect idempotently, list or revoke
  - name: request
    description: Ask for a decision on one exact proposal under a host approver policy; the same key replays and a different request under it conflicts
  - name: decide
    description: Settle the pending revision for the recorded proposal digest; an identical retry replays and any other decision conflicts
  - name: decide_batch
    description: Settle several pending requests of one requester in one workspace in one transaction; each item is a full decide and one failing item rolls the batch back
  - name: withdraw
    description: End the caller's own pending request, or learn the outcome that already committed
  - name: consume
    description: The effect owner binds an approved decision to one effect identity under the authority incarnation it observed; it revalidates policy, attempt state and authority itself before acting
  - name: installation_effects
    description: Host-authorized installation workers read a bounded queue of approved, uncompleted Hub installation effects
  - name: complete_installation_effect
    description: The consuming effect owner records the durable result for its exact approval and effect key; identical completion replays
  - name: publication_effects
    description: Host-authorized publication workers read a bounded queue of approved, uncompleted Hub publication effects
  - name: complete_publication_effect
    description: The consuming effect owner records the durable result for its exact approval and effect key; identical completion replays
  - name: revalidate
    description: After an authority restart, the effect owner records that an approved decision still holds under the current incarnation
  - name: read
    description: One request, for its requester, an eligible approver or a workspace manager
  - name: inbox
    description: An approver's bounded catch-up over one workspace's changes
  - name: list
    description: The caller's own requests
  - name: deliveries
    description: Thread projection deliveries for one request; a manager may return an exhausted one to the queue
  - name: reconcile
    description: The owner expires due requests and forgets settled ones past retention
  - name: capabilities
    description: States, bounds and delivery guarantees of this owner
- name: local
  kind: contract.binding
  contracts:
  - contract: bee.approvals:contract
    methods:
      feed_snapshot: bee.approvals.binding:feed_snapshot
      feed_read_after: bee.approvals.binding:feed_read_after
      runtime_lease: bee.approvals.binding:runtime_lease
      request: bee.approvals.binding:request
      decide: bee.approvals.binding:decide
      decide_batch: bee.approvals.binding:decide_batch
      withdraw: bee.approvals.binding:withdraw
      consume: bee.approvals.binding:consume
      installation_effects: bee.approvals.binding:installation_effects
      complete_installation_effect: bee.approvals.binding:complete_installation_effect
      publication_effects: bee.approvals.binding:publication_effects
      complete_publication_effect: bee.approvals.binding:complete_publication_effect
      revalidate: bee.approvals.binding:revalidate
      read: bee.approvals.binding:read
      inbox: bee.approvals.binding:inbox
      list: bee.approvals.binding:list
      deliveries: bee.approvals.binding:deliveries
      reconcile: bee.approvals.binding:reconcile
      capabilities: bee.approvals.binding:capabilities
- name: resources
  kind: library.lua
  source: file://resources.lua
  modules: [registry]
  imports:
    bounds: bee.values:bounds
- name: target_request_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.approvals.binding:node_summary
    path: .security.policies
  - entry: bee.approvals.binding:request
    path: .security.policies
  - entry: bee.approvals.binding:feed_snapshot
    path: .security.policies
  - entry: bee.approvals.binding:feed_read_after
    path: .security.policies
  - entry: bee.approvals.binding:decide
    path: .security.policies
  - entry: bee.approvals.binding:decide_batch
    path: .security.policies
  - entry: bee.approvals.binding:withdraw
    path: .security.policies
  - entry: bee.approvals.binding:consume
    path: .security.policies
  - entry: bee.approvals.binding:installation_effects
    path: .security.policies
  - entry: bee.approvals.binding:complete_installation_effect
    path: .security.policies
  - entry: bee.approvals.binding:publication_effects
    path: .security.policies
  - entry: bee.approvals.binding:complete_publication_effect
    path: .security.policies
  - entry: bee.approvals.binding:revalidate
    path: .security.policies
  - entry: bee.approvals.binding:read
    path: .security.policies
  - entry: bee.approvals.binding:inbox
    path: .security.policies
  - entry: bee.approvals.binding:list
    path: .security.policies
  - entry: bee.approvals.binding:reconcile
    path: .security.policies
  - entry: bee.approvals.binding:capabilities
    path: .security.policies
  - entry: bee.approvals.binding:deliveries
    path: .security.policies
  - entry: bee.approvals.binding:attention_count
    path: .security.policies
  - entry: bee.approvals.binding:runtime_lease
    path: .security.policies
