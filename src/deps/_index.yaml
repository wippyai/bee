    value: bee:workers
  - name: waiter_policies
    value:
    - bee.security.threads:thread_waiter_policy
  - name: sender
    value: bee.hive.service:inbox_sender
  - name: owner_policies
    value:
    - bee.security.threads:thread_storage_policy
    - bee.security.threads:thread_resource_policy
  - name: target_append_policies
    value:
    - bee.security.threads:thread_storage_policy
    - bee.security.threads:thread_resource_policy
  - name: target_session_create_policies
    value:
    - bee.security.threads:thread_storage_policy
    - bee.security.threads:thread_resource_policy
