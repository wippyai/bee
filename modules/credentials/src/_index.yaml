version: '1.0'
namespace: bee.credentials
entries:
- name: definition
  kind: ns.definition
  module: credentials
  readme: file://README.md
  meta:
    title: Bee credentials
    comment: Owner-local credential broker; definitions reference host-admitted sources, projections bind an attempt, bytes move once to the materializer
- name: dependency_persist
  kind: ns.dependency
  component: bee/persist
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: protected_namespace
  kind: ns.requirement
  meta:
    comment: Add the credential owner's namespace to the host trust map
  default: bee.credentials
  targets:
  - entry: bee:protected_kernel
    path: .data.namespaces +=
- name: target_db
  kind: ns.requirement
  meta:
    comment: SQL resource for definitions and projections
  default: bee.credentials:db
  targets:
  - entry: bee.credentials:database_ref
    path: .resource_ref
- name: target_node_identity_storage
  kind: ns.requirement
  meta:
    comment: Native state identity and its recorded legacy alias
  default: bee.harness.host:environment
  targets:
  - entry: bee.credentials:node_identity_migration_source
    path: .storage
- name: target_sources
  kind: ns.requirement
  meta:
    comment: The host's admitted credential sources, the ceiling every definition stays under
  default: bee.credentials:credential_sources
  targets:
  - entry: bee.credentials:sources_ref
    path: .resource_ref
- name: target_materializer
  kind: ns.requirement
  meta:
    comment: Host-selected placement binding persisted on new projection receipts; an artifact input cannot select it
  default: bee.placement.native.binding:binding
  targets:
  - entry: bee.credentials:materializer_ref
    path: .binding_ref
- name: database_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked SQL resource; target_db fills resource_ref
- name: sources_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked host sources entry; target_sources fills resource_ref
- name: materializer_ref
  kind: registry.entry
  meta:
    comment: The linked placement binding persisted on new projections; target_materializer fills binding_ref
- name: environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: node_identity_migration_source
  kind: env.variable
  storage: bee.harness.host:environment
  variable: node_identity_migration_source
  default: ""
  readonly: true
- name: db_path
  kind: env.variable
  storage: bee.credentials:environment
  variable: BEE_CREDENTIALS_DB
  default: .wippy/credentials.db
  readonly: true
- name: db
  kind: db.sql.sqlite
  file: ${env:bee.credentials:db_path}
  lifecycle:
    auto_start: true
- name: formats
  kind: library.lua
  source: file://formats.lua
  imports:
    bounds: bee.threads.records:bounds
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  imports:
    bounds: bee.threads.records:bounds
    clock: bee:clock
    formats: bee.credentials:formats
- name: contract
  kind: contract.definition
  meta:
    comment: Definitions and projections for one node's workspaces; check and materialize are for admitted materializers only
  methods:
  - name: define
    description: Name a credential from a host-admitted source; optional expected_revision fences create or replacement
  - name: issue_projection
    description: Bind a credential to one attempt, profile, binding and policy for one audience, as the authenticated subject
  - name: check
    description: Re-check a projection's bindings without bytes
  - name: availability
    description: Check the provider-fixed login file for an existing workspace credential without reading bytes
  - name: materialize
    description: Re-check a projection and return its bytes once to the admitted materializer
  - name: write_back
    description: Return one refreshed provider login file through the original projection and source binding
  - name: revoke
    description: End one projection
  - name: revoke_all
    description: Advance the workspace authorization epoch so every earlier projection stops resolving
  - name: list
    description: A manager's view of definitions and live projections
- name: local
  kind: contract.binding
  contracts:
  - contract: bee.credentials:contract
    methods:
      define: bee.credentials.binding:define
      issue_projection: bee.credentials.binding:issue_projection
      check: bee.credentials.binding:check
      availability: bee.credentials.binding:availability
      materialize: bee.credentials.binding:materialize
      write_back: bee.credentials.binding:write_back
      revoke: bee.credentials.binding:revoke
      revoke_all: bee.credentials.binding:revoke_all
      list: bee.credentials.binding:list
- name: sources
  kind: library.lua
  source: file://sources.lua
  modules: [registry]
  imports:
    bounds: bee.threads.records:bounds
    formats: bee.credentials:formats
- name: credential_sources
  kind: registry.entry
  meta:
    type: bee.credential_sources
    comment: Host-selected credential sources with audience and provider; optional setup source, destination and
      format form one supplemental file under the same root; write_back admits exact-path token refreshes
  data:
    formats:
      claude: bee.driver.claude:credential_format
      codex: bee.driver.codex:credential_format
      agy: bee.driver.agy:credential_format
      grok: bee.driver.grok:credential_format
      muse: bee.driver.muse:credential_format
      opencode: bee.driver.opencode:credential_format
    sources:
    - ref: bee.driver.opencode:api_key
      workspace_id: '*'
      audience: '*'
      provider: opencode
      projection_kinds: [environment]
    - ref: bee.driver.claude:api_key
      workspace_id: '*'
      audience: '*'
      provider: claude
      projection_kinds:
      - environment
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: codex
      projection_kinds:
      - file
      path: .codex/auth.json
      write_back: true
      setup_path: .codex/config.toml
      setup_destination: .codex/config.toml
      setup_content_format: opaque
      setup_initialize_empty: true
      auxiliary_files:
      - source_prefix: .codex/
        destination_prefix: .codex/
        suffix: .config.toml
        content_format: opaque
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: claude
      projection_kinds:
      - file
      path: .claude/.credentials.json
      write_back: true
      setup_path: .claude/settings.json
      setup_destination: .claude/settings.json
      setup_content_format: opaque
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: agy
      projection_kinds:
      - file
      path: .gemini/antigravity-cli/antigravity-oauth-token
      write_back: true
      setup_path: .gemini/antigravity-cli/cache/onboarding.json
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: grok
      projection_kinds:
      - file
      path: .grok/auth.json
      write_back: true
      setup_path: .grok/config.toml
      setup_destination: .grok/.bee-global-config.toml
      setup_content_format: opaque
      setup_initialize_empty: true
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: muse
      projection_kinds:
      - file
      path: .config/muse/auth.json
      write_back: true
      setup_path: .config/muse/settings.json
      setup_destination: .config/muse/.bee-global-settings.json
      setup_content_format: opaque
      setup_initialize_empty: true
    - ref: bee.env:machine_login_source
      workspace_id: '*'
      audience: '*'
      provider: opencode
      projection_kinds:
      - file
      path: .local/share/opencode/auth.json
      write_back: true
      setup_path: .config/opencode/opencode.json
      setup_destination: .config/opencode/.bee-global-opencode.json
      setup_content_format: opaque
      setup_initialize_empty: true
