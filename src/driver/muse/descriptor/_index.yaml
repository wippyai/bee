version: '1.0'
namespace: bee.driver.muse.descriptor
entries:
- name: cli
  kind: registry.entry
  meta:
    type: bee.driver.cli_descriptor
    comment: Muse headless CLI command, record JSONL codec, login evidence and version probe
  data:
    schema_revision: bee.driver.cli-descriptor@3
    provider: muse
    executable: muse
    version_probe:
      argv:
      - --version
      pattern: ([0-9]+[.][0-9]+[.][0-9]+)
    login_evidence:
      command: muse login
      any_of:
      - kind: file_exists
        paths:
        - .config/muse/auth.json
        variable: XDG_CONFIG_HOME
        directory: .config
      - kind: env_present
        names:
        - META_API_KEY
    platform:
      os:
      - linux
      - darwin
      arch:
      - x86_64
      - amd64
      - arm64
      - aarch64
    codec: muse-record-jsonl
    json_paths:
      resume_id:
      - stream
      - id
      result_text:
      - payload
      - text
      errors:
      - payload
      - reason
      usage: null
    configure: muse
    capabilities:
      permission_answers:
        window:
          transport: hook_http
          adapter_ref: bee.driver.permission:permission_request_hook
        first_turn:
          transport: hook_http
          adapter_ref: bee.driver.permission:permission_request_hook
        resume:
          transport: hook_http
          adapter_ref: bee.driver.permission:permission_request_hook
    options:
      profiles:
      - window
      - batch
      fields:
        approval_mode:
          default: on-request
          invalid: approval_mode is not one Bee admits
          path: provider.options.approval_mode
          value_schema:
            type: string
            enum:
            - untrusted
            - on-request
            - never
          label: Approval mode
          description: CLI approval mode
          section: advanced
          order: 0
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --approval-mode
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            tokens:
            - --approval-mode
            - field: approval_mode
          - kind: argv
            contexts:
            - resume
            tokens:
            - --approval-mode
            - field: approval_mode
        model:
          invalid: model is not one bounded model identifier
          path: provider.model
          value_schema:
            type: string
            format: model
          label: Model
          description: CLI model
          section: basic
          order: 1
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --model
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            tokens:
            - if: model
              then:
              - --model
              - field: model
          - kind: argv
            contexts:
            - resume
            tokens:
            - if: model
              then:
              - --model
              - field: model
        effort:
          invalid: effort is not one Bee admits
          path: provider.effort
          value_schema:
            type: string
            enum:
            - low
            - medium
            - high
            - xhigh
            - max
          label: Effort
          description: CLI effort
          section: basic
          order: 2
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --reasoning-effort
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            tokens:
            - if: effort
              then:
              - --reasoning-effort
              - field: effort
          - kind: argv
            contexts:
            - resume
            tokens:
            - if: effort
              then:
              - --reasoning-effort
              - field: effort
        resume_ref:
          type: id
          forbid_option: true
          invalid: resume_ref is not an identifier
        gateway_tools:
          type: ids
          default: []
        gateway_hooks:
          type: ids
          transform: presence
          default: []
        system_prompt_append:
          path: provider.system_prompt_append
          value_schema:
            type: string
            maxLength: 4096
          label: System prompt append
          description: Additional instructions in the session private home
          section: advanced
          order: 100
          contexts:
          - window
          - first_turn
          - resume
          support:
            config_schema_ref: bee.driver.muse.descriptor:cli
          render:
          - kind: config
            contexts:
            - window
            - first_turn
            - resume
            file: .codex/AGENTS.md
            format: text
            path: []
            merge: append
            value:
              field: provider.system_prompt_append
      rules:
      - kind: requires_empty
        field: brief
        other: resume_ref
        profile: window
        message: window resume cannot carry a brief
    flags: {}
    argv_templates:
      window:
        argv:
        - render: approval_mode
          context: window
        - render: model
          context: window
        - render: effort
          context: window
        - if: resume_ref
          then:
          - resume
          - field: resume_ref
          else:
          - if: brief
            then:
            - --
            - field: brief
        readiness: terminal:attached
        provider_home_private: true
        login: true
      first_turn:
        argv:
        - exec
        - --json
        - render: approval_mode
          context: first_turn
        - render: model
          context: first_turn
        - render: effort
          context: first_turn
        - --
        - field: brief
        readiness: protocol:runtime.command.accepted
        provider_home_private: true
      resume:
        argv:
        - exec
        - --json
        - render: approval_mode
          context: resume
        - render: model
          context: resume
        - render: effort
          context: resume
        - --session-id
        - field: resume_ref
        - --
        - field: brief
        readiness: protocol:runtime.command.accepted
        provider_home_private: true
    provider_home:
      files:
      - source_path: .config/muse/auth.json
        path: .config/muse/auth.json
        kind: login
        optional: true
        write_back: true
      - source_path: .config/muse/settings.json
        path: .config/muse/.bee-global-settings.json
        kind: config
        optional: true
        write_back: false
- name: command
  kind: registry.entry
  meta:
    type: bee.app_command
    comment: CLI command to launch Muse CLI in the agent window
  data:
    name: muse
    definition_id: bee.harness.app:app
    arguments:
    - bee.driver.muse.profiles:default_window
    fullscreen: true
