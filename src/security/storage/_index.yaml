version: '1.0'
namespace: bee.security.storage
entries:
- name: workspace_storage_policy
  kind: security.policy
  policy:
    actions:
    - db.get
    resources:
    - bee:workspace_db
    effect: allow
- name: workspace_storage_boundary
  kind: security.policy
  meta:
    comment: Core workspace and client stores remain denied to every application
  policy:
    actions:
    - db.get
    resources:
    - bee:workspace_db
    - bee:client_db
    - bee.client.db:*
    - bee.workspace.db:*
    effect: deny
- name: client_storage_policy
  kind: security.policy
  policy:
    actions:
    - db.get
    resources:
    - bee:client_db
    effect: allow
- name: workspace_catalog_read_policy
  kind: security.policy
  meta:
    comment: Read the node workspace catalog, list it and search it
  policy:
    actions: [bee.workspaces.read]
    resources: '*'
    effect: allow
- name: workspace_catalog_manage_policy
  kind: security.policy
  meta:
    comment: Create, rename, archive and restore node workspaces under the host's admitted roots, and browse those roots' folders
  policy:
    actions: [bee.workspaces.manage, bee.workspaces.browse]
    resources: '*'
    effect: allow
- name: workspace_folder_browse_policy
  kind: security.policy.expr
  meta:
    comment: List the admitted roots and page their folders, to pick a folder under them; reads no workspace and creates, changes and archives nothing
  policy:
    expression: '(action == "bee.workspaces.read" && resource == "catalog") || action == "bee.workspaces.browse"'
    actions: [bee.workspaces.read, bee.workspaces.browse]
    resources: '*'
    effect: allow
- name: workspace_catalog_facade_policy
  kind: security.policy.expr
  meta:
    comment: Attached to the catalog operations only; they enter the execution scope after authorizing the caller
  policy:
    expression: '(action == "funcs.security" && resource == "security") || (action == "security.policy_group.get" && resource == "bee.security.storage:workspace_catalog_scope") || (action == "funcs.call" && resource == "bee.workspace.catalog:backend")'
    actions: [funcs.security, security.policy_group.get, funcs.call]
    resources: [security, bee.security.storage:workspace_catalog_scope, bee.workspace.catalog:backend]
    effect: allow
- name: workspace_catalog_store_policy
  kind: security.policy
  groups: [workspace_catalog_scope]
  meta:
    comment: The catalog backend's store, the host's admitted roots and its own execution
  policy:
    actions: [db.get, registry.get, bee.workspaces.execute]
    resources: [bee:workspace_db, bee.resources:roots_ref, bee:resource_roots, bee.workspace.catalog:backend]
    effect: allow
- name: workspace_catalog_volume_policy
  kind: security.policy
  groups: [workspace_catalog_scope]
  meta:
    comment: Root volumes; the backend opens only roots listed in the host's admitted roots
  policy:
    actions: [fs.get]
    resources: '*'
    effect: allow
- name: workspace_catalog_host_policy
  kind: security.policy.expr
  groups: [workspace_catalog_scope]
  meta:
    comment: Whether a workspace host is running, before its row is archived
  policy:
    expression: 'action == "process.registry.lookup" && resource matches "^bee[.]workspace[.]host/[0-9a-f]{32}$"'
    actions: [process.registry.lookup]
    resources: '*'
    effect: allow
- name: workspace_catalog_extension_policy
  kind: security.policy.expr
  groups: [workspace_catalog_scope]
  meta:
    comment: The catalog finds the workspace extension bindings and calls their describe and search methods; each binding answers only for workspaces this scope may read, and the operations authorized the caller for that workspace first
  policy:
    expression: '(action == "contract.implementations" && resource == "bee.workspace.catalog:extension") || action == "contract.open" || (action == "contract.call" && (resource == "describe" || resource == "search")) || action == "bee.workspaces.read"'
    actions: [contract.implementations, contract.open, contract.call, bee.workspaces.read]
    resources: '*'
    effect: allow
