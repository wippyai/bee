version: '1.0'
namespace: bee.hub
entries:
- name: definition
  kind: ns.definition
  module: hub
  readme: file://README.md
  meta: {title: Bee Hub, comment: Scoped package reads, dependency planning and publication recovery}
- name: dependency_persist
  kind: ns.dependency
  component: bee/persist
  version: '*'
- name: dependency_sync
  kind: ns.dependency
  component: bee/sync
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: dependency_placement
  kind: ns.dependency
  component: bee/placement
  version: '*'
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: process_host
  kind: ns.requirement
  meta: {comment: Host-selected process host for the fixed Hub publisher}
  targets:
  - entry: bee.hub:process_host_ref
    path: .host_ref
  - entry: bee.hub.security:worker_host_policy
    path: .policy.resources
- name: process_host_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked Hub publisher host; an absent link fails closed}
- name: target_publish_executor
  kind: ns.requirement
  meta: {comment: Host-selected native executor for the Hub uploader command}
  default: bee.hub:publish_executor
  targets:
  - entry: bee.hub:publish_executor_ref
    path: .resource_ref
- name: publish_executor_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked Hub publisher executor; an absent link fails closed}
- name: publish_executor
  kind: exec.native
  meta: {comment: Native executor for the Hub uploader command only}
  default_env:
    PATH: /usr/local/bin:/usr/bin:/bin
- name: target_publish_configuration
  kind: ns.requirement
  meta: {comment: Host-selected Hub publication configuration naming the publishing organization, uploader and admitted source roots}
  targets:
  - entry: bee.hub:publish_configuration_ref
    path: .resource_ref
- name: publish_configuration_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked Hub publication configuration; an absent link fails closed}
- name: requirements
  kind: library.lua
  source: file://requirements.lua
  imports: {bounds: bee.threads.records:bounds, canonical: bee.sync:canonical}
- name: inspection
  kind: library.lua
  source: file://inspection.lua
  imports: {bounds: bee.threads.records:bounds, requirements: bee.hub:requirements}
- name: inventory
  kind: library.lua
  source: file://inventory.lua
  imports: {bounds: bee.threads.records:bounds, requirements: bee.hub:requirements}
- name: semver
  kind: library.lua
  source: file://semver.lua
- name: binary_identity
  kind: library.lua
  source: file://binary_identity.lua
  modules: [json, env]
  imports: {bounds: bee.threads.records:bounds, semver: bee.hub:semver}
- name: native_compat
  kind: library.lua
  source: file://native_compat.lua
  imports: {bounds: bee.threads.records:bounds, binary_identity: bee.hub:binary_identity, semver: bee.hub:semver}
- name: graph
  kind: library.lua
  source: file://graph.lua
  imports: {bounds: bee.threads.records:bounds, requirements: bee.hub:requirements, inspection: bee.hub:inspection, semver: bee.hub:semver, canonical: bee.sync:canonical}
- name: plan
  kind: library.lua
  source: file://plan.lua
  modules: [hash]
  imports: {bounds: bee.threads.records:bounds, binary_identity: bee.hub:binary_identity, canonical: bee.sync:canonical, graph: bee.hub:graph, inventory: bee.hub:inventory, native_compat: bee.hub:native_compat, requirements: bee.hub:requirements, semver: bee.hub:semver}
- name: migrations
  kind: library.lua
  source: file://migrations.lua
- name: migration_work
  kind: library.lua
  source: file://migration_work.lua
  modules: [hash]
  imports: {bounds: bee.threads.records:bounds, canonical: bee.sync:canonical, plan: bee.hub:plan, migrations: bee.hub:migrations}
- name: inventory_reader
  kind: library.lua
  source: file://inventory_reader.lua
  modules: [registry]
  imports: {inventory: bee.hub:inventory}
- name: host_resources
  kind: library.lua
  source: file://host_resources.lua
  modules: [registry]
  imports: {bounds: bee.threads.records:bounds}
- name: installation
  kind: library.lua
  source: file://installation.lua
  modules: [hash]
  imports: {bounds: bee.threads.records:bounds, canonical: bee.sync:canonical, semver: bee.hub:semver}
- name: publishing
  kind: library.lua
  source: file://publishing.lua
  modules: [hash]
  imports: {bounds: bee.threads.records:bounds, canonical: bee.sync:canonical, semver: bee.hub:semver}
