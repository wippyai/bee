version: '1.0'
namespace: bee.tests.memory
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: [funcs, security, hash]
  imports: {bounds: bee.values:bounds}
  meta:
    type: bee.app
    application:
      api_version: 1
      lifetime: view
      title: Tiny memory fixture
      revision: '1'
      instance_policy: multiple
- name: trait
  kind: registry.entry
  meta:
    type: agent.trait
    title: Remember completed turns
    application_ref: bee.tests.memory:app
  data:
    prompt: Remember facts from completed turns.
    tools: []
    listens: [turn.completed]
- name: read_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [registry.get, registry.find, registry.snapshot]
    resources: ['*']
    effect: allow
- name: host
  kind: library.lua
  source: file://host.lua
  modules: [funcs, security, json, http_client]
  imports:
    approval_effect: bee.tests.support:approval_effect
    bounds: bee.values:bounds
    gateway: bee.gateway.binding:gateway
    traits: bee.gateway.security:traits
    harness: bee.tests.threads:harness
    app_identity: bee.threads.records:app_identity
    configuration: bee.gateway.env:configuration
- name: host_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [http_client.request, http_client.private_ip, bee.gateway.materialize, cdc.stream, funcs.call, funcs.security, funcs.context, security.actor.create, security.scope.create, security.policy.get, registry.get, registry.find, registry.snapshot, registry.apply, registry.update.registry.entry, registry.update.process.lua, bee.gateway.manage, bee.threads.app_alias, bee.approvals.read, bee.approvals.decide, bee.approvals.grant, db.get]
    resources: ['*']
    effect: allow
- name: client_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: ['bee.threads.binding:subscribe', 'bee.threads.binding:page', 'bee.threads.binding:ack_page', 'bee.threads.binding:resume', 'bee.threads.binding:read_after', 'bee.threads.binding:search', 'bee.threads.binding:timeline', 'bee.threads.binding:get', 'bee.threads.binding:create', 'bee.threads.binding:record', 'bee.tests.memory:run']
    effect: allow
- name: all_events
  kind: registry.entry
  meta: {type: agent.trait, title: Observe session events, application_ref: 'bee.tests.memory:app'}
  data:
    prompt: Observe session events.
    tools: []
    listens: [session.started, session.ended, prompt.submitted, tool.before, tool.after, turn.completed]
- name: run
  kind: function.lua
  source: file://app.lua
  method: run
  meta: {type: test_support}
  modules: [funcs, security, hash]
  imports: {bounds: bee.values:bounds}
- name: index_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [bee.threads.create, bee.threads.observe]
    resources: ['*']
    effect: allow
- name: tools_trait
  kind: registry.entry
  meta: {type: agent.trait, title: Memory tools, application_ref: 'bee.tests.memory:app'}
  data:
    prompt: Read the session thread and remember completed turns.
    tools: [thread_read]
    listens: [turn.completed]

- name: review
  kind: registry.entry
  meta: {type: agent.trait, title: Review}
  data: {prompt: Review changes., tools: []}

- name: outside
  kind: registry.entry
  meta:
    type: agent.trait
    title: Outside parent ceiling
  data:
    prompt: Outside parent ceiling.
    tools: []
