version: '1.0'
namespace: bee.driver.agy.hooks
entries:
- name: host_files
  kind: fs.directory
  meta:
    comment: The host filesystem, read-only, where an Agy conversation's transcript lives under the agent's home
  directory: /
  auto_init: false
  readonly: true
- name: input
  kind: function.lua
  meta:
    comment: Reads an Agy hook's stdin as the Bee hook payload, taking a turn's prompt and answer from the conversation transcript
  source: file://input.lua
  method: read
  modules: [fs, json]
  imports:
    bounds: bee.drivers.values:bounds
  security:
    policies: [bee.driver.agy.hooks:transcript_read]
- name: transcript_read
  kind: security.policy
  policy:
    actions: [fs.get]
    resources: [bee.driver.agy.hooks:host_files]
    effect: allow
