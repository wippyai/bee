    flags: {}
    argv_templates:
      window:
        argv:
        - render: permission_mode
          context: window
        - render: model
          context: window
        - render: effort
          context: window
        - if: resume_ref
          then:
          - -r
          - field: resume_ref
        - if: brief
          then:
          - --
          - field: brief
        readiness: terminal:attached
        provider_home_private: false
        login: true
      first_turn:
        argv:
        - -p
        - if_any:
          - permission_exchange
          - control_enabled
          then:
          - --input-format
          - stream-json
        - --output-format
        - stream-json
        - --verbose
        - --include-partial-messages
        - render: permission_mode
          context: first_turn
        - render: model
          context: first_turn
        - render: effort
          context: first_turn
        - if: permission_exchange
          then:
          - --permission-prompt-tool
          - stdio
          - --permission-prompts
          - host
        - if: gateway_tools
          then:
          - --allowedTools
          - join:
              field: gateway_tools
              separator: ','
              prefix: mcp__bee__
              always:
              - session
              exclude:
              - session
        - if_none:
          - permission_exchange
          - control_enabled
          then:
          - --
          - field: brief
        stdin_json:
          type: user
          message:
            role: user
            content:
              field: brief
        stdin_when_any:
        - permission_exchange
        - control_enabled
        session_end: stdin_close
        readiness: protocol:system.init
        provider_home_private: true
      resume:
        argv:
        - -p
        - if_any:
          - permission_exchange
          - control_enabled
          then:
          - --input-format
          - stream-json
        - --output-format
        - stream-json
        - --verbose
        - --include-partial-messages
        - render: permission_mode
          context: resume
        - render: model
          context: resume
        - render: effort
          context: resume
        - if: permission_exchange
          then:
          - --permission-prompt-tool
          - stdio
          - --permission-prompts
          - host
        - --resume
        - field: resume_ref
        - if: gateway_tools
          then:
          - --allowedTools
          - join:
              field: gateway_tools
              separator: ','
              prefix: mcp__bee__
              always:
              - session
              exclude:
              - session
        - if_none:
          - permission_exchange
          - control_enabled
          then:
          - --
          - field: brief
        stdin_json:
          type: user
          message:
            role: user
            content:
              field: brief
        stdin_when_any:
        - permission_exchange
        - control_enabled
        session_end: stdin_close
        readiness: protocol:system.init
        provider_home_private: true
    provider_home:
      variable: CLAUDE_CONFIG_DIR
      directory: .claude
      files:
      - source_path: .claude/.credentials.json
        path: .claude/.credentials.json
        kind: login
        optional: true
        write_back: true
      - source_path: .claude/settings.json
        path: .claude/settings.json
        kind: config
        optional: true
        write_back: false
        container_content: '{}'
      - path: .claude.json
        kind: state
        optional: true
        write_back: false
