version: '1.0'
namespace: bee.attachment_probe
entries:
- name: observation_policy
  kind: security.policy
  policy:
    actions: [process.spawn, process.spawn.monitored]
    resources: [bee.attachment_probe:observer_producer, bee.attachment_probe:observer_consumer]
    effect: allow
- name: naming_policy
  kind: security.policy
  policy:
    actions: [process.registry.register, process.registry.unregister]
    resources: [bee.attachment_probe.host]
    effect: allow
- name: owner
  kind: process.lua
  source: file://owner.lua
  method: main
  modules: [process, channel, time, security, tty, json, logger]
  imports:
    terminal_probe: bee.attachment_probe:terminal
    observation_probe: bee.attachment_probe:observation
    decode: bee.protocol:decode
    model: bee.desktop:model
    appearance: bee.desktop:appearance
    recovery: bee.workspace:recovery
    store: bee.storage:store
  meta:
    command:
      name: attachment-probe
      security:
        actor: {id: attachment-test}
        policies: [bee:desktop_policy, bee:core_spawn_policy, bee:workspace_storage_policy, bee.attachment_probe:observation_policy]
- name: observation
  kind: library.lua
  source: file://observation.lua
  modules: [process, channel, tty, time]
- name: observer_producer
  kind: process.lua
  source: file://observation.lua
  method: producer
  modules: [process, channel, tty, time]
- name: observer_consumer
  kind: process.lua
  source: file://observation.lua
  method: observer
  modules: [process, channel, tty, time]
- name: terminal
  kind: library.lua
  source: file://terminal.lua
  modules: [process, security, tty, time]
  imports:
    decode: bee.protocol:decode
    appearance: bee.desktop:appearance
    store: bee.storage:store
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: [tty, process, channel, uuid]
  imports:
    client: bee.application:client
  meta:
    type: bee.application
    application:
      api_version: 1
      title: Detached probe
      lifetime: view
      revision: '1'
      instance_policy: multiple
      resume_schema: attachment-v1
      restart_policy: automatic
