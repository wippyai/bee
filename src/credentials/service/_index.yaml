version: '1.0'
namespace: bee.credentials.service
entries:
- name: worker
  kind: process.lua
  source: file://worker.lua
  method: main
  modules:
  - funcs
  - logger
  imports:
    worker: bee.process:worker
    backlog: bee.credentials.service:backlog_reader
  meta:
    type: bee.approvals.effect-consumer
    destination: credentials.configuration
    operation_ref: bee.credentials.binding:configuration_setup
    worker_name: bee.approvals.configuration_effect_worker
- name: configuration_service
  kind: process.service
  process: bee.credentials.service:worker
  host: bee:workers
  lifecycle:
    auto_start: false
    requires:
    - bee.hive.service:supervisor_service
    security:
      actor:
        id: bee.credentials.configuration_worker
      policies:
      - bee.credentials.security:configuration_worker_policy
      - bee.process:client_policy
      - bee.process:backlog_policy
      - bee.credentials.security:configuration_effect_owner_policy
      - bee.credentials.security:configuration_discovery_policy
    restart:
      max_attempts: 10
  meta:
    type: bee.process.demand
    demand:
      name: bee.approvals.configuration_effect_worker
      probe: bee.credentials.service:backlog
- name: backlog
  kind: function.lua
  source: file://backlog.lua
  modules:
  - funcs
  imports:
    bounds: bee.values:bounds
    resources: bee.approvals.env:resources
  method: pending
- name: backlog_reader
  kind: library.lua
  source: file://backlog.lua
  modules:
  - funcs
  imports:
    bounds: bee.values:bounds
    resources: bee.approvals.env:resources
