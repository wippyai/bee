version: '1.0'
namespace: bee
entries:
- name: credential_store_policy
  kind: security.policy
  meta:
    comment: The credential broker's store, its linked references, node identity and the admitted sources it reads at materialization
  policy:
    actions:
    - db.get
    - registry.get
    - system.read
    - env.get
    resources:
    - bee.credentials:db
    - bee.credentials:database_ref
    - bee.credentials:sources_ref
    - bee:credential_sources
    - node
    - '*'
    effect: allow
- name: credential_manage_policy
  kind: security.policy
  policy:
    actions:
    - bee.credentials.manage
    resources: '*'
    effect: allow
- name: credential_issue_policy
  kind: security.policy
  policy:
    actions:
    - bee.credentials.issue
    resources: '*'
    effect: allow
- name: credential_materialize_policy
  kind: security.policy
  meta:
    comment: Attached to placement service and runner entries only
  policy:
    actions:
    - bee.credentials.materialize
    - funcs.call
    resources:
    - '*'
    - bee.credentials.binding:check
    - bee.credentials.binding:materialize
    effect: allow
- name: credential_file_policy
  kind: security.policy
  meta:
    comment: Host-selected login roots; attached to credential availability for stat-only checks and to the credential
      materializer for reads
  policy:
    actions:
    - fs.get
    - fs.read
    resources:
    - bee:machine_login_source
    effect: allow
