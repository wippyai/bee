- name: join
  kind: function.lua
  source: file://owner.lua
  method: join
  modules:
  - logger
  - json
  - security
  - hash
  - funcs
  - time
  - system
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
