version: '1.0'
namespace: bee.resources
entries:
- name: unadmitted_fixture
  kind: fs.directory
  directory: .
  base: project
  auto_init: false
  meta: {type: test_support}
- name: project_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/resources-project
  auto_init: true
- name: shared_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/resources-shared
  auto_init: true
- name: unrelated_secret_storage
  kind: env.storage.memory
- name: unrelated_secret
  kind: env.variable
  storage: bee.resources:unrelated_secret_storage
  variable: RESOURCE_UNRELATED_SECRET
  default: .wippy/resource-unrelated-secret
- name: unrelated_env_root
  kind: fs.directory
  meta: {type: test_support}
  directory: ${env:bee.resources:unrelated_secret}
  auto_init: true
- name: apply_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [registry.apply]
    resources: '*'
    effect: allow
- name: client_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.resources.binding:associate, bee.resources.binding:grant, bee.resources.binding:revoke, bee.resources.binding:revoke_all, bee.resources.binding:resolve, bee.resources.binding:list, bee.resources.binding:capabilities]
    effect: allow
- name: authority_test
  kind: function.lua
  source: file://authority_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [funcs, security, registry, time, sql]
  security:
    policies: [bee.resources:apply_test_policy, bee:resource_store_policy]
  imports:
    principals: bee.test.principals:bound
    test: wippy.test:test
    authority: bee.resources.persist:authority
    migrations: bee.resources.migrations:migrations
    persist: bee.persist:database
    resources: bee.resources.registry:resources
