version: '1.0'
namespace: bee.harness.profiles
entries:
- name: preferences_test
  kind: function.lua
  source: file://preferences_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    preferences: bee.driver.profiles:preferences
- name: test_call
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.harness.binding:call, bee.harness.profiles:context_probe]
    effect: allow
- name: test_read
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [bee.harness.profiles.read]
    resources: [saved-profile-workspace]
    effect: allow
- name: test_write
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [bee.harness.profiles.write]
    resources: [saved-profile-workspace]
    effect: allow
- name: service_test
  kind: function.lua
  source: file://service_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [funcs, security, uuid]
  imports:
    test: wippy.test:test
    bounds: bee.values:bounds
- name: selection_test
  kind: function.lua
  source: file://selection_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    protocol: bee.app:sessions_protocol
    fixtures: bee.tests.sessions:fixtures
    bounds: bee.values:bounds
    test: wippy.test:test
    agents: bee.harness.app:agents
    sessions: bee.app:sessions

- name: context_probe
  kind: function.lua
  source: file://context_probe.lua
  method: handle
  meta: {type: test_support}
  modules: [funcs]

- name: editor_test
  kind: function.lua
  source: file://editor_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    profile_editor: bee.harness.app:profile_editor
    protocol: bee.harness.profiles:protocol
- name: form_test
  kind: function.lua
  source: file://form_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [funcs]
  imports:
    test: wippy.test:test
    form: bee.harness.app:profile_form
    editor: bee.harness.app:profile_editor
    bounds: bee.values:bounds
- name: agents_test
  kind: function.lua
  source: file://agents_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    principals: bee.test.principals:bound
    bounds: bee.values:bounds
    protocol: bee.app:sessions_protocol
    fixtures: bee.tests.sessions:fixtures
    test: wippy.test:test
    agents: bee.harness.app:agents
    sessions: bee.app:sessions
- name: observations_test
  kind: function.lua
  source: file://observations_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [funcs, security]
  imports:
    test: wippy.test:test
    harness: bee.threads:harness
    agents: bee.harness.app:agents
    sessions: bee.app:sessions
    protocol: bee.app:sessions_protocol
    bounds: bee.values:bounds
- name: observations_probe
  kind: function.lua
  source: file://observations_test.lua
  method: probe
  meta: {type: test_support}
  modules: [funcs, security]
  imports:
    test: wippy.test:test
    harness: bee.threads:harness
    agents: bee.harness.app:agents
    sessions: bee.app:sessions
    protocol: bee.app:sessions_protocol
    bounds: bee.values:bounds
- name: agent_view_test
  kind: function.lua
  source: file://agent_view_test.lua
  method: run
  modules: [tty]
  meta: {type: test, suite: bee}
  imports:
    fixtures: bee.tests.sessions:fixtures
    test: wippy.test:test
    directory_view: bee.harness.app:directory_view
    protocol: bee.app:sessions_protocol
    picker_view: bee.harness.app:picker_view
    session_view: bee.harness.app:session_view
    agents: bee.harness.app:agents
    appearance: bee.app:appearance
- name: view_test
  kind: function.lua
  source: file://view_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    view: bee.harness.app:profile_view
    editor: bee.harness.app:profile_editor
    appearance: bee.app:appearance
    caller: bee.app:caller
- name: codex_effort_test
  kind: function.lua
  source: file://codex_effort_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    launch: bee.driver.codex.binding:launch
- name: migration_test
  kind: function.lua
  source: file://migration_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [uuid]
  security: {policies: [bee.sync:sync_test_policy]}
  imports:
    test: wippy.test:test
    bounds: bee.values:bounds
    migration: bee.harness.profiles.persist:migration
    protocol: bee.harness.profiles:protocol
    sync: bee.sync.persist:store
- name: repair_policy
  kind: security.policy
  meta: {type: test_support}
  policy: {actions: [registry.apply], resources: '*', effect: allow}
- name: repair_test
  kind: function.lua
  source: file://repair_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry, json]
  security: {policies: [bee.harness.profiles:repair_policy]}
  imports: {test: wippy.test:test, form: bee.harness.app:profile_form, editor: bee.harness.app:profile_editor, bounds: bee.values:bounds}
- name: reopen_test
  kind: function.lua
  source: file://reopen_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    agents: bee.harness.app:agents
    sessions: bee.app:sessions
    protocol: bee.app:sessions_protocol
