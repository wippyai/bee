version: '1.0'
namespace: bee.apps.processes
entries:
- name: service_titles
  kind: security.policy
  meta:
    comment: Process Manager reads registry ownership and service titles
  policy:
    actions:
    - registry.snapshot
    resources: '*'
    effect: allow
- name: observe
  kind: security.policy
  meta:
    comment: Process Manager reads the runtime's hosts, processes, services and memory
  policy:
    actions:
    - system.read
    resources:
    - hosts
    - supervisor
    - memory
    - goroutines
    - node
    effect: allow
