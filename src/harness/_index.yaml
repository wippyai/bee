version: '1.0'
namespace: bee.harness
entries:
- name: types
  kind: library.lua
  source: file://types.lua
  imports:
    request_types: bee.harness:request
    classify: bee.harness:classification
    driver_types: bee.driver:types
    placement_types: bee.placement:types
    policy: bee.harness:policy_types
    permission: bee.harness:permission_types
    checkpoint: bee.harness:checkpoint_types
    stream_json: bee.driver:stream_types
    settle: bee.harness:settlement_types
    record_types: bee.threads:record_types
- name: profiles
  kind: contract.definition
  methods:
  - name: call
    description: Read or compare-and-set a typed saved agent profile owned by the host node
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"operation":{"type":"string"},"workspace_id":{"type":"string"},"profile_id":{"type":"string"},"profile":{"type":"object"},"expected_revision":{"type":"integer"},"idempotency_key":{"type":"string"},"limit":{"type":"integer"},"after_id":{"type":"string"}},"additionalProperties":true,"description":"Read or compare-and-set a typed saved agent profile owned by the host node"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"code":{"type":"string"},"message":{"type":"string"},"ok":{"const":false}},"additionalProperties":true,"required":["ok","code","message"]}]}}
- name: request
  kind: library.lua
  source: file://request.lua
  imports:
    placement_types: bee.placement:types
    record_types: bee.threads:record_types
- name: classification
  kind: library.lua
  source: file://classification.lua
- name: policy_types
  kind: library.lua
  source: file://policy_types.lua
  imports:
    placement_types: bee.placement:types
    configuration: bee.driver:configuration_types
- name: checkpoint_types
  kind: library.lua
  source: file://checkpoint_types.lua
  imports:
    driver_types: bee.driver:types
- name: settlement_types
  kind: library.lua
  source: file://settlement_types.lua
  imports:
    driver_types: bee.driver:types
- name: permission_types
  kind: library.lua
  source: file://permission_types.lua
