version: '1.0'
namespace: bee.approvals.inbox.decide.probe
entries:
- name: seed_policy
  kind: security.policy
  policy:
    actions:
    - funcs.call
    - db.get
    - registry.get
    - system.read
    - security.policy.get
    resources: '*'
    effect: allow
- name: identity_policy
  kind: security.policy
  meta:
    comment: The probe opens the governance plan store directly, which reads its exact migration source
  policy:
    actions:
    - env.get
    resources:
    - bee.gov:node_identity_migration_source
    effect: allow
- name: helper
  kind: library.lua
  source: file://helper.lua
  modules:
  - hash
  - system
  - process
  - time
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    artifact: bee.gov:artifact
    plan_store: bee.gov.persist:plan_store
    staging: bee.gov:staging_resources
    approval: bee.gov.binding:approval
- name: seed
  kind: process.lua
  source: file://seed.lua
  method: main
  modules:
  - funcs
  - security
  - system
  - logger
  imports:
    helper: bee.approvals.inbox.decide.probe:helper
  security:
    policies:
    - bee.approvals.inbox.decide.probe:seed_policy
    - bee.approvals.inbox.decide.probe:identity_policy
    - bee.security.approvals:approval_request_policy
    - bee.security.approvals:approval_consume_policy
  meta:
    command:
      name: inbox-decide-seed
      security:
        actor:
          id: bee.approvals.inbox.decide.probe
- name: consume
  kind: process.lua
  source: file://consume.lua
  method: main
  modules:
  - funcs
  - security
  - logger
  imports:
    bounds: bee.values:bounds
    helper: bee.approvals.inbox.decide.probe:helper
  security:
    policies:
    - bee.approvals.inbox.decide.probe:seed_policy
    - bee.approvals.inbox.decide.probe:identity_policy
    - bee.security.approvals:approval_request_policy
    - bee.security.approvals:approval_consume_policy
  meta:
    command:
      name: inbox-decide-consume
      security:
        actor:
          id: bee.approvals.inbox.decide.probe
