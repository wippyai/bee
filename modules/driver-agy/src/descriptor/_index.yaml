version: '1.0'
namespace: bee.driver.agy.descriptor
entries:
- name: cli
  kind: registry.entry
  meta:
    type: bee.driver.cli_descriptor
    comment: Agy CLI command, stream-json codec, login evidence and version probe
  data:
    schema_revision: bee.driver.cli-descriptor@2
    provider: agy
    executable: agy
    version_probe: {argv: [--version], pattern: '([0-9]+[.][0-9]+[.][0-9]+)'}
    login_evidence:
      command: agy
      any_of:
      - {kind: file_exists, paths: [.gemini/antigravity-cli/antigravity-oauth-token]}
      - {kind: env_present, names: [GEMINI_API_KEY]}
    platform: {os: [linux, darwin], arch: [x86_64, amd64, arm64, aarch64]}
    codec: agy-stream-json
    json_paths:
      resume_id: [conversation_id]
      result_text: [response]
      errors: [error]
      usage: [usage]
    configure: agy
    options:
      profiles: [window, session, batch]
      unknown_prefix: ''
      fields:
        mode: {type: enum, values: [default, accept-edits, plan], default: default, invalid: 'mode is not one Bee admits'}
        model: {type: model, invalid: 'model is not one bounded model identifier'}
        effort: {type: enum, values: [low, medium, high], invalid: 'effort is not one Bee admits'}
        sandbox: {type: boolean, default: false}
        dangerously_skip_permissions: {type: boolean, default: false}
        agent: {type: id, forbid_option: true, invalid: 'agent must not be a command-line option'}
        resume_ref: {type: id, forbid_option: true, invalid: 'resume_ref must not be a command-line option'}
        gateway_tools: {type: ids}
        gateway_hooks: {type: ids}
      rules: []
    flags:
      permission: {field: mode, emit_default: false, argv: [--mode, {field: mode}]}
    argv_templates:
      window:
        argv:
        - {if: mode, not_equals: default, then: [{option: permission}]}
        - {if: dangerously_skip_permissions, then: [--dangerously-skip-permissions]}
        - {if: sandbox, then: [--sandbox]}
        - {if: model, then: [--model, {field: model}]}
        - {if: effort, then: [--effort, {field: effort}]}
        - {if: agent, then: [--agent, {field: agent}]}
        - {if: resume_ref, then: [--conversation, {field: resume_ref}]}
        - {if: brief, then: [--prompt-interactive, {field: brief}]}
        readiness: terminal:attached
        provider_home_private: false
        login: true
      first_turn:
        argv:
        - --print=
        - --input-format
        - stream-json
        - --output-format
        - stream-json
        - --disable-slash-commands
        - {if: mode, not_equals: default, then: [{option: permission}]}
        - {if: dangerously_skip_permissions, then: [--dangerously-skip-permissions]}
        - {if: sandbox, then: [--sandbox]}
        - {if: model, then: [--model, {field: model}]}
        - {if: effort, then: [--effort, {field: effort}]}
        - {if: agent, then: [--agent, {field: agent}]}
        - {if: resume_ref, then: [--conversation, {field: resume_ref}]}
        stdin_json: {event: user, message: {content: {field: brief}, role: user}}
        stdin_eof: true
        readiness: protocol:init
        provider_home_private: true
      resume:
        argv:
        - --print=
        - --input-format
        - stream-json
        - --output-format
        - stream-json
        - --disable-slash-commands
        - {if: mode, not_equals: default, then: [{option: permission}]}
        - {if: dangerously_skip_permissions, then: [--dangerously-skip-permissions]}
        - {if: sandbox, then: [--sandbox]}
        - {if: model, then: [--model, {field: model}]}
        - {if: effort, then: [--effort, {field: effort}]}
        - {if: agent, then: [--agent, {field: agent}]}
        - --conversation
        - {field: resume_ref}
        stdin_json: {event: user, message: {content: {field: brief}, role: user}}
        stdin_eof: true
        readiness: protocol:init
        provider_home_private: true
    provider_home:
      files:
      - {source_path: .gemini/antigravity-cli/antigravity-oauth-token, path: .gemini/antigravity-cli/antigravity-oauth-token, kind: login, optional: true, write_back: true}
      - {source_path: .gemini/antigravity-cli/cache/onboarding.json, path: .gemini/antigravity-cli/cache/onboarding.json, kind: config, optional: true, write_back: false}
