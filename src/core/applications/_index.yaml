version: '1.0'
namespace: bee.applications
entries:
- name: broker
  kind: process.lua
  source: file://broker.lua
  method: main
  modules: [security, process, channel, tty, uuid, registry, time, ctx, funcs]
  imports:
    attachment: bee.applications:attachment
    bounds: bee.threads.records:bounds
    execution: bee.applications:execution
    principal: bee.applications:principal
    contract: bee.protocol:application
    catalog: bee.applications:catalog
    lifecycle: bee.applications:lifecycle
    shutdown: bee.applications:shutdown
    interaction: bee.application:interaction
    interactions: bee.applications:interactions
    appearance: bee.application:appearance
    open_protocol: bee.applications:open_protocol
    binding_protocol: bee.host:binding_protocol
    thread_binding: bee.applications:thread_binding
    thread_binding_reducer: bee.applications:thread_binding_reducer
    thread_protocol: bee.application:thread_protocol
  security:
    policies: [bee:broker_policy, bee:application_thread_membership_policy,
      bee:application_thread_facade_policy]
- name: lifecycle
  kind: library.lua
  source: file://lifecycle.lua
- name: attachment
  kind: library.lua
  source: file://attachment.lua
  modules: [tty]
- name: execution
  kind: library.lua
  source: file://execution.lua
  modules: [process, security, channel, time]
- name: principal
  kind: library.lua
  source: file://principal.lua
- name: command
  kind: library.lua
  source: file://command.lua
  modules: [registry]
  imports:
    catalog: bee.applications:catalog
    arguments: bee.application:arguments
    managed: bee.harness.launch:selection
- name: catalog
  kind: library.lua
  source: file://catalog.lua
  modules: [registry]
  imports:
    contract: bee.protocol:application
    activation_profiles: bee.governance:activation_profile_decoder
    governed_admission: bee.governance:governed_application_admission
- name: interactions
  kind: library.lua
  source: file://interactions.lua
  imports:
    protocol: bee.application:interaction
- name: shutdown
  kind: library.lua
  source: file://shutdown.lua
- name: open_protocol
  kind: library.lua
  source: file://open_protocol.lua
  imports:
    arguments: bee.application:arguments
    contract: bee.protocol:application
    decode: bee.protocol:decode
    bounds: bee.threads.records:bounds
- name: thread_binding
  kind: library.lua
  source: file://thread_binding.lua
  imports:
    bounds: bee.threads.records:bounds
- name: thread_binding_reducer
  kind: library.lua
  source: file://thread_binding_reducer.lua
  imports:
    binding_protocol: bee.host:binding_protocol
- name: open_call
  kind: function.lua
  source: file://open_method.lua
  method: handle
  modules: [process, security, channel, time, ctx, hash, uuid]
  imports:
    bounds: bee.threads.records:bounds
    arguments: bee.application:arguments
    open_protocol: bee.applications:open_protocol
  security:
    policies: [bee:application_open_facade_policy]
