version: '1.0'
namespace: bee.threads.sessions.service
entries:
- name: scheduler
  kind: library.lua
  source: file://scheduler.lua
  modules:
  - funcs
  - uuid
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    cancellation: bee.threads.sessions.binding:cancellation
- name: scheduler_worker
  kind: process.lua
  source: file://scheduler_worker.lua
  method: main
  modules:
  - process
  - time
  - channel
  - logger
  - funcs
  imports:
    bounds: bee.values:bounds
    scheduler: bee.threads.sessions.service:scheduler
    threads_journal: bee.threads.sessions.binding:threads_journal
    executors: bee.threads.sessions.executor:executor_registry
    lifecycle: bee.threads.sessions.binding:control
- name: scheduler_service
  kind: process.service
  meta:
    component_lifecycle: bee.threads.sessions.binding:lifecycle
  process: bee.threads.sessions.service:scheduler_worker
  lifecycle:
    auto_start: true
    requires: [wippy.bootloader:bootloader.service]
    security:
      actor:
        id: bee.sessions.scheduler
      policies: &id001
      - bee.threads.security:store
      - bee.threads.security:node_identity
      - bee.threads.security:sessions_owner
      - bee.threads.sessions.security:scheduler_policy
      - bee.threads.sessions.security:lifecycle_worker_policy
      - bee.threads.sessions.security:scheduler_principal_policy
  host: bee:workers
- name: turn_run
  kind: function.lua
  source: file://scheduler_worker.lua
  method: turn_run
  modules:
  - process
  - time
  - channel
  - logger
  - hash
  - funcs
  imports:
    bounds: bee.values:bounds
    scheduler: bee.threads.sessions.service:scheduler
    threads_journal: bee.threads.sessions.binding:threads_journal
    executors: bee.threads.sessions.executor:executor_registry
    lifecycle: bee.threads.sessions.binding:control
  security:
    policies: *id001
