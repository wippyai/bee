version: '1.0'
namespace: bee.driver.claude
entries:
- name: definition
  kind: ns.definition
  module: driver-claude
  readme: file://README.md
  meta:
    title: Bee Claude driver
    comment: Optional harness binding; host activation and launch policies authorize its use
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: host_environment
  kind: ns.requirement
  meta:
    comment: Read-only host environment that supplies the selected Claude executable and API key
  default: bee.harness.host:environment
  targets:
  - entry: bee.driver.claude.env:executable
    path: .storage
  - entry: bee.driver.claude.env:api_key
    path: .storage
- name: window_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Claude window route
  default: bee.driver.claude.security:launch_policy_claude_window
  targets:
  - entry: bee.driver.claude.profiles:default_window
    path: .data.policy_ref
- name: batch_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Claude batch route
  default: bee.driver.claude.security:launch_policy_claude_batch
  targets:
  - entry: bee.driver.claude.profiles:research_batch
    path: .data.policy_ref
- name: dependency_values
  kind: ns.dependency
  component: bee/values
  version: '*'
