version: '1.0'
namespace: bee.credentials.security
entries:
- name: credential_store_policy
  kind: security.policy
  meta:
    comment: The credential broker's store, its linked references, node identity and the admitted sources it reads at materialization
  policy:
    actions:
    - db.get
    - registry.get
    - system.read
    - env.get
    resources:
    - bee.credentials.env:db
    - bee.credentials.env:database_ref
    - bee.credentials.env:sources_ref
    - bee.credentials.env:credential_sources
    - node
    - '*'
    effect: allow
- name: credential_manage_policy
  kind: security.policy
  policy:
    actions:
    - bee.credentials.manage
    resources: '*'
    effect: allow
- name: credential_issue_policy
  kind: security.policy.expr
  meta:
    comment: A principal takes credential projections only in the workspace its host-issued identity is bound to
  policy:
    actions:
    - bee.credentials.issue
    resources: '*'
    expression: resource != "" && resource == actor.meta.workspace_id
    effect: allow
- name: credential_materialize_policy
  kind: security.policy
  meta:
    comment: Attached to placement service and runner entries only
  policy:
    actions:
    - bee.credentials.materialize
    - bee.credentials.write_back
    - funcs.call
    resources:
    - '*'
    - bee.credentials.binding:check
    - bee.credentials.binding:materialize
    - bee.credentials.binding:write_back
    effect: allow
- name: credential_materialize_workspace_policy
  kind: security.policy.expr
  meta:
    comment: An application that runs its own placement materializes projections only in the workspace its host-issued identity is bound to
  policy:
    actions:
    - bee.credentials.materialize
    - funcs.call
    resources: '*'
    expression: (action == "bee.credentials.materialize" && resource != "" && resource == actor.meta.workspace_id) || (action == "funcs.call" && (resource == "bee.credentials.binding:check" || resource == "bee.credentials.binding:materialize"))
    effect: allow
- name: credential_file_policy
  kind: security.policy
  meta:
    comment: Host-selected login roots for credential availability checks and bounded materialization reads
  policy:
    actions:
    - fs.get
    - fs.read
    resources:
    - bee.env:machine_login_source
    effect: allow
- name: credential_file_write_policy
  kind: security.policy
  meta:
    comment: Host-selected login roots for the broker's exact-file token write-back endpoint only
  policy:
    actions:
    - fs.get
    - fs.read
    - fs.write
    resources:
    - bee.env:machine_login_source
    effect: allow
