version: '1.0'
namespace: bee
entries:
- name: workspace_storage_policy
  kind: security.policy
  policy:
    actions:
    - db.get
    resources:
    - bee:workspace_db
    effect: allow
- name: workspace_storage_boundary
  kind: security.policy
  meta:
    comment: Core workspace and client stores remain denied to every application
  policy:
    actions:
    - db.get
    resources:
    - bee:workspace_db
    - bee:client_db
    - bee.client.db:*
    - bee.workspace.db:*
    effect: deny
- name: client_storage_policy
  kind: security.policy
  policy:
    actions:
    - db.get
    resources:
    - bee:client_db
    effect: allow
