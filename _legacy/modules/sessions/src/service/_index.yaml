version: '1.0'
namespace: bee.sessions.service
entries:
- name: process_host
  kind: ns.requirement
  meta:
    comment: Host process tree that supervises the durable session scheduler
  targets:
  - entry: bee.sessions.service:scheduler_service
    path: .host
- name: scheduler_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected policy allowlist for the scheduler actor
  targets:
  - entry: bee.sessions.service:scheduler_service
    path: .lifecycle.security.policies
  - entry: bee.sessions.service:turn_run
    path: .security.policies
- name: scheduler
  kind: library.lua
  source: file://scheduler.lua
  modules:
  - funcs
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    cancellation: bee.sessions.binding:cancellation
- name: scheduler_worker
  kind: process.lua
  source: file://scheduler_worker.lua
  method: main
  modules:
  - process
  - time
  - channel
  - logger
  - hash
  - funcs
  imports:
    bounds: bee.values:bounds
    scheduler: bee.sessions.service:scheduler
    threads_journal: bee.sessions.binding:threads_journal
    executors: bee.sessions.executor:executor_registry
    lifecycle: bee.sessions.binding:control
- name: scheduler_service
  kind: process.service
  meta:
    component_lifecycle: bee.sessions.binding:lifecycle
  process: bee.sessions.service:scheduler_worker
  lifecycle:
    auto_start: true
    security:
      actor:
        id: bee.sessions.scheduler
      policies: []
- name: turn_run
  kind: function.lua
  source: file://scheduler_worker.lua
  method: turn_run
  modules:
  - process
  - time
  - channel
  - logger
  - hash
  - funcs
  imports:
    bounds: bee.values:bounds
    scheduler: bee.sessions.service:scheduler
    threads_journal: bee.sessions.binding:threads_journal
    executors: bee.sessions.executor:executor_registry
    lifecycle: bee.sessions.binding:control
  security:
    policies: []
