version: '1.0'
namespace: bee.security.gov
entries:
- name: governance_delivery_read_policy
  kind: security.policy
  policy:
    actions: [bee.gov.delivery.read]
    resources: '*'
    effect: allow
- name: governance_delivery_manage_policy
  kind: security.policy
  policy:
    actions: [bee.gov.delivery.manage]
    resources: '*'
    effect: allow
- name: governance_delivery_activate_policy
  kind: security.policy
  policy:
    actions: [bee.gov.delivery.activate]
    resources: '*'
    effect: allow
- name: governance_delivery_lease_policy
  kind: security.policy
  meta: {comment: Propose, grant, list and revoke approval leases; separate from activation so an inbox can manage leases without preparing overlays}
  policy:
    actions: [bee.gov.delivery.lease]
    resources: '*'
    effect: allow
- name: workspace_folder_read_policy
  kind: security.policy.expr
  meta: {comment: Lets the governance destination read one workspace's catalog row to root its file grants; nothing else}
  policy:
    expression: '(action == "funcs.call" && resource == "bee.workspace.catalog:read") || action == "bee.workspace.manager.read"'
    actions: [funcs.call, bee.workspace.manager.read]
    resources: ['*']
    effect: allow
- name: protected_kernel
  kind: registry.entry
  meta:
    type: bee.protected_kernel
    comment: Host trust map no overlay profile can open; preflight refuses edits to these definitions, their transitive code dependencies and requirement selectors aimed at them
  data:
    revision: 3
    namespaces: [bee.app, bee.approvals, bee.apps, bee.capability, bee.client, bee.console, bee.deps,
      bee.desktop, bee.docs, bee.env, bee.gateway, bee.governance, bee.gov, bee.hive,
      bee.host, bee.hub, bee.interaction, bee.launch, bee.node, bee.persist, bee.protocol,
      bee.security, bee.session, bee.settings, bee.storage, bee.sync, bee.terminal, bee.threads,
      bee.workspace]
    super_edit: []
    entries: ['bee.security.gov:protected_kernel', 'bee.security.approvals:approver_policies', 'bee.security.capability:capability_catalog', 'bee.env:gov_activation_profiles',
      'bee.env:gov_publication_profiles', 'bee.deps:gov', 'bee.deps:approvals', 'bee.gateway.env:module_installation',
      'bee.gateway.env:module_publication', 'bee.hub.publication:hub_publication']
