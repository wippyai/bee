version: '1.0'
namespace: bee.harness.launch
entries:
- name: definitions
  kind: library.lua
  source: file://definition.lua
  modules: [hash, registry]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
- name: admission
  kind: library.lua
  source: file://admission.lua
  modules: [hash, registry, funcs, process, security, time]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    catalog: bee.harness.catalog:catalog
    policy: bee.harness.carrier:policy
    definition: bee.harness.launch:definitions
    carrier: bee.harness.carrier:machine
    placement_types: bee.placement:types
    placement_resolver: bee.placement.registry:resolver
    continuation: bee.harness.carrier:continuation
    interrupted: bee.harness.window:interrupted
    profiles: bee.harness.profiles:protocol
    agent_protocol: bee.application:agent_protocol
- name: resolve
  kind: function.lua
  source: file://resolve_method.lua
  method: handle
  imports:
    admission: bee.harness.launch:admission
    bounds: bee.threads.records:bounds
- name: admit
  kind: function.lua
  source: file://admit_method.lua
  method: handle
  imports:
    admission: bee.harness.launch:admission
- name: start
  kind: function.lua
  source: file://start_method.lua
  method: handle
  imports:
    admission: bee.harness.launch:admission
  security:
    policies: [bee.security.harness:launch_spawn_policy]
- name: selection
  kind: library.lua
  source: file://selection.lua
  modules: [funcs, registry]
  imports:
    catalog: bee.harness.catalog:catalog
    definitions: bee.harness.launch:definitions
    admission: bee.harness.launch:admission
    bounds: bee.threads.records:bounds
    policy: bee.harness.carrier:policy
    profiles: bee.harness.profiles:protocol
- name: setup_backend
  kind: function.lua
  source: file://setup_backend.lua
  method: handle
  modules: [hash, funcs, registry, security]
  imports:
    bounds: bee.threads.records:bounds
    definition: bee.harness.launch:definitions
- name: setup
  kind: function.lua
  source: file://setup_method.lua
  method: handle
  modules: [funcs, security]
  imports:
    bounds: bee.threads.records:bounds
    admission: bee.harness.launch:admission
  security:
    policies: [bee.harness.launch:setup_facade_policy]
- name: agent_launch
  kind: library.lua
  source: file://agent_launch.lua
  modules: [hash]
  imports:
    bounds: bee.threads.records:bounds
- name: agent_launch_call
  kind: function.lua
  source: file://agent_launch_call_method.lua
  method: handle
  modules: [ctx]
  imports:
    agent_protocol: bee.application:agent_protocol
    bounds: bee.threads.records:bounds
    caller_launch: bee.harness.launch:caller_launch
  meta:
    type: tool
    title: Launch a managed agent
    llm_alias: BeeThreadLaunch
    llm_description: Start one allow-listed managed agent, in your own workspace or in workspace_id when your host lets you launch there, hand it a brief, and get back the child's thread, action and attempt so you can thread_read, thread_message, thread_notify and thread_wait on it. By default it joins your thread; thread names an existing thread you belong to (thread_id) or a new one (title); workdir names a workspace resource (resource) or a folder under a root the host admits (root_ref, path); placement is native or docker; a saved profile selects preferences for its definition. Each choice is refused unless the definition and its launch policy allow it. The child receives exactly its own launch policy's gateway tools and holds its workspace's host while it runs. It mints no grant, credential, trait or overlay authority.
    input_schema: |
      {"type":"object","additionalProperties":false,"required":["definition_ref","brief","idempotency_key"],"properties":{"definition_ref":{"type":"string","minLength":1,"maxLength":160},"brief":{"type":"string","minLength":1,"maxLength":16384},"idempotency_key":{"type":"string","minLength":1,"maxLength":64},"workspace_id":{"type":"string","minLength":32,"maxLength":32},"saved_profile_id":{"type":"string","minLength":1,"maxLength":160},"saved_profile_revision":{"type":"integer","minimum":1},"workdir":{"type":"object","additionalProperties":false,"properties":{"resource":{"type":"string","minLength":1,"maxLength":160},"root_ref":{"type":"string","minLength":1,"maxLength":160},"path":{"type":"string","maxLength":1024}}},"thread":{"type":"object","additionalProperties":false,"properties":{"thread_id":{"type":"string","minLength":1,"maxLength":160},"title":{"type":"string","minLength":1,"maxLength":512}}},"placement":{"type":"string","enum":["native","docker"]}}}
  security:
    policies: [bee.harness.launch:agent_launch_facade_policy]
- name: caller_launch
  kind: library.lua
  source: file://caller_launch.lua
  modules: [funcs, security]
  imports:
    agent_protocol: bee.application:agent_protocol
    bounds: bee.threads.records:bounds
    agent_launch: bee.harness.launch:agent_launch
    definitions: bee.harness.launch:definitions
- name: agent_launch_backend
  kind: function.lua
  source: file://agent_launch_method.lua
  method: handle
  modules: [ctx]
  imports:
    agent_protocol: bee.application:agent_protocol
    bounds: bee.threads.records:bounds
    agent_launch: bee.harness.launch:agent_launch
    policy: bee.harness.carrier:policy
    definitions: bee.harness.launch:definitions
    caller_launch: bee.harness.launch:caller_launch
  meta:
    type: internal
- name: agent_call
  kind: function.lua
  source: file://agent_call_method.lua
  method: handle
  modules: [security]
  imports:
    agent_protocol: bee.application:agent_protocol
    bounds: bee.threads.records:bounds
    agent_launch: bee.harness.launch:agent_launch
    caller_launch: bee.harness.launch:caller_launch
  meta:
    comment: The application facade for managed agents; a host grants an application bee.harness.launch on the definitions it may start
  security:
    policies: [bee.harness.launch:agent_call_facade_policy]
- name: agent_call_backend
  kind: function.lua
  source: file://agent_call_backend.lua
  method: handle
  modules: [funcs, security, registry]
  imports:
    agent_protocol: bee.application:agent_protocol
    bounds: bee.threads.records:bounds
    agent_launch: bee.harness.launch:agent_launch
    definitions: bee.harness.launch:definitions
    caller_launch: bee.harness.launch:caller_launch
    placement_resolver: bee.placement.registry:resolver
  meta:
    type: internal
- name: agent_call_facade_policy
  kind: security.policy.expr
  meta:
    comment: The application facade runs as the calling application; it may enter the host-named launch scope and call its backend, and nothing else
  policy:
    expression: '(action == "funcs.security" && resource == "security") || (action == "security.policy_group.get" && resource == "bee.harness.launch:agent_launch_execution_scope") || (action == "funcs.call" && resource == "bee.harness.launch:agent_call_backend") || action == "security.actor.create"'
    actions: [funcs.security, security.policy_group.get, funcs.call, security.actor.create]
    resources: [security, bee.harness.launch:agent_launch_execution_scope, bee.harness.launch:agent_call_backend, '*']
    effect: allow
- name: agent_launch_facade_policy
  kind: security.policy.expr
  meta:
    comment: The agent-launch facade runs as the bound subject; it may read the caller's own launch policy and enter the host-named launch scope, and nothing else. The scope below carries the launch pipeline and mints no grant, credential or overlay authority of its own
  policy:
    expression: '(action == "funcs.security" && resource == "security") || (action == "security.policy_group.get" && resource == "bee.harness.launch:agent_launch_execution_scope") || (action == "funcs.call" && resource == "bee.harness.launch:agent_launch_backend") || action == "security.actor.create"'
    actions: [funcs.security, security.policy_group.get, funcs.call, security.actor.create]
    resources: [security, bee.harness.launch:agent_launch_execution_scope, bee.harness.launch:agent_launch_backend, '*']
    effect: allow
- name: agent_launch_execution_call_policy
  kind: security.policy
  groups: [agent_launch_execution_scope]
  meta:
    comment: The exact owner operations launch admission and start call, run as the launching agent's own actor; the child itself runs under its own launch policy, never this one
  policy:
    actions: [funcs.call]
    resources: [bee.harness.launch:start, bee.harness.launch:admit, bee.harness.launch:resolve, bee.harness.launch:setup, bee.harness.profiles:call,
      bee.threads.service:get, bee.threads.service:create, bee.resources.binding:grant, bee.credentials.binding:issue_projection, bee.threads.carrier:checkpoint,
      bee.resources.binding:associate, bee.credentials.binding:define, bee.threads.delivery:watch, bee.placement.native:stop]
    effect: allow
- name: agent_launch_execution_action_policy
  kind: security.policy.expr
  groups: [agent_launch_execution_scope]
  meta:
    comment: The membership, grant and projection actions the called owner operations check again in this scope, plus the registry and process-host access launch admission and start require; setup, grants and projections stay in the workspace the launching actor is bound to
  policy:
    expression: 'action == "registry.get" || action == "registry.snapshot" || action == "process.spawn" || action == "process.spawn.monitored" || action == "process.host" || action == "process.context" || action == "process.monitor" || action == "bee.threads.create" || action == "bee.threads.observe" || ((action == "bee.harness.setup" || action == "bee.resources.grant" || action == "bee.credentials.issue") && resource != "" && resource == actor.meta.workspace_id) || (action == "bee.harness.profiles.read" && resource != "" && resource == actor.meta.workspace_id && resource == meta.workspace_id)'
    actions: [registry.get, registry.snapshot, process.spawn, process.spawn.monitored, process.host, process.context, process.monitor, bee.harness.setup, bee.threads.create, bee.threads.observe, bee.resources.grant, bee.credentials.issue, bee.harness.profiles.read]
    resources: '*'
    effect: allow
- name: setup_execution_policy
  kind: security.policy.expr
  groups: [harness_setup_execution_scope]
  policy:
    expression: '(action == "funcs.call" && (resource == "bee.resources.binding:associate" || resource == "bee.resources.binding:list" || resource == "bee.credentials.binding:define" || resource == "bee.credentials.binding:list")) || ((action == "bee.resources.manage" || action == "bee.credentials.manage") && resource != "" && resource == actor.meta.workspace_id) || action == "registry.get"'
    actions: [funcs.call, bee.resources.manage, bee.credentials.manage, registry.get]
    resources: '*'
    effect: allow
- name: setup_facade_policy
  kind: security.policy.expr
  policy:
    expression: '(action == "funcs.security" && resource == "security") || (action == "security.policy_group.get" && resource == "bee.harness.launch:harness_setup_execution_scope") || (action == "funcs.call" && resource == "bee.harness.launch:setup_backend") || action == "registry.snapshot"'
    actions: [funcs.security, security.policy_group.get, funcs.call, registry.snapshot]
    resources: '*'
    effect: allow
