version: '1.0'
namespace: bee.governance_workspace_probe
entries:
- name: workers
  kind: process.host
  host: {workers: 2, max_processes: 8}
  lifecycle: {auto_start: true}
- name: owner_policy
  kind: security.policy
  policy:
    actions: [funcs.call, funcs.security, security.actor.create, security.scope.create, security.policy.get]
    resources: '*'
    effect: allow
- name: call_policy
  kind: security.policy
  policy:
    actions: [funcs.call]
    resources: [bee.governance:workspace_call]
    effect: allow
- name: read_policy
  kind: security.policy
  policy: {actions: [bee.governance.workspace.read], resources: 'demo', effect: allow}
- name: write_policy
  kind: security.policy
  policy: {actions: [bee.governance.workspace.write], resources: 'demo', effect: allow}
- name: main
  kind: process.lua
  source: file://main.lua
  method: main
  modules: [funcs, security, logger]
  imports: {bounds: bee.threads.records:bounds}
  security: {policies: [bee.governance_workspace_probe:owner_policy]}
  meta:
    command:
      name: governance-workspace-probe
      security:
        actor: {id: bee.governance_workspace_probe}
