version: '1.0'
namespace: bee.credentials
entries:
- name: formats_test
  kind: function.lua
  source: file://formats_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    formats: bee.credentials:formats
- name: sentinel_storage
  kind: env.storage.memory
  meta: {type: test_support}
  lifecycle:
    auto_start: true
- name: sentinel_key
  kind: env.variable
  meta: {type: test_support}
  storage: bee.credentials:sentinel_storage
  variable: BEE_TEST_SENTINEL_KEY
  default: sentinel-secret-7f3a9c
  readonly: true
- name: missing_key
  kind: env.variable
  meta: {type: test_support}
  storage: bee.credentials:sentinel_storage
  variable: BEE_TEST_MISSING_KEY
  default: ''
  readonly: true
- name: broken_key
  kind: env.variable
  meta: {type: test_support}
  storage: bee.credentials:sentinel_storage
  variable: BEE_TEST_BROKEN_KEY
  default: "broken\nsecret-9d8e7f"
  readonly: true
- name: other_key
  kind: env.variable
  meta: {type: test_support}
  storage: bee.credentials:sentinel_storage
  variable: BEE_TEST_OTHER_KEY
  default: other-secret-1b2c3d
  readonly: true
- name: codex_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/codex-login-fixture
  auto_init: true
- name: claude_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/claude-login-fixture
  auto_init: true
- name: placement_claude_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/placement-claude-login-fixture
  auto_init: true
- name: invalid_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/invalid-login-fixture
  auto_init: true
- name: missing_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/missing-login-fixture
  auto_init: true
- name: unprivileged_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/unprivileged-login-fixture
  auto_init: true
- name: unreadable_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/missing-login-fixture
  mode: '0100'
  auto_init: true
- name: fs_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [fs.get, fs.read, fs.write]
    resources: [bee.credentials:codex_login_fixture, bee.credentials:claude_login_fixture, bee.credentials:placement_claude_login_fixture, bee.credentials:invalid_login_fixture, bee.credentials:missing_login_fixture, bee.credentials:unprivileged_login_fixture]
    effect: allow
- name: probe_direct_fs_read
  kind: function.lua
  source: file://probe_direct_fs_read.lua
  method: handle
  meta: {type: test_support}
  modules: [fs]
- name: apply_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [registry.apply]
    resources: '*'
    effect: allow
- name: client_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.credentials.binding:define, bee.credentials.binding:issue_projection, bee.credentials.binding:check, bee.credentials.binding:renew_attempt, bee.credentials.binding:materialize, bee.credentials.binding:revoke,
      bee.credentials.binding:revoke_all, bee.credentials.binding:list, bee.credentials.binding:capabilities, bee.credentials.binding:availability, bee.credentials:probe_direct_fs_read]
    effect: allow
- name: broker_test
  kind: function.lua
  source: file://broker_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [funcs, security, registry, time, json, fs, sql]
  security:
    policies: [bee.credentials:apply_test_policy, bee.credentials:fs_test_policy, bee.credentials.security:credential_store_policy]
  imports:
    bounds: bee.values:bounds
    principals: bee.tests.principals:bound
    test: wippy.test:test
    credential_protocol: bee.credentials:protocol
    store: bee.credentials.persist:store
- name: approved_login_fixture
  kind: function.lua
  source: file://login_fixtures.lua
  method: approved
  meta: {type: test_support}
- name: claiming_login_fixture
  kind: function.lua
  source: file://login_fixtures.lua
  method: claiming
  meta: {type: test_support}
- name: sources_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.credentials:approved_login_fixture, bee.credentials:claiming_login_fixture]
    effect: allow
- name: sources_test
  kind: function.lua
  source: file://sources_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry]
  security:
    policies: [bee.credentials:apply_test_policy, bee.credentials:sources_test_policy]
  imports:
    test: wippy.test:test
    bounds: bee.values:bounds
    sources: bee.credentials.binding:sources
