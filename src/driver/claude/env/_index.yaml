version: '1.0'
namespace: bee.driver.claude.env
entries:
- name: executable
  kind: env.variable
  storage: bee.harness.host:environment
  variable: claude
  default: ''
  readonly: true
- name: api_key
  kind: env.variable
  storage: bee.harness.host:environment
  variable: ANTHROPIC_API_KEY
  default: ''
  readonly: true
- name: config_home
  kind: env.variable
  storage: bee.harness.host:environment
  variable: CLAUDE_CONFIG_DIR
  default: ''
  readonly: true
