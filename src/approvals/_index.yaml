version: '1.0'
namespace: bee.approvals
entries:
- name: definition
  kind: ns.definition
  module: approvals
  readme: file://README.md
  meta:
    title: Bee approvals
    comment: Owner-local approval authority; requests bound to an exact proposal digest, decisions by compare-and-set, a durable outbox projecting onto threads
- name: target_db
  kind: ns.requirement
  meta:
    comment: SQL resource for approval requests, history, inbox and outbox
  default: bee.approvals:db
  targets:
  - entry: bee.approvals:database_ref
    path: .resource_ref
- name: target_policies
  kind: ns.requirement
  meta:
    comment: The host's approver policies; each names its approvers and the longest request lifetime it allows
  default: bee.approvals:approver_policies
  targets:
  - entry: bee.approvals:policies_ref
    path: .resource_ref
- name: database_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked SQL resource; target_db fills resource_ref
- name: policies_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked approver policies entry; target_policies fills resource_ref
- name: approver_policies
  kind: registry.entry
  meta:
    type: bee.approval_policies
    comment: Host-owned approver policies; an empty list admits no request
  policies: []
- name: environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: db_path
  kind: env.variable
  storage: bee.approvals:environment
  variable: BEE_APPROVALS_DB
  default: .wippy/approvals.db
  readonly: true
- name: db
  kind: db.sql.sqlite
  file: ${env:bee.approvals:db_path}
  lifecycle:
    auto_start: true
- name: migrations
  kind: library.lua
  source: file://migrations.lua
- name: resources
  kind: library.lua
  source: file://resources.lua
  modules: [registry]
- name: service
  kind: library.lua
  source: file://service.lua
  modules: [sql, hash, time, uuid, json, security, system, process, funcs]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    values: bee.threads.records:values
    persist: bee.persist:database
    transaction: bee.persist:transaction
    migrations: bee.approvals:migrations
    resources: bee.approvals:resources
- name: outbox
  kind: library.lua
  source: file://outbox.lua
  modules: [sql, json, funcs, time]
  imports:
    transaction: bee.persist:transaction
    resources: bee.approvals:resources
- name: worker
  kind: process.lua
  source: file://worker.lua
  method: main
  modules: [process, channel, time]
  imports:
    service: bee.approvals:service
    outbox: bee.approvals:outbox
- name: authority
  kind: process.lua
  source: file://authority.lua
  method: main
  modules: [process]
  imports:
    service: bee.approvals:service
- name: authority_service
  kind: process.service
  process: bee.approvals:authority
  host: bee:workers
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.approvals.authority}
      policies: [bee:approval_store_policy, bee:approval_owner_policy]
- name: worker_service
  kind: process.service
  process: bee.approvals:worker
  host: bee:workers
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.approvals.outbox}
      policies: [bee:approval_store_policy, bee:approval_owner_policy, bee:thread_approval_policy, bee:thread_approval_client_policy]
- name: contract
  kind: contract.definition
  meta:
    comment: Approval requests for one node's workspaces; decisions belong to eligible approvers, consumption to the requester
  methods:
  - name: feed_snapshot
    description: Snapshot authorized inbox projections with an owner cursor and visibility revision
  - name: feed_read_after
    description: Catch up authorized approval changes using the shared sync envelope
  - name: request
    description: Ask for a decision on one exact proposal under a host approver policy; the same key replays and a different request under it conflicts
  - name: decide
    description: Settle the pending revision for the recorded proposal digest; an identical retry replays and any other decision conflicts
  - name: withdraw
    description: End the caller's own pending request, or learn the outcome that already committed
  - name: consume
    description: The effect owner binds an approved decision to one effect identity under the authority incarnation it observed; it revalidates policy, attempt state and authority itself before acting
  - name: revalidate
    description: After an authority restart, the effect owner records that an approved decision still holds under the current incarnation
  - name: read
    description: One request, for its requester, an eligible approver or a workspace manager
  - name: inbox
    description: An approver's bounded catch-up over one workspace's changes
  - name: list
    description: The caller's own requests
  - name: deliveries
    description: Thread projection deliveries for one request; a manager may return an exhausted one to the queue
  - name: reconcile
    description: The owner expires due requests and forgets settled ones past retention
  - name: capabilities
    description: States, bounds and delivery guarantees of this owner
- name: local
  kind: contract.binding
  contracts:
  - contract: bee.approvals:contract
    methods:
      feed_snapshot: bee.approvals:feed_snapshot
      feed_read_after: bee.approvals:feed_read_after
      request: bee.approvals:request
      decide: bee.approvals:decide
      withdraw: bee.approvals:withdraw
      consume: bee.approvals:consume
      revalidate: bee.approvals:revalidate
      read: bee.approvals:read
      inbox: bee.approvals:inbox
      list: bee.approvals:list
      deliveries: bee.approvals:deliveries
      reconcile: bee.approvals:reconcile
      capabilities: bee.approvals:capabilities
- name: request
  kind: function.lua
  source: file://request_method.lua
  method: handle
  imports:
    service: bee.approvals:service
  security:
    policies: [bee:approval_store_policy]
- name: feed_snapshot
  kind: function.lua
  source: file://feed_snapshot_method.lua
  method: handle
  imports: {service: bee.approvals:service}
  security: {policies: [bee:approval_store_policy]}
  meta:
    hive: policy
    hive_operation:
      revision: '1'
      title: Authorized approval snapshot
      input:
        type: object
        additionalProperties: false
        required: [workspace_id]
        properties:
          workspace_id: {type: string}
          limit: {type: integer, minimum: 1, maximum: 64}
          after_key: {type: string}
          expected_cursor: {type: integer, minimum: 0}
          expected_scope_revision: {type: string}
      output: &approval_reply
        type: object
        additionalProperties: false
        properties:
          ok: {type: boolean}
          error: {type: object}
          value: {}
          replayed: {type: boolean}
- name: feed_read_after
  kind: function.lua
  source: file://feed_read_after_method.lua
  method: handle
  imports: {service: bee.approvals:service}
  security: {policies: [bee:approval_store_policy]}
  meta:
    hive: policy
    hive_operation:
      revision: '1'
      title: Authorized approval changes
      input:
        type: object
        additionalProperties: false
        required: [workspace_id, cursor, expected_scope_revision]
        properties:
          workspace_id: {type: string}
          cursor: {type: integer, minimum: 0}
          limit: {type: integer, minimum: 1, maximum: 64}
          expected_scope_revision: {type: string}
      output: *approval_reply
- name: decide
  kind: function.lua
  meta:
    hive: policy
    hive_operation:
      revision: '1'
      title: Decide one exact approval
      input:
        type: object
        additionalProperties: false
        required: [approval_id, expected_revision, decision, proposal_digest]
        properties:
          approval_id: {type: string}
          expected_revision: {type: integer, minimum: 1}
          decision: {type: string, enum: [approved, denied]}
          proposal_digest: {type: string}
          response: {}
      output: *approval_reply
  source: file://decide_method.lua
  method: handle
  imports:
    service: bee.approvals:service
  security:
    policies: [bee:approval_store_policy]
- name: withdraw
  kind: function.lua
  meta:
    hive: policy
    hive_operation:
      revision: '1'
      title: Withdraw own approval request
      input: {type: object, additionalProperties: false, required: [approval_id], properties: {approval_id: {type: string}}}
      output: *approval_reply
  source: file://withdraw_method.lua
  method: handle
  imports:
    service: bee.approvals:service
  security:
    policies: [bee:approval_store_policy]
- name: consume
  kind: function.lua
  source: file://consume_method.lua
  method: handle
  imports:
    service: bee.approvals:service
  security:
    policies: [bee:approval_store_policy]
- name: revalidate
  kind: function.lua
  source: file://revalidate_method.lua
  method: handle
  imports:
    service: bee.approvals:service
  security:
    policies: [bee:approval_store_policy]
- name: read
  kind: function.lua
  meta:
    hive: policy
    hive_operation:
      revision: '1'
      title: Read authorized approval request
      input: {type: object, additionalProperties: false, required: [approval_id], properties: {approval_id: {type: string}}}
      output: *approval_reply
  source: file://read_method.lua
  method: handle
  imports:
    service: bee.approvals:service
  security:
    policies: [bee:approval_store_policy]
- name: inbox
  kind: function.lua
  source: file://inbox_method.lua
  method: handle
  imports:
    service: bee.approvals:service
  security:
    policies: [bee:approval_store_policy]
- name: list
  kind: function.lua
  source: file://list_method.lua
  method: handle
  imports:
    service: bee.approvals:service
  security:
    policies: [bee:approval_store_policy]
- name: reconcile
  kind: function.lua
  source: file://reconcile_method.lua
  method: handle
  imports:
    service: bee.approvals:service
  security:
    policies: [bee:approval_store_policy]
- name: capabilities
  kind: function.lua
  source: file://capabilities_method.lua
  method: handle
  imports:
    service: bee.approvals:service
  security:
    policies: [bee:approval_store_policy]
- name: deliveries
  kind: function.lua
  source: file://deliveries_method.lua
  method: handle
  modules: [security]
  imports:
    bounds: bee.threads.records:bounds
    service: bee.approvals:service
    outbox: bee.approvals:outbox
  security:
    policies: [bee:approval_store_policy]
