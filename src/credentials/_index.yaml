version: '1.0'
namespace: bee.credentials
entries:
- name: definition
  kind: ns.definition
  module: credentials
  readme: file://README.md
  meta:
    title: Bee credentials
    comment: Owner-local credential broker; definitions reference host-admitted sources, projections bind an attempt, bytes move once to the materializer
- name: target_db
  kind: ns.requirement
  meta:
    comment: SQL resource for definitions and projections
  default: bee.credentials:db
  targets:
  - entry: bee.credentials:database_ref
    path: .resource_ref
- name: target_sources
  kind: ns.requirement
  meta:
    comment: The host's admitted credential sources, the ceiling every definition stays under
  default: bee:credential_sources
  targets:
  - entry: bee.credentials:sources_ref
    path: .resource_ref
- name: database_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked SQL resource; target_db fills resource_ref
- name: sources_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked host sources entry; target_sources fills resource_ref
- name: environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: db_path
  kind: env.variable
  storage: bee.credentials:environment
  variable: BEE_CREDENTIALS_DB
  default: .wippy/credentials.db
  readonly: true
- name: db
  kind: db.sql.sqlite
  file: ${env:bee.credentials:db_path}
  lifecycle:
    auto_start: true
- name: migrations
  kind: library.lua
  source: file://migrations.lua
- name: sources
  kind: library.lua
  source: file://sources.lua
  modules: [registry]
- name: formats
  kind: library.lua
  source: file://formats.lua
  imports:
    bounds: bee.threads.records:bounds
- name: broker
  kind: library.lua
  source: file://broker.lua
  modules: [sql, hash, time, uuid, security, system, env, fs, json]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    persist: bee.persist:database
    transaction: bee.persist:transaction
    migrations: bee.credentials:migrations
    sources: bee.credentials:sources
- name: contract
  kind: contract.definition
  meta:
    comment: Definitions and projections for one node's workspaces; check and materialize are for admitted materializers only
  methods:
  - name: define
    description: Name a credential from a host-admitted source; optional expected_revision fences create or replacement
  - name: issue_projection
    description: Bind a credential to one attempt, profile, binding and policy for one audience, as the authenticated subject
  - name: check
    description: Re-check a projection's bindings without bytes
  - name: availability
    description: Check the provider-fixed login file for an existing workspace credential without reading bytes
  - name: materialize
    description: Re-check a projection and return its bytes once to the admitted materializer
  - name: revoke
    description: End one projection
  - name: revoke_all
    description: Advance the workspace authorization epoch so every earlier projection stops resolving
  - name: list
    description: A manager's view of definitions and live projections
- name: local
  kind: contract.binding
  contracts:
  - contract: bee.credentials:contract
    methods:
      define: bee.credentials:define
      issue_projection: bee.credentials:issue_projection
      check: bee.credentials:check
      availability: bee.credentials:availability
      materialize: bee.credentials:materialize
      revoke: bee.credentials:revoke
      revoke_all: bee.credentials:revoke_all
      list: bee.credentials:list
- name: define
  kind: function.lua
  source: file://define_method.lua
  method: handle
  imports:
    broker: bee.credentials:broker
  security:
    policies: [bee:credential_store_policy]
- name: issue_projection
  kind: function.lua
  source: file://issue_projection_method.lua
  method: handle
  imports:
    broker: bee.credentials:broker
  security:
    policies: [bee:credential_store_policy]
- name: check
  kind: function.lua
  source: file://check_method.lua
  method: handle
  imports:
    broker: bee.credentials:broker
  security:
    policies: [bee:credential_store_policy]
- name: availability
  kind: function.lua
  source: file://availability_method.lua
  method: handle
  imports:
    broker: bee.credentials:broker
  security:
    policies: [bee:credential_store_policy, bee:credential_file_policy]
- name: materialize
  kind: function.lua
  source: file://materialize_method.lua
  method: handle
  imports:
    broker: bee.credentials:broker
  security:
    policies: [bee:credential_store_policy, bee:credential_file_policy]
- name: revoke
  kind: function.lua
  source: file://revoke_method.lua
  method: handle
  imports:
    broker: bee.credentials:broker
  security:
    policies: [bee:credential_store_policy]
- name: revoke_all
  kind: function.lua
  source: file://revoke_all_method.lua
  method: handle
  imports:
    broker: bee.credentials:broker
  security:
    policies: [bee:credential_store_policy]
- name: list
  kind: function.lua
  source: file://list_method.lua
  method: handle
  imports:
    broker: bee.credentials:broker
  security:
    policies: [bee:credential_store_policy]
- name: capabilities
  kind: function.lua
  source: file://capabilities_method.lua
  method: handle
  imports:
    broker: bee.credentials:broker
  security:
    policies: [bee:credential_store_policy]
