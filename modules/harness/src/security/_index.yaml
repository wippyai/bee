version: '1.0'
namespace: bee.harness.security
entries:
- name: launch_spawn_policy
  kind: security.policy
  meta:
    comment: Launch start spawns the carrier on the workers host as the requester; the requester's own scope supplies everything
      else
  policy:
    actions:
    - process.spawn
    - process.spawn.monitored
    - process.host
    - process.monitor
    - process.context
    resources:
    - bee.harness.carrier:process
    - bee:workers
    - context
    effect: allow
- name: carrier_policy
  kind: security.policy
  meta:
    comment: A carrier process calls the thread, placement and driver facades and reads the catalog and its launch policy;
      it holds no executor
  policy:
    actions:
    - funcs.call
    - registry.get
    - process.send
    - bee.threads.lifecycle
    - bee.threads.carrier
    - bee.threads.observe
    - bee.gateway.admit
    - security.scope.create
    - funcs.security
    resources: ['*', custom, security]
    effect: allow
- name: carrier_process_registry_policy
  kind: security.policy.expr
  meta:
    comment: A carrier registers only its own attempt name so managed-run recovery can distinguish a live carrier from an orphan
  policy:
    expression: '((action == "process.registry.register" || action == "process.registry.unregister") && resource matches "^bee[.]harness[.]carrier/attempt[-:][A-Za-z0-9_.:-]+$")'
    actions: [process.registry.register, process.registry.unregister]
    resources: '*'
    effect: allow
- name: harness_setup_policy
  kind: security.policy.expr
  meta:
    comment: Host setup runs only for the workspace the caller's host-issued identity is bound to; the Agent application
      also resolves the public sessions contracts, whose owner authorizes each operation
  policy:
    expression: (action == "bee.harness.setup" && resource != "" && resource == actor.meta.workspace_id) || (action == "funcs.call" && resource == "bee.harness.launch:setup") || (action == "contract.get" && (resource == "bee.sessions:contract" || resource == "bee.sessions:catalog")) || (action == "contract.call" && resource in ["open", "run", "send", "await", "join", "get", "list", "cancel", "close"]) || (action == "contract.open" && (resource == "bee.sessions.binding:owner_binding" || resource == "bee.sessions.binding:catalog_binding"))
    actions:
    - bee.harness.setup
    - funcs.call
    - contract.get
    - contract.open
    - contract.call
    resources: '*'
    effect: allow
- name: carrier_environment_policy
  kind: security.policy
  meta:
    comment: The managed harness boundary reads declared nonsecret executable and configuration-directory variables
      while resolving host launch policy, so admission resolves the executable_env and environment_refs of the
      definitions it admits
  policy:
    actions:
    - env.get
    resources:
    - bee.driver.claude:executable
    - bee.driver.codex:executable
    - bee.driver.agy:executable
    - bee.driver.grok:executable
    - bee.driver.muse:executable
    - bee.driver.opencode:executable
    - bee.driver.claude:config_home
    - bee.driver.codex:config_home
    effect: allow
- name: launch_locate_probe_policy
  kind: security.policy.expr
  meta:
    comment: The host readiness probe resolves activated CLI descriptors, their nonsecret PATH executables and version strings, and alternative login metadata without reading credential contents
  policy:
    expression: '(action == "env.get" && (resource matches "^bee[.]driver[.](claude|codex|opencode|agy|grok|muse):executable$" || resource == "bee.harness.launch:host_environment_names" || resource == "bee.env:machine_home")) || ((action == "registry.get" || action == "registry.snapshot") && resource != "") || ((action == "exec.get" || action == "exec.run") && resource == "bee.placement.native:placement_executor") || (action == "fs.get" && resource == "bee.env:machine_login_source")'
    actions: [registry.get, registry.snapshot, env.get, exec.get, exec.run, fs.get]
    resources: '*'
    effect: allow
- name: profile_store_policy
  kind: security.policy
  meta:
    comment: Saved profile facade storage access; callers separately require workspace read or write authority
  policy:
    actions:
    - db.get
    - registry.get
    - system.read
    resources:
    - bee.node:db
    - bee.harness.profiles:database_ref
    - node
    effect: allow
- name: profile_workspace_policy
  kind: security.policy.expr
  meta:
    comment: Profile facade supplies the host-inherited workspace as evaluation metadata; request fields cannot
      select it
  policy:
    actions:
    - bee.harness.profiles.read
    - bee.harness.profiles.write
    resources: '*'
    expression: meta.workspace_id != "" && resource == meta.workspace_id
    effect: allow
- name: profile_context_boundary
  kind: security.policy
  meta:
    comment: The Agent app retains its host workspace; it cannot substitute context for profile operations
  policy:
    actions:
    - funcs.context
    - process.context
    resources: '*'
    effect: deny
- name: workspace_launch_policy
  kind: security.policy
  meta:
    comment: Lets a managed agent launch into a workspace other than its binding's; the host attaches it to the launch tool only for agents it trusts to act across workspaces
  policy:
    actions: [bee.workspace.manager.launch]
    resources: '*'
    effect: allow
