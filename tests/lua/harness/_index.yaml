- name: fixture_policy
  kind: registry.entry
  meta:
    type: bee.launch_policy
    test_support: true
    comment: Claude protocol fixture policy; eof_gated and bound to the fixture executable by the suite at runtime
  data:
    schema_revision: bee.launch-policy@1
    required_cleanup: direct_process
    required_exit_observation: eof_gated
    start_ms: 10000
    stop_grace_ms: 500
    drain_ms: 2000
    runner_drain_ms: 1000
    fixture: true
    executables: {}
    environment: {}
    prepare_options: {permission_mode: dontAsk, max_turns: 1}
- name: gateway_fixture_policy
  kind: registry.entry
  meta:
    type: bee.launch_policy
    test_support: true
    comment: The fixture policy with gateway tools admitted; bound to the fixture executable by the suite at runtime
  data:
    schema_revision: bee.launch-policy@1
    required_cleanup: direct_process
    required_exit_observation: eof_gated
    start_ms: 10000
    stop_grace_ms: 500
    drain_ms: 2000
    runner_drain_ms: 1000
    fixture: true
    executables: {}
    environment: {}
    prepare_options: {permission_mode: dontAsk, max_turns: 1}
    gateway_tools: [thread_read, thread_wait]
    gateway_hooks: [SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, Stop]
- name: gateway_expiring_policy
  kind: registry.entry
  meta:
    type: bee.launch_policy
    test_support: true
    comment: The gateway fixture policy with a binding life short enough to expire while a child holds its token
  data:
    schema_revision: bee.launch-policy@1
    required_cleanup: direct_process
    required_exit_observation: eof_gated
    start_ms: 10000
    stop_grace_ms: 500
    drain_ms: 2000
    runner_drain_ms: 1000
    fixture: true
    executables: {}
    environment: {}
    prepare_options: {permission_mode: dontAsk, max_turns: 1}
    gateway_tools: [thread_read, thread_wait]
    gateway_ttl_ms: 2500
- name: claude_gateway_policy
  kind: registry.entry
  meta:
    type: bee.launch_policy
    test_support: true
    comment: Fixture policy for the real Claude executable with gateway tools admitted; the suite binds the executable and the loopback endpoint
  data:
    schema_revision: bee.launch-policy@1
    required_cleanup: direct_process
    required_exit_observation: eof_gated
    start_ms: 30000
    stop_grace_ms: 500
    drain_ms: 2000
    runner_drain_ms: 1000
    fixture: true
    executables: {}
    environment: {}
