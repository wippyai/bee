version: '1.0'
namespace: bee
entries:
- name: docs_corpus
  kind: fs.directory
  directory: ./src/corpus
  mode: '0500'
  auto_init: false
  meta:
    title: Bee agent documentation corpus
    comment: The offline platform documentation a bound agent reads through the gateway docs tool; wippy.yaml embed freezes it read-only into the pack. Rebuilt by build/agent_corpus.py.
- name: docs_policy
  kind: security.policy
  meta:
    comment: The selected docs facade scope resolves one linked corpus reference and reads only that volume
  policy:
    actions: [fs.get, registry.get]
    resources: [bee.docs:corpus_ref, bee:docs_corpus]
    effect: allow
