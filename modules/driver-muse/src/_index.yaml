version: '1.0'
namespace: bee.driver.muse
entries:
- name: definition
  kind: ns.definition
  module: driver-muse
  readme: file://README.md
  meta:
    title: Bee Muse driver
    comment: Optional harness binding; host activation and launch policies authorize its use
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: host_environment
  kind: ns.requirement
  meta:
    comment: Read-only host environment that supplies the selected Muse executable
  default: bee.harness.host:environment
  targets:
  - entry: bee.driver.muse.env:executable
    path: .storage
- name: window_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Muse window route
  default: bee.driver.muse.security:launch_policy_muse_window
  targets:
  - entry: bee.driver.muse.profiles:default_window
    path: .data.policy_ref
- name: batch_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Muse batch route
  default: bee.driver.muse.security:launch_policy_muse_batch
  targets:
  - entry: bee.driver.muse.profiles:research_batch
    path: .data.policy_ref
- name: dependency_values
  kind: ns.dependency
  component: bee/values
  version: '*'
