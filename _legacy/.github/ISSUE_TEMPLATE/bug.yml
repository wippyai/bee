name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow [SECURITY.md](https://github.com/wippyai/bee/blob/main/SECURITY.md). Remove credentials and personal data from logs."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest example that shows the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
