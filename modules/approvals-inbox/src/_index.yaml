version: '1.0'
namespace: bee.approvals.inbox
entries:
- name: definition
  kind: ns.definition
  module: approvals-inbox
  meta:
    title: Bee approvals inbox
    comment: Approvals inbox application; host composition, admitted workspaces and source selection remain in Bee
- name: dependency_application
  kind: ns.dependency
  component: bee/application
  version: '*'
- name: dependency_approvals
  kind: ns.dependency
  component: bee/approvals
  version: '*'
- name: dependency_hive
  kind: ns.dependency
  component: bee/hive
  version: '*'
- name: dependency_sync
  kind: ns.dependency
  component: bee/sync
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: [tty, process, channel, time, uuid, json, funcs, registry]
  imports:
    frame: bee.application:frame
    client: bee.application:client
    appearance: bee.application:appearance
    model: bee.approvals.inbox:model
    view: bee.approvals.inbox:view
    inbox: bee.approvals.inbox:client
    caller: bee.application:caller
    feeds: bee.approvals.inbox:feeds
    leases: bee.approvals.inbox:leases
    lease_form: bee.approvals.inbox:lease_form
    source_config: bee.approvals.inbox:source_config
    hive: bee.hive:client
    hive_types: bee.hive:types
  meta:
    type: bee.application
    application:
      api_version: 1
      title: Needs you
      icon: '!'
      lifetime: view
      revision: '1'
      instance_policy: singleton
      group: ''
      role: approvals
      resume_schema: inbox.v1
      restart_policy: manual
- name: model
  kind: library.lua
  source: file://model.lua
  modules: [json]
  imports:
    text: bee.application:text
    bounds: bee.threads.records:bounds
    caller: bee.application:caller
- name: leases
  kind: library.lua
  source: file://leases.lua
  modules: [json]
  imports:
    bounds: bee.threads.records:bounds
    model: bee.approvals.inbox:model
- name: lease_form
  kind: library.lua
  source: file://lease_form.lua
  modules: [tty]
  imports:
    appearance: bee.application:appearance
    frame: bee.application:frame
    forms: bee.application:forms
    model: bee.approvals.inbox:model
    leases: bee.approvals.inbox:leases
- name: client
  kind: library.lua
  source: file://client.lua
  imports:
    caller: bee.application:caller
- name: feeds
  kind: library.lua
  source: file://feeds.lua
  imports:
    bounds: bee.threads.records:bounds
    sync: bee.sync:protocol
    caller: bee.application:caller
    source_config: bee.approvals.inbox:source_config
    model: bee.approvals.inbox:model
- name: source_config
  kind: library.lua
  source: file://sources.lua
  modules: [hash]
  imports:
    bounds: bee.threads.records:bounds
- name: sources
  kind: registry.entry
  meta:
    type: bee.approvals.inbox.sources
    comment: Host-selected remote owner/workspace sources; discovery grants no reading or approval authority
  data: {sources: []}
- name: view
  kind: library.lua
  source: file://view.lua
  imports:
    frame: bee.application:frame
    appearance: bee.application:appearance
    leases: bee.approvals.inbox:leases
    model: bee.approvals.inbox:model
    names: bee.application:names
- name: workspaces
  kind: registry.entry
  meta:
    type: bee.approvals.inbox.workspaces
    comment: Workspace ids the host admits into the local viewer's inbox beside the launch workspace; the approval owner still decides eligibility per request
  data:
    workspaces: []
- name: client_policy
  kind: security.policy
  meta:
    comment: The inbox reads the owner's inbox and requests and submits explicit decisions and withdrawals under the process actor; the owner authorizes each call
  policy:
    actions: [funcs.call, registry.get]
    resources: [bee.workspace.catalog:read, bee.approvals.binding:inbox, bee.approvals.binding:feed_snapshot, bee.approvals.binding:feed_read_after, bee.approvals.binding:read, bee.approvals.binding:decide, bee.approvals.binding:decide_batch, bee.approvals.binding:withdraw, bee.gov.binding:destination_call, bee.approvals.inbox:workspaces, bee.approvals.inbox:sources]
    effect: allow
