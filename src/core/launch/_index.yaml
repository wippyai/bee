version: '1.0'
namespace: bee.launch
entries:
- name: ownership
  kind: library.lua
  source: file://ownership.lua
- name: desktop_lifecycle
  kind: library.lua
  source: file://desktop_lifecycle.lua
  modules: [process, security, channel, time, uuid]
  imports:
    desktops: bee.client:desktops
    attachments: bee.client:attachments
    decode: bee.protocol:decode
    protocol: bee.launch:protocol
    contract: bee.protocol:application
    retained_protocol: bee.launch:retained_protocol
- name: desktop_storage
  kind: library.lua
  source: file://desktop_storage.lua
  modules: [funcs, channel, time]
  imports:
    contract: bee.protocol:application
- name: retained_protocol
  kind: library.lua
  source: file://retained_protocol.lua
  imports:
    arguments: bee.application:arguments
    clipboard: bee.client:clipboard
    contract: bee.protocol:application
- name: headless
  kind: process.lua
  source: file://headless.lua
  method: main
  modules: [process, channel, security, time, logger]
  imports:
    protocol: bee.launch:protocol
    decode: bee.protocol:decode
    workspaces: bee.storage:binding
  meta:
    command:
      name: bee-host
      host: bee:terminal
      short: Run a local workspace without a desktop
      security:
        actor: {id: bee.local}
        policies: [bee:host_policy, bee:local_supervisor_spawn_policy]
- name: bootstrap
  kind: library.lua
  source: file://bootstrap.lua
  modules: [process, channel, tty, security, time]
  imports:
    physical: bee.terminal:display
    input_decode: bee.protocol:input
    contract: bee.protocol:application
    decode: bee.protocol:decode
    workspaces: bee.storage:binding
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  imports:
    contract: bee.protocol:application
    decode: bee.protocol:decode
- name: supervisor
  kind: process.lua
  source: file://supervisor.lua
  method: main
  modules: [process, channel, security, ctx, time, uuid, logger]
  imports: &supervisor_imports
    leases: bee.application:host_leases
    workspaces: bee.storage:binding
    desktop_lifecycle: bee.launch:desktop_lifecycle
    desktop_storage: bee.launch:desktop_storage
    desktops: bee.client:desktops
    attachments: bee.client:attachments
    retained_protocol: bee.launch:retained_protocol
    protocol: bee.launch:protocol
    contract: bee.protocol:application
    decode: bee.protocol:decode
    interaction: bee.application:interaction
- name: retained
  kind: process.lua
  source: file://supervisor.lua
  method: retained
  modules: [process, channel, security, ctx, time, uuid, logger]
  imports: *supervisor_imports

- name: owner
  kind: process.lua
  source: file://owner.lua
  method: main
  modules: [process, channel, security, time, logger, io, system, registry]
  imports:
    retained: bee.launch:retained_protocol
    ownership: bee.launch:ownership
    decode: bee.protocol:decode
    workspaces: bee.storage:binding
  meta:
    comment: Retained workspace owner selected by the native launch host under the runtime state lock
    command:
      name: bee-owner
      host: bee:terminal
      short: Run the retained Bee workspace owner
      security:
        actor: {id: bee.local}
        policies: [bee:desktop_policy, bee:retained_owner_spawn_policy, bee:retained_owner_name_policy, bee:retained_owner_node_policy]
- name: daemon
  kind: process.lua
  source: file://daemon.lua
  method: main
  modules: [process, channel, time, io, system, logger]
  imports:
    leases: bee.application:host_leases
  meta:
    comment: The node daemon selected by the native launch host under the runtime state lock; it composes no folder workspace
    command:
      name: bee-daemon
      host: bee:terminal
      short: Run the node's services without a folder workspace
      security:
        actor: {id: bee.local}
        policies: [bee:retained_owner_node_policy]
- name: hosts
  kind: library.lua
  source: file://hosts.lua
- name: host_manager
  kind: process.lua
  source: file://host_manager.lua
  method: main
  modules: [process, channel, security, time, uuid, logger]
  imports:
    hosts: bee.launch:hosts
    leases: bee.application:host_leases
    protocol: bee.launch:protocol
    decode: bee.protocol:decode
    contract: bee.protocol:application
