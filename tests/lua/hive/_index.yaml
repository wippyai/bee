version: '1.0'
namespace: bee.hive
entries:
- name: enrollment_test
  kind: function.lua
  source: file://enrollment_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    peers: bee.hive.supervisor:peers
    enrollment: bee.hive.supervisor:enrollment
    types: bee.hive:types
- name: peer_restart_test
  kind: function.lua
  source: file://peer_restart_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    peers: bee.hive.supervisor:peers
    types: bee.hive:types
- name: invites_test
  kind: function.lua
  source: file://invites_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    invites: bee.hive.supervisor:invites
- name: probe_exposure_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [hive.expose.open]
    resources: [bee.hive:probe_open]
    effect: allow
- name: probe_open
  kind: function.lua
  source: file://probe_open.lua
  method: handle
  meta:
    type: test_support
    hive: open
    hive_operation:
      revision: '1'
      title: Probe operation
      input:
        type: object
        additionalProperties: false
        properties:
          name: {type: string}
          count: {type: integer}
      output: {type: object, additionalProperties: false, properties: {}}
- name: probe_bad_meta
  kind: function.lua
  source: file://probe_open.lua
  method: handle
  meta:
    type: test_support
    hive: open
- name: probe_policy_mode
  kind: function.lua
  source: file://probe_open.lua
  method: handle
  meta:
    type: test_support
    hive: policy
    hive_operation:
      revision: '1'
      title: Policy probe
      input: {type: object, additionalProperties: false, properties: {}}
      output: {type: object, additionalProperties: false, properties: {}}
- name: probe_tool
  kind: registry.entry
  meta:
    type: hive.interface
    hive_interface:
      kind: tool
      operation_ref: bee.hive:probe_open
      title: Probe tool
      fixed: {count: 5}
      allow: [name]
- name: probe_widening
  kind: registry.entry
  meta:
    type: hive.interface
    hive_interface:
      kind: command
      operation_ref: bee.hive:probe_open
      title: Widening probe
      allow: [name, extra]
- name: catalog_probe
  kind: function.lua
  source: file://catalog_probe.lua
  method: handle
  meta: {type: test_support}
  imports:
    catalog: bee.hive.registry:catalog
- name: fake_supervisor
  kind: process.lua
  source: file://fake_supervisor.lua
  method: main
  meta: {type: test_support}
  modules: [process, channel, time]
  imports:
    types: bee.hive:types
- name: fake_impostor
  kind: process.lua
  source: file://fake_impostor.lua
  method: main
