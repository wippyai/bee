version: '1.0'
namespace: bee.apps.library
entries:
- name: form
  kind: library.lua
  source: file://form.lua
  modules: [json]
  imports:
    bounds: bee.values:bounds
    json_schema: bee.gateway.catalog:json_schema
    requirements: bee.hub.package:requirements
- name: hub
  kind: library.lua
  source: file://hub.lua
  modules:
  - json
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    text: bee.ui:text
    form: bee.apps.library:form
- name: governed
  kind: library.lua
  source: file://governed.lua
  imports:
    bounds: bee.values:bounds
    preflight: bee.gov.binding:preflight
- name: contents
  kind: library.lua
  source: file://contents.lua
  modules:
  - json
  - base64
  imports:
    text: bee.ui:text
- name: model
  kind: library.lua
  source: file://model.lua
  imports:
    governed: bee.apps.library:governed
    hub: bee.apps.library:hub
    drivers: bee.gov.types:drivers
    glyphs: bee.ui:glyphs
- name: hub_view
  kind: library.lua
  source: file://hub_view.lua
  modules:
  - tty
  - json
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    model: bee.apps.library:hub
    contents: bee.apps.library:contents
    form: bee.apps.library:form
- name: view
  kind: library.lua
  source: file://view.lua
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    model: bee.apps.library:model
    governed: bee.apps.library:governed
    hub: bee.apps.library:hub
    hub_view: bee.apps.library:hub_view
    contents: bee.apps.library:contents
    glyphs: bee.ui:glyphs
    text: bee.ui:text
- name: destination_client
  kind: security.policy
  meta:
    comment: The Library calls only the destination-owned governance facade, which authorizes each delivery operation before entering its private scope
  policy:
    actions:
    - funcs.call
    resources:
    - bee.gov.binding:destination_call
    effect: allow
- name: delivery_operations
  kind: security.policy
  meta:
    comment: The person operating the Library reads, receives, reviews, chooses and installs versions delivered to any workspace of this node; the approval decision stays with the approval owner
  policy:
    actions:
    - bee.gov.delivery.read
    - bee.gov.delivery.manage
    - bee.gov.delivery.activate
    - bee.gov.delivery.follow
    resources: '*'
    effect: allow
- name: delivery_share
  kind: security.policy.expr
  meta:
    comment: The person shares the installed version of an application made on this bee with the hive through the delivery facade, which publishes only a version the person installed
  policy:
    expression: (action == "funcs.call" && resource == "bee.gov.binding:delivery_call") || (action == "bee.gov.delivery.publish" && resource != "")
    actions: [funcs.call, bee.gov.delivery.publish]
    resources: [bee.gov.binding:delivery_call, '*']
    effect: allow
- name: hub_client
  kind: security.policy
  meta:
    comment: The Library calls only the public Hub facade, which authorizes each package operation before entering its private execution scope
  policy:
    actions:
    - funcs.call
    resources:
    - bee.hub.binding:call
    effect: allow
- name: hub_operations
  kind: security.policy
  meta:
    comment: The person operating the Library reads, plans and applies Hub package operations; no registry or Hub credential scope is granted to the app
  policy:
    actions:
    - bee.hub.read
    - bee.hub.manage
    resources: '*'
    effect: allow
- name: names_client
  kind: security.policy
  meta:
    comment: The Library asks the node names facade, and only that, which bees its shared versions came from are called
  policy:
    actions:
    - funcs.call
    resources:
    - bee.node.binding:names
    effect: allow
- name: names_read
  kind: security.policy
  meta:
    comment: The person operating the Library reads the name each bee reports for itself; the read names nothing else of a node
  policy:
    actions:
    - bee.node.names.read
    resources:
    - nodes
    effect: allow
- name: self_update
  kind: security.policy
  meta:
    comment: Only the person-operated Library app may update the Bee deployment root; agents receive no self-update authority
  policy:
    actions:
    - bee.hub.self_update
    resources:
    - bee/bee
    effect: allow
- name: app
  kind: process.lua
  meta:
    type: bee.app
    application:
      api_version: 1
      title: Library
      lifetime: view
      revision: '1'
      instance_policy: singleton
      menus: [bee.shell:system_menu]
  source: file://app.lua
  method: main
  modules:
  - json
  - tty
  - process
  - channel
  - uuid
  - funcs
  - time
  imports:
    confirmation: bee.approvals.app:confirmation
    frame: bee.ui:frame
    client: bee.app:client
    appearance: bee.ui:appearance
    model: bee.apps.library:model
    governed: bee.apps.library:governed
    hub: bee.apps.library:hub
    view: bee.apps.library:view
    contents: bee.apps.library:contents
  security:
    policies:
    - bee.security.approvals:confirmation_client
    - bee.security.approvals:confirmation_authority
    - bee.apps.library:destination_client
    - bee.apps.library:delivery_operations
    - bee.apps.library:delivery_share
    - bee.apps.library:hub_client
    - bee.apps.library:hub_operations
    - bee.apps.library:names_client
    - bee.apps.library:names_read
    - bee.apps.library:self_update
