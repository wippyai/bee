version: '1.0'
namespace: bee.node.security
entries:
- name: owner
  kind: security.policy
  meta:
    comment: The node owner reads installed apps and themes, starts and stops app producers, monitors the displays that watch it, and mounts app viewports for them
  policy:
    actions: [registry.get, registry.version, registry.find, process.context, process.security, security.actor.create, security.policy_group.get, security.policy.get, security.scope.create, process.spawn, process.spawn.monitored, process.spawn.linked, process.cancel, process.monitor, process.unmonitor, tty.mount, tty.observe, tty.input, tty.resize]
    resources: '*'
    effect: allow
- name: owner_store
  kind: security.policy
  meta:
    comment: The node owner keeps workspaces, desktops, apps and settings in the node database
  policy:
    actions: [db.get]
    resources: [bee:db]
    effect: allow
- name: owner_host
  kind: security.policy
  meta:
    comment: The node owner runs apps on the workers host
  policy:
    actions: [process.host]
    resources: [bee:workers]
    effect: allow
- name: owner_names
  kind: security.policy
  meta:
    comment: The node owner holds its node-local name and checks requests come from the Hive supervisor
  policy:
    actions: [process.registry.register, process.registry.register.eventual, process.registry.lookup]
    resources: [bee.node, 'bee.node/*', bee.hive.supervisor]
    effect: allow
- name: owner_system
  kind: security.policy
  meta:
    comment: The node owner reads its node identity, the folder it runs in and its runtime numbers
  policy:
    actions: [system.read]
    resources: [node, cluster, cwd, memory, goroutines, cpu]
    effect: allow
- name: identity
  kind: security.policy
  meta:
    comment: Reads this node's identity
  policy:
    actions: [system.read]
    resources: [node]
    effect: allow
- name: owner_registry
  kind: security.policy
  meta:
    comment: The node owner follows registry changes to keep its app and theme catalogs current
  policy:
    actions: [events.subscribe]
    resources: [registry]
    effect: allow
- name: owner_attention
  kind: security.policy
  meta:
    comment: The node owner opens what needs the person when a component announces it
  policy:
    actions: [events.subscribe]
    resources: [bee.attention]
    effect: allow
- name: owner_role
  kind: security.policy
  meta:
    comment: The node owner reads whether this process is a node or an in-memory client
  policy:
    actions: [env.get]
    resources: [bee:role]
    effect: allow
- name: application_base
  kind: security.policy
  groups: [application, scope_managing_application]
  meta:
    comment: Every app may message processes; what else it may do comes from its own process entry and its governed admission
  policy:
    actions: [process.send]
    resources: '*'
    effect: allow
- name: application_boundary
  kind: security.policy
  groups: [application]
  meta:
    comment: No app selects security for other processes, reads policies, or changes the registry
  policy:
    actions: [process.security, security.scope.create, security.policy.get, process.context, registry.apply, registry.apply_version, registry.overlay.apply]
    resources: '*'
    effect: deny
- name: application_scope_boundary
  kind: security.policy
  groups: [scope_managing_application]
  meta:
    comment: An app admitted to manage call scopes builds them, but selects no security for other processes, reads no policy and changes no registry
  policy:
    actions: [process.security, security.policy.get, process.context, registry.apply, registry.apply_version, registry.overlay.apply]
    resources: '*'
    effect: deny
- name: application_spawn_boundary
  kind: security.policy
  groups: [application, scope_managing_application]
  meta:
    comment: No app, and no function an app calls, starts or hosts another instance of the node's own services or displays
  policy:
    actions: [process.spawn, process.spawn.monitored, process.spawn.linked, process.exec, process.host]
    resources: [bee.node.service:owner, bee.hive.service:supervisor, bee.shell:main, bee.shell:client,
      bee.threads.service:threads, bee.threads.service:pump_worker,
      bee.approvals.service:authority, bee.approvals.service:worker, bee.gateway.service:worker,
      bee.gateway.service:publication_worker, bee.gov.service:recovery, bee.sync.service:sync,
      bee.placement.native.service:sweeper, bee.placement.docker.service:sweeper, bee.placement.docker.service:image_owner]
    effect: deny
- name: workspace_catalog_facade
  kind: security.policy.expr
  meta:
    comment: The workspace catalog operations enter the private catalog scope and call its backend; they hold no store or folder grant of their own
  policy:
    expression: (action == "funcs.security" && resource == "security") || (action == "security.policy_group.get" && resource == "bee.node.security:workspace_catalog") || (action == "funcs.call" && resource == "bee.node.binding:catalog")
    actions: [funcs.security, security.policy_group.get, funcs.call]
    resources: [security, bee.node.security:workspace_catalog, bee.node.binding:catalog]
    effect: allow
- name: workspace_catalog_store
  kind: security.policy
  groups: [workspace_catalog]
  meta:
    comment: The catalog backend reads node workspaces from the node database
  policy:
    actions: [db.get]
    resources: [bee:db]
    effect: allow
- name: workspace_catalog_registry
  kind: security.policy
  groups: [workspace_catalog]
  meta:
    comment: The catalog backend finds the admitted roots and their directories in the registry
  policy:
    actions: [registry.get, registry.find]
    resources: '*'
    effect: allow
- name: workspace_catalog_machine
  kind: security.policy
  groups: [workspace_catalog]
  meta:
    comment: The catalog backend lists folders of the machine root; a node that admits another root grants its volume in this group
  policy:
    actions: [fs.get]
    resources: [bee.node:machine]
    effect: allow
- name: workspace_catalog_read_policy
  kind: security.policy
  meta:
    comment: Read the node workspace catalog
  policy:
    actions: [bee.node.workspace.read]
    resources: '*'
    effect: allow
- name: workspace_folder_browse_policy
  kind: security.policy.expr
  meta:
    comment: List the admitted roots and page their folders, to pick a folder under them; reads no workspace
  policy:
    expression: (action == "funcs.call" && resource in ["bee.node.binding:roots", "bee.node.binding:folders"]) || (action == "bee.node.workspace.read" && resource == "catalog") || action == "bee.node.workspace.browse"
    actions: [funcs.call, bee.node.workspace.read, bee.node.workspace.browse]
    resources: '*'
    effect: allow
- name: workspace_folder_read_policy
  kind: security.policy.expr
  meta:
    comment: Read one workspace's catalog row to root file grants in its folder; nothing else
  policy:
    expression: (action == "funcs.call" && resource == "bee.node.binding:read") || action == "bee.node.workspace.read"
    actions: [funcs.call, bee.node.workspace.read]
    resources: '*'
    effect: allow
- name: tests_runner
  kind: security.policy
  meta:
    comment: The test runner reads the registry to find an application and runs each test as that application, with the actor and scope the node gives the application's own instances
  policy:
    actions: [registry.get, registry.version, registry.find, security.actor.create, security.policy_group.get, security.policy.get, funcs.security, funcs.call, security.scope.create]
    resources: '*'
    effect: allow
- name: app_tools_runner
  kind: security.policy
  meta:
    comment: Application tools read the registry for admissions, grant records and tool entries, and run a tool as its application with the actor and scope the node gives the application's own instances
  policy:
    actions: [registry.get, registry.version, registry.find, registry.snapshot, security.actor.create, security.policy_group.get, security.policy.get, funcs.security, funcs.call, security.scope.create]
    resources: '*'
    effect: allow
- name: tests_store
  kind: security.policy
  meta:
    comment: The test runner reads its runs from the node database and writes their results
  policy:
    actions: [db.get]
    resources: [bee:db]
    effect: allow
- name: tests_name
  kind: security.policy
  meta:
    comment: The test runner holds its node-local name
  policy:
    actions: [process.registry.register]
    resources: [bee.node.tests]
    effect: allow
- name: tests_facade
  kind: security.policy.expr
  meta:
    comment: The test facade enters the private test backend scope and calls the backend; it holds no database or runner grant of its own
  policy:
    expression: (action == "funcs.security" && resource == "security") || (action == "security.policy_group.get" && resource == "bee.node.security:tests_backend") || (action == "funcs.call" && resource == "bee.node.binding:tests_backend")
    actions: [funcs.security, security.policy_group.get, funcs.call]
    resources: [security, bee.node.security:tests_backend, bee.node.binding:tests_backend]
    effect: allow
- name: tests_backend_store
  kind: security.policy
  groups: [tests_backend]
  meta:
    comment: The test backend writes and reads runs in the node database
  policy:
    actions: [db.get]
    resources: [bee:db]
    effect: allow
- name: tests_backend_registry
  kind: security.policy
  groups: [tests_backend]
  meta:
    comment: The test backend finds an application, its admission and its tests in the registry
  policy:
    actions: [registry.get, registry.version, registry.find, security.policy_group.get, security.policy.get]
    resources: '*'
    effect: allow
- name: tests_backend_node
  kind: security.policy
  groups: [tests_backend]
  meta:
    comment: The test backend reads this node's identity, which selects the governed admissions of an overlay-delivered application
  policy:
    actions: [system.read]
    resources: [node]
    effect: allow
- name: tests_backend_wake
  kind: security.policy
  groups: [tests_backend]
  meta:
    comment: The test backend wakes the runner after it records a run
  policy:
    actions: [process.send]
    resources: '*'
    effect: allow
