version: '1.0'
namespace: bee.tests.approvals
entries:
- name: test_principals
  kind: library.lua
  source: file://test_principals.lua
  meta: {type: test_support}
  modules: [uuid, security, funcs]
- name: apply_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [registry.apply]
    resources: '*'
    effect: allow
- name: client_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.approvals.binding:waiting, bee.approvals.binding:effect, bee.approvals.binding:effect_queue, bee.approvals.binding:events, bee.approvals.binding:end_request, bee.approvals.binding:grant, bee.approvals.binding:grant_window, bee.approvals.binding:node_summary, bee.approvals.binding:runtime_lease, bee.approvals.binding:request, bee.approvals.binding:decide, bee.approvals.binding:withdraw, bee.approvals.binding:consume, bee.approvals.binding:revalidate, bee.approvals.binding:read, bee.approvals.binding:inbox, bee.approvals.binding:feed_snapshot, bee.approvals.binding:feed_read_after, bee.approvals.binding:list, bee.approvals.binding:deliveries, bee.approvals.binding:reconcile, bee.approvals.binding:capabilities, bee.threads.binding:append, bee.threads.binding:create, bee.threads.binding:get, bee.threads.binding:read_after, bee.threads.binding:watch]
    effect: allow
- name: manage_test_policy
  kind: security.policy
  meta: {type: test_support, comment: A workspace manager reads any request and returns exhausted deliveries to the queue}
  policy:
    actions: [bee.approvals.manage]
    resources: '*'
    effect: allow
- name: test_db
  kind: db.sql.sqlite
  meta: {type: test_support}
  file: .wippy/approvals-test.db
  lifecycle:
    auto_start: true
- name: summary_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call, bee.approvals.summary]
    resources: [bee.approvals.binding:node_summary, node]
    effect: allow
- name: store_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [db.get]
    resources: [bee.tests.approvals:test_db, bee.tests.approvals:service_authority_db, bee.tests.approvals:service_requests_db, bee.tests.approvals:service_decisions_db, bee.tests.approvals:service_effects_db, bee.tests.approvals:service_notifications_db, bee.tests.approvals:service_worker_db]
    effect: allow
- name: attention_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [events.subscribe]
    resources: [bee.attention]
    effect: allow
- name: hive_test
  kind: function.lua
  source: file://hive_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [registry, system, process, channel, time]
  security:
    policies: [bee.tests.approvals:apply_test_policy, bee.tests.approvals:client_test_policy, bee.security.approvals:approval_store_policy, bee.security.approvals:approval_request_policy]
  imports:
    support: bee.tests.approvals:test_principals
    principals: bee.tests.support.principals:bound
    bounds: bee.values:bounds
    test: wippy.test:test
    protocol: bee.hive:protocol
- name: service_fixture
  kind: library.lua
  source: file://service_fixture.lua
  meta: {type: test_support}
  modules: [funcs, registry, time, sql, process, channel]
  imports:
