version: '1.0'
namespace: bee.hub.security
entries:
- name: facade_policy
  kind: security.policy.expr
  policy:
    expression: '(action == "funcs.security" && resource == "security") || (action == "security.policy_group.get" && resource == "bee.hub.security:execution_scope") || (action == "funcs.call" && resource == "bee.hub.binding:backend")'
    actions: [funcs.security, security.policy_group.get, funcs.call]
    resources: [security, bee.hub.security:execution_scope, bee.hub.binding:backend]
    effect: allow
- name: execution_policy
  kind: security.policy
  groups: [execution_scope]
  policy: {actions: [bee.hub.execute], resources: [bee.hub.binding:backend, bee.hub.service:worker, bee.hub.service:publish_worker], effect: allow}
- name: read_policy
  kind: security.policy
  groups: [execution_scope]
  policy: {actions: [registry.get, hub.modules.list, hub.modules.search, hub.modules.get, hub.modules.readme, hub.versions.open, hub.versions.list], resources: '*', effect: allow}
- name: resolution_policy
  kind: security.policy
  groups: [execution_scope]
  policy: {actions: [registry.resolution.get], resources: [''], effect: allow}
- name: binary_identity_policy
  kind: security.policy
  groups: [execution_scope]
  policy:
    actions: [env.get]
    resources: [bee.env:binary_native_module, bee.env:binary_native_version, bee.env:binary_native_modules,
      bee.env:binary_runtime_commit]
    effect: allow
- name: publisher_policy
  kind: security.policy
  groups: [execution_scope]
  policy: {actions: [registry.apply, registry.apply_version], resources: '*', effect: allow}
- name: dependency_policy
  kind: security.policy
  groups: [execution_scope]
  policy: {actions: [registry.create.ns.dependency, registry.update.ns.dependency, registry.delete.ns.dependency], resources: ['bee.hub.deps:*', 'bee:deployment', 'bee.deps:*'], effect: allow}
- name: receipt_policy
  kind: security.policy
  groups: [execution_scope]
  policy: {actions: [registry.create.registry.entry, registry.update.registry.entry], resources: ['bee.hub.operations:*', 'bee.hub.publish_operations:*', 'bee.hub.publish_staging:*'], effect: allow}
- name: worker_policy
  kind: security.policy
  groups: [execution_scope]
  policy: {actions: [process.spawn], resources: [bee.hub.service:worker, bee.hub.service:publish_worker], effect: allow}
- name: worker_host_policy
  kind: security.policy
  groups: [execution_scope]
  policy: {actions: [process.host], resources: [], effect: allow}
- name: worker_name_policy
  kind: security.policy
  groups: [execution_scope]
  policy: {actions: [process.registry.register, process.registry.register.local, process.registry.unregister], resources: [bee.hub.publisher, bee.hub.publish_worker], effect: allow}
- name: publish_exec_policy
  kind: security.policy
  groups: [execution_scope]
  policy: {actions: [exec.get, exec.run, registry.get], resources: '*', effect: allow}
- name: worker_reply_policy
  kind: security.policy
  groups: [execution_scope]
  policy: {actions: [process.send], resources: '*', effect: allow}
- name: migration_context_policy
  kind: security.policy.expr
  groups: [execution_scope]
  policy:
    expression: '(action == "funcs.security" && resource == "security") || (action == "security.scope.create" && resource == "without")'
    actions: [funcs.security, security.scope.create]
    resources: [security, without]
    effect: allow
- name: lifecycle_policy
  kind: security.policy
  groups: [execution_scope]
  policy:
    actions: [events.send, system.read]
    resources: [supervisor, hosts]
    effect: allow
- name: lifecycle_owner_policy
  kind: security.policy
  groups: [execution_scope, lifecycle_scope]
  policy:
    actions: [funcs.call]
    resources: ['']
    effect: allow
- name: lifecycle_scope_policy
  kind: security.policy
  groups: [execution_scope]
  policy:
    actions: [security.policy_group.get]
    resources: [bee.hub.security:lifecycle_scope]
    effect: allow
