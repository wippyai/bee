version: '1.0'
namespace: bee.docs.traits
entries:
- name: call
  kind: function.lua
  source: file://call.lua
  method: handle
  modules:
  - funcs
  meta:
    type: tool
    title: Platform documentation
    llm_alias: BeeDocs
    llm_description: Read the platform documentation that ships inside Bee, offline. list names the corpus by topic with document ids; search finds a phrase across
      the corpus and returns the section each match sits under; read returns one bounded window of one document by stable id, optionally from a heading anchor. Start
      with search, then read the id it returns. Covers selected runtime references for application authors (Lua types, process, channel, time, JSON, contract, registry,
      security, UUID, filesystem, SQL builder, HTTP client and TTY), Bee's own contracts (application, threads, hive, placement and subscriptions, gateway, carrier,
      storage, UI) and the terminal toolkit for drawing, layout, styles and input.
    input_schema: '{"type":"object","additionalProperties":false,"required":["operation"],"properties":{"operation":{"type":"string","enum":["list","search","read","web_search","web_read","web_toc","web_index"]},"topic":{"type":"string","pattern":"^[a-z0-9_-]+$","maxLength":64},"query":{"type":"string","minLength":1,"maxLength":256},"id":{"type":"string","minLength":1,"maxLength":160},"section":{"type":"string","pattern":"^[a-z0-9_-]+$","maxLength":120},"offset":{"type":"integer","minimum":0},"limit":{"type":"integer","minimum":1,"maximum":16384},"path":{"type":"string","pattern":"^[a-z0-9][a-z0-9_./-]*$","maxLength":240}}}'
    output_schema: '{"type":"object","required":["ok"],"properties":{"ok":{"type":"boolean"},"value":{},"code":{"type":"string"},"message":{"type":"string"},"replayed":{"type":"boolean"}},"if":{"properties":{"ok":{"const":false}}},"then":{"required":["code","message"]}}'
    mcp:
      required_scopes:
      - bee.security.gateway:gateway_tool_docs_policy
      annotations:
        readOnlyHint: true
        destructiveHint: false
        idempotentHint: true
        openWorldHint: false
