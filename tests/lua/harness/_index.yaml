    resolver: bee.placement.binding:resolver
- name: fixture_policy
  kind: registry.entry
  meta:
    type: bee.launch_policy
    test_support: true
    comment: Claude protocol fixture policy; eof_gated and bound to the fixture executable
      by the suite at runtime
  data:
    schema_revision: bee.launch-policy@3
    required_cleanup: direct_process
    required_exit_observation: eof_gated

    stop_grace_ms: 500
    drain_ms: 2000
    runner_drain_ms: 1000
    fixture: true
    executables: {}
    environment: {}
    prepare_options:
      permission_mode: dontAsk
- name: selection_policy
  kind: registry.entry
  meta:
