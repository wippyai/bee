version: '1.0'
namespace: bee.gov.persist
entries:
- name: plan_store
  kind: library.lua
  source: file://plan_store.lua
  modules: [sql, hash]
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    database: bee.persist.persist:database
    transaction: bee.persist.persist:transaction
    migrations: bee.gov.migrations:schema
    identity_migration: bee.gov.persist:identity_migration
    plan_protocol: bee.gov.types:plan_protocol
- name: activation_store
  kind: library.lua
  source: file://activation_store.lua
  modules: [sql, hash, json]
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    database: bee.persist.persist:database
    transaction: bee.persist.persist:transaction
    migrations: bee.gov.migrations:schema
    identity_migration: bee.gov.persist:identity_migration
    lease_store: bee.gov.persist:lease_store
    migration_work: bee.gov.types:migration_work
- name: lease_store
  kind: library.lua
  source: file://lease_store.lua
  modules: [sql, hash, json]
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    database: bee.persist.persist:database
    transaction: bee.persist.persist:transaction
    migrations: bee.gov.migrations:schema
    identity_migration: bee.gov.persist:identity_migration
