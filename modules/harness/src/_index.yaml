version: '1.0'
namespace: bee.harness
entries:
- name: definition
  kind: ns.definition
  module: harness
  readme: file://README.md
  meta:
    title: Bee harness
    comment: Execution contracts and the pinned discovery of admitted driver bindings;
      carriers arrive with launch admission
- name: dependency_application
  kind: ns.dependency
  component: bee/application
  version: '*'
- name: dependency_credentials
  kind: ns.dependency
  component: bee/credentials
  version: '*'
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_gateway
  kind: ns.dependency
  component: bee/gateway
  version: '*'
- name: dependency_persist
  kind: ns.dependency
  component: bee/persist
  version: '*'
- name: dependency_placement
  kind: ns.dependency
  component: bee/placement
  version: '*'
- name: dependency_placement_native
  kind: ns.dependency
  component: bee/placement-native
  version: '*'
- name: dependency_resources
  kind: ns.dependency
  component: bee/resources
  version: '*'
- name: dependency_sync
  kind: ns.dependency
  component: bee/sync
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: protected_namespace
  kind: ns.requirement
  meta:
    comment: Add the harness namespace to the host trust map
  default: bee.harness
  targets:
  - entry: bee:protected_kernel
    path: .data.namespaces +=
- name: process_host
  kind: ns.requirement
  meta:
    comment: Host-selected process host for structured carriers; an assembly may override
      the Bee default
  targets:
  - entry: bee.harness:carrier_host_ref
    path: .host_ref
- name: carrier_host_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: Linked carrier host; naming a host does not grant spawn permission
- name: gateway_hook
  kind: http.endpoint
  meta:
    router: bee:gateway_router
  method: POST
  path: /hook/:action
  func: bee.gateway.api:hook_http
- name: gateway_hook_status
  kind: http.endpoint
  meta:
    router: bee:gateway_router
  method: GET
  path: /hook/:action/:event
  func: bee.gateway.api:hook_status_http
- name: gateway_hook_mcp
  kind: http.endpoint
  meta:
    router: bee:gateway_router
  method: POST
  path: /hook/:action/mcp
  func: bee.gateway.api:hook_mcp_http
- name: gateway_hook_storage
  kind: ns.requirement
  meta:
    comment: Host-selected native environment storage for the gateway hook executable
  default: bee.harness.host:environment
  targets:
  - entry: bee.gateway:hook_executable
    path: .storage
- name: harness_activation
  kind: registry.entry
  meta:
    type: bee.harness_activation
    comment: Driver bindings this host activates; discovery alone activates nothing
  data:
    schema_revision: bee.harness-activation@1
    bindings:
    - bee.driver.agy:binding
    - bee.driver.claude:binding
    - bee.driver.codex:binding
    - bee.driver.grok:binding
    - bee.driver.muse:binding
    - bee.driver.opencode:binding
    - bee.driver.wippy:binding
- name: harness_setup
  kind: registry.entry
  meta:
    type: bee.harness_setup
    comment: Host-selected first-use roots keyed by definition-declared resource names
  data:
    roots:
      project: bee.env:workspace_root
      session: bee.placement.native:root
    credentials:
      claude_api_key:
        provider: claude
        source:
          kind: env_variable
          ref: bee.driver.claude:api_key
        optional: true
      codex_login:
        provider: codex
        source:
          kind: fs_directory
          ref: bee.env:machine_login_source
        optional: true
      muse_login:
        provider: muse
        source:
          kind: fs_directory
          ref: bee.env:machine_login_source
        optional: true
      agy_login:
        provider: agy
        source:
          kind: fs_directory
          ref: bee.env:machine_login_source
        optional: true
      grok_login:
        provider: grok
        source:
          kind: fs_directory
          ref: bee.env:machine_login_source
        optional: true
      claude_login:
        provider: claude
        source:
          kind: fs_directory
          ref: bee.env:machine_login_source
        optional: true
      opencode_api_key:
        provider: opencode
        source:
          kind: env_variable
          ref: bee.driver.opencode:api_key
        optional: true
      opencode_login:
        provider: opencode
        source:
          kind: fs_directory
          ref: bee.env:machine_login_source
        optional: true
- name: target_agent_application_admission
  kind: ns.requirement
  default: []
  meta:
    comment: The installed harness contributes the Agent application's reviewed host-selected
      policies
  targets:
  - entry: bee.security:application_admission
    path: .bindings +=
- name: dependency_node
  kind: ns.dependency
  component: bee/node
  version: '*'
- name: dependency_placement_docker
  kind: ns.dependency
  component: bee/placement-docker
  version: '*'
- name: target_carrier_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.harness.service:carrier
    path: .security.policies
- name: types
  kind: library.lua
  source: file://types.lua
  imports:
    classify: bee.harness.catalog:classify
    driver_types: bee.driver:types
    placement_types: bee.placement:types
    policy: bee.harness.carrier:policy
    permission: bee.harness.permission:adapter
    checkpoint: bee.harness.carrier:checkpoint
    stream_json: bee.driver.transport:stream_json
    settle: bee.harness.carrier:settle
    record_types: bee.threads:record_types
- name: profiles
  kind: contract.definition
  methods:
  - name: call
    description: Read or compare-and-set a typed saved agent profile owned by the host node
- name: profiles_local
  kind: contract.binding
  contracts:
  - contract: bee.harness:profiles
    methods:
      call: bee.harness.binding:call
