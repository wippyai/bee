version: '1.0'
namespace: bee.approvals.persist
entries:
- name: store
  kind: library.lua
  source: file://store.lua
  modules:
  - sql
  imports:
    lifecycle: bee.approvals.persist:lifecycle
    windows: bee.approvals.types:windows
    bounds: bee.values:bounds
- name: outbox
  kind: library.lua
  source: file://outbox.lua
  modules:
  - sql
  - json
  - funcs
  imports:
    transaction: bee.persist:transaction
    resources: bee.approvals.env:resources
    clock: bee.values:clock
    bounds: bee.values:bounds
    canonical: bee.values:canonical
- name: lifecycle
  kind: library.lua
  source: file://lifecycle.lua
  modules: [sql, json, hash, security]
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    resources: bee.approvals.env:resources
- name: dispatch
  kind: library.lua
  source: file://dispatch.lua
  modules: [sql, process]
  imports:
    resources: bee.approvals.env:resources
    bounds: bee.values:bounds
