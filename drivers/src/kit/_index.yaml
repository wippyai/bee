version: '1.0'
namespace: bee.drivers.kit
entries:
- name: kit
  kind: library.lua
  meta:
    comment: Host-facing driver kit - activated driver catalog, launch and configuration through a binding, and an output stream folded into records
  source: file://kit.lua
  modules: [registry, contract]
  imports:
    bounds: bee.drivers.values:bounds
    resolver: bee.drivers.binding:resolver
    profile: bee.drivers.profiles:profile
    descriptor: bee.drivers.descriptor:descriptor
    stream_json: bee.drivers.transport:stream_json
- name: client
  kind: security.policy.expr
  meta:
    comment: A host entry that uses the kit reads the registry and calls activated driver bindings; each binding still runs under its own policies
  policy:
    expression: action == "registry.get" || action == "registry.snapshot" || (action == "contract.get" && resource == "bee.drivers:driver") || action == "contract.open" || (action == "contract.call" && resource in ["prepare", "dispatch", "normalize", "configure", "locate"])
    actions: [registry.get, registry.snapshot, contract.get, contract.open, contract.call]
    resources: '*'
    effect: allow
