version: '1.0'
namespace: bee.hive.binding
entries:
- name: invoke_check
  kind: function.lua
  source: file://invoke_check.lua
  method: handle
  modules:
  - security
  imports:
    catalog: bee.hive.exposure:catalog
    bounds: bee.protocol:bounds
- name: client
  kind: library.lua
  source: file://client.lua
  modules: [process, channel, time, uuid]
  imports: {types: bee.hive:types, bounds: bee.protocol:bounds}
- name: output
  kind: library.lua
  source: file://output.lua
  modules: [json]
  imports:
    canonical: bee.protocol:canonical
