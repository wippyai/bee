version: '1.0'
namespace: bee.gateway
entries:
- name: definition
  kind: ns.definition
  module: gateway
  readme: file://README.md
  meta:
    title: Bee gateway
    comment: Authenticated managed-agent bindings, opaque credential hashes, hook intake, and MCP values; the listener and caller authority remain host-selected
- name: dependency_persist
  kind: ns.dependency
  component: bee/persist
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: dependency_application
  kind: ns.dependency
  component: bee/application
  version: '*'
- name: dependency_governance
  kind: ns.dependency
  component: bee/gov
  version: '*'
- name: dependency_docs
  kind: ns.dependency
  component: bee/docs
  version: '*'
- name: dependency_hub
  kind: ns.dependency
  component: bee/hub
  version: '*'
- name: target_db
  kind: ns.requirement
  meta: {comment: Host-selected SQLite resource for bindings, credential hashes, listener state, surfaces, and hook intake}
  default: bee.gateway:db
  targets:
  - entry: bee.gateway:database_ref
    path: .resource_ref
  - entry: bee.gateway.security:store_policy
    path: .policy.resources +=
- name: target_listener
  kind: ns.requirement
  meta: {comment: Host-selected HTTP listener whose supervisor state supplies the native endpoint identity}
  targets:
  - entry: bee.gateway:listener_ref
    path: .resource_ref
- name: target_endpoint
  kind: ns.requirement
  meta: {comment: Host-selected endpoint configuration; it describes a destination and never grants a caller network authority}
  targets:
  - entry: bee.gateway:endpoint_ref
    path: .resource_ref
  - entry: bee.gateway.security:address_policy
    path: .policy.resources +=
- name: target_hook_storage
  kind: ns.requirement
  meta: {comment: Host-selected native environment storage holding the executable path in variable self}
  default: bee.harness.host:environment
  targets:
  - entry: bee.gateway:hook_executable
    path: .storage
- name: target_approval_request_policy
  kind: ns.requirement
  meta: {comment: Host-selected approval request policy for exact per-binding MCP access proposals; an absent link fails closed}
  targets:
  - entry: bee.gateway:approval_request_policy_ref
    path: .resource_ref
  - entry: bee.gateway.security:access_policy_read_policy
    path: .policy.resources +=
- name: target_approval_consume_policy
  kind: ns.requirement
  meta: {comment: Host-selected approval consume policy for exact per-binding MCP access effects; an absent link fails closed}
  targets:
  - entry: bee.gateway:approval_consume_policy_ref
    path: .resource_ref
  - entry: bee.gateway.security:access_policy_read_policy
    path: .policy.resources +=
- name: target_tool_read_policy
  kind: ns.requirement
  meta: {comment: Host-selected bound-thread read policy for the built-in MCP tools}
  targets:
  - entry: bee.gateway:tool_read_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_message_policy
  kind: ns.requirement
  meta: {comment: Host-selected bound-thread message policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway:tool_message_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_inbox_policy
  kind: ns.requirement
  meta: {comment: Host-selected owner call policy for the action inbox tools}
  default: bee.gateway.security:inbox_call_policy
  targets:
  - entry: bee.gateway:tool_inbox_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_discover_policy
  kind: ns.requirement
  meta: {comment: Host-selected scope for peers an action may discover}
  default: bee.gateway.security:discover_none_policy
  targets:
  - entry: bee.gateway:tool_discover_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_send_grant_policy
  kind: ns.requirement
  meta: {comment: Host-selected exact workspace/node/action send grant; default denies all addresses}
  default: bee.gateway.security:send_none_policy
  targets:
  - entry: bee.gateway:tool_send_grant_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_launch_policy
  kind: ns.requirement
  meta: {comment: Host-selected managed-launch policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway:tool_launch_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_run_policy
  kind: ns.requirement
  meta: {comment: Host-selected managed-run policy for the built-in MCP status, wait and cancel tools}
  targets:
  - entry: bee.gateway:tool_run_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_overlay_policy
  kind: ns.requirement
  meta: {comment: Host-selected governed-overlay policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway:tool_overlay_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_docs_policy
  kind: ns.requirement
  meta: {comment: Host-selected offline-documentation policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway:tool_docs_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_components_policy
  kind: ns.requirement
  meta: {comment: Host-selected component-inspection policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway:tool_components_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_delivery_policy
  kind: ns.requirement
  meta: {comment: Host-selected delivery policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway:tool_delivery_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_publish_policy
  kind: ns.requirement
  meta: {comment: Host-selected publication policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway:tool_publish_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_application_open_policy
  kind: ns.requirement
  meta: {comment: Host-selected admitted-application open policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway:tool_application_open_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_install_policy
  kind: ns.requirement
  meta: {comment: Host-selected policy for the built-in installation request tools; it admits filing and polling requests and never applying one}
  targets:
  - entry: bee.gateway:tool_install_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_install_configuration
  kind: ns.requirement
  meta: {comment: Host-selected module installation configuration naming the approval policy agent installation requests are filed under; an absent link fails closed}
  targets:
  - entry: bee.gateway:install_configuration_ref
    path: .resource_ref
  - entry: bee.gateway.security:installation_policy
    path: .policy.resources +=
- name: target_remote_resolver
  kind: ns.requirement
  meta: {comment: Host-selected resolver for node-qualified session addresses; the module default resolves nothing, so a composition with no transport answers a remote address as not found}
  default: bee.gateway:remote
  targets:
  - entry: bee.gateway.api:mcp_http
    path: .imports.remote
- name: remote
  kind: library.lua
  source: file://remote.lua
  meta: {comment: Fail-closed default remote session resolver; the host replaces the requirement to enable remote addressing}
- name: database_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: The linked SQL resource; target_db fills resource_ref}
- name: listener_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: The linked listener service; target_listener fills resource_ref}
- name: environment
  kind: env.storage.os
  lifecycle: {auto_start: true}
- name: db_path
  kind: env.variable
  storage: bee.gateway:environment
  variable: BEE_GATEWAY_DB
  default: .wippy/gateway.db
  readonly: true
- name: db
  kind: db.sql.sqlite
  file: ${env:bee.gateway:db_path}
  lifecycle: {auto_start: true}
- name: hook_executable
  kind: env.variable
  storage: bee.harness.host:environment
  variable: self
  default: ''
  readonly: true
- name: catalog
  kind: library.lua
  source: file://catalog.lua
  modules: [json]
  imports: {bounds: bee.threads.records:bounds}
- name: context
  kind: library.lua
  source: file://context.lua
  modules: [json]
  imports: {bounds: bee.threads.records:bounds}
- name: address_value
  kind: library.lua
  source: file://address_value.lua
- name: sessions
  kind: library.lua
  source: file://sessions.lua
- name: hooks
  kind: library.lua
  source: file://hooks.lua
  modules: [hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
- name: hook_inbox
  kind: library.lua
  source: file://hook_inbox.lua
  modules: [funcs, security, registry]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    context: bee.gateway:context
    gateway: bee.gateway.binding:gateway
- name: mcp
  kind: library.lua
  source: file://mcp.lua
  imports:
    bounds: bee.threads.records:bounds
    message: bee.threads.records:message
    arguments: bee.application:arguments
    agent_protocol: bee.application:agent_protocol
    workspace_protocol: bee.gov:workspace_protocol
    delivery_protocol: bee.gov:delivery_protocol
    docs_protocol: bee.docs:protocol
- name: surface
  kind: library.lua
  source: file://surface.lua
  imports:
    bounds: bee.threads.records:bounds
    catalog: bee.gateway:catalog
    context: bee.gateway:context
    mcp: bee.gateway:mcp
- name: endpoint_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host endpoint configuration; target_endpoint fills resource_ref}
- name: approval_request_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host approval request policy; an absent link fails closed}
- name: approval_consume_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host approval consume policy; an absent link fails closed}
- name: tool_read_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in bound-thread read tools}
- name: tool_message_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in bound-thread message tool}
- name: tool_inbox_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for action inbox owner calls}
- name: tool_discover_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for workspace peer discovery}
- name: tool_send_grant_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked exact host send grant policy for action addresses}
- name: tool_launch_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in managed-launch tool}
- name: tool_run_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in managed-run status, wait and cancel tools}
- name: tool_overlay_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in governed-overlay tool}
- name: tool_docs_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in offline-documentation tool}
- name: tool_components_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in component-inspection tool}
- name: tool_delivery_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in delivery tool}
- name: tool_publish_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in publication tool}
- name: tool_application_open_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in admitted-application open tool}
- name: tool_install_policy_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host policy for the built-in installation request tools}
- name: install_configuration_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: Linked host module installation configuration; target_install_configuration fills resource_ref}
- name: configuration
  kind: library.lua
  source: file://configuration.lua
  modules: [registry, funcs, env]
  imports: {address_value: bee.gateway:address_value}
- name: address
  kind: function.lua
  source: file://address_method.lua
  method: handle
  modules: [registry, system]
  imports: {configuration: bee.gateway:configuration}
  security: {policies: [bee.gateway.security:address_policy, bee.gateway.security:supervisor_policy]}
