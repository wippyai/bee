version: '1.0'
namespace: bee.stylebook
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: [tty, process, channel, uuid]
  imports:
    client: bee.application:client
    appearance: bee.application:appearance
    view: bee.stylebook:view
    frame: bee.application:frame
  meta:
    type: bee.application
    application:
      api_version: 1
      title: UI Guide
      icon: U
      lifetime: view
      revision: '1'
      instance_policy: singleton
      group: Tools/Learn
      role: reference
- name: view
  kind: library.lua
  source: file://view.lua
  imports:
    appearance: bee.application:appearance
    frame: bee.application:frame
