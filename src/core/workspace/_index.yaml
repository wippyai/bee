version: '1.0'
namespace: bee.workspace
entries:
- name: host
  kind: process.lua
  source: file://host.lua
  method: main
  modules: [process, channel, security, ctx, uuid]
  imports:
    persistence: bee.workspace:persistence
    recovery: bee.workspace:recovery
    contract: bee.protocol:application
    decode: bee.protocol:decode
    model: bee.desktop:model
    appearance: bee.desktop:appearance
    interaction: bee.application:interaction
    connections: bee.workspace:client_connections
- name: client_connections
  kind: library.lua
  source: file://client_connections.lua
  modules: [process, uuid, hash]
  imports:
    clients: bee.workspace:client_protocol
    contract: bee.protocol:application
- name: client_protocol
  kind: library.lua
  source: file://client_protocol.lua
  imports:
    contract: bee.protocol:application
- name: main
  kind: process.lua
  source: file://main.lua
  method: main
  modules:
  - security
  - tty
  - process
  - channel
  - time
  - uuid
  imports:
    command: bee.applications:command
    contract: bee.protocol:application
    arguments: bee.application:arguments
    interaction: bee.application:interaction
    model: bee.desktop:model
    decode: bee.protocol:decode
    decode_input: bee.protocol:input
    appearance: bee.desktop:appearance
    chrome: bee.terminal:chrome
    persistence: bee.workspace:persistence
    recovery: bee.workspace:recovery
  meta:
    command:
      name: bee
      short: Open the Bee workspace desktop
      security:
        actor:
          id: bee.local
        policies:
        - bee:desktop_policy
        - bee:core_spawn_policy
        - bee:workspace_storage_policy
- name: launch
  kind: process.lua
  source: file://main.lua
  method: launch
  modules:
  - security
  - tty
  - process
  - channel
  - time
  - uuid
  imports:
    command: bee.applications:command
    contract: bee.protocol:application
    arguments: bee.application:arguments
    interaction: bee.application:interaction
    model: bee.desktop:model
    decode: bee.protocol:decode
    decode_input: bee.protocol:input
    appearance: bee.desktop:appearance
    chrome: bee.terminal:chrome
    persistence: bee.workspace:persistence
    recovery: bee.workspace:recovery
  meta:
    command:
      name: bee-app
      short: Open an application with explicit arguments
      security:
        actor:
          id: bee.local
        policies:
        - bee:desktop_policy
        - bee:core_spawn_policy
        - bee:workspace_storage_policy
- name: persistence
  kind: library.lua
  source: file://persistence.lua
  modules: [json]
  imports:
    store: bee.storage:store
    recovery: bee.workspace:recovery
- name: recovery
  kind: library.lua
  source: file://recovery.lua
  modules:
  - json
  imports:
    appearance: bee.desktop:appearance
    decode: bee.protocol:decode
    contract: bee.protocol:application
    model: bee.desktop:model
