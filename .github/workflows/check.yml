name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.27.0'
        cache: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python3 -m pip install -r tests/requirements.txt
    - run: make setup
    - run: make check
