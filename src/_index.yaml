version: '1.0'
namespace: bee
entries:
- name: definition
  kind: ns.definition
  meta:
    title: Bee desktop foundation
- name: workers
  kind: process.host
  host:
    max_processes: 24
    workers: 4
  lifecycle:
    auto_start: true
- name: workspace_hosts
  kind: process.service
  process: bee.launch:host_manager
  host: bee:workers
  input:
  - {cap: 64, idle_ms: 900000}
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.workspace.hosts}
      policies: [bee.security.desktop:host_policy, bee.security.desktop:local_supervisor_spawn_policy, bee.security.desktop:workspace_host_manager_policy]
  meta:
    comment: Starts a node workspace host when a lease first asks for it, stops it after 15 minutes unleased, and keeps at most 64 live
- name: gov_recovery_service
  kind: process.service
  process: bee.gov.service:recovery
  host: bee:workers
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.gov.activation}
      policies: [bee.gov.security:destination_service_policy]
- name: sync_exports
  kind: registry.entry
  meta:
    type: bee.sync.exports
    comment: Host-selected immutable feeds exported to connected non-client Hive nodes
  data:
    exports:
    - feed: governance.application_versions
      content_kinds: [bee.governance-application-version@2]
- name: capability_catalog
  kind: registry.entry
  meta:
    type: bee.capability_catalog
    comment: Host-owned review vocabulary and templates; declarations are not grants
  data:
    revision: 2
    never: [exec, env, credentials, registry.write, security.policy.write, security.scope.manage, approvals.decide, core.database, lifecycle.auto_start]
    capabilities:
    - id: workspace.files.read
      revision: 1
      parameters: {subpath: relative_subpath}
      text: Read workspace files under {subpath}
      confirm: standard
      policies:
      - {operation: files.read, resource: workspace, scope: {subpath: '$subpath'}}
      resources:
      - {kind: fs.directory, mode: readonly, source: verified_workspace_subroot}
    - id: workspace.files.write
      revision: 1
      parameters: {subpath: relative_subpath}
      text: Write workspace files under {subpath}
      confirm: explicit
      policies:
      - {operation: files.write, resource: workspace, scope: {subpath: '$subpath'}}
      resources:
      - {kind: fs.directory, mode: readwrite, source: verified_workspace_subroot}
    - id: app.database
      revision: 1
      parameters: {name: name}
      text: Use an isolated application database named {name}
      confirm: standard
      policies:
      - {operation: database.use, resource: '$name', scope: {name: '$name'}}
      resources:
      - {kind: db.sql.sqlite, mode: dedicated, source: host_app_database}
    - id: threads.read
      revision: 1
      parameters: {scope: owned_scope}
      text: Read owned threads
      confirm: standard
      policies:
      - {operation: threads.read, resource: threads, scope: {scope: '$scope'}}
      resources: []
    - id: threads.message
      revision: 1
      parameters: {scope: children_scope}
      text: Message child threads
      confirm: standard
      policies:
      - {operation: threads.message, resource: threads, scope: {scope: '$scope'}}
      resources: []
    - id: agents.launch
      revision: 1
      parameters: {definitions: definitions}
      text: Launch managed agents from {definitions}
      confirm: explicit
      policies:
      - {operation: agents.launch, resource: managed_agents, scope: {definitions: '$definitions'}}
      resources: []
    - id: contract.call
      revision: 1
      parameters: {binding: binding, methods: methods}
      text: Call app binding {binding} using {methods}
      confirm: explicit
      policies:
      - {operation: contract.call, resource: '$binding', scope: {methods: '$methods'}}
      resources:
      - {kind: contract.binding, mode: caller, source: host_selected_binding}
    - id: http.api
      revision: 1
      parameters: {origin: https_origin, methods: http_methods, path_prefix: url_path_prefix}
      text: Send HTTP requests to {origin} at {path_prefix} using {methods}
      confirm: explicit
      policies:
      - {operation: http.request, resource: '$origin', scope: {methods: '$methods', path_prefix: '$path_prefix'}}
      resources:
      - {kind: http.client, mode: scoped, source: host_selected_origin}
    - id: hive.expose
      revision: 2
      parameters: {operations: hive_operations, mode: hive_mode, audiences: hive_audiences}
      text: Expose Hive operations {operations} in {mode} mode to {audiences}
      confirm: explicit
      policies:
      - {operation: hive.expose, resource: '$mode', scope: {operations: '$operations', audiences: '$audiences'}}
      resources:
      - {kind: hive.operations, mode: exposed, source: host_selected_operations}
    - id: hive.view
      revision: 1
      parameters: {}
      text: View Hive cluster membership
      confirm: standard
      policies:
      - {operation: hive.view, resource: cluster, scope: {}}
      resources: []
    - id: hive.remote_view
      revision: 1
      parameters: {}
      text: Open a remote view of another node's workspace
      confirm: explicit
      policies:
      - {operation: hive.remote_view, resource: workspaces, scope: {}}
      resources: []
    - id: workspace.catalog.read
      revision: 1
      parameters: {}
      text: Read the workspace catalog
      confirm: standard
      policies:
      - {operation: workspace.catalog.read, resource: workspaces, scope: {}}
      resources: []
    - id: workspace.catalog.manage
      revision: 1
      parameters: {}
      text: Create, archive and restore workspaces
      confirm: explicit
      policies:
      - {operation: workspace.catalog.manage, resource: workspaces, scope: {}}
      resources: []
    - id: workspace.host.lease
      revision: 1
      parameters: {}
      text: Lease workspace hosts for opened workspaces
      confirm: standard
      policies:
      - {operation: workspace.host.lease, resource: workspace_hosts, scope: {}}
      resources: []
    - id: desktop.application_stop
      revision: 1
      parameters: {}
      text: Stop running applications from the process view
      confirm: explicit
      policies:
      - {operation: desktop.application_stop, resource: applications, scope: {}}
      resources: []
    - id: hub.manage
      revision: 1
      parameters: {}
      text: Plan and apply Hub component changes
      confirm: explicit
      policies:
      - {operation: hub.manage, resource: components, scope: {}}
      resources: []
    - id: gov.delivery.manage
      revision: 1
      parameters: {}
      text: Prepare and publish governed delivery versions
      confirm: explicit
      policies:
      - {operation: gov.delivery.manage, resource: overlays, scope: {}}
      resources: []
    - id: gov.delivery.activate
      revision: 1
      parameters: {}
      text: Activate accepted governed delivery versions
      confirm: explicit
      policies:
      - {operation: gov.delivery.activate, resource: overlays, scope: {}}
      resources: []
- name: thread_outbox_pump_service
  kind: process.service
  process: bee.threads.service:pump_worker
  host: bee:workers
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.threads.pump}
      policies: [bee.security.threads:thread_outbox_pump_policy]
    restart:
      max_attempts: 10
- name: sync_distribution_service
  kind: process.service
  process: bee.sync.service:distribution_worker
  host: bee:workers
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.sync.distribution}
      policies: [bee.security:sync_distribution_policy]
- name: terminal
  kind: terminal.host
  hide_logs: true
  lifecycle:
    auto_start: true
- name: hive_operation_adapters
  kind: registry.entry
  meta:
    type: bee.hive.operation_adapters
    comment: Host-selected forwarding routes; the supervisor maps each thread and replica operation to the feature-owned admission worker in the package that owns it, and that worker still runs under the host-selected policies its package declares
  data:
    adapters:
    - operations: [bee.threads.service:send, bee.threads.service:send_status, bee.threads.service:inbox_resolve,
        bee.threads.service:inbox_describe, bee.threads.service:inbox_send, bee.threads.service:inbox_reply,
        bee.threads.service:notify, bee.threads.delivery:watch]
      worker: bee.threads.hive:admit
    - operations: [bee.sync.binding:replica_receive]
      worker: bee.sync.hive:admit
- name: protected_kernel
  kind: registry.entry
  meta:
    type: bee.protected_kernel
    comment: Host trust map no overlay profile can open; preflight refuses edits to these definitions, their transitive code dependencies and requirement selectors aimed at them
  data:
    revision: 2
    namespaces: [bee.application, bee.approvals, bee.apps, bee.client, bee.console, bee.deps,
      bee.desktop, bee.docs, bee.env, bee.gateway, bee.governance, bee.gov, bee.hive,
      bee.host, bee.hub, bee.interaction, bee.launch, bee.node, bee.persist, bee.protocol,
      bee.security, bee.session, bee.settings, bee.storage, bee.sync, bee.terminal, bee.threads,
      bee.workspace]
    super_edit: []
    entries: ['bee:protected_kernel', 'bee:approver_policies', 'bee:capability_catalog', 'bee.env:gov_activation_profiles',
      'bee.env:gov_publication_profiles', 'bee.deps:gov', 'bee.deps:approvals', 'bee:module_installation']
- name: approver_policies
  kind: registry.entry
  meta:
    type: bee.approval_policies
    comment: Host-owned approver policies; a request names one, and only its approvers decide it
  policies:
  - name: workspace-application-delivery
    approvers:
    - definition_id: bee.approvals.inbox:app
    max_ttl_ms: 600000
  - name: module-installation
    approvers:
    - definition_id: bee.approvals.inbox:app
    max_ttl_ms: 600000
  - name: super-edit-person
    approvers:
    - definition_id: bee.approvals.inbox:app
    confirm: explicit
    max_ttl_ms: 600000
- name: module_installation
  kind: registry.entry
  meta:
    type: bee.module_installation
    comment: Host-selected approval policy for agent Hub installation requests; a request files one approval and only an approved one applies
  data:
    approval_policy: module-installation
- name: docs_corpus
  kind: fs.directory
  directory: ./src/corpus
  mode: '0500'
  auto_init: false
  meta:
    title: Bee agent documentation corpus
    comment: The offline platform documentation a bound agent reads through the gateway docs tool; wippy.yaml embed freezes it read-only into the pack. Rebuilt by build/agent_corpus.py.
- name: gateway_endpoint
  kind: registry.entry
  meta:
    type: bee.gateway_endpoint
    comment: Native HTTP selects and retains an available loopback port; gateway address resolves it from supervisor
      state
  data:
    address: 127.0.0.1:0
- name: gateway_listener
  kind: http.service
  addr: 127.0.0.1:0
  lifecycle:
    auto_start: true
- name: gateway_router
  kind: http.router
  meta:
    server: bee:gateway_listener
  prefix: /
- name: gateway_ready
  kind: http.endpoint
  meta:
    router: bee:gateway_router
  method: GET
  path: /ready
  func: bee.gateway.api:ready_http
- name: gateway_mcp
  kind: http.endpoint
  meta:
    router: bee:gateway_router
  method: POST
  path: /mcp/:action
  func: bee.gateway.api:mcp_http
- name: gateway_workspace_extension
  kind: contract.binding
  meta:
    title: Agent sessions
    comment: The host attaches each workspace's running agent sessions to the workspace catalog and its viewer
  contracts:
  - contract: bee.workspace.catalog:extension
    methods:
      describe: bee.gateway.binding:describe
      search: bee.gateway.binding:search
