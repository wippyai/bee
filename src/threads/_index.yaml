version: '1.0'
namespace: bee.threads
entries:
- name: authority
  kind: contract.definition
  methods:
  - name: create
    description: Create a rich thread owned by the caller
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"workspace_id":{"type":"string"},"title":{"type":"string"},"idempotency_key":{"type":"string"}},"additionalProperties":true,"description":"Create a rich thread owned by the caller"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: get
    description: Read a thread summary and the caller's membership
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"thread_id":{"type":"string"}},"additionalProperties":true,"description":"Read a thread summary and the caller's membership"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: list
    description: List threads the caller can read
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"after_thread_id":{"type":"string"},"limit":{"type":"integer"}},"additionalProperties":true,"description":"List threads the caller can read"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: list_workspace
    description: List the threads a workspace owns, for a caller the host lets read that workspace's threads
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"workspace_id":{"type":"string"},"after_thread_id":{"type":"string"},"limit":{"type":"integer"}},"additionalProperties":true,"description":"List the threads a workspace owns, for a caller the host lets read that workspace's threads"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: join
    description: Add or reactivate a member at an expected revision
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"thread_id":{"type":"string"},"member_id":{"type":"string"},"role":{"type":"string"},"expected_revision":{"type":"integer"},"idempotency_key":{"type":"string"}},"additionalProperties":true,"description":"Add or reactivate a member at an expected revision"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: leave
    description: Deactivate a member at an expected revision
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"thread_id":{"type":"string"},"member_id":{"type":"string"},"expected_revision":{"type":"integer"},"idempotency_key":{"type":"string"}},"additionalProperties":true,"description":"Deactivate a member at an expected revision"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: close
    description: Close a thread that has no unsettled actions
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"thread_id":{"type":"string"},"expected_revision":{"type":"integer"},"idempotency_key":{"type":"string"}},"additionalProperties":true,"description":"Close a thread that has no unsettled actions"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: record
    description: Commit a message or observation the caller produced
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"thread_id":{"type":"string"},"kind":{"type":"string"},"source":{"type":"object"},"body":{"type":"object"},"context":{"type":"object"},"idempotency_key":{"type":"string"}},"additionalProperties":true,"description":"Commit a message or observation the caller produced"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: search
    description: Search authorized records in up to sixteen threads with a stable continuation
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"scope":{"type":"object"},"query":{"type":"string"},"kinds":{"type":"array"},"limit":{"type":"integer"},"cursor":{}},"additionalProperties":true,"description":"Search authorized records in up to sixteen threads with a stable continuation"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: timeline
    description: Page authorized records through a pinned committed thread head
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"thread_id":{"type":"string"},"limit":{"type":"integer"},"after":{},"cursor":{}},"additionalProperties":true,"description":"Page authorized records through a pinned committed thread head"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: hook_original
    description: Read a retained original tool result under the app's live trait consent
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"thread_id":{"type":"string"},"record_id":{"type":"string"}},"additionalProperties":true,"description":"Read a retained original tool result under the app's live trait consent"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: read_after
    description: Read committed records after a cursor with a bounded filter
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"thread_id":{"type":"string"},"cursor":{},"limit":{"type":"integer"},"filter":{"type":"object"}},"additionalProperties":true,"description":"Read committed records after a cursor with a bounded filter"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: send
    description: Commit a message forwarded from another node under its caller node and idempotency key with the payload digest the sender computed; the same identity replays, a different payload conflicts
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"thread_id":{"type":"string"},"message":{"type":"object"},"context":{"type":"object"},"payload_digest":{"type":"string"},"idempotency_key":{"type":"string"}},"additionalProperties":true,"description":"Commit a message forwarded from another node under its caller node and idempotency key with the payload digest the sender computed; the same identity replays, a different payload conflicts"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: send_status
    description: What the owner committed under a send identity, for a sender that lost the reply
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"thread_id":{"type":"string"},"idempotency_key":{"type":"string"}},"additionalProperties":true,"description":"What the owner committed under a send identity, for a sender that lost the reply"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: notify
    description: Register a one-shot notice on the caller's own thread, delivered once when an action of a thread the caller reads ends a turn or an attempt
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"thread_id":{"type":"string"},"action_id":{"type":"string"}},"additionalProperties":true,"description":"Register a one-shot notice on the caller's own thread, delivered once when an action of a thread the caller reads ends a turn or an attempt"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: register_app_alias
    description: Attest the stable app an application instance was opened for; only the application broker holds this
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"stable":{"type":"string"},"instance":{"type":"string"},"workspace_id":{"type":"string"},"definition_id":{"type":"string"}},"additionalProperties":true,"description":"Attest the stable app an application instance was opened for; only the application broker holds this"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: retire_app_alias
    description: Retire family inheritance when the broker-managed application instance closes
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"stable":{"type":"string"},"instance":{"type":"string"},"workspace_id":{"type":"string"},"definition_id":{"type":"string"}},"additionalProperties":true,"description":"Retire family inheritance when the broker-managed application instance closes"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: fence_app
    description: Deactivate every active member row of a stable app after admission loss; only the application broker holds this
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"stable":{"type":"string"}},"additionalProperties":true,"description":"Deactivate every active member row of a stable app after admission loss; only the application broker holds this"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
- name: journal
  kind: contract.definition
  methods:
  - name: session_create
    description: Create a durable session in the canonical thread journal
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"operation_key":{"type":"string"},"title":{"type":"string"},"route":{"type":"object"},"thread_id":{"type":"string"}},"additionalProperties":true,"description":"Create a durable session in the canonical thread journal"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: session_attach
    description: Attach the admitted native attempt to its durable interactive session
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"session":{"type":"string"},"attempt_id":{"type":"string"},"operation_key":{"type":"string"}},"additionalProperties":true,"description":"Attach the admitted native attempt to its durable interactive session"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: route_capability
    description: Read the provider capability identity of an exact workspace session under host route-read admission
    input_schemas:
    - format: application/schema+json
      definition:
        type: object
        additionalProperties: false
        required: [session, workspace_id]
        properties:
          session: {type: string}
          workspace_id: {type: string}
    output_schemas:
    - format: application/schema+json
      definition:
        type: object
        required: [ok, replayed]
        properties:
          ok: {type: boolean}
          replayed: {type: boolean}
          value: {type: object, properties: {provider: {type: string}}}
          error: {type: object}
  - name: session_describe
    description: Read a session and its current work summary
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"session":{"type":"string"}},"additionalProperties":true,"description":"Read a session and its current work summary"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: session_scan
    description: Scan durable session references in a workspace
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"cursor":{},"limit":{"type":"integer"},"workspace":{"type":"string"}},"additionalProperties":true,"description":"Scan durable session references in a workspace"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: session_transition
    description: Change session lifecycle at a durable revision
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"session":{"type":"string"},"operation_key":{"type":"string"},"state":{"type":"string"},"expected_revision":{"type":"integer"}},"additionalProperties":true,"description":"Change session lifecycle at a durable revision"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: work_send
    description: Commit immutable work with owner-set sender identity
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"session":{"type":"string"},"operation_key":{"type":"string"},"output_schema":{"type":"object"},"input":{},"budget":{"type":"object"}},"additionalProperties":true,"description":"Commit immutable work with owner-set sender identity"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: work_describe
    description: Read a work phase and its result when settled
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"work":{"type":"string"}},"additionalProperties":true,"description":"Read a work phase and its result when settled"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: work_await
    description: Wait until any listed work holds a result or uncertainty, or the bounded wait ends
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"works":{"type":"array"},"wait_ms":{"type":"integer"},"transport_budget_ms":{"type":"integer"}},"additionalProperties":true,"description":"Wait until any listed work holds a result or uncertainty, or the bounded wait ends"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: work_history
    description: Page immutable work inputs for a session
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"session":{"type":"string"},"cursor":{},"limit":{"type":"integer"}},"additionalProperties":true,"description":"Page immutable work inputs for a session"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: work_scan
    description: Scan the next queued work and unsettled turn of a session
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"session":{"type":"string"},"limit":{"type":"integer"},"include_hooks":{"type":"boolean"}},"additionalProperties":true,"description":"Scan the next queued work and unsettled turn of a session"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: turn_reserve
    description: Reserve the FIFO eligible work, or the named queued work, under a fenced owner epoch
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"session":{"type":"string"},"operation_key":{"type":"string"},"work":{"type":"string"}},"additionalProperties":true,"description":"Reserve the FIFO eligible work, or the named queued work, under a fenced owner epoch"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: turn_recover
    description: Re-fence one unsettled turn under the current owner epoch
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"turn":{"type":"string"},"operation_key":{"type":"string"}},"additionalProperties":true,"description":"Re-fence one unsettled turn under the current owner epoch"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: turn_pull
    description: Pull the exact immutable envelope for a reserved turn
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"turn":{"type":"string"},"claim":{"type":"string"}},"additionalProperties":true,"description":"Pull the exact immutable envelope for a reserved turn"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
  - name: turn_accept
    description: Commit acceptance of the reserved input checkpoint
    input_schemas:
