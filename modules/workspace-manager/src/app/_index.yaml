version: '1.0'
namespace: bee.workspace.manager.app
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules:
  - tty
  - process
  - channel
  - uuid
  - funcs
  imports:
    frame: bee.application:frame
    client: bee.application:client
    appearance: bee.application:appearance
    caller: bee.application:caller
    leases: bee.application:host_leases
    model: bee.workspace.manager.app:model
    creation: bee.workspace.manager.app:creation
    folder_picker: bee.application:folder_picker
    view: bee.workspace.manager.app:view
  meta:
    type: bee.application
    application:
      api_version: 1
      title: Workspaces
      icon: W
      lifetime: view
      revision: '1'
      instance_policy: singleton
      group: Tools
      role: inspection
- name: model
  kind: library.lua
  source: file://model.lua
  imports:
    text: bee.application:text
    caller: bee.application:caller
    bounds: bee.protocol:bounds
    contract: bee.protocol:application
    names: bee.application:names
- name: creation
  kind: library.lua
  source: file://creation.lua
  imports:
    folder_picker: bee.application:folder_picker
    text: bee.application:text
    caller: bee.application:caller
    model: bee.workspace.manager.app:model
- name: view
  kind: library.lua
  source: file://view.lua
  imports:
    frame: bee.application:frame
    appearance: bee.application:appearance
    model: bee.workspace.manager.app:model
    creation: bee.workspace.manager.app:creation
    folder_picker: bee.application:folder_picker
