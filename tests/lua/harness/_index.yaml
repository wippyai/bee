    test: wippy.test:test
    adapter: bee.harness.permission:adapter
    acceptance: bee.harness.permission:acceptance
    events: bee.driver.kit:events
- name: permission_fixture_adapter
  kind: registry.entry
  meta:
    type: harness.permission_adapter
    test_support: true
    comment: The fixture's interactive permission exchange; evidence for the runner, not a description of the real harness
  data:
    adapter:
      schema_revision: bee.permission-adapter@2
      event_name: claude.control_request
      event_revision: stream-json-2
      request:
        correlation: request_id
        tool: request.tool_name
        input: request.input
      response:
        envelope: {type: control_response}
        correlation_field: request_id
        decision_field: behavior
        allow_value: allow
        deny_value: deny
        reason_field: message
        response_field: updated_input
      acknowledgment: {mode: correlation_echo, event_type: tool.result, field: call_id}
      deny_acknowledgment: {mode: terminal_denial, event_type: notice, field: code, value: permission_denied}
      cancellation: deny_before_close
      proof_fixture: permission
