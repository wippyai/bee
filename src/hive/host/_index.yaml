version: '1.0'
namespace: bee.hive.host
entries:
- name: replica_sender
  kind: library.lua
  source: file://replica_sender.lua
  modules: [hash, base64]
  imports:
    hive: bee.hive:client
    version: bee.sync:version
    transaction: bee.persist:transaction
    bounds: bee.sync:bounds
- name: supervisor_service
  kind: process.service
  process: bee.hive.supervisor:main
  host: bee.hive:supervisor_host
  input:
  - configured_nodes: []
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.hive.supervisor}
      policies:
      - bee:hive_supervisor_policy
      - bee:hive_catalog_policy
      - bee:hive_exposure_policy
      - bee:hive_policy_exposure_policy
      - bee:hive_dispatch_policy
      - bee:hive_names_policy
      - bee:hive_advertise_policy
      - bee:hive_execute_policy
      - bee:hive_invite_policy
      # Enrolled local clients' bee workspace commands run through their worker.
      - bee:workspace_command_policy
      # The supervisor composes the retained desktop bridge, so it needs the
      # desktop host policy that authorizes desktop admission, and the bridge
      # reads the node's displays and one page of its workspace catalog.
      - bee.hive.desktop:host_policy
      - bee:desktop_catalog_policy
      - bee:desktop_catalog_resource_policy
      - bee:workspace_catalog_read_policy
      - bee.hive.desktop:catalog_call_policy
  meta:
    comment: Host-owned local Hive supervisor; a host overlay may replace input with admitted peer IDs and optional desktop configuration
- name: workspaces
  kind: function.lua
  source: file://workspaces.lua
  method: handle
  modules: [funcs, process, system]
  imports:
    bounds: bee.threads.records:bounds
    contract: bee.protocol:application
  meta:
    comment: Open Hive operation listing one page of this node's workspace catalog and which workspaces a host serves now
    hive: open
    hive_operation:
      revision: '1'
      title: Node workspaces
      input:
        type: object
        additionalProperties: false
        properties:
          label: {type: string, minLength: 1, maxLength: 240}
          after: {type: string, minLength: 1, maxLength: 2200}
          limit: {type: integer, minimum: 1, maximum: 50}
      output:
        type: object
        additionalProperties: false
        required: [node_id, workspaces]
        properties:
          node_id: {type: string}
          next_after: {type: string}
          workspaces:
            type: array
            maxItems: 50
            items:
              type: object
              additionalProperties: false
              required: [workspace_id, label, served]
              properties:
                workspace_id: {type: string}
                label: {type: string}
                served: {type: boolean}
  security:
    policies: [bee:hive_telemetry_policy, bee:workspace_catalog_read_policy, bee.hive.host:workspaces_policy]
- name: workspaces_policy
  kind: security.policy
  meta:
    comment: The workspaces operation reads the catalog through its owner operations
  policy:
    actions: [funcs.call]
    resources: [bee.workspace.catalog:list, bee.workspace.catalog:search]
    effect: allow
