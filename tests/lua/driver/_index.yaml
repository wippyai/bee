version: '1.0'
namespace: bee.tests.driver
entries:
- name: profile_test
  kind: function.lua
  source: file://profile_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry]
  imports:
    test: wippy.test:test
    profile: bee.drivers.profiles:profile
- name: kit_test
  kind: function.lua
  source: file://kit_test.lua
  method: run
  meta:
    type: test
    suite: bee
  imports:
    test: wippy.test:test
    framing: bee.drivers.transport:framing
    quote: bee.drivers.binding:quote
    events: bee.drivers.codec:events
    observation: bee.drivers.records:observation
    stream_json: bee.drivers.transport:stream_json
- name: option_render_test
  kind: function.lua
  source: file://option_render_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [json, toml, hash, registry]
  security: {policies: [bee.tests.harness.profiles:repair_policy]}
  imports:
    placement_profiles: bee.placement.profiles:profiles
    universal: bee.drivers.binding:universal
    test: wippy.test:test
    render: bee.drivers.binding:option_render
    descriptor: bee.drivers.descriptor:descriptor
    configuration: bee.drivers.binding:configuration
    materializer: bee.placement.native.env:configuration
    bounds: bee.drivers.values:bounds
    configuration_types: bee.drivers:configuration_types
- name: providers_test
  kind: function.lua
  source: file://providers_test.lua
  method: run
  meta:
    type: test
    suite: bee
    timeout: 60s
  modules:
  - fs
  - funcs
  imports:
    driver_types: bee.drivers:types
    universal: bee.drivers.binding:universal
    bounds: bee.drivers.values:bounds
    test: wippy.test:test
    stream_json: bee.drivers.transport:stream_json
    claude: bee.tests.support.driver:claude_protocol
    codex: bee.tests.support.driver:codex_protocol
    muse: bee.tests.support.driver:muse_protocol
    claude_launch: bee.tests.support.driver:claude_launch
    codex_launch: bee.tests.support.driver:codex_launch
    muse_launch: bee.tests.support.driver:muse_launch
    observation: bee.drivers.records:observation
    quote: bee.drivers.binding:quote
- name: fixtures
  kind: fs.directory
  meta: {type: test_support}
  directory: ./fixtures/drivers
- name: login_evidence_test
  kind: function.lua
  source: file://login_evidence_test.lua
  method: run
  modules: [registry]
  meta: {type: test, suite: bee}
  imports:
    principals: bee.tests.support.principals:bound
    bounds: bee.drivers.values:bounds
    test: wippy.test:test
    codex_launch: bee.tests.support.driver:codex_launch
    claude_launch: bee.tests.support.driver:claude_launch
    agy_launch: bee.tests.support.driver:agy_launch
    grok_launch: bee.tests.support.driver:grok_launch
    muse_launch: bee.tests.support.driver:muse_launch
    opencode_launch: bee.tests.support.driver:opencode_launch
    provider_projection: bee.placement.native.service:provider_projection
    formats: bee.drivers.credentials:format
    driver_types: bee.drivers:types
    universal: bee.drivers.binding:universal
    materialization: bee.placement.native.service:materialization
    placement_types: bee.placement:types
- name: locate_test
  kind: function.lua
  source: file://locate_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    locate: bee.drivers.locate:locate
    descriptor: bee.drivers.descriptor:descriptor
    login_evidence: bee.drivers.locate:login_evidence
    claude: bee.drivers.claude.binding:locate
    codex: bee.drivers.codex.binding:locate
    opencode: bee.drivers.opencode.binding:locate
    agy: bee.drivers.agy.binding:locate
    grok: bee.drivers.grok.binding:locate
    muse: bee.drivers.muse.binding:locate
    login_evidence_types: bee.drivers:login_types
- name: descriptor_discovery_policy
  kind: security.policy
  meta: {type: test_support}
  policy: {actions: [registry.apply, registry.overlay.get, registry.overlay.apply], resources: '*', effect: allow}
- name: active_probe
  kind: function.lua
  source: file://active_probe.lua
  method: run
  meta: {type: test_support}
  modules: [registry]
  imports:
    resolver: bee.drivers.binding:resolver
- name: descriptor_test
  kind: function.lua
  source: file://descriptor_test.lua
  security: {policies: [bee.tests.driver:descriptor_discovery_policy]}
  method: run
  meta: {type: test, suite: bee}
  modules: [registry, funcs]
  imports:
    principals: bee.tests.support.principals:bound
    test: wippy.test:test
    descriptor: bee.drivers.descriptor:descriptor
    profile_values: bee.drivers.descriptor:profile_values
    resolver: bee.drivers.binding:resolver
    login_evidence: bee.drivers.locate:login_evidence
    bounds: bee.drivers.values:bounds
- name: universal_test
  kind: function.lua
  source: file://universal_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry, security, funcs]
  security: {policies: [bee.tests.driver:descriptor_discovery_policy]}
  imports:
    bounds: bee.drivers.values:bounds
    test: wippy.test:test
    universal: bee.drivers.binding:universal
    codec_registry: bee.drivers.codec:codec_registry
    descriptor: bee.drivers.descriptor:descriptor
    configuration: bee.drivers:configuration_types
- name: normalize_probe
  kind: function.lua
  source: file://normalize_probe.lua
  method: handle
  meta: {type: test_support}
  imports: {universal: bee.drivers.binding:universal}
- name: descriptor_denied
  kind: security.policy
  policy:
    actions: [registry.get]
    resources: ['bee.drivers.claude.descriptor:cli']
    effect: deny
- name: muse_config_test
  kind: function.lua
  source: file://muse_config_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [json]
  imports:
    principals: bee.tests.support.principals:bound
    bounds: bee.drivers.values:bounds
    test: wippy.test:test
    registry: registry
    configuration: bee.drivers.muse.binding:configuration
    driver_configuration: bee.drivers.binding:configuration
    configure: bee.drivers.muse.binding:configure
    placement_configuration: bee.placement.native.env:configuration
    placement_types: bee.placement:types

- name: docker_probe_test
  kind: function.lua
  source: file://docker_probe_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry, json]
  security: {policies: [bee.tests.driver:docker_probe_policy, bee.harness.security:launch_locate_probe_policy]}
  imports: {test: wippy.test:test, probe: bee.placement.docker.service:runtime_probe, bounds: bee.drivers.values:bounds, locate: bee.harness.launch:locate}
- name: docker_probe_policy
  kind: security.policy
  meta: {type: test_support}
  policy: {actions: [registry.get, registry.snapshot, registry.apply, funcs.call], resources: '*', effect: allow}
- name: docker_probe_facts
  kind: registry.entry
  meta: {type: test_support}
  data: {present: true, calls: 0, digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, help: '--model --permission-mode --allowedTools --disallowedTools --append-system-prompt-file'}
- name: docker_capabilities_fixture
  kind: function.lua
  source: file://docker_capabilities_fixture.lua
  method: handle
  meta: {type: test_support}
  modules: [registry]
  security: {policies: [bee.tests.driver:docker_probe_policy]}
  imports: {bounds: bee.drivers.values:bounds}
- name: host_values_test
  kind: function.lua
  source: file://host_values_test.lua
  method: run
  modules: [env]
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
  security:
    policies: [bee.tests.driver:host_values_policy]
- name: host_values_policy
  kind: security.policy
  meta: {comment: The host values test reads the driver override variables}
  policy:
    actions: [env.get]
    resources: [bee.drivers.claude.env:config_home, bee.drivers.claude.env:api_key, bee.drivers.codex.env:config_home]
    effect: allow
- name: effective_test
  modules: [registry, json]
  kind: function.lua
  source: file://effective_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    placement_profiles: bee.placement.profiles:profiles
    test: wippy.test:test
    descriptors: bee.drivers.descriptor:descriptor
    effective: bee.drivers.descriptor:effective
    universal: bee.drivers.binding:universal
    profiles: bee.harness.profiles:protocol
    bounds: bee.drivers.values:bounds
- name: option_coverage_cases
  kind: library.lua
  source: file://option_coverage_cases.lua
- name: option_coverage_test
  kind: function.lua
  source: file://option_coverage_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: 60s}
  modules: [registry, json, toml]
  security: {policies: [bee.tests.harness.profiles:repair_policy]}
  imports:
    placement_profiles: bee.placement.profiles:profiles
    test: wippy.test:test
    cases: bee.tests.driver:option_coverage_cases
    descriptors: bee.drivers.descriptor:descriptor
    effective: bee.drivers.descriptor:effective
    universal: bee.drivers.binding:universal
    configuration: bee.drivers.binding:configuration
    controls: bee.harness.app:option_controls
    profiles: bee.drivers.descriptor:profile_values
    protocol: bee.harness.profiles:protocol
    bounds: bee.drivers.values:bounds
    canonical: bee.drivers.values:canonical

- name: option_cleanup_test
  kind: function.lua
  source: file://option_cleanup_test.lua
  meta: {type: test, suite: bee}
  method: run
  modules: [json]
  imports:
    test: wippy.test:test
    descriptors: bee.drivers.descriptor:descriptor
    bounds: bee.drivers.values:bounds
    canonical: bee.drivers.values:canonical
    universal: bee.drivers.binding:universal
- name: allowall_test
  modules: [registry]
  kind: function.lua
  source: file://allowall_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    descriptors: bee.drivers.descriptor:descriptor
    effective: bee.drivers.descriptor:effective
