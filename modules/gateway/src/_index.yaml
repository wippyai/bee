version: '1.0'
namespace: bee.gateway
entries:
- name: definition
  kind: ns.definition
  module: gateway
  readme: file://README.md
  meta:
    title: Bee gateway
    comment: Authenticated managed-agent bindings, opaque credential hashes, hook intake, and MCP values; the listener and caller authority remain host-selected
- name: dependency_persist
  kind: ns.dependency
  component: bee/persist
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: dependency_application
  kind: ns.dependency
  component: bee/application
  version: '*'
- name: dependency_governance
  kind: ns.dependency
  component: bee/governance
  version: '*'
- name: dependency_docs
  kind: ns.dependency
  component: bee/docs
  version: '*'
- name: target_db
  kind: ns.requirement
  meta: {comment: Host-selected SQLite resource for bindings, credential hashes, listener state, surfaces, and hook intake}
  default: bee.gateway:db
  targets:
  - entry: bee.gateway:database_ref
    path: .resource_ref
  - entry: bee.gateway.security:store_policy
    path: .policy.resources +=
- name: target_listener
  kind: ns.requirement
  meta: {comment: Host-selected HTTP listener whose supervisor state supplies the native endpoint identity}
  default: bee:gateway_listener
  targets:
  - entry: bee.gateway:listener_ref
    path: .resource_ref
- name: target_endpoint
  kind: ns.requirement
  meta: {comment: Host-selected endpoint configuration; it describes a destination and never grants a caller network authority}
  default: bee:gateway_endpoint
  targets:
  - entry: bee.gateway.registry:endpoint_ref
    path: .resource_ref
  - entry: bee.gateway.security:address_policy
    path: .policy.resources +=
- name: target_hook_storage
  kind: ns.requirement
  meta: {comment: Host-selected native environment storage holding the executable path in variable self}
  default: bee.harness.host:environment
  targets:
  - entry: bee.gateway:hook_executable
    path: .storage
- name: target_approval_request_policy
  kind: ns.requirement
  meta: {comment: Host-selected approval request policy for exact per-binding MCP access proposals; an absent link fails closed}
  targets:
  - entry: bee.gateway.registry:approval_request_policy_ref
    path: .resource_ref
  - entry: bee.gateway.security:access_policy_read_policy
    path: .policy.resources +=
- name: target_approval_consume_policy
  kind: ns.requirement
  meta: {comment: Host-selected approval consume policy for exact per-binding MCP access effects; an absent link fails closed}
  targets:
  - entry: bee.gateway.registry:approval_consume_policy_ref
    path: .resource_ref
  - entry: bee.gateway.security:access_policy_read_policy
    path: .policy.resources +=
- name: target_tool_read_policy
  kind: ns.requirement
  meta: {comment: Host-selected bound-thread read policy for the built-in MCP tools}
  targets:
  - entry: bee.gateway.registry:tool_read_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_message_policy
  kind: ns.requirement
  meta: {comment: Host-selected bound-thread message policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway.registry:tool_message_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_launch_policy
  kind: ns.requirement
  meta: {comment: Host-selected managed-launch policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway.registry:tool_launch_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_overlay_policy
  kind: ns.requirement
  meta: {comment: Host-selected governed-overlay policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway.registry:tool_overlay_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_docs_policy
  kind: ns.requirement
  meta: {comment: Host-selected offline-documentation policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway.registry:tool_docs_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_components_policy
  kind: ns.requirement
  meta: {comment: Host-selected component-inspection policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway.registry:tool_components_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_delivery_policy
  kind: ns.requirement
  meta: {comment: Host-selected delivery policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway.registry:tool_delivery_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_publish_policy
  kind: ns.requirement
  meta: {comment: Host-selected publication policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway.registry:tool_publish_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: target_tool_application_open_policy
  kind: ns.requirement
  meta: {comment: Host-selected admitted-application open policy for the built-in MCP tool}
  targets:
  - entry: bee.gateway.registry:tool_application_open_policy_ref
    path: .resource_ref
  - entry: bee.gateway.api:mcp_http
    path: .security.policies +=
  - entry: bee.gateway.security:tool_policy_read_policy
    path: .policy.resources +=
- name: database_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: The linked SQL resource; target_db fills resource_ref}
- name: listener_ref
  kind: registry.entry
  meta: {type: bee.resource_ref, comment: The linked listener service; target_listener fills resource_ref}
- name: environment
  kind: env.storage.os
  lifecycle: {auto_start: true}
- name: db_path
  kind: env.variable
  storage: bee.gateway:environment
  variable: BEE_GATEWAY_DB
  default: .wippy/gateway.db
  readonly: true
- name: db
  kind: db.sql.sqlite
  file: ${env:bee.gateway:db_path}
  lifecycle: {auto_start: true}
- name: hook_executable
  kind: env.variable
  storage: bee.harness.host:environment
  variable: self
  default: ''
  readonly: true
- name: catalog
  kind: library.lua
  source: file://catalog.lua
  modules: [json]
  imports: {bounds: bee.threads.records:bounds}
- name: context
  kind: library.lua
  source: file://context.lua
  modules: [json]
  imports: {bounds: bee.threads.records:bounds}
- name: address_value
  kind: library.lua
  source: file://address_value.lua
- name: hooks
  kind: library.lua
  source: file://hooks.lua
  modules: [hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
- name: mcp
  kind: library.lua
  source: file://mcp.lua
  imports:
    bounds: bee.threads.records:bounds
    message: bee.threads.records:message
    arguments: bee.application:arguments
    workspace_protocol: bee.governance:workspace_protocol
    delivery_protocol: bee.governance:delivery_protocol
    docs_protocol: bee.docs:protocol
- name: surface
  kind: library.lua
  source: file://surface.lua
  imports:
    bounds: bee.threads.records:bounds
    catalog: bee.gateway:catalog
    context: bee.gateway:context
    mcp: bee.gateway:mcp
