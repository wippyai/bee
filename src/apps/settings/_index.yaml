version: '1.0'
namespace: bee.apps.settings
entries:
- name: hub_client
  kind: security.policy
  meta:
    comment: About calls only the public Hub facade
  policy:
    actions:
    - funcs.call
    resources:
    - bee.hub.binding:call
    effect: allow
- name: hub_updates
  kind: security.policy
  meta:
    comment: About reads which Bee packs are installed and which releases the Hub offers
  policy:
    actions:
    - bee.hub.read
    resources:
    - updates
    effect: allow
- name: registry_commits
  kind: security.policy
  meta:
    comment: About follows registry commits, which change installed packs
  policy:
    actions:
    - events.subscribe
    resources:
    - registry
    effect: allow
- name: edit_mode
  kind: security.policy
  meta:
    comment: Settings may ask governance to change this workspace's edit mode; governance checks the Settings actor and the person approves each change
  policy:
    actions: [funcs.call]
    resources: [bee.gov.binding:super_edit_call]
    effect: allow
- name: edit_policy_read
  kind: security.policy
  policy:
    actions: [registry.get]
    resources: [bee.gov:activation_profiles, bee.gov:protected_kernel]
    effect: allow
