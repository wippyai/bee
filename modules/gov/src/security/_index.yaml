version: '1.0'
namespace: bee.gov.security
entries:
- name: destination_facade_policy
  kind: security.policy.expr
  meta:
    comment: The facade may enter the private destination scope and call its backend; it holds no store, registry or overlay grant of its own
  policy:
    expression: '(action == "funcs.security" && resource == "security") || (action == "security.policy_group.get" && resource == "bee.gov.security:destination_execution_scope") || (action == "funcs.call" && resource == "bee.gov.binding:destination_backend_call")'
    actions: [funcs.security, security.policy_group.get, funcs.call]
    resources: [security, bee.gov.security:destination_execution_scope, bee.gov.binding:destination_backend_call]
    effect: allow
- name: super_edit_facade_policy
  kind: security.policy.expr
  meta:
    comment: Settings may enter the private host profile writer; the facade checks its broker-minted application identity
  policy:
    expression: '(action == "funcs.security" && resource == "security") || (action == "security.actor.get" && resource == "*") || (action == "security.actor.create" && resource == "*") || (action == "security.scope.create" && resource == "*") || (action == "security.policy_group.get" && resource == "bee.gov.security:super_edit_execution_scope") || (action == "funcs.call" && resource == "bee.gov.binding:super_edit_backend_call")'
    actions: [funcs.security, security.actor.get, security.actor.create, security.scope.create, security.policy_group.get, funcs.call]
    resources: [security, '*', bee.gov.security:super_edit_execution_scope, bee.gov.binding:super_edit_backend_call]
    effect: allow
- name: super_edit_execution_policy
  kind: security.policy
  groups: [super_edit_execution_scope]
  meta: {comment: Private host access used only by the Settings activation profile writer}
  policy:
    actions: [bee.gov.super_edit.execute, registry.get, registry.snapshot, registry.apply, registry.overlay.get,
      registry.overlay.apply, registry.overlay.create.*, registry.overlay.update.*, registry.overlay.delete.*, system.read]
    resources: '*'
    effect: allow
- name: super_edit_recovery_facade_policy
  kind: security.policy.expr
  meta:
    comment: The native local startup path may enter the recovery scope and call the private profile writer
  policy:
    expression: '(action == "funcs.security" && resource == "security") || (action == "security.actor.get" && resource == "*") || (action == "security.actor.create" && resource == "*") || (action == "security.scope.create" && resource == "*") || (action == "security.policy_group.get" && resource == "bee.gov.security:super_edit_recovery_execution_scope") || (action == "funcs.call" && resource == "bee.gov.binding:super_edit_backend_call")'
    actions: [funcs.security, security.actor.get, security.actor.create, security.scope.create, security.policy_group.get, funcs.call]
    resources: [security, '*', bee.gov.security:super_edit_recovery_execution_scope, bee.gov.binding:super_edit_backend_call]
    effect: allow
- name: super_edit_recovery_execution_policy
  kind: security.policy
  groups: [super_edit_recovery_execution_scope]
  meta: {comment: Private host access used only to disable super-edit overlays after local startup readiness fails}
  policy:
    actions: [bee.gov.super_edit.recover, registry.get, registry.snapshot, registry.apply, registry.overlay.get,
      registry.overlay.apply, registry.overlay.create.*, registry.overlay.update.*, registry.overlay.delete.*, system.read]
    resources: '*'
    effect: allow
- name: recovery_command_policy
  kind: security.policy.expr
  meta: {comment: Headless native governance recovery reads activation facts and restores one retained baseline}
  policy:
    expression: (resource != "bee.persist.env:startup_progress" && action != "env.set" && (action != "env.get" || resource == "bee.gov.env:node_identity_migration_source")) || (action in ["env.get", "env.set"] && resource == "bee.persist.env:startup_progress")
    actions: [db.get, registry.get, registry.snapshot, registry.preview, registry.apply, system.read, env.get,
      funcs.call, funcs.security, security.actor.create, security.scope.create, security.policy.get,
      registry.overlay.get, registry.overlay.apply, registry.overlay.create.*, registry.overlay.update.*, registry.overlay.delete.*, env.set]
    resources: '*'
    effect: allow
- name: staging_policy
  kind: security.policy
  groups: [workspace_execution_scope]
  policy:
    actions: [registry.get, system.read, env.get]
    resources: [bee.gov.env:database_ref, bee.gov.env:node_identity_migration_source, node]
    effect: allow
- name: staging_database_policy
  kind: security.policy.expr
  groups: [workspace_execution_scope]
  policy:
    expression: (resource != "bee.persist.env:startup_progress" && action != "env.set" && action != "env.get") || (action in ["env.get", "env.set"] && resource == "bee.persist.env:startup_progress")
    actions: [db.get, env.set, env.get]
    resources: [bee.gov.env:db, bee.persist.env:startup_progress]
    effect: allow
- name: workspace_execution_policy
  kind: security.policy
  groups: [workspace_execution_scope]
  policy:
    actions: [bee.gov.workspace.execute]
    resources: [bee.gov.binding:workspace_backend_call]
    effect: allow
- name: overlay_facade_policy
  kind: security.policy.expr
  policy:
    expression: '(action == "funcs.security" && resource == "security") || (action == "security.policy_group.get" && resource == "bee.gov.security:workspace_execution_scope") || (action == "funcs.call" && resource == "bee.gov.binding:workspace_backend_call")'
    actions: [funcs.security, security.policy_group.get, funcs.call]
    resources: [security, bee.gov.security:workspace_execution_scope, bee.gov.binding:workspace_backend_call]
    effect: allow
- name: destination_service_policy
  kind: security.policy.expr
  groups: [destination_execution_scope]
  meta: {comment: Private dependencies of the destination owner; callers still need an exact workspace delivery action}
  policy:
    expression: (resource != "bee.persist.env:startup_progress" && action != "env.set" && (action != "env.get" || resource == "bee.gov.env:node_identity_migration_source")) || (action in ["env.get", "env.set"] && resource == "bee.persist.env:startup_progress")
    actions: [db.get, registry.get, registry.preview, system.read, env.get, funcs.call, funcs.security, security.actor.create, security.scope.create, security.policy.get, registry.overlay.get, registry.overlay.apply, registry.overlay.create.*, registry.overlay.update.*, registry.overlay.delete.*, env.set]
    resources: '*'
    effect: allow
- name: destination_execution_policy
  kind: security.policy
  groups: [destination_execution_scope]
  meta: {comment: Proof that a caller entered the private destination scope; nothing else grants this action}
  policy:
    actions: [bee.gov.delivery.execute]
    resources: [bee.gov.binding:destination_backend_call]
    effect: allow
- name: publication_service_policy
  kind: security.policy.expr
  meta: {comment: Private host resources for publishing one configured local overlay as immutable Sync content}
  policy:
    expression: (resource != "bee.persist.env:startup_progress" && action != "env.set" && (action != "env.get" || resource == "bee.gov.env:node_identity_migration_source")) || (action in ["env.get", "env.set"] && resource == "bee.persist.env:startup_progress")
    actions: [registry.get, registry.overlay.get, db.get, system.read, env.get, env.set]
    resources: '*'
    effect: allow
- name: publication_profiles_read_policy
  kind: security.policy
  meta: {comment: The selected publication-profile entry readable by the delivery facade; target_publication_profiles fills the resource}
  policy:
    actions: [registry.get]
    resources: []
    effect: allow
- name: delivery_node_read_policy
  kind: security.policy
  meta: {comment: The delivery facade reads this node's identity, the source of every version it publishes}
  policy:
    actions: [system.read]
    resources: [node]
    effect: allow
- name: delivery_facade_policy
  kind: security.policy
  meta: {comment: Public delivery facade dependencies; profile access is injected as one exact host-selected entry}
  policy:
    actions: [funcs.call, security.actor.get, registry.get]
    resources: [bee.gov.binding:publication_call, bee.gov.binding:destination_call, bee.gov.env:publication_profiles_ref]
    effect: allow
- name: gateway_policy
  kind: security.policy
  meta: {comment: The capability gateway reads grant records and performs only calls it has checked against the caller's own live grant; applications never hold these actions}
  policy:
    actions: [registry.get, contract.get, contract.open, contract.call, contract.security, security.scope.create, http_client.request]
    resources: '*'
    effect: allow
