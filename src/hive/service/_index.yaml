version: '1.0'
namespace: bee.hive.service
entries:
- name: supervisor
  kind: process.lua
  source: file://supervisor.lua
  method: main
  modules: [process, channel, system, registry, logger, events, time]
  imports:
    protocol: bee.hive:protocol
- name: supervisor_service
  meta:
    title: Hive · supervisor
  kind: process.service
  process: bee.hive.service:supervisor
  host: bee:workers
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.hive.supervisor}
      policies: [bee.hive.security:supervisor, bee.hive.security:routing, bee.hive.security:routing_changes, bee.hive.security:messaging]
    restart:
      max_attempts: 10
