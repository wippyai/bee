- name: placement_path
  kind: env.variable
  meta:
    comment: Host-selected executable search path for native placement children
  storage: bee.placement.native:environment
  variable: PATH
  default: /usr/local/bin:/usr/bin:/bin
  readonly: true
- name: placement_host_files
  kind: fs.directory
  meta:
    comment: The host filesystem as one volume for executable measurement; this entry requests readonly access
  directory: /
  auto_init: false
  readonly: true
- name: placement_executor
  kind: exec.native
  meta:
    comment: Children start with a clean environment; PATH comes from the host, everything else from the admitted request
  default_env:
    PATH: ${env:bee:placement_path}
- name: placement_admitted_roots
  kind: registry.entry
  meta:
    type: bee.placement_roots
    comment: fs.directory entries a launch may name as resource roots on this host with the widest access allowed; host policy, not a delegated grant
  data:
    roots: []
- name: placement_resource_mode
  kind: registry.entry
  meta:
    type: bee.placement_resource_mode
    comment: host_configured or granted; selected by the host, never by a request
  data:
    mode: granted
- name: resource_roots
  kind: registry.entry
  meta:
    type: bee.resource_roots
    comment: Host-selected roots available to first-use harness setup; driver declarations select only resource
      names
  data:
    roots:
    - root_ref: bee.env:workspace_root
      access: write
    - root_ref: bee.placement.native:root
      access: write
- name: resources_workspace_extension
  kind: contract.binding
  meta:
    title: Resources
    comment: The host attaches each workspace's resource associations to the workspace catalog and its viewer
  contracts:
  - contract: bee.workspace.catalog:extension
    methods:
      describe: bee.resources.binding:describe
      search: bee.resources.binding:search
