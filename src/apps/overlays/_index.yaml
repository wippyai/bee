version: '1.0'
namespace: bee.overlays
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: [tty, process, channel, uuid, funcs]
  imports:
    client: bee.application:client
    appearance: bee.application:appearance
    caller: bee.application:caller
    model: bee.overlays:model
    view: bee.overlays:view
  meta:
    type: bee.application
    application:
      api_version: 1
      title: Overlays
      icon: D
      lifetime: view
      revision: '1'
      instance_policy: singleton
      group: Tools
      role: overlays
      resume_schema: overlays.v1
      restart_policy: manual
- name: model
  kind: library.lua
  source: file://model.lua
  modules: [json]
  imports:
    bounds: bee.threads.records:bounds
    caller: bee.application:caller
    preflight: bee.governance:preflight
- name: view
  kind: library.lua
  source: file://view.lua
  modules: [tty]
  imports:
    appearance: bee.application:appearance
    model: bee.overlays:model
    text: bee.application:text
- name: client_policy
  kind: security.policy
  meta:
    comment: Overlays calls only the destination-owned governance facade; local review is separate from Approvals decisions
  policy:
    actions: [funcs.call]
    resources: [bee.governance:destination_call]
    effect: allow
