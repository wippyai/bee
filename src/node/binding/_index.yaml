version: '1.0'
namespace: bee.node.binding
entries:
- name: catalog_types
  kind: library.lua
  source: file://catalog.lua
  modules: [registry, fs]
  imports:
    bounds: bee.values:bounds
    workspaces: bee.node:workspaces
- name: catalog
  kind: function.lua
  source: file://catalog.lua
  method: handle
  modules: [registry, fs, sql, uuid, time, json]
  imports:
    bounds: bee.values:bounds
    workspaces: bee.node:workspaces
- name: read
  kind: function.lua
  meta:
    comment: One workspace's row, its folder under the admitted root it lies in; needs bee.node.workspace.read on the workspace
  source: file://operations.lua
  method: read
  modules: [funcs, security]
  imports: &operation_imports
    bounds: bee.values:bounds
    catalog: bee.node.binding:catalog_types
  security:
    policies: [bee.node.security:workspace_catalog_facade]
- name: roots
  kind: function.lua
  meta:
    comment: The roots the node admits for workspaces, in name order, each with its access (read or write); needs bee.node.workspace.read on catalog
  source: file://operations.lua
  method: roots
  modules: [funcs, security]
  imports: *operation_imports
  security:
    policies: [bee.node.security:workspace_catalog_facade]
- name: folders
  kind: function.lua
  meta:
    comment: One page of the folders inside a folder of an admitted root, each with the workspace that holds it; needs bee.node.workspace.browse on the root
  source: file://operations.lua
  method: folders
  modules: [funcs, security]
  imports: *operation_imports
  security:
    policies: [bee.node.security:workspace_catalog_facade]
- name: tests_call
  kind: function.lua
  meta:
    comment: Run and read the tests an application the caller delivered carries; it verifies the caller owns the overlay the application is delivered from, then enters the private test backend scope
  source: file://tests_call.lua
  method: handle
  modules: [funcs, security]
  imports:
    bounds: bee.values:bounds
    tests: bee.node:tests
  security:
    policies: [bee.node.security:tests_facade]
- name: tests_backend
  kind: function.lua
  meta:
    comment: Plans a run of an application's tests, writes it to the node database and wakes the runner; reads a run's results. Runs only in the test backend scope
  source: file://tests_backend.lua
  method: handle
  modules: [process, registry, uuid]
  imports:
    application: bee.node:application
    tests: bee.node:tests
    test_runs: bee.node:test_runs
    discovery: wippy.test:discovery
- name: app_tools
  kind: function.lua
  meta:
    comment: The tools the caller's workspace applications offer agents, with diagnostics for tools that are not offered
  source: file://app_tools_call.lua
  method: list
  modules: [funcs, security, ctx]
  imports: &app_tools_imports
    bounds: bee.values:bounds
    application: bee.node:application
    app_tools: bee.node:app_tools
  security:
    policies: [bee.node.security:app_tools_runner, bee.node.security:identity]
- name: app_tool_call
  kind: function.lua
  meta:
    comment: Runs one tool the caller's workspace applications offer agents, as that application with the actor and exact scope its own instances run with
  source: file://app_tools_call.lua
  method: call
  modules: [funcs, security, ctx]
  imports: *app_tools_imports
  security:
    policies: [bee.node.security:app_tools_runner, bee.node.security:identity]
