version: '1.0'
namespace: bee.harness.app
entries:
- name: input
  kind: library.lua
  source: file://input.lua
  modules:
  - tty
- name: restore_view
  kind: library.lua
  source: file://restore_view.lua
  imports:
    frame: bee.application:frame
    appearance: bee.application:appearance
- name: runtime
  kind: library.lua
  source: file://runtime.lua
  modules:
  - tty
  - exec
  - process
  - channel
  - time
  - funcs
  - uuid
  - json
  imports:
    client: bee.application:client
    text: bee.application:text
    window_request: bee.harness.window:request
    input_event: bee.harness.app:input
    admission: bee.harness.launch:admission
    machine: bee.harness.carrier:machine
    picker: bee.harness.app:picker
    recovery: bee.harness.window:recovery
    hooks: bee.harness.window:hooks
    delivery: bee.harness.window:delivery
    records: bee.harness.carrier:hook_records
    appearance: bee.application:appearance
    restore_view: bee.harness.app:restore_view
    bounds: bee.threads.records:bounds
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: []
  imports:
    runtime: bee.harness.app:runtime
    window: bee.placement.native.service:window
    docker_window: bee.placement.docker.service:window
  meta:
    type: bee.application
    application:
      api_version: 1
      title: Agent
      icon: A
      lifetime: view
      revision: '1'
      instance_policy: multiple
      group: ''
      role: terminal
      resume_schema: bee.agent.window@1
      restart_policy: automatic
      commands:
      - name: agent
        fullscreen: false
- name: agents
  kind: library.lua
  source: file://agents.lua
  modules:
  - json
  imports:
    sessions: bee.application:sessions
- name: picker_view
  kind: library.lua
  source: file://picker_view.lua
  imports:
    frame: bee.application:frame
    appearance: bee.application:appearance
    text: bee.application:text
    agents: bee.harness.app:agents
- name: session_view
  kind: library.lua
  source: file://session_view.lua
  modules:
  - tty
  imports:
    frame: bee.application:frame
    appearance: bee.application:appearance
    text: bee.application:text
    agents: bee.harness.app:agents
- name: picker
  kind: library.lua
  source: file://picker.lua
  modules:
  - tty
  - process
  - channel
  - time
  - uuid
  - funcs
  imports:
    frame: bee.application:frame
    bounds: bee.threads.records:bounds
    client: bee.application:client
    caller: bee.application:caller
    appearance: bee.application:appearance
    input_event: bee.harness.app:input
    sessions: bee.application:sessions
    agents: bee.harness.app:agents
    session_view: bee.harness.app:session_view
    admission: bee.harness.launch:admission
    view: bee.harness.app:picker_view
    forms: bee.harness.app:profile_form
    profile_view: bee.harness.app:profile_view
- name: profile_editor
  kind: library.lua
  source: file://profile_editor.lua
  imports:
    bounds: bee.threads.records:bounds
    preferences: bee.driver:preferences
    protocol: bee.harness.profiles:protocol
- name: profile_form
  kind: library.lua
  source: file://profile_form.lua
  modules:
  - funcs
  - uuid
  imports:
    bounds: bee.threads.records:bounds
    catalog: bee.harness.catalog:catalog
    definition: bee.harness.launch:definitions
    protocol: bee.harness.profiles:protocol
    editor: bee.harness.app:profile_editor
- name: profile_view
  kind: library.lua
  source: file://profile_view.lua
  modules:
  - tty
  imports:
    frame: bee.application:frame
    appearance: bee.application:appearance
    text: bee.application:text
    caller: bee.application:caller
    folder_picker: bee.application:folder_picker
    editor: bee.harness.app:profile_editor
    forms: bee.harness.app:profile_form
