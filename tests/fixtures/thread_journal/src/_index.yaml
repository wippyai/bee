version: '1.0'
namespace: bee.thread.demo
entries:
- name: main
  kind: process.lua
  source: file://main.lua
  method: main
  modules: [process, channel, security, time, io, uuid]
  imports:
    store: bee.thread.demo.storage:store
  meta:
    command:
      name: thread-demo
      short: Run an isolated durable thread with a subscriber
      security:
        actor: {id: bee.thread.demo.local}
        policies: [bee.thread.demo:owner]
- name: producer
  kind: process.lua
  source: file://producer.lua
  method: main
  modules: [process, json]
  imports:
    model: bee.thread.demo:model
    client: bee.thread.demo:client
- name: subscriber
  kind: process.lua
  source: file://subscriber.lua
  method: main
  modules: [process, sql, contract, security]
  imports:
    client: bee.thread.demo:client
    reader: bee.thread.demo:reader
- name: reader
  kind: library.lua
  source: file://reader.lua
  modules: [contract]
  imports:
    client: bee.thread.demo:client
- name: reader_contract
  kind: contract.definition
  methods:
  - name: inspect
    description: Inspect caller framing in the isolated contract proof
  - name: read_after
    description: Read committed events with an owner-issued read capability
  - name: inspect_owned_storage
    description: Verify function-owned SQL authority without granting it to the caller
- name: reader_binding
  kind: contract.binding
  contracts:
  - contract: bee.thread.demo:reader_contract
    methods:
      inspect: bee.thread.demo:identity_probe
      read_after: bee.thread.demo:read_after
      inspect_owned_storage: bee.thread.demo:owned_storage_probe
- name: owned_storage_probe
  kind: function.lua
  source: file://identity_probe.lua
  method: main
  modules: [process, sql, security]
  security:
    policies: [bee.thread.demo:owned_storage_policy]
- name: owned_storage_policy
  kind: security.policy
  policy:
    actions: [db.get]
    resources: [bee.thread.demo:db]
    effect: allow
- name: read_after
  kind: function.lua
  source: file://read_after.lua
  method: main
  imports:
    client: bee.thread.demo:client
- name: identity_probe
  kind: function.lua
  source: file://identity_probe.lua
  method: main
  modules: [process, sql, security]
- name: client
  kind: library.lua
  source: file://client.lua
  modules: [process, channel, time]
- name: model
  kind: library.lua
  source: file://model.lua
- name: workers
  kind: process.host
  host: {max_processes: 4, workers: 2}
  lifecycle: {auto_start: true}
- name: environment
  kind: env.storage.os
  lifecycle: {auto_start: true}
- name: database_path
  kind: env.variable
  storage: bee.thread.demo:environment
  variable: BEE_THREAD_DEMO_DB
  default: thread-demo.db
  readonly: true
- name: db
  kind: db.sql.sqlite
  file: ${env:bee.thread.demo:database_path}
  lifecycle: {auto_start: true}
- name: participant
  kind: security.policy
  policy:
    actions: [process.send]
    resources: '*'
    effect: allow
- name: binding_policy
  kind: security.policy
  policy:
    actions: [contract.open]
    resources: [bee.thread.demo:reader_binding]
    effect: allow
- name: method_policy
  kind: security.policy
  policy:
    actions: [contract.call]
    resources: [inspect, read_after, inspect_owned_storage]
    effect: allow
- name: function_policy
  kind: security.policy
  policy:
    actions: [funcs.call]
    resources: [bee.thread.demo:identity_probe, bee.thread.demo:read_after, bee.thread.demo:owned_storage_probe]
    effect: allow
- name: owner
  kind: security.policy
  policy:
    actions: [db.get, process.send, process.spawn, process.spawn.monitored, process.host, process.terminate, process.security, process.context, security.scope.create, security.policy.get, process.monitor]
    resources: '*'
    effect: allow
- name: terminal
  kind: terminal.host
  lifecycle: {auto_start: true}
