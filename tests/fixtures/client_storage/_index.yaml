version: '1.0'
namespace: bee.client_storage_probe
entries:
- name: bindings_policy
  kind: security.policy
  policy:
    actions: [db.get]
    resources: [bee.client.db:left, bee.client.db:right, bee.workspace.db:left, bee.workspace.db:right]
    effect: allow
- name: broad_policy
  kind: security.policy
  policy:
    actions: [db.get]
    resources: ['*']
    effect: allow
- name: denied
  kind: process.lua
  source: file://bindings.lua
  method: denied
  modules: [sql]
  imports:
    store: bee.client:store
    workspace_store: bee.storage:store
    state: bee.client:state
  security:
    policies: [bee.client_storage_probe:broad_policy, bee:workspace_storage_boundary]
  meta:
    command:
      name: client-storage-denial
      short: Verify reserved database denial
- name: bindings
  kind: process.lua
  source: file://bindings.lua
  method: main
  modules: [sql]
  imports:
    store: bee.client:store
    workspace_store: bee.storage:store
    state: bee.client:state
  security:
    policies: [bee.client_storage_probe:bindings_policy]
  meta:
    command:
      name: client-storage-bindings
      short: Verify independent core database bindings
- name: main
  kind: process.lua
  source: file://main.lua
  method: main
  imports:
    store: bee.client:store
    state: bee.client:state
    model: bee.desktop:model
    appearance: bee.desktop:appearance
  security:
    policies: [bee:client_storage_policy]
  meta:
    command:
      name: client-storage-probe
      short: Test client storage in an isolated database
