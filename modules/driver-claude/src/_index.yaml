version: '1.0'
namespace: bee.driver.claude
entries:
- name: definition
  kind: ns.definition
  module: driver-claude
  readme: file://README.md
  meta:
    title: Bee Claude driver
    comment: Optional harness binding; host activation and launch policies authorize its use
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: host_environment
  kind: ns.requirement
  meta:
    comment: Read-only host environment that supplies the selected Claude executable and API key
  default: bee.harness.host:environment
  targets:
  - entry: bee.driver.claude:executable
    path: .storage
  - entry: bee.driver.claude:api_key
    path: .storage
- name: window_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Claude window route
  targets:
  - entry: bee.driver.claude:default_window
    path: .data.policy_ref
- name: batch_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Claude batch route
  targets:
  - entry: bee.driver.claude:research_batch
    path: .data.policy_ref
- name: executable
  kind: env.variable
  storage: bee.harness.host:environment
  variable: claude
  default: ''
  readonly: true
- name: api_key
  kind: env.variable
  storage: bee.harness.host:environment
  variable: ANTHROPIC_API_KEY
  default: ''
  readonly: true
- name: environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: config_home
  kind: env.variable
  storage: bee.driver.claude:environment
  variable: CLAUDE_CONFIG_DIR
  default: ''
  readonly: true
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  modules: [json]
  imports:
    events: bee.driver.kit:events
    types: bee.driver:types
- name: launch
  kind: library.lua
  source: file://launch.lua
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    types: bee.driver:types
- name: permission_adapter
  kind: registry.entry
  meta:
    type: harness.permission_adapter
    comment: The Claude Code stream-json control protocol for interactive permissions, captured from the executable; profiles pin its digest, hosts enable it per launch policy
  data:
    adapter:
      schema_revision: bee.permission-adapter@2
      event_name: claude.control_request
      event_revision: stream-json-2
      request:
        correlation: request_id
        tool: request.tool_name
        input: request.input
        prompt: request.description
        acknowledgment: request.tool_use_id
      response:
        envelope:
          type: control_response
          response: {subtype: success}
        correlation_field: response.request_id
        decision_field: response.response.behavior
        allow_value: allow
        deny_value: deny
        reason_field: response.response.message
      acknowledgment: {mode: correlation_echo, event_type: tool.result, field: call_id}
      deny_acknowledgment: {mode: terminal_denial, event_type: tool.result, field: outcome, value: failed, correlation_field: call_id}
      cancellation: deny_before_close
      proof_fixture: control
- name: binding
  kind: contract.binding
  contracts:
  - contract: bee.driver:driver
    methods:
      prepare: bee.driver.claude.binding:prepare
      dispatch: bee.driver.claude.binding:dispatch
      normalize: bee.driver.claude.binding:normalize
      configure: bee.driver.claude.binding:configure
  meta:
    type: harness.driver
    driver_id: claude
    profiles_ref: bee.driver.claude:profiles
- name: profiles
  kind: registry.entry
  meta:
    type: harness.profile
    driver_ref: bee.driver.claude:binding
  data:
    driver:
      schema_revision: bee.driver@1
      kind: harness
      title: Claude Code
      implementation_version: 2.1.265
      default_profile: session
      profiles:
      - id: session
        mode: session
        hooks:
          transports:
          - command
          - http
          - mcp_tool
          events:
          - SessionStart
          - UserPromptSubmit
          - PreToolUse
          - PostToolUse
          - PostToolUseFailure
          - PermissionRequest
          - PermissionDenied
          - Stop
          - SessionEnd
          adapter_ref: bee.driver.claude:protocol
        inbound:
        - next_turn
        mcp:
          client_transports:
          - stdio
          - streamable_http
          - sse
          initialize_timeout_ms: 30000
          call_timeout_ceiling_ms: 120000
        protocol: stream-json
        protocol_revision: stream-json-2
        answer_path: &id001
          strategy: terminal_field
          adapter_ref: bee.driver.claude:protocol
        resume: &id002
          strategy: per-process
          portable: false
        isolation_env: &id003
          variables:
          - HOME
          - CLAUDE_CONFIG_DIR
          private_home: true
        exit_codes_trustworthy: false
        permission_exchange:
          mode: adapter
          adapter_ref: bee.driver.claude:permission_adapter
          adapter_digest: 91a46beb9b3e0f0db3af61246310f494bb0ddbfbdff178709fca783c9a4840c6
        input_ready: &id004
          strategy: protocol
          adapter_ref: bee.driver.claude:protocol
          timeout_ms: 15000
        interrupt: &id005
          methods:
          - signal_group
      - id: batch
        mode: batch
        protocol: stream-json
        protocol_revision: stream-json-2
        answer_path: *id001
        resume: *id002
        isolation_env: *id003
        exit_codes_trustworthy: false
        permission_exchange:
          mode: adapter
          adapter_ref: bee.driver.claude:permission_adapter
          adapter_digest: 91a46beb9b3e0f0db3af61246310f494bb0ddbfbdff178709fca783c9a4840c6
        input_ready: *id004
        interrupt: *id005
      - id: window
        mode: window
        protocol: pty
        protocol_revision: native-window-1
        answer_path: {strategy: none}
        resume: {strategy: none, portable: false}
        isolation_env:
          variables: [HOME, CLAUDE_CONFIG_DIR]
          private_home: false
        exit_codes_trustworthy: false
        input_ready: {strategy: none}
        permission_exchange: {mode: none}
- name: default_window
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned Claude Code window declaration; the host separately selects its policy, activation, executable and permissions
  data:
    schema_revision: bee.launch-definition@1
    launch_id: claude-window
    title: Claude Code
    command_names: [claude]
    binding_ref: bee.driver.claude:binding
    profile_id: window
    policy_ref: ''
    default_mode: window
    allowed_overrides: [thread, workdir]
    workdir_policy: {kind: declared_resource, resource_ref: project}
    thread_policy: {kind: new}
    session_resource: session
    credentials: [claude_api_key]
    presentation: {start_menu: true, fullscreen: true, reuse: never}
- name: research_batch
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned bounded Claude batch route for a host-selected coordinator and caller-owned shared thread
  data:
    schema_revision: bee.launch-definition@1
    launch_id: claude-research-batch
    title: Claude researcher
    command_names: []
    binding_ref: bee.driver.claude:binding
    profile_id: batch
    policy_ref: ''
    default_mode: batch
    allowed_overrides: [thread, workdir]
    workdir_policy: {kind: declared_resource, resource_ref: project}
    thread_policy: {kind: caller}
    session_resource: session
    credentials: [claude_api_key]
    presentation: {start_menu: false, fullscreen: false, reuse: never}

- name: credential_format
  kind: registry.entry
  meta:
    type: bee.credential_format
  data:
    schema_revision: bee.credential-format@1
    environment_destination: ANTHROPIC_API_KEY
    file:
      path: .claude/.credentials.json
      content_format: json
      initialize:
      - path: .claude.json
        content: '{"hasCompletedOnboarding":true}'
