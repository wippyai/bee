version: '1.0'
namespace: bee.placement.docker
entries:
- name: definition
  kind: ns.definition
  module: placement-docker
  readme: file://README.md
  meta:
    title: Bee Docker placement
- name: dependency_placement
  kind: ns.dependency
  component: bee/placement
  version: '*'
- name: dependency_local
  kind: ns.dependency
  component: bee/placement-native
  version: '*'
- name: dependency_docker
  kind: ns.dependency
  component: userspace/docker
  version: 0.5.17
- name: protected_namespace
  kind: ns.requirement
  default: bee.placement.docker
  targets:
  - entry: bee.security.gov:protected_kernel
    path: .data.namespaces +=
- name: docker_service_groups
  kind: ns.requirement
  default: []
  targets:
  - entry: userspace.docker.service:root.service
    path: .lifecycle.security.groups
- name: docker_service_start
  kind: ns.requirement
  default: false
  targets:
  - entry: userspace.docker.service:root.service
    path: .lifecycle.auto_start
- name: dependency_bootloader
  kind: ns.dependency
  component: wippy/bootloader
  version: 0.3.16
  parameters:
  - name: env_storage
    value: bee.placement.docker.env:boot_environment
- name: docker_database
  kind: ns.requirement
  default: bee.placement.native.env:db
  targets:
  - entry: userspace.docker:database
    path: .default
- name: process_host
  kind: ns.requirement
  targets:
  - entry: userspace.docker:process_host
    path: .default
  - entry: wippy.bootloader:application_host
    path: .default
  - entry: bee.placement.docker.service:sweeper_service
    path: .host
  - entry: bee.placement.docker.service:image_owner_service
    path: .host
- name: bootloader_service_start
  kind: ns.requirement
  default: false
  targets:
  - entry: wippy.bootloader:bootloader.service
    path: .lifecycle.auto_start
- name: bootloader_service_groups
  kind: ns.requirement
  default: []
  targets:
  - entry: wippy.bootloader:bootloader.service
    path: .lifecycle.security.groups
- name: sweeper_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected policy grants for the supervision sweeper
  targets:
  - entry: bee.placement.docker.service:sweeper_service
    path: .lifecycle.security.policies
- name: environment_provisioning
  kind: ns.requirement
  targets:
  - entry: bee.placement.docker.env:environment_configuration
    path: .data.value
- name: image_owner_policies
  kind: ns.requirement
  default:
  - bee.placement.native.security:placement_store_policy
  - bee.placement.native.security:placement_exec_policy
  - bee.placement.native.security:placement_runner_policy
  - bee.placement.docker.security:docker_policy
  - bee.placement.docker.security:docker_socket_policy
  - bee.placement.docker.security:image_policy
  - bee.placement.docker.security:image_client_policy
  meta:
    comment: Host-selected approval, overlay and listener lifecycle authority for first-use provisioning
  targets:
  - entry: bee.placement.docker.service:image_owner_service
    path: .lifecycle.security.policies
- name: target_prepare_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.placement.docker.binding:prepare
    path: .security.policies
  - entry: bee.placement.docker.binding:prepare_environment
    path: .security.policies
- name: target_start_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.placement.docker.binding:start
    path: .security.policies
  - entry: bee.placement.docker.binding:status
    path: .security.policies
  - entry: bee.placement.docker.binding:stop
    path: .security.policies
  - entry: bee.placement.docker.binding:reconcile
    path: .security.policies
  - entry: bee.placement.docker.binding:cleanup
    path: .security.policies
  - entry: bee.placement.docker.binding:evidence
    path: .security.policies
  - entry: bee.placement.docker.binding:attach
    path: .security.policies
  - entry: bee.placement.docker.binding:capabilities
    path: .security.policies
  - entry: bee.placement.docker.binding:measure_executable
    path: .security.policies
  - entry: bee.placement.docker.binding:close_stdin
    path: .security.policies
- name: target_runner_policies
  kind: ns.requirement
  default: []
  meta:
    comment: Host-selected grants for these package operations
  targets:
  - entry: bee.placement.docker.service:runner
    path: .security.policies
