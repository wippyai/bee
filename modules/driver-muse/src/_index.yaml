version: '1.0'
namespace: bee.driver.muse
entries:
- name: definition
  kind: ns.definition
  module: driver-muse
  readme: file://README.md
  meta:
    title: Bee Muse driver
    comment: Optional harness binding; host activation and launch policies authorize its use
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: host_environment
  kind: ns.requirement
  meta:
    comment: Read-only host environment that supplies the selected Muse executable
  default: bee.harness.host:environment
  targets:
  - entry: bee.driver.muse:executable
    path: .storage
- name: window_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Muse window route
  default: bee.driver.muse:launch_policy_muse_window
  targets:
  - entry: bee.driver.muse:default_window
    path: .data.policy_ref
- name: batch_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned Muse batch route
  default: bee.driver.muse:launch_policy_muse_batch
  targets:
  - entry: bee.driver.muse:research_batch
    path: .data.policy_ref
- name: executable
  kind: env.variable
  storage: bee.harness.host:environment
  variable: muse
  default: ''
  readonly: true
- name: environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  modules: [json]
  imports:
    bounds: bee.threads.records:bounds
    events: bee.driver.kit:events
    types: bee.driver:types
- name: configuration
  kind: library.lua
  source: file://configuration.lua
  modules: [hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    configure_protocol: bee.driver:configuration
    quote: bee.driver.kit:quote
- name: launch
  kind: library.lua
  source: file://launch.lua
  imports:
    bounds: bee.threads.records:bounds
    types: bee.driver:types
- name: binding
  kind: contract.binding
  contracts:
  - contract: bee.driver:driver
    methods:
      prepare: bee.driver.muse.binding:prepare
      dispatch: bee.driver.muse.binding:dispatch
      normalize: bee.driver.muse.binding:normalize
      configure: bee.driver.muse.binding:configure
  meta:
    type: harness.driver
    driver_id: muse
    profiles_ref: bee.driver.muse:profiles
- name: profiles
  kind: registry.entry
  meta:
    type: harness.profile
    driver_ref: bee.driver.muse:binding
  data:
    driver:
      schema_revision: bee.driver@1
      kind: harness
      title: Muse CLI
      implementation_version: 1.3.0
      default_profile: batch
      profiles:
      - id: batch
        mode: batch
        hooks:
          transports:
          - command
          events:
          - SessionStart
          - UserPromptSubmit
          - PreToolUse
          - PostToolUse
          - PermissionRequest
          - Stop
          - SessionEnd
          adapter_ref: bee.driver.muse:protocol
        inbound:
        - next_turn
        protocol: stream-json
        protocol_revision: msp-exec-1
        answer_path:
          strategy: accumulate
          adapter_ref: bee.driver.muse:protocol
        resume:
          strategy: per-process
          portable: false
        isolation_env:
          variables: [HOME]
          private_home: true
        exit_codes_trustworthy: false
        input_ready:
          strategy: protocol
          adapter_ref: bee.driver.muse:protocol
          timeout_ms: 15000
        interrupt:
          methods:
          - signal_group
        mcp:
          client_transports:
          - streamable_http
          initialize_timeout_ms: 30000
        sandbox:
          providers:
          - muse-sandbox
          required_placement_features: []
      - id: window
        mode: window
        protocol: pty
        protocol_revision: native-window-1
        answer_path: {strategy: none}
        resume: {strategy: none, portable: false}
        isolation_env:
          variables: [HOME]
          private_home: true
        exit_codes_trustworthy: false
        input_ready: {strategy: none}
        permission_exchange: {mode: none}
- name: default_window
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned Muse window declaration; the host separately selects its policy, activation, executable and permissions
  data:
    schema_revision: bee.launch-definition@1
    launch_id: muse-window
    title: Muse CLI
    command_names: [muse]
    binding_ref: bee.driver.muse:binding
    profile_id: window
    policy_ref: ''
    default_mode: window
    allowed_overrides: [thread, workdir]
    workdir_policy: {kind: declared_resource, resource_ref: project}
    thread_policy: {kind: new}
    session_resource: session
    credentials: []
    presentation: {start_menu: true, fullscreen: true, reuse: never}
- name: research_batch
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned bounded Muse batch route for a host-selected coordinator and caller-owned shared thread
  data:
    schema_revision: bee.launch-definition@1
    launch_id: muse-research-batch
    title: Muse researcher
    command_names: []
    binding_ref: bee.driver.muse:binding
    profile_id: batch
    policy_ref: ''
    default_mode: batch
    allowed_overrides: [thread, workdir]
    workdir_policy: {kind: declared_resource, resource_ref: project}
    thread_policy: {kind: caller}
    session_resource: session
    credentials: [muse_login]
    presentation: {start_menu: false, fullscreen: false, reuse: never}
- name: credential_format
  kind: registry.entry
  meta:
    type: bee.credential_format
  data:
    schema_revision: bee.credential-format@1
    file:
      path: .config/muse/auth.json
      content_format: opaque
      initialize: []
- name: command
  kind: registry.entry
  meta:
    type: bee.application_command
    comment: CLI command to launch Muse CLI in the agent window
  data:
    name: muse
    definition_id: bee.harness.window:app
    arguments:
    - bee.driver.muse:default_window
    fullscreen: true

- name: launch_policy_muse_batch
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected non-interactive Muse batch policy for bounded research actions on a caller-owned thread
  data:
    schema_revision: bee.launch-policy@2
    allowed_overrides: [thread, workdir]
    required_cleanup: process_group
    required_exit_observation: independent
    start_ms: 15000
    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables: {}
    executable_env: {muse: bee.driver.muse:executable}
    environment: {}
    allow_host_home: false
    gateway_tools: [thread_read, thread_wait, thread_message, thread_sessions, thread_notify, session_directory, session_send, session_inbox, session_ack, session_reply, overlay, delivery, docs, components, install_request, uninstall_request, install_status]
    gateway_hooks: [SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, Stop]
    hook_command_ref: bee.gateway:hook_executable
    profile_options: {effort: [low, medium, high]}
    prepare_options: {approval_mode: on-request, max_steps: 1}
- name: launch_policy_muse_window
  kind: registry.entry
  meta:
    type: bee.launch_policy
    comment: Host-selected executable binding for the component-owned Muse window; missing host executable leaves
      the declaration unavailable
  data:
    schema_revision: bee.launch-policy@2
    allowed_overrides: [thread, workdir]
    required_cleanup: process_group
    required_exit_observation: independent
    start_ms: 15000
    stop_grace_ms: 5000
    drain_ms: 5000
    fixture: false
    executables: {}
    executable_env:
      muse: bee.driver.muse:executable
    environment: {}
    allow_host_home: true
    gateway_tools:
    - thread_read
    - thread_wait
    - thread_message
    - thread_sessions
    - thread_notify
    - session_directory
    - session_send
    - session_inbox
    - session_ack
    - session_reply
    - overlay
    - delivery
    - docs
    - components
    - install_request
    - uninstall_request
    - install_status
    gateway_hooks:
    - SessionStart
    - UserPromptSubmit
    - PreToolUse
    - PostToolUse
    - Stop
    hook_command_ref: bee.gateway:hook_executable
    profile_options:
      effort:
      - low
      - medium
      - high
    prepare_options: {}
