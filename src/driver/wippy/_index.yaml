version: '1.0'
namespace: bee.driver.wippy
entries:
- name: types
  kind: library.lua
  source: file://types.lua
  imports:
    driver_types: bee.drivers:types
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  imports:
    bounds: bee.drivers.values:bounds
    driver_types: bee.drivers:types
- name: hooks
  kind: registry.entry
  meta:
    type: bee.driver_hooks
    driver_id: wippy
  data:
    response: host
    input_bytes: 8192
    output_bytes: 3000
    points:
      session.start:
        results: [pass, add_context, change, deny]
        reason: The host owns model requests, tool execution and result insertion.
      prompt.submit:
        results: [pass, add_context, change, deny]
        reason: The host owns model requests, tool execution and result insertion.
      tool.before:
        results: [pass, add_context, change, deny]
        reason: The host owns model requests, tool execution and result insertion.
      tool.after:
        results: [pass, add_context, change, deny]
        reason: The host owns model requests, tool execution and result insertion.
