          - --
          - field: brief
        readiness: terminal:attached
        provider_home_private: false
        login: true
      first_turn:
        argv:
        - render: model
          context: first_turn
        - render: config_profile
          context: first_turn
        - render: effort
          context: first_turn
        - exec
        - --json
        - --skip-git-repo-check
        - render: sandbox
          context: first_turn
        - render: approval_policy
          context: first_turn
        - render: dangerously_bypass_approvals_and_sandbox
          context: first_turn
        - '-'
        stdin:
          field: brief
        stdin_eof: true
        readiness: protocol:thread.started
        provider_home_private: true
      resume:
        argv:
        - render: model
          context: resume
        - render: config_profile
          context: resume
        - render: effort
          context: resume
        - render: sandbox
          context: resume
        - render: approval_policy
          context: resume
        - render: dangerously_bypass_approvals_and_sandbox
          context: resume
        - exec
        - resume
        - field: resume_ref
        - --json
        - --skip-git-repo-check
        - '-'
        stdin:
          field: brief
        stdin_eof: true
        readiness: protocol:thread.started
        provider_home_private: true
    provider_home:
      variable: CODEX_HOME
      directory: .codex
      required_profile_file:
        field: config_profile
        variable: CODEX_HOME
        path_template: '{config_profile}.config.toml'
        default_directory: .codex
        window_only: true
      files:
      - source_path: .codex/auth.json
        path: .codex/auth.json
        kind: login
        optional: true
        write_back: true
      - source_path: .codex/config.toml
        path: .codex/.bee-user-config.toml
        kind: config
        optional: true
        write_back: false
        container_content: ''
