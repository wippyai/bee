version: '1.0'
namespace: tests.modules
entries:
- name: model_test
  kind: function.lua
  source: file://model_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [json]
  imports:
    test: wippy.test:test
    model: bee.hub.modules.app:model
- name: view_test
  kind: function.lua
  source: file://view_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [tty]
  imports:
    test: wippy.test:test
    model: bee.hub.modules.app:model
    view: bee.hub.modules.app:view
    appearance: bee.application:appearance
    contents: bee.hub.modules.app:contents
- name: app_test
  kind: function.lua
  source: file://app_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [process, channel, time, tty, uuid]
  imports:
    test: wippy.test:test
- name: contents_test
  kind: function.lua
  source: file://contents_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [base64]
  imports:
    test: wippy.test:test
    contents: bee.hub.modules.app:contents
