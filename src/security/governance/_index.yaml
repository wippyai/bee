version: '1.0'
namespace: bee
entries:
- name: governance_delivery_read_policy
  kind: security.policy
  policy:
    actions: [bee.governance.delivery.read]
    resources: '*'
    effect: allow
- name: governance_delivery_manage_policy
  kind: security.policy
  policy:
    actions: [bee.governance.delivery.manage]
    resources: '*'
    effect: allow
- name: governance_delivery_activate_policy
  kind: security.policy
  policy:
    actions: [bee.governance.delivery.activate]
    resources: '*'
    effect: allow
- name: governance_delivery_publish_policy
  kind: security.policy
  policy:
    actions: [bee.governance.delivery.publish]
    resources: '*'
    effect: allow
