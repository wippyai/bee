version: '1.0'
namespace: bee.tests.hive
entries:
- name: receiver_test
  kind: function.lua
  source: file://receiver_test.lua
  method: run
  modules: [registry, system, process, channel, time, uuid, funcs]
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    bounds: bee.values:bounds
    model: bee.capability:model
    grants: bee.gov.types:capability_grants
    materializer: bee.gov.binding:materializer
    application: bee.node:application
    admission: bee.gov.types:governed_application_admission
    protocol: bee.hive:protocol
- name: exposure_scope_test
  kind: function.lua
  source: file://exposure_scope_test.lua
  method: run
  modules: [security, funcs, registry]
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    bounds: bee.values:bounds
    grants: bee.gov.types:capability_grants
    capability: bee.capability:model
- name: exposure_probe
  kind: function.lua
  source: file://exposure_probe.lua
  method: probe
  modules: [security]
  meta: {type: test_support}
- name: probe_invocation
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.tests.hive:exposure_probe]
    effect: allow
- name: routing_test
  kind: function.lua
  source: file://routing_test.lua
  method: run
  modules: [system, channel, process]
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    protocol: bee.hive:protocol
- name: park_route
  kind: registry.entry
  meta:
    type: bee.hive.route
  data:
    prefix: parked
    name: bee.tests.parked
- name: parked_service
  kind: process.lua
  source: file://parked_service.lua
  method: main
  modules: [process, channel]
  meta: {type: test_support}
  imports:
    protocol: bee.hive:protocol
- name: call_test
  kind: function.lua
  source: file://call_test.lua
  method: run
  modules: [registry, system]
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    bounds: bee.values:bounds
    model: bee.capability:model
    grants: bee.gov.types:capability_grants
    outbound: bee.hive:outbound
    protocol: bee.hive:protocol
