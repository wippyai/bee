version: '1.0'
namespace: bee.hub.modules.app
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules:
  - tty
  - process
  - channel
  - uuid
  - funcs
  imports:
    frame: bee.app:frame
    client: bee.app:client
    appearance: bee.app:appearance
    model: bee.hub.modules.app:model
    view: bee.hub.modules.app:view
    contents: bee.hub.modules.app:contents
  meta:
    type: bee.app
    application:
      api_version: 1
      title: Modules
      icon: M
      lifetime: view
      revision: '1'
      instance_policy: singleton
      group: Tools
      role: modules
      restart_policy: never
- name: model
  kind: library.lua
  source: file://model.lua
  modules:
  - json
  - hash
  imports:
    bounds: bee.threads.records:bounds
    text: bee.app:text
    canonical: bee.sync.values:canonical
- name: view
  kind: library.lua
  source: file://view.lua
  modules:
  - tty
  - json
  imports:
    frame: bee.app:frame
    appearance: bee.app:appearance
    model: bee.hub.modules.app:model
    contents: bee.hub.modules.app:contents
- name: contents
  kind: library.lua
  source: file://contents.lua
  modules:
  - json
  - base64
  imports:
    text: bee.app:text
