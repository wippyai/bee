version: '1.0'
namespace: bee.threads.persist
entries:
- name: database
  kind: library.lua
  source: file://database.lua
  modules: [sql]
- name: reader
  kind: library.lua
  source: file://reader.lua
  modules: [sql]
- name: transaction
  kind: library.lua
  source: file://transaction.lua
  modules: [sql, time, uuid]
  imports:
    shared: bee.persist:transaction
- name: owner
  kind: library.lua
  source: file://owner.lua
  modules: [sql, uuid]
- name: journal
  kind: library.lua
  source: file://journal.lua
  modules:
  - sql
  imports:
    bounds: bee.drivers.values:bounds
- name: outbox
  kind: library.lua
  source: file://outbox.lua
  modules:
  - sql
  - uuid
  - json
  imports:
    bounds: bee.drivers.values:bounds
    clock: bee.drivers.values:clock
    transaction: bee.threads.persist:transaction
- name: work_store
  kind: library.lua
  source: file://work_store.lua
  modules:
  - ctx
  - sql
  imports:
    usage: bee.threads.service:usage
    journal: bee.threads.persist:journal
    budget_values: bee.drivers.records:budgets
    access: bee.threads.service:access
    transaction: bee.threads.persist:transaction
    observation: bee.drivers.records:observation
    bounds: bee.drivers.values:bounds
    inbox: bee.threads.service:inbox
    part_work_records: bee.threads.service:work_records
    part_session_store: bee.threads.persist:session_store
    part_work_queries: bee.threads.service:work_queries
- name: session_store
  kind: library.lua
  source: file://session_store.lua
  modules:
  - sql
  imports:
    journal: bee.threads.persist:journal
    access: bee.threads.service:access
    transaction: bee.threads.persist:transaction
    reader: bee.threads.persist:reader
    part_work_records: bee.threads.service:work_records
