version: '1.0'
namespace: bee.application
entries:
- name: definition
  kind: ns.definition
  module: application
  readme: file://README.md
  meta:
    title: Bee application SDK
    comment: Public application-side values, presentation helpers, and bounded thread facade messages; helpers grant no application, workspace, or thread authority
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: client
  kind: library.lua
  source: file://client.lua
  modules: [process, uuid]
  imports:
    arguments: bee.application:arguments
    interaction: bee.application:interaction
    thread_bounds: bee.threads.records:bounds
    thread_protocol: bee.application:thread_protocol
- name: arguments
  kind: library.lua
  source: file://arguments.lua
- name: text
  kind: library.lua
  source: file://text.lua
- name: caller
  kind: library.lua
  source: file://caller.lua
- name: folder_picker
  kind: library.lua
  source: file://folder_picker.lua
  imports:
    text: bee.application:text
    caller: bee.application:caller
    frame: bee.application:frame
- name: agent_protocol
  kind: library.lua
  source: file://agent_protocol.lua
  imports:
    bounds: bee.threads.records:bounds
- name: agents
  kind: library.lua
  source: file://agents.lua
  modules: [funcs, time]
  imports:
    caller: bee.application:caller
    agent_protocol: bee.application:agent_protocol
- name: host_leases
  kind: library.lua
  source: file://host_leases.lua
  modules: [process, channel, time, uuid]
- name: status_reader
  kind: library.lua
  source: file://status_reader.lua
  imports:
    text: bee.application:text
    caller: bee.application:caller
- name: status_surface
  kind: library.lua
  source: file://status_surface.lua
- name: interaction
  kind: library.lua
  source: file://interaction.lua
- name: appearance
  kind: library.lua
  source: file://appearance.lua
- name: frame
  kind: library.lua
  source: file://frame.lua
  modules: [tty]
  imports:
    appearance: bee.application:appearance
- name: names
  kind: library.lua
  source: file://names.lua
- name: thread_protocol
  kind: library.lua
  source: file://thread_protocol.lua
  imports:
    bounds: bee.threads.records:bounds
- name: viz
  kind: library.lua
  source: file://viz.lua
  modules: [tty]
  imports:
    appearance: bee.application:appearance
    frame: bee.application:frame
