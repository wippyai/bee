name: Hub credential and publication check
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version the publication dry run packs
        required: true
        default: 0.1.0-dev
        type: string
permissions: {}
jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Build pinned publication runtime
      uses: wippyai/builder@114eb0252a121dd89eca084af5db01833ffff50b
      with:
        mode: toolchain
        manifest: wippy.build.json
        output: .wippy/bin/bee-wippy
    - name: Dry-run every Bee module publication
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
      run: make hub-check BEE_VERSION="$REQUESTED_VERSION"
  check:
    environment: hub
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Verify authentication and Bee publish authorization
      shell: bash
      env:
        WIPPY_TOKEN: ${{ secrets.WIPPY_HUB_TOKEN }}
      run: |
        if ! [[ "$WIPPY_TOKEN" =~ ^wpy_[A-Za-z0-9_.-]+$ ]]; then
          echo '::error::Configure a valid WIPPY_HUB_TOKEN in the hub environment.'
          exit 1
        fi
        response="$RUNNER_TEMP/hub-credential-check.json"
        trap 'rm -f "$response"' EXIT
        request() {
          printf 'header = "Authorization: Bearer %s"\n' "$WIPPY_TOKEN" |
            curl --config - --silent --show-error --max-time 30 \
              --output "$response" --write-out '%{http_code}' "$@"
        }
        status=$(request https://hub.wippy.ai/api/v1/account/orgs)
        if [ "$status" != 200 ]; then
          echo "::error::Hub authentication returned HTTP $status."
          exit 1
        fi
        if ! jq -e 'any(.[]; .org.name == "bee" and (.role == "owner" or .role == "admin"))' "$response" >/dev/null 2>&1; then
          echo '::error::The token needs an owner or admin role in bee.'
          exit 1
        fi
        status=$(request \
          --header 'Content-Type: application/json' \
          --header 'Connect-Protocol-Version: 1' \
          --data '{"module":{"name":{"org":"bee","name":"bee"}}}' \
          https://hub.wippy.ai/wippy.api.hub.publish.v1.PublishService/InitiatePublish)
        if [ "$status" != 400 ] || ! jq -e '.code == "invalid_argument" and .message == "version or label is required"' "$response" >/dev/null 2>&1; then
          echo "::error::Hub publish probe did not reach version validation (HTTP $status)."
          exit 1
        fi
        echo 'Hub authentication and Bee publish authorization checks passed.'
