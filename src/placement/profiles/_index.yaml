version: '1.0'
namespace: bee.placement.profiles
entries:
- name: paths
  kind: library.lua
  source: file://paths.lua
  modules:
  - exec
  imports:
    quote: bee.driver.binding:quote
- name: profiles
  kind: library.lua
  source: file://profiles.lua
  modules:
  - hash
  - registry
  - funcs
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
- name: native
  kind: registry.entry
  meta:
    type: bee.placement_profile
    title: Local
    isolation: {kind: native, credentials: [admitted launch credentials]}
    option_ceilings:
      claude:
        permission_mode: [prompt, edit, automatic, deny-unapproved, read, bypass]
        permission_bypass: [bypass]
        allow_permission_bypass: [bypass]
      codex:
        sandbox: [read, write-admitted, write-anywhere, network]
        approval_policy: [request-approval, no-approvals]
        dangerously_bypass_approvals_and_sandbox: [bypass]
      agy:
        dangerously_skip_permissions: [bypass]
      grok:
        permission_mode: [bypass]
      muse:
        approval_mode: [no-approvals]
        yolo: [bypass]
      opencode:
        auto: [bypass]
  data:
    schema_revision: bee.placement-profile@1
    placement_binding: bee.placement.native.binding:binding
- name: context
  kind: function.lua
  source: file://context.lua
  method: handle
  modules: [registry]
  imports:
    profiles: bee.placement.profiles:profiles
    bounds: bee.values:bounds
  security:
    policies: [bee.placement.profiles:context_policy]
- name: context_policy
  kind: security.policy
  policy:
    actions: [registry.snapshot, registry.get]
    resources: '*'
    effect: allow
