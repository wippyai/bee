- name: address_value
  kind: library.lua
  source: file://address_value.lua
- name: mcp
  kind: library.lua
  source: file://mcp.lua
  imports:
    session_tools: bee.gateway.catalog:session_tools
    bounds: bee.values:bounds
    message: bee.threads.records:message
    arguments: bee.app:arguments
    workspace_protocol: bee.gov.types:workspace_protocol
    delivery_protocol: bee.gov.types:delivery_protocol
    node_tests: bee.node:tests
    docs_protocol: bee.docs:protocol
    json_schema: bee.gateway.catalog:json_schema
    gateway_protocol: bee.gateway:protocol
    canonical: bee.values:canonical
    record_bounds: bee.threads.records:bounds
    app_requests: bee.node:app_tool_request
    requirements: bee.hub.package:requirements
- name: gateway_endpoint
  kind: registry.entry
  meta:
    type: bee.gateway_endpoint
    comment: Native HTTP selects and retains an available loopback port; gateway address resolves it from supervisor state
  data:
    address: 127.0.0.1:0
- name: gateway_listener
  kind: http.service
  meta:
    title: Gateway · listener
  addr: 127.0.0.1:0
  lifecycle:
    auto_start: true
- name: gateway_router
  kind: http.router
  meta:
    server: bee.gateway.api:gateway_listener
  prefix: /
- name: gateway_ready
  kind: http.endpoint
  meta:
    router: bee.gateway.api:gateway_router
  method: GET
  path: /ready
  func: bee.gateway.api:ready_http
- name: gateway_mcp
  kind: http.endpoint
  meta:
    router: bee.gateway.api:gateway_router
  method: POST
  path: /mcp/:action
  func: bee.gateway.api:mcp_http
- name: external_configuration
  kind: library.lua
  source: file://external_configuration.lua
  modules: [json]
  imports:
    bounds: bee.values:bounds
    address: bee.gateway.api:address_value
