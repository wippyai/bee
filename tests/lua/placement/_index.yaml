version: '1.0'
namespace: bee.placement.native
entries:
- name: project_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/placement-project
  auto_init: true
- name: readonly_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/placement-readonly
  auto_init: true
- name: sentinel_storage
  kind: env.storage.memory
  meta: {type: test_support}
  lifecycle:
    auto_start: true
- name: sentinel_key
  kind: env.variable
  meta: {type: test_support}
  storage: bee.placement.native:sentinel_storage
  variable: BEE_PLACEMENT_SENTINEL_KEY
  default: placement-sentinel-4e5f6a
  readonly: true
- name: runner_observation
  kind: library.lua
  source: file://runner_observation.lua
  meta: {type: test_support}
- name: materialization_runner
  kind: library.lua
  source: file://materialization_runner.lua
  meta: {type: test_support}
  modules: [process, channel, security, time]
  imports:
    store: bee.placement.native.persist:store
    materialization: bee.placement.native.service:materialization
    observe: bee.placement.native:runner_observation
    types: bee.placement:types
    bounds: bee.protocol:bounds
- name: materialization_runner_process
  kind: process.lua
  source: file://materialization_runner.lua
  method: main
  meta: {type: test_support}
  modules: [process, channel, security, time]
  imports:
    store: bee.placement.native.persist:store
    materialization: bee.placement.native.service:materialization
    observe: bee.placement.native:runner_observation
    types: bee.placement:types
    bounds: bee.protocol:bounds
- name: apply_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [registry.apply, process.registry.lookup, process.terminate]
    resources: '*'
    effect: allow
- name: client_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.placement.native.binding:prepare, bee.placement.native.binding:start, bee.placement.native.binding:status, bee.placement.native.binding:stop,
      bee.placement.native.binding:reconcile, bee.placement.native.binding:cleanup, bee.placement.native.binding:evidence, bee.placement.native.binding:attach,
      bee.resources.binding:associate, bee.resources.binding:grant, bee.resources.binding:revoke, bee.credentials.binding:define, bee.credentials.binding:issue_projection, bee.credentials.binding:revoke,
      bee.placement.native:fixture_stop_materialization]
    effect: allow
- name: fixture_stop_materialization_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call, fs.get, fs.write]
    resources: [bee.placement.native.binding:stop, bee.credentials:codex_login_fixture]
    effect: allow
- name: fixture_stop_materialization
  kind: function.lua
  source: file://fixture_stop_materialization.lua
  method: handle
  meta: {type: test_support}
  modules: [fs, funcs]
  security:
    policies: [bee.placement.native:fixture_stop_materialization_policy]
  imports: {bounds: bee.protocol:bounds}

- name: request_test
  kind: function.lua
  source: file://request_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    principals: bee.test.principals:bound
    bounds: bee.protocol:bounds
    test: wippy.test:test
    request: bee.placement:request
    transitions: bee.placement:transitions
    protocol: bee.placement.native:protocol
    resource_resolution: bee.placement.native.service:resource_resolution
    types: bee.placement:types
- name: writable_roots_adapter_test
  kind: function.lua
  source: file://writable_roots_adapter_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    bounds: bee.protocol:bounds
    test: wippy.test:test
    writable_roots_adapter: bee.placement.native.service:writable_roots_adapter
    driver_types: bee.driver:types
- name: preparer_owner
  kind: process.lua
  source: file://preparer_owner.lua
  method: main
  meta: {type: test_support}
  modules: [process]
- name: preparer_temp_root
  kind: env.variable
  meta: {type: test_support}
  storage: bee.placement.native:environment
  variable: TMPDIR
  readonly: true
- name: workdir_preparer_test
  kind: function.lua
  source: file://workdir_preparer_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [time, exec, json, funcs, sql, registry, env, process, channel]
  security:
    policies: [bee.placement.native:apply_test_policy, bee.placement.native.security:placement_store_policy, bee.placement.native.security:placement_exec_policy, bee.placement.native.security:placement_service_policy, bee.placement.native.security:placement_runner_policy, bee.git_worktree:worktree_policy]
  imports:
    test: wippy.test:test
    workdir_preparers: bee.placement.native.service:workdir_preparers
    service: bee.placement.native.service:service
    store: bee.placement.native.persist:store
    migrations: bee.placement.native.migrations:migrations
    request_codec: bee.placement:request
    quote: bee.driver.kit:quote
    types: bee.placement:types
- name: codex_test_provider
  kind: registry.entry
  meta:
    type: bee.codex_provider
    test_support: true
  data:
    schema_revision: bee.codex-provider@1
    name: bee
    base_url: https://gateway.example.net/v1
    model: gpt-5
- name: fixture_agent_provider
  kind: registry.entry
  meta:
    type: bee.fixture_agent_provider
    test_support: true
  data:
    schema_revision: bee.fixture-agent-provider@1
    model: terra
- name: fixture_agent_policy
  kind: registry.entry
  meta:
    type: bee.launch_policy
    test_support: true
  data:
    schema_revision: bee.launch-policy@2
    required_cleanup: direct_process
    required_exit_observation: eof_gated
    start_ms: 10000
    stop_grace_ms: 500
    drain_ms: 1000
    runner_drain_ms: 500
    fixture: true
    executables: {}
    environment: {}
    provider_ref: bee.placement.native:fixture_agent_provider
- name: fixture_agent_binding
  kind: contract.binding
  meta:
    type: harness.driver
    driver_id: fixture-agent
    test_support: true
  contracts:
  - contract: bee.driver:driver
    methods:
      prepare: bee.placement.native:fixture_agent_prepare
      dispatch: bee.placement.native:fixture_agent_dispatch
      normalize: bee.placement.native:fixture_agent_normalize
      configure: bee.placement.native:fixture_agent_configure
- name: fixture_agent_prepare
  kind: function.lua
  source: file://fixture_agent.lua
  method: prepare
  modules: [hash]
  imports:
    bounds: bee.protocol:bounds
    configure_protocol: bee.driver:configuration
- name: fixture_agent_dispatch
  kind: function.lua
  source: file://fixture_agent.lua
  method: dispatch
  modules: [hash]
  imports:
    bounds: bee.protocol:bounds
    configure_protocol: bee.driver:configuration
- name: fixture_agent_normalize
  kind: function.lua
  source: file://fixture_agent.lua
  method: normalize
  modules: [hash]
  imports:
    bounds: bee.protocol:bounds
    configure_protocol: bee.driver:configuration
- name: fixture_agent_configure
  kind: function.lua
  source: file://fixture_agent.lua
  method: configure
  modules: [hash]
  imports:
    bounds: bee.protocol:bounds
    configure_protocol: bee.driver:configuration
- name: test_launch_policy
  kind: registry.entry
  meta:
    type: bee.launch_policy
    test_support: true
    comment: The host launch policy the placement suite's requests name; it selects the test provider
  data:
    schema_revision: bee.launch-policy@2
    required_cleanup: direct_process
    required_exit_observation: eof_gated
    start_ms: 10000
    stop_grace_ms: 500
    drain_ms: 2000
    runner_drain_ms: 1000
    fixture: true
    executables: {}
    environment: {}
    allow_host_home: true
    provider_ref: bee.placement.native:codex_test_provider
- name: test_launch_policy_without_provider
  kind: registry.entry
  meta:
    type: bee.launch_policy
    test_support: true
    comment: The same policy selecting no provider, for the unauthorized-provider refusal
  data:
    schema_revision: bee.launch-policy@2
    required_cleanup: direct_process
    required_exit_observation: eof_gated
    start_ms: 10000
    stop_grace_ms: 500
    drain_ms: 2000
    runner_drain_ms: 1000
    fixture: true
    executables: {}
    environment: {}
- name: test_non_native_launch_policy
  kind: registry.entry
  meta: {type: bee.launch_policy, test_support: true}
  data:
    schema_revision: bee.launch-policy@2
    placement_binding: bee.placement.fixture:binding
    required_cleanup: direct_process
    required_exit_observation: eof_gated
    fixture: true
    executables: {}
    environment: {}
- name: native_test
  kind: function.lua
  source: file://native_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "120s"}
  modules: [funcs, security, process, channel, time, registry, exec, fs, hash, json, sql]
  security:
    policies: [bee.placement.native:apply_test_policy, bee.placement.native.security:placement_store_policy, bee.placement.native.security:placement_exec_policy, bee.placement.native.security:placement_service_policy, bee.resources.security:resource_store_policy, bee.credentials.security:credential_store_policy, bee.resources.security:resource_resolve_policy, bee.credentials.security:credential_materialize_policy]
  imports:
    placement_decode: bee.placement:decode
    bounds: bee.protocol:bounds
    principals: bee.test.principals:bound
    configuration: bee.driver.codex:configuration
    grok_configuration: bee.driver.grok:configuration
    grok_launch: bee.driver.grok:launch
    claude_launch: bee.driver.claude:launch
    codex_launch: bee.driver.codex:launch
    agy_launch: bee.driver.agy:launch
    muse_launch: bee.driver.muse:launch
    opencode_launch: bee.driver.opencode:launch
    configuration_protocol: bee.driver:configuration
    test: wippy.test:test
    runner_fixture: bee.placement.native:materialization_runner
    service: bee.placement.native.service:service
    identity: bee.placement.native.service:identity
    store: bee.placement.native.persist:store
    materialization: bee.placement.native.service:materialization
    resources: bee.placement.native:resources
    request_codec: bee.placement:request
    protocol: bee.placement.native:protocol
    executable_stream: bee.placement.native.service:executable_stream
    resource_resolution: bee.placement.native.service:resource_resolution
    homes: bee.placement.native.service:homes
    output_buffer: bee.placement.native.service:output_buffer
    quote: bee.driver.kit:quote
    types: bee.placement:types
- name: provider_configuration_test
  kind: function.lua
  source: file://provider_configuration_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "30s"}
  modules: [funcs, security, registry, json, hash, time, exec]
  imports:
    bounds: bee.protocol:bounds
    principals: bee.test.principals:bound
    test: wippy.test:test
    service: bee.placement.native.service:service
    store: bee.placement.native.persist:store
    homes: bee.placement.native.service:homes
    quote: bee.driver.kit:quote
    configuration_protocol: bee.driver:configuration
- name: grok_login_fixture
  kind: fs.directory
  meta: {type: test_support}
  directory: .wippy/grok-session-login
  auto_init: true
- name: grok_session_test
  kind: function.lua
  source: file://grok_session_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "30s"}
  modules: [funcs, security, registry, process, sql, json, time, exec]
  security:
    policies: [bee.placement.native:apply_test_policy, bee.placement.native.security:placement_store_policy, bee.placement.native.security:placement_exec_policy, bee.placement.native.security:placement_service_policy, bee.credentials.security:credential_materialize_policy]
  imports:
    bounds: bee.protocol:bounds
    test: wippy.test:test
    principals: bee.test.principals:bound
    quote: bee.driver.kit:quote
    grok_launch: bee.driver.grok:launch
    grok_configuration: bee.driver.grok:configuration
    placement_service: bee.placement.native.service:service
    runner_fixture: bee.placement.native:materialization_runner
    homes: bee.placement.native.service:homes
    store: bee.placement.native.persist:store
    request_codec: bee.placement:request
    types: bee.placement:types
- name: fixture_builder_read_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [env.get]
    resources: [bee.placement.native:sentinel_key]
    effect: allow
- name: builder_test_caller_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.context, funcs.call, funcs.actor, security.scope.create, funcs.security]
    resources: '*'
    effect: allow
- name: fixture_instruction_builder
  kind: library.lua
  source: file://fixture_instruction_builder.lua
  meta: {type: test_support}
  modules: [security, ctx, env, exec]
  imports:
    bounds: bee.protocol:bounds
    store: bee.placement.native.persist:store
- name: fixture_builder_build
  kind: function.lua
  source: file://fixture_instruction_builder.lua
  method: build
  meta: {type: test_support}
  modules: [security, ctx, env, exec]
  imports:
    bounds: bee.protocol:bounds
    store: bee.placement.native.persist:store
  security:
    policies: [bee.placement.native:fixture_builder_read_policy]
- name: instruction_builder_policy
  kind: registry.entry
  meta:
    type: bee.launch_policy
    test_support: true
  data:
    schema_revision: bee.launch-policy@2
    required_cleanup: direct_process
    required_exit_observation: eof_gated
    start_ms: 10000
    stop_grace_ms: 500
    drain_ms: 1000
    runner_drain_ms: 500
    fixture: true
    executables: {}
    environment: {}
    provider_ref: bee.placement.native:fixture_agent_provider
    instructions: "Base static instructions."
    instruction_builder:
      func_id: bee.placement.native:fixture_builder_build
      args:
        tag: integration
- name: instruction_builder_test
  kind: function.lua
  source: file://instruction_builder_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [funcs, security, registry, json, hash, time, exec, ctx, env]
  security:
    policies: [bee.placement.native:apply_test_policy, bee.placement.native.security:placement_store_policy, bee.placement.native.security:placement_exec_policy, bee.resources.security:resource_store_policy, bee.credentials.security:credential_store_policy, bee.resources.security:resource_resolve_policy, bee.credentials.security:credential_materialize_policy, bee.placement.native:builder_test_caller_policy]
  imports:
    bounds: bee.protocol:bounds
    principals: bee.test.principals:bound
    test: wippy.test:test
    service: bee.placement.native.service:service
    store: bee.placement.native.persist:store
    homes: bee.placement.native.service:homes
    quote: bee.driver.kit:quote
    configuration_protocol: bee.driver:configuration
    canonical: bee.threads.records:canonical
    fixture_builder: bee.placement.native:fixture_instruction_builder
- name: preparer_fixture_config
  kind: registry.entry
  data: {}
- name: preparer_fixture_binding
  kind: contract.binding
  meta: {type: bee.placement.workdir_preparer}
  contracts:
  - contract: bee.placement:workdir_preparer
    methods:
      plan: bee.placement.native:preparer_fixture_plan
      setup: bee.placement.native:preparer_fixture_setup
      cleanup: bee.placement.native:preparer_fixture_cleanup
- name: preparer_fixture_plan
  kind: function.lua
  source: file://preparer_fixture.lua
  method: plan
  modules: [registry]
- name: preparer_fixture_setup
  kind: function.lua
  source: file://preparer_fixture.lua
  method: setup
  modules: [registry]
- name: preparer_fixture_cleanup
  kind: function.lua
  source: file://preparer_fixture.lua
  method: cleanup
  modules: [registry]

- name: provider_projection_test
  kind: function.lua
  source: file://provider_projection_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    projection: bee.placement.native.service:provider_projection
    formats: bee.credentials:formats
    types: bee.driver:types
