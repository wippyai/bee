version: '1.0'
namespace: bee.env
entries:
- name: workspace_environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: workspace_db_path
  kind: env.variable
  storage: bee.env:workspace_environment
  variable: BEE_WORKSPACE_DB
  default: .wippy/workspace.db
  readonly: true
- name: workspace_db
  kind: db.sql.sqlite
  file: ${env:bee.env:workspace_db_path}
  lifecycle:
    auto_start: true
- name: client_db
  kind: db.sql.sqlite
  file: ${env:bee.env:workspace_db_path}.client
  lifecycle:
    auto_start: true
- name: workspace_root
  kind: fs.directory
  directory: .
  base: project
  auto_init: false
- name: app_databases
  kind: fs.directory
  meta:
    comment: Host-provisioned directory holding isolated application databases; it lies under Bee state, outside every approved readable tree
  directory: .wippy/app-db
  base: project
  auto_init: true
  mode: '0700'
- name: machine_home
  kind: env.variable
  storage: bee.env:workspace_environment
  variable: HOME
  readonly: true
- name: machine_login_source
  kind: fs.directory
  directory: ${env:bee.env:machine_home}
  base: project
  mode: '0500'
  auto_init: false
- name: gov_publication_profiles
  kind: registry.entry
  meta:
    type: bee.gov.publication_profiles
    comment: Host-selected source workspaces and overlay owners available for immutable publication; workspace_applications publishes the overlays a workspace's own agents author under the app.<overlay_id> naming rule
  data:
    profiles: []
    workspace_applications: true
- name: gov_activation_profiles
  kind: registry.entry
  meta:
    type: bee.gov.activation_profiles
    comment: Host-selected destination mappings and capability ceilings; workspace_applications is the ceiling for applications a workspace's agents author for it, and with hive for the same applications received from another node, with permission approval at first install or widening; remote artifacts cannot edit this entry
  data:
    profiles: []
    workspace_applications:
      approval_policy: workspace-application-delivery
      kinds: [process.lua, library.lua, ns.requirement]
      modules: [tty, process, channel, json, time, uuid, base64, hash, funcs, fs, sql]
      policies: [bee.security:ordinary_app_subsystem_boundary]
      thread_access: none
      hive: true
    packages:
      approval_policy: workspace-application-delivery
      kinds: [process.lua, library.lua, ns.requirement, security.policy, registry.entry, contract.binding, env.variable]
      modules: [tty, process, channel, json, time, uuid, base64, hash, funcs, registry, system]
      policies: [bee.security:ordinary_app_subsystem_boundary]
      thread_access: none
      applications:
      - component: bee.hive.manager
        definition_id: bee.hive.manager:app
        capabilities: [hive.view, hive.remote_view]
        policies: [bee.security:ordinary_app_subsystem_boundary, bee.hive.manager:client_policy, bee.hive.manager:viewer_policy]
        thread_access: none
      - component: bee.threads.timeline
        definition_id: bee.threads.timeline:app
        capabilities: [threads.read]
        policies: [bee.security:ordinary_app_subsystem_boundary, bee.threads.timeline:client_policy]
        thread_access: none
      - component: bee.workspace.manager
        definition_id: bee.workspace.manager:app
        capabilities: [workspace.catalog.read, workspace.catalog.manage, workspace.host.lease]
        policies: [bee.security:ordinary_app_subsystem_boundary, bee.workspace.manager:client_policy,
          bee.security.storage:workspace_catalog_read_policy, bee.security.storage:workspace_catalog_manage_policy,
          bee.security.threads:thread_workspace_list_policy, bee.security.desktop:workspace_host_lease_policy]
        thread_access: none
      - component: bee.host.processes
        definition_id: bee.host.processes:app
        capabilities: [desktop.application_stop]
        policies: [bee.security:ordinary_app_subsystem_boundary, bee.security.desktop:processes_policy]
        application_stop: true
        thread_access: none
      - component: bee.hub.modules
        definition_id: bee.hub.modules:app
        capabilities: [hub.manage]
        policies: [bee.security:ordinary_app_subsystem_boundary, bee.hub.modules:client_policy,
          bee.hub.modules:hub_policy, bee.hub.modules:publication_policy]
        thread_access: none
      - component: bee.gov.overlays
        definition_id: bee.gov.overlays:app
        capabilities: [gov.delivery.manage, gov.delivery.activate]
        policies: [bee.security:ordinary_app_subsystem_boundary, bee.gov.overlays:client_policy,
          bee.security.gov:governance_delivery_read_policy, bee.security.gov:governance_delivery_manage_policy,
          bee.security.gov:governance_delivery_activate_policy]
        thread_access: none
