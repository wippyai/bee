    budget_values: bee.threads.records:budgets
    profile_values: bee.harness.profiles:protocol
    session_protocol: bee.threads.sessions.types:protocol
    record_values: bee.threads.records:values
    remote: bee.threads.sessions.binding:remote
  security:
    policies: *id001
  meta:
    application_ref: bee.harness.app:app
    hive: policy
    hive_service: sessions
    hive_operation:
      name: join
      revision: '1'
      effect: mutation
      input:
        type: object
        additionalProperties: false
        required:
        - works
        - operation_key
        properties:
          works:
            type: array
            minItems: 1
            maxItems: 64
            uniqueItems: true
            items:
              allOf:
              - type: string
                minLength: 1
                maxLength: 256
              - pattern: ^bw:[^:]+:[^:]+:[^:]+$
          policy:
            enum:
            - all_success
            - all_settled
            - first_success
            - quorum
            default: all_success
          quorum:
            type: integer
            minimum: 1
            maximum: 64
          timeout_ms:
            type: integer
            minimum: 0
            maximum: 60000
            default: 30000
          operation_key:
            type: string
            minLength: 1
            maxLength: 128
        if:
          required:
          - policy
          properties:
            policy:
              const: quorum
        then:
          required:
          - quorum
        else:
          not:
            required:
            - quorum
      output:
        oneOf:
        - type: object
          additionalProperties: false
          required:
          - ok
          - value
          properties:
            ok:
              const: true
            value:
              type: object
        - type: object
          additionalProperties: false
          required:
          - ok
          - error
          properties:
            ok:
              const: false
            error:
              type: object
              additionalProperties: false
              required:
              - code
              - message
              - retry
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 128
                message:
                  type: string
                  maxLength: 16384
                retry:
                  enum:
                  - never
                  - same_key
                  - refresh
                  - reconcile
                operation_key:
                  type: string
                  minLength: 1
                  maxLength: 128
                operation:
                  allOf:
                  - type: string
                    minLength: 1
                    maxLength: 256
                  - pattern: ^bo:[^:]+:[^:]+:[^:]+$
                current_revision:
                  type: integer
                  minimum: 1
                evidence:
                  type: object
                  additionalProperties: false
                  required:
                  - summary
                  - artifacts
                  properties:
                    summary:
                      type: string
                      maxLength: 16384
                    artifacts:
                      type: array
                      maxItems: 64
                      items:
                        type: string
                        minLength: 1
                        maxLength: 256
                retry_after_ms:
