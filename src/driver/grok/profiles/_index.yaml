version: '1.0'
namespace: bee.driver.grok.profiles
entries:
- name: default_window
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned Grok window declaration; the host separately selects its policy, activation, executable and permissions
  data:
    schema_revision: bee.launch-definition@1
    launch_id: grok-window
    title: Grok CLI
    binding_ref: bee.drivers.grok.binding:binding
    profile_id: window
    private_credentials:
    - grok_login
    - grok_api_key
    docker_credentials:
    - grok_login
    - grok_api_key
    policy_ref: bee.driver.grok.security:launch_policy_grok_window
    default_mode: window
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: new
    session_resource: session
    credentials:
    - grok_login
    - grok_api_key
    presentation:
      start_menu: true
      fullscreen: true
      reuse: never
- name: research_batch
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned bounded Grok batch route for a host-selected coordinator and caller-owned shared thread; the CLI offers no provable workdir confinement,
      so the host records it as unconfined
  data:
    schema_revision: bee.launch-definition@1
    launch_id: grok-research-batch
    title: Grok researcher
    binding_ref: bee.drivers.grok.binding:binding
    profile_id: batch
    policy_ref: bee.driver.grok.security:launch_policy_grok_batch
    default_mode: batch
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: caller
    session_resource: session
    credentials:
    - grok_login
    - grok_api_key
    presentation:
      start_menu: false
      fullscreen: false
      reuse: never
    unconfined: true
