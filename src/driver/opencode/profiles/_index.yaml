version: '1.0'
namespace: bee.driver.opencode.profiles
entries:
- name: profiles
  kind: registry.entry
  meta:
    type: harness.profile
    driver_ref: bee.driver.opencode.binding:binding
  data:
    driver:
      schema_revision: bee.driver@1
      kind: harness
      title: OpenCode
      implementation_version: 1.18.32
      default_profile: window
      profiles:
      - id: batch
        mode: batch
        protocol: stream-json
        protocol_revision: opencode-run-json-1
        answer_path:
          strategy: accumulate
          adapter_ref: bee.driver.opencode.descriptor:cli
        resume:
          strategy: per-process
          portable: false
        inbound:
        - next_turn
        isolation_env:
          variables:
          - HOME
          private_home: true
        exit_codes_trustworthy: false
        input_ready:
          strategy: none
        interrupt:
          methods:
          - signal_group
        mcp:
          client_transports:
          - streamable_http
          initialize_timeout_ms: 30000
        permission_exchange:
          mode: none
      - id: window
        mode: window
        protocol: pty
        protocol_revision: native-window-1
        observer: local_http
        hooks:
          transports: [http]
          events:
          - SessionStart
          - UserPromptSubmit
          - PreToolUse
          - PostToolUse
          - PostToolUseFailure
          - PermissionRequest
          - Stop
          - StopFailure
          - SessionEnd
          adapter_ref: bee.driver.opencode.descriptor:cli
        answer_path:
          strategy: none
        resume:
          strategy: none
          portable: false
        isolation_env:
          variables:
          - HOME
          private_home: false
        exit_codes_trustworthy: false
        input_ready:
          strategy: none
        permission_exchange:
          mode: adapter
          adapter_ref: bee.driver.permission:permission_request_hook
          adapter_digest: a9b3fec616bd9b96c628352d4f1e8d5078f0a708444c9507a148f68d17c72867
- name: default_window
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned OpenCode window declaration; the host separately selects its policy, activation, executable and permissions
  data:
    schema_revision: bee.launch-definition@1
    launch_id: opencode-window
    title: OpenCode
    binding_ref: bee.driver.opencode.binding:binding
    profile_id: window
    private_credentials:
    - opencode_login
    - opencode_api_key
    docker_credentials:
    - opencode_login
    - opencode_api_key
    policy_ref: bee.driver.opencode.security:launch_policy_opencode_window
    default_mode: window
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: new
    session_resource: session
    credentials: []
    presentation:
      start_menu: true
      fullscreen: true
      reuse: never
- name: research_batch
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned bounded OpenCode batch route for a host-selected coordinator and caller-owned shared thread; the CLI offers no sandbox or permission
      flag Bee can select, so the host records it as unconfined
  data:
    schema_revision: bee.launch-definition@1
    launch_id: opencode-research-batch
    title: OpenCode researcher
    binding_ref: bee.driver.opencode.binding:binding
    profile_id: batch
    policy_ref: bee.driver.opencode.security:launch_policy_opencode_batch
    default_mode: batch
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: caller
    session_resource: session
    credentials:
    - opencode_login
    - opencode_api_key
    presentation:
      start_menu: false
      fullscreen: false
      reuse: never
    unconfined: true
