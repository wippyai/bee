version: '1.0'
namespace: bee.drivers.tests.drivers
entries:
- name: drivers_test
  kind: function.lua
  source: file://drivers_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [fs, funcs, security]
  imports:
    test: wippy.test:test
    drivers: bee.drivers:drivers
    placements: bee.drivers.tests.support:placements
    placement: bee.drivers.descriptor:placement
    configuration_types: bee.drivers:configuration_types
    driver_types: bee.drivers:types
- name: launch_probe
  kind: function.lua
  meta: {type: test_support}
  source: file://launch_probe.lua
  method: run
  imports:
    drivers: bee.drivers:drivers
    placements: bee.drivers.tests.support:placements
- name: host_grant
  kind: security.policy
  meta:
    type: test_support
    comment: The host's own entries beside bee.drivers.security:host_access - its activation entry, and here the probe it calls
  policy:
    actions: [registry.get, funcs.call]
    resources: [bee.drivers.tests.host:activation, bee.drivers.tests.drivers:launch_probe]
    effect: allow
