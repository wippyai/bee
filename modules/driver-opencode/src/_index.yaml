version: '1.0'
namespace: bee.driver.opencode
entries:
- name: definition
  kind: ns.definition
  module: driver-opencode
  readme: file://README.md
  meta:
    title: Bee OpenCode driver
    comment: Optional harness binding; host activation and launch policies authorize its use
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: host_environment
  kind: ns.requirement
  meta:
    comment: Read-only host environment that supplies the selected OpenCode executable
  default: bee.harness.host:environment
  targets:
  - entry: bee.driver.opencode.env:executable
    path: .storage
- name: window_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned OpenCode window route
  default: bee.driver.opencode.security:launch_policy_opencode_window
  targets:
  - entry: bee.driver.opencode.profiles:default_window
    path: .data.policy_ref
- name: batch_policy
  kind: ns.requirement
  meta:
    comment: Host policy for the component-owned OpenCode batch route
  default: bee.driver.opencode.security:launch_policy_opencode_batch
  targets:
  - entry: bee.driver.opencode.profiles:research_batch
    path: .data.policy_ref
- name: dependency_values
  kind: ns.dependency
  component: bee/values
  version: '*'
