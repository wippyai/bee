version: '1.0'
namespace: bee.apps.library
entries:
- name: hub
  kind: library.lua
  source: file://hub.lua
  modules:
  - json
  - hash
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    text: bee.ui:text
- name: governed
  kind: library.lua
  source: file://governed.lua
  imports:
    bounds: bee.values:bounds
    preflight: bee.gov.binding:preflight
- name: contents
  kind: library.lua
  source: file://contents.lua
  modules:
  - json
  - base64
  imports:
    text: bee.ui:text
- name: model
  kind: library.lua
  source: file://model.lua
  imports:
    governed: bee.apps.library:governed
    hub: bee.apps.library:hub
- name: hub_view
  kind: library.lua
  source: file://hub_view.lua
  modules:
  - tty
  - json
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    model: bee.apps.library:hub
    contents: bee.apps.library:contents
- name: view
  kind: library.lua
  source: file://view.lua
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    model: bee.apps.library:model
    governed: bee.apps.library:governed
    hub: bee.apps.library:hub
    hub_view: bee.apps.library:hub_view
    contents: bee.apps.library:contents
    text: bee.ui:text
- name: destination_client
  kind: security.policy
  meta:
    comment: The Library calls only the destination-owned governance facade, which authorizes each delivery operation before entering its private scope
  policy:
    actions:
    - funcs.call
    resources:
    - bee.gov.binding:destination_call
    effect: allow
- name: delivery_operations
  kind: security.policy
  meta:
    comment: The person operating the Library reads, receives, reviews, chooses and installs versions delivered to any workspace of this node; the approval decision stays with the approval owner
  policy:
    actions:
    - bee.gov.delivery.read
    - bee.gov.delivery.manage
    - bee.gov.delivery.activate
    resources: '*'
    effect: allow
- name: hub_client
  kind: security.policy
  meta:
    comment: The Library calls only the public Hub facade, which authorizes each package operation before entering its private execution scope
  policy:
    actions:
    - funcs.call
    resources:
    - bee.hub.binding:call
    effect: allow
- name: hub_operations
  kind: security.policy
  meta:
    comment: The person operating the Library reads, plans and applies Hub package operations; no registry or Hub credential scope is granted to the app
  policy:
    actions:
    - bee.hub.read
    - bee.hub.manage
    resources: '*'
    effect: allow
- name: self_update
  kind: security.policy
  meta:
    comment: Only the person-operated Library app may update the Bee deployment root; agents receive no self-update authority
  policy:
    actions:
    - bee.hub.self_update
    resources:
    - bee/bee
    effect: allow
- name: app
  kind: process.lua
  meta:
    type: bee.app
    application:
      api_version: 1
      title: Library
      lifetime: view
      revision: '1'
      instance_policy: singleton
      menus: [bee.shell:system_menu]
  source: file://app.lua
  method: main
  modules:
  - tty
  - process
  - channel
  - uuid
  - funcs
  - time
  imports:
    frame: bee.ui:frame
    appearance: bee.ui:appearance
    model: bee.apps.library:model
    governed: bee.apps.library:governed
    hub: bee.apps.library:hub
    view: bee.apps.library:view
    contents: bee.apps.library:contents
  security:
    policies:
    - bee.apps.library:destination_client
    - bee.apps.library:delivery_operations
    - bee.apps.library:hub_client
    - bee.apps.library:hub_operations
    - bee.apps.library:self_update
