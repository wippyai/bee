version: '1.0'
namespace: bee.hive.desktop
entries:
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  imports:
    arguments: bee.application:arguments
    bounds: bee.hive:bounds
    contract: bee.protocol:application
- name: owner
  kind: library.lua
  source: file://owner.lua
  modules: [process, security, channel, time, uuid]
  imports:
    protocol: bee.hive.desktop:protocol
    types: bee.hive:types
    retained: bee.launch:retained_protocol
- name: host_policy
  kind: security.policy.expr
  meta:
    comment: Only the native host selects desktop admission; this policy is not attached to ordinary applications
  policy:
    actions: [bee.desktop.host, process.spawn, process.spawn.monitored, process.host, process.context, process.security, process.terminate, security.policy.get, security.scope.create]
    resources: '*'
    expression: '(action == "bee.desktop.host" && resource == "bee.desktop") || ((action == "process.spawn" || action == "process.spawn.monitored") && resource == "bee.launch:retained") || (action == "process.host" && resource == "bee:workers") || (action == "security.policy.get" && (resource == "bee:host_policy" || resource == "bee:desktop_policy" || resource == "bee:retained_supervisor_spawn_policy")) || action == "process.context" || action == "process.security" || action == "process.terminate" || action == "security.scope.create"'
    effect: allow
