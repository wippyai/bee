version: '1.0'
namespace: bee.hive.security
entries:
- name: workspaces_policy
  kind: security.policy
  meta:
    comment: The workspaces operation reads the catalog through its owner operations
  policy:
    actions: [funcs.call]
    resources: [bee.workspace.catalog:list, bee.workspace.catalog:search]
    effect: allow
- name: holdings_policy
  kind: security.policy
  meta:
    comment: The holdings operation reads the node host manager through its owner request
  policy:
    actions: [process.send, process.registry.lookup]
    resources: '*'
    effect: allow
