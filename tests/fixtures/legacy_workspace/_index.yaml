version: '1.0'
namespace: bee.workspace
entries:
- name: main
  kind: process.lua
  source: file://main.lua
  method: main
  modules:
  - security
  - tty
  - process
  - channel
  - time
  - uuid
  imports:
    command: bee.apps:command
    contract: bee.protocol:application
    arguments: bee.application:arguments
    interaction: bee.application:interaction
    model: bee.desktop:model
    decode: bee.protocol:decode
    decode_input: bee.protocol:input
    appearance: bee.application:appearance
    physical: bee.terminal:display
    persistence: bee.workspace:persistence
    recovery: bee.workspace:recovery
- name: launch
  kind: process.lua
  source: file://main.lua
  method: launch
  modules:
  - security
  - tty
  - process
  - channel
  - time
  - uuid
  imports:
    command: bee.apps:command
    contract: bee.protocol:application
    arguments: bee.application:arguments
    interaction: bee.application:interaction
    model: bee.desktop:model
    decode: bee.protocol:decode
    decode_input: bee.protocol:input
    appearance: bee.application:appearance
    physical: bee.terminal:display
    persistence: bee.workspace:persistence
    recovery: bee.workspace:recovery
- name: core_spawn_policy
  kind: security.policy
  meta: {test_support: true}
  policy:
    actions:
    - process.spawn
    - process.spawn.monitored
    resources:
    - bee.host:main
    - bee.session:main
    - bee.apps:broker
    - bee.terminal:main
    effect: allow
