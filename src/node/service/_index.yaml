version: '1.0'
namespace: bee.node.service
entries:
- name: owner
  kind: process.lua
  source: file://owner.lua
  method: main
  modules: [process, channel, system, registry, tty, uuid, logger, events, env]
  imports:
    protocol: bee.hive:protocol
    descriptor: bee.app:descriptor
    application: bee.node:application
    broker: bee.node:broker
    command: bee.node:command
    arguments: bee.app:arguments
    workspaces: bee.node:workspaces
    settings: bee.node:settings
    appearance: bee.ui:appearance
    client: bee.node:client
- name: owner_service
  meta:
    title: Node · owner
  kind: process.service
  process: bee.node.service:owner
  host: bee:workers
  lifecycle:
    auto_start: true
    requires: [wippy.bootloader:bootloader.service, bee.gov.service:recovery_service]
    security:
      actor: {id: bee.node}
      policies: [bee.node.security:owner, bee.node.security:owner_store, bee.node.security:owner_host, bee.node.security:owner_names, bee.node.security:owner_system, bee.node.security:owner_registry, bee.node.security:owner_attention, bee.node.security:owner_role, bee.hive.security:messaging]
    restart:
      max_attempts: 10
- name: tests
  kind: process.lua
  source: file://tests.lua
  method: main
  modules: [process, channel, funcs, time, logger]
  imports:
    application: bee.node:application
    tests: bee.node:tests
    test_runs: bee.node:test_runs
- name: tests_service
  meta:
    title: Node · tests
  kind: process.service
  process: bee.node.service:tests
  host: bee:workers
  lifecycle:
    auto_start: true
    requires: [wippy.bootloader:bootloader.service, bee.gov.service:recovery_service]
    security:
      actor: {id: bee.node.tests}
      policies: [bee.node.security:tests_runner, bee.node.security:tests_store, bee.node.security:tests_name, bee.node.security:identity]
    restart:
      max_attempts: 10
