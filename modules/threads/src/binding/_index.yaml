- name: capabilities
  kind: function.lua
  source: file://capabilities_method.lua
  method: handle
  imports:
    capabilities: bee.threads:capabilities_report
  meta:
    comment: Implementation facts for any caller; the Hive metadata is inert when no Hive supervisor runs
    hive: open
    hive_operation:
      revision: '1'
      title: Threads capabilities
      input:
        type: object
        properties: {}
        additionalProperties: false
      output:
        type: object
        additionalProperties: false
        properties:
          revision:
            type: string
          record_schema:
            type: string
          recap_schema:
            type: string
          record_kinds:
            type: array
            items:
              type: string
            maxItems: 64
          record_sources:
            type: array
            items:
              type: string
            maxItems: 64
          outcomes:
            type: array
            items:
              type: string
            maxItems: 64
          migrations:
            type: array
            maxItems: 64
            items:
              type: object
              additionalProperties: false
              properties:
                id:
                  type: integer
                name:
                  type: string
                rebuild:
                  type: boolean
          contracts:
            type: array
            maxItems: 64
            items:
              type: object
              additionalProperties: false
              properties:
                contract:
                  type: string
                methods:
                  type: array
                  items:
                    type: string
                  maxItems: 64
          limits:
            type: object
            additionalProperties: false
            properties:
              max_record_bytes:
                type: integer
              max_page_records:
                type: integer
              max_thread_records:
                type: integer
              max_thread_members:
                type: integer
              max_thread_actions:
                type: integer
              max_thread_attempts:
                type: integer
              max_thread_turns:
                type: integer
              max_thread_obligations:
                type: integer
              max_thread_subscriptions:
                type: integer
              max_array_items:
                type: integer
              max_json_depth:
                type: integer
              max_title_bytes:
                type: integer
              claim_ttl_seconds:
                type: integer
              max_wait_ms:
                type: integer
              wait_budget_margin_ms:
                type: integer
              max_waiters_per_thread:
                type: integer
              max_waiters:
                type: integer
              recap_summary_lines:
                type: integer
              recap_line_bytes:
                type: integer
          delivery:
            type: object
            additionalProperties: false
            properties:
              channels:
                type: array
                items:
                  type: string
                maxItems: 64
              self_service_only:
                type: boolean
              delegated_replies:
                type: boolean
              cross_thread_replies:
                type: boolean
              cross_node_send:
                type: boolean
              telemetry_subscribe:
                type: boolean
              outstanding_pages_per_subscription:
                type: integer
              transport_budget:
                type: object
                additionalProperties: false
                properties:
                  ceiling_ms:
                    type: integer
                  caller_may_shorten:
                    type: boolean
                  caller_may_extend:
                    type: boolean
