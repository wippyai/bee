version: '1.0'
namespace: bee.drivers.tests.opencode
entries:
- name: launch_test
  kind: function.lua
  source: file://launch_test.lua
  method: run
  meta:
    type: test
    suite: bee
  imports:
    test: wippy.test:test
    launch: bee.drivers.tests.support.driver:opencode_launch
    prepare: bee.drivers.opencode.binding:prepare
    dispatch: bee.drivers.opencode.binding:dispatch
    quote: bee.drivers.binding:quote
- name: protocol_test
  kind: function.lua
  source: file://protocol_test.lua
  method: run
  meta:
    type: test
    suite: bee
  modules:
  - fs
  imports:
    bounds: bee.drivers.values:bounds
    test: wippy.test:test
    protocol: bee.drivers.tests.support.driver:opencode_protocol
    normalize: bee.drivers.opencode.binding:normalize
    stream_json: bee.drivers.transport:stream_json
    observation: bee.drivers.records:observation
- name: delivery_test
  kind: function.lua
  source: file://delivery_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    delivery: bee.drivers.opencode.observer:delivery
- name: observer_test
  kind: function.lua
  source: file://observer_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [fs, json]
  imports:
    test: wippy.test:test
    bounds: bee.drivers.values:bounds
    mapper: bee.drivers.opencode.observer:events
- name: observer_declaration_test
  kind: function.lua
  source: file://observer_declaration_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [security]
  security:
    policies: [bee.drivers.tests.opencode:policy_inspection]
  imports:
    test: wippy.test:test
    observer_protocol: bee.drivers:window_observer
- name: subscriber_test
  kind: function.lua
  source: file://subscriber_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [exec, process, channel, time, http_client, json]
  imports:
    test: wippy.test:test
    bounds: bee.drivers.values:bounds
    quote: bee.drivers.binding:quote
  security:
    policies: [bee.drivers.tests.opencode:fixture_server_policy, bee.drivers.tests.opencode:http_probe_policy]
- name: fixture_server
  kind: exec.native
  meta:
    type: test_support
    comment: Runs the recorded OpenCode HTTP server the subscriber suite attaches to
  default_env: {PATH: '/usr/bin:/bin'}
- name: fixture_server_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    effect: allow
    actions: [exec.get, exec.run]
    resources: [bee.drivers.tests.opencode:fixture_server]
- name: policy_inspection
  kind: security.policy
  policy:
    effect: allow
    actions: [security.policy.get]
    resources: ['bee.drivers.opencode.observer:http_policy']
- name: http_probe_policy
  kind: security.policy.expr
  policy:
    effect: allow
    actions: [http_client.request, http_client.private_ip]
    resources: ['*']
    expression: (action == "http_client.private_ip" && resource == "127.0.0.1") || (action == "http_client.request" && resource matches "^http://127[.]0[.]0[.]1:[0-9]+/(state|captured)$")
