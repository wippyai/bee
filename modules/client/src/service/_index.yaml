version: '1.0'
namespace: bee.client.service
entries:
- name: main
  kind: process.lua
  source: file://main.lua
  method: main
  modules:
  - process
  - channel
  - tty
  - ctx
  - security
  - uuid
  - hash
  - time
  - logger
  imports: &id001
    node_appearance: bee.client.binding:node_appearance
    workspace_pages: bee.client.binding:workspace_pages
    retained_protocol: bee.launch:retained_protocol
    clipboard: bee.client.types:clipboard
    launcher: bee.launch:bootstrap
    command: bee.apps:command
    arguments: bee.app:arguments
    store: bee.client.persist:store
    state: bee.client.types:state
    decode: bee.protocol:decode
    input_decode: bee.protocol:input
    contract: bee.protocol:application
    inventory: bee.host:inventory
    status_bindings: bee.desktop.types:bindings
    status_surface: bee.app:status_surface
    host_protocol: bee.host:protocol
    transfer: bee.host:transfer
    transfer_ui: bee.protocol:display_transfer
    assignment_layout: bee.client.types:assignments
    inbox: bee.client.types:inbox
    lifecycle: bee.client.types:lifecycle
    handoff: bee.client.types:handoff
    interaction: bee.app:interaction
    physical: bee.terminal:display
    appearance: bee.app:appearance
    projection: bee.desktop.types:projection
- name: local
  kind: process.lua
  source: file://main.lua
  method: local_entry
  modules:
  - process
  - channel
  - tty
  - ctx
  - security
  - uuid
  - hash
  - time
  - logger
  imports: *id001
- name: local_command
  kind: process.lua
  source: file://main.lua
  method: local_command
  modules:
  - process
  - channel
  - tty
  - ctx
  - security
  - uuid
  - hash
  - time
  - logger
  imports: *id001
- name: local_application
  kind: process.lua
  source: file://main.lua
  method: local_application
  modules:
  - process
  - channel
  - tty
  - ctx
  - security
  - uuid
  - hash
  - time
  - logger
  imports: *id001
- name: desktop
  kind: process.lua
  source: file://main.lua
  method: desktop
  modules:
  - process
  - channel
  - tty
  - ctx
  - security
  - uuid
  - hash
  - time
  - logger
  imports: *id001
  meta:
    command:
      name: bee
      host: ''
      short: Open the Bee workspace desktop
      security:
        actor: {}
        policies: []
- name: application
  kind: process.lua
  source: file://main.lua
