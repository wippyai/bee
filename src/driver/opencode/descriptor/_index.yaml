version: '1.0'
namespace: bee.driver.opencode.descriptor
entries:
- name: cli
  kind: registry.entry
  meta:
    type: bee.driver.cli_descriptor
    comment: OpenCode CLI command, JSON event codec, login evidence and version probe
  data:
    schema_revision: bee.driver.cli-descriptor@3
    provider: opencode
    executable: opencode
    version_probe:
      argv:
      - --version
      pattern: ([0-9]+[.][0-9]+[.][0-9]+)
    login_evidence:
      command: opencode auth login
      any_of:
      - kind: file_exists
        paths:
        - .local/share/opencode/auth.json
        variable: XDG_DATA_HOME
        directory: .local/share
      - kind: file_exists
        paths:
        - .config/opencode/opencode.json
        - .config/opencode/opencode.jsonc
        variable: XDG_CONFIG_HOME
        directory: .config
      - kind: env_present
        names:
        - ANTHROPIC_API_KEY
        - OPENAI_API_KEY
        - GOOGLE_GENERATIVE_AI_API_KEY
        - XAI_API_KEY
        - OPENCODE_API_KEY
        - OPENCODE_CONFIG_CONTENT
    platform:
      os:
      - linux
      - darwin
      arch:
      - x86_64
      - amd64
      - arm64
      - aarch64
    codec: opencode-json-events
    json_paths:
      resume_id:
      - sessionID
      result_text:
      - part
      - text
      errors:
      - error
      - data
      - message
      usage:
      - part
      - tokens
    configure: opencode
    capabilities:
      permission_answers:
        window:
          transport: provider
          reason: Bee runs opencode run --format json with stdin closed. It does not run the HTTP server permission API. The window retains provider prompts; no Bee
            hook transport is selected.
        first_turn:
          transport: provider
          reason: Bee runs opencode run --format json with stdin closed. It does not run the HTTP server permission API. The window retains provider prompts; no Bee
            hook transport is selected.
        resume:
          transport: provider
          reason: Bee runs opencode run --format json with stdin closed. It does not run the HTTP server permission API. The window retains provider prompts; no Bee
            hook transport is selected.
    options:
      profiles:
      - window
      - batch
      unknown_prefix: ''
      fields:
        resume_ref:
          type: id
          forbid_option: true
          invalid: resume_ref must not be a command-line option
        gateway_tools:
          type: ids
          pattern: ^[a-z_]+$
          default: []
          transform: sorted
          invalid: gateway_tools names a tool that is not a plain identifier
        gateway_hooks:
          type: ids
          default: []
        system_prompt_append:
          path: provider.system_prompt_append
          value_schema:
            type: string
            maxLength: 4096
          label: System prompt append
          description: Additional instructions in the session private home
          section: advanced
          order: 100
          contexts:
          - window
          - first_turn
          - resume
          support:
            config_schema_ref: bee.driver.opencode.descriptor:cli
          render:
          - kind: config
            contexts:
            - window
            - first_turn
            - resume
            file: .bee/system-prompt-append.txt
            format: text
            path: []
            merge: append
            value:
              field: provider.system_prompt_append
          - kind: config
            contexts:
            - window
            - first_turn
            - resume
            file: .config/opencode/opencode.json
            format: json
            path:
            - instructions
            merge: append
            value:
              field: provider.system_prompt_files
        model:
          path: provider.model
          value_schema:
            type: string
            maxLength: 128
            format: model
          label: Model
          description: OpenCode model
          section: basic
          order: 1
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --model
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - if: model
              then:
              - --model
              - field: model
        variant:
          path: provider.options.variant
          value_schema:
            type: string
            maxLength: 128
            format: id
          label: Variant
          description: OpenCode variant
          section: advanced
          order: 2
          contexts:
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - run
              - --help
              flag: --variant
          render:
          - kind: argv
            contexts:
            - first_turn
            - resume
            tokens:
            - if: variant
              then:
              - --variant
              - field: variant
        providers:
          path: provider.options.providers
          value_schema:
            type: object
            maxProperties: 16
            additionalProperties:
              type: object
              additionalProperties: false
              properties:
                npm:
                  type: string
                  enum:
                  - '@ai-sdk/openai-compatible'
                name:
                  type: string
                  maxLength: 128
                options:
                  type: object
                  additionalProperties: false
                  properties:
                    baseURL:
                      type: string
                      maxLength: 512
                    apiKey:
                      type: string
                      enum:
                      - '{env:OPENAI_API_KEY}'
                    includeUsage:
                      type: boolean
                  required:
                  - baseURL
                  - apiKey
                models:
                  type: object
                  maxProperties: 16
                  additionalProperties:
                    type: object
                    additionalProperties: false
                    properties:
                      name:
                        type: string
                        maxLength: 128
                      tool_call:
                        type: boolean
                      limit:
                        type: object
                        additionalProperties: false
                        properties:
                          context:
                            type: integer
                            minimum: 1
                          output:
                            type: integer
                            minimum: 1
                      options:
                        type: object
                        additionalProperties: false
                        properties:
                          temperature:
                            type: number
                            minimum: 0
                            maximum: 2
                          seed:
                            type: integer
                          maxTokens:
                            type: integer
                            minimum: 1
              required:
              - npm
              - options
              - models
          label: Custom providers
          description: Custom providers
          section: advanced
          order: 10
          contexts: &id001
          - window
          - first_turn
          - resume
          support:
            config_schema_ref: bee.driver.opencode.descriptor:cli
          render:
          - kind: config
            contexts: *id001
            file: .config/opencode/opencode.json
            format: json
            path:
            - provider
            merge: set
            value:
              field: provider.options.providers
        enabled_providers:
          path: provider.options.enabled_providers
          value_schema:
            type: array
            maxItems: 16
            items:
              type: string
              maxLength: 128
          label: Enabled providers
          description: Enabled providers
          section: advanced
          order: 11
          contexts: *id001
          support:
            config_schema_ref: bee.driver.opencode.descriptor:cli
          render:
          - kind: config
            contexts: *id001
            file: .config/opencode/opencode.json
            format: json
            path:
            - enabled_providers
            merge: set
            value:
              field: provider.options.enabled_providers
      rules:
      - kind: forbid_nonempty
        field: gateway_hooks
        message: opencode declares no hook transport for gateway hooks
    flags: {}
    argv_templates:
      window:
        argv:
        - render: model
          context: window
        - if: resume_ref
          then:
          - --session
          - field: resume_ref
        - if: brief
          then:
          - --prompt
          - field: brief
        readiness: terminal:attached
        provider_home_private: false
        login: true
      first_turn:
        stdin: ''
        stdin_eof: true
        argv:
        - render: variant
          context: first_turn
        - render: model
          context: first_turn
        - run
        - --format
        - json
        - --
        - field: brief
        readiness: protocol:thread.started
        provider_home_private: true
      resume:
        stdin: ''
        stdin_eof: true
        argv:
        - render: variant
          context: resume
        - render: model
          context: resume
        - run
        - --format
        - json
        - --session
        - field: resume_ref
        - --
        - field: brief
        readiness: protocol:thread.started
        provider_home_private: true
    provider_home:
      extra_variables:
      - variable: XDG_CONFIG_HOME
        directory: .config
      - variable: XDG_DATA_HOME
        directory: .local/share
      files:
      - source_path: .local/share/opencode/auth.json
        path: .local/share/opencode/auth.json
        kind: login
        optional: true
        write_back: true
      - source_path: .config/opencode/opencode.json
        path: .config/opencode/.bee-global-opencode.json
        kind: config
        optional: true
        write_back: false
        container_content: '{}'
      - source_path: .config/opencode/towers.key
        path: .config/opencode/towers.key
        kind: config
        optional: true
        write_back: false
- name: command
  kind: registry.entry
  meta:
    type: bee.app_command
    comment: CLI command to launch OpenCode in the agent window
  data:
    name: opencode
    definition_id: bee.harness.app:app
    arguments:
    - bee.driver.opencode.profiles:default_window
    fullscreen: true
