version: '1.0'
namespace: bee.node.service
entries:
- name: owner
  kind: process.lua
  source: file://owner.lua
  method: main
  modules:
  - channel
  - env
  - events
  - logger
  - process
  - system
  imports:
    protocol: bee.hive:protocol
    broker: bee.node:broker
    command: bee.node:command
    arguments: bee.app:arguments
    workspaces: bee.node.persist:workspaces
    client: bee.node:client
    worker: bee.process:worker
    part_catalog: bee.node.service:catalog
    part_handover: bee.node.service.owner:handover
    node_state: bee.node.service.owner:state
    apps: bee.node.service.owner:apps
    desktops: bee.node.service.owner:desktops
    attention_events: bee.node.service.owner:attention
    seam: bee.process:seam
- name: owner_service
  meta:
    title: "Node \xB7 owner"
  kind: process.service
  process: bee.node.service:owner
  host: bee:workers
  lifecycle:
    auto_start: true
    requires:
    - bee.gov.service:recovery_service
    - bee.hive.service:supervisor_service
    security:
      actor:
        id: bee.node
      policies:
      - bee.node.security:owner
      - bee.node.security:owner_store
      - bee.node.security:owner_host
      - bee.node.security:owner_names
      - bee.node.security:owner_system
      - bee.node.security:owner_registry
      - bee.node.security:owner_attention
      - bee.security.approvals:confirmation_client
      - bee.security.approvals:confirmation_authority
      - bee.node.security:owner_role
      - bee.node.security:owner_app_alias
      - bee.node.security:owner_launch
      - bee.hive.security:messaging
    restart:
      max_attempts: 10
- name: tests
  kind: process.lua
  source: file://tests.lua
  method: main
  modules:
  - process
  - channel
  - funcs
  - time
  - logger
  imports:
    application: bee.node:application
    tests: bee.node:tests
    test_runs: bee.node.persist:test_runs
    demand: bee.process:demand
    receiver: bee.hive:receiver
    bounds: bee.drivers.values:bounds
    seam: bee.process:seam
- name: tests_service
  meta:
    title: "Node \xB7 tests"
    type: bee.process.demand
    demand:
      name: bee.node.tests
      probe: bee.node.persist:test_backlog
      tables:
      - bee_node_test_runs
  kind: process.service
  process: bee.node.service:tests
  host: bee:workers
  lifecycle:
    auto_start: false
    requires:
    - bee.hive.service:supervisor_service
    security:
      actor:
        id: bee.node.tests
      policies:
      - bee.node.security:tests_runner
      - bee.node.security:tests_store
      - bee.node.security:tests_name
      - bee.node.security:identity
      - bee.process:client_policy
      - bee.process:backlog_policy
    restart:
      max_attempts: 10
- name: catalog
  kind: library.lua
  source: file://catalog.lua
  modules:
  - logger
  - registry
  imports:
    application: bee.node:application
    descriptor: bee.app:descriptor
    settings: bee.node.persist:settings
    appearance: bee.ui:appearance
    seam: bee.process:seam
- name: launch
  kind: function.lua
  source: file://launch.lua
  method: handle
  modules: [process, security]
  imports:
    principal: bee.node:principal
    application: bee.node:application
    bounds: bee.drivers.values:bounds
