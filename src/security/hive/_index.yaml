version: '1.0'
namespace: bee.security.hive
entries:
- name: exposure_default
  kind: security.policy.expr
  groups: [hive_exposure_scope]
  meta:
    comment: The exposure scope grants no operation without a destination-installed exposure policy
  policy:
    expression: 'false'
    actions: '*'
    resources: '*'
    effect: allow
- name: session_exposure
  kind: security.policy.expr
  groups:
  - hive_exposure_scope
  policy:
    actions:
    - hive.expose.policy
    resources: '*'
    effect: allow
    expression: actor.id matches "^bee[.]hive[.]member[.]" && resource in actor.meta.session_operations
