version: '1.0'
namespace: bee.gateway.container
entries:
- name: environment
  kind: env.storage.os
  lifecycle: {auto_start: true}
- name: callback
  kind: env.variable
  storage: bee.gateway.container:environment
  variable: BEE_CONTAINER_CALLBACK
  readonly: true
- name: policy
  kind: security.policy
  policy:
    actions: [funcs.call, http_client.request, http_client.private_ip]
    resources: [bee.gateway:address, bee.gateway.binding:admit, bee.gateway.binding:authorize_materialization,
      bee.gateway.binding:materialize, bee.gateway.binding:ready, bee.gateway.binding:revoke, bee.threads.service:create,
      BEE_CONTAINER_CALLBACK_URL, 127.0.0.1]
    effect: allow
- name: probe
  kind: process.lua
  source: file://probe.lua
  method: main
  modules: [funcs, json, http_client, time, env, logger, security]
  security:
    policies: [bee.gateway.container:policy, bee.security.gateway:gateway_admit_policy,
      bee.security.gateway:gateway_materialize_policy, bee.security.gateway:gateway_supervision_policy, bee.gateway.security:readiness_policy,
      bee.security.threads:thread_create_policy, bee.gateway.container:callback_policy]
  meta:
    command:
      name: gateway-container-probe
      security:
        actor: {id: bee.test.container}
- name: callback_policy
  kind: security.policy
  policy:
    actions: [env.get]
    resources: [bee.gateway.container:callback]
    effect: allow
