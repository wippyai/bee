version: '1.0'
namespace: bee.agent_app_probe
entries:
- name: inputs
  kind: registry.entry
  meta:
    type: bee.agent_app_inputs
    comment: The round the harness drives; it writes the identities and the review findings before each boot
  data:
    round: '1'
    source_workspace: ''
    launch_workspace: ''
    destination_workspace: ''
    version: ''
    snapshot_digest: ''
    artifact_digest: ''
    findings: ''
- name: material
  kind: registry.entry
  meta:
    type: bee.agent_app_material
    comment: Fixed authoring documents the host hands the agent; the harness writes them before the first boot
  data:
    contract: ''
    client: ''
    example: ''
    view: ''
- name: docs
  kind: function.lua
  source: file://docs.lua
  method: handle
  modules: [registry]
- name: docs_policy
  kind: security.policy
  policy:
    actions: [funcs.call, registry.get]
    resources: [bee.agent_app_probe:docs, bee.agent_app_probe:material]
    effect: allow
- name: operator_policy
  kind: security.policy
  meta:
    comment: What this host operator does beside launching, which the composed production launcher policies already answer for
  policy:
    actions:
    - funcs.call
    - security.policy.get
    - registry.get
    - registry.apply
    - registry.snapshot
    - registry.update.registry.entry
    - registry.preview
    - registry.overlay.get
    - db.get
    - system.read
    - process.monitor
    - process.unmonitor
    - bee.approvals.decide
    - bee.governance.workspace.read
    - bee.governance.workspace.write
    resources: '*'
    effect: allow
- name: author
  kind: process.lua
  source: file://author.lua
  method: main
  modules: [funcs, registry, process, channel, time, json, sql, io, base64]
  imports:
    bounds: bee.threads.records:bounds
    artifact: bee.governance:artifact
    publication_service: bee.governance:publication_service
  security:
    policies:
    - bee.agent_app_probe:operator_policy
    - bee:carrier_policy
    - bee:carrier_environment_policy
    - bee:thread_create_policy
    - bee:harness_setup_policy
    - bee:placement_store_policy
    - bee:placement_exec_policy
    - bee:placement_runner_policy
    - bee:resource_grant_policy
    - bee:resource_resolve_policy
    - bee:credential_issue_policy
    - bee:credential_materialize_policy
    - bee:gateway_materialize_policy
    - bee:gateway_supervision_policy
  meta:
    command:
      name: agent-app-author
      security:
        actor: {id: bee.agent_app.operator}
        policies:
        - bee.agent_app_probe:operator_policy
        - bee:carrier_policy
        - bee:carrier_environment_policy
        - bee:thread_create_policy
        - bee:harness_setup_policy
        - bee:placement_store_policy
        - bee:placement_exec_policy
        - bee:placement_runner_policy
        - bee:resource_grant_policy
        - bee:resource_resolve_policy
        - bee:credential_issue_policy
        - bee:credential_materialize_policy
        - bee:gateway_materialize_policy
        - bee:gateway_supervision_policy
- name: stage_policy
  kind: security.policy
  policy:
    actions:
    - funcs.call
    - security.policy.get
    - registry.get
    - registry.apply
    - registry.update.registry.entry
    - registry.preview
    - registry.overlay.get
    - db.get
    - system.read
    - bee.governance.workspace.read
    - bee.governance.delivery.read
    - bee.governance.delivery.manage
    - bee.governance.delivery.publish
    resources: '*'
    effect: allow
- name: stage
  kind: process.lua
  source: file://stage.lua
  method: main
  modules: [funcs, registry, system, json, logger]
  imports:
    bounds: bee.threads.records:bounds
    preflight: bee.governance:preflight
  security:
    policies: [bee.agent_app_probe:stage_policy]
  meta:
    command:
      name: agent-app-stage
      security:
        actor: {id: bee.agent_app.operator}
        policies: [bee.agent_app_probe:stage_policy]
