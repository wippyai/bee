version: '1.0'
namespace: bee.drivers.opencode.env
entries:
- name: executable
  kind: env.variable
  variable: opencode
  default: ''
  readonly: true
- name: api_key
  kind: env.variable
  variable: OPENCODE_PERSON_KEY
  default: ''
  meta:
    type: bee.credential_source
    credential_name: opencode_api_key
    credential:
      provider: opencode
      format_ref: bee.drivers.opencode.credentials:credential_format
      workspace_id: '*'
      audience: '*'
      projection_kinds: [environment]
