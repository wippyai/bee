version: '1.0'
namespace: bee.drivers.opencode.profiles
entries:
- name: profiles
  kind: registry.entry
  meta:
    type: harness.profile
    driver_ref: bee.drivers.opencode.binding:binding
  data:
    driver:
      schema_revision: bee.driver@1
      kind: harness
      title: OpenCode
      implementation_version: 1.18.32
      default_profile: window
      profiles:
      - id: batch
        mode: batch
        protocol: stream-json
        protocol_revision: opencode-run-json-1
        answer_path:
          strategy: accumulate
          adapter_ref: bee.drivers.opencode.descriptor:cli
        resume:
          strategy: per-process
          portable: false
        inbound:
        - next_turn
        isolation_env:
          variables:
          - HOME
          private_home: true
        exit_codes_trustworthy: false
        input_ready:
          strategy: none
        interrupt:
          methods:
          - signal_group
        mcp:
          client_transports:
          - streamable_http
          initialize_timeout_ms: 30000
        permission_exchange:
          mode: none
      - id: window
        mode: window
        protocol: pty
        protocol_revision: native-window-1
        observer: local_http
        hooks:
          transports: [http]
          events:
          - SessionStart
          - UserPromptSubmit
          - PreToolUse
          - PostToolUse
          - PostToolUseFailure
          - PermissionRequest
          - Stop
          - StopFailure
          - SessionEnd
          adapter_ref: bee.drivers.opencode.descriptor:cli
        answer_path:
          strategy: none
        resume:
          strategy: none
          portable: false
        isolation_env:
          variables:
          - HOME
          private_home: false
        exit_codes_trustworthy: false
        input_ready:
          strategy: none
        permission_exchange:
          mode: adapter
          adapter_ref: bee.drivers.permission:permission_request_hook
          adapter_digest: a9b3fec616bd9b96c628352d4f1e8d5078f0a708444c9507a148f68d17c72867
