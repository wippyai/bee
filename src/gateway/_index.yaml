version: '1.0'
namespace: bee.gateway
entries:
- name: definition
  kind: ns.definition
  module: gateway
  readme: file://README.md
  meta:
    title: Bee gateway
    comment: The authenticated thread port a managed child reaches over loopback HTTP; bindings, opaque tokens stored as hashes, listener epoch and drain; the listener itself belongs to a managed host composition
- name: target_db
  kind: ns.requirement
  meta:
    comment: SQL resource for bindings and the listener record
  default: bee.gateway:db
  targets:
  - entry: bee.gateway:database_ref
    path: .resource_ref
- name: target_listener
  kind: ns.requirement
  meta:
    comment: The host-selected native HTTP service that serves the gateway endpoints
  default: bee:gateway_listener
  targets:
  - entry: bee.gateway:listener_ref
    path: .resource_ref
- name: database_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked SQL resource; target_db fills resource_ref
- name: listener_ref
  kind: registry.entry
  meta:
    type: bee.resource_ref
    comment: The linked listener service; target_listener fills resource_ref
- name: environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: db_path
  kind: env.variable
  storage: bee.gateway:environment
  variable: BEE_GATEWAY_DB
  default: .wippy/gateway.db
  readonly: true
- name: db
  kind: db.sql.sqlite
  file: ${env:bee.gateway:db_path}
  lifecycle:
    auto_start: true
- name: migrations
  kind: library.lua
  source: file://migrations.lua
- name: catalog
  kind: library.lua
  source: file://catalog.lua
  modules: [json]
  imports: {bounds: bee.threads.records:bounds}
- name: access
  kind: library.lua
  source: file://access.lua
  modules: [funcs, security, hash]
  imports: {bounds: bee.threads.records:bounds, canonical: bee.threads.records:canonical, surface: bee.gateway:surface}
- name: surface_store
  kind: library.lua
  source: file://surface_store.lua
  modules: [sql, json]
  imports: {bounds: bee.threads.records:bounds}
- name: surface
  kind: library.lua
  source: file://surface.lua
  imports: {bounds: bee.threads.records:bounds, catalog: bee.gateway:catalog, context: bee.gateway:context}
- name: mcp
  kind: library.lua
  source: file://mcp.lua
  imports:
    bounds: bee.threads.records:bounds
    message: bee.threads.records:message
    workspace_protocol: bee.governance:workspace_protocol
    delivery_protocol: bee.governance:delivery_protocol
    docs_protocol: bee:docs_protocol
- name: context
  kind: library.lua
  source: file://context.lua
  modules: [json]
  imports:
    bounds: bee.threads.records:bounds
- name: address
  kind: function.lua
  source: file://address_method.lua
  method: handle
  modules: [registry, system]
  imports:
    configuration: bee.gateway:configuration
  security:
    policies: [bee:gateway_address_policy]
- name: configuration
  kind: library.lua
  source: file://configuration.lua
  modules: [registry, funcs, env]
  imports:
    address_value: bee.gateway:address_value
- name: address_value
  kind: library.lua
  source: file://address_value.lua
- name: hook_executable
  kind: env.variable
  storage: bee.harness.host:environment
  variable: self
  default: ''
  readonly: true
- name: hooks
  kind: library.lua
  source: file://hooks.lua
  modules: [hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
- name: gateway
  kind: library.lua
  source: file://gateway.lua
  modules: [sql, hash, time, uuid, json, security, system, crypto, base64, http_client, registry]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    persist: bee.persist:database
    migrations: bee.gateway:migrations
    configuration: bee.gateway:configuration
    hooks: bee.gateway:hooks
    mcp: bee.gateway:mcp
    surface: bee.gateway:surface
    surface_store: bee.gateway:surface_store
    access: bee.gateway:access
- name: open
  kind: function.lua
  source: file://open_method.lua
  method: handle
  imports:
    gateway: bee.gateway:gateway
  security:
    policies: [bee:gateway_address_call_policy, bee:gateway_store_policy]
- name: admit
