version: '1.0'
namespace: app.hello.app
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules: [tty, process, channel]
  imports:
    client: bee.app:client
    appearance: bee.ui:appearance
    frame: bee.ui:frame
    greeting: app.hello.model:greeting
  meta:
    type: bee.app
    application:
      api_version: 1
      lifetime: view
      revision: '1'
      title: Hello Bee
      instance_policy: multiple
      restart_policy: never
      menus: [bee.shell:apps_menu]
