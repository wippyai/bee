version: '1.0'
namespace: bee.hive
entries:
- name: address
  kind: library.lua
  source: file://address.lua
  modules: [registry, system]
  imports:
    bounds: bee.values:bounds
    application: bee.node:application
    profiles: bee.gov.types:activation_profile_decoder
    grants: bee.gov.types:capability_grants
    access: bee.gov.binding:capability_access
    model: bee.capability:model
- name: receiver
  kind: library.lua
  source: file://receiver.lua
  modules: [registry, security, funcs]
  imports:
    bounds: bee.values:bounds
    operations: bee.hive:operations
    address: bee.hive:address
    application: bee.node:application
    access: bee.gov.binding:capability_access
    schemas: bee.gateway.catalog:json_schema
    canonical: bee.values:canonical
    receipts: bee.hive:receipts
    protocol: bee.hive:protocol
- name: operations
  kind: library.lua
  source: file://operations.lua
  imports:
    bounds: bee.values:bounds
    schemas: bee.values:agent_tool
- name: protocol
  kind: library.lua
  source: file://protocol.lua
  modules: [process, channel, time, uuid, system]
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
- name: outbound
  kind: library.lua
  source: file://outbound.lua
  modules: [time]
  imports:
    bounds: bee.values:bounds
    gateway: bee.gov.types:capability_gateway
    canonical: bee.values:canonical
    schemas: bee.gateway.catalog:json_schema
    declarations: bee.values:agent_tool
- name: hive
  kind: library.lua
  source: file://hive.lua
  modules: [funcs]
- name: receipts
  kind: library.lua
  source: file://receipts.lua
  modules: [json, sql]
  imports:
    database: bee.persist:database
    transaction: bee.persist:transaction
    canonical: bee.values:canonical
    protocol: bee.hive:protocol
- name: remote
  kind: library.lua
  source: file://remote.lua
  modules:
  - registry
  imports:
    bounds: bee.values:bounds
    application: bee.node:application
    app_tools: bee.node:app_tools
    application_tests: bee.node:application_tests
    receiver: bee.hive:receiver
    operations: bee.hive:operations
    protocol: bee.hive:protocol
    canonical: bee.values:canonical
    tests: bee.node:tests
    test_runs: bee.node:test_runs
    backend: bee.node.binding:tests_backend_library
    grants: bee.gov.types:capability_grants
