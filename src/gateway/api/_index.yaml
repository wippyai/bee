version: '1.0'
namespace: bee.gateway.api
entries:
- name: gateway_endpoint
  kind: registry.entry
  meta:
    type: bee.gateway_endpoint
    comment: Native HTTP selects and retains an available loopback port; gateway address resolves it from supervisor
      state
  data:
    address: 127.0.0.1:0
- name: gateway_listener
  kind: http.service
  addr: 127.0.0.1:0
  lifecycle:
    auto_start: true
- name: gateway_router
  kind: http.router
  meta:
    server: bee.gateway.api:gateway_listener
  prefix: /
- name: gateway_ready
  kind: http.endpoint
  meta:
    router: bee.gateway.api:gateway_router
  method: GET
  path: /ready
  func: bee.gateway.api:ready_http
- name: gateway_mcp
  kind: http.endpoint
  meta:
    router: bee.gateway.api:gateway_router
  method: POST
  path: /mcp/:action
  func: bee.gateway.api:mcp_http
