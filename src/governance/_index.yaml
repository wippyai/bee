version: '1.0'
namespace: bee.governance
entries:
- name: definition
  kind: ns.definition
  module: governance
  readme: file://README.md
  meta:
    title: Bee governance authoring
    comment: Caller-owned migrated staging and measured-closure checks; install/update execution remains gated
- name: preflight
  kind: library.lua
  source: file://preflight.lua
  modules: [hash, json]
  imports:
    canonical: bee.sync:canonical
- name: workspace
  kind: library.lua
  source: file://workspace.lua
  modules: [hash]
  imports:
    canonical: bee.sync:canonical
- name: candidate
  kind: library.lua
  source: file://candidate.lua
  modules: [hash, json]
  imports:
    canonical: bee.sync:canonical
    workspace: bee.governance:workspace
- name: artifact
  kind: library.lua
  source: file://artifact.lua
  modules: [hash, json]
  imports:
    canonical: bee.sync:canonical
- name: materializer
  kind: library.lua
  source: file://materializer.lua
  modules: [registry]
  imports:
    artifact: bee.governance:artifact
    canonical: bee.sync:canonical
    bounds: bee.threads.records:bounds
- name: approval
  kind: library.lua
  source: file://approval.lua
  imports:
    canonical: bee.sync:canonical
    bounds: bee.threads.records:bounds
- name: destination
  kind: library.lua
  source: file://destination.lua
  modules: [hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.sync:canonical
    approval: bee.governance:approval
    plan_store: bee.governance:plan_store
    replicas: bee.sync:replicas
    delivery: bee.governance:delivery
    preflight: bee.governance:preflight
    transaction: bee.persist:transaction
- name: delivery
  kind: library.lua
  source: file://delivery.lua
  modules: [json, hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.sync:canonical
    artifact: bee.governance:artifact
    version: bee.sync:version
- name: publisher
  kind: library.lua
  source: file://publisher.lua
  modules: [base64]
  imports:
    bounds: bee.threads.records:bounds
    delivery: bee.governance:delivery
    replicas: bee.sync:replicas
    sync: bee.sync:store
    transaction: bee.persist:transaction
- name: publication_profiles
  kind: registry.entry
  meta:
    type: bee.governance.publication_profiles
    comment: Host-selected source workspaces and overlay owners available for immutable publication
  data: {profiles: []}
- name: publication_service
  kind: library.lua
  source: file://publication_service.lua
  modules: [registry, security, system, base64]
  imports:
    bounds: bee.threads.records:bounds
    artifact: bee.governance:artifact
    publisher: bee.governance:publisher
    staging: bee.governance:staging
    activation_store: bee.governance:activation_store
    resources: bee.governance:staging_resources
    sync_resources: bee.sync:resources
    transaction: bee.persist:transaction
- name: publication_call
  kind: function.lua
  source: file://publication_method.lua
  method: handle
  imports: {service: bee.governance:publication_service}
  security: {policies: [bee:governance_publication_service_policy]}
- name: workspace_protocol
  kind: library.lua
  source: file://workspace_protocol.lua
  modules: [base64]
  imports: {bounds: bee.threads.records:bounds}
- name: target_db
  kind: ns.requirement
  default: bee.governance:db
  meta: {comment: Host-selected SQLite store for private authoring workspaces and frozen content}
  targets:
  - entry: bee.governance:database_ref
    path: .resource_ref
- name: database_ref
  kind: registry.entry
  meta: {type: bee.resource_ref}
- name: environment
  kind: env.storage.os
  lifecycle: {auto_start: true}
- name: db_path
  kind: env.variable
  storage: bee.governance:environment
  variable: BEE_GOVERNANCE_DB
  default: .wippy/governance.db
  readonly: true
- name: db
  kind: db.sql.sqlite
  file: ${env:bee.governance:db_path}
  lifecycle: {auto_start: true}
- name: migrations
  kind: library.lua
  source: file://migrations.lua
- name: plan_protocol
  kind: library.lua
  source: file://plan_protocol.lua
  imports:
    bounds: bee.threads.records:bounds
- name: plan_store
  kind: library.lua
  source: file://plan_store.lua
  modules: [sql, hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.sync:canonical
    database: bee.persist:database
    transaction: bee.persist:transaction
    migrations: bee.governance:migrations
    plan_protocol: bee.governance:plan_protocol
- name: activation_store
  kind: library.lua
  source: file://activation_store.lua
  modules: [sql, hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.sync:canonical
    database: bee.persist:database
    transaction: bee.persist:transaction
    migrations: bee.governance:migrations
- name: activation_measure
  kind: library.lua
  source: file://activation_measure.lua
  modules: [hash]
  imports:
    artifact: bee.governance:artifact
    preflight: bee.governance:preflight
    canonical: bee.sync:canonical
    bounds: bee.threads.records:bounds
- name: migration_work
  kind: library.lua
  source: file://migration_work.lua
  modules: [hash, json]
  imports:
    artifact: bee.governance:artifact
    canonical: bee.sync:canonical
    preflight: bee.governance:preflight
- name: hub_resolver
  kind: library.lua
  source: file://hub_resolver.lua
  modules: [registry, hash]
  imports:
    artifact: bee.governance:artifact
    canonical: bee.sync:canonical
    bounds: bee.threads.records:bounds
- name: overlay_resolver
  kind: library.lua
  source: file://overlay_resolver.lua
  modules: [registry, hash]
  imports:
    artifact: bee.governance:artifact
    canonical: bee.sync:canonical
    bounds: bee.threads.records:bounds
- name: activation_owner
  kind: library.lua
  source: file://activation_owner.lua
  modules: [json]
  imports:
    bounds: bee.threads.records:bounds
    transaction: bee.persist:transaction
    plan_store: bee.governance:plan_store
    activation_store: bee.governance:activation_store
    activation_measure: bee.governance:activation_measure
    approval: bee.governance:approval
    preflight: bee.governance:preflight
- name: activation_profiles
  kind: registry.entry
  meta:
    type: bee.governance.activation_profiles
    comment: Host-selected destination mappings and capability ceilings; remote artifacts cannot edit this entry
  data: {profiles: []}
- name: destination_service
  kind: library.lua
  source: file://destination_service.lua
  modules: [registry, security, system, funcs, hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.sync:canonical
    transaction: bee.persist:transaction
    resources: bee.governance:staging_resources
    sync_resources: bee.sync:resources
    replicas: bee.sync:replicas
    plan_store: bee.governance:plan_store
    activation_store: bee.governance:activation_store
    activation_owner: bee.governance:activation_owner
    hub_resolver: bee.governance:hub_resolver
    overlay_resolver: bee.governance:overlay_resolver
    delivery: bee.governance:delivery
    destination: bee.governance:destination
    materializer: bee.governance:materializer
- name: delivery_contract
  kind: contract.definition
  methods:
  - name: call
    description: Discover, stage, review, select and locally activate application versions for one destination workspace
- name: delivery_local
  kind: contract.binding
  contracts:
  - contract: bee.governance:delivery_contract
    methods: {call: bee.governance:destination_call}
- name: destination_call
  kind: function.lua
  source: file://destination_method.lua
  method: handle
  imports: {service: bee.governance:destination_service}
  security: {policies: [bee:governance_destination_service_policy]}
- name: activation_recovery
  kind: process.lua
  source: file://activation_recovery.lua
  method: main
  modules: [process]
  imports: {service: bee.governance:destination_service}
- name: activation_recovery_service
  kind: process.service
  process: bee.governance:activation_recovery
  host: bee:workers
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.governance.activation}
      policies: [bee:governance_destination_service_policy]
- name: staging_resources
  kind: library.lua
  source: file://staging_resources.lua
  modules: [registry]
  imports: {bounds: bee.threads.records:bounds}
- name: staging
  kind: library.lua
  source: file://staging.lua
  modules: [sql, hash, base64]
  imports:
    database: bee.persist:database
    transaction: bee.persist:transaction
    migrations: bee.governance:migrations
    protocol: bee.governance:workspace_protocol
    workspace: bee.governance:workspace
    bounds: bee.threads.records:bounds
- name: workspace_backend_call
  kind: function.lua
  source: file://authoring.lua
  method: call
  modules: [security, system]
  imports:
    protocol: bee.governance:workspace_protocol
    staging: bee.governance:staging
    resources: bee.governance:staging_resources
    transaction: bee.persist:transaction
  meta:
    type: internal
- name: staging_policy
  kind: security.policy
  groups: [workspace_execution_scope]
  policy:
    actions: [db.get, registry.get, system.read]
    resources: [bee.governance:db, bee.governance:database_ref, node]
    effect: allow
- name: workspace_execution_policy
  kind: security.policy
  groups: [workspace_execution_scope]
  policy:
    actions: [bee.governance.workspace.execute]
    resources: [bee.governance:workspace_backend_call]
    effect: allow
- name: workspace_facade_policy
  kind: security.policy.expr
  policy:
    expression: '(action == "funcs.security" && resource == "security") || (action == "security.policy_group.get" && resource == "bee.governance:workspace_execution_scope") || (action == "funcs.call" && resource == "bee.governance:workspace_backend_call")'
    actions: [funcs.security, security.policy_group.get, funcs.call]
    resources: [security, bee.governance:workspace_execution_scope, bee.governance:workspace_backend_call]
    effect: allow
- name: workspace_contract
  kind: contract.definition
  methods:
  - name: call
    description: Author a caller-owned workspace with revision checks; freeze content without executing or approving it
- name: workspace_local
  kind: contract.binding
  contracts:
  - contract: bee.governance:workspace_contract
    methods: {call: bee.governance:workspace_call}
- name: workspace_call
  kind: function.lua
  source: file://workspace_method.lua
  method: handle
  modules: [funcs, security]
  imports: {protocol: bee.governance:workspace_protocol, transaction: bee.persist:transaction, bounds: bee.threads.records:bounds}
  security: {policies: [bee.governance:workspace_facade_policy]}
  meta:
    type: tool
    title: Governance authoring workspace
    llm_alias: BeeWorkspace
    llm_description: Create, list, read, put, remove or freeze files in your host-admitted private workspace. Writes require the current revision and a stable retry key. Freeze stages measured content only; it neither requests approval nor activates it. Binary files use canonical base64. There is no host filesystem or registry access.
    input_schema: |
      {"type":"object","additionalProperties":false,"required":["operation","workspace_id"],"properties":{"operation":{"type":"string","enum":["create","list","read","put","remove","freeze"]},"workspace_id":{"type":"string","minLength":1,"maxLength":160},"expected_revision":{"type":"integer","minimum":0,"maximum":9007199254740990},"idempotency_key":{"type":"string","minLength":1,"maxLength":160},"path":{"type":"string","minLength":1,"maxLength":240},"content":{"type":"string","maxLength":4194304},"content_base64":{"type":"string","maxLength":5592408},"snapshot_digest":{"type":"string","pattern":"^[0-9a-f]{64}$"}}}
- name: authoring_trait
  kind: registry.entry
  meta:
    type: agent.trait
    title: Governance authoring
    comment: Caller-owned durable staging only; no registry writer or approval capability
  prompt: |
    Use BeeWorkspace to author packs and changes as files. Create with revision
    zero; list before editing to obtain the current revision. Put replaces one
    whole file; remove deletes one file. Both need expected_revision and a stable
    idempotency_key. Retry an uncertain write with the identical request and key;
    a changed request needs a new key. On conflict, reread and reconcile first.
    Use content for source text or content_base64 for binary assets. Read returns
    base64 content and a digest. Paths are relative and confined to this virtual
    workspace, not OS paths. Freeze with expected_revision and a retry key to
    retain an exact candidate. Freeze is not approval, installation or execution.
    Pass snapshot_digest to list/read to inspect that retained candidate instead
    of current files; the returned revision is the frozen revision.
    Host policy admits each workspace operation; this trait grants no authority.
  tools: [bee.governance:workspace_call]
