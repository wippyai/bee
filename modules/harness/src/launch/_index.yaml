version: '1.0'
namespace: bee.harness.launch
entries:
- name: definitions
  kind: library.lua
  source: file://definition.lua
  modules: [hash, registry]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    placement_request: bee.placement:request
    placement_types: bee.placement:types
- name: admission
  kind: library.lua
  source: file://admission.lua
  modules: [hash, registry, funcs, process, security, time]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    catalog: bee.harness.catalog:catalog
    policy: bee.harness.carrier:policy
    definition: bee.harness.launch:definitions
    agent_resolver: bee.harness.launch:agent_resolver
    carrier: bee.harness.carrier:machine
    placement_types: bee.placement:types
    placement_resolver: bee.placement:resolver
    continuation: bee.harness.carrier:continuation
    interrupted: bee.harness.window:interrupted
    profiles: bee.harness.profiles:protocol
- name: agent_resolver
  kind: library.lua
  source: file://agent_resolver.lua
  modules: [hash, json, registry]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    driver_resolver: bee.driver:resolver
- name: resolve
  kind: function.lua
  source: file://resolve_method.lua
  method: handle
  imports:
    admission: bee.harness.launch:admission
    bounds: bee.threads.records:bounds
- name: admit
  kind: function.lua
  source: file://admit_method.lua
  method: handle
  imports:
    admission: bee.harness.launch:admission
- name: start
  kind: function.lua
  source: file://start_method.lua
  method: handle
  imports:
    admission: bee.harness.launch:admission
  security:
    policies: [bee.harness.security:launch_spawn_policy]
- name: selection
  kind: library.lua
  source: file://selection.lua
  modules: [registry]
  imports:
    definitions: bee.harness.launch:definitions
    bounds: bee.threads.records:bounds
- name: locate
  kind: library.lua
  source: file://locate.lua
  modules: [env, exec, fs, registry]
  imports:
    bounds: bee.threads.records:bounds
    descriptor: bee.driver:descriptor
    driver_resolver: bee.driver:resolver
    driver_types: bee.driver:types
    locate: bee.driver:locate
    quote: bee.driver.kit:quote
    resources: bee.placement.native:resources
    probe_capture: bee.harness.launch:probe_capture
    probe_version: bee.harness.launch:probe_version
- name: probe_capture
  kind: library.lua
  source: file://probe_capture.lua
  modules: [channel, time]
- name: probe_version
  kind: library.lua
  source: file://probe_version.lua
  imports:
    bounds: bee.threads.records:bounds
- name: locate_probe
  kind: function.lua
  source: file://locate_probe.lua
  method: handle
  modules: [registry]
  imports:
    bounds: bee.threads.records:bounds
    locator: bee.harness.launch:locate
  security:
    policies: [bee.harness.security:launch_locate_probe_policy]
- name: readiness
  kind: library.lua
  source: file://readiness.lua
  modules: [funcs]
  imports:
    bounds: bee.threads.records:bounds
    driver_locate: bee.driver:locate
    driver_types: bee.driver:types
- name: setup_backend
  kind: function.lua
  source: file://setup_backend.lua
  method: handle
  modules: [hash, funcs, registry, security]
  imports:
    bounds: bee.threads.records:bounds
    definition: bee.harness.launch:definitions
- name: setup
  kind: function.lua
  source: file://setup_method.lua
  method: handle
  modules: [funcs, security]
  imports:
    bounds: bee.threads.records:bounds
    admission: bee.harness.launch:admission
  security:
    policies: [bee.harness.launch:setup_facade_policy]
- name: managed_run
  kind: library.lua
  source: file://managed_run.lua
  modules: [funcs, time, process, registry]
  imports:
    bounds: bee.threads.records:bounds
    placement_resolver: bee.placement:resolver
    placement_decode: bee.placement:decode
    prestart: bee.harness.carrier:prestart
- name: setup_execution_policy
  kind: security.policy.expr
  groups: [harness_setup_execution_scope]
  policy:
    expression: '(action == "funcs.call" && (resource == "bee.resources.binding:associate" || resource == "bee.resources.binding:list" || resource == "bee.credentials.binding:define" || resource == "bee.credentials.binding:list")) || ((action == "bee.resources.manage" || action == "bee.credentials.manage") && resource != "" && resource == actor.meta.workspace_id) || action == "registry.get"'
    actions: [funcs.call, bee.resources.manage, bee.credentials.manage, registry.get]
    resources: '*'
    effect: allow
- name: setup_facade_policy
  kind: security.policy.expr
  policy:
    expression: '(action == "funcs.security" && resource == "security") || (action == "security.policy_group.get" && resource == "bee.harness.launch:harness_setup_execution_scope") || (action == "funcs.call" && resource == "bee.harness.launch:setup_backend") || action == "registry.snapshot"'
    actions: [funcs.security, security.policy_group.get, funcs.call, registry.snapshot]
    resources: '*'
    effect: allow
