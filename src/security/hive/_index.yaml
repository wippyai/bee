version: '1.0'
namespace: bee.security.hive
entries:
- name: hive_telemetry_policy
  kind: security.policy
  policy:
    actions:
    - system.read
    resources:
    - node
    - cluster
    - memory
    - goroutines
    - cpu
    effect: allow
- name: hive_catalog_policy
  kind: security.policy
  policy:
    actions:
    - registry.get
    - registry.find
    resources: '*'
    effect: allow
- name: hive_exposure_policy
  kind: security.policy
  groups: [hive_exposure_scope]
  meta:
    comment: The host ceiling; telemetry and the threads capabilities report may be open in this composition, and the two
      thread operations may reach forwarded principals under the destination's own policy
  policy:
    actions:
    - hive.expose.open
    resources:
    - bee.hive.telemetry.binding:presence
    - bee.hive.telemetry.binding:stats
    - bee.hive.telemetry.binding:catalog_list
    - bee.hive.telemetry.binding:holdings
    - bee.hive.telemetry.binding:cluster
    - bee.hive.telemetry.binding:node_summary
    - bee.hive.binding:workspaces
    - bee.threads.binding:capabilities
    effect: allow
- name: hive_exposure_facade_policy
  kind: security.policy.expr
  meta:
    comment: The supervisor loads its Hive exposure scope through this group; the scope carries the host ceiling and install-granted operation exposure
  policy:
    expression: '(action == "funcs.security" && resource == "security") || (action == "security.policy_group.get" && resource == "bee.security.hive:hive_exposure_scope")'
    actions: [funcs.security, security.policy_group.get]
    resources: [security, bee.security.hive:hive_exposure_scope]
    effect: allow
- name: hive_policy_exposure_policy
  kind: security.policy
  groups: [hive_exposure_scope]
  meta:
    comment: Exact reviewed feed and node operations; a decision or withdrawal is node-local and never exposed, and destination principal and owner authorization is still required for what is
  policy:
    actions:
    - hive.expose.policy
    resources:
    - bee.node.binding:describe
    - bee.node.binding:update_metadata
    - bee.node.binding:snapshot
    - bee.node.binding:read_after
    - bee.approvals.binding:feed_snapshot
    - bee.approvals.binding:feed_read_after
    - bee.approvals.binding:read
    - bee.sync.binding:replica_receive
    effect: allow
- name: policy_admission_policy
  kind: security.policy
  meta:
    comment: The catalog-declared operations the admission may invoke as a mapped principal; a decision or withdrawal is node-local and deliberately absent, so no mapping row can admit one
  policy:
    actions:
    - registry.get
    - system.read
    - funcs.call
    resources:
    - node
    - bee.hive.supervisor:principal_mappings
    - bee.hive.binding:invoke_check
    - bee.node.binding:describe
    - bee.node.binding:update_metadata
    - bee.node.binding:snapshot
    - bee.node.binding:read_after
    - bee.approvals.binding:feed_snapshot
    - bee.approvals.binding:feed_read_after
    - bee.approvals.binding:read
    - bee.sync.binding:replica_receive
    effect: allow
- name: hive_replica_admission_policy
  kind: security.policy
  policy:
    actions: [registry.get, system.read, funcs.call, funcs.security, security.actor.create,
      security.scope.create, security.policy.get, hive.expose.policy]
    resources: '*'
    effect: allow
- name: hive_replica_peer_policy
  kind: security.policy
  meta:
    comment: Authenticated peer nodes may write only immutable replica bytes owned by that same node
  policy:
    actions: [funcs.call, bee.sync.replica.receive]
    resources: '*'
    effect: allow
- name: hive_thread_invoke_policy
  kind: security.policy
  meta:
    comment: What a mapped principal's own scope must carry to invoke the thread and inbox operations; the host names it in a principal
      mapping, never in a worker
  policy:
    actions:
    - hive.invoke
    - funcs.call
    resources:
    - bee.threads.binding:send
    - bee.threads.binding:send_status
    - bee.threads.binding:inbox_describe
    - bee.threads.binding:inbox_resolve
    - bee.threads.binding:inbox_send
    - bee.threads.binding:inbox_reply
    - bee.threads.binding:notify
    - bee.threads.binding:watch
    - bee.hive.binding:invoke_check
    effect: allow
- name: hive_thread_exposure_policy
  kind: security.policy
  meta:
    comment: The host ceiling for forwarded thread and inbox operations; the destination thread owner still decides membership,
      the inbox owner still re-checks workspace, grant, action and epoch, and the principal table still decides admission
  policy:
    actions:
    - hive.expose.policy
    resources:
    - bee.threads.binding:send
    - bee.threads.binding:send_status
    - bee.threads.binding:inbox_describe
    - bee.threads.binding:inbox_resolve
    - bee.threads.binding:inbox_send
    - bee.threads.binding:inbox_reply
    - bee.threads.binding:notify
    - bee.threads.binding:watch
    effect: allow
- name: hive_readiness_policy
  kind: security.policy
  policy:
    actions: [events.send]
    resources: [bee.launch]
    effect: allow
- name: hive_supervisor_policy
  kind: security.policy
  policy:
    actions:
    - process.send
    - process.monitor
    - process.unmonitor
    resources: '*'
    effect: allow
- name: hive_dispatch_policy
  kind: security.policy
  policy:
    actions:
    - funcs.call
    resources:
    - bee.hive.telemetry.binding:presence
    - bee.hive.telemetry.binding:stats
    - bee.hive.telemetry.binding:catalog_list
    - bee.hive.telemetry.binding:holdings
    - bee.hive.telemetry.binding:cluster
    - bee.hive.telemetry.binding:node_summary
    - bee.hive.binding:workspaces
    - bee.threads.binding:capabilities
    effect: allow
- name: hive_names_policy
  kind: security.policy
  meta:
    comment: Selected only by the native Hive supervisor host for native name publication and discovery
  policy:
    actions:
    - process.registry.register
    - process.registry.register.local
    - process.registry.register.eventual
    - process.registry.lookup
    - process.registry.unregister
    - process.registry.unregister.eventual
    resources:
    - bee.hive.supervisor
    - 'bee.hive.supervisor/*'
    effect: allow
- name: hive_advertise_policy
  kind: security.policy
  meta:
    comment: The isolated advertisement worker may name only a protected Hive supervisor PID; ordinary Hive scopes cannot name foreign processes
  policy:
    actions:
    - process.registry.foreign
    resources: '*'
    effect: allow
- name: hive_execute_policy
  kind: security.policy
  meta:
    comment: The supervisor host may call its open executor, its generic policy worker and the feature-owned admission workers the host routed (selected beside the operation-adapter table)
  policy:
    actions:
    - funcs.call
    resources:
    - bee.hive.binding:execute
    - bee.hive.binding:admit_policy
    - bee.hive.binding:advertise
    - bee.threads.hive.binding:admit
    - bee.sync.binding:admit
    effect: allow
- name: hive_owner_stop_policy
  kind: security.policy
  meta:
    comment: Selected by the host for its Hive supervisor to ask its own owner to shut down at the request of an enrolled local client; without it bee stop is refused
  policy:
    actions:
    - hive.owner.stop
    resources:
    - bee.hive.owner:stop
    effect: allow
- name: hive_invite_policy
  kind: security.policy
  meta:
    comment: Selected by the host for its Hive supervisor to mint, list, revoke and redeem invites and to report its peers; without it every invite operation is refused
  policy:
    actions:
    - hive.invite
    resources:
    - bee.hive.join:invite
    - bee.hive.join:invites
    - bee.hive.join:revoke
    - bee.hive.join:peers
    - bee.hive.join:redeem
    effect: allow
- name: workspace_command_policy
  kind: security.policy
  meta:
    comment: Selected by the host for its Hive supervisor to run the bee workspace commands of enrolled local clients through their worker; without it every workspace command is refused
  policy:
    actions:
    - funcs.call
    - bee.workspace.manager.command
    resources:
    - bee.hive.binding:workspace_command
    - bee.workspace:create
    - bee.workspace:list
    - bee.workspace:archive
    - bee.workspace:restore
    - bee.workspace:roots
    effect: allow
- name: workspace_command_catalog_policy
  kind: security.policy
  meta:
    comment: Attached to the workspace command worker; the catalog still authorizes each operation under the catalog policies the host attaches beside it
  policy:
    actions:
    - funcs.call
    resources:
    - bee.workspace.binding:create
    - bee.workspace.binding:list
    - bee.workspace.binding:archive
    - bee.workspace.binding:restore
    - bee.workspace.binding:roots
    effect: allow
