version: '1.0'
namespace: bee.hive.manager.security
entries:
- name: client_policy
  kind: security.policy
  meta:
    comment: The manager reads runtime membership and its own host entries; every
      Hive answer comes from the supervisor under the owner's exposure, and no desktop
      authority is granted here
  policy:
    actions:
    - registry.get
    - system.read
    resources:
    - bee.hive.manager.app:names
    - cluster
    effect: allow
- name: viewer_policy
  kind: security.policy.expr
  meta:
    comment: The manager opens a remote view of another node's workspace in a view
      process on the display client host; the owner node's bridge still admits that
      process and grants its mount
  policy:
    actions:
    - process.spawn
    - process.spawn.monitored
    - process.host
    - process.registry.lookup
    - process.monitor
    - tty.attach
    - tty.read
    - tty.write
    - tty.resize
    - tty.viewport
    resources: '*'
    expression: ((action == "process.spawn" || action == "process.spawn.monitored")
      && resource == "bee.hive.desktop:viewer") || (action == "process.host" && resource
      == "bee.hive.desktop:display_host") || (action == "process.registry.lookup"
      && resource matches "^bee[.]hive[.]supervisor(/.+)?$") || action == "process.monitor"
      || action == "tty.attach" || action == "tty.read" || action == "tty.write" ||
      action == "tty.resize" || action == "tty.viewport"
    effect: allow
