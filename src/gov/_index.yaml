version: '1.0'
namespace: bee.gov
entries:
- name: delivery_contract
  kind: contract.definition
  methods:
  - name: call
    description: Discover, stage, review, select and locally activate overlay versions for one destination workspace
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","properties":{"operation":{"type":"string"},"workspace_id":{"type":"string"},"source_workspace":{"type":"string"},"source_node":{"type":"string"},"version":{"type":"string"},"snapshot_digest":{"type":"string"},"intent_id":{"type":"string"},"expected_revision":{"type":"integer"},"receipt_key":{"type":"string"}},"additionalProperties":true,"description":"Discover, stage, review, select and locally activate overlay versions for one destination workspace"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":false},"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"retryable":{"type":"boolean"}},"additionalProperties":true,"required":["code","message"]}},"additionalProperties":true,"required":["ok","error"]}]}}
- name: overlay_contract
  kind: contract.definition
  methods:
  - name: call
    description: Author a caller-owned overlay with revision checks; freeze content without executing or approving it
    input_schemas:
    - {format: application/schema+json, definition: {"type":"object","additionalProperties":false,"required":["operation"],"properties":{"operation":{"type":"string","enum":["guide","source","create","list","read","put","append","remove","freeze"]},"overlay_id":{"type":"string","minLength":1,"maxLength":160},"expected_revision":{"type":"integer","minimum":0,"maximum":9007199254740990},"idempotency_key":{"type":"string","minLength":1,"maxLength":160},"path":{"type":"string","minLength":1,"maxLength":240},"offset":{"type":"integer","minimum":0,"maximum":4194304},"limit":{"type":"integer","minimum":1,"maximum":16384},"result_digest":{"type":"string","pattern":"^[0-9a-f]{64}$"},"content":{"type":"string","maxLength":4194304},"content_base64":{"type":"string","maxLength":5592408},"snapshot_digest":{"type":"string","pattern":"^[0-9a-f]{64}$"}},"description":"Author a caller-owned overlay with revision checks; freeze content without executing or approving it"}}
    output_schemas:
    - {format: application/schema+json, definition: {"oneOf":[{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"ok":{"const":true}},"additionalProperties":true,"required":["ok"]},{"type":"object","properties":{"value":{},"replayed":{"type":"boolean"},"code":{"type":"string"},"message":{"type":"string"},"ok":{"const":false}},"additionalProperties":true,"required":["ok","code","message"]}]}}
- name: activation_profiles
  kind: registry.entry
  meta:
    type: bee.gov.activation_profiles
    comment: Host-selected destination mappings and capability ceilings. workspace_applications is the ceiling for applications a workspace's agents author for it and, with hive, for the same applications
      received from another node; workspace_drivers is the ceiling for drivers those agents author; packages is the ceiling for Bee packages this node composes. Their policies are the security policies such content may name beyond the application policy group every app runs in. Remote artifacts cannot edit this entry
  data:
    profiles: []
    workspace_applications:
      approval_policy: workspace-application-delivery
      kinds:
      - process.lua
      - function.lua
      - library.lua
      - ns.definition
      - ns.requirement
      - registry.entry
      modules:
      - tty
      - process
      - channel
      - json
      - time
      - uuid
      - base64
      - hash
      - funcs
      - fs
      - sql
      policies: []
      thread_access: none
      hive: true
    workspace_drivers:
      approval_policy: workspace-application-delivery
      kinds: [function.lua, library.lua, registry.entry, contract.binding, ns.requirement, security.policy, security.policy.expr]
      modules: [json, hash, registry, time]
      policies: []
      thread_access: none
      hive: false
    packages:
      approval_policy: workspace-application-delivery
      kinds: [process.lua, function.lua, library.lua, ns.definition, ns.requirement, security.policy, registry.entry, contract.binding, env.variable]
      modules: [tty, process, channel, json, time, uuid, base64, hash, funcs, registry, system]
      policies: []
      thread_access: none
- name: publication_profiles
  kind: registry.entry
  meta:
    type: bee.gov.publication_profiles
    comment: Host-selected source workspaces and overlay owners available for immutable publication; workspace_applications publishes the overlays a workspace's own agents author under the app.<overlay_id>
      naming rule, workspace_drivers those under the driver.<name> rule
  data:
    profiles: []
    workspace_applications: true
    workspace_drivers: true
- name: protected_kernel
  kind: registry.entry
  meta:
    type: bee.protected_kernel
    comment: Host trust map no overlay profile can open; preflight refuses edits to these definitions, their transitive code dependencies and requirement selectors aimed at them. super_edit names exact entries
      a person may open to a time-bounded edit. The shared driver core is protected; each driver's own bee.driver.<name> namespaces stay under governance, so workspace drivers can be delivered
