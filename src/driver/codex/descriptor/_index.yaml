            - resume
            file: .codex/config.toml
            format: toml
            path:
            - plan_mode_reasoning_effort
            merge: set
            value:
              field: provider.options.plan_effort
        reasoning_summary:
          id: reasoning_summary
          path: provider.options.reasoning_summary
          value_schema:
            type: string
            enum:
            - auto
            - concise
            - detailed
            - none
          label: Reasoning summary
          description: Codex reasoning summary (inherits the CLI default when unset)
          group: model/provider
          security_class: free
          section: advanced
          order: 257
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=0.160.1'
            config_schema_ref: bee.driver.codex.descriptor:cli
          render:
          - kind: config
            contexts:
            - window
            - first_turn
            - resume
            file: .codex/config.toml
            format: toml
            path:
            - model_reasoning_summary
            merge: set
            value:
              field: provider.options.reasoning_summary
        verbosity:
          id: verbosity
          path: provider.options.verbosity
          value_schema:
            type: string
            enum:
            - low
            - medium
            - high
          label: Verbosity
