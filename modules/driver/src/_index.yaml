version: '1.0'
namespace: bee.driver
entries:
- name: definition
  kind: ns.definition
  module: driver
  readme: file://README.md
  meta:
    title: Bee driver contract
    comment: The driver contract, declarative envelopes, activated binding resolution and scoped configuration calls; placement owns execution
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: types
  kind: library.lua
  source: file://types.lua
  imports:
    bounds: bee.threads.records:bounds
    events: bee.driver.kit:events
    values: bee.threads.records:values
- name: descriptor
  kind: library.lua
  source: file://descriptor.lua
  modules: [registry]
  imports:
    bounds: bee.threads.records:bounds
    turn_budget: bee.driver:turn_budget
- name: locate
  kind: library.lua
  source: file://locate.lua
  imports:
    bounds: bee.threads.records:bounds
- name: codec_registry
  kind: library.lua
  source: file://codec_registry.lua
  imports:
    claude_stream_json: bee.driver.codec:claude_stream_json
    codex_jsonl: bee.driver.codec:codex_jsonl
    opencode_json_events: bee.driver.codec:opencode_json_events
    agy_stream_json: bee.driver.codec:agy_stream_json
    grok_streaming_json: bee.driver.codec:grok_streaming_json
    muse_record_jsonl: bee.driver.codec:muse_record_jsonl
- name: universal
  kind: library.lua
  source: file://universal.lua
  modules: [registry]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    descriptor: bee.driver:descriptor
    configuration: bee.driver:configuration
    turn_budget: bee.driver:turn_budget
    types: bee.driver:types
    locate: bee.driver:locate
    codec_registry: bee.driver:codec_registry
    normalizer: bee.driver.kit:normalize
- name: instructions
  kind: library.lua
  source: file://instructions.lua
  imports:
    bounds: bee.threads.records:bounds
- name: profile
  kind: library.lua
  source: file://profile.lua
  imports:
    bounds: bee.threads.records:bounds
    types: bee.driver:types
- name: resolver
  kind: library.lua
  source: file://resolver.lua
  modules: [registry]
  imports:
    bounds: bee.threads.records:bounds
    profile: bee.driver:profile
    types: bee.driver:types
- name: configuration
  kind: library.lua
  source: file://configuration.lua
  modules: [hash, funcs, security]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    types: bee.driver:types
    instructions: bee.driver:instructions
- name: preferences
  kind: library.lua
  source: file://preferences.lua
  imports:
    bounds: bee.threads.records:bounds
    instructions: bee.driver:instructions
    turn_budget: bee.driver:turn_budget
- name: turn_budget
  kind: library.lua
  source: file://turn_budget.lua
  imports:
    bounds: bee.threads.records:bounds
- name: driver
  kind: contract.definition
  methods:
  - name: prepare
    description: Return the declarative launch specification for a profile and a brief
  - name: dispatch
    description: Return the declarative input for a turn or control operation on a running attempt
  - name: normalize
    description: Turn one protocol envelope into observations and, when the protocol says so, a terminal report
  - name: configure
    description: Return argv arguments and protected private-home files from host-selected configuration inputs
- name: locate_facet
  kind: contract.definition
  methods:
  - name: locate
    description: Locate an admitted external driver profile from host-probed executable, login-file existence, and platform evidence
