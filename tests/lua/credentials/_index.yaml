version: '1.0'
namespace: bee.credentials
entries:
- name: sentinel_storage
  kind: env.storage.memory
  meta: {type: test_support}
  lifecycle:
    auto_start: true
- name: sentinel_key
  kind: env.variable
  meta: {type: test_support}
  storage: bee.credentials:sentinel_storage
  variable: BEE_TEST_SENTINEL_KEY
  default: sentinel-secret-7f3a9c
  readonly: true
- name: broken_key
  kind: env.variable
  meta: {type: test_support}
  storage: bee.credentials:sentinel_storage
  variable: BEE_TEST_BROKEN_KEY
  default: "broken\nsecret-9d8e7f"
  readonly: true
- name: other_key
  kind: env.variable
  meta: {type: test_support}
  storage: bee.credentials:sentinel_storage
  variable: BEE_TEST_OTHER_KEY
  default: other-secret-1b2c3d
  readonly: true
- name: apply_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [registry.apply]
    resources: '*'
    effect: allow
- name: client_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.credentials:define, bee.credentials:issue_projection, bee.credentials:check, bee.credentials:materialize, bee.credentials:revoke,
      bee.credentials:revoke_all, bee.credentials:list, bee.credentials:capabilities]
    effect: allow
- name: broker_test
  kind: function.lua
  source: file://broker_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: "60s"}
  modules: [funcs, security, registry, time, json]
  security:
    policies: [bee.credentials:apply_test_policy]
  imports:
    test: wippy.test:test
    broker: bee.credentials:broker
