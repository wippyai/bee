version: '1.0'
namespace: bee.hive.supervisor
entries:
- name: exposure_audiences
  kind: registry.entry
  meta:
    type: bee.hive.exposure_audiences
    comment: Host-owned table of the peers each listed open operation admits; an unlisted operation stays as exposed
      as its ceiling, and the owner's own callers bypass audiences
  data:
    audiences: []
- name: policy_identity_policy
  kind: security.policy
  policy:
    actions: [funcs.security, security.scope.create, security.policy.get]
    resources: '*'
    effect: allow
- name: policy_actor_policy
  kind: security.policy
  policy:
    actions: [security.actor.create]
    resources: ['bee.hive.member.*']
    effect: allow
- name: principal_mappings
  kind: registry.entry
  meta:
    type: bee.hive.principal_mappings
    comment: Host-owned table of the trusted issuer and subject pairs admitted to thread operations and the policies each acts under; the actor is derived from the pair; an empty table admits no forwarded thread operation
  data:
    mappings: []
- name: hive_operation_adapters
  kind: registry.entry
  meta:
    type: bee.hive.operation_adapters
    comment: Host-selected forwarding routes; the supervisor maps each thread and replica operation to the feature-owned admission worker in the package that owns it, and that worker still runs under the host-selected policies its package declares
  data:
    adapters:
    - operations: [bee.threads.binding:send, bee.threads.binding:send_status, bee.threads.binding:inbox_resolve,
        bee.threads.binding:inbox_describe, bee.threads.binding:inbox_send, bee.threads.binding:inbox_reply,
        bee.threads.binding:notify, bee.threads.binding:watch]
      worker: bee.threads.hive:admit
    - operations: [bee.sync.binding:replica_receive]
      worker: bee.sync.binding:admit
