version: '1.0'
namespace: bee.app
entries:
- name: definition
  kind: ns.definition
  module: application
  readme: file://README.md
  meta:
    title: Bee application SDK
    comment: Public application-side values and presentation helpers; helpers grant no application, workspace, or thread authority
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: client
  kind: library.lua
  source: file://client.lua
  modules:
  - process
  - uuid
  imports:
    arguments: bee.app:arguments
    interaction: bee.app:interaction
    bounds: bee.values:bounds
- name: sessions_protocol
  kind: library.lua
  source: file://sessions_protocol.lua
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    record_values: bee.threads.records:values
    record_types: bee.threads:record_types
    budget_values: bee.threads.records:budgets
    profile_values: bee.harness.profiles:protocol
- name: sessions
  kind: library.lua
  source: file://sessions.lua
  modules:
  - contract
  imports:
    bounds: bee.values:bounds
    protocol: bee.app:sessions_protocol
- name: arguments
  kind: library.lua
  source: file://arguments.lua
- name: caller
  kind: library.lua
  source: file://caller.lua
  imports:
    bounds: bee.values:bounds
    record_bounds: bee.threads.records:bounds
- name: folder_picker
  kind: library.lua
  source: file://folder_picker.lua
  imports:
    text: bee.ui:text
    caller: bee.app:caller
    frame: bee.ui:frame
    bounds: bee.values:bounds
- name: host_leases
  kind: library.lua
  source: file://host_leases.lua
  modules:
  - process
  - channel
  - time
  - uuid
  imports:
    bounds: bee.values:bounds
- name: status_reader
  kind: library.lua
  source: file://status_reader.lua
  imports:
    bounds: bee.values:bounds
    caller: bee.app:caller
    text: bee.ui:text
    record_bounds: bee.threads.records:bounds
- name: status_surface
  kind: library.lua
  source: file://status_surface.lua
  imports:
    bounds: bee.values:bounds
- name: interaction
  kind: library.lua
  source: file://interaction.lua
  imports:
    bounds: bee.values:bounds
- name: names
  kind: library.lua
  source: file://names.lua
- name: viz
  kind: library.lua
  source: file://viz.lua
  modules:
  - tty
  imports:
    appearance: bee.ui:appearance
    frame: bee.ui:frame
- name: forms
  kind: library.lua
  source: file://forms.lua
  modules:
  - tty
  imports:
    appearance: bee.ui:appearance
    frame: bee.ui:frame
- name: diagram
  kind: library.lua
  source: file://diagram.lua
  modules:
  - tty
  imports:
    appearance: bee.ui:appearance
    frame: bee.ui:frame
    viz: bee.app:viz
- name: dependency_values
  kind: ns.dependency
  component: bee/values
  version: '*'
- name: dependency_ui
  kind: ns.dependency
  component: bee/ui
  version: '*'
