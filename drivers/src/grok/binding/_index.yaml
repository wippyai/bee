version: '1.0'
namespace: bee.drivers.grok.binding
entries:
- name: prepare
  kind: function.lua
  source: file://prepare.lua
  method: handle
  imports:
    universal: bee.drivers.binding:universal
    acp: bee.drivers.grok.binding:acp
    bounds: bee.drivers.values:bounds
- name: dispatch
  kind: function.lua
  source: file://dispatch.lua
  method: handle
  imports:
    universal: bee.drivers.binding:universal
    acp: bee.drivers.grok.binding:acp
    bounds: bee.drivers.values:bounds
- name: configure
  kind: function.lua
  source: file://configure.lua
  method: handle
  imports:
    configuration: bee.drivers.grok.binding:configuration
    configure_protocol: bee.drivers:configuration_types
    universal: bee.drivers.binding:universal
  security:
    policies:
    - bee.drivers.grok.binding:configuration_policy
- name: locate
  kind: function.lua
  source: file://locate.lua
  method: handle
  imports:
    universal: bee.drivers.binding:universal
- name: normalize
  kind: function.lua
  source: file://normalize.lua
  method: handle
  imports:
    universal: bee.drivers.binding:universal
    acp: bee.drivers.grok.binding:acp
    bounds: bee.drivers.values:bounds
- name: configuration_policy
  kind: security.policy.expr
  policy:
    effect: allow
    actions:
    - registry.get
    - registry.snapshot
    - funcs.call
    resources:
    - '*'
    expression: (action == "registry.get" && resource == "bee.drivers.grok.descriptor:cli") || action == "registry.snapshot"
- name: configuration
  kind: library.lua
  source: file://configuration.lua
  modules:
  - hash
  imports:
    canonical: bee.drivers.values:canonical
    quote: bee.drivers.binding:quote
    hook_limits: bee.drivers.binding:hook_limits
    toml: bee.drivers.binding:toml
    configure_protocol: bee.drivers.binding:configuration
    configure_protocol_types: bee.drivers:configuration_types
- name: binding
  kind: contract.binding
  contracts:
  - contract: bee.drivers:driver
    methods:
      prepare: bee.drivers.grok.binding:prepare
      dispatch: bee.drivers.grok.binding:dispatch
      normalize: bee.drivers.grok.binding:normalize
      configure: bee.drivers.grok.binding:configure
  - contract: bee.drivers:locate_facet
    methods:
      locate: bee.drivers.grok.binding:locate
  meta:
    type: harness.driver
    driver_id: grok
    descriptor_ref: bee.drivers.grok.descriptor:cli
    accepts_model: true
    profiles_ref: bee.drivers.grok.profiles:profiles

- name: acp
  kind: library.lua
  source: file://acp.lua
  modules: [json]
  imports:
    bounds: bee.drivers.values:bounds
    canonical: bee.drivers.values:canonical
    events: bee.drivers.codec:events
    driver_types: bee.drivers:types
