version: '1.0'
namespace: bee.placement.docker.daemon
entries:
- name: definition
  kind: ns.definition
  module: placement-docker-daemon
  readme: |
    Optional Bee Docker daemon lifecycle adapter. The host selects the daemon
    socket and placement owns state, reconciliation and cleanup.
  meta:
    title: Bee Docker daemon adapter
    comment: Optional lifecycle adapter over a host-selected Docker daemon; placement owns state and cleanup
- name: daemon
  kind: library.lua
  source: file://daemon.lua
  modules: [registry]
  imports:
    bounds: bee.threads.records:bounds
    inspection: bee.placement.docker:inspection
    docker_client: userspace.docker:docker_client
- name: socket_policy
  kind: security.policy.expr
  meta:
    comment: The installing host must restrict this expression to its selected Unix socket; unconfigured grants nothing
  policy:
    actions: [http_client.unix_socket]
    resources: '*'
    effect: allow
    expression: 'false'
- name: request_policy
  kind: security.policy
  policy:
    actions: [http_client.request]
    resources: ['http://docker/*']
    effect: allow
- name: configuration_policy
  kind: security.policy
  meta:
    comment: Read host-selected driver, resource and daemon configuration without native execution authority
  policy:
    actions: [registry.get, env.get]
    resources: '*'
    effect: allow
