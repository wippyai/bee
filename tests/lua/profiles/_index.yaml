version: '1.0'
namespace: bee.harness.profiles
entries:
- name: preferences_test
  kind: function.lua
  source: file://preferences_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    preferences: bee.driver.descriptor:effective
- name: test_call
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.harness.binding:call, bee.harness.profiles:context_probe, bee.approvals.binding:grant]
    effect: allow
- name: test_read
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [bee.harness.profiles.read]
    resources: [saved-profile-workspace]
    effect: allow
- name: test_write
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [bee.harness.profiles.write, bee.approvals.decide]
    resources: [saved-profile-workspace]
    effect: allow
- name: service_test
  kind: function.lua
  source: file://service_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [funcs, security, uuid]
  imports:
    editor: bee.harness.app:profile_editor
    protocol: bee.harness.profiles:protocol
    test: wippy.test:test
    bounds: bee.values:bounds
    host: bee.tests.memory:host
  security: {policies: [bee.tests.memory:host_policy, bee.tests.memory:read_policy]}
- name: selection_test
  kind: function.lua
  source: file://selection_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    protocol: bee.threads.sessions.types:protocol
    fixtures: bee.tests.sessions:fixtures
    bounds: bee.values:bounds
    test: wippy.test:test
    agents: bee.harness.app:agents
    sessions: bee.threads.sessions.client:sessions

- name: context_probe
  kind: function.lua
  source: file://context_probe.lua
  method: handle
  meta: {type: test_support}
  modules: [funcs]

- name: editor_test
  kind: function.lua
  source: file://editor_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    profile_editor: bee.harness.app:profile_editor
    protocol: bee.harness.profiles:protocol
- name: form_test
  kind: function.lua
  source: file://form_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [funcs, registry]
  imports:
    test: wippy.test:test
    form: bee.harness.app:profile_form
    editor: bee.harness.app:profile_editor
    bounds: bee.values:bounds
- name: agents_test
  kind: function.lua
  source: file://agents_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    principals: bee.tests.principals:bound
    bounds: bee.values:bounds
    protocol: bee.threads.sessions.types:protocol
    fixtures: bee.tests.sessions:fixtures
    test: wippy.test:test
    picker_view: bee.harness.app:picker_view
    appearance: bee.ui:appearance
    agents: bee.harness.app:agents
    sessions: bee.threads.sessions.client:sessions
- name: observations_test
  kind: function.lua
  source: file://observations_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [funcs, security]
  imports:
    test: wippy.test:test
    harness: bee.tests.threads:harness
    agents: bee.harness.app:agents
    sessions: bee.threads.sessions.client:sessions
    protocol: bee.threads.sessions.types:protocol
    bounds: bee.values:bounds
- name: observations_probe
  kind: function.lua
  source: file://observations_test.lua
  method: probe
  meta: {type: test_support}
  modules: [funcs, security]
  imports:
    test: wippy.test:test
    harness: bee.tests.threads:harness
    agents: bee.harness.app:agents
    sessions: bee.threads.sessions.client:sessions
    protocol: bee.threads.sessions.types:protocol
    bounds: bee.values:bounds
- name: agent_view_test
  kind: function.lua
  source: file://agent_view_test.lua
  method: run
  modules: [tty]
  meta: {type: test, suite: bee}
  imports:
    fixtures: bee.tests.sessions:fixtures
    test: wippy.test:test
    directory_view: bee.harness.app:directory_view
    protocol: bee.threads.sessions.types:protocol
    frames: bee.ui:frame
    picker_view: bee.harness.app:picker_view
    session_view: bee.harness.app:session_view
    agents: bee.harness.app:agents
    appearance: bee.ui:appearance
- name: view_test
  kind: function.lua
  source: file://view_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    confirmation: bee.approvals.app:confirmation
    confirmation_fixture: bee.approvals:confirmation_fixture
    canonical: bee.values:canonical
    test: wippy.test:test
    view: bee.harness.app:profile_view
    editor: bee.harness.app:profile_editor
    appearance: bee.ui:appearance
    caller: bee.app:caller
- name: codex_effort_test
  kind: function.lua
  source: file://codex_effort_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    launch: bee.tests.driver.support:codex_launch
- name: migration_test
  kind: function.lua
  source: file://migration_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [uuid]
  imports:
    test: wippy.test:test
    bounds: bee.values:bounds
    migration: bee.harness.profiles.persist:migration
    protocol: bee.harness.profiles:protocol
    sync: bee.sync.persist:store
- name: repair_policy
  kind: security.policy
  meta: {type: test_support}
  policy: {actions: [registry.apply], resources: '*', effect: allow}
- name: repair_test
  kind: function.lua
  source: file://repair_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry, json]
  security: {policies: [bee.harness.profiles:repair_policy]}
  imports: {test: wippy.test:test, form: bee.harness.app:profile_form, editor: bee.harness.app:profile_editor, bounds: bee.values:bounds}
- name: reopen_test
  kind: function.lua
  source: file://reopen_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    agents: bee.harness.app:agents
    sessions: bee.threads.sessions.client:sessions
    protocol: bee.threads.sessions.types:protocol
- name: grants_migration_db
  kind: db.sql.sqlite
  file: .wippy/profile-grants-migration.db
  lifecycle: {auto_start: true}
  meta: {type: test_support}
- name: grants_migration_policy
  kind: security.policy
  policy: {actions: [db.get], resources: ['bee.harness.profiles:grants_migration_db'], effect: allow}
- name: grants_migration_test
  kind: function.lua
  source: file://grants_migration_test.lua
  method: run
  modules: [sql, hash, json, funcs]
  meta: {type: test, suite: bee}
  security: {policies: ['bee.harness.profiles:grants_migration_policy', 'bee.tests.support:schema_policy']}
  imports:
    test: wippy.test:test
    schema: bee.tests.support:schema
    grants: bee.approvals.grants:store
    authority: bee.harness.profiles.persist:grants
    bounds: bee.values:bounds

- name: test_delegated_write
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [bee.harness.profiles.write]
    resources: [saved-profile-workspace]
    effect: allow
- name: option_controls_test
  kind: function.lua
  source: file://option_controls_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    controls: bee.harness.app:option_controls
    bounds: bee.values:bounds
