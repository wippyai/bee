version: '1.0'
namespace: bee.hive.telemetry
entries:
- name: telemetry_test
  kind: function.lua
  source: file://telemetry_test.lua
  method: run
  meta:
    type: test
    suite: bee
  modules:
  - funcs
  imports:
    test: wippy.test:test
    types: bee.hive:types
    bounds: bee.values:bounds
    sampling: bee.hive.telemetry.binding:sampling
- name: holdings_test
  kind: function.lua
  source: file://holdings_test.lua
  method: run
  meta:
    type: test
    suite: bee
    timeout: 60s
  modules:
  - funcs
  - process
  - time
  imports:
    test: wippy.test:test
    leases: bee.app:host_leases
    bounds: bee.values:bounds
- name: cluster_test
  kind: function.lua
  source: file://cluster_test.lua
  method: run
  meta:
    type: test
    suite: bee
  imports:
    test: wippy.test:test
    types: bee.hive:types
    cluster: bee.hive.telemetry.binding:cluster
- name: status_test
  kind: function.lua
  source: file://status_test.lua
  method: run
  modules: [funcs, security]
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    status: bee.hive.telemetry.binding:status_model
    bounds: bee.values:bounds
    types: bee.hive:types
- name: gateway_only_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call]
    resources: [bee.gov.binding:contract_call]
    effect: allow
