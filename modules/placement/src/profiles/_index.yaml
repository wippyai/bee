version: '1.0'
namespace: bee.placement.profiles
entries:
- name: paths
  kind: library.lua
  source: file://paths.lua
  modules: [exec]
  imports:
    quote: bee.driver.kit:quote
- name: profiles
  kind: library.lua
  source: file://profiles.lua
  modules: [hash, registry]
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
- name: native
  kind: registry.entry
  meta: {type: bee.placement_profile, title: Native}
  data:
    schema_revision: bee.placement-profile@1
    placement_binding: bee.placement.native.binding:binding
