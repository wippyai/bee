version: '1.0'
namespace: bee.settings.app
entries:
- name: app
  kind: process.lua
  source: file://app.lua
  method: main
  modules:
  - tty
  - process
  - channel
  - uuid
  - time
  - json
  - funcs
  imports:
    frame: bee.app:frame
    appearance: bee.app:appearance
    view: bee.settings.app:view
    build_info: bee.settings:build_info
    client: bee.app:client
    super_edit: bee.gov.binding:super_edit_call
    live_updates: bee.settings.app:live_updates
  meta:
    type: bee.app
    application:
      api_version: 1
      title: Settings
      icon: S
      lifetime: view
      revision: '1'
      instance_policy: singleton
      group: Tools
      role: appearance
      resume_schema: settings.v1
      restart_policy: automatic
- name: view
  kind: library.lua
  source: file://view.lua
  modules:
  - tty
  imports:
    frame: bee.app:frame
    appearance: bee.app:appearance
    build_info: bee.settings:build_info
    live_updates: bee.settings.app:live_updates
- name: live_updates
  kind: library.lua
  source: file://live_updates.lua
  imports:
    bounds: bee.threads.records:bounds
    semver: bee.hub:semver
