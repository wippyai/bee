version: '1.0'
namespace: bee.git.worktree
entries:
- name: definition
  kind: ns.definition
  module: git-worktree
  readme: file://README.md
  meta:
    title: Bee Git worktree plugin
    comment: Git worktree management and repository metadata detection for Bee placement
- name: protected_namespace
  kind: ns.requirement
  meta:
    comment: Add the git-worktree namespace to the host trust map
  default: bee.git.worktree
  targets:
  - entry: bee.security.gov:protected_kernel
    path: .data.namespaces +=
- name: dependency_placement
  kind: ns.dependency
  component: bee/placement
  version: '*'
- name: dependency_driver
  kind: ns.dependency
  component: bee/driver
  version: '*'
- name: dependency_threads
  kind: ns.dependency
  component: bee/threads
  version: '*'
- name: target_executor
  kind: ns.requirement
  meta:
    comment: Host-selected native executor for git commands
  default: bee.git.worktree.env:git_executor
  targets:
  - entry: bee.git.worktree.env:executor_ref
    path: .resource_ref
- name: target_host_files
  kind: ns.requirement
  meta:
    comment: Host-selected filesystem volume for git metadata reading
  default: bee.git.worktree.env:host_files
  targets:
  - entry: bee.git.worktree.env:host_files_ref
    path: .resource_ref
