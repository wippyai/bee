version: '1.0'
namespace: bee
entries:
- name: gateway_admit_policy
  kind: security.policy
  meta:
    comment: A carrier admits and revokes gateway bindings for the actions it runs
  policy:
    actions:
    - bee.gateway.admit
    resources: '*'
    effect: allow
- name: gateway_materialize_policy
  kind: security.policy
  meta:
    comment: Attached to placement runner entries only; the runner receives a binding's token bytes once for the attempt it
      runs
  policy:
    actions:
    - bee.gateway.materialize
    - funcs.call
    resources:
    - '*'
    - bee.gateway.binding:materialize
    - bee.gateway.binding:check
    - bee.gateway.binding:revoke
    - bee.gateway.binding:seal
    effect: allow
- name: gateway_supervision_policy
  kind: security.policy
  meta:
    comment: Attached to placement service entries and the sweeper only; placement checks and retires the bindings of the
      attempts it supervises, independently of any carrier
  policy:
    actions:
    - bee.gateway.manage
    - funcs.call
    resources:
    - bindings
    - bee.gateway.binding:check
    - bee.gateway.binding:revoke_attempt
    - bee.gateway.binding:authorize_materialization
    effect: allow
- name: gateway_manage_policy
  kind: security.policy
  meta:
    comment: The managed host opens and drains the listener and may revoke any binding
  policy:
    actions:
    - bee.gateway.manage
    resources:
    - listener
    - bindings
    effect: allow
- name: gateway_tool_read_policy
  kind: security.policy
  meta:
    comment: The scope a bound subject runs thread_read, thread_wait and thread_sessions under; membership is still checked by the thread owner
  policy:
    actions:
    - funcs.call
    resources:
    - bee.threads.service:read_after
    - bee.threads.delivery:watch
    - bee.threads.service:get
    effect: allow
- name: gateway_tool_message_policy
  kind: security.policy
  meta:
    comment: The bound MCP subject may append only a decoded message through the thread authority and register a one-shot
      notice on its own thread; the endpoint supplies thread, action/attempt context and the addressed session, and reads
      membership through get so an unreadable session is never reached
  policy:
    actions:
    - funcs.call
    resources:
    - bee.threads.service:record
    - bee.threads.service:notify
    - bee.threads.service:get
    effect: allow
- name: gateway_tool_inbox_policy
  kind: security.policy
  meta: {comment: Bound agents call only action inbox owner methods; each method checks its own action, workspace and acceptance}
  policy:
    actions: [funcs.call]
    resources: [bee.threads.service:inbox_send, bee.threads.service:inbox_reply, bee.threads.service:inbox_list,
      bee.threads.service:inbox_ack, bee.threads.service:inbox_describe]
    effect: allow
- name: gateway_session_discover_policy
  kind: security.policy
  meta: {comment: Workspace peers may discover local action addresses through the owner; the owner checks the caller workspace}
  policy:
    actions: [bee.sessions.discover]
    resources: '*'
    effect: allow
- name: gateway_session_send_denied_policy
  kind: security.policy
  meta: {comment: No session send grant until the host selects an exact address policy}
  policy:
    actions: [bee.sessions.send]
    resources: [unassigned-session-address]
    effect: allow
- name: gateway_tool_launch_policy
  kind: security.policy
  meta:
    comment: The bound MCP subject may start only one host-allow-listed managed launch through the launch facade, as itself and in its own workspace; the facade reads the caller's own launch policy and refuses anything it does not name, and this grants no grant, credential, trait or overlay authority
  policy:
    actions:
    - funcs.call
    resources:
    - bee.harness.launch:agent_launch_call
    effect: allow
- name: gateway_tool_overlay_policy
  kind: security.policy.expr
  meta:
    comment: A bound MCP subject may author only through the overlay facade; the store enforces actor ownership and this grants no publication or activation authority
  policy:
    expression: '(action == "funcs.call" && resource == "bee.governance.binding:overlay_call") || ((action == "bee.governance.overlay.read" || action == "bee.governance.overlay.write") && resource != "")'
    actions:
    - funcs.call
    - bee.governance.overlay.read
    - bee.governance.overlay.write
    resources:
    - bee.governance.binding:overlay_call
    - '*'
    effect: allow

- name: gateway_tool_docs_policy
  kind: security.policy
  meta:
    comment: A bound MCP subject reads the one embedded documentation corpus through the docs facade; the volume is read-only and this grants no host path, registry write or network
  policy:
    actions: [funcs.call, fs.get, registry.get]
    resources: [bee.docs.binding:call, bee.docs:corpus_ref, bee:docs_corpus]
    effect: allow
- name: gateway_tool_components_policy
  kind: security.policy.expr
  meta:
    comment: A bound MCP subject may inspect effective installed component state, package previews and effect-free plans through the strict Hub facade; it receives no apply, publication or registry-write authority
  policy:
    expression: '(action == "funcs.call" && resource == "bee.hub.binding:call") || (action == "bee.hub.read" && resource != "")'
    actions: [funcs.call, bee.hub.read]
    resources: [bee.hub.binding:call, '*']
    effect: allow
- name: gateway_tool_delivery_policy
  kind: security.policy.expr
  meta:
    comment: A bound MCP subject may request delivery of its frozen artifact (publication prepare + destination stage/preflight) and read delivery status; the facade and the owner services enforce workspace, profile and destination authority
  policy:
    expression: '(action == "funcs.call" && resource == "bee.governance.binding:delivery_call") || ((action == "bee.governance.delivery.manage" || action == "bee.governance.delivery.read") && resource != "")'
    actions: [funcs.call, bee.governance.delivery.manage, bee.governance.delivery.read]
    resources: [bee.governance.binding:delivery_call, '*']
    effect: allow
- name: gateway_tool_publish_policy
  kind: security.policy.expr
  meta:
    comment: A bound MCP subject may publish only the exact locally reviewed and applied version; publication refuses anything else, and this grants no review, selection, approval or overlay authority
  policy:
    expression: '(action == "funcs.call" && resource == "bee.governance.binding:delivery_call") || (action == "bee.governance.delivery.publish" && resource != "")'
    actions: [funcs.call, bee.governance.delivery.publish]
    resources: [bee.governance.binding:delivery_call, '*']
    effect: allow
- name: gateway_tool_application_open_policy
  kind: security.policy
  meta:
    comment: A binding may open an already applied/admitted application through its own workspace host; this grants no activation, publication or registry write.
  policy:
    actions: [funcs.call]
    resources: [bee.applications:open_call]
    effect: allow
