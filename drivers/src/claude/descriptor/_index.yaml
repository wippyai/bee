version: '1.0'
namespace: bee.drivers.claude.descriptor
entries:
- name: cli
  kind: registry.entry
  meta:
    type: bee.driver.cli_descriptor
    comment: Claude Code command, stream-json codec, login evidence and version probe
  data:
    schema_revision: bee.driver.cli-descriptor@4
    provider: claude
    executable: claude
    version_probe:
      argv:
      - --version
      pattern: ([0-9]+[.][0-9]+[.][0-9]+)
    login_evidence:
      command: claude auth login
      any_of:
      - kind: file_exists
        paths:
        - .claude/.credentials.json
        variable: CLAUDE_CONFIG_DIR
        directory: .claude
      - kind: env_present
        names:
        - ANTHROPIC_API_KEY
        - CLAUDE_CODE_OAUTH_TOKEN
      - kind: auth_status
        argv:
        - auth
        - status
        success_exit_code: 0
        timeout_ms: 3000
    platform:
      os:
      - linux
      - darwin
      arch:
      - x86_64
      - amd64
      - arm64
      - aarch64
    codec: claude-stream-json
    json_paths:
      resume_id:
      - session_id
      result_text:
      - result
      errors:
      - terminal_reason
      usage:
      - usage
    configure: claude
    subscription_variables: [CLAUDE_CODE_OAUTH_TOKEN]
    endpoints:
    - protocol: anthropic-messages
      environment:
        ANTHROPIC_BASE_URL: base_url
    capabilities:
      permission_answers:
        window:
          transport: hook_http
          adapter_ref: bee.drivers.permission:permission_request_hook
        first_turn:
          transport: stdio
          adapter_ref: bee.drivers.claude.permission:permission_adapter
        resume:
          transport: stdio
          adapter_ref: bee.drivers.claude.permission:permission_adapter
    options:
      unattended:
        permission_mode: bypassPermissions
      profiles:
      - session
      - batch
      - window
      fields:
        permission_mode:
          default: manual
          invalid: permission_mode is not one Bee admits
          path: provider.permission_mode
          value_schema:
            type: string
            enum:
            - manual
            - acceptEdits
            - auto
            - dontAsk
            - plan
            - bypassPermissions
          label: Permission mode
          description: CLI permission mode
          section: advanced
          order: 0
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --permission-mode
            version_range: '>=2.1.296'
          render:
          - kind: argv
            contexts:
            - window
            tokens:
            - --permission-mode
            - field: permission_mode
          - kind: argv
            contexts:
            - first_turn
            tokens:
            - --permission-mode
            - field: permission_mode
          - kind: argv
            contexts:
            - resume
            tokens:
            - --permission-mode
            - field: permission_mode
          id: permission_mode
          group: access/trust
          security_class: host-ceiling
          capabilities:
            manual:
            - prompt
            acceptEdits:
            - prompt
            - edit
            auto:
            - automatic
            dontAsk:
            - deny-unapproved
            plan:
            - read
            bypassPermissions:
            - bypass
          ceiling:
          - prompt
          - edit
          - automatic
          - deny-unapproved
          - read
          config_aliases:
          - format: json
            path:
            - permissions
            - defaultMode
          person_values:
          - bypassPermissions
          consent_message: 'All allowed: Claude bypasses tool permission checks.'
        model:
          invalid: model is not one bounded model identifier
          path: provider.model
          value_schema:
            type: string
            format: model
          label: Model
          description: CLI model
          section: basic
          order: 1
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --model
          render:
          - kind: argv
            contexts:
            - window
            tokens:
            - if: model
              then:
              - --model
              - field: model
          - kind: argv
            contexts:
            - first_turn
            tokens:
            - if: model
              then:
              - --model
              - field: model
          - kind: argv
            contexts:
            - resume
            tokens:
            - if: model
              then:
              - --model
              - field: model
          id: model
          group: model/provider
          security_class: free
        effort:
          invalid: effort is not one Bee admits
          path: provider.effort
          value_schema:
            type: string
            enum:
            - low
            - medium
            - high
            - xhigh
            - max
          label: Effort
          description: CLI effort
          section: basic
          order: 2
          contexts:
          - window
          - first_turn
          - resume
          support:
            help_probe:
              argv:
              - --help
              flag: --effort
          render:
          - kind: argv
            contexts:
            - window
            tokens:
            - if: effort
              then:
              - --effort
              - field: effort
          - kind: argv
            contexts:
            - first_turn
            tokens:
            - if: effort
              then:
              - --effort
              - field: effort
          - kind: argv
            contexts:
            - resume
            tokens:
            - if: effort
              then:
              - --effort
              - field: effort
          id: effort
          group: model/provider
          security_class: free
        permission_exchange:
          type: boolean
          default: false
          profiles:
          - session
          - batch
          unsupported: stdio permission exchange is only supported for structured turns
        control_enabled:
          type: boolean
          default: false
          profiles:
          - session
          - batch
          unsupported: stream-json control is only supported for structured turns
        resume_ref:
          type: id
          forbid_option: true
          invalid: resume_ref is not an identifier
        gateway_tools:
          type: ids
          default: []
        gateway_hooks:
          type: ids
          default: []
        system_prompt_append:
          path: provider.system_prompt_append
          value_schema:
            type: string
            maxLength: 4096
          label: System prompt append
          description: Additional instructions in the session private home
          section: advanced
          order: 100
          contexts:
          - window
          - first_turn
          - resume
          support:
            config_schema_ref: bee.drivers.claude.descriptor:cli
          render:
          - kind: config
            contexts:
            - window
            - first_turn
            - resume
            file: .bee/system-prompt-append.txt
            format: text
            path: []
            merge: append
            value:
              field: provider.system_prompt_append
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - --append-system-prompt-file
            - field: system_prompt_file
          id: system_prompt_append
          group: behavior
          security_class: free
        folder_trust:
          id: folder_trust
          path: provider.options.folder_trust
          value_schema:
            type: string
            enum:
            - ask
            - approved-workdir
          default: ask
          label: Folder trust
          description: Trust only the canonical launch workdir in the isolated agent home
          group: access/trust
          security_class: person-only
          section: advanced
          order: 90
          contexts:
          - window
          - first_turn
          - resume
          support:
            config_schema_ref: bee.drivers.claude.descriptor:cli
          render: []
          trust:
            file: .claude/.claude.json
            format: json
            key: hasTrustDialogAccepted
            value: true
            repository_root: true
            project_config:
            - .claude/settings.json
            - .claude/settings.local.json
            - .mcp.json
        fallback_models:
          id: fallback_models
          path: provider.options.fallback_models
          value_schema:
            type: array
            maxItems: 32
            items:
              type: string
              maxLength: 4096
          label: Fallback models
          description: Claude fallback models (inherits the CLI default when unset)
          group: model/provider
          security_class: free
          section: advanced
          order: 200
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --fallback-model
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - if: fallback_models
              then:
              - --fallback-model
              - join:
                  field: fallback_models
                  separator: ','
        system_prompt:
          id: system_prompt
          path: provider.options.system_prompt
          value_schema:
            type: string
            maxLength: 4096
          label: System prompt
          description: Claude system prompt (inherits the CLI default when unset)
          group: behavior
          security_class: host-ceiling
          section: advanced
          order: 201
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --system-prompt
          capabilities:
          - profile-option
          ceiling: []
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - --system-prompt
            - field: system_prompt
          conflicts:
          - system_prompt_append
        agent:
          id: agent
          path: provider.options.agent
          value_schema:
            type: string
            maxLength: 4096
          label: Agent
          description: Claude agent (inherits the CLI default when unset)
          group: behavior
          security_class: host-ceiling
          section: advanced
          order: 202
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --agent
          capabilities:
          - profile-option
          ceiling: []
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - --agent
            - field: agent
        agents:
          id: agents
          path: provider.options.agents
          value_schema:
            type: object
            maxProperties: 16
            additionalProperties:
              type: object
              additionalProperties: false
              required:
              - description
              - prompt
              properties:
                description:
                  type: string
                  maxLength: 4096
                prompt:
                  type: string
                  maxLength: 4096
                tools:
                  type: array
                  maxItems: 32
                  items:
                    type: string
                    maxLength: 4096
                disallowedTools:
                  type: array
                  maxItems: 32
                  items:
                    type: string
                    maxLength: 4096
                model:
                  type: string
                  maxLength: 4096
                skills:
                  type: array
                  maxItems: 32
                  items:
                    type: string
                    maxLength: 4096
          label: Agents
          description: Claude agents (inherits the CLI default when unset)
          group: behavior
          security_class: host-ceiling
          section: advanced
          order: 203
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --agents
          capabilities:
          - profile-option
          ceiling: []
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - --agents
            - field: agents
              encoding: json
        autocompact:
          id: autocompact
          path: provider.options.autocompact
          value_schema:
            type: string
            maxLength: 32
          pattern:
          - '^auto$'
          - '^0*[1-9][0-9][0-9][kK]$'
          - '^0*1000[kK]$'
          - '^0*1[mM]$'
          - '^0*[1-9][0-9][0-9][0-9][0-9][0-9]$'
          - '^0*1000000$'
          label: Autocompact
          description: Claude autocompact (inherits the CLI default when unset)
          group: behavior
          security_class: free
          section: advanced
          order: 204
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --autocompact
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - --autocompact
            - field: autocompact
        budget_usd:
          id: budget_usd
          path: provider.options.budget_usd
          value_schema:
            type: string
            maxLength: 32
          pattern:
          - '^0*[1-9][0-9]*%.?[0-9]*$'
          - '^0*%.0*[1-9][0-9]*$'
          label: Budget USD
          description: Claude budget in USD (inherits the CLI default when unset)
          group: behavior
          security_class: host-ceiling
          section: advanced
          order: 205
          contexts:
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --max-budget-usd
          capabilities: []
          ceiling: []
          render:
          - kind: argv
            contexts:
            - first_turn
            - resume
            tokens:
            - --max-budget-usd
            - field: budget_usd
        prompt_snapshot:
          id: prompt_snapshot
          path: provider.options.prompt_snapshot
          value_schema:
            type: string
            enum:
            - 'on'
            - 'off'
          label: Prompt snapshot
          description: Claude prompt snapshot (inherits the CLI default when unset)
          group: behavior
          security_class: free
          section: advanced
          order: 206
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --system-prompt-snapshot
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - --system-prompt-snapshot
            - field: prompt_snapshot
        exclude_dynamic_prompt:
          id: exclude_dynamic_prompt
          path: provider.options.exclude_dynamic_prompt
          value_schema:
            type: boolean
          label: Exclude dynamic prompt
          description: Claude exclude dynamic prompt (inherits the CLI default when unset)
          group: behavior
          security_class: free
          section: advanced
          order: 207
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --exclude-dynamic-system-prompt-sections
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - if: exclude_dynamic_prompt
              then:
              - --exclude-dynamic-system-prompt-sections
        brief_mode:
          id: brief_mode
          path: provider.options.brief_mode
          value_schema:
            type: boolean
          label: Brief mode
          description: Claude brief mode (inherits the CLI default when unset)
          group: behavior
          security_class: free
          section: advanced
          order: 208
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --brief
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - if: brief_mode
              then:
              - --brief
        prompt_suggestions:
          id: prompt_suggestions
          path: provider.options.prompt_suggestions
          value_schema:
            type: boolean
          label: Prompt suggestions
          description: Claude prompt suggestions (inherits the CLI default when unset)
          group: behavior
          security_class: free
          section: advanced
          order: 209
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --prompt-suggestions
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - if: prompt_suggestions
              equals: false
              then:
              - --prompt-suggestions
              - 'false'
              else:
              - if: prompt_suggestions
                then:
                - --prompt-suggestions
                - 'true'
        permission_bypass:
          id: permission_bypass
          path: provider.options.permission_bypass
          value_schema:
            type: boolean
          label: Permission bypass
          description: Claude permission bypass (inherits the CLI default when unset)
          group: access/trust
          security_class: host-ceiling
          section: advanced
          order: 210
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --dangerously-skip-permissions
          capabilities:
            'false': []
            'true':
            - bypass
          ceiling: []
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - if: permission_bypass
              then:
              - --dangerously-skip-permissions
          person_values:
          - true
          consent_message: 'All allowed: Claude bypasses tool permission checks.'
        allow_permission_bypass:
          id: allow_permission_bypass
          path: provider.options.allow_permission_bypass
          value_schema:
            type: boolean
          label: Allow permission bypass
          description: Claude allow permission bypass (inherits the CLI default when unset)
          group: access/trust
          security_class: host-ceiling
          section: advanced
          order: 211
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --allow-dangerously-skip-permissions
          capabilities:
            'false': []
            'true':
            - bypass
          ceiling: []
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - if: allow_permission_bypass
              then:
              - --allow-dangerously-skip-permissions
          person_values:
          - true
          consent_message: Enables switching to permission bypass during the session.
        permission_prompts:
          id: permission_prompts
          path: provider.options.permission_prompts
          value_schema:
            type: string
            enum:
            - host
            - none
          label: Permission prompts
          description: Claude permission prompts (inherits the CLI default when unset)
          group: access/trust
          security_class: host-ceiling
          section: advanced
          order: 212
          contexts:
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --permission-prompts
          capabilities:
            host: []
            none:
            - profile-option
          ceiling: []
          render:
          - kind: argv
            contexts:
            - first_turn
            - resume
            tokens:
            - --permission-prompts
            - field: permission_prompts
        tools:
          id: tools
          path: provider.options.tools
          value_schema:
            type: array
            maxItems: 32
            items:
              type: string
              maxLength: 4096
          label: Tools
          description: Claude tools (inherits the CLI default when unset)
          group: access/trust
          security_class: host-ceiling
          section: advanced
          order: 213
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --tools
          capabilities:
          - profile-option
          ceiling: []
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - if: tools
              then:
              - --tools
              - join:
                  field: tools
                  separator: ','
              else:
              - --tools=
        tool_allow:
          id: tool_allow
          path: provider.tool_allow
          value_schema:
            type: array
            maxItems: 32
            items:
              type: string
              maxLength: 4096
          label: Tool allow
          description: Claude tool allow (inherits the CLI default when unset)
          group: access/trust
          security_class: host-ceiling
          section: advanced
          order: 214
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --allowedTools
          capabilities:
          - profile-option
          ceiling: []
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - if: tool_allow
              then:
              - --allowedTools
              - join:
                  field: tool_allow
                  separator: ','
        tool_deny:
          id: tool_deny
          path: provider.tool_deny
          value_schema:
            type: array
            maxItems: 32
            items:
              type: string
              maxLength: 4096
          label: Tool deny
          description: Claude tool deny (inherits the CLI default when unset)
          group: access/trust
          security_class: host-ceiling
          section: advanced
          order: 215
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --disallowedTools
          capabilities: []
          ceiling: []
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - if: tool_deny
              then:
              - --disallowedTools
              - join:
                  field: tool_deny
                  separator: ','
        additional_dirs:
          id: additional_dirs
          path: provider.options.additional_dirs
          value_schema:
            type: array
            maxItems: 32
            items:
              type: string
              maxLength: 4096
          label: Additional dirs
          description: Claude additional dirs (inherits the CLI default when unset)
          group: access/trust
          security_class: host-ceiling
          section: advanced
          order: 216
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --add-dir
          capabilities:
          - profile-option
          ceiling: []
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - if: additional_dirs
              then:
              - --add-dir
              - each:
                  field: additional_dirs
        mcp_servers:
          id: mcp_servers
          path: provider.options.mcp_servers
          value_schema:
            type: object
            additionalProperties: false
            properties:
              mcpServers:
                type: object
                maxProperties: 16
                additionalProperties:
                  type: object
                  additionalProperties: false
                  properties:
                    type:
                      type: string
                      enum:
                      - stdio
                      - http
                      - sse
                    command:
                      type: string
                      maxLength: 4096
                    args:
                      type: array
                      maxItems: 32
                      items:
                        type: string
                        maxLength: 4096
                    url:
                      type: string
                      maxLength: 4096
            required:
            - mcpServers
          label: Mcp servers
          description: Claude mcp servers (inherits the CLI default when unset)
          group: tools/integrations
          security_class: host-ceiling
          section: advanced
          order: 217
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --mcp-config
          capabilities:
          - profile-option
          - network
          ceiling: []
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - --mcp-config
            - field: mcp_servers
              encoding: json
        strict_mcp:
          id: strict_mcp
          path: provider.options.strict_mcp
          value_schema:
            type: boolean
          label: Strict mcp
          description: Claude strict mcp (inherits the CLI default when unset)
          group: tools/integrations
          security_class: host-ceiling
          section: advanced
          order: 218
          contexts:
          - window
          - first_turn
          - resume
          support:
            version_range: '>=2.1.296'
            help_probe:
              argv:
              - --help
              flag: --strict-mcp-config
          capabilities:
            'false':
            - profile-option
            'true': []
          ceiling: []
          render:
          - kind: argv
            contexts:
            - window
            - first_turn
            - resume
            tokens:
            - if: strict_mcp
              then:
