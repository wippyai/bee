version: '1.0'
namespace: bee.console.env
entries:
- name: executor
  kind: exec.native
  default_env:
    PATH: ${env:bee.console.env:path}
    HOME: ${env:bee.console.env:home}
    USER: ${env:bee.console.env:user|}
    LANG: ${env:bee.console.env:lang}
    TERM: xterm-256color
- name: environment
  kind: env.storage.os
  lifecycle:
    auto_start: true
- name: path
  kind: env.variable
  storage: bee.console.env:environment
  variable: PATH
  default: /usr/local/bin:/usr/bin:/bin
  readonly: true
- name: home
  kind: env.variable
  storage: bee.console.env:environment
  variable: HOME
  default: /
  readonly: true
- name: user
  kind: env.variable
  storage: bee.console.env:environment
  variable: USER
  default: ''
  readonly: true
- name: lang
  kind: env.variable
  storage: bee.console.env:environment
  variable: LANG
  default: C.UTF-8
  readonly: true
