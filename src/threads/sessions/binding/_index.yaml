version: '1.0'
namespace: bee.threads.sessions.binding
entries:
- name: owner_binding
  kind: contract.binding
  meta:
    type: bee.sessions.owner_binding
  contracts:
  - contract: bee.threads.sessions:contract
    default: true
    methods:
      open: bee.threads.sessions.binding:open
      run: bee.threads.sessions.binding:run
      send: bee.threads.sessions.binding:send
      await: bee.threads.sessions.binding:await
      join: bee.threads.sessions.binding:join
      get: bee.threads.sessions.binding:get
      list: bee.threads.sessions.binding:list
      history: bee.threads.sessions.binding:history
      cancel: bee.threads.sessions.binding:cancel
      close: bee.threads.sessions.binding:close
- name: catalog_binding
  kind: contract.binding
  meta:
    type: bee.sessions.catalog_binding
  contracts:
  - contract: bee.threads.sessions:catalog
    default: true
    methods:
      list: bee.threads.sessions.binding:catalog
- name: open
  kind: function.lua
  source: file://owner.lua
  method: open
  modules:
  - logger
  - json
  - security
  - hash
  - funcs
  - time
  - system
  imports:
    bounds: bee.values:bounds
    canonical: bee.values:canonical
    journal: bee.threads.sessions.binding:threads_journal
    cancellation: bee.threads.sessions.binding:cancellation
    admission: bee.harness.launch:admission
    catalog_service: bee.threads.sessions.binding:catalog_service
    budget_values: bee.threads.records:budgets
    profile_values: bee.harness.profiles:protocol
    session_protocol: bee.threads.sessions.types:protocol
    record_values: bee.threads.records:values
    remote: bee.threads.sessions.binding:remote
  security:
    policies: &id001
    - bee.threads.security:sessions_owner
    - bee.threads.sessions.security:owner_registry_read_policy
    - bee.harness.security:carrier_environment_policy
    - bee.threads.sessions.security:owner_admission_policy
    - bee.threads.sessions.security:owner_setup_policy
    - bee.threads.sessions.security:owner_workspace_identity_policy
    - bee.harness.security:profile_workspace_policy
    - bee.threads.sessions.security:owner_delivery_policy
  meta:
    application_ref: bee.harness.app:app
    hive: policy
    hive_service: sessions
    hive_operation:
      name: open
      revision: '1'
      effect: mutation
      input:
        type: object
        additionalProperties: false
        required:
        - spec
        - operation_key
        properties:
          spec:
            type: object
            additionalProperties: false
            required:
            - definition
            properties:
              definition:
                type: string
                minLength: 1
                maxLength: 256
              profile:
                type: object
                additionalProperties: false
                required:
                - id
                - revision
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 256
                  revision:
                    type: integer
                    minimum: 1
              workdir:
                type: object
                additionalProperties: false
                description: 'The working folder: a folder under an admitted node root. The stock root bee.node:machine is
                  the machine root /, so path is the folder''s absolute path without its leading slash.'
                properties:
                  root_ref:
                    type: string
                    minLength: 1
                    maxLength: 256
                  path:
                    type: string
                    maxLength: 4096
                required:
                - root_ref
                - path
              workspace:
                type: string
                pattern: ^[0-9a-f]{32}$
          operation_key:
            type: string
            minLength: 1
            maxLength: 128
      output:
        oneOf:
        - type: object
          additionalProperties: false
          required:
          - ok
          - value
          properties:
            ok:
              const: true
            value:
              type: object
        - type: object
          additionalProperties: false
          required:
          - ok
          - error
          properties:
            ok:
              const: false
            error:
              type: object
              additionalProperties: false
              required:
              - code
              - message
              - retry
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 128
                message:
                  type: string
                  maxLength: 16384
                retry:
                  enum:
                  - never
                  - same_key
                  - refresh
                  - reconcile
                operation_key:
                  type: string
                  minLength: 1
                  maxLength: 128
                operation:
                  allOf:
                  - type: string
                    minLength: 1
                    maxLength: 256
                  - pattern: ^bo:[^:]+:[^:]+:[^:]+$
                current_revision:
                  type: integer
                  minimum: 1
                evidence:
                  type: object
                  additionalProperties: false
                  required:
                  - summary
                  - artifacts
                  properties:
                    summary:
                      type: string
                      maxLength: 16384
                    artifacts:
                      type: array
                      maxItems: 64
                      items:
                        type: string
                        minLength: 1
                        maxLength: 256
                retry_after_ms:
                  type: integer
                  minimum: 0
    hive_alias: session_open
