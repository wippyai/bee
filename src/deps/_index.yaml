version: '1.0'
namespace: bee.deps
entries:
- name: persist
  kind: ns.dependency
  component: bee/persist
  version: 0.1.0-dev
- name: sync
  kind: ns.dependency
  component: bee/sync
  version: 0.1.0-dev
  parameters:
  - name: target_sender
    value: bee.hive.service:replica_sender
  - name: target_exports
    value: bee:sync_exports
- name: threads
  kind: ns.dependency
  component: bee/threads
  version: 0.1.0-dev
  parameters:
  - name: process_host
    value: bee:workers
  - name: waiter_policies
    value:
    - bee.security.threads:thread_waiter_policy
  - name: sender
    value: bee.hive.service:inbox_sender
- name: hub
  kind: ns.dependency
  component: bee/hub
  version: 0.1.0-dev
  parameters:
  - name: process_host
    value: bee:workers
  - name: target_publish_configuration
    value: bee:hub_publication
- name: gov
  kind: ns.dependency
  component: bee/gov
  version: 0.1.0-dev
  parameters:
  - name: target_db
    value: bee.gov:db
  - name: target_publication_profiles
    value: bee.env:gov_publication_profiles
  - name: target_activation_profiles
    value: bee.env:gov_activation_profiles
  - name: target_approval_request_policy
    value: bee.security.approvals:approval_request_policy
  - name: target_approval_consume_policy
    value: bee.security.approvals:approval_consume_policy
  - name: target_workspace_folder_read
    value: bee.workspace.catalog:read
  - name: target_workspace_folder_policy
    value: bee.security.gov:workspace_folder_read_policy
- name: gateway
  kind: ns.dependency
  component: bee/gateway
  version: 0.1.0-dev
  parameters:
  - name: target_db
    value: bee.gateway:db
  - name: target_listener
    value: bee:gateway_listener
  - name: target_endpoint
    value: bee:gateway_endpoint
  - name: target_approval_request_policy
    value: bee.security.approvals:approval_request_policy
  - name: target_approval_consume_policy
    value: bee.security.approvals:approval_consume_policy
  - name: target_tool_read_policy
    value: bee.security.gateway:gateway_tool_read_policy
  - name: target_tool_message_policy
    value: bee.security.gateway:gateway_tool_message_policy
  - name: target_tool_overlay_policy
    value: bee.security.gateway:gateway_tool_overlay_policy
  - name: target_tool_docs_policy
    value: bee.security.gateway:gateway_tool_docs_policy
  - name: target_tool_components_policy
    value: bee.security.gateway:gateway_tool_components_policy
  - name: target_tool_delivery_policy
    value: bee.security.gateway:gateway_tool_delivery_policy
  - name: target_tool_publish_policy
    value: bee.security.gateway:gateway_tool_publish_policy
  - name: target_tool_application_open_policy
    value: bee.security.gateway:gateway_tool_application_open_policy
  - name: target_tool_install_policy
    value: bee.security.gateway:gateway_tool_install_policy
  - name: target_tool_session_policy
    value: bee.security.gateway:gateway_tool_session_policy
  - name: target_install_configuration
    value: bee:module_installation
  - name: target_tool_hub_publish_policy
    value: bee.security.gateway:gateway_tool_hub_publish_policy
  - name: target_publish_configuration
    value: bee:module_publication
- name: hive
  kind: ns.dependency
  component: bee/hive
  version: 0.1.0-dev
- name: hive_telemetry
  kind: ns.dependency
  component: bee/hive-telemetry
  version: 0.1.0-dev
  parameters:
  - name: target_exposure
    value: bee.security.hive:hive_exposure_policy
- name: hive_manager
  kind: ns.dependency
  component: bee/hive-manager
  version: 0.1.0-dev
- name: threads_timeline
  kind: ns.dependency
  component: bee/threads-timeline
  version: 0.1.0-dev
- name: workspace_manager
  kind: ns.dependency
  component: bee/workspace-manager
  version: 0.1.0-dev
- name: host_processes
  kind: ns.dependency
  component: bee/host-processes
  version: 0.1.0-dev
- name: hub_modules
  kind: ns.dependency
  component: bee/hub-modules
  version: 0.1.0-dev
- name: gov_overlays
  kind: ns.dependency
  component: bee/gov-overlays
  version: 0.1.0-dev
- name: approvals_inbox
  kind: ns.dependency
  component: bee/approvals-inbox
  version: 0.1.0-dev
- name: files
  kind: ns.dependency
  component: bee/files
  version: 0.1.0-dev
  parameters:
  - name: target_workspace_root
    value: bee.env:files_root
- name: application
  kind: ns.dependency
  component: bee/application
  version: 0.1.0-dev
- name: node
  kind: ns.dependency
  component: bee/node
  version: 0.1.0-dev
- name: docs
  kind: ns.dependency
  component: bee/docs
  version: 0.1.0-dev
  parameters:
  - name: target_corpus
    value: bee:docs_corpus
- name: approvals
  kind: ns.dependency
  component: bee/approvals
  version: 0.1.0-dev
  parameters:
  - name: target_db
    value: bee.approvals:db
  - name: target_policies
    value: bee:approver_policies
  - name: process_host
    value: bee:workers
  - name: authority_policies
    value:
    - bee.security.approvals:approval_store_policy
    - bee.security.approvals:approval_owner_policy
  - name: worker_policies
    value:
    - bee.security.approvals:approval_store_policy
    - bee.security.approvals:approval_owner_policy
    - bee.security.threads:thread_approval_policy
    - bee.security.threads:thread_approval_client_policy
- name: capability
  kind: ns.dependency
  component: bee/capability
  version: 0.1.0-dev
- name: agents
  kind: ns.dependency
  component: bee/agents
  version: 0.1.0-dev
- name: placement_native
  kind: ns.dependency
  component: bee/placement-native
  version: 0.1.0-dev
  parameters:
  - name: target_workdir_preparers
    value: bee:workdir_preparers
- name: placement_docker
  kind: ns.dependency
  component: bee/placement-docker
  version: '*'
  parameters:
  - name: process_host
    value: bee:workers
  - name: environment_provisioning
    value:
      network: bee-coding
      endpoint: bee:gateway_endpoint
      listener: bee:gateway_listener
      approval_policy: docker-environment
      readiness_policy: bee.gateway.security:readiness_policy
  - name: image_owner_policies
    value:
    - bee.placement.native.security:placement_store_policy
    - bee.placement.native.security:placement_exec_policy
    - bee.placement.native.security:placement_runner_policy
    - bee.placement.docker.security:docker_policy
    - bee.placement.docker.security:docker_socket_policy
    - bee.placement.docker.security:image_policy
    - bee.placement.docker.security:image_client_policy
    - bee.placement.docker.security:environment_owner_policy
    - bee.placement.docker.security:environment_listener_policy
