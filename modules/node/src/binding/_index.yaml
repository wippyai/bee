version: '1.0'
namespace: bee.node.binding
entries:
- name: node
  kind: library.lua
  source: file://node.lua
  modules: [system, security, hash]
  imports:
    protocol: bee.node:protocol
    resources: bee.node.registry:resources
    sync: bee.sync.persist:store
    transaction: bee.persist:transaction
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    appearance: bee.application:appearance
- name: local
  kind: contract.binding
  contracts:
  - contract: bee.node:contract
    methods:
      get_appearance: bee.node.binding:get_appearance
      update_appearance: bee.node.binding:update_appearance
      describe: bee.node.binding:describe
      update_metadata: bee.node.binding:update_metadata
      snapshot: bee.node.binding:snapshot
      read_after: bee.node.binding:read_after
- name: describe
  kind: function.lua
  source: file://describe_method.lua
  method: handle
  imports: {service: bee.node.binding:node}
  security: {policies: [bee.node.security:database_policy, bee.node.security:store_policy]}
  meta:
    type: tool
    title: Describe node
    hive: policy
    hive_operation:
      revision: '1'
      title: Describe node
      input: {type: object, properties: {}, additionalProperties: false}
      output: &node_reply
        type: object
        additionalProperties: false
        properties:
          ok: {type: boolean}
          code: {type: string}
          message: {type: string}
          value: {}
          replayed: {type: boolean}
          commit: {type: boolean}
    llm_alias: BeeNodeDescribe
    llm_description: Read the current node's identity and editable metadata.
    input_schema: '{"type":"object","properties":{},"additionalProperties":false}'
- name: update_metadata
  kind: function.lua
  source: file://update_metadata_method.lua
  method: handle
  imports: {service: bee.node.binding:node}
  security: {policies: [bee.node.security:database_policy, bee.node.security:store_policy]}
  meta:
    type: tool
    title: Update node description
    hive: policy
    hive_operation:
      revision: '1'
      title: Update node description
      input:
        type: object
        additionalProperties: false
        required: [expected_revision, idempotency_key, metadata]
        properties:
          expected_revision: {type: integer, minimum: 0}
          idempotency_key: {type: string, minLength: 1, maxLength: 160}
          metadata:
            type: object
            additionalProperties: false
            required: [display_name]
            properties:
              display_name: {type: string, minLength: 1, maxLength: 80}
              description: {type: string, maxLength: 512}
              labels: {type: object, maxProperties: 16, additionalProperties: {type: string, maxLength: 80}}
      output: *node_reply
    llm_alias: BeeNodeUpdateMetadata
    llm_description: Replace the node display name, description and labels using the current revision and a stable retry key. Requires host authorization; cannot change identity or permissions.
    input_schema: |
      {"type":"object","properties":{"expected_revision":{"type":"integer","minimum":0},"idempotency_key":{"type":"string","minLength":1,"maxLength":160},"metadata":{"type":"object","properties":{"display_name":{"type":"string","minLength":1,"maxLength":80},"description":{"type":"string","maxLength":512},"labels":{"type":"object","maxProperties":16,"additionalProperties":{"type":"string","maxLength":80}}},"required":["display_name"],"additionalProperties":false}},"required":["expected_revision","idempotency_key","metadata"],"additionalProperties":false}
- name: snapshot
  kind: function.lua
  source: file://snapshot_method.lua
  method: handle
  imports: {service: bee.node.binding:node}
  security: {policies: [bee.node.security:database_policy, bee.node.security:store_policy]}
  meta:
    hive: policy
    hive_operation:
      revision: '1'
      title: Node description snapshot
      input: {type: object, properties: {}, additionalProperties: false}
      output: *node_reply
- name: read_after
  kind: function.lua
  source: file://read_after_method.lua
  method: handle
  imports: {service: bee.node.binding:node}
  security: {policies: [bee.node.security:database_policy, bee.node.security:store_policy]}
  meta:
    hive: policy
    hive_operation:
      revision: '1'
      title: Node description changes
      input:
        type: object
        additionalProperties: false
        required: [cursor]
        properties:
          cursor: {type: integer, minimum: 0}
          limit: {type: integer, minimum: 1, maximum: 64}
      output: *node_reply
- name: get_appearance
  kind: function.lua
  source: file://get_appearance_method.lua
  method: handle
  imports: {service: bee.node.binding:node}
  security: {policies: [bee.node.security:database_policy, bee.node.security:store_policy]}
- name: update_appearance
  kind: function.lua
  source: file://update_appearance_method.lua
  method: handle
  imports: {service: bee.node.binding:node}
  security: {policies: [bee.node.security:database_policy, bee.node.security:store_policy]}
