version: '1.0'
namespace: bee.security
entries:
- name: application_admission
  kind: registry.entry
  bindings:
  - definition_id: bee.settings.app:app
    policies: [bee.security:ordinary_app_subsystem_boundary, bee.security:settings_edit_mode_policy, bee.security:settings_hub_status_policy]
    appearance_write: true
  - definition_id: bee.console.app:app
    policies:
    - bee.security:ordinary_app_subsystem_boundary
    - bee.console.security:executor_policy
    - bee.console.security:command_policy
  - definition_id: bee.approvals.inbox.app:app
    policies:
    - bee.security:ordinary_app_subsystem_boundary
    - bee.security.approvals:approval_decide_policy
    - bee.security.gov:governance_delivery_lease_policy
    - bee.approvals.inbox.security:client_policy
    - bee.security.storage:workspace_catalog_read_policy
- name: base_app_policy
  kind: security.policy.expr
  meta:
    comment: Ordinary apps may read the nonsecret terminal color preference; no other environment access is granted
  policy:
    expression: 'action == "process.send" || (action == "env.get" && resource == "bee.env:no_color")'
    actions: [process.send, env.get]
    resources: '*'
    effect: allow
- name: app_boundary_policy
  kind: security.policy
  policy:
    actions:
    - process.security
    - security.scope.create
    - security.policy.get
    - process.context
    - registry.apply
    - registry.apply_version
    - registry.overlay.apply
    resources: '*'
    effect: deny
- name: scope_managing_app_boundary
  kind: security.policy
  meta:
    comment: Default denial for the host-selected native execution actor, which may manage call scopes under its reviewed admission policy.
  policy:
    actions: [process.security, security.policy.get, process.context, registry.apply, registry.apply_version, registry.overlay.apply]
    resources: '*'
    effect: deny
- name: core_spawn_boundary
  kind: security.policy
  policy:
    actions:
    - process.spawn
    - process.spawn.monitored
    - process.spawn.linked
    - process.exec
    - process.host
    resources:
    - bee.host:main
    - bee.workspace:main
    - bee.workspace:launch
    - bee.client.service:main
    - bee.client.service:local
    - bee.client.service:local_command
    - bee.client.service:local_application
    - bee.client.service:desktop
    - bee.client.service:application
    - bee.launch:supervisor
    - bee.launch:headless
    - bee.desktop.service:main
    - bee.apps:broker
    - bee.terminal.service:main
    - bee.hive:supervisor
    - bee.hive.supervisor:main
    - bee.hive.service:supervisor_host
    effect: deny
- name: ordinary_app_subsystem_boundary
  kind: security.policy
  meta:
    comment: Host-selected boundary for ordinary applications; native execution components receive reviewed policies
      separately
  policy:
    actions:
    - db.get
    resources:
    - bee.placement.native.env:db
    - bee.resources.env:db
    - bee.credentials.env:db
    - bee.gov.env:db
    effect: deny
- name: settings_edit_mode_policy
  kind: security.policy
  meta:
    comment: Bee Settings may request the protected host edit-mode operation; the governance facade validates the broker-minted Settings actor
  policy:
    actions: [funcs.call]
    resources: [bee.gov.binding:super_edit_call]
    effect: allow
- name: settings_hub_status_policy
  kind: security.policy
  meta:
    comment: Settings may read the host-selected binary identity and live Bee pack versions through the read-only Hub status operation
  policy:
    actions: [funcs.call, bee.hub.read, env.get]
    resources: [bee.hub.binding:call, updates, bee.env:binary_native_module, bee.env:binary_native_version,
      bee.env:binary_runtime_commit]
    effect: allow
- name: application_open_facade_policy
  kind: security.policy.expr
  meta:
    comment: The explicitly admitted Agent Open facade may address the selected local workspace host; it cannot publish, activate or edit the registry.
  policy:
    expression: '((action == "process.registry.lookup" && resource matches "^bee[.]workspace[.]host/[0-9a-f]+$") || (action == "process.registry.register" && resource matches "^bee[.]app[.](open|presentation)/[0-9a-f-]+$") || (action == "process.registry.unregister" && resource matches "^bee[.]app[.](open|presentation)/[0-9a-f-]+$") || action == "process.send")'
    actions: [process.registry.lookup, process.registry.register, process.registry.unregister, process.send]
    resources: '*'
    effect: allow
- name: sync_distribution_policy
  kind: security.policy.expr
  meta:
    comment: Generic immutable feed delivery to connected non-client Hive members
  policy:
    expression: (resource != "bee.persist.env:startup_progress" && action != "env.set" && action != "env.get") || (action in ["env.get", "env.set"] && resource == "bee.persist.env:startup_progress")
    actions: [db.get, registry.get, system.read, hive.invoke, process.registry.lookup,
      process.listen, process.unlisten, process.send, env.set, env.get]
    resources: '*'
    effect: allow
