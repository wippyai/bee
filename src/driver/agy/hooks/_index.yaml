version: '1.0'
namespace: bee.driver.agy.hooks
entries:
- name: input
  kind: function.lua
  meta:
    comment: Reads an Agy hook's stdin as the Bee hook payload, taking a turn's prompt and answer from the conversation transcript the session's placement reads
  source: file://input.lua
  method: read
  modules: [funcs, json]
  imports:
    bounds: bee.drivers.values:bounds
  security:
    policies: [bee.driver.agy.hooks:transcript_read]
- name: transcript_read
  kind: security.policy
  policy:
    actions: [funcs.call]
    resources: [bee.placement.native.binding:hook_file]
    effect: allow
- name: reader_call
  kind: security.policy
  meta:
    comment: The hook endpoint calls the Agy hook input reader the Agy hook declaration names
  groups: [bee.gateway.api:hook_readers]
  policy:
    actions: [funcs.call]
    resources: [bee.driver.agy.hooks:input]
    effect: allow
