version: '1.0'
namespace: bee.tests.sessions
entries:
- name: interactive_test
  kind: function.lua
  source: file://interactive_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [funcs, security, sql, uuid]
  imports:
    test: wippy.test:test
    harness: bee.threads:harness
- name: executor_registry_test
  kind: function.lua
  source: file://executor_registry_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    registry: bee.sessions:executor_registry
- name: locate_test
  kind: function.lua
  source: file://locate_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    locate: bee.sessions.service:locate
- name: catalog_service_test_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call, registry.get, registry.snapshot]
    resources: '*'
    effect: allow
- name: catalog_service_test
  kind: function.lua
  source: file://catalog_service_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: '120s'}
  modules: [funcs, registry]
  security:
    policies: [bee.tests.sessions:catalog_service_test_policy, bee.harness.security:launch_locate_probe_policy]
  imports:
    test: wippy.test:test
    catalog: bee.sessions.service:catalog
    machine: bee.harness.carrier:machine
    materialization: bee.placement.native.service:materialization
- name: scheduler_test
  kind: function.lua
  source: file://scheduler_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    scheduler: bee.sessions.service:scheduler
    threads: bee.tests.fixtures.sessions:threads_owner
    executor: bee.tests.fixtures.sessions:fake_executor
- name: fake_owner
  kind: contract.binding
  meta: {type: test_support}
  contracts:
  - contract: bee.sessions:contract
    default: true
    methods:
      open: bee.tests.sessions:fake_open
      run: bee.tests.sessions:fake_run
      send: bee.tests.sessions:fake_send
      await: bee.tests.sessions:fake_await
      join: bee.tests.sessions:fake_join
      get: bee.tests.sessions:fake_get
      cancel: bee.tests.sessions:fake_cancel
      close: bee.tests.sessions:fake_close
      list: bee.tests.sessions:fake_list
      history: bee.tests.sessions:fake_history
- name: fake_catalog_owner
  kind: contract.binding
  meta: {type: test_support}
  contracts:
  - contract: bee.sessions:catalog
    default: true
    methods:
      list: bee.tests.sessions:fake_catalog
- name: fake_open
  kind: function.lua
  source: file://fake_owner.lua
  method: open
  meta: {type: test_support}
  modules: [security]
- name: fake_run
  kind: function.lua
  source: file://fake_owner.lua
  method: run
  meta: {type: test_support}
  modules: [security]
- name: fake_send
  kind: function.lua
  source: file://fake_owner.lua
  method: send
  meta: {type: test_support}
  modules: [security]
- name: fake_await
  kind: function.lua
  source: file://fake_owner.lua
  method: await
  meta: {type: test_support}
  modules: [security]
- name: fake_join
  kind: function.lua
  source: file://fake_owner.lua
  method: join
  meta: {type: test_support}
  modules: [security]
- name: fake_get
  kind: function.lua
  source: file://fake_owner.lua
  method: get
  meta: {type: test_support}
  modules: [security]
- name: fake_cancel
  kind: function.lua
  source: file://fake_owner.lua
  method: cancel
  meta: {type: test_support}
  modules: [security]
- name: fake_close
  kind: function.lua
  source: file://fake_owner.lua
  method: close
  meta: {type: test_support}
  modules: [security]
- name: fake_list
  kind: function.lua
  source: file://fake_owner.lua
  method: list
  meta: {type: test_support}
  modules: [security]
- name: fake_catalog
  kind: function.lua
  source: file://fake_owner.lua
  method: catalog
  meta: {type: test_support}
  modules: [security]
- name: probe
  kind: function.lua
  source: file://probe.lua
  method: run
  meta: {type: test_support}
  imports:
    sessions: bee.application:sessions
- name: probe_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: ['*']
    resources: ['*']
    effect: allow
- name: protocol_test
  kind: function.lua
  source: file://protocol_test.lua
  method: run
  meta: {type: test, suite: bee}
  imports:
    test: wippy.test:test
    protocol: bee.application:sessions_protocol
- name: client_test
  kind: function.lua
  source: file://client_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [funcs, security]
  imports:
    test: wippy.test:test
    sessions: bee.application:sessions
    protocol: bee.application:sessions_protocol
- name: wiring_test
  kind: function.lua
  source: file://wiring_test.lua
  method: run
  meta: {type: test, suite: bee}
  modules: [registry]
  imports:
    test: wippy.test:test
    journal: bee.sessions:threads_journal
  security:
    policies: [bee.tests.sessions:probe_policy]
- name: fake_history
  kind: function.lua
  source: file://fake_owner.lua
  method: history
  meta: {type: test_support}
  modules: [security]

- name: interactive_exited
  kind: function.lua
  source: file://interactive_placement.lua
  modules: [security]
  method: exited
  meta: {type: test_support}
- name: interactive_running
  kind: function.lua
  source: file://interactive_placement.lua
  modules: [security]
  method: running
  meta: {type: test_support}
- name: interactive_lifecycle_policy
  kind: security.policy
  meta: {type: test_support}
  policy:
    actions: [funcs.call, bee.sessions.attach]
    resources: ['*']
    effect: allow

- name: cancellation_owner_running
  kind: function.lua
  source: file://interactive_placement.lua
  method: owner_running
  modules: [security]
  meta: {type: test_support}
- name: cancellation_owner_stop
  kind: function.lua
  source: file://interactive_placement.lua
  method: owner_stop
  modules: [security]
  meta: {type: test_support}
- name: hook_boundary_probe
  kind: function.lua
  source: file://hook_boundary_probe.lua
  method: handle
  meta: {type: test_support}
  imports:
    boundary: bee.gateway.api:session_boundary
    bounds: bee.threads.records:bounds
    subject_call: bee.gateway.security:subject_call
  security:
    policies: [bee.gateway.security:execute_policy, bee.gateway.security:session_boundary_resolver_policy, bee.gateway.security:session_boundary_policy]
