version: '1.0'
namespace: bee.hive.service
entries:
- name: supervisor_host
  kind: process.host
  host: {max_processes: 1, workers: 1}
  lifecycle: {auto_start: true}
  meta:
    comment: Only the supervisor runs here; a sender PID on this host is this node's supervisor
- name: supervisor_service
  kind: process.service
  process: bee.hive.supervisor:main
  host: bee.hive.service:supervisor_host
  input:
  - configured_nodes: []
  lifecycle:
    auto_start: true
    security:
      actor: {id: bee.hive.supervisor}
      policies:
      - bee.security.hive:hive_supervisor_policy
      - bee.security.hive:hive_catalog_policy
      - bee.security.hive:hive_exposure_policy
      - bee.security.hive:hive_policy_exposure_policy
      - bee.security.hive:hive_dispatch_policy
      - bee.security.hive:hive_names_policy
      - bee.security.hive:hive_advertise_policy
      - bee.security.hive:hive_execute_policy
      - bee.security.hive:hive_invite_policy
      - bee.security.hive:hive_owner_stop_policy
      # Enrolled local clients' bee workspace commands run through their worker.
      - bee.security.hive:workspace_command_policy
      # The supervisor composes the retained desktop bridge, so it needs the
      # desktop host policy that authorizes desktop admission, and the bridge
      # reads the node's displays and one page of its workspace catalog.
      - bee.hive.desktop:host_policy
      - bee.security.desktop:desktop_catalog_policy
      - bee.security.desktop:desktop_catalog_resource_policy
      - bee.security.storage:workspace_catalog_read_policy
      - bee.hive.desktop:catalog_call_policy
  meta:
    comment: Default local Hive supervisor; a host overlay may replace input with admitted peer IDs and optional desktop configuration
- name: inbox_sender
  kind: library.lua
  source: file://inbox_sender.lua
  imports:
    hive: bee.hive:client
- name: replica_sender
  kind: library.lua
  source: file://replica_sender.lua
  modules: [hash, base64]
  imports:
    hive: bee.hive:client
    version: bee.sync:version
    transaction: bee.persist:transaction
    bounds: bee.sync:bounds
