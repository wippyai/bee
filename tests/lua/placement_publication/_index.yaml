version: '1.0'
namespace: bee.placement.publication.test
entries:
- name: homes
  kind: library.lua
  source: file://homes.lua
  meta: {type: test_support}
  imports:
    real: bee.placement.native.service:homes
- name: materialization
  kind: library.lua
  source: file://materialization.lua
  meta: {type: test_support}
  modules: [env, fs, funcs, sql, process, hash]
  imports:
    store: bee.placement.native.persist:store
    resources: bee.placement.native:resources
    homes: bee.placement.publication.test:homes
    workdir_preparers: bee.placement.native.service:workdir_preparers
    writable_roots_adapter: bee.placement.native.service:writable_roots_adapter
    bounds: bee.threads.records:bounds
    configuration: bee.placement.native:configuration
    provider_projection: bee.placement.native.service:provider_projection
    types: bee.placement:types
    paths: bee.placement:paths
    gateway_protocol: bee.gateway:protocol
    credential_protocol: bee.credentials:protocol
    service_reply: bee.protocol:reply
    formats: bee.credentials:formats
- name: runner_observation
  kind: library.lua
  source: file://runner_observation.lua
  meta: {type: test_support}
  imports:
    homes: bee.placement.publication.test:homes
- name: materialization_runner
  kind: library.lua
  source: file://../placement/materialization_runner.lua
  meta: {type: test_support}
  modules: [process, channel, security, time]
  imports:
    store: bee.placement.native.persist:store
    materialization: bee.placement.publication.test:materialization
    observe: bee.placement.publication.test:runner_observation
    types: bee.placement:types
- name: materialization_runner_process
  kind: process.lua
  source: file://../placement/materialization_runner.lua
  method: main
  meta: {type: test_support}
  modules: [process, channel, security, time]
  imports:
    store: bee.placement.native.persist:store
    materialization: bee.placement.publication.test:materialization
    observe: bee.placement.publication.test:runner_observation
    types: bee.placement:types
- name: required_file_test
  kind: function.lua
  source: file://required_file_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: '30s'}
  security:
    policies: [bee.placement.native.security:placement_store_policy]
  imports:
    test: wippy.test:test
    types: bee.placement:types
    driver_types: bee.driver:types
    materialization: bee.placement.publication.test:materialization
- name: publication_test
  kind: function.lua
  source: file://publication_test.lua
  method: run
  meta: {type: test, suite: bee, timeout: '30s'}
  modules: [process, time, json, security, sql]
  security:
    policies: [bee.placement.native.security:placement_store_policy, bee.placement.native.security:placement_service_policy, bee.placement.native:apply_test_policy]
  imports:
    test: wippy.test:test
    store: bee.placement.native.persist:store
    request: bee.placement:request
    types: bee.placement:types
    service: bee.placement.native.service:service
    runner_fixture: bee.placement.publication.test:materialization_runner
