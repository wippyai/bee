version: '1.0'
namespace: bee.placement
entries:
- name: definition
  kind: ns.definition
  module: placement
  readme: file://README.md
  meta:
    title: Bee placement
    comment: Placement contract and launch and attempt values; implementations own executors, homes and receipts
- name: types
  kind: library.lua
  source: file://types.lua
  imports:
    driver_types: bee.driver:types
- name: request
  kind: library.lua
  source: file://request.lua
  modules: [hash]
  imports:
    bounds: bee.threads.records:bounds
    canonical: bee.threads.records:canonical
    types: bee.placement:types
    driver_types: bee.driver:types
- name: transitions
  kind: library.lua
  source: file://transitions.lua
  imports:
    types: bee.placement:types
- name: placement
  kind: contract.definition
  meta:
    comment: One attempt per admitted launch; intent before creation, evidence for every transition, cleanup only after proven absence
  methods:
  - name: prepare
    description: Validate an admitted launch request against this placement and record intent; idempotent by key and digest
  - name: start
    description: Spawn the attempt runner, which materializes resources and starts the child; idempotent
  - name: status
    description: Recorded execution and cleanup state plus one separately labelled liveness observation
  - name: stop
    description: Cooperative or forced stop under the admitted grace; signal evidence is recorded, exit is proven separately
  - name: reconcile
    description: After a restart, prove the attempt gone or alive from evidence; keep uncertainty when it cannot be proven
  - name: cleanup
    description: Remove the attempt home once execution absence is proven; retained session state is untouched
  - name: evidence
    description: A bounded page of the attempt's transition evidence
  - name: attach
    description: Bind the recipient that receives output and may write input; advances the attachment generation
