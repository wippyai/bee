version: '1.0'
namespace: bee.harness.profiles.persist
entries:
- name: migration
  kind: library.lua
  source: file://migration.lua
  modules: [registry]
  imports:
    driver_profile: bee.drivers.profiles:profile
    bounds: bee.drivers.values:bounds
    protocol: bee.harness.profiles:protocol
- name: store
  kind: library.lua
  source: file://store.lua
  modules:
  - registry
  - sql
  - hash
  imports:
    bounds: bee.drivers.values:bounds
    canonical: bee.drivers.values:canonical
    sync: bee.sync.persist:store
    transaction: bee.persist:transaction
    protocol: bee.harness.profiles:protocol
    migration: bee.harness.profiles.persist:migration
    authority: bee.harness.profiles.persist:grants
    clock: bee.drivers.values:clock

- name: grants
  kind: library.lua
  source: file://grants.lua
  modules: [sql, security, ctx, funcs]
  imports:
    protocol: bee.harness.profiles:protocol
    profile_values: bee.drivers.descriptor:profile_values
    profile_grants: bee.harness.profiles:grants
    grants: bee.approvals.grants:store
    bounds: bee.drivers.values:bounds
    canonical: bee.drivers.values:canonical
    clock: bee.drivers.values:clock
- name: grant_policy
  kind: registry.entry
  meta: {type: bee.approvals.grant-policy, domain: profile_choices, allow_permanent: true}
