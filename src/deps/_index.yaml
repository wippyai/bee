version: '1.0'
namespace: bee.deps
entries:
- name: persist
  kind: ns.dependency
  component: bee/persist
  version: 0.1.0-dev
- name: workspace
  kind: ns.dependency
  component: bee/workspace
  version: 0.1.0-dev
  parameters:
