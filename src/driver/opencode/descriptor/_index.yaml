version: '1.0'
namespace: bee.driver.opencode.descriptor
entries:
- name: command
  kind: registry.entry
  meta:
    type: bee.app_command
    comment: CLI command to launch OpenCode in the agent window
  data:
    name: opencode
    definition_id: bee.harness.app:app
    arguments:
    - bee.driver.opencode.profiles:default_window
    fullscreen: true
- name: hooks
  kind: registry.entry
  meta:
    type: bee.driver_hooks
    driver_id: opencode
  data:
    unsupported: OpenCode observes tool events after execution; its permission transport does not provide these synchronous hook points.
