version: '1.0'
namespace: bee.host_policy_test
entries:
- name: fixture_broad_host_policy
  kind: security.policy
  meta:
    type: test_support
    suite: bee
  policy:
    actions:
    - process.host
    resources: '*'
    effect: allow

- name: fixture_broad_spawn_policy
  kind: security.policy
  meta:
    type: test_support
    suite: bee
  policy:
    actions:
    - process.spawn
    - process.spawn.monitored
    - process.spawn.linked
    - process.exec
    resources: '*'
    effect: allow

- name: can_probe
  kind: function.lua
  source: file://can_probe.lua
  method: handle
  meta:
    type: test_support
    suite: bee
  modules: [security]

- name: host_policy_test
  kind: function.lua
  source: file://host_policy_test.lua
  method: run
  meta:
    type: test
    suite: bee
  modules: [funcs, security]
  imports:
    test: wippy.test:test
