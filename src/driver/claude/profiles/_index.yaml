version: '1.0'
namespace: bee.driver.claude.profiles
entries:
- name: default_window
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned Claude Code window declaration; the host separately selects its policy, activation, executable and permissions
  data:
    schema_revision: bee.launch-definition@1
    launch_id: claude-window
    title: Claude Code
    binding_ref: bee.drivers.claude.binding:binding
    profile_id: window
    private_credentials:
    - claude_api_key
    - claude_login
    docker_credentials:
    - claude_api_key
    - claude_login
    policy_ref: bee.driver.claude.security:launch_policy_claude_window
    default_mode: window
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: new
    session_resource: session
    credentials:
    - claude_api_key
    presentation:
      start_menu: true
      fullscreen: true
      reuse: never
- name: research_batch
  kind: registry.entry
  meta:
    type: bee.launch_definition
    comment: Component-owned bounded Claude batch route for a host-selected coordinator and caller-owned shared thread
  data:
    schema_revision: bee.launch-definition@1
    launch_id: claude-research-batch
    title: Claude researcher
    binding_ref: bee.drivers.claude.binding:binding
    profile_id: batch
    policy_ref: bee.driver.claude.security:launch_policy_claude_batch
    default_mode: batch
    allowed_overrides:
    - thread
    - workdir
    workdir_policy:
      kind: declared_resource
      resource_ref: project
    thread_policy:
      kind: caller
    session_resource: session
    credentials:
    - claude_api_key
    - claude_login
    presentation:
      start_menu: false
      fullscreen: false
      reuse: never
